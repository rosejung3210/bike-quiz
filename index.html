<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이륜차 부품 명칭 학습 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7FA; --card:#FFFFFF; --line:#E3E6EC;
  --ink:#23262B; --dim:#7B828D;
  --accent:#5B5BD6; --accent-soft:#EDEDFB;
  --green:#1F9D5B; --green-bg:#E7F6EE;
  --red:#D64545; --red-bg:#FCEDED;
  --amber:#B98300; --amber-bg:#FBF3DA;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100vh;}
.wrap{max-width:960px;margin:0 auto;padding:22px 14px 60px;}

header{text-align:center;margin-bottom:18px;}
header h1{font-size:clamp(20px,4.5vw,28px);font-weight:700;letter-spacing:-0.5px;}
header h1 span{color:var(--accent);}
header p{color:var(--dim);font-size:13px;margin-top:5px;}

.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
.tab{background:var(--card);border:1.5px solid var(--line);border-radius:10px;
  color:var(--ink);padding:11px 20px;cursor:pointer;
  font-family:inherit;font-size:14.5px;font-weight:700;transition:all .15s;
  box-shadow:0 1px 2px rgba(20,24,40,.05);}
.tab small{display:block;font-size:10.5px;font-weight:500;color:var(--dim);margin-top:2px;}
.tab:hover{border-color:#C6C9F0;}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(91,91,214,.35);}
.tab.on small{color:#DEDEFA;}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:0 2px 10px rgba(20,24,40,.05);}
.stagehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;flex-wrap:wrap;gap:6px;}
.stagehead .t{font-weight:700;font-size:15px;}
.stagehead .m{font-size:11.5px;color:var(--dim);}

.stage{position:relative;width:100%;container-type:inline-size;
  border-radius:8px;overflow:hidden;background:#fff;border:1px solid var(--line);}
.stage img{display:block;width:100%;height:auto;pointer-events:none;}

.blank{position:absolute;border:1.5px solid transparent;border-radius:5px;
  background:transparent;color:var(--ink);
  font-family:inherit;font-weight:700;text-align:center;
  font-size:clamp(9px,2.0cqw,15px);padding:0 2px;outline:none;
  transition:border-color .12s, box-shadow .12s, background .12s;}
.blank::placeholder{color:#B4B9C2;font-weight:500;}
.blank:hover{background:transparent;}
.blank:focus{background:transparent;box-shadow:none;border-color:transparent;caret-color:var(--accent);}
.blank.ok{border-color:transparent;background:transparent;color:var(--green);font-weight:700;}
.blank.no{border-color:transparent;background:transparent;color:var(--red);font-weight:700;}
.blank.reveal{border-color:transparent;background:transparent;color:var(--amber);font-weight:700;}


.controls{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.btn{font-family:inherit;font-size:14px;font-weight:700;
  border:none;border-radius:9px;padding:12px 18px;cursor:pointer;transition:all .15s;}
.btn.primary{background:var(--accent);color:#fff;flex:1;min-width:130px;box-shadow:0 3px 10px rgba(91,91,214,.3);}
.btn.primary:hover{background:#4A4AC4;}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line);}
.btn.ghost:hover{border-color:#B9BEC9;}
.btn.ghost.active{border-color:var(--amber);color:var(--amber);background:var(--amber-bg);}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.scorebar{margin-top:16px;background:#FAFAFD;border:1px solid var(--line);
  border-radius:11px;padding:14px 16px;}
.scorehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
.scorehead .lbl{font-size:11px;letter-spacing:1.5px;color:var(--dim);font-weight:700;}
.scorehead .num{font-size:22px;font-weight:700;}
.scorehead .num b{color:var(--accent);}
.track{position:relative;height:12px;border-radius:6px;background:#E8EAF0;overflow:visible;}
.fill{height:100%;width:0%;border-radius:6px;background:linear-gradient(90deg,#8A8AE8,var(--accent));transition:width .5s cubic-bezier(.2,.8,.2,1);}
.fill.pass{background:linear-gradient(90deg,#4CC488,var(--green));}
.passmark{position:absolute;top:-4px;bottom:-4px;left:60%;width:2px;background:var(--amber);}
.passmark::after{content:'합격선 60%';position:absolute;top:-16px;left:50%;transform:translateX(-50%);
  font-size:9.5px;color:var(--amber);white-space:nowrap;font-weight:700;}
.msg{margin-top:10px;font-size:13px;color:var(--dim);min-height:18px;}
.msg.good{color:var(--green);font-weight:700;}
.msg.warn{color:var(--amber);font-weight:600;}

.legend{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--dim);flex-wrap:wrap;}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1.5px solid;}
.legend .g i{display:none;}
.legend .r i{display:none;}
.legend .y i{display:none;}

footer{margin-top:24px;text-align:center;font-size:11.5px;color:#9AA0AA;line-height:1.8;}

@media (max-width:560px){
  .btn.primary{width:100%;}
  .tab{padding:9px 14px;font-size:13.5px;}
}
@media (prefers-reduced-motion:reduce){
  .fill{transition:none;}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>이륜차 부품 <span>명칭 학습 퀴즈</span></h1>
  <p>이륜자동차정비기능사 대비 · 화살표가 가리키는 부품의 명칭을 빈칸 박스에 입력하세요</p>

const ORDER = ["panel","front","side","full"];
const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
const state = {};   // key -> {hintOn}

function norm(s){
  return (s||"").normalize('NFC').toLowerCase()
    .replace(/패달/g,"페달")
    .replace(/스탭/g,"스텝")
    .replace(/캐리퍼/g,"캘리퍼")
    .replace(/[^0-9a-z가-힣]/g,"");
}

/* 값이 칸보다 길면 글자 크기를 줄여 전부 보이게 */
function fitText(inp){
  inp.style.fontSize='';
  if(!inp.value) return;
  let fs = parseFloat(getComputedStyle(inp).fontSize);
  let guard = 30;
  while(inp.scrollWidth > inp.clientWidth + 1 && fs > 6 && guard-- > 0){
    fs -= 0.5;
    inp.style.fontSize = fs + 'px';
  }
}
let fitTimer=null;
window.addEventListener('resize',()=>{
  clearTimeout(fitTimer);
  fitTimer=setTimeout(()=>{
    document.querySelectorAll('.blank').forEach(b=>{ if(b.readOnly) fitText(b); });
  },150);
});

/* 탭 생성 */
ORDER.forEach(key=>{
  const d = DATA[key];
  const b = document.createElement('button');
  b.className='tab'; b.dataset.key=key;
  b.innerHTML = `${d.title}<small><span data-done="${key}">0</span> / ${d.q.length} 문항</small>`;
  b.addEventListener('click',()=>switchTab(key));
  tabsEl.appendChild(b);
});

/* 이미지별 패널 생성 (각각 버튼 + 점수판 포함) */
ORDER.forEach(key=>{
  const d = DATA[key];
  state[key] = {focused:null};

  const card = document.createElement('section');
  card.className='card'; card.dataset.key=key; card.style.display='none';

  const head = document.createElement('div');
  head.className='stagehead';
  head.innerHTML = `<div class="t">${d.title}</div><div class="m">${d.model?('모델: '+d.model):''}</div>`;
  card.appendChild(head);

  const stage = document.createElement('div');
  stage.className='stage';
  const img = document.createElement('img');
  img.src=d.src; img.alt=d.title+' 이륜차 이미지';
  stage.appendChild(img);

  /* 고정 안내 텍스트 (예: '반대편 :') */
  (d.texts||[]).forEach(tx=>{
    const s=document.createElement('div');
    s.textContent=tx.text;
    s.style.cssText=`position:absolute;left:${tx.l}%;top:${tx.t}%;width:${tx.w}%;height:${tx.h}%;`+
      'display:flex;align-items:center;justify-content:flex-end;padding-right:0.35em;'+
      'color:#3A3F46;font-weight:700;font-size:clamp(9px,2.0cqw,15px);pointer-events:none;';
    stage.appendChild(s);
  });

  d.q.forEach((q,i)=>{
    const inp=document.createElement('input');
    inp.className='blank'; inp.type='text';
    inp.autocomplete='off'; inp.spellcheck=false;
    inp.dataset.idx=i; inp.placeholder='입력';
    inp.setAttribute('aria-label',(i+1)+'번 빈칸');
    inp.style.left=q.l+'%'; inp.style.top=q.t+'%';
    inp.style.width=q.w+'%'; inp.style.height=q.h+'%';
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter'){
        e.preventDefault();
        const nx=[...stage.querySelectorAll('.blank')].filter(x=>!x.readOnly);
        const p=nx.indexOf(inp);
        if(p>-1&&p<nx.length-1) nx[p+1].focus();
      }
    });
    inp.addEventListener('input',()=>{inp.classList.remove('no');fitText(inp);});
    inp.addEventListener('focus',()=>{state[key].focused=inp;});
    stage.appendChild(inp);
  });
  card.appendChild(stage);

  const ctrl = document.createElement('div');
  ctrl.className='controls';
  ctrl.innerHTML = `
    <button class="btn primary" data-act="grade">채점하기</button>
    <button class="btn ghost" data-act="hint">힌트 보기</button>
    <button class="btn ghost" data-act="reveal">정답 보기</button>
    <button class="btn ghost" data-act="reset">다시 풀기</button>`;
  card.appendChild(ctrl);

  const sb = document.createElement('div');
  sb.className='scorebar';
  sb.innerHTML = `
    <div class="scorehead">
      <span class="lbl">SCORE</span>
      <span class="num"><b data-num>0</b> / <span data-total>${d.q.length}</span></span>
    </div>
    <div class="track"><div class="fill" data-fill></div><div class="passmark"></div></div>
    <div class="msg" data-msg>빈칸을 채운 뒤 채점하기를 누르세요. Enter 키로 다음 칸으로 이동합니다.</div>`;
  card.appendChild(sb);

  const lg = document.createElement('div');
  lg.className='legend';
  lg.innerHTML = `<span class="g" style="color:var(--green);font-weight:700;">초록 글씨 = 정답</span>
    <span class="r" style="color:var(--red);font-weight:700;">빨간 글씨 = 틀린 칸의 정답</span>
    <span class="y" style="color:var(--amber);font-weight:700;">노란 글씨 = 정답 보기로 확인 (점수 미포함)</span>`;
  card.appendChild(lg);

  ctrl.addEventListener('click',e=>{
    const act = e.target.dataset && e.target.dataset.act;
    if(!act) return;
    if(act==='grade') grade(key);
    else if(act==='hint') hintOne(key);
    else if(act==='reveal') reveal(key);
    else if(act==='reset') reset(key);
  });

  panelsEl.appendChild(card);
});

function panelOf(k){return panelsEl.querySelector(`.card[data-key="${k}"]`);}
function setMsg(key,t,c){
  const m=panelOf(key).querySelector('[data-msg]');
  m.textContent=t; m.className='msg'+(c?' '+c:'');
}
function counts(key){
  let ok=0,reveal=0;
  panelOf(key).querySelectorAll('.blank').forEach(b=>{
    if(b.classList.contains('ok'))ok++;
    if(b.classList.contains('reveal'))reveal++;
  });
  return {ok,reveal,total:DATA[key].q.length};
}
function updateScore(key){
  const p=panelOf(key), c=counts(key);
  p.querySelector('[data-num]').textContent=c.ok;
  const pct=c.total?c.ok/c.total*100:0;
  const f=p.querySelector('[data-fill]');
  f.style.width=pct+'%';
  f.classList.toggle('pass',pct>=60);
  document.querySelector(`[data-done="${key}"]`).textContent=c.ok;
}

function grade(key){
  const p=panelOf(key), qs=DATA[key].q;
  let wrong=0,empty=0;
  p.querySelectorAll('.blank').forEach(b=>{
    if(b.classList.contains('reveal'))return;
    const q=qs[+b.dataset.idx], v=norm(b.value);
    if(v && q.a.some(a=>norm(a)===v)){
      b.classList.remove('no');b.classList.add('ok');
      b.value=q.d||q.a[0];b.readOnly=true;fitText(b);
    }else{
      if(!v) empty++; else wrong++;
      b.classList.remove('ok');b.classList.add('no');
      b.value=q.d||q.a[0];b.readOnly=true;b.placeholder='';fitText(b);
    }
  });
  const c=counts(key);
  updateScore(key);
  const pct=Math.round(c.ok/c.total*100);
  if(wrong===0&&empty===0&&c.reveal===0){
    setMsg(key,`전 문항 정답! 정답률 ${pct}% — 이 이미지는 완전 정복입니다.`,'good');
  }else if(pct>=60){
    setMsg(key,`정답 ${c.ok}개(초록) · 오답/미입력 ${wrong+empty}개(빨간 글씨가 정답) · 정답률 ${pct}% — 합격선을 넘었습니다.`,'good');
  }else{
    setMsg(key,`정답 ${c.ok}개(초록) · 오답/미입력 ${wrong+empty}개(빨간 글씨가 정답) · 정답률 ${pct}% — 다시 풀기로 재도전해 보세요.`,'warn');
  }
}

function hintOne(key){
  const inp = state[key].focused;
  if(!inp || inp.readOnly){
    setMsg(key,'힌트를 볼 빈칸을 먼저 클릭(선택)한 뒤 힌트 보기를 누르세요.','warn');
    return;
  }
  const a = DATA[key].q[+inp.dataset.idx].a[0];
  inp.placeholder = a.charAt(0)+'·'.repeat(Math.max(a.length-1,1));
  inp.focus();
  setMsg(key,'선택한 빈칸에 첫 글자 힌트를 표시했습니다.','');
}
function clearHints(key){
  panelOf(key).querySelectorAll('.blank').forEach(b=>b.placeholder='입력');
  state[key].focused=null;
}

function reveal(key){
  const p=panelOf(key), qs=DATA[key].q;
  let n=0;
  p.querySelectorAll('.blank').forEach(b=>{
    if(b.classList.contains('ok'))return;
    const qq=qs[+b.dataset.idx];
    b.value=qq.d||qq.a[0];
    b.classList.remove('no');b.classList.add('reveal');
    b.readOnly=true;fitText(b);n++;
  });
  updateScore(key);
  if(n>0)setMsg(key,'노란 칸은 정답 보기로 확인한 문항입니다. 점수에 포함되지 않으니, 다시 풀기로 재도전해 보세요.','warn');
}

function reset(key){
  panelOf(key).querySelectorAll('.blank').forEach(b=>{
    b.value='';b.readOnly=false;b.style.fontSize='';
    b.classList.remove('ok','no','reveal');
  });
  clearHints(key);updateScore(key);
  setMsg(key,'초기화했습니다. 처음부터 다시 도전해 보세요.','');
}

function switchTab(key){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.key===key));
  panelsEl.querySelectorAll('.card').forEach(c=>c.style.display=c.dataset.key===key?'block':'none');
}
switchTab('panel');
</script>
</body>
</html>
