<!DOCTYPE html>
<html lang="ko">
<head>

<title>장미정교수와 함께하는 이륜자동차 정비 문제 풀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* 답안지(OMR) 한 장을 옮겨 놓은 화면. 왼쪽 정렬, 한 번에 한 문제, 아래에 답안 표기란. */
:root{
  --paper:#eef1f6; --surface:#ffffff; --ink:#16233b; --muted:#5d6a80; --line:#cfd6e2;
  --accent:#1f4fbf; --accent-ink:#ffffff; --accent-soft:#e3ebfb;
  --sky:#5cc8f5; --ok:#0f7a4b; --ok-soft:#e1f3ea; --bad:#c22a2a; --bad-soft:#fbe6e4;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101622; --surface:#1a2233; --ink:#e8edf6; --muted:#9aa7bd; --line:#34405a;
    --accent:#7da4ff; --accent-ink:#0d1526; --accent-soft:#22304f;
    --sky:#2b7fb0; --ok:#5fd09a; --ok-soft:#163427; --bad:#ff8a80; --bad-soft:#3d1f1f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101622; --surface:#1a2233; --ink:#e8edf6; --muted:#9aa7bd; --line:#34405a;
  --accent:#7da4ff; --accent-ink:#0d1526; --accent-soft:#22304f;
  --sky:#2b7fb0; --ok:#5fd09a; --ok-soft:#163427; --bad:#ff8a80; --bad-soft:#3d1f1f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header.top{border-bottom:2px solid var(--ink);padding:22px 16px 14px 22px;margin:14px 0 20px;background:linear-gradient(135deg,var(--sky) 0 30px,transparent 30px),linear-gradient(315deg,var(--sky) 0 46px,transparent 46px),var(--surface);border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header.top h1,.lead,.part .nm{word-break:keep-all;overflow-wrap:anywhere}
header.top h1{font-size:24px;line-height:1.25;margin:0;font-weight:700;color:var(--accent);text-wrap:balance}
header.top h1 .who{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}
.yt{display:inline-flex;align-items:center;gap:10px;margin:8px 0 6px;padding:7px 14px 7px 9px;font-size:14.5px;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.me{flex:none;width:132px;height:165px;border-radius:14px;object-fit:cover;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);margin:0 34px 0 auto;align-self:center;order:2}
header.top>div{flex:1 1 300px;min-width:0}
header.top .home{order:3}
@media (max-width:560px){header.top{position:relative}.me{position:absolute;top:16px;right:14px;width:84px;height:105px;margin:0;border-radius:10px}header.top h1{padding-right:96px;min-height:94px}header.top>div{flex:1 1 100%}}
.yt-t b{word-break:keep-all}
.links{display:flex;flex-direction:row;align-items:stretch;gap:8px;margin:8px 0 6px;width:100%;max-width:540px}.links .yt{display:flex;flex:1 1 0;min-width:0;box-sizing:border-box}.links .yt b{line-height:1.3}@media (max-width:560px){.links{flex-direction:column;max-width:none}.links .yt b br{display:none}}
.links .yt{margin:0}
.nv-mark{flex:none;width:34px;height:24px;border-radius:7px;background:#03c75a;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif}
.yt-t{display:flex;flex-direction:column;line-height:1.3}
.yt-t small{font-size:13.5px;color:var(--muted)}.yt-t b{font-size:17px}
.yt:hover,.yt:active{border-color:var(--bad)}
.yt b{font-weight:600}
.yt-mark{flex:none;width:34px;height:24px;border-radius:7px;background:#e62117;position:relative}
.yt-mark::after{content:"";position:absolute;left:13px;top:6px;border-left:11px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}

.home{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;color:var(--muted)}
h2{font-size:15px;margin:26px 0 10px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;border-top:1px solid var(--line)}
.lead{margin:0 0 6px;color:var(--muted);font-size:15px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.part{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:86px}
.part:hover{border-color:var(--accent)}
.part .nm{font-weight:600;font-size:16px;line-height:1.35}
.part .meta{font-family:var(--num);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:auto}
.part .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.part .bar i{display:block;height:100%;background:var(--accent)}
.part.all{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.part.all .meta{color:inherit;opacity:.85}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.status b{color:var(--ink);font-weight:600}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
.tts{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.ttsb{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:500}
.ttsb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px}
.qno{font-family:var(--num);font-size:14px;color:var(--accent);font-weight:600;margin-bottom:6px}
.stem{font-size:19px;font-weight:600;line-height:1.55;margin:0 0 14px;word-break:keep-all;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 14px;font-size:16px;background:var(--paper)}
.box p{margin:2px 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 12px;font-size:17px;line-height:1.5;width:100%;word-break:keep-all;overflow-wrap:anywhere}
.opt .mk{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--num);font-size:14px;font-weight:600;margin-top:-1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav{display:flex;gap:10px;margin:14px 0 4px}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:8px;padding:12px 16px;font-weight:600;font-size:16px;flex:1}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line);color:var(--muted);font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.omr{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:8px}
.omr button{font-family:var(--num);font-size:14px;height:38px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);padding:0}
.omr button.done{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.omr button.cur{outline:3px solid var(--accent);outline-offset:1px}
.omr button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.omr button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.notice{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:15px}
.notice .nav{margin:10px 0 0}
.score{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--bad);border-radius:10px;padding:18px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score.pass{border-left-color:var(--ok)}
.score .big{font-family:var(--num);font-size:52px;font-weight:600;line-height:1}
.score .big small{font-size:18px;color:var(--muted);font-weight:500}
.verdict{font-size:22px;font-weight:700;color:var(--bad)}
.score.pass .verdict{color:var(--ok)}
.score .det{font-size:14px;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0 0}
.actions .btn{flex:none}
.tabs{display:flex;gap:8px;margin:0 0 10px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.fb{display:inline-block;margin-top:10px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:14px;color:var(--muted);text-decoration:none;background:var(--surface);cursor:pointer;font-family:inherit}.fb:hover{color:var(--accent);border-color:var(--accent)}.fb:disabled{cursor:default;color:var(--ok);border-color:var(--ok)}.fbbox{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.fbnote{margin:0 0 8px;font-size:14px;color:var(--muted)}.fbta{display:block;width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;line-height:1.5;resize:vertical;background:var(--paper);color:var(--ink)}.fbta:focus{outline:2px solid var(--accent);outline-offset:1px}.fbrow{display:flex;gap:8px;margin-top:10px}.fbmsg{margin:10px 0 0;font-size:15px}.fbmsg.ok{color:var(--ok)}.fbmsg.bad{color:var(--bad)}
.gate h2{margin:0 0 8px}.rev.gate ol.gsteps{margin:10px 0 14px;padding-left:24px;list-style:decimal}.rev.gate ol.gsteps li{display:list-item;list-style:decimal;margin:2px 0;padding:0;border:0;background:none}.gbtn{display:inline-block;text-decoration:none;text-align:center}.grow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.grow input{flex:1;min-width:150px;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink)}.gmsg{color:var(--bad);min-height:1.2em;margin:8px 0 0}.gnote{color:var(--muted);font-size:13px;margin:4px 0 0}
.ubox b,.trial b{display:block;margin-bottom:4px}.trial{border-color:var(--accent)}.rtab{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}.rtab th,.rtab td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}.rtab th{color:var(--muted);font-weight:600}.wlist{list-style:none;margin:10px 0 0;padding:0}.rev .wlist li{display:block;padding:8px 0;border-bottom:1px solid var(--line);border-radius:0}.wlist .wq{display:block}.wlist .wc{display:block;color:var(--bad);font-size:13px;margin-top:2px}
#app.locked>*:not(.gatewrap){filter:blur(3px);opacity:.6;pointer-events:none;user-select:none}.gatewrap{position:fixed;inset:0;z-index:60;overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:70px 14px 24px;background:rgba(20,30,50,.28)}.gatebox{width:100%;max-width:460px}.gatebox .rev{box-shadow:0 10px 30px rgba(0,0,0,.18)}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px}
.rev .tag{font-size:12.5px;font-weight:700;border-radius:4px;padding:2px 8px;margin-left:8px}
.rev .tag.ok{background:var(--ok-soft);color:var(--ok)} .rev .tag.no{background:var(--bad-soft);color:var(--bad)}
.rev .stem{font-size:17px;margin-bottom:10px}
.rev ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rev li{display:flex;gap:10px;padding:6px 8px;border-radius:6px;font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.rev li .mk{font-family:var(--num);flex:none;width:1.4em}
.rev li.ans{background:var(--ok-soft);color:var(--ok);font-weight:600}
.rev li.mine{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.exp{margin-top:10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;padding:8px 12px;font-size:15.5px;line-height:1.6}
.exp.wrong{border-left-color:var(--bad);background:var(--bad-soft)}
.exp.wrong b{color:var(--bad)}
.exp.wrong .mk{font-family:var(--num);font-weight:600}
.exp b{font-size:13.5px;color:var(--accent);letter-spacing:.04em}
.exp p{margin:2px 0 0;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.key{margin:8px 0 2px;padding:8px 10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}.key b{display:block;color:var(--accent);margin-bottom:2px}.key ul{margin:0;padding-left:20px;list-style:disc}.key li{margin:0;font-weight:400;line-height:1.55;list-style:disc}
.fig.photo img{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;border-radius:6px}.fig.photo a{color:var(--muted);font-size:12px}
.fig{margin:8px 0 2px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.fig svg{display:block;width:100%;max-width:340px;height:auto;margin:0 auto;color:var(--ink);font-family:var(--body)}
.fig figcaption{font-size:12.5px;color:var(--muted);text-align:center;margin-top:4px;white-space:pre-line;font-weight:400;letter-spacing:0}
.rev li .lab{margin-left:auto;flex:none;font-size:12.5px;font-weight:700;text-decoration:none;padding-left:8px}
footer{margin-top:28px;font-size:13px;color:var(--muted)}footer .copy{margin:8px 0 0;padding-top:8px;border-top:1px solid var(--line);color:var(--ink);font-weight:600}
@media (max-width:420px){.stem{font-size:18px}.omr button{height:36px;font-size:13px}.score .big{font-size:44px}}
@media (prefers-reduced-motion:no-preference){.opt,.part{transition:border-color .12s,background .12s}}

.fbrow[hidden],.fbta[hidden],.fbbox[hidden],.fbmsg[hidden]{display:none}
body{-webkit-user-select:none;-moz-user-select:none;user-select:none;-webkit-touch-callout:none}input,textarea{-webkit-user-select:text;-moz-user-select:text;user-select:text}img,svg{-webkit-user-drag:none;user-drag:none}

.gshot{margin:14px 0 4px}.gshot svg{display:block;width:100%;max-width:320px;height:auto}.gshot figcaption{font-size:13px;color:var(--muted);margin-top:4px}.gfile{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.gup,.gin{display:block;width:100%;box-sizing:border-box;margin-top:12px;cursor:pointer}.gup.busy{opacity:.6;pointer-events:none}.gfile:focus+.gup{outline:2px solid var(--accent);outline-offset:2px}.gin:disabled{opacity:.45;cursor:default}.gmsg.good{color:var(--ok);font-weight:600}.gres{list-style:none;margin:8px 0 0;padding:0}.rev.gate ul.gres li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.rev.gate ul.gres li.ok b{color:var(--ok)}.rev.gate ul.gres li.no b{color:var(--bad)}.gres[hidden],.galt[hidden]{display:none}.glink{border:0;background:none;padding:0;font:inherit;color:var(--accent);text-decoration:underline;cursor:pointer}
</style>

<script id="bank" type="application/json">[{"g":"엔진","name":"엔진정비","id":"p00","qs":[{"q":"실린더의 연소실 체적이 25cc, 행정 체적이 125cc인 기관의 압축비는?","o":["5 : 1","6 : 1","7 : 1","8 : 1"],"a":1,"e":{"w":["5 : 1은 행정 체적만 연소실 체적으로 나눈 값(125 ÷ 25)입니다. 연소실 체적을 더하지 않았습니다.","7 : 1은 계산 결과와 맞지 않습니다.","8 : 1은 계산 결과와 맞지 않습니다."],"d":"압축비는 피스톤이 하사점에 있을 때의 실린더 전체 체적을, 상사점에 있을 때 남는 연소실 체적으로 나눈 값입니다.\n전체 체적 = 연소실 체적 + 행정 체적 = 25 + 125 = 150cc\n압축비 = 150 ÷ 25 = 6 이므로 6 : 1입니다.\n행정 체적만 나눈 125 ÷ 25 = 5는 자주 나오는 함정입니다.","k":["압축비 = (연소실 체적 + 행정 체적) ÷ 연소실 체적","행정 체적 = 피스톤이 상사점에서 하사점까지 밀어내는 체적","연소실 체적 = 피스톤이 상사점에 있을 때 남는 공간"],"g":"comp"}},{"q":"실린더의 지름이 50mm, 행정이 55mm인 1기통 기관의 배기량은?","o":["106.9cc","107.9cc","108.9cc","109.9cc"],"a":1,"e":{"w":["106.9cc는 계산 결과보다 1cc 작습니다.","108.9cc는 계산 결과보다 1cc 큽니다.","109.9cc는 계산 결과보다 2cc 큽니다."],"d":"배기량(행정 체적)은 원기둥의 부피와 같아서, 실린더 단면적에 행정을 곱해 구합니다.\ncc(cm³)로 구하려면 mm를 cm로 먼저 바꿉니다. 50mm = 5cm, 55mm = 5.5cm\n배기량 = π/4 × D² × L = 0.785 × 5² × 5.5 = 0.785 × 25 × 5.5 ≒ 107.9cc\n1기통이므로 이 값이 그대로 총배기량입니다.","k":["배기량 = π/4 × 보어² × 행정 (π/4 ≒ 0.785)","단위를 cm로 바꿔 계산해야 cc가 나온다","총배기량 = 1기통 배기량 × 실린더 수"],"g":"bore"}},{"q":"지시마력이 15PS이고, 제동마력이 12PS일 때 기계효율은?","o":["60%","70%","80%","90%"],"a":2,"e":{"w":["60%는 계산 결과가 아닙니다. 12 ÷ 15 = 0.8입니다.","70%는 계산 결과가 아닙니다.","90%는 계산 결과가 아닙니다."],"d":"지시마력은 실린더 안의 연소 압력으로 생긴 출력이고, 제동마력은 마찰과 부속 장치 손실을 빼고 크랭크축에서 실제로 얻는 출력입니다.\n기계효율은 발생한 출력 가운데 실제로 쓸 수 있는 출력의 비율입니다.\n기계효율 = 제동마력 ÷ 지시마력 × 100 = 12 ÷ 15 × 100 = 80%\n손실마력은 15 − 12 = 3PS입니다.","k":["기계효율 = 실제 출력 ÷ 발생 출력 × 100","제동마력은 크랭크축에서 측정되는 실제 출력","손실마력 = 지시마력 − 제동마력","기계효율은 마찰 때문에 항상 100% 미만임"],"g":"meff"}},{"q":"실린더 헤드 볼트를 조일 때 회전력을 측정하기 위해 사용되는 공구는?","o":["토크렌치","오픈 엔드 렌치","복스 렌치","소켓 렌치"],"a":0,"e":{"w":["오픈 엔드 렌치는 볼트를 돌리기만 하고 회전력을 알 수 없습니다.","복스 렌치도 회전력을 알 수 없습니다.","소켓 렌치도 회전력을 알 수 없습니다."],"d":"토크렌치는 볼트나 너트를 조일 때 가해지는 회전력(토크)을 측정하며 체결하는 정밀 측정 공구입니다.\n부족한 조임은 가스/오일 누설을, 과도한 조임은 볼트 파손 및 헤드 변형을 유발하므로 규정 토크 준수가 필수입니다.","k":["규정 토크 확인 = 토크렌치 사용","실린더 헤드 = 순서와 단계별 조임","약하게 조임 = 누설 / 강하게 조임 = 변형"],"g":"torq","p":["torque"]}},{"q":"실린더 블록이나 헤드의 평면도 측정에 알맞은 게이지는?","o":["마이크로미터","다이얼 게이지","버니어 캘리퍼스","직각자와 필러게이지"],"a":3,"e":{"w":["마이크로미터는 바깥지름이나 두께 같은 치수를 잽니다.","다이얼 게이지는 축의 휨이나 흔들림을 잽니다.","버니어 캘리퍼스는 길이, 안지름, 바깥지름을 잽니다."],"d":"평면도는 접합면이 얼마나 평평한지를 나타내는 지표입니다. 실린더 헤드와 블록의 접합면이 휘면 개스킷이 고르게 눌리지 않아 틈이 생깁니다.\n정밀한 곧은 자(직각자)를 접합면에 대고, 생긴 틈에 다양한 두께의 필러게이지를 넣어 들어가는 최대 두께로 변형 정도를 판단합니다.\n측정 전 이물질을 제거하고 세로, 가로, 두 대각선 방향을 모두 측정해야 합니다. 규정값 초과 시 가스·오일·냉각수 누설의 원인이 됩니다.","k":["평면도 측정 = 곧은 자(직각자) + 필러게이지","세로, 가로, 대각선 등 여러 방향에서 정밀 측정","틈에 들어가는 게이지 두께가 곧 휨(변형) 정도","휨 발생 시 가스, 오일, 냉각수 누설의 직접적 원인"],"g":"flat","p":["feeler"]}},{"q":"4행정 기관에서 크랭크축이 1,000rpm일 때 캠축은 몇 rpm인가?","o":["500rpm","1,000rpm","1,500rpm","2,000rpm"],"a":0,"e":{"w":["1,000rpm은 크랭크축과 같은 회전수입니다. 캠축은 그 절반으로 돕니다.","1,500rpm은 맞지 않습니다.","2,000rpm은 크랭크축의 2배이며, 관계가 반대입니다."],"d":"4행정 기관은 흡입·압축·폭발·배기 1사이클을 마치는 동안 크랭크축이 2회전합니다. 그동안 흡기밸브와 배기밸브는 한 번씩만 열리면 되므로 캠축은 1회전합니다.\n크랭크축 : 캠축 회전비 = 2 : 1\n캠축 rpm = 1,000 ÷ 2 = 500rpm\n타이밍 체인(또는 기어)이 이 2 : 1 회전비를 지켜 밸브 개폐 시기를 맞춥니다.","k":["4행정 1사이클 = 크랭크축 2회전 / 캠축 1회전","회전비 (크랭크축 : 캠축) = 2 : 1","캠축 rpm = 크랭크축 rpm ÷ 2","캠축 기어는 크랭크축 기어보다 2배 더 큼"],"g":"cam"}},{"q":"압축비가 동일한 경우 이론적으로 열효율이 가장 높은 사이클은?","o":["오토 사이클","디젤 사이클","복합 사이클","모두 같다"],"a":0,"e":{"w":["디젤 사이클은 압축비가 같으면 세 사이클 중 열효율이 가장 낮습니다.","복합 사이클은 오토 사이클과 디젤 사이클의 중간입니다.","세 사이클의 열효율은 서로 다릅니다."],"d":"이 문항은 '압축비가 동일한 경우'라는 특정 이론적 조건을 전제로 열효율을 비교하는 문제입니다.\n오토 사이클은 정적 열 공급(체적이 일정한 상태에서 연소) 방식을 취하며, 동일 압축비 조건에서 디젤이나 복합 사이클보다 이론 열효율이 가장 높습니다.\n실제 엔진은 연소 속도, 열손실, 마찰 등 다양한 변수가 존재하지만, 이상 사이클 모델은 각 기관(가솔린 vs 디젤)의 근본적인 열역학적 특성을 이해하는 기준이 됩니다.\n현장 경험상 \"디젤 엔진이 효율이 더 좋다\"고 생각하여 ②번을 고르기 쉽습니다. 하지만 이는 디젤 엔진이 더 높은 압축비를 사용하기 때문이며, '동일 압축비' 조건에서는 오토 사이클이 우세합니다.","k":["동일 압축비 조건 → 오토 사이클 효율 최고","오토=정적 / 디젤=정압 / 복합=사바테","이론 사이클 비교와 실제 엔진 성능 구분 필수"],"g":"cyc"}},{"q":"일정한 체적에서 연소가 일어나는 가장 대표적인 사이클은?","o":["오토 사이클","디젤 사이클","사바테 사이클","카르노 사이클"],"a":0,"e":{"w":["디젤 사이클은 일정한 압력에서 연소하는 정압 사이클입니다.","사바테 사이클은 정적과 정압 연소가 함께 있는 복합 사이클입니다.","카르노 사이클은 이론상의 이상 사이클입니다."],"d":"오토 사이클(Otto Cycle)은 가솔린 엔진과 같은 불꽃점화기관의 표준 사이클입니다. 혼합기가 폭발할 때 피스톤이 상사점에 머무는 아주 짧은 순간에 연소가 완료된다고 가정하여 '정적(일정 체적) 사이클'이라고 부릅니다.\n실제 엔진은 피스톤이 움직이며 연소가 일어나지만, 이론적으로는 체적 변화가 없을 때 열을 공급받는 것이 기초 모델입니다. '정적'을 엔진이 정지했다는 뜻이 아니라 '체적(Volume)이 고정됨'으로 이해하는 것이 중요합니다.","k":["일정 체적 열 공급 = 오토 사이클 = 정적 사이클","불꽃점화기관(가솔린 엔진)의 기초 이론 모델","연소 시 피스톤 위치 변화가 거의 없다고 가정함","이론적으로 가장 단순하고 명확한 연소 모델"],"g":"cyc"}},{"q":"압축압력 측정에 대한 설명 중 틀린 것은?","o":["축전지는 완전 충전된 것을 사용한다.","충전회로를 차단한다.","점화회로를 차단한다.","연료공급을 차단한다."],"a":1,"e":{"w":["축전지는 완전 충전된 것을 써야 크랭킹 속도가 제대로 나옵니다. 옳은 설명입니다.","엔진이 폭발하지 않도록 점화회로를 차단합니다. 옳은 설명입니다.","연료가 들어가지 않도록 연료공급을 차단합니다. 옳은 설명입니다."],"d":"크랭킹 시 실린더 내부 압력을 측정하여 피스톤 링, 밸브, 헤드 개스킷의 밀봉 상태를 간접적으로 점검합니다.\n완전 충전된 축전지는 일정한 크랭킹 속도를 유지하기 위해 필수적입니다. 점화 및 연료 차단은 안전과 정확한 측정을 위해 수행하지만, 충전회로 차단은 필수 준비 항목이 아니므로 틀린 설명입니다.","k":["축전지 = 완전 충전(크랭킹 속도 확보)","점화회로와 연료 공급 = 차단","충전회로 차단 = 준비 사항이 아니다"]}},{"q":"이륜자동차 엔진의 실린더 헤드는 대부분 알루미늄 합금으로 되어 있다. 그 이유 중 가장 중요한 것은?","o":["열전도율이 높다.","녹슬지 않는다.","주철보다 열팽창계수가 작다.","무게를 증가시켜 준다."],"a":0,"e":{"w":["녹슬지 않는 것은 장점이지만, 이 문제가 묻는 핵심 이유는 열을 잘 전달하는 성질입니다.","알루미늄은 주철보다 열팽창계수가 큽니다.","알루미늄은 가벼워서 무게를 줄여 줍니다."],"d":"실린더 헤드는 연소실과 직접 맞닿아 매우 높은 열을 받습니다. 알루미늄 합금은 주철보다 열을 빠르게 전달하여 연소실 주변의 열을 냉각핀이나 냉각수 쪽으로 신속하게 보냅니다. 이는 엔진 과열, 노킹, 조기 점화 및 열변형 방지에 매우 유리합니다.\n실린더 헤드에는 연소실, 흡기·배기 포트, 점화플러그 및 밸브 등이 설치됩니다. 연소열이 적절히 방출되지 않으면 헤드 변형과 가스켓 손상이 발생할 수 있습니다. 알루미늄은 가공성이 좋아 복잡한 냉각 통로를 만들기 쉽고 가볍다는 장점이 있습니다. 다만, 주철보다 열팽창이 크므로 조립 시 간극 설계에 주의해야 합니다.","k":["알루미늄 헤드: 높은 열전도율 (방열 우수)","주철 대비 장점: 무게가 가벼움, 가공성 우수","주의사항: 주철보다 열팽창계수가 큼","효과: 연소실 열점 제거 및 과열 방지"],"g":"head"}},{"q":"150kgf의 물체를 수직 방향으로 매초 1m의 속도로 올리려면 몇 PS의 동력이 필요한가?","o":["1PS","0.5PS","2PS","5PS"],"a":2,"e":{"w":["1PS는 75kgf·m/s입니다. 150kgf·m/s의 절반입니다.","0.5PS는 37.5kgf·m/s입니다.","5PS는 375kgf·m/s입니다."],"d":"동력은 단위 시간에 한 일의 양(일률)입니다.\n150kgf의 물체를 1초에 1m 올리면 1초에 150kgf·m의 일을 합니다.\n미터법 마력(PS)은 75kgf·m/s를 1PS로 정했으므로\nPS = 힘 × 속도 ÷ 75 = 150 × 1 ÷ 75 = 2PS","k":["1PS = 75 kgf·m/s","PS = 힘(kgf) × 속도(m/s) ÷ 75","거리와 시간이 주어지면 PS = 힘 × 거리 ÷ (75 × 시간)"],"g":"ps"}},{"q":"연소실 설계 시 고려할 사항으로 틀린 것은?","o":["화염 전파에 필요한 시간을 가능한 한 짧게 한다.","가열되기 쉬운 돌출부를 두지 않는다.","연소실의 표면적이 최대가 되게 한다.","압축행정에서 혼합기에 와류가 발생하도록 한다."],"a":2,"e":{"w":["화염이 전파되는 시간을 짧게 해야 노킹이 줄어듭니다. 옳은 설명입니다.","돌출부는 과열되어 조기 점화를 일으키므로 두지 않습니다. 옳은 설명입니다.","와류가 생기면 혼합기가 잘 섞여 빨리 탑니다. 옳은 설명입니다."],"d":"좋은 연소실은 동일한 부피 내에서 표면적을 가능한 한 작게(최소화) 설계해야 합니다. 연소실 표면적이 넓어지면 폭발 시 발생하는 뜨거운 열이 외부로 더 많이 방출되어 열효율이 떨어지기 때문입니다.\n효율적인 연소실은 화염이 이동하는 거리를 짧게 하여 연소 시간을 단축해야 합니다. 또한, 과열되어 조기 점화(Pre-ignition)를 일으킬 수 있는 날카로운 돌출부를 없애야 하며, 압축 시 적절한 와류(Swirl)를 발생시켜 연료와 공기가 잘 섞이도록 설계해야 합니다.","k":["화염 전파 거리는 짧게","열점이 되는 돌출부 제거","적절한 와류와 난류 발생","연소실 표면적은 작게(최소화)"],"g":"head"}},{"q":"이륜자동차 엔진에서 실린더 보어(Bore)가 의미하는 것은?","o":["피스톤의 상하 운동 거리","엔진의 전체 길이","실린더의 내경(지름)","크랭크축의 회전 반경"],"a":2,"e":{"w":["피스톤의 상하 운동 거리는 행정(Stroke)입니다.","엔진의 전체 길이는 보어와 관계가 없습니다.","크랭크축의 회전 반지름은 행정의 절반입니다."],"d":"실린더는 엔진 내부에서 폭발이 일어나는 속이 빈 원통형 공간입니다. 보어는 이 원통의 안쪽 지름(mm)을 뜻하며, 피스톤이 위아래로 움직이는 거리인 스트로크(행정)와 함께 엔진의 전체 배기량을 결정하는 핵심 제원입니다.","k":["보어 = 실린더 안지름(내경)","행정 = 상사점 ~ 하사점 거리","보어와 행정이 배기량을 결정한다"],"g":"bore"}},{"q":"실린더 보어의 크기는 엔진의 어떤 특성과 가장 직접적인 관련이 있는가?","o":["엔진의 냉각 효율","엔진 오일의 점도","엔진의 소음 수준","엔진의 배기량"],"a":3,"e":{"w":["냉각 효율은 냉각 방식과 냉각핀, 냉각수에 좌우됩니다.","오일의 점도는 오일 자체의 성질입니다.","소음 수준은 보어와 직접 관계가 없습니다."],"d":"배기량은 실린더의 보어(내경)와 행정(스트로크)에 의해 결정됩니다. 행정이 일정할 때 보어가 커지면 실린더의 단면적이 넓어져 배기량이 직접적으로 증가합니다.\n실린더는 원통형 구조이므로 그 체적(배기량)은 원기둥의 부피 공식과 같습니다. 단면적은 지름(보어)의 제곱에 비례하기 때문에, 보어가 조금만 커져도 엔진이 한 번에 흡입하거나 배출하는 혼합기의 양은 크게 늘어납니다.","k":["배기량 = π/4 × 보어² × 행정 × 실린더 수","배기량은 보어의 제곱에 비례한다","보어와 행정이 배기량을 결정한다"],"g":"bore"}},{"q":"이륜자동차 엔진에서 실린더 보어의 내벽에 마모 또는 손상이 발생했을 때 나타날 수 있는 주요 문제점은?","o":["엔진의 냉각수 누수","배터리 방전 가속화","브레이크 제동력 약화","압축 누설 및 오일 소모량 증가"],"a":3,"e":{"w":["냉각수 누수는 개스킷이나 호스의 문제입니다.","배터리 방전은 전기 계통의 문제입니다.","제동력은 제동장치의 문제입니다."],"d":"실린더 내벽이 마모되면 피스톤 링과 실린더 벽 사이의 기밀 유지가 불가능해집니다. 이로 인해 연소 가스가 크랭크케이스로 새고, 엔진 오일이 연소실로 유입되어 타버리는 현상이 발생합니다.\n피스톤 링은 연소가스의 누출을 막고 실린더 벽면의 윤활유량을 조절하는 역할을 합니다. 내벽 마모로 밀착력이 떨어지면 압축 압력이 저하되어 출력 감소 및 시동 불량이 나타나고, 블로바이 가스가 증가합니다. 특히 연소실로 올라온 오일이 타면서 청색 배기가스를 배출하게 됩니다.","k":["실린더 마모 → 압축 누설 → 출력/시동성 저하","오일 연소 → 오일 소모 증가 → 청색 배기","블로바이 가스(연소 가스 누출) 증가"],"g":"wear"}},{"q":"실린더 보어의 마모가 심할 경우 주로 사용하는 정비 방법은?","o":["오버사이즈 피스톤 링만 교체한다.","엔진오일만 교환한다.","오버사이즈 피스톤 및 피스톤 링으로 교체한다.","실린더 블록 상단부를 연마한다."],"a":2,"e":{"w":["링만 오버사이즈로 바꾸면 피스톤과 실린더 사이의 간극이 맞지 않습니다.","오일 교환으로는 마모된 실린더가 되돌아오지 않습니다.","블록 상단부 연마는 평면도를 바로잡는 작업입니다."],"d":"실린더 마모가 심한 경우, 내경을 깎아내는 보링(Boring)을 실시합니다. 이때 내경이 커졌으므로 기존 표준 피스톤 대신 확대된 치수에 맞는 오버사이즈 피스톤과 링을 세트로 사용해야 합니다.\n보링: 마모되거나 변형된 실린더 내벽을 절삭하여 지름을 일정하게 키우는 작업입니다.\n호닝: 보링 후 내벽을 정밀하게 다듬고, 오일을 유지하는 '크로스 해치' 패턴을 형성합니다.\n오버사이즈 부품: 표준보다 0.25mm, 0.50mm 등 단계별로 큰 부품을 사용하여 간극을 맞춥니다.","k":["보링 = 내경 확대 절삭","호닝 = 정밀 다듬기 + 크로스 해치","보링 후 = 반드시 오버사이즈 피스톤+링 사용"],"g":"wear"}},{"q":"실린더 내의 마멸이 가장 적은 곳은 어디입니까?","o":["상사점 부근","하사점 부근","상사점과 하사점의 중간","실린더의 하단부"],"a":3,"e":{"w":["상사점 부근은 폭발 압력과 열이 가장 커서 마멸이 가장 큽니다.","하사점 부근도 피스톤 링이 지나가며 마멸됩니다.","중간 부분은 피스톤 속도가 빨라 마멸이 생깁니다."],"d":"실린더 상부는 가혹한 환경(고온·고압)으로 마모가 심하지만, 하단부는 이러한 영향에서 벗어나 있어 마모가 가장 적습니다.\n실린더 마모는 위치에 따라 불균일하게 나타납니다. 폭발이 일어나는 상사점 부근은 높은 연소 압력이 피스톤 링을 실린더 벽으로 강하게 밀착시키고, 고온으로 인해 윤활유 유막이 얇아져 금속 간 마찰이 심해집니다. 반면, 실린더 하단부는 폭발 압력이 낮아지고 온도도 상대적으로 낮아 윤활 상태가 양호하므로 마모가 가장 적게 발생합니다.","k":["상부 마모 원인: 고온, 고압, 윤활막 저하, 카본 퇴적","가장 심한 곳: 제1 압축링이 위치하는 상사점 부근","가장 적은 곳: 연소 영향이 적은 실린더 최하단부","마모의 세기 : 상사점>중간>하사점>최하단"],"g":"wear"}},{"q":"실린더 보어의 표면에 크로스 해치 패턴을 형성하는 주된 이유는?","o":["보어의 색상을 좋게 하기 위해","보어의 강도를 높이기 위해","보어의 무게를 줄이기 위해","피스톤 링이 실린더 벽에 안정적으로 밀착하도록 돕기 위해"],"a":3,"e":{"w":["색상과는 관계가 없습니다.","강도를 높이려는 것이 아닙니다.","무게를 줄이려는 것이 아닙니다."],"d":"실린더 내벽이 거울처럼 지나치게 매끄러우면 오일이 벽면에 머물지 못하고 흘러내립니다. 이 경우 금속끼리 직접 부딪혀 마찰과 마모가 급격히 늘어납니다. 크로스 해치는 오일을 보유하여 마찰을 줄이고, 링과 벽 사이의 기밀을 유지하며, 오일이 연소실로 올라가는 것을 억제하는 데 도움을 줍니다.","k":["호닝(Honing) 가공 → 크로스 해치(Cross Hatch) 형성","미세한 격자 홈에 윤활유(엔진 오일)를 보유함","피스톤 링의 초기 길들이기 및 원활한 윤활 지원"],"g":"hatch"}},{"q":"실린더 마멸의 원인으로 부적당한 것은?","o":["실린더와 피스톤 링의 접촉","피스톤 랜드에 의한 접촉","흡입가스 속 먼지와 이물질에 의한 마모","연소 생성물에 의한 부식"],"a":1,"e":{"w":["실린더와 피스톤 링의 접촉은 마멸의 가장 큰 원인입니다.","흡입 공기 속의 먼지와 이물질은 실린더 벽을 깎습니다.","연소 생성물은 실린더 벽을 부식시킵니다."],"d":"피스톤 랜드(Land)는 링 홈(Groove) 사이의 피스톤 몸체 부분입니다. 정상적인 작동 상태에서 랜드는 실린더 벽과 직접 마찰하지 않도록 설계되어 있습니다.\n실린더 마멸은 주로 피스톤 링과의 직접적인 마찰, 흡입 공기에 포함된 먼지나 이물질에 의한 연마 작용, 그리고 연소 과정에서 생성된 산성 물질에 의한 부식으로 발생합니다. 피스톤 랜드는 직접 마찰부위가 아니며, 측압을 지지하는 곳은 스커트(Skirt) 부분입니다.","k":["피스톤 링 = 실린더 벽과 직접 접촉","피스톤 랜드 = 링 홈 사이의 몸체, 실린더 벽에 닿지 않는다","피스톤 스커트 = 측압을 받아 운동을 안내"],"g":"pist"}},{"q":"이륜자동차 엔진에서 행정(Stroke)이 의미하는 것은?","o":["실린더 보어의 지름","피스톤이 상사점에서 하사점까지 이동하는 거리","엔진의 전체 폭","크랭크축의 지름"],"a":1,"e":{"w":["실린더 보어의 지름은 보어(내경)입니다.","엔진의 전체 폭은 행정이 아닙니다.","크랭크축의 지름은 행정이 아닙니다."],"d":"행정(Stroke)은 피스톤이 상사점(TDC)에서 하사점(BDC)까지 움직이는 거리입니다. 피스톤은 실린더 안에서 왕복 운동을 하며, 행정은 보어(내경)와 함께 배기량을 결정합니다.\n크랭크축 쪽에서 보면 행정은 크랭크 회전 반지름의 2배입니다.","k":["행정 = 상사점 ~ 하사점 사이의 거리","행정 = 크랭크 회전 반지름 × 2","배기량 = π/4 × 보어² × 행정"],"g":"bore"}},{"q":"롱 스트로크 엔진(Long-stroke engine)의 일반적인 특징은?","o":["고회전·고출력에 유리하다.","주로 레이싱 이륜자동차에 사용된다.","엔진의 높이가 매우 낮다.","저회전에서 높은 토크를 발생시키는 데 유리하다."],"a":3,"e":{"w":["고회전·고출력에 유리한 것은 숏 스트로크 엔진입니다.","레이싱용에는 숏 스트로크 엔진을 주로 씁니다.","행정이 길어 엔진의 높이는 오히려 높아집니다."],"d":"롱 스트로크(Long-stroke)는 행정(Stroke) 길이가 실린더 내경인 보어(Bore)보다 긴 엔진 형식을 의미합니다. 이를 언더스퀘어(Undersquare) 엔진이라고도 합니다.\n행정이 길면 크랭크축의 반지름이 커져서 피스톤이 크랭크축을 돌리는 회전력(토크)을 발생시키기에 구조적으로 유리합니다.\n동일한 RPM에서 피스톤이 이동해야 할 거리가 길기 때문에 평균 피스톤 속도가 빨라집니다.\n긴 행정으로 인해 엔진의 전체적인 높이가 높아지는 경향이 있으며, 고회전 시 관성력 부담이 커져 초고속 회전에는 불리할 수 있습니다.","k":["행정(Stroke) > 보어(Bore)","저·중속 영역의 높은 토크 발생","평균 피스톤 속도 상승","엔진 높이가 상대적으로 높음"],"g":"sq"}},{"q":"숏 스트로크(Short-stroke) 엔진의 일반적인 특징은?","o":["저회전에서 높은 토크를 발생시키는 데 가장 유리하다.","연료 효율이 항상 매우 낮다.","고회전에서 높은 출력을 발생시키는 데 유리하다.","점화 효율이 항상 우수하다."],"a":2,"e":{"w":["저회전에서 큰 토크를 내는 것은 롱 스트로크 엔진입니다.","연료 효율이 항상 낮은 것은 아닙니다.","점화 효율은 행정의 길이로 정해지지 않습니다."],"d":"숏 스트로크(Short-stroke)는 행정(Stroke)이 보어(Bore)보다 짧은 형식으로, 같은 평균 피스톤 속도 한계 내에서 더 높은 회전수(RPM)를 구현할 수 있습니다.\n오버스퀘어(Oversquare) 엔진이라고도 불립니다. 행정이 짧으면 피스톤의 이동 거리와 속도가 줄어들어 관성 부담이 작아지므로 고회전에 매우 유리합니다.\n또한, 넓은 보어 덕분에 실린더 헤드에 더 큰 흡·배기 밸브를 배치할 수 있어 고회전 시 대량의 혼합기를 신속하게 흡입하고 배출하는 체적효율이 뛰어납니다.","k":["행정 < 보어 = 숏 스트로크(오버스퀘어)","피스톤 속도가 낮아 고회전에 유리","보어가 커서 큰 밸브를 달 수 있다"],"g":"sq"}},{"q":"고속 회전을 목적으로 하는 기관에서는 일반적으로 흡기 밸브와 배기 밸브 중 어느 밸브를 더 크게 만드는가?","o":["흡기 밸브","배기 밸브","흡기 밸브와 배기 밸브의 크기는 항상 같다.","고속 회전 기관에는 밸브 크기가 영향을 주지 않는다."],"a":0,"e":{"w":["배기가스는 압력으로 밀려 나가므로 배기 밸브는 작아도 됩니다.","흡기 밸브를 더 크게 만드는 것이 일반적입니다.","밸브의 크기는 흡입 효율에 큰 영향을 줍니다."],"d":"흡기는 피스톤 하강으로 인한 압력 차(진공)를 이용해 공기를 빨아들이므로, 흡기 저항을 최소화하기 위해 일반적으로 흡기 밸브를 배기 밸브보다 크게 설계합니다.\n엔진의 출력은 얼마나 많은 혼합기를 실린더로 넣느냐(체적효율)에 달려 있습니다. Intake valve(흡기 밸브)는 공기 유입 통로이며, 고회전일수록 밸브가 열리는 시간이 매우 짧아지기 때문에 큰 지름을 통해 유효 면적을 확보하는 것이 필수적입니다. 반면 Exhaust valve(배기 밸브)는 연소 직후의 높은 압력 덕분에 가스가 스스로 밀려 나가므로 상대적으로 크기가 작아도 배출이 용이합니다.","k":["흡기 밸브 > 배기 밸브 (일반적인 크기 비교)","흡기 저항 감소 → 체적효율(혼합기 충전 효율) 향상","배기 밸브: 고온 견디는 내열성이 설계의 핵심"],"g":"head","p":["head"]}},{"q":"2사이클 엔진이 경량화와 높은 출력 밀도에 유리하여 소형 이륜자동차, 스쿠터, 체인톱 등에 많이 사용되었던 주된 이유는?","o":["복잡한 밸브 구동장치를 사용하기 때문이다.","크랭크축 1회전마다 1회의 폭발행정이 이루어지기 때문이다.","엔진 소음이 매우 작기 때문이다.","연료 소모량이 매우 적기 때문이다."],"a":1,"e":{"w":["2사이클 엔진은 밸브 구동장치가 없어 구조가 간단합니다.","2사이클 엔진은 소음이 큰 편입니다.","2사이클 엔진은 연료 소모가 많은 편입니다."],"d":"2사이클(Two-stroke) 엔진은 피스톤이 두 번 이동(상승·하강)하며 크랭크축이 1회전할 때마다 흡입, 압축, 폭발, 배기의 전 과정을 완료하여 한 번의 폭발행정이 일어납니다.\n4사이클 엔진은 크랭크축이 2회전해야 한 번 폭발하지만, 2사이클은 폭발 빈도가 2배 높아 배기량 대비 출력이 우수합니다. 구조적으로 캠축이나 복잡한 밸브 기구 대신 실린더 벽면의 포트(Port)를 사용하므로 부품 수가 적고 가벼워 소형 이동수단에 적합합니다.","k":["2사이클: 크랭크 1회전 = 1회 폭발","4사이클: 크랭크 2회전 = 1회 폭발","구조 단순, 경량화, 높은 출력 밀도","밸브 대신 포트(Port) 사용"],"g":"two"}},{"q":"2사이클 엔진에서 윤활유가 연료와 함께 연소되기 때문에 발생할 수 있는 현상은?","o":["엔진 소음 감소","점화플러그 수명 증가","백색 또는 청색 계열의 매연 발생","엔진 과냉각"],"a":2,"e":{"w":["윤활유가 타는 것과 소음 감소는 관계가 없습니다.","윤활유가 타면 점화플러그가 오염되어 수명이 줄어듭니다.","과냉각과는 관계가 없습니다."],"d":"일반적인 크랭크케이스 압축식 2사이클 엔진은 윤활유를 연료와 함께 연소실로 공급하여 윤활합니다. 이 과정에서 오일의 일부가 함께 연소되면서 배기가스에 청색 또는 청백색 연기가 섞여 나오게 됩니다.\n2사이클 엔진은 혼합 급유(Premix) 또는 분리 급유(Oil injection) 방식을 사용합니다. 오일은 엔진 내부 부품을 윤활한 뒤 연소실에서 타버립니다. 오일 공급량이 과다하거나 불완전 연소가 발생하면 매연이 심해지고, 점화플러그 오염(Fouling) 및 머플러 막힘의 원인이 되어 출력 저하를 유발합니다.","k":["2사이클 엔진: 오일이 혼합기와 함께 연소됨","배기가스 색: 청색 또는 청백색(Blue-ish) 매연","오일 과다 시: 카본 퇴적, 플러그 오염, 출력 저하 발생"],"g":"scav"}},{"q":"2사이클 엔진에서 새로운 혼합기가 실린더로 들어가 잔류 배기가스를 밀어내고 실린더 내부를 채우는 과정을 무엇이라고 하는가?","o":["배기 과정","압축 과정","소기과정","연소 과정"],"a":2,"e":{"w":["배기 과정은 연소 가스가 배기구로 빠져나가는 과정입니다.","압축 과정은 혼합기를 눌러 압력을 높이는 과정입니다.","연소 과정은 혼합기가 타면서 힘을 내는 과정입니다."],"d":"소기는 2사이클 엔진에서 새로운 혼합기(신기)가 실린더 내부로 유입되면서, 연소 후 남은 잔류 배기가스를 밀어내고 실린더를 채우는 핵심 과정입니다.\n① 흡입·압축 : 피스톤이 올라가며 소기·배기 포트를 닫고 혼합기를 압축한다. ② 연소·팽창 : 상사점에서 점화되어 피스톤이 내려가고, 이때 크랭크케이스 안의 새 혼합기가 미리 압축된다. ③ 배기 : 피스톤이 내려가며 배기 포트가 먼저 열리고, 연소 가스가 자체 압력으로 빠져나간다. ④ 소기 : 이어서 소기 포트가 열리고, 크랭크케이스의 혼합기가 들어와 남은 연소 가스를 밀어낸다.","k":["소기(Scavenging): 새 혼합기가 잔류가스를 밀어냄","단락 손실: 신기가 배기구로 바로 빠지는 현상","신기 손실 결과: 연비 저하 및 유해 배출가스 증가","2사이클 특유의 흡배기 중첩 메커니즘"],"g":"scav"}},{"q":"2사이클 엔진의 일반적인 특징으로 옳지 않은 것은?","o":["4사이클 엔진에 비해 구조가 비교적 간단하다.","같은 배기량일 때 4사이클 엔진보다 출력이 높을 수 있다.","4사이클 엔진보다 연비가 좋고 배기가스가 깨끗하다.","부품 수가 적어 소형화·경량화에 유리하고 반응이 빠른 편이다."],"a":2,"e":{"w":["밸브 구동장치가 없어 구조가 간단합니다. 옳은 특징입니다.","폭발 횟수가 많아 같은 배기량에서 출력이 높을 수 있습니다. 옳은 특징입니다.","부품이 적어 작고 가볍게 만들 수 있고 반응이 빠릅니다. 옳은 특징입니다."],"d":"2사이클 엔진은 구조가 단순하고 출력 밀도가 높지만, 소기(Scavenging) 과정에서 신기 단락 손실(Short-circuiting)이 발생하여 연료 효율이 낮고 미연소 탄화수소(HC) 배출이 많습니다. 또한 윤활유가 연료와 함께 연소되어 매연이 발생하므로 배기가스가 깨끗하지 않습니다.","k":["장점: 구조 단순, 소형·경량, 높은 출력 밀도, 빠른 반응성","단점: 낮은 연비(소기 손실), 오일 연소(매연), 카본 퇴적","신기 단락 손실: 새 혼합기가 배기구로 직접 빠지는 현상"],"g":"scav"}},{"q":"2사이클 엔진이 4사이클 엔진보다 일반적으로 배기음과 연소 소음이 크게 느껴질 수 있는 이유는?","o":["사용하는 연료의 종류만 다르기 때문이다.","냉각 방식만 다르기 때문이다.","폭발 행정의 빈도가 높기 때문이다.","배기가스 정화장치가 반드시 설치되기 때문이다."],"a":2,"e":{"w":["연료의 종류 때문이 아닙니다.","냉각 방식 때문이 아닙니다.","정화장치가 있다고 소음이 커지지 않습니다."],"d":"2사이클 엔진은 크랭크축 1회전마다 1회 폭발하며, 4사이클 엔진은 2회전마다 1회 폭발합니다. 따라서 동일한 엔진 회전수(RPM)에서 2사이클 엔진은 연소음과 배기 펄스(Exhaust Pulse)가 2배 더 자주 발생하여 소음이 크게 느껴집니다.\n단기통 엔진이 3,000rpm으로 회전할 때, 4사이클은 분당 약 1,500회 폭발하지만 2사이클은 3,000회 폭발합니다. 또한 2사이클은 배기 포트가 급격히 열리는 구조적 특성과 소형 엔진의 단순한 소음기 구조 때문에 더 날카로운 배기음을 발생시키는 경향이 있습니다.","k":["2사이클: 1회전(360°) 1회 폭발","4사이클: 2회전(720°) 1회 폭발","폭발 빈도(Combustion Frequency) 비례","배기 펄스가 빈번하여 소음이 큼"],"g":"two"}},{"q":"환경 규제 강화로 인해 기존 방식의 2사이클 엔진 사용이 점차 줄어들고 있는 주된 이유는?","o":["4사이클 엔진보다 출력이 지나치게 낮기 때문이다.","유해 배기가스 배출이 많고 연료 효율이 낮기 때문이다.","엔진 구조가 지나치게 복잡하기 때문이다.","생산 비용이 항상 매우 비싸기 때문이다."],"a":1,"e":{"w":["2사이클 엔진은 같은 배기량에서 출력이 높은 편입니다.","2사이클 엔진은 구조가 간단합니다.","생산 비용이 항상 비싼 것은 아닙니다."],"d":"기존 포트식 2사이클 엔진은 소기 과정 중 혼합기 일부가 타지 않고 배출되며, 윤활유가 함께 연소되어 환경 오염의 주원인이 됩니다.\n2사이클 엔진은 배기 포트와 소기 포트가 동시에 열리는 구간에서 신선한 혼합기 일부가 연소되지 않은 채 배기구로 빠져나가는 단락 손실(Short-circuiting)이 발생합니다. 또한, 엔진 내부 윤활을 위해 연료와 섞인 오일이 연소실에서 함께 타면서 매연과 미세 입자상 물질을 생성합니다.","k":["소기 손실(신기 단락) → 미연소 연료 배출","오일 연소 → 청색 매연 및 입자상 물질","연료 효율 저하 → 연비 및 환경 규제 불리"],"g":"scav"}},{"q":"엔진의 배기량을 계산하는 데 필요한 요소는?","o":["행정의 길이와 연소실 체적","행정 체적과 연소실 체적","실린더 보어의 지름과 연소실 체적","실린더 보어의 지름과 행정의 길이"],"a":3,"e":{"w":["연소실 체적은 배기량 계산에 쓰지 않습니다.","행정 체적이 곧 배기량이며, 연소실 체적은 압축비 계산에 씁니다.","보어의 지름은 맞지만 연소실 체적이 아니라 행정의 길이가 필요합니다."],"d":"배기량은 피스톤이 상사점에서 하사점까지 움직이며 밀어내는 체적입니다. 실린더는 원통이므로 단면적(π/4 × 보어²)에 행정을 곱하면 1기통 배기량이 되고, 여기에 실린더 수를 곱하면 총배기량이 됩니다.\n연소실 체적은 배기량이 아니라 압축비를 구할 때 쓰는 값이므로, 연소실 체적이 들어간 보기는 모두 틀립니다.","k":["배기량 = π/4 × 보어² × 행정 × 실린더 수","연소실 체적은 압축비 계산에 쓴다","1,000cc = 1L"],"g":"bore"}},{"q":"피스톤 링의 3대 작용에 해당되지 않는 것은?","o":["기밀 유지 작용","오일 제어 작용","오일 청정 작용","열전도 작용"],"a":2,"e":{"w":["기밀 유지는 피스톤 링의 3대 작용입니다.","오일 제어는 피스톤 링의 3대 작용입니다.","열전도는 피스톤 링의 3대 작용입니다."],"d":"피스톤 링의 3대 작용은 기밀 유지, 오일 제어, 열전도입니다.\n기밀 유지: 연소가스가 새는 것을 막아 압축압력을 지킵니다.\n오일 제어: 실린더 벽의 남는 오일을 긁어내립니다.\n열전도: 피스톤이 받은 열을 실린더 벽으로 전달합니다.\n오일을 깨끗하게 하는 청정 작용은 링이 아니라 엔진오일의 작용입니다.","k":["피스톤 링 3대 작용 = 기밀 유지 + 오일 제어 + 열전도","압축 링 = 기밀 유지와 열전도, 오일 링 = 오일 제어","청정 작용 = 엔진오일의 작용"],"g":"ring","p":["rings"]}},{"q":"피스톤 링 엔드갭의 정의는?","o":["피스톤 링과 실린더 벽 사이의 간극","피스톤 링 양쪽 끝 사이 간극","피스톤 링과 피스톤 링 홈 사이 간극","피스톤 핀과 피스톤 사이 간극"],"a":1,"e":{"w":["링과 실린더 벽 사이의 간극은 엔드갭이 아닙니다.","링과 링 홈 사이의 간극은 사이드갭입니다.","피스톤 핀과 피스톤 사이의 간극은 링의 간극이 아닙니다."],"d":"엔드갭(End gap)은 피스톤 링을 실린더에 끼웠을 때 링의 양쪽 끝이 마주 보는 틈입니다. 링이 열을 받아 늘어날 자리를 주기 위해 둡니다.\n엔드갭이 너무 작으면 열팽창한 링 끝이 서로 맞닿아 링이 부러지거나 실린더를 긁고, 너무 크면 압축가스가 새어(블로바이) 출력이 떨어집니다.\n측정은 링을 실린더 안에 수평으로 넣고 필러게이지로 합니다.","k":["엔드갭 = 링 양쪽 끝 사이의 틈","사이드갭 = 링 옆면과 링 홈 사이의 틈","엔드갭 과소 = 링 파손·고착, 과대 = 압축 누설"],"g":"gap","p":["endgap"]}},{"q":"피스톤 링의 사이드갭이 부족할 경우 발생하는 문제점으로 가장 적절한 것은?","o":["링의 움직임이 방해되어 기밀 유지가 어려워진다.","엔진 소음이 증가한다.","오일 소모량이 증가한다.","엔진 과열 현상 발생한다."],"a":0,"e":{"w":["소음 증가는 사이드갭 부족의 직접적인 결과가 아닙니다.","오일 소모 증가는 링이 닳았을 때의 주된 증상입니다.","과열이 가장 적절한 답은 아닙니다."],"d":"사이드갭(Side gap)은 피스톤 링의 옆면과 링 홈 사이의 위아래 틈입니다. 링은 이 틈 안에서 조금씩 움직이며 실린더 벽에 밀착합니다.\n사이드갭이 부족하면 링이 홈 안에서 자유롭게 움직이지 못하고, 열팽창이나 카본이 겹치면 홈에 달라붙습니다(고착). 고착된 링은 실린더 벽을 따라가지 못해 기밀이 떨어지고 압축이 샙니다.","k":["사이드갭 = 링 옆면과 링 홈 사이의 틈","사이드갭 부족 = 링 움직임 제한 → 고착 → 기밀 저하","사이드갭 과대 = 링 떨림, 오일 소모 증가"],"g":"gap"}},{"q":"피스톤 링 사이드갭이 적용되고 점검되어야 하는 대상은?","o":["오일 링에만 해당","최상단 압축 링에만 해당","모든 피스톤 링에 해당","중간 압축 링에만 해당"],"a":2,"e":{"w":["오일 링에만 해당하지 않습니다.","최상단 압축 링에만 해당하지 않습니다.","중간 압축 링에만 해당하지 않습니다."],"d":"사이드갭은 압축 링에만 있는 것이 아닙니다. 제1 압축 링, 제2 압축 링, 오일 링 모두 링 홈 안에서 움직여야 하므로 모든 피스톤 링에 사이드갭이 필요하고, 정비할 때도 모든 링을 점검합니다.\n규정값은 링의 종류와 위치에 따라 다를 수 있으므로 정비지침서의 값을 확인합니다.","k":["사이드갭 점검 대상 = 모든 피스톤 링","측정 = 링을 홈에 끼우고 필러게이지로 틈을 잰다","규정값은 링 종류·위치마다 다를 수 있다"],"g":"gap","p":["feeler"]}},{"q":"피스톤 핀 베어링의 주된 역할이 아닌 것은?","o":["피스톤 핀 하중 지지","크랭크축 지지","피스톤과 커넥팅 로드 원활한 움직임","피스톤과 커넥팅 로드 마찰 감소"],"a":1,"e":{"w":["피스톤 핀의 하중을 지지합니다. 역할이 맞습니다.","피스톤과 커넥팅 로드가 원활히 움직이게 합니다. 역할이 맞습니다.","피스톤과 커넥팅 로드의 마찰을 줄입니다. 역할이 맞습니다."],"d":"피스톤 핀 베어링은 커넥팅 로드 소단부에 있으며, 피스톤 핀과 커넥팅 로드가 서로 꺾이며 움직일 때 하중을 받치고 마찰을 줄입니다.\n크랭크축을 받치는 것은 크랭크케이스에 있는 메인 저널 베어링의 역할입니다. 베어링의 이름과 위치를 짝지어 기억하십시오.","k":["피스톤 핀 베어링 = 커넥팅 로드 소단부","메인 저널 베어링 = 크랭크축 지지","크랭크 핀 베어링 = 커넥팅 로드 대단부"],"g":"crank","p":["conrod"]}},{"q":"피스톤 핀 베어링의 형태는 무엇인가?","o":["볼 베어링 또는 테이퍼 롤러 베어링","니들 롤러 또는 부싱","스러스트 베어링 또는 앵귤러 베어링","원통 롤러 베어링 또는 볼 베어링"],"a":1,"e":{"w":["볼 베어링이나 테이퍼 롤러 베어링은 좁은 소단부에 들어가지 않습니다.","스러스트 베어링과 앵귤러 베어링은 축 방향 하중을 받는 베어링입니다.","원통 롤러 베어링이나 볼 베어링은 크기가 커서 소단부에 쓰지 않습니다."],"d":"피스톤 핀 베어링은 커넥팅 로드 소단부의 좁은 공간에서, 한 바퀴 도는 회전이 아니라 작은 각도로 흔들리는 운동과 큰 반복 하중을 받습니다. 그래서 가늘고 긴 롤러를 쓰는 니들 롤러 베어링이나 청동 부싱을 사용합니다.\n볼 베어링이나 테이퍼 롤러 베어링은 부피가 커서 이 자리에 맞지 않습니다.","k":["피스톤 핀 베어링 = 니들 롤러 베어링 또는 부싱","니들 롤러 = 좁은 공간에서 큰 하중을 받는다","위치 = 커넥팅 로드 소단부"],"g":"crank","p":["needle"]}},{"q":"피스톤 핀 베어링의 마모 징후로 가장 적절한 것은?","o":["오일 압력 경고등이 점등된다.","금속성 소음(따각거림)이 발생한다.","냉각수 누수가 발생한다.","제동력이 약해진다."],"a":1,"e":{"w":["오일 압력 경고등은 윤활 계통의 압력 문제로 켜집니다.","냉각수 누수와는 관계가 없습니다.","제동력과는 관계가 없습니다."],"d":"피스톤 핀 베어링이 마모되면 핀과 소단부 사이의 틈이 커집니다. 피스톤이 상사점과 하사점에서 방향을 바꿀 때마다 핀이 틈 안에서 부딪혀 '따각따각' 하는 금속성 소음이 납니다.\n스커트 마모로 피스톤이 실린더 벽을 치는 피스톤 슬랩과는 원인이 다릅니다.","k":["핀 베어링 마모 = 금속성 타격음(따각거림)","소음은 피스톤의 운동 방향이 바뀔 때 난다","피스톤 슬랩 = 스커트와 실린더 간극 과대"],"g":"crank"}},{"q":"메인 저널 베어링의 위치는?","o":["캠축을 지지하는 캠 베어링 부위","변속기 입력축을 지지하는 베어링 부위","휠 허브를 지지하는 허브 베어링 부위","크랭크축을 지지하는 크랭크케이스 또는 실린더 블록 부위"],"a":3,"e":{"w":["캠 베어링은 캠축을 지지합니다.","변속기 입력축 베어링은 변속기 부품입니다.","허브 베어링은 바퀴를 지지합니다."],"d":"메인 저널은 크랭크축의 회전 중심이 되는 축 부분이고, 메인 저널 베어링은 이 부분을 크랭크케이스(또는 실린더 블록)에서 받쳐 줍니다.\n커넥팅 로드 대단부와 크랭크 핀 사이에 있는 것은 크랭크 핀 베어링(대단부 베어링)이므로 구분해야 합니다.","k":["메인 저널 베어링 = 크랭크케이스에서 크랭크축을 지지","크랭크 핀 베어링 = 커넥팅 로드 대단부와 크랭크 핀 사이","피스톤 핀 베어링 = 커넥팅 로드 소단부"],"g":"crank"}},{"q":"메인 저널 베어링의 주된 역할은?","o":["밸브 개폐 타이밍","배기가스 소음 감소","연료 미세 분사","크랭크축 하중 지지 및 고속 회전 시 마찰 감소"],"a":3,"e":{"w":["밸브 개폐 타이밍은 캠축과 타이밍 체인이 맡습니다.","배기 소음은 소음기가 줄입니다.","연료 분사는 인젝터가 맡습니다."],"d":"메인 저널 베어링은 폭발 압력과 관성력으로 크랭크축에 걸리는 하중을 받치고, 크랭크축이 고속으로 회전할 때 마찰을 줄여 줍니다. 동시에 크랭크축의 회전 중심이 흔들리지 않게 잡아 줍니다.\n베어링과 저널 사이의 규정 간극과 충분한 윤활유 공급이 지켜져야 제 역할을 합니다.","k":["메인 저널 베어링 = 하중 지지 + 마찰 감소 + 축 중심 유지","간극 과대 = 유압 저하와 소음","간극 과소 = 유막이 끊겨 소착"],"g":"crank"}},{"q":"크랭크축의 휨을 측정할 때 가장 적합한 것은?","o":["스프링저울과 V블록","버니어 캘리퍼스와 곧은자","다이얼 게이지와 V블록","마이크로미터와 다이얼 게이지"],"a":2,"e":{"w":["스프링저울은 힘을 재는 도구입니다.","버니어 캘리퍼스와 곧은자로는 축의 흔들림을 잴 수 없습니다.","마이크로미터는 지름을 재는 도구입니다."],"d":"크랭크축의 휨은 양쪽 메인 저널을 V블록 위에 올리고, 가운데 저널에 다이얼 게이지를 직각으로 댄 뒤 축을 천천히 한 바퀴 돌려 측정합니다.\n게이지 지침이 움직인 전체 값이 흔들림이고, 휨은 그 값의 1/2입니다.\n휘어진 크랭크축은 회전 중심이 흔들려 진동과 베어링 편마모를 일으킵니다.","k":["크랭크축 휨 측정 = V블록 + 다이얼 게이지","휨 = 다이얼 게이지가 움직인 전체 값의 1/2","마이크로미터 = 저널의 바깥지름 측정"],"g":"vblock"}},{"q":"크랭크축의 볼 베어링이 마모·손상될 때 주요 징후는?","o":["밸브 간극 변화","엔진오일 감소","스파크 플러그 오염","엔진에서 소음 발생"],"a":3,"e":{"w":["밸브 간극은 밸브 기구의 마모로 변합니다.","오일 감소는 누유나 연소 때문입니다.","스파크 플러그 오염은 연소 상태의 문제입니다."],"d":"크랭크축을 받치는 볼 베어링이 마모되거나 손상되면 베어링 안의 볼과 궤도면 사이에 유격이 생깁니다. 크랭크축이 돌 때 이 유격 때문에 소음과 진동이 나고, 회전수가 올라갈수록 커집니다.\n그대로 두면 크랭크축이 흔들려 다른 부품의 손상으로 이어집니다.","k":["크랭크축 베어링 마모 = 소음과 진동","유격이 커질수록 소음도 커진다","방치하면 크랭크축 흔들림과 2차 손상"],"g":"crank"}},{"q":"피스톤의 형상에서 피스톤 핀 보스 방향을 단경으로 하는 타원형 피스톤은?","o":["오토서믹 피스톤","스플리트 피스톤","캠 연마 피스톤","솔리드 피스톤"],"a":2,"e":{"w":["오토서믹 피스톤은 열팽창을 억제하는 강판을 넣은 피스톤입니다.","스플리트 피스톤은 스커트에 홈(슬릿)을 낸 피스톤입니다.","솔리드 피스톤은 홈이 없는 통짜 스커트의 피스톤입니다."],"d":"캠 연마 피스톤(Cam-ground piston)은 차가울 때 완전한 원이 아니라 약간 타원입니다. 피스톤 핀 보스 쪽은 살이 두꺼워 열을 받으면 더 많이 늘어나므로, 미리 보스 방향 지름을 작게(단경) 만들어 둡니다.\n정상 작동 온도가 되면 보스 방향이 늘어나 원형에 가까워지고, 실린더와의 간극이 고르게 됩니다.","k":["캠 연마 피스톤 = 냉간 시 타원형","핀 보스 방향 = 단경(짧은 지름)","작동 온도에서 원형에 가까워진다"],"g":"oval"}},{"q":"기관 부품 중 표면 경화를 하지 않아도 되는 것은?","o":["피스톤","크랭크 축","피스톤 핀","실린더"],"a":0,"e":{"w":["크랭크 축은 저널이 베어링과 마찰하므로 표면 경화를 합니다.","피스톤 핀은 큰 하중과 마찰을 받으므로 표면 경화를 합니다.","실린더는 피스톤 링과 계속 마찰하므로 표면 경화를 합니다."],"d":"크랭크축 저널, 피스톤 핀, 실린더 내벽은 반복 마찰과 큰 하중을 받아 높은 내마모성이 필요합니다. 피스톤은 주로 알루미늄 합금으로 만들어져 전통적인 철강 부품의 표면 경화 처리를 적용하지 않습니다.\n부품 중심부의 질김을 유지하면서 표면만 단단하게 만들어 마모를 줄이는 처리입니다. 대표 방법은 침탄, 질화, 고주파 경화, 화염 경화입니다.\n크랭크축 저널은 반복 하중과 마찰을 받고, 피스톤 핀도 큰 하중을 받습니다. 실린더 내벽은 피스톤 링과 계속 마찰하므로 높은 내마모성이 요구됩니다.","k":["표면 경화 = 겉은 단단하게, 속은 질기게","필요한 곳 = 반복 마찰과 큰 하중을 받는 철강 부품","피스톤 = 알루미늄 합금, 표면 경화 대상이 아니다"]}},{"q":"피스톤 상단에 위치한 피스톤 링의 주요 기능은?","o":["피스톤의 색상을 변경한다.","실린더 벽과의 기밀을 유지한다.","피스톤의 무게를 줄인다.","피스톤의 온도를 증가시킨다."],"a":1,"e":{"w":["링은 색상과 관계가 없습니다.","링은 무게를 줄이는 부품이 아닙니다.","링은 열을 실린더 벽으로 전달해 피스톤의 온도를 낮춥니다."],"d":"피스톤 위쪽의 압축 링(Compression ring)은 연소실의 고압 가스가 피스톤과 실린더 사이로 새어 크랭크케이스로 내려가는 것을 막는다.\n피스톤 링은 압축 링과 오일 링(Oil control ring)으로 구분한다.\n압축 링: 압축행정에서 혼합기가 새는 것을 막고, 폭발행정에서 고압 연소가스가 크랭크케이스로 빠지는 것을 차단한다.\n마모·파손 시: 압축압력 저하, 시동 불량, 출력 저하, 블로바이 가스 증가, 오일 오염·소비 증가가 나타날 수 있다.","k":["위쪽 링 = 압축 링","핵심 역할 = 기밀 유지","압축가스의 크랭크케이스 누출 방지","피스톤 열을 실린더 벽으로 전달"],"g":"ring","p":["rings"]}},{"q":"피스톤 링 중 압축 링의 주된 역할은?","o":["엔진오일을 실린더 벽에 도포한다.","연소실의 압축 압력을 유지한다.","피스톤의 온도를 낮춘다.","무해 배기가스를 배출한다."],"a":1,"e":{"w":["오일을 다루는 것은 오일 링입니다.","온도를 낮추는 것이 주된 역할은 아닙니다.","배기가스 배출과는 관계가 없습니다."],"d":"압축 링은 자체 탄성과 연소가스 압력으로 실린더 벽에 밀착해, 압축행정의 혼합기와 폭발행정의 고압 연소가스가 크랭크케이스로 새는 것을 막습니다. 압축압력이 지켜져야 출력이 나옵니다.\n압축 링이 마모되면 압축압력이 떨어지고 블로바이 가스가 늘어납니다. 오일을 긁어내리는 일은 오일 링의 역할입니다.","k":["압축 링 = 압축압력 유지(기밀 유지)","오일 링 = 남는 오일을 긁어내린다","압축 링 마모 = 압축 저하, 블로바이 증가"],"g":"ring","p":["rings"]}},{"q":"피스톤 링 중 오일 링(Oil Control Ring)의 주된 역할은?","o":["실린더 벽의 불필요한 엔진오일을 긁어내린다.","연소실의 압축 압력을 유지한다.","피스톤의 온도를 높인다.","엔진 소음을 줄인다."],"a":0,"e":{"w":["압축 압력을 유지하는 것은 압축 링입니다.","링은 온도를 높이는 부품이 아닙니다.","소음을 줄이는 부품이 아닙니다."],"d":"오일 링(Oil control ring)은 실린더 벽에 있는 오일의 양을 조절하고, 필요 이상의 오일을 긁어내려 연소실 유입을 막습니다.\n오일이 너무 많으면 연소실로 올라가 연료와 함께 타며 오일 소비 증가, 청색 또는 청백색 배기가스, 점화플러그 오염, 카본 축적이 생길 수 있습니다.\n오일 링은 과도한 오일을 긁어내려 오일 회수 구멍을 통해 크랭크케이스로 돌려보냅니다.","k":["오일 링 = 남는 오일을 긁어내려 크랭크케이스로 돌려보낸다","얇은 유막은 남겨 윤활을 돕는다","오일 링 불량 = 오일 소모 증가, 청색 배기가스"],"g":"ring"}},{"q":"피스톤에 장착되는 피스톤 핀의 주된 역할은?","o":["피스톤의 온도를 조절한다.","피스톤 링을 고정한다.","피스톤과 커넥팅 로드를 연결한다.","엔진오일을 순환시킨다."],"a":2,"e":{"w":["온도 조절은 핀의 역할이 아닙니다.","링은 링 홈에 끼워집니다.","오일 순환은 오일펌프의 역할입니다."],"d":"피스톤 핀은 피스톤과 커넥팅 로드의 소단부를 이어 주는 축입니다. 피스톤이 받은 폭발 압력은 피스톤 핀 → 커넥팅 로드 → 크랭크축 순서로 전달됩니다.\n피스톤은 직선 왕복운동을 하고 커넥팅 로드는 좌우로 꺾이므로, 피스톤 핀이 그 사이에서 관절 역할을 합니다. 큰 반복 하중을 받기 때문에 표면을 단단하게 처리하고, 무게를 줄이려고 속을 비운 원통으로 만듭니다.","k":["피스톤 핀 = 피스톤과 커넥팅 로드 소단부를 연결","힘의 전달 = 피스톤 → 피스톤 핀 → 커넥팅 로드 → 크랭크축","속이 빈 원통 = 가볍게 만들기 위해"],"g":"crank","p":["conrod"]}},{"q":"피스톤 상단의 헤드(크라운) 부분의 역할은?","o":["엔진오일을 저장한다.","배기가스를 정화한다.","흡입공기의 온도를 높인다.","폭발 압력을 받고 연소열에 직접 노출되는 부분이다."],"a":3,"e":{"w":["오일은 오일 팬에 저장합니다.","배기가스 정화는 촉매의 역할입니다.","흡입 공기의 온도를 높이는 부분이 아닙니다."],"d":"피스톤 헤드(크라운)는 피스톤의 맨 윗면으로, 연소실의 바닥이 되는 부분입니다. 폭발 압력을 직접 받아 피스톤을 아래로 밀어 주고, 연소열에도 직접 닿습니다.\n그래서 헤드는 두껍게 만들고, 받은 열은 피스톤 링을 거쳐 실린더 벽으로 내보냅니다. 측압을 받는 것은 스커트, 링을 끼우는 곳은 링 홈입니다.","k":["피스톤 헤드 = 폭발 압력과 연소열을 직접 받는다","스커트 = 측압을 받아 기울어짐 방지","링 홈 = 피스톤 링이 끼워지는 홈"],"g":"pist"}},{"q":"피스톤 측면에 있는 스커트 부분의 주된 역할은?","o":["피스톤 링을 지지한다.","연소가스를 배출한다.","피스톤의 기울어짐을 방지한다.","피스톤의 압축 압력을 직접 유지한다."],"a":2,"e":{"w":["링을 지지하는 것은 링 홈과 랜드입니다.","연소가스는 배기 밸브와 배기구로 나갑니다.","압축 압력을 유지하는 것은 피스톤 링입니다."],"d":"피스톤 스커트(Piston Skirt)는 피스톤의 아래쪽 측면으로, 커넥팅 로드의 측압(Side Thrust)을 받아 피스톤이 실린더 안에서 기울어지지 않고 안정적으로 왕복하도록 안내합니다.\n측압 지지 – 커넥팅 로드가 비스듬히 움직이며 발생하는 힘을 스커트가 받아줍니다.\n운동 안내 – 피스톤의 흔들림을 줄이고 실린더 벽과의 간극을 유지합니다.\n피스톤 슬랩(Piston Slap) 방지 – 스커트 마모 시 피스톤이 실린더 벽을 두드리는 현상이 발생합니다.\n스커트 마모로 간극이 커지면 피스톤이 실린더 벽을 두드리는 현상. 냉간 시 금속성 노크로 나타나며, 실린더 마모와 오일 소모를 유발할 수 있습니다.","k":["스커트 = 측압을 받아 피스톤의 기울어짐 방지","스커트 마모 = 피스톤 슬랩(실린더 벽을 치는 소음)","피스톤 슬랩은 냉간 시에 잘 들린다"],"g":"pist"}},{"q":"피스톤이 소결 현상으로 손상될 수 있는 주된 원인은?","o":["금속끼리 직접 접촉하여 용융되었을 때","엔진 오일량이 너무 많을 때","점화시기가 정상일 때","흡입공기가 많을 때"],"a":0,"e":{"w":["오일이 너무 많은 것은 소결의 원인이 아닙니다.","점화시기가 정상이면 문제가 없습니다.","흡입 공기가 많은 것은 원인이 아닙니다."],"d":"피스톤과 실린더가 과열 또는 윤활 불량으로 서로 눌어붙는 손상을 소결, 실제 정비 현장에서는 소착 또는 Seizure라고 더 많이 부른다.\n피스톤과 실린더 벽 사이에는 얇은 엔진오일 막이 있어 금속끼리 직접 닿지 않게 한다.\n엔진오일 부족, 윤활 불량, 엔진 과열, 피스톤 간극 부족, 냉각 불량이 생기면 오일막이 끊어진다.\n오일막이 끊어지면 금속이 직접 마찰하고, 마찰열 때문에 표면이 녹거나 달라붙어 엔진 고착으로 이어질 수 있다.","k":["소결 = 유막 끊김 → 금속 직접 접촉 → 눌어붙음","주된 원인은 과열과 윤활 불량","피스톤 간극이 작으면 소결, 크면 블로바이와 슬랩"]}},{"q":"피스톤 정비 시, 피스톤 압축 링의 간극을 조정하는 주된 이유는?","o":["흡입공기를 많이 흡입하기 위해","점화시기를 정확하게 작동하기 위해","기밀을 유지하기 위해","오일 소모를 줄이기 위해"],"a":2,"e":{"w":["흡입 공기량과는 관계가 없습니다.","점화시기와는 관계가 없습니다.","오일 소모를 줄이는 것은 오일 링의 역할입니다."],"d":"압축 링(Compression ring, 압축가스를 막는 링)은 연소실의 압축가스가 피스톤 아래쪽으로 새는 것을 줄여 준다.\n피스톤 링은 엔진이 뜨거워질 때 늘어나는 열팽창을 고려해 작은 틈이 필요.\n엔드갭이 너무 크면 압축가스가 새어 압축압력과 출력이 떨어지고, 블로바이(Blow-by, 연소가스가 아래쪽으로 새는 현상)가 늘어난다.\n반대로 너무 작으면 열팽창 후 링 끝이 맞닿아 링 파손, 실린더 손상, 피스톤 고착으로 이어질 수 있다.","k":["압축 링 = 기밀 유지","간극 과대 = 압축 누설","과소 = 열팽창 후 파손.고착 가능","제조사 규정 간극 확인"],"g":"gap","p":["endgap"]}},{"q":"오일 소모량 증가와 직접 관련된 피스톤 부품의 문제는?","o":["피스톤 핀의 휘어짐","피스톤 헤드의 균열","오일 링의 마모","스커트의 파손"],"a":2,"e":{"w":["피스톤 핀이 휘면 소음과 편마모가 생깁니다.","헤드에 균열이 생기면 압축이 샙니다.","스커트가 파손되면 소음과 피스톤 흔들림이 생깁니다."],"d":"엔진오일이 줄어드는 것은 오일이 연소실로 올라가 타기 때문입니다. 실린더 벽의 남는 오일을 긁어내리는 것이 오일 링이므로, 오일 링이 마모되거나 고착되면 오일이 연소실로 올라가 함께 탑니다.\n이때 오일 소모가 늘고 청색 또는 청백색 배기가스가 나오며, 점화플러그가 오염되고 카본이 쌓입니다.","k":["오일 소모 증가 = 오일 링 마모·고착","증상 = 청색 배기가스, 점화플러그 오염","압축 저하 = 압축 링 쪽 문제"],"g":"ring"}},{"q":"실린더 헤드에서 캠 베어링의 주된 역할은?","o":["밸브의 열을 흡수한다.","점화플러그를 고정한다.","캠축이 회전하도록 지지한다.","피스톤 작동을 원활하게 한다."],"a":2,"e":{"w":["밸브의 열을 흡수하는 것은 밸브 시트와 가이드입니다.","점화플러그는 헤드의 나사 구멍에 고정됩니다.","피스톤의 작동과는 관계가 없습니다."],"d":"캠축은 흡기밸브와 배기밸브가 정해진 시기에 열리고 닫히도록 움직인다.\n캠 베어링이 마모되면 캠축이 흔들리는 유격이 커지고, 금속성 소음이 날 수 있다\n캠축 위치가 흔들리면 밸브 타이밍(Valve timing, 밸브가 열리고 닫히는 시점)이 어긋나 출력 저하와 엔진 상태 불량으로 이어질 수 있다","k":["캠 베어링 = 캠축 지지","캠축 = 밸브 개폐 조절","베어링 마모 → 캠축 유격 증가 + 금속성 소음","유격 증가 → 밸브 타이밍 오차 가능"],"g":"head"}},{"q":"이륜자동차 엔진에서 실린더 헤드의 가장 주된 역할은?","o":["흡기 및 배기 밸브와 점화플러그가 장착되고 연소실의 상부를 구성한다.","크랭크축을 지지한다.","피스톤의 상하 운동을 직접적으로 유도한다.","피스톤의 작동을 원활하게 한다."],"a":0,"e":{"w":["크랭크축을 지지하는 것은 크랭크케이스입니다.","피스톤을 안내하는 것은 실린더입니다.","피스톤의 작동을 원활하게 하는 것은 윤활과 실린더 벽입니다."],"d":"실린더 헤드는 연소실 상부, 흡기·배기 포트, 흡기·배기 밸브와 점화플러그 장착부를 제공. 일부 엔진에서는 캠축(Camshaft, 밸브를 여닫는 축)과 밸브 기구도 지지. 공랭식 엔진에는 냉각핀, 수랭식 엔진에는 냉각수 통로가 만들어질 수 있다.","k":["실린더 헤드 = 연소실 윗부분","밸브 + 점화플러그 장착","흡기·배기 포트 형성","공랭식 냉각핀 / 수랭식 냉각수 통로"],"g":"head","p":["head"]}},{"q":"실린더 헤드에 장착되는 밸브 시트의 주된 역할은?","o":["연소실의 기밀을 유지한다.","밸브의 양정을 변화 시킨다.","밸브의 움직임을 좋게 한다.","밸브의 열림량을 크게 한다."],"a":0,"e":{"w":["밸브의 양정은 캠이 정합니다.","밸브의 움직임을 안내하는 것은 밸브 가이드입니다.","밸브의 열림량은 캠이 정합니다."],"d":"밸브 시트는 밸브가 닫힐 때 밸브 면이 맞닿는 자리입니다. 밸브와 시트가 빈틈없이 밀착해야 압축가스와 연소가스가 새지 않고 연소실의 기밀이 유지됩니다.\n밸브가 받은 열도 시트를 거쳐 실린더 헤드로 빠져나갑니다. 특히 배기밸브는 고온에 노출되므로 시트와의 접촉 상태가 중요합니다.\n시트가 마모되거나 손상되면 압축 누설, 시동 불량, 출력 저하, 밸브 과열과 소손이 생길 수 있습니다.","k":["밸브 시트 = 기밀 유지 + 열전달","시트 불량 = 압축 누설, 밸브 소손","밸브 가이드 = 밸브 스템의 움직임을 안내"],"g":"head","p":["head"]}},{"q":"실린더 헤드의 변형을 확인하는 주된 이유는?","o":["헤드의 연소실 면적을 확인하기 위해","압축 누설을 확인하기 위해","헤드의 높이를 점검하기 위해","피스톤과의 간극을 점검하기 위해"],"a":1,"e":{"w":["연소실 면적을 확인하려는 것이 아닙니다.","헤드의 높이를 점검하려는 것이 아닙니다.","피스톤과의 간극을 점검하려는 것이 아닙니다."],"d":"실린더 헤드(Cylinder head, 실린더 위쪽 덮개)가 휘거나 변형되면 블록과 헤드 사이의 가스켓(Gasket, 틈을 막는 씰)이 고르게 눌리지 못한다. 그러면 연소실의 높은 압축가스가 밖으로 새어 압축 누설이 생길 수 있다.\n실린더 헤드는 연소열을 반복해서 받는 부품입니다. 엔진이 과열되면 특히 알루미늄 헤드가 휘어질 수 있다.\n헤드가 평평하지 않으면 가스켓이 밀착하지 못해 압축가스, 냉각수(Coolant, 엔진을 식히는 액체), 엔진오일이 새는 문제가 생긴다.","k":["헤드 변형 = 가스켓 밀착 불량 → 압축 누설","점검 = 곧은 자 + 필러게이지로 평면도 측정","과열은 알루미늄 헤드 변형의 주원인"],"g":"flat"}},{"q":"헤드 볼트를 토크 렌치로 조이는 것이 중요한 이유는?","o":["실린더 헤드의 변형을 방지하고 균일한 체결력을 확보하기 위해","피스톤과의 접촉을 좋게 하기 위해","연소실의 면적을 줄이기 위해","볼트의 길이를 조절하기 위해"],"a":0,"e":{"w":["헤드 볼트는 피스톤과의 접촉과 관계가 없습니다.","연소실 면적과는 관계가 없습니다.","볼트의 길이를 조절하는 것이 아닙니다."],"d":"토크 렌치(Torque wrench, 정해진 힘으로 볼트를 조이는 공구)는 실린더 헤드 볼트를 규정된 힘으로 조여 준다. 이렇게 해야 헤드와 가스켓(Gasket, 틈을 막아 주는 밀봉 부품)이 한쪽으로 치우치지 않고 고르게 밀착된다.\n볼트를 너무 약하게 조이면 압축가스, 냉각수, 엔진오일이 샐 수 있다.\n반대로 너무 강하게 조이면 볼트가 늘어나거나 나사산이 망가지고, 실린더 헤드가 휘거나 가스켓이 손상될 수 있다.\n그래서 제조사가 정한 규정 토크(Specified torque, 정해진 조임 힘)와 조임 순서(Tightening sequence, 정해진 순서)를 따라 여러 단계로 조여야 한다.","k":["헤드 볼트 = 토크 렌치 사용","규정 토크 + 조임 순서 준수","약한 토크 → 누설","강한 토크 → 변형·파손"],"g":"torq","p":["torque"]}},{"q":"이륜자동차 엔진에서 실린더 블록의 가장 주된 역할은?","o":["엔진의 주요 회전 및 왕복 운동 부품들을 지지한다.","엔진오일을 저장하는 공간이다.","흡기 및 배기 밸브를 장착하는 부분이다.","배기가스를 외부로 배출하는 통로이다."],"a":0,"e":{"w":["오일은 오일 팬(크랭크케이스 아래)에 저장합니다.","밸브는 실린더 헤드에 장착합니다.","배기가스 통로는 배기 포트와 배기관입니다."],"d":"실린더 블록은 엔진의 뼈대입니다. 피스톤이 움직이는 실린더가 들어 있고, 크랭크축·피스톤·커넥팅 로드처럼 회전하고 왕복하는 주요 부품을 받쳐 줍니다.\n엔진 형식에 따라 냉각핀(공랭식)이나 워터 재킷(수랭식), 오일 통로, 부품 장착부가 함께 만들어집니다.","k":["실린더 블록 = 엔진의 뼈대, 주요 운동 부품을 지지","공랭식 = 냉각핀, 수랭식 = 워터 재킷","실린더 헤드 = 블록 위를 덮어 연소실을 만든다"]}},{"q":"실린더 블록 내의 실린더 보어의 주된 역할은?","o":["엔진오일을 저장한다.","점화플러그를 고정한다.","냉각수를 순환시킨다.","피스톤이 상하 왕복 운동하는 공간을 제공한다."],"a":3,"e":{"w":["오일은 오일 팬에 저장합니다.","점화플러그는 실린더 헤드에 고정됩니다.","냉각수는 실린더 둘레의 물 재킷을 따라 흐릅니다."],"d":"실린더 보어(Cylinder bore, 실린더 안쪽의 원통형 공간)는 피스톤(Piston, 위아래로 움직이는 부품)이 실제로 상사점과 하사점 사이를 왕복하는 자리. 보어 벽면은 피스톤 링(Piston ring, 압축과 오일을 조절하는 링)과 맞닿아 기밀과 윤활을 돕는다.\n실린더 보어는 피스톤의 왕복 운동을 안내하고, 연소압력을 견디며, 피스톤의 열을 실린더 쪽으로 전달. 보어 표면에는 얇은 엔진오일 막이 필요. 보어가 마모되면 원형이 흐트러지거나 내경이 커져 압축 누설, 출력 저하, 오일 소모 증가, 블로바이(Blow-by, 연소가스가 아래로 새는 현상), 피스톤 슬랩(Piston slap, 피스톤이 흔들리며 나는 소음)이 생길 수 있다.","k":["Bore = 실린더 내경 또는 원통형 내부 가공면","피스톤은 보어 안에서 왕복 운동","보어 마모 → 압축 저하 + 오일 소모 증가"],"g":"bore"}},{"q":"실린더 헤드 가스켓 접합면의 평면도를 필러 게이지와 정밀 직각자로 측정할 때 최대 변형 허용한도는?","o":["0.05 mm","0.50 mm","1.00 mm","1.50 mm"],"a":0,"e":{"w":["0.50mm는 가스켓으로 막을 수 없을 만큼 큰 변형입니다.","1.00mm는 한계를 크게 넘는 변형입니다.","1.50mm는 한계를 크게 넘는 변형입니다."],"d":"실린더 헤드 접합면은 곧은 자를 대고 생긴 틈에 필러게이지를 넣어 가로, 세로, 대각선 방향으로 측정합니다.\n소형 엔진의 변형 한계는 0.05mm 정도로 매우 작으며, 넘으면 면을 수정하거나 헤드를 교환합니다. 정확한 한계값은 차종별 정비지침서를 따릅니다."}},{"q":"피스톤에 3개의 피스톤 링을 장착할 때 압축 누설 및 엔진오일 연소를 최소화하기 위한 엔드 갭(이음매) 간격 배치는?","o":["동일한 축 방향 일치","90도 등간격 배치","120도 등간격 분산","180도 대향 배치"],"a":2,"e":{"w":["이음매를 한 줄로 맞추면 그 틈으로 압축가스가 그대로 샙니다.","90도는 링 3개를 고르게 나눈 각도가 아닙니다.","180도는 링이 2개일 때 고르게 나눈 각도입니다."],"d":"링의 이음매(엔드 갭)가 한 줄로 서면 그 틈으로 압축가스가 새고 오일이 올라옵니다.\n링이 3개이면 360도를 3으로 나눈 120도씩 어긋나게 배치해 가스가 빠져나가는 길을 길게 만듭니다."}},{"q":"수랭식 냉각라인에서 왁스 펠릿형 서모스탯(수온조절기) 밸브가 개방을 개시하는 일반적인 온도는?","o":["35~40 ℃","55~60 ℃","75~80 ℃","100~110 ℃"],"a":2,"e":{"w":["35~40℃에서 열리면 엔진이 데워지기 전에 식어 과냉이 됩니다.","55~60℃에서 열리면 정상 작동 온도까지 오르지 못합니다.","100~110℃에서 열리면 그 전에 엔진이 과열됩니다."],"d":"서모스탯은 안에 든 왁스가 온도에 따라 팽창하는 힘으로 밸브를 엽니다.\n냉각수 온도가 낮을 때는 닫혀 있어 엔진이 빨리 데워지고, 약 75~80℃ 부근에서 열리기 시작해 냉각수를 라디에이터로 보냅니다. 정확한 개방 온도는 차종별 규정값을 따릅니다."}},{"q":"정밀 치수 측정 시 측정 오차를 최소화하기 위해 '측정 대상물과 기준 눈금선이 일직선상에 위치해야 한다'는 측정학 원리는?","o":["파스칼의 법칙","아베의 원리 (Abbe's Principle)","베르누이의 법칙","플레밍의 법칙"],"a":1,"e":{"w":["파스칼의 원리는 밀폐된 액체의 압력 전달에 관한 원리입니다.","베르누이의 정리는 유체의 속도와 압력의 관계입니다.","플레밍의 법칙은 전류, 자기장, 힘의 방향에 관한 법칙입니다."],"d":"아베의 원리는 측정하려는 길이와 측정기의 눈금이 같은 일직선 위에 있어야 오차가 작다는 원리입니다.\n마이크로미터는 측정축과 눈금이 일직선에 있어 아베의 원리를 만족하고, 버니어 캘리퍼스는 눈금과 측정 위치가 떨어져 있어 조(jaw)가 기울면 오차가 생깁니다."}}]},{"g":"섀시","name":"제동장치","id":"p01","qs":[{"q":"유압식 브레이크의 원리는?","o":["베르누이의 원리","파스칼의 원리","애커먼 장토식의 원리","렌츠의 원리"],"a":1,"e":{"w":["베르누이의 원리는 유체의 속도와 압력의 관계입니다.","애커먼 장토식은 조향장치의 원리입니다.","렌츠의 원리는 유도 전류의 방향에 관한 법칙입니다."],"d":"유압식 브레이크는 밀폐된 액체에 가한 압력이 모든 방향으로 같은 크기로 전달된다는 파스칼의 원리를 이용합니다. 베르누이는 유속과 압력, 애커먼 장토식은 조향, 렌츠는 유도 전류의 방향에 관한 원리입니다."}},{"q":"제동장치의 구비조건이 아닌 것은?","o":["제동 효과가 클 것","신뢰성이 좋을 것","화재에 견디는 내열성이 클 것","정비가 용이할 것"],"a":2,"e":{"w":["제동 효과가 큰 것은 구비조건입니다.","신뢰성이 좋은 것은 구비조건입니다.","정비가 쉬운 것은 구비조건입니다."],"d":"제동장치의 구비조건은 제동 효과, 신뢰성, 내구성, 점검·정비의 용이함입니다. 화재에 견디는 내열성은 구비조건에 들어 있지 않습니다."}},{"q":"유압 브레이크의 설명으로 틀린 것은?","o":["제동력 전달이 동일하여 마찰 손실이 적다.","바퀴 위치가 변경되어도 설계가 용이하다.","유압회로에 약간의 공기가 침투하여도 제동 손실이 없다.","페달을 밟는 힘을 적게 할 수 있다."],"a":2,"e":{"w":["유압은 고르게 전달되어 마찰 손실이 적습니다. 옳은 설명입니다.","파이프와 호스로 연결하므로 설계가 쉽습니다. 옳은 설명입니다.","유압으로 힘을 키우므로 조작력이 작아도 됩니다. 옳은 설명입니다."],"d":"유압회로에 공기가 들어가면 공기가 압축되어 압력이 제대로 전달되지 않으므로 제동력이 떨어집니다."}},{"q":"유압식 브레이크의 장점이 아닌 것은?","o":["마찰 손실이 적다.","조작력이 작아도 된다.","제동력이 모든 바퀴에 균일하게 전달된다.","오일이 약간 누출되어도 작동에 이상 없다."],"a":3,"e":{"w":["마찰 손실이 적은 것은 장점입니다.","조작력이 작아도 되는 것은 장점입니다.","제동력이 균일하게 전달되는 것은 장점입니다."],"d":"오일이 조금이라도 새면 유압이 떨어져 제동이 되지 않을 수 있습니다. ①②③은 유압식 브레이크의 장점입니다."}},{"q":"유압식 브레이크 파이프에 사용되는 재료는?","o":["강","구리","주철","알루미늄"],"a":0,"e":{"w":["구리는 무르고 높은 유압에 약합니다.","주철은 깨지기 쉬워 파이프로 쓰지 않습니다.","알루미늄은 강도가 부족합니다."],"d":"브레이크 파이프는 높은 유압에 견뎌야 하므로 강(강관)을 씁니다."}},{"q":"이륜자동차 브레이크 오일을 주기적으로 교환해야 하는 이유는?","o":["제동 성능이 저하되기 때문","엔진 성능이 저하되기 때문","체인 소음을 줄이기 위해","브레이크 디스크 마모 방지"],"a":0,"e":{"w":["브레이크 오일은 엔진 성능과 관계가 없습니다.","체인 소음과는 관계가 없습니다.","디스크의 마모는 오일 교환과 관계가 없습니다."],"d":"브레이크 오일은 공기 중의 수분을 흡수합니다. 수분이 섞이면 비등점이 낮아져 베이퍼록이 생기기 쉬우므로 제동 성능이 떨어집니다."}},{"q":"이륜자동차 디스크 브레이크액을 교환하거나 보충하는 이유는?","o":["브레이크 패드 마모 방지","브레이크 오일 점도 조절","브레이크 내 수분 혼입하기 위해","브레이크 디스크 마모 방지"],"a":1,"e":{"w":["패드의 마모는 브레이크액과 관계가 없습니다.","수분이 섞이면 안 됩니다. 수분을 넣으려고 교환하는 것이 아닙니다.","디스크의 마모는 브레이크액과 관계가 없습니다."],"d":"오래된 브레이크액은 수분을 흡수해 점도와 비등점 같은 성질이 변하므로, 교환하거나 보충해 알맞은 상태로 유지합니다. ①④ 패드나 디스크의 마모와는 관계가 없습니다."}},{"q":"이륜자동차의 제동액 저장장치에 대한 규정 중 맞는 것은?","o":["덮개를 열어야만 제동액의 유량 수준을 확인할 수 있어야 한다.","제동액은 외부 공기와 항상 접촉되어 있어야 한다.","덮개를 열지 않아도 유량 수준을 확인할 수 있는 구조여야 한다.","제동액 저장장치에는 별도의 덮개가 필요 없다."],"a":2,"e":{"w":["덮개를 열지 않고도 확인할 수 있어야 합니다.","제동액은 수분을 흡수하므로 공기와 닿지 않게 해야 합니다.","저장장치에는 덮개가 있어야 합니다."],"d":"제동액 저장장치는 덮개를 열지 않고도 유량 수준을 확인할 수 있는 구조여야 합니다."}},{"q": 은?","o":["타이어 공기압","엔진오일 교환 시기","브레이크 제동력, 제동 시 이상 소음 유무","타이어 제조일자"],"a":2,"e":{"w":["공기압은 브레이크 시스템의 최종 점검 항목이 아닙니다.","엔진오일 교환 시기는 관계가 없습니다.","타이어 제조일자는 관계가 없습니다."],"d":"최종 점검에서는 브레이크가 제대로 듣는지(제동력)와 제동할 때 이상 소음이 없는지 확인합니다."}},{"q":"이륜자동차 브레이크 시스템 점검 후, 브레이크 레버나 페달을 여러 번 작동시켜야 하는 이유는?","o":["브레이크 오일 온도를 높이기 위해","브레이크 오일을 섞이게 하기 위해","브레이크 유압 시스템 내의 압력을 정상화하기 위해","브레이크 레버의 길이를 조절하기 위해"],"a":2,"e":{"w":["오일의 온도를 높이려는 것이 아닙니다.","오일을 섞으려는 것이 아닙니다.","레버의 길이를 조절하는 것이 아닙니다."],"d":"점검이나 정비 뒤에는 레버나 페달을 여러 번 작동시켜 패드를 디스크에 밀착시키고 유압을 정상으로 되돌립니다."}},{"q":"브레이크액 취급 시 주의사항이 아닌 것은?","o":["지정된 브레이크액을 사용하고 성분이 다른 오일과 혼합하여 사용해도 좋다.","엔진의 오일이나 광물성 오일을 절대로 주입하지 않도록 한다.","브레이크액의 용기는 필요에 따라서 보충해야 하기 때문에 보관해야 한다.","브레이크액이 도장 면에 떨어지면 침식하기 때문에 취급 시 주의해야 한다."],"a":0,"e":{"w":["엔진 오일이나 광물성 오일을 넣으면 고무 부품이 상하므로 넣지 않습니다. 옳은 주의사항입니다.","브레이크액 용기에 관한 옳은 주의사항입니다.","브레이크액은 도장면을 침식하므로 조심해서 다룹니다. 옳은 주의사항입니다."],"d":"성분이 다른 브레이크액을 섞으면 변질되거나 고무 부품이 상할 수 있으므로 지정된 브레이크액만 씁니다."}},{"q":"브레이크 오일이 비등하여 송유 압력의 전달 작용이 불가능하게 되는 현상은?","o":["페이드 현상","사이클링 현상","베이퍼록 현상","브레이크록 현상"],"a":2,"e":{"w":["페이드는 마찰면이 과열되어 마찰계수가 떨어지는 현상입니다.","사이클링 현상은 이 현상의 이름이 아닙니다.","브레이크록은 바퀴가 잠기는 것을 말합니다."],"d":"브레이크 오일이 끓어 기포가 생기고 압력이 전달되지 않는 현상이 베이퍼록입니다. 페이드는 마찰면 과열로 마찰계수가 떨어지는 현상입니다."}},{"q":"캘리퍼 점검으로 옳지 않은 것은?","o":["캘리퍼의 마모, 손상, 균열 및 먼지를 점검한다.","피스톤의 먼지, 손상, 균열 및 내측 면 마모를 점검한다.","패드 스프링 및 부트의 손상을 점검한다.","슬리브 및 핀의 마모와 먼지를 점검한다."],"a":1,"e":{"w":["캘리퍼의 마모, 손상, 균열, 먼지를 점검합니다. 옳은 설명입니다.","패드 스프링과 부트의 손상을 점검합니다. 옳은 설명입니다.","슬리브와 핀의 마모와 먼지를 점검합니다. 옳은 설명입니다."],"d":"캘리퍼 피스톤은 실린더와 맞닿는 바깥 면(외측 면)이 닳으므로 외측 면의 마모를 점검합니다. 내측 면은 점검 대상이 아닙니다."}},{"q":"이륜자동차 브레이크 점검방법에 대한 설명으로 틀린 내용은?","o":["브레이크 레버 유격은 이륜자동차를 가볍게 움직이면서 레버를 당겨서 점검하고 필요할 때 조정해야 한다.","브레이크 패드와 디스크 원판은 수시로 점검하고 디스크의 마모로 인한 소음이 발생하면 즉시 교체해야 한다.","브레이크 호스의 누유 부분이 발생하는가 수시로 점검해야 한다.","브레이크 오일은 정비 매뉴얼에 제시한 주행거리와 관계없이 교체하지 않고 보충하면 된다."],"a":3,"e":{"w":["레버 유격을 점검하는 옳은 방법입니다.","패드와 디스크는 수시로 점검합니다. 옳은 설명입니다.","호스의 누유는 수시로 점검합니다. 옳은 설명입니다."],"d":"브레이크 오일은 수분을 흡수해 성능이 떨어지므로 정비 매뉴얼에 제시된 주기에 맞춰 교체해야 합니다. 보충만으로는 안 됩니다."}},{"q":"드럼 브레이크에 비해 디스크 브레이크가 가지는 특징에 대한 설명으로 옳지 않은 것은?","o":["냉각성능이 좋기 때문에 제동성능을 안정적으로 낼 수 있다.","구조가 간단하고 부품 수가 적어서 정비가 쉽다.","마찰면적이 적어 상대적으로 큰 패드 압착력을 필요로 한다.","자기작동작용이 있기 때문에 고속에서 반복적으로 사용해도 제동력의 변화가 적다."],"a":3,"e":{"w":["디스크가 밖으로 드러나 있어 냉각이 잘 되고 제동이 안정적입니다. 옳은 설명입니다.","구조가 간단하고 부품이 적어 정비가 쉽습니다. 옳은 설명입니다.","마찰 면적이 작아 패드를 세게 눌러야 합니다. 옳은 설명입니다."],"d":"자기작동작용은 드럼 브레이크의 특징입니다. 디스크 브레이크는 자기작동작용이 없어 제동력의 변화가 적고 안정적입니다."}},{"q":"유압식 디스크 브레이크의 레버 조작력이 캘리퍼 피스톤으로 손실 없이 균일하게 전달되는 물리적 기본 법칙은?","o":["베르누이의 정리","파스칼의 원리 (Pascal's Principle)","옴의 법칙","후크의 법칙"],"a":1,"e":{"w":["베르누이의 정리는 유체의 속도와 압력의 관계입니다.","옴의 법칙은 전압, 전류, 저항의 관계입니다.","후크의 법칙은 스프링의 힘과 변형량의 관계입니다."],"d":"밀폐된 용기 안의 액체 한 곳에 압력을 가하면, 그 압력이 액체의 모든 부분에 같은 크기로 전달됩니다. 이것이 파스칼의 원리입니다.\n브레이크 레버로 마스터 실린더를 누르면 같은 압력이 캘리퍼에 전달되고, 캘리퍼 피스톤의 면적이 더 크기 때문에 더 큰 힘으로 패드를 밀어 줍니다."}},{"q":"다이얼 게이지를 로터 표면에 접촉하여 회전시켰을 때 브레이크 디스크의 허용 최대 런아웃(휨) 한계값은?","o":["0.03 mm","0.30 mm","3.00 mm","30.0 mm"],"a":1,"e":{"w":["0.03mm는 한계값으로 보기에는 지나치게 작은 값입니다.","3.00mm는 눈으로도 보이는 큰 휨입니다.","30.0mm는 있을 수 없는 값입니다."],"d":"디스크 런아웃은 디스크가 돌 때 좌우로 흔들리는 양입니다. 다이얼 게이지를 디스크 면에 직각으로 대고 바퀴를 천천히 돌려 지침이 움직인 폭을 읽습니다.\n한계값은 보통 0.3mm 정도이며, 넘으면 레버가 떨리고 패드가 한쪽으로 닳습니다. 정확한 한계값은 차종별 정비지침서를 따릅니다."}},{"q":"유압 제동 배관에 기포(공기)가 혼입되어 브레이크 레버를 잡았을 때 푹신거리며 제동력이 급격히 상실되는 현상은?","o":["페이드 현상","스펀지 현상 (Sponge Effect)","타이어 블로우","캘리퍼 피스톤 고착"],"a":1,"e":{"w":["페이드 현상은 마찰열로 패드의 마찰력이 떨어지는 현상입니다.","타이어 블로우는 타이어가 파열되는 것입니다.","캘리퍼 피스톤 고착은 브레이크가 풀리지 않거나 끌리는 고장입니다."],"d":"브레이크액은 눌러도 부피가 거의 줄지 않아 힘을 그대로 전달하지만, 공기는 쉽게 압축됩니다.\n유압 라인에 공기가 들어가면 레버를 잡는 힘이 공기를 누르는 데 쓰여 레버가 스펀지처럼 푹신하게 들어가고 제동력이 떨어집니다. 이때는 공기 빼기 작업을 합니다."}},{"q":"브레이크 오일의 비등점이 저하되어 마찰열에 의해 오일 내부에 증기 기포가 형성되고 제동 불능에 빠지는 현상은?","o":["수막현상","베이퍼 록 (Vapor Lock)","열변형","연성 파괴"],"a":1,"e":{"w":["수막현상은 타이어가 물 위에 뜨는 현상입니다.","열변형은 부품이 열로 휘는 것으로, 기포와 관계가 없습니다.","연성 파괴는 재료가 늘어나며 파괴되는 현상입니다."],"d":"브레이크액은 수분을 흡수하면 끓는점이 낮아집니다. 긴 내리막에서 브레이크를 계속 쓰면 마찰열로 브레이크액이 끓어 기포가 생기고, 기포가 압축되면서 압력이 전달되지 않습니다. 이것이 베이퍼 록입니다.\n브레이크액을 주기적으로 교환하고, 내리막에서는 엔진 브레이크를 함께 써서 예방합니다."}}]},{"g":"섀시","name":"조향장치","id":"p02","qs":[{"q":"조향장치에 관한 설명으로 틀린 것은?","o":["방향 전환을 원활하게 한다.","스티어링 샤프트와 프론트 서스펜션의 위치 변경으로 주행에 영향을 줄 수 없다.","조향핸들의 회전과 바퀴의 선회 차이가 크지 않아야 한다.","탑 브릿지를 고정하는 스템 너트는 규정 토크로 체결한다."],"a":1,"e":{"w":["조향장치는 주행 방향을 원활하게 바꾸는 장치입니다. 옳은 설명입니다.","핸들을 돌린 만큼 바퀴가 따라 돌아야 합니다. 옳은 설명입니다.","스템 너트는 정비지침서에 정해진 규정 토크로 조입니다. 옳은 설명입니다."],"d":"스티어링 샤프트와 프론트 서스펜션의 위치나 각도가 바뀌면 캐스터와 트레일이 달라져 주행 안정성과 조향 감각에 영향을 줍니다. 영향을 줄 수 없다는 ②가 틀린 설명입니다."}},{"q":"이륜자동차 핸들이 움직일 때 ‘덜그럭’하는 소리가 나거나 흔들린다면, 무엇을 의심해야 하는가?","o":["엔진 각부 베어링","브레이크 패드","휠 베어링","핸들 안쪽 베어링"],"a":3,"e":{"w":["엔진 베어링은 핸들의 움직임과 관계가 없습니다.","브레이크 패드는 핸들의 흔들림과 관계가 없습니다.","휠 베어링이 나쁘면 바퀴가 돌 때 소리가 납니다. 핸들을 움직일 때의 소리가 아닙니다."],"d":"핸들 안쪽의 스티어링 베어링이 닳거나 느슨하면 핸들을 움직일 때 덜그럭거리고 흔들립니다."}},{"q":"이륜자동차 핸들의 유격이 과도하거나 움직임이 뻑뻑할 때 점검해야 할 부품은?","o":["스티어링 베어링","클러치 케이블","스로틀 케이블","브레이크 패드"],"a":0,"e":{"w":["클러치 케이블은 핸들의 유격과 관계가 없습니다.","스로틀 케이블은 핸들의 유격과 관계가 없습니다.","브레이크 패드는 조향과 관계가 없습니다."],"d":"스티어링 베어링의 조임이 느슨하면 유격이 커지고, 너무 조이거나 손상되면 움직임이 뻑뻑해집니다. ②③④는 핸들 유격과 관계없는 부품입니다."}},{"q":"이륜자동차의 앞바퀴가 좌우로 흔들리거나 불 안정할 때, 점검해야 할 부품은?","o":["시트 조립 상태","브레이크 패드 마모 상태","프론트 포크의 상태","소음기 조립 상태"],"a":2,"e":{"w":["시트는 앞바퀴의 흔들림과 관계가 없습니다.","패드 마모로 앞바퀴가 좌우로 흔들리지는 않습니다.","소음기는 조향과 관계가 없습니다."],"d":"프론트 포크가 휘었거나 고정 상태가 나쁘면 앞바퀴가 좌우로 흔들리고 불안정해집니다."}},{"q":"이륜자동차 휠 베어링에 유격이 있거나 소음이 발생할 때, 주행 중 나타날 수 있는 현상은?","o":["주행 중 휠에서 비정상적인 소음이 발생한다.","엔진 소음이 증가한다.","배기 소음이 증가한다.","주행 중 발전기에서 비정상적인 소음이 발생 한다."],"a":0,"e":{"w":["엔진 소음은 휠 베어링과 관계가 없습니다.","배기 소음은 휠 베어링과 관계가 없습니다.","발전기 소음은 휠 베어링과 관계가 없습니다."],"d":"휠 베어링에 유격이 있거나 손상되면 주행 중 휠에서 비정상적인 소음이 납니다. 엔진, 배기, 발전기 소음과는 관계가 없습니다."}},{"q":"이륜자동차에 사용되고 있는 핸들의 종류가 아닌 것은?","o":["업 핸들","플랫 핸들","틸트 스티어링 휠","클립온 핸들"],"a":2,"e":{"w":["업 핸들은 위로 올라온 형태의 이륜자동차 핸들입니다.","플랫 핸들은 일자에 가까운 형태의 이륜자동차 핸들입니다.","클립온 핸들은 포크에 직접 고정하는 분리형 이륜자동차 핸들입니다."],"d":"틸트 스티어링 휠은 자동차에서 각도를 조절하는 조향 핸들입니다. 이륜자동차 핸들에는 업 핸들, 플랫 핸들, 클립온(세퍼레이트) 핸들이 있습니다."}},{"q":"타이어 회전이 무거울 때 그 원인이 아닌 것은?","o":["타이어 공기압이 높다.","타이어 과대 마모","베어링 어져  댐핑이 너무 강하면 늘어나는 속도가 느려, 요철을 지난 뒤에도 서스펜션이 다 펴지지 않는 느낌을 줍니다."}},{"q":"이륜자동차 프론트 포크 오일을 주기적으로 교환해야 하는 주된 이유는?","o":["엔진의 성능을 높이기 위해","오일이 오염되거나 점도가 변하기 때문","브레이크 성능을 향상시키기 위해","타이어의 수명을 연장하기 위해"],"a":1,"e":{"w":["포크 오일은 엔진 성능과 관계가 없습니다.","브레이크 성능과는 관계가 없습니다.","타이어 수명을 늘리려는 것이 아닙니다."],"d":"포크 오일은 쓰는 동안 오염되고 점도가 변해 감쇠력이 떨어지므로 주기적으로 교환합니다."}},{"q":"이륜자동차 서스펜션의 작동 범위가 너무 짧게 느껴지고, 작은 요철에도 충격이 심하게 올라 온다면 무엇을 의심할 수 있는가?","o":["타이어 공기압이 너무 낮다.","브레이크 작동이 불량하다.","서스펜션 스프링이 너무 단단하다.","서스펜션 스프링이 너무 부드럽다."],"a":2,"e":{"w":["공기압이 낮으면 오히려 물렁하게 느껴집니다.","브레이크는 관계가 없습니다.","스프링이 부드러우면 작동 범위가 길게 느껴집니다."],"d":"스프링이 너무 단단하면 잘 눌리지 않아 작동 범위가 짧게 느껴지고 작은 요철의 충격도 그대로 올라옵니다."}},{"q":"이륜자동차 서스펜션의 프리로드를 높게 조절 했을 때, 승차감에 주는 영향은?","o":["승차감이 더 부드러워진다.","승차감이 매우 나빠진다.","승차감에 변화가 없다.","승차감이 더 단단해진다."],"a":3,"e":{"w":["프리로드를 높이면 부드러워지지 않습니다.","단단해질 뿐 매우 나빠지는 것은 아닙니다.","승차감이 달라집니다."],"d":"프리로드를 높이면 스프링이 미리 더 눌려 있어 승차감이 단단해집니다."}},{"q":"이륜자동차 앞 서스펜션의 주요 구성 부품이 아닌 것은?","o":["이너 튜브","스프로킷","포크 스프링","아우터 튜브"],"a":1,"e":{"w":["이너 튜브는 앞 서스펜션(프론트 포크)의 부품입니다.","포크 스프링은 앞 서스펜션의 부품입니다.","아우터 튜브는 앞 서스펜션의 부품입니다."],"d":"스프로킷은 체인을 거는 동력전달장치 부품입니다. 이너 튜브, 포크 스프링, 아우터 튜브는 앞 서스펜션의 구성 부품입니다."}},{"q":"이륜자동차가 울퉁불퉁한 길을 지나갈 때 충격을 줄여주는 장치는?","o":["시트","서스펜션","브레이크","핸들"],"a":1,"e":{"w":["시트는 앉는 곳입니다.","브레이크는 속도를 줄이는 장치입니다.","핸들은 방향을 조종하는 장치입니다."],"d":"울퉁불퉁한 길의 충격을 줄여 주는 장치는 서스펜션입니다."}},{"q":"현가장치에서 승차감을 위주로 고려할 때의 방법으로 설명이 틀린 것은?","o":["스프링 아래 질량은 가벼울수록 좋다.","스프링 상수는 낮을수록 좋다.","스프링 위 질량은 클수록 좋다.","스프링 아래 질량은 클수록 좋다."],"a":3,"e":{"w":["스프링 아래 질량은 가벼울수록 승차감이 좋습니다. 옳은 설명입니다.","스프링 상수가 낮을수록 부드럽습니다. 옳은 설명입니다.","스프링 위 질량이 클수록 차체가 덜 흔들립니다. 옳은 설명입니다."],"d":"승차감을 좋게 하려면 스프링 아래 질량은 가벼울수록, 스프링 상수는 낮을수록, 스프링 위 질량은 클수록 좋습니다. 스프링 아래 질량이 크면 승차감이 나빠집니다."}},{"q":"이륜자동차 서스펜션에서 쇽업소버의 역할은?","o":["이륜자동차의 무게를 지지한다.","이륜자동차의 높이를 조절한다.","스프링의 진동을 적절히 억제한다.","스프링의 진동을 높여 충격을 준다."],"a":2,"e":{"w":["무게를 지지하는 것은 스프링입니다.","높이를 조절하는 장치가 아닙니다.","진동을 키우는 것이 아니라 억제합니다."],"d":"쇽업소버는 스프링의 진동을 알맞게 억제합니다. ① 무게를 지지하는 것은 스프링입니다."}},{"q":"이륜자동차 서스펜션 스프링이 약해졌을 때, 나타날 수 있는 증상은?","o":["이륜자동차가 쉽게 내려앉고 과도하게 출렁 거린다.","이륜자동차 승차감이 딱딱해진다.","서스펜션 스프링이 너무 단단해진다.","이륜자동차 차고가 높아진다."],"a":0,"e":{"w":["스프링이 약해지면 딱딱해지는 것이 아니라 물렁해집니다.","스프링이 단단해지는 것이 아닙니다.","차고는 낮아집니다."],"d":"스프링이 약해지면 차체가 쉽게 내려앉고 지나치게 출렁거립니다."}},{"q":"이륜자동차 서스펜션이 너무 물렁하거나 딱딱 할 때 발생할 수 있는 주행 문제는?","o":["브레이크 성능이 향상된다.","노면 충격 흡수 불량 및 승차감 저하된다.","연료 소모량이 감소한다.","엔진 시동이 어려워진다."],"a":1,"e":{"w":["브레이크 성능이 좋아지지 않습니다.","연료 소모와는 관계가 없습니다.","시동과는 관계가 없습니다."],"d":"서스펜션이 너무 물렁하거나 딱딱하면 노면 충격을 제대로 흡수하지 못하고 승차감이 나빠집니다."}},{"q":"이륜자동차 리어 서스펜션이 너무 부드럽게 느껴지고 쉽게 바닥에 닿는다면, 무엇을 의심할 수 있는가?","o":["타이어 공기압 과다","서스펜션 스프링의 약화","브레이크 오일 부족","체인 장력 과다"],"a":1,"e":{"w":["공기압이 지나치게 높으면 오히려 딱딱하게 느껴집니다.","브레이크 오일과는 관계가 없습니다.","체인 장력과는 관계가 없습니다."],"d":"리어 서스펜션이 너무 부드럽고 쉽게 바닥에 닿으면 스프링이 약해진 것을 의심합니다."}},{"q":"주행 중 노면 충격으로 차체 전체가 무게중심을 기준으로 수직 상하 요동하는 진동 거동 명칭은?","o":["바운싱 (Bouncing)","롤링 (Rolling)","피칭 (Pitching)","드리프팅"],"a":0,"e":{"w":["롤링은 차체가 좌우로 기울어지는 운동입니다.","피칭은 차체의 앞뒤가 번갈아 오르내리는 운동입니다.","드리프팅은 차체 진동의 명칭이 아닙니다."],"d":"차체 전체가 수직 방향으로 위아래로 움직이는 진동이 바운싱입니다.\n바운싱 = 상하 운동, 피칭 = 앞뒤 끄덕임, 롤링 = 좌우 기울어짐, 요잉 = 수직축 중심 회전으로 구분합니다."}},{"q":"서스펜션 압축 후 스프링이 본래 상태로 인장 복원될 때의 신장 속도를 제어하여 흔들림을 억제하는 기구는?","o":["프리로드 링","압축(컴프레션) 밸브","리바운드 댐퍼 (Rebound Damping)","범프 스토퍼"],"a":2,"e":{"w":["프리로드 링은 스프링을 미리 눌러 두는 양을 조절합니다.","압축 밸브는 서스펜션이 눌릴 때의 속도를 제어합니다.","범프 스토퍼는 서스펜션이 끝까지 눌릴 때의 충격을 줄여 줍니다."],"d":"서스펜션이 눌렸다가 스프링의 힘으로 다시 늘어날 때, 그 속도를 오일의 저항으로 늦춰 주는 것이 리바운드(신장) 댐핑입니다.\n리바운드 댐핑이 약하면 차체가 출렁거리고, 너무 강하면 서스펜션이 제때 돌아오지 못해 연속된 요철에서 접지력이 떨어집니다."}}]},{"g":"섀시","name":"휠·타이어","id":"p04","qs":[{"q":"이륜자동차 휠 림의 변형을 육안으로 확인하는 방법 중 가장 일반적인 것은?","o":["엔진 소리를 듣는다.","타이어 공기압을 측정한다.","좌우 또는 상하로 흔들리는지 확인한다.","브레이크 패드 두께를 측정한다."],"a":2,"e":{"w":["엔진 소리로는 림의 변형을 알 수 없습니다.","공기압 측정으로는 림의 변형을 알 수 없습니다.","패드 두께와는 관계가 없습니다."],"d":"휠을 띄워 돌려 보면서 림이 좌우나 상하로 흔들리는지 눈으로 확인합니다."}},{"q":"이륜자동차 휠 림이 심하게 휘었을 때, 주행 중 발생할 수 있는 가장 위험한 상황은?","o":["엔진 출력 감소","타이어 편 마모 및 주행 불안정성","엔진 출력 증가","제동력 증가"],"a":1,"e":{"w":["엔진 출력과는 관계가 없습니다.","엔진 출력이 늘어나지 않습니다.","제동력이 늘어나지 않습니다."],"d":"림이 심하게 휘면 타이어가 고르게 닿지 않아 편마모가 생기고 주행이 불안정해집니다."}},{"q":"이륜자동차의 휠에 대한 설명으로 틀린 것은?","o":["휠은 가벼울수록 운동성이 좋다.","휠은 강성은 중요하지만 탄성은 고려할 필요가 없다.","주로 알루미늄 스포크 휠을 주로 사용한다.","고급형 휠은 단조형 알루미늄 스포크 휠을 주로 사용한다."],"a":1,"e":{"w":["휠은 가벼울수록 운동성이 좋습니다. 옳은 설명입니다.","알루미늄 휠을 주로 씁니다. 옳은 설명입니다.","고급형은 단조 알루미늄 휠을 씁니다. 옳은 설명입니다."],"d":"휠은 강성뿐 아니라 충격을 받아내는 탄성도 함께 고려해야 합니다."}},{"q":"이륜자동차의 휠 밸런스가 맞지 않을 때, 주행 중 어떤 증상이 나타날 수 있는가?","o":["특정 속도에서 핸들이 떨린다.","브레이크 성능이 향상된다.","접지력이 좋아진다.","엔진 출력이 증가한다."],"a":0,"e":{"w":["브레이크 성능이 좋아지지 않습니다.","접지력이 좋아지지 않습니다.","엔진 출력과는 관계가 없습니다."],"d":"휠 밸런스가 맞지 않으면 특정 속도에서 진동이 커져 핸들이 떨립니다."}},{"q":"이륜자동차의 휠의 점검 내용 중 옳지 않은 것은?","o":["휠을 들어 올린 후에 림의 가로 및 세로 방향의 흔들림을 점검한다.","스포크 휠의 흔들림은 스포크를 조여서 수정한다.","풀려있는 스포크는 니플랜지를 사용하여 흔들림을 수정한다.","캐스팅 휠의 흔들림이 발생하면 흔들림을 수정한다."],"a":3,"e":{"w":["휠을 들어 올려 림의 흔들림을 점검합니다. 옳은 설명입니다.","스포크 휠의 흔들림은 스포크를 조여 수정합니다. 옳은 설명입니다.","풀린 스포크는 니플 렌치로 조여 수정합니다. 옳은 설명입니다."],"d":"캐스팅 휠은 한 덩어리로 주조한 휠이라 흔들림을 수정할 수 없고 교환해야 합니다. 스포크 휠은 스포크를 조여 흔들림을 수정합니다."}},{"q":"이륜자동차 휠의 스포크 타입 휠에서 스포크가 느슨해졌을 때, 발생할 수 있는 것은?","o":["휠의 강성이 약해져 변형되거나 파손될 위험이 있다.","핸들이 떨린다.","브레이크 패드가 편마모된다.","엔진 소음이 커진다."],"a":0,"e":{"w":["핸들 떨림도 생길 수 있지만 가장 큰 문제는 휠의 변형과 파손입니다.","패드의 편마모와는 관계가 없습니다.","엔진 소음과는 관계가 없습니다."],"d":"스포크가 느슨해지면 휠의 강성이 약해져 변형되거나 파손될 수 있습니다."}},{"q":"다음 중 스포크 휠(spoke wheel)과 얼로이 휠(alloy wheel)의 차이에 대한 설명으로 가장 적당한 것은?","o":["얼로이 휠은 단조 또는 주조된 알루미늄 블록 에서 제작되어 튜브레스 타이어 장착이 용이 하고 고속 안정성이 뛰어나다.","스포크 휠은 충격을 흡수하기 위해 일부러 제작 시 금속 유연성을 약화시켜 노면 충격에 약하다.","얼로이 휠은 제작이 간단하며, 충격을 받으면 찌그러져도 부분 수리가 가능해 유지 보수가 유리하다.","스포크 휠은 유연성과 내구성이 뛰어나 오프 로드나 울퉁불퉁한 노면에서 주행 안정성이 높다."],"a":3,"e":{"w":["이 문제에서 묻는 두 휠의 차이를 가장 알맞게 설명한 보기가 아닙니다.","스포크 휠은 충격에 강한 구조입니다.","얼로이 휠은 휘거나 깨지면 부분 수리가 어렵습니다."],"d":"스포크 휠은 여러 개의 스포크가 충격을 나눠 받아 유연하고 질겨서 오프로드나 거친 노면에 유리합니다. ② 스포크 휠은 충격에 강하고, ③ 얼로이 휠은 휘거나 깨지면 부분 수리가 어렵습니다."}},{"q":"이륜자동차 타이어 휠에 무게의 불균형이 있으 면 바퀴가 돌아가면서 원심력에 의해 회전축이 흔들리게 되는데 이때 해야 할 조치는 무엇인가?","o":["타이어 교환","휠 밸런싱","휠 교환","프레임 교환"],"a":1,"e":{"w":["타이어를 바꿔도 휠의 무게 불균형은 남을 수 있습니다.","밸런스 웨이트로 맞추면 되므로 휠을 교환할 필요가 없습니다.","프레임과는 관계가 없습니다."],"d":"무게 불균형은 밸런스 웨이트를 붙여 균형을 맞추는 휠 밸런싱으로 해결합니다."}},{"q":"이륜자동차 휠의 종류 중 여러 개의 가는 실(스 포크)이 허브와 림을 연결하는 형태의 휠은?","o":["스포크 휠(spoke wheel)","캐스트 휠(cast wheel)","디스크 휠(disk wheel)","솔리드 휠(solid wheel)"],"a":0,"e":{"w":["캐스트 휠은 한 덩어리로 주조한 휠입니다.","디스크 휠은 판 모양의 휠입니다.","솔리드 휠은 속이 찬 통짜 휠입니다."],"d":"가는 스포크 여러 개로 허브와 림을 연결한 휠이 스포크 휠입니다. 캐스트 휠은 한 덩어리로 주조한 휠입니다."}},{"q":"이륜자동차의 바퀴가 정적 불평형일 때 일어나는 현상은?","o":["시미 현상","롤링 현상","트램핑 현상","스탠딩 웨이브 현상"],"a":2,"e":{"w":["시미 현상은 동적 불평형일 때 바퀴가 좌우로 흔들리는 것입니다.","롤링은 차체가 좌우로 기우는 움직임입니다.","스탠딩 웨이브는 고속에서 타이어가 물결처럼 변형되는 현상입니다."],"d":"정적 불평형이면 바퀴가 상하로 뛰는 트램핑이 생깁니다. 좌우로 흔들리는 시미는 동적 불평형일 때 생깁니다."}},{"q":"가벼운 오토바이에 적합한 타이어의 특징이 아닌 것은?","o":["광폭이 좁은 타이어","연비가 좋은 타이어","핸들링이 좋은 타이어","공기압이 높은 타이어"],"a":3,"e":{"w":["폭이 좁은 타이어는 가벼운 오토바이에 알맞습니다.","연비가 좋은 타이어는 알맞습니다.","핸들링이 좋은 타이어는 알맞습니다."],"d":"가벼운 오토바이에는 폭이 좁고 연비와 핸들링이 좋은 타이어가 알맞습니다. 공기압은 차종별 규정값에 맞추는 것이며, 높은 것이 알맞은 특징은 아닙니다."}},{"q":"타이어의 ‘130/70-18’과 같은 표기에서 ‘130’이 의미하는 것은?","o":["타이어의 전체 직경(mm)","타이어의 허용 하중(kg)","타이어 편평비(%)","타이어의 폭(mm)"],"a":3,"e":{"w":["130은 전체 지름이 아닙니다.","허용 하중은 하중 지수로 따로 표시합니다.","편평비는 두 번째 숫자 70입니다."],"d":"130/70-18에서 130은 타이어 폭(mm), 70은 편평비(%), 18은 림 지름(인치)입니다."}},{"q":"튜브 타이어와 튜브리스 타이어의 가장 큰 차이 점은 어떤 것인가?","o":["튜브리스 타이어는 펑크 시 공기가 즉시 모두 빠진다.","튜브 타이어는 휠에 직접 공기를 주입한다.","튜브 타이어는 고속 주행에 더 적합하다.","튜브리스 타이어는 내부에 별도의 튜브가 필요 없다."],"a":3,"e":{"w":["튜브리스 타이어는 못이 박혀도 공기가 천천히 빠집니다.","튜브 타이어는 튜브에 공기를 넣습니다.","고속 주행에는 열 발산이 좋은 튜브리스 타이어가 더 알맞습니다."],"d":"튜브리스 타이어는 타이어와 림이 직접 공기를 가두므로 별도의 튜브가 필요 없습니다. ① 튜브리스 타이어는 못이 박혀도 공기가 천천히 빠집니다."}},{"q":"튜브가 없는 타이어(tubeless tire)에 대한 설명으로 틀린 것은?","o":["튜브 조립이 없어 작업성이 좋다.","튜브 대신 타이어 안쪽 내벽에 고무막이 있다.","타이어와 림의 조립이 불안전하거나, 림 플랜 지 부위에 변형이 있어도 공기 누출 위험이 없다.","타이어 속의 공기가 림과 직접 접촉하여 열 발산이 잘된다."],"a":2,"e":{"w":["튜브를 조립하지 않아 작업성이 좋습니다. 옳은 설명입니다.","튜브 대신 타이어 안쪽 벽에 고무막(이너 라이너)이 있습니다. 옳은 설명입니다.","공기가 림과 직접 닿아 열 발산이 잘 됩니다. 옳은 설명입니다."],"d":"튜브리스 타이어는 타이어와 림이 밀착해 공기를 막습니다. 조립이 불완전하거나 림 플랜지가 변형되면 그 틈으로 공기가 샙니다."}},{"q":"레이디얼 타이어의 장점이 아닌 것은?","o":["로드 홀딩이 향상된다.","타이어 수명이 다소 감소된다.","하중에 의한 트레드 변형이 적다.","편평비를 크게 할 수 있어 접지 면적이 크다."],"a":1,"e":{"w":["로드 홀딩이 좋아지는 것은 장점입니다.","하중에 의한 트레드 변형이 적은 것은 장점입니다.","접지 면적이 큰 것은 장점입니다."],"d":"레이디얼 타이어는 로드 홀딩이 좋고 트레드 변형이 적으며 수명이 깁니다. 수명이 감소한다는 것은 장점이 아닙니다."}},{"q":"이륜자동차 타이어의 구조에 따라 레이디얼 타이어와 함께 가장 흔하게 분류되는 다른 한 종류의 타이어는?","o":["솔리드 타이어(solie tire)","스터드 타이어(stud tire)","런플랫 타이어(run-flat tire)","바이어스 타이어(bias tire)"],"a":3,"e":{"w":["솔리드 타이어는 공기를 넣지 않는 통고무 타이어입니다.","스터드 타이어는 징을 박은 눈길용 타이어입니다.","런플랫 타이어는 펑크가 나도 일정 거리를 달릴 수 있는 타이어입니다."],"d":"타이어는 카커스의 코드 배열에 따라 레이디얼 타이어와 바이어스 타이어로 나눕니다.","g":"tire"}},{"q":"타이어의 비드부가 늘어나는 것을 방지하기 위해 첨가하는 것은?","o":["구리선","강선","피아노선","알루미늄선"],"a":2,"e":{"w":["구리선은 강도가 부족합니다.","이 문제의 답은 강선 중에서도 강도가 높은 피아노선입니다.","알루미늄선은 강도가 부족합니다."],"d":"비드부에는 피아노선(비드 와이어)을 넣어 비드가 늘어나 림에서 벗겨지는 것을 막습니다.","g":"tire"}},{"q":"타이어의 구조에 해당하지 않는 것은?","o":["트레드","브레이커","카커스","압력판"],"a":3,"e":{"w":["트레드는 타이어의 구조입니다.","브레이커는 타이어의 구조입니다.","카커스는 타이어의 구조입니다."],"d":"타이어는 트레드, 브레이커, 카커스, 비드, 사이드 월로 이루어집니다. 압력판은 클러치 부품입니다.","g":"tire"}},{"q":"타이어 림과 타이어 사이에 별도의 튜브가 필요 없는 타이어는?","o":["튜브리스 타이어","튜브 타이어","런플랫 타이어","솔리드 타이어"],"a":0,"e":{"w":["튜브 타이어는 튜브가 필요합니다.","런플랫 타이어는 펑크가 나도 달릴 수 있게 만든 타이어입니다.","솔리드 타이어는 공기를 넣지 않는 타이어입니다."],"d":"림과 타이어 사이에 튜브가 필요 없는 타이어는 튜브리스 타이어입니다."}},{"q":"이륜자동차가 오프로드 주행 시 진흙이나 모래 에서 접지력을 높이기 위해 트레드 블록이 크고 깊게 파여있는 타이어는?","o":["오프로드 타이어(off-road tire)","스포츠 타이어(sport tire)","로드 타이어(road tire)","투어링 타이어(touring tire)"],"a":0,"e":{"w":["스포츠 타이어는 포장도로의 접지력을 중시합니다.","로드 타이어는 포장도로용입니다.","투어링 타이어는 장거리 주행용입니다."],"d":"트레드 블록이 크고 깊어 진흙이나 모래에서 접지력을 내는 타이어는 오프로드 타이어입니다."}},{"q":"이륜자동차 타이어의 제조일자를 확인하는 이유는?","o":["타이어 생산한 브랜드명을 확인하기 위해","타이어 재질을 확인하기 위해","타이어의 무게를 확인하기 위해","타이어의 생산 시기를 파악하기 위해"],"a":3,"e":{"w":["브랜드명은 옆면에 따로 표시되어 있습니다.","재질은 제조일자로 알 수 없습니다.","무게는 제조일자로 알 수 없습니다."],"d":"제조일자로 타이어의 생산 시기를 알 수 있습니다. 고무는 시간이 지나면 굳고 갈라지므로 오래된 타이어인지 확인합니다."}},{"q":"타이어 트레드 패턴의 필요성으로 틀린 것은?","o":["카커스 손상을 방지한다.","타이어 내부에서 발생한 열을 발산한다.","주행 중 옆 방향 슬립을 방지한다.","구동력이나 선회 성능을 향상시킨다."],"a":0,"e":{"w":["트레드 패턴은 열을 발산합니다. 옳은 설명입니다.","옆 방향 미끄러짐을 막습니다. 옳은 설명입니다.","구동력과 선회 성능을 높입니다. 옳은 설명입니다."],"d":"트레드 패턴은 열을 발산하고, 옆 방향 미끄러짐을 막고, 구동력과 선회 성능을 높입니다. 카커스 손상 방지는 패턴의 필요성이 아닙니다."}},{"q":"타이어의 구조 중 직접 노면과 직접 접촉하는 부분은?","o":["트레드","카커스","비드","숄더"],"a":0,"e":{"w":["카커스는 타이어의 뼈대입니다.","비드는 림에 끼워지는 부분입니다.","숄더는 트레드와 사이드 월 사이의 어깨 부분입니다."],"d":"노면과 직접 닿는 부분은 트레드입니다.","g":"tire"}},{"q":"이륜자동차 타이어 트레드의 마모 한계선이 보인다면 어떻게 해야 하나?","o":["타이어 공기압을 낮춘다.","타이어 공기압을 높인다.","타이어를 즉시 교환한다.","타이어를 앞, 뒤로 바꾼다."],"a":2,"e":{"w":["공기압을 낮춰도 닳은 타이어는 되돌아오지 않습니다.","공기압을 높여도 해결되지 않습니다.","앞뒤를 바꿔도 닳은 타이어는 위험합니다."],"d":"마모 한계선이 보이면 배수와 접지 성능이 크게 떨어지므로 타이어를 즉시 교환합니다."}},{"q":"주행 시 타이어에는 많은 열이 발생하여 타이어 수명이 단축되는데, 열 발생 원인이 아닌 것은?","o":["기온이 높을 때","저속으로 장시간 주행할 때","과다하게 적재하고 주행할 때","타이어 공기압이 낮은 상태로 주행할 때"],"a":1,"e":{"w":["기온이 높으면 열이 많이 납니다.","과적하면 타이어가 많이 찌그러져 열이 납니다.","공기압이 낮으면 타이어가 많이 찌그러져 열이 납니다."],"d":"타이어의 열은 기온이 높을 때, 과적했을 때, 공기압이 낮을 때, 고속으로 오래 달릴 때 많이 납니다. 저속 주행은 원인이 아닙니다."}},{"q":"고속 주행 시 타이어가 발열로 인하여 주름이 잡히는 현상은?","o":["트램핑","로드 홀딩","스탠딩 웨이브","하이드로 플래닝"],"a":2,"e":{"w":["트램핑은 바퀴가 상하로 뛰는 현상입니다.","로드 홀딩은 타이어가 노면을 잡는 성능입니다.","하이드로 플래닝은 타이어가 물 위에 뜨는 현상입니다."],"d":"고속 주행에서 타이어 접지부 뒤쪽이 물결 모양으로 주름 잡히는 현상이 스탠딩 웨이브입니다."}},{"q":"타이어의 스탠딩 웨이브 현상에 대한 사항으로 옳은 것은?","o":["스탠딩 웨이브를 줄이기 위해 고속 주행 시 공기압을 10% 정도 줄인다.","스탠딩 웨이브가 심하면 타이어 박리 현상이 발생할 수 있다.","스탠딩 웨이브는 바이어스 타이어보다 레이디얼 타이어에서 많이 발생한다.","스탠딩 웨이브 현상은 하중과 무관하다."],"a":1,"e":{"w":["공기압은 낮추는 것이 아니라 높여서 방지합니다.","바이어스 타이어에서 더 잘 생깁니다.","하중이 클수록 잘 생깁니다."],"d":"스탠딩 웨이브가 심하면 타이어가 과열되어 트레드가 떨어져 나가는 박리가 생길 수 있습니다. ① 공기압은 높여서 방지하고, ③ 바이어스 타이어에서 더 잘 생기며, ④ 하중이 클수록 잘 생깁니다."}},{"q":"주행 중 물이 고인 도로를 통행 시 타이어 트레 드가 물을 배출하지 못하여 노면과 타이어의 마찰력을 상실하게 하는 현상은?","o":["하이드로 플래닝","워터 햄머링","캐비테이션","스탠딩 웨이브"],"a":0,"e":{"w":["워터 햄머링은 배관 속 물의 충격 현상입니다.","캐비테이션은 액체 속에 기포가 생기는 현상입니다.","스탠딩 웨이브는 고속에서 타이어가 물결처럼 변형되는 현상입니다."],"d":"물이 고인 길에서 타이어가 물을 빼내지 못해 물 위에 뜨고 마찰력을 잃는 현상이 하이드로 플래닝(수막현상)입니다."}},{"q":"이륜자동차 타이어의 접지력에 영향을 받는 요소 중 틀리는 것은?","o":["타이어 트레드 패턴","브레이크 작동시","타이어의 공기압 상태","타이어의 고무의 종류"],"a":1,"e":{"w":["트레드 패턴은 접지력에 영향을 줍니다.","공기압은 접지 면적을 바꾸므로 접지력에 영향을 줍니다.","고무의 종류는 접지력에 영향을 줍니다."],"d":"접지력은 트레드 패턴, 공기압, 고무의 종류에 따라 달라집니다. 브레이크 작동은 접지력을 이용하는 것이지 접지력을 정하는 요소가 아닙니다."}},{"q":"이륜자동차의 타이어 공기압이 과도하게 높을 때 발생하는 현상으로 틀린 것은?","o":["트레드 중앙부 마모가 심하다.","노면과의 접지 면이 좁아진다.","미끄러지기 쉽다.","주행 시 핸들이 무겁다."],"a":3,"e":{"w":["공기압이 높으면 중앙부가 많이 닳습니다. 옳은 내용입니다.","접지 면이 좁아집니다. 옳은 내용입니다.","접지 면이 좁아 미끄러지기 쉽습니다. 옳은 내용입니다."],"d":"공기압이 너무 높으면 접지 면이 좁아져 중앙부가 빨리 닳고 미끄러지기 쉽습니다. 핸들은 오히려 가벼워집니다. 핸들이 무거운 것은 공기압이 낮을 때입니다."}},{"q":"이륜자동차 타이어의 공기압이 적정 수준보다 높을 때 발생할 수 있는 문제는?","o":["타이어 중앙 부분만 빨리 닳는다.","승차감이 더 부드러워진다.","타이어 가장 부분이 빨리 닳는다.","브레이크 성능이 좋아진다."],"a":0,"e":{"w":["공기압이 높으면 승차감이 딱딱해집니다.","가장자리가 빨리 닳는 것은 공기압이 낮을 때입니다.","접지 면이 좁아져 브레이크 성능은 나빠집니다."],"d":"공기압이 높으면 타이어 가운데가 볼록해져 중앙 부분만 빨리 닳습니다. ③ 가장자리가 빨리 닳는 것은 공기압이 낮을 때입니다."}},{"q":"이륜자동차 타이어의 공기압을 점검하는 가장 적절한 시기는?","o":["장거리 주행 직후 타이어가 뜨거울 때","주행 후 타이어가 식은 상태일 때","이륜자동차를 세차하고 난 후에","날씨가 흐리거나 비가 오는 날"],"a":1,"e":{"w":["타이어가 뜨거우면 압력이 높게 나와 정확하지 않습니다.","세차는 공기압 점검 시기와 관계가 없습니다.","날씨는 점검 시기의 기준이 아닙니다."],"d":"타이어가 뜨거우면 안의 공기가 팽창해 압력이 높게 나옵니다. 그래서 타이어가 식은 상태에서 점검합니다."}},{"q":"이륜자동차 타이어 교체 작업 시, 휠 림에 손상을 주지 않고 타이어를 장착하는 가장 안전한 방법은?","o":["망치와 드라이버를 이용하여 타이어를 탈거 한다.","전용 타이어 레버 및 림 프로텍터를 이용하여 조심스럽게 작업한다.","망치와 드라이버를 이용하여 타이어를 밀어 넣는다.","타이어에 비눗물을 바르고 손으로 집어넣는다."],"a":1,"e":{"w":["망치와 드라이버를 쓰면 림과 타이어가 상합니다.","망치와 드라이버로 밀어 넣으면 림과 비드가 상합니다.","손만으로는 장착하기 어렵습니다."],"d":"전용 타이어 레버와 림 프로텍터를 쓰면 림에 흠집을 내지 않고 작업할 수 있습니다."}},{"q":"이륜자동차의 앞바퀴가 주행 중 한쪽으로 쏠리는 현상이 발생할 때 가장 먼저 의심해야 할 원인은?","o":["브레이크 패드 마모","체인 장력 과다","포크 휨 또는 정렬 불량","브레이크 오일 부족"],"a":2,"e":{"w":["패드 마모로 앞바퀴가 쏠리지는 않습니다.","체인 장력은 앞바퀴와 관계가 없습니다.","브레이크 오일 부족은 쏠림의 원인이 아닙니다."],"d":"앞바퀴가 한쪽으로 쏠리면 프론트 포크가 휘었거나 정렬이 틀어진 것을 먼저 의심합니다."}},{"q":"이륜자동차 휠 베어링에 유격이 있거나 소음이 발생할 때, 주행 중 나타날 수 있는 현상은?","o":["브레이크 패드 마모가 감소한다.","엔진 소음이 커진다.","배기 소음이 커진다.","주행 중 휠에서 비정상적인 소음이 발생한다."],"a":3,"e":{"w":["패드 마모와는 관계가 없습니다.","엔진 소음과는 관계가 없습니다.","배기 소음과는 관계가 없습니다."],"d":"휠 베어링에 유격이 있거나 손상되면 주행 중 휠에서 비정상적인 소음이 납니다."}},{"q":"이륜자동차 타이어에 바람을 너무 적게 넣으면 어떤 현상이 발생하는가?","o":["승차감이 좋아진다.","타이어 중앙 부분이 마모된다.","타이어가 더 빨리 마모되고 운전하기 힘들어 진다.","타이어가 더 튼튼해진다."],"a":2,"e":{"w":["타이어가 찌그러져 승차감이 좋아지지 않습니다.","중앙이 닳는 것은 공기압이 높을 때입니다.","타이어는 더 약해집니다."],"d":"공기압이 너무 낮으면 타이어가 많이 찌그러져 빨리 닳고, 핸들이 무거워 운전하기 힘들어집니다."}},{"q":"이륜자동차 타이어의 비정상적인 편 마모가 발생했을 때, 다음 중 가장 먼저 의심해야 할 것은?","o":["휠 얼라인먼트 불량","연료필터 막힘","배터리 충전 불량","발전기 작동 불량"],"a":0,"e":{"w":["연료필터는 타이어 마모와 관계가 없습니다.","배터리 충전은 관계가 없습니다.","발전기는 관계가 없습니다."],"d":"타이어가 비정상적으로 한쪽만 닳으면 휠 얼라인먼트 불량을 먼저 의심합니다."}},{"q":"이륜자동차 타이어의 노화를 육안으로 판단할 수 있는 가장 대표적인 증상은?","o":["타이어의 색깔이 검정색이 아닌 다른 색으로 변한다.","타이어 측면이나 트레드 부분에 미세한 균열이 발생한다.","타이어에 흙이 묻어있다.","타이어의 공기압이 자동으로 조절된다."],"a":1,"e":{"w":["노화되어도 색이 다른 색으로 변하지는 않습니다.","흙은 노화와 관계가 없습니다.","공기압은 저절로 조절되지 않습니다."],"d":"타이어가 노화하면 고무가 굳어 옆면이나 트레드에 미세한 균열이 생깁니다."}},{"q":"이륜자동차 바퀴에 박힌 못을 발견하면 어떻게 조치해야 하나?","o":["못을 바로 뽑고 달린다.","물을 뿌려 못을 녹인다.","못을 그대로 둔 채 정비소로 가서 전문가에게 수리를 맡긴다.","타이어에 테이프를 붙인다."],"a":2,"e":{"w":["못을 뽑으면 공기가 급하게 빠질 수 있습니다.","물로는 못이 녹지 않습니다.","테이프로는 막을 수 없습니다."],"d":"못을 뽑으면 공기가 한꺼번에 빠질 수 있으므로 그대로 둔 채 정비소에서 수리합니다."}},{"q":"고속 주행 중 타이어 접지부 후방에서 트레드 고무의 복원 지연으로 물결 형상의 주름이 생기는 위험 현상은?","o":["하이드로플래닝","시미 현상","스탠딩 웨이브 (Standing Wave)","베이퍼 록"],"a":2,"e":{"w":["하이드로플래닝은 물이 고인 노면에서 타이어가 물 위에 뜨는 수막현상입니다.","시미는 조향 바퀴가 좌우로 떨리는 현상입니다.","베이퍼 록은 브레이크액에 기포가 생기는 현상입니다."],"d":"공기압이 낮은 타이어로 고속 주행하면, 접지하면서 눌린 트레드가 원래 모양으로 돌아오기 전에 다음 접지가 시작됩니다. 그 결과 접지부 뒤쪽에 물결 모양의 주름이 생기는데 이것이 스탠딩 웨이브입니다.\n타이어가 급격히 뜨거워져 트레드가 떨어져 나가거나 파열될 수 있습니다. 공기압을 규정보다 높이면 예방할 수 있습니다."}},{"q":"휠 및 타이어 어셈블리의 정적 불평형으로 인해 발생하는 바퀴의 상하 방향 떨림 현상은?","o":["시미 (Shimmy - 좌우 진동)","트램핑 (Tramping - 상하 진동)","롤링 (Rolling)","요잉 (Yawing)"],"a":1,"e":{"w":["시미는 동적 불평형으로 바퀴가 좌우로 떨리는 현상입니다.","롤링은 차체가 좌우로 기울어지는 운동입니다.","요잉은 차체가 수직축을 중심으로 좌우로 도는 운동입니다."],"d":"바퀴의 무게가 한쪽으로 치우친 것을 정적 불평형이라 하며, 바퀴가 돌 때 위아래로 뛰는 트램핑을 일으킵니다.\n정적 불평형 = 상하 진동(트램핑), 동적 불평형 = 좌우 진동(시미)으로 구분합니다. 휠 밸런스를 맞춰 해결합니다."}}]},{"g":"동력전달장치","name":"수동변속기","id":"p05","qs":[{"q":"클러치 레버의 유격 점검 내용으로 잘못된 것은?","o":["유격이 많으면 클러치의 미끌림 등이 발생한다.","클러치 유격은 레버 끝단부에서 점검한다.","주조정은 엔진 쪽에서 실시하며, 로크너트를 풀고 어저스트 너트를 돌려 유격을 조정한다.","유격 조정 후에는 어저스트 너트를 고정하고, 로크너트를 단단히 조여 준다."],"a":0,"e":{"w":["유격은 레버 끝부분에서 점검합니다. 옳은 내용입니다.","주조정은 엔진 쪽에서 로크너트를 풀고 조정합니다. 옳은 내용입니다.","조정한 뒤에는 로크너트를 조여 고정합니다. 옳은 내용입니다."],"d":"유격이 많으면 레버를 잡아도 클러치가 완전히 끊어지지 않습니다(차단 불량). 클러치가 미끄러지는 것은 유격이 너무 적을 때입니다."}},{"q":"이륜자동차 변속기가 기어 빠지는 현상이 발생할 때, 점검하지 않아도 되는 것은?","o":["시프트 포크 휨","변속기 내부의 기어 이빨 마모","변속 드럼 마모","변속기 오일 과다"],"a":3,"e":{"w":["시프트 포크가 휘면 기어가 깊이 물리지 않아 빠집니다. 점검해야 합니다.","기어 이빨(도그)이 닳으면 기어가 빠집니다. 점검해야 합니다.","변속 드럼이 닳으면 기어 위치가 유지되지 않습니다. 점검해야 합니다."],"d":"기어가 빠지는 원인은 시프트 포크의 휨, 기어 이빨(도그) 마모, 변속 드럼 마모입니다. 변속기 오일이 많은 것은 원인이 아닙니다."}},{"q":"이륜자동차 클러치가 미끄러질 때 나타나는 증상은?","o":["변속이 너무 부드럽다.","엔진 회전수는 올라가지만 속도가 잘 나지 않는다.","엔진의 동력이 변속기로 잘 전달된다.","엔진출력이 정상이다."],"a":1,"e":{"w":["변속감과는 관계가 없습니다.","동력이 제대로 전달되지 않습니다.","출력이 바퀴로 다 전달되지 않습니다."],"d":"클러치가 미끄러지면 엔진의 힘이 다 전달되지 않아 엔진 회전수는 올라가도 속도가 잘 나지 않습니다."}},{"q":"이륜자동차 클러치 단속기구의 종류가 아닌 것은?","o":["스파이럴 베벨기어","와이어 방식","유압식 클러치","원심력 클러치"],"a":0,"e":{"w":["와이어 방식은 케이블로 클러치를 끊고 잇는 방식입니다.","유압식은 유압으로 클러치를 끊고 잇는 방식입니다.","원심력 클러치는 회전수에 따라 자동으로 이어지는 방식입니다."],"d":"스파이럴 베벨기어는 회전축의 방향을 바꾸는 기어입니다. 클러치를 끊고 잇는 방식에는 와이어식, 유압식, 원심식이 있습니다."}},{"q":"이륜자동차 클러치 시스템 정비 후, 클러치 레버를 여러 번 작동시켜야 하는 이유는?","o":["클러치 케이블의 길이를 늘리기 위해","클러치 오일의 온도를 높이기 위해","클러치 시스템 내부에 공기를 제거하기 위해","클러치 커버를 닫기 위해"],"a":2,"e":{"w":["케이블의 길이는 늘어나지 않습니다.","오일의 온도를 높이려는 것이 아닙니다.","클러치 커버와는 관계가 없습니다."],"d":"정비 뒤 레버를 여러 번 작동시켜 클러치 계통 안에 남은 공기를 빼 줍니다."}},{"q":"이륜자동차가 출발할 때, 클러치 레버를 너무 빨리 놓아서 엔진이 ‘푸드득’하고 꺼지는 이유는?","o":["엔진의 동력이 갑자기 전달되었기 때문","엔진의 동력이 너무 천천히 전달되었기 때문","엔진 출력이 높아서","엔진 출력이 낮아서"],"a":0,"e":{"w":["천천히 전달되면 시동이 꺼지지 않습니다.","출력이 높으면 시동이 잘 꺼지지 않습니다.","출력이 낮은 것이 직접 원인이 아닙니다."],"d":"클러치 레버를 너무 빨리 놓으면 엔진의 동력이 갑자기 전달되어 부하가 한꺼번에 걸리므로 시동이 꺼집니다."}},{"q":"이륜자동차 클러치 시스템에서 클러치 케이블이 아닌 유압식 클러치를 사용하는 이륜자동차에서 클러치 작동이 불량할 때 점검해야 할 것이 아닌 것은?","o":["슬레이브 실린더","클러치 마스터 실린더","오일라인 및 클러치 액 상태","변속기 기어 마모 상태"],"a":3,"e":{"w":["슬레이브 실 당하는 경우입니다.","시프트 드럼의 홈이 닳으면 기어 위치가 유지되지 않습니다. 해당하는 경우입니다."],"d":"이륜자동차 수동변속기의 메인샤프트에는 플래닛(유성) 기어가 없으므로 ③은 해당하지 않습니다. ①②④는 가속할 때 기어가 풀리는 원인이 됩니다."}},{"q":"이륜자동차 변속기 내부에서 변속비를 결정하는 주요 부품은?","o":["기어 톱니수","클러치 디스크 개수","스프로킷","변속기 카운터 축"],"a":0,"e":{"w":["클러치 디스크의 개수는 전달할 수 있는 힘의 크기와 관계가 있습니다. 변속비와는 관계가 없습니다.","스프로킷은 변속기 밖에 있고 최종 감속비를 정하는 부품입니다.","카운터 축은 기어가 끼워져 도는 축입니다. 축 자체가 변속비를 정하지는 않습니다."],"d":"변속비는 서로 맞물린 두 기어의 톱니수 비로 정해집니다. 변속비 = 피동 기어 톱니수 ÷ 구동 기어 톱니수입니다. 단마다 톱니수가 다른 기어 쌍을 써서 변속비를 바꿉니다."}},{"q":"일반적인 수동 매뉴얼 모터사이클의 동력 전달 경로로 올바른 순서는?","o":["엔진 → 드라이브 체인 → 클러치 → 변속기 → 뒷바퀴","엔진 → 1차 감속기어 → 클러치 → 변속기 → 최종 감속기구 → 리어 휠","엔진 → 배터리 → 변속기 → 최종감속 → 휠","엔진 → 변속기 → 1차감속 → 클러치 → 뒷바퀴"],"a":1,"e":{"w":["드라이브 체인은 변속기를 지난 뒤의 최종 감속 단계입니다.","배터리는 동력 전달 경로에 들어가지 않습니다.","클러치는 변속기 앞에 있습니다."],"d":"수동 변속 이륜자동차의 동력은 크랭크축 → 1차 감속 기어 → 클러치 → 변속기 → 최종 감속 기구(체인·벨트·샤프트) → 뒷바퀴 순서로 전달됩니다.\n1차 감속은 크랭크축과 클러치 사이, 최종(2차) 감속은 변속기 출력축과 뒷바퀴 사이에서 이루어집니다."}},{"q":"수동 클러치 와이어(기계식) 레버 끝단에서 측정되는 권장 레버 자유 간극(유격)은?","o":["0~2 mm","10~20 mm","30~40 mm","50~60 mm"],"a":1,"e":{"w":["0~2mm는 유격이 거의 없어 클러치가 미끄러질 수 있습니다.","30~40mm는 유격이 지나쳐 클러치가 완전히 끊기지 않습니다.","50~60mm는 유격이 지나쳐 변속이 어렵습니다."],"d":"클러치 레버 유격은 레버를 당기기 시작해 저항이 느껴질 때까지 레버 끝이 움직인 거리입니다. 보통 10~20mm로 맞춥니다.\n유격이 너무 적으면 클러치가 항상 조금 눌려 미끄러지고, 너무 많으면 레버를 끝까지 잡아도 완전히 끊기지 않아 변속이 어렵습니다. 정확한 값은 정비지침서를 따릅니다."}},{"q":"고속 주행 중 과도한 엔진 브레이크로 인해 리어 휠의 슬립이나 홉핑(Hopping)이 발생하는 것을 방지하는 클러치 기구는?","o":["원심 클러치","슬리퍼 클러치 (백 토크 리미터)","다판 건식 클러치","전자식 유압 클러치"],"a":1,"e":{"w":["원심 클러치는 엔진 회전수에 따라 자동으로 연결되는 클러치입니다.","다판 건식 클러치는 클러치의 형식이며 백 토크를 줄이는 기능은 없습니다.","유압 클러치는 클러치를 작동시키는 방식입니다."],"d":"고속에서 급하게 저단으로 내리면 뒷바퀴가 엔진을 거꾸로 돌리는 큰 힘(백 토크)이 걸려 뒷바퀴가 미끄러지거나 튀어 오릅니다.\n슬리퍼 클러치(백 토크 리미터)는 이 역방향 힘이 걸릴 때 클러치를 살짝 미끄러지게 해 뒷바퀴의 잠김과 홉핑을 막아 줍니다."}}]},{"g":"동력전달장치","name":"자동변속기","id":"p06","qs":[{"q":"자동변속기에서 기어 변속 시 부드러운 연결을 위해 유압으로 작동하는 마찰 요소는?","o":["스프링","선기어","클러치","유성기어"],"a":2,"e":{"w":["스프링은 마찰 요소가 아닙니다.","선기어는 기어 요소입니다.","유성기어는 기어 요소입니다."],"d":"자동변속기에서 유압으로 작동해 동력을 부드럽게 이어 주는 마찰 요소는 클러치입니다.
