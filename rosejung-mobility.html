<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장미정교수와 함께하는 이륜자동차 정비 문제 풀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 답안지(OMR) 한 장을 옮겨 놓은 화면. 왼쪽 정렬, 한 번에 한 문제, 아래에 답안 표기란. */
:root{
  --paper:#eef1f6; --surface:#ffffff; --ink:#16233b; --muted:#5d6a80; --line:#cfd6e2;
  --accent:#1f4fbf; --accent-ink:#ffffff; --accent-soft:#e3ebfb;
  --sky:#5cc8f5; --ok:#0f7a4b; --ok-soft:#e1f3ea; --bad:#c22a2a; --bad-soft:#fbe6e4;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#101622; --surface:#1a2233; --ink:#e8edf6; --muted:#9aa7bd; --line:#34405a;
    --accent:#7da4ff; --accent-ink:#0d1526; --accent-soft:#22304f;
    --sky:#2b7fb0; --ok:#5fd09a; --ok-soft:#163427; --bad:#ff8a80; --bad-soft:#3d1f1f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#101622; --surface:#1a2233; --ink:#e8edf6; --muted:#9aa7bd; --line:#34405a;
  --accent:#7da4ff; --accent-ink:#0d1526; --accent-soft:#22304f;
  --sky:#2b7fb0; --ok:#5fd09a; --ok-soft:#163427; --bad:#ff8a80; --bad-soft:#3d1f1f; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 48px}
header.top{border-bottom:2px solid var(--ink);padding:22px 16px 14px 22px;margin:14px 0 20px;background:linear-gradient(135deg,var(--sky) 0 30px,transparent 30px),linear-gradient(315deg,var(--sky) 0 46px,transparent 46px),var(--surface);border-radius:10px 10px 0 0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
header.top h1,.lead,.part .nm{word-break:keep-all;overflow-wrap:anywhere}
header.top h1{font-size:24px;line-height:1.25;margin:0;font-weight:700;color:var(--accent);text-wrap:balance}
header.top h1 .who{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:2px}
.yt{display:inline-flex;align-items:center;gap:10px;margin:8px 0 6px;padding:7px 14px 7px 9px;font-size:14.5px;color:var(--ink);text-decoration:none;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
.me{flex:none;width:132px;height:165px;border-radius:14px;object-fit:cover;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);margin:0 34px 0 auto;align-self:center;order:2}
header.top>div{flex:1 1 300px;min-width:0}
header.top .home{order:3}
@media (max-width:560px){header.top{position:relative}.me{position:absolute;top:16px;right:14px;width:84px;height:105px;margin:0;border-radius:10px}header.top h1{padding-right:96px;min-height:94px}header.top>div{flex:1 1 100%}}
.yt-t b{word-break:keep-all}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 6px}
.links .yt{margin:0}
.nv-mark{flex:none;width:34px;height:24px;border-radius:7px;background:#03c75a;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif}
.yt-t{display:flex;flex-direction:column;line-height:1.3}
.yt-t small{font-size:12px;color:var(--muted)}
.yt:hover,.yt:active{border-color:var(--bad)}
.yt b{font-weight:600}
.yt-mark{flex:none;width:34px;height:24px;border-radius:7px;background:#e62117;position:relative}
.yt-mark::after{content:"";position:absolute;left:13px;top:6px;border-left:11px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}
header.top .sub{font-size:13px;color:var(--muted)}
.home{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;color:var(--muted)}
h2{font-size:15px;margin:26px 0 10px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;border-top:1px solid var(--line)}
.lead{margin:0 0 6px;color:var(--muted);font-size:15px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.part{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:86px}
.part:hover{border-color:var(--accent)}
.part .nm{font-weight:600;font-size:16px;line-height:1.35}
.part .meta{font-family:var(--num);font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-top:auto}
.part .bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.part .bar i{display:block;height:100%;background:var(--accent)}
.part.all{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.part.all .meta{color:inherit;opacity:.85}
.status{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.status b{color:var(--ink);font-weight:600}
.mono{font-family:var(--num);font-variant-numeric:tabular-nums}
.tts{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.ttsb{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:500}
.ttsb.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px 18px}
.qno{font-family:var(--num);font-size:14px;color:var(--accent);font-weight:600;margin-bottom:6px}
.stem{font-size:19px;font-weight:600;line-height:1.55;margin:0 0 14px;word-break:keep-all;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:0 0 14px;font-size:16px;background:var(--paper)}
.box p{margin:2px 0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 12px;font-size:17px;line-height:1.5;width:100%;word-break:keep-all;overflow-wrap:anywhere}
.opt .mk{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-family:var(--num);font-size:14px;font-weight:600;margin-top:-1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mk{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.nav{display:flex;gap:10px;margin:14px 0 4px}
.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:8px;padding:12px 16px;font-weight:600;font-size:16px;flex:1}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:var(--line);color:var(--muted);font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.omr{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:8px}
.omr button{font-family:var(--num);font-size:14px;height:38px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);padding:0}
.omr button.done{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.omr button.cur{outline:3px solid var(--accent);outline-offset:1px}
.omr button.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.omr button.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.notice{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:15px}
.notice .nav{margin:10px 0 0}
.score{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--bad);border-radius:10px;padding:18px 18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score.pass{border-left-color:var(--ok)}
.score .big{font-family:var(--num);font-size:52px;font-weight:600;line-height:1}
.score .big small{font-size:18px;color:var(--muted);font-weight:500}
.verdict{font-size:22px;font-weight:700;color:var(--bad)}
.score.pass .verdict{color:var(--ok)}
.score .det{font-size:14px;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0 0}
.actions .btn{flex:none}
.tabs{display:flex;gap:8px;margin:0 0 10px}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px}
.tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:10px}
.rev .tag{font-size:12.5px;font-weight:700;border-radius:4px;padding:2px 8px;margin-left:8px}
.rev .tag.ok{background:var(--ok-soft);color:var(--ok)} .rev .tag.no{background:var(--bad-soft);color:var(--bad)}
.rev .stem{font-size:17px;margin-bottom:10px}
.rev ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.rev li{display:flex;gap:10px;padding:6px 8px;border-radius:6px;font-size:16px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.rev li .mk{font-family:var(--num);flex:none;width:1.4em}
.rev li.ans{background:var(--ok-soft);color:var(--ok);font-weight:600}
.rev li.mine{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.exp{margin-top:10px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 6px 6px 0;padding:8px 12px;font-size:15.5px;line-height:1.6}
.exp.wrong{border-left-color:var(--bad);background:var(--bad-soft)}
.exp.wrong b{color:var(--bad)}
.exp.wrong .mk{font-family:var(--num);font-weight:600}
.exp b{font-size:13.5px;color:var(--accent);letter-spacing:.04em}
.exp p{margin:2px 0 0;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
.rev li .lab{margin-left:auto;flex:none;font-size:12.5px;font-weight:700;text-decoration:none;padding-left:8px}
footer{margin-top:28px;font-size:13px;color:var(--muted)}
@media (max-width:420px){.stem{font-size:18px}.omr button{height:36px;font-size:13px}.score .big{font-size:44px}}
@media (prefers-reduced-motion:no-preference){.opt,.part{transition:border-color .12s,background .12s}}
</style>
</head>

<script id="bank" type="application/json">[{"g":"엔진","name":"엔진정비","qs":[{"q":"실린더의 연소실 체적이 25cc, 행정 체적이 125cc인 기관의 압축비는?","o":["5 : 1","6 : 1","7 : 1","8 : 1"],"a":1,"e":"압축비 = (연소실 체적 + 행정 체적) ÷ 연소실 체적입니다.\n(25 + 125) ÷ 25 = 150 ÷ 25 = 6 이므로 6 : 1입니다.\n행정 체적만 나눈 125 ÷ 25 = 5는 함정입니다."},{"q":"실린더의 지름이 50mm, 행정이 55mm인 1기통 기관의 배기량은?","o":["106.9cc","107.9cc","108.9cc","109.9cc"],"a":1,"e":"배기량 = π/4 × D² × L 입니다. cc로 구하려면 mm를 cm로 바꿉니다(50mm = 5cm, 55mm = 5.5cm).\n0.785 × 5² × 5.5 = 0.785 × 25 × 5.5 ≒ 107.9cc"},{"q":"지시마력이 15PS이고, 제동마력이 12PS일 때 기계효율은?","o":["60%","70%","80%","90%"],"a":2,"e":"기계효율 = 제동마력 ÷ 지시마력 × 100 입니다.\n12 ÷ 15 × 100 = 80%"},{"q":"실린더 헤드 볼트를 조일 때 회전력을 측정하기 위해 사용되는 공구는?","o":["토크렌치","오픈 엔드 렌치","복스 렌치","소켓 렌치"],"a":0,"e":"토크렌치는 볼트를 조이는 회전력(토크)을 눈금으로 확인하면서 조이는 공구입니다. 오픈 엔드 렌치, 복스 렌치, 소켓 렌치는 조이기만 할 뿐 회전력을 측정하지 못합니다."},{"q":"실린더 블록이나 헤드의 평면도 측정에 알맞은 게이지는?","o":["마이크로미터","다이얼 게이지","버니어 캘리퍼스","직각자와 필러게이지"],"a":3,"e":"평면도(휨)는 직각자(곧은자)를 면에 대고 그 틈새를 필러게이지로 잽니다. 마이크로미터와 버니어 캘리퍼스는 치수를, 다이얼 게이지는 흔들림이나 축의 휨을 잴 때 씁니다."},{"q":"4행정 기관에서 크랭크축이 1,000rpm일 때 캠축은 몇 rpm인가?","o":["500rpm","1,000rpm","1,500rpm","2,000rpm"],"a":0,"e":"4행정 기관은 크랭크축이 2회전할 때 캠축이 1회전합니다.\n1,000 ÷ 2 = 500rpm"},{"q":"압축비가 동일한 경우 이론적으로 열효율이 가장 높은 사이클은?","o":["오토 사이클","디젤 사이클","복합 사이클","모두 같다"],"a":0,"e":"압축비가 같을 때 이론 열효율은 오토 사이클 > 복합(사바테) 사이클 > 디젤 사이클 순서입니다."},{"q":"일정한 체적에서 연소가 일어나는 가장 대표적인 사이클은?","o":["오토 사이클","디젤 사이클","사바테 사이클","카르노 사이클"],"a":0,"e":"일정한 체적에서 연소하는 것이 정적 사이클, 곧 오토 사이클입니다. 디젤은 정압, 사바테는 정적과 정압을 합친 복합 사이클이고, 카르노는 이론상의 이상 사이클입니다."},{"q":"압축압력 측정에 대한 설명 중 틀린 것은?","o":["축전지는 완전 충전된 것을 사용한다.","충전회로를 차단한다.","점화회로를 차단한다.","연료공급을 차단한다."],"a":1,"e":"압축압력을 잴 때는 완전 충전된 축전지로 크랭킹하고, 점화회로와 연료공급을 차단합니다. 충전회로는 차단할 필요가 없습니다."},{"q":"이륜자동차 엔진의 실린더 헤드는 대부분 알루미늄 합금으로 되어 있다. 그 이유 중 가장 중요한 것은?","o":["열전도율이 높다.","녹슬지 않는다.","주철보다 열팽창계수가 작다.","무게를 증가시켜 준다."],"a":0,"e":"알루미늄 합금은 열전도율이 높아 연소실의 열을 빨리 내보냅니다. ③ 알루미늄은 주철보다 열팽창계수가 큽니다. ④ 무게는 가벼워집니다."},{"q":"150kgf의 물체를 수직 방향으로 매초 1m의 속도로 올리려면 몇 PS의 동력이 필요한가?","o":["1PS","0.5PS","2PS","5PS"],"a":2,"e":"1PS = 75kgf·m/s 입니다.\n동력 = 힘 × 속도 = 150kgf × 1m/s = 150kgf·m/s\n150 ÷ 75 = 2PS"},{"q":"연소실 설계 시 고려할 사항으로 틀린 것은?","o":["화염 전파에 필요한 시간을 가능한 한 짧게 한다.","가열되기 쉬운 돌출부를 두지 않는다.","연소실의 표면적이 최대가 되게 한다.","압축행정에서 혼합기에 와류가 발생하도록 한다."],"a":2,"e":"연소실 표면적이 크면 열이 벽으로 많이 빠져나가므로 표면적은 최소가 되게 설계합니다. ①②④는 모두 옳은 설계 조건입니다."},{"q":"이륜자동차 엔진에서 실린더 보어(Bore)가 의미하는 것은?","o":["피스톤의 상하 운동 거리","엔진의 전체 길이","실린더의 내경(지름)","크랭크축의 회전 반경"],"a":2,"e":"보어(Bore)는 실린더의 안지름입니다. ① 피스톤의 상하 운동 거리는 행정(Stroke)입니다."},{"q":"실린더 보어의 크기는 엔진의 어떤 특성과 가장 직접적인 관련이 있는가?","o":["엔진의 냉각 효율","엔진 오일의 점도","엔진의 소음 수준","엔진의 배기량"],"a":3,"e":"배기량 = π/4 × 보어² × 행정 이므로 보어의 크기가 배기량을 직접 결정합니다."},{"q":"이륜자동차 엔진에서 실린더 보어의 내벽에 마모 또는 손상이 발생했을 때 나타날 수 있는 주요 문제점은?","o":["엔진의 냉각수 누수","배터리 방전 가속화","브레이크 제동력 약화","압축 누설 및 오일 소모량 증가"],"a":3,"e":"실린더 벽이 닳으면 피스톤 링과의 사이에 틈이 생겨 압축가스가 새고, 오일이 연소실로 올라가 함께 타므로 오일 소모가 늘어납니다."},{"q":"실린더 보어의 마모가 심할 경우 주로 사용하는 정비 방법은?","o":["오버사이즈 피스톤 링만 교체한다.","엔진오일만 교환한다.","오버사이즈 피스톤 및 피스톤 링으로 교체한다.","실린더 블록 상단부를 연마한다."],"a":2,"e":"마모가 심하면 실린더를 보링해 안지름을 넓히고, 그 치수에 맞는 오버사이즈 피스톤과 피스톤 링을 함께 교체합니다. ① 링만 바꾸면 피스톤과 실린더의 간극이 맞지 않습니다."},{"q":"실린더 내의 마멸이 가장 적은 곳은 어디입니까?","o":["상사점 부근","하사점 부근","상사점과 하사점의 중간","실린더의 하단부"],"a":3,"e":"실린더 마멸은 폭발 압력과 열을 크게 받는 상사점 부근이 가장 크고, 그 영향이 적은 실린더 하단부가 가장 적습니다."},{"q":"실린더 보어의 표면에 크로스 해치 패턴을 형성하는 주된 이유는?","o":["보어의 색상을 좋게 하기 위해","보어의 강도를 높이기 위해","보어의 무게를 줄이기 위해","피스톤 링이 실린더 벽에 안정적으로 밀착하도록 돕기 위해"],"a":3,"e":"크로스 해치는 호닝으로 만든 교차 무늬의 미세한 홈입니다. 이 홈이 오일을 머금어 유막을 유지하고, 피스톤 링이 실린더 벽에 잘 길들어 밀착하게 합니다."},{"q":"실린더 마멸의 원인으로 부적당한 것은?","o":["실린더와 피스톤 링의 접촉","피스톤 랜드에 의한 접촉","흡입가스 속 먼지와 이물질에 의한 마모","연소 생성물에 의한 부식"],"a":1,"e":"실린더 벽과 직접 맞닿아 마멸을 일으키는 것은 피스톤 링입니다. 피스톤 랜드는 링 홈 사이의 부분으로 실린더 벽에 직접 닿지 않습니다. ①③④는 실제 마멸 원인입니다."},{"q":"이륜자동차 엔진에서 행정(Stroke)이 의미하는 것은?","o":["실린더 보어의 지름","피스톤이 상사점에서 하사점까지 이동하는 거리","엔진의 전체 폭","크랭크축의 지름"],"a":1,"e":"행정(Stroke)은 피스톤이 상사점에서 하사점까지 움직이는 거리입니다. ① 실린더 보어의 지름은 보어(내경)입니다."},{"q":"롱 스트로크 엔진(Long-stroke engine)의 일반적인 특징은?","o":["고회전·고출력에 유리하다.","주로 레이싱 이륜자동차에 사용된다.","엔진의 높이가 매우 낮다.","저회전에서 높은 토크를 발생시키는 데 유리하다."],"a":3,"e":"롱 스트로크 엔진은 행정이 보어보다 길어 저회전에서 큰 토크를 냅니다. ①② 고회전·고출력과 레이싱용은 숏 스트로크 엔진의 특징입니다."},{"q":"숏 스트로크(Short-stroke) 엔진의 일반적인 특징은?","o":["저회전에서 높은 토크를 발생시키는 데 가장 유리하다.","연료 효율이 항상 매우 낮다.","고회전에서 높은 출력을 발생시키는 데 유리하다.","점화 효율이 항상 우수하다."],"a":2,"e":"숏 스트로크 엔진은 행정이 짧아 피스톤 속도가 낮으므로 고회전에서 높은 출력을 내기에 유리합니다. ① 저회전 토크는 롱 스트로크 엔진이 유리합니다."},{"q":"고속 회전을 목적으로 하는 기관에서는 일반적으로 흡기 밸브와 배기 밸브 중 어느 밸브를 더 크게 만드는가?","o":["흡기 밸브","배기 밸브","흡기 밸브와 배기 밸브의 크기는 항상 같다.","고속 회전 기관에는 밸브 크기가 영향을 주지 않는다."],"a":0,"e":"고속 회전에서는 짧은 시간에 혼합기를 많이 빨아들여야 하므로 흡기 밸브를 더 크게 만듭니다. 배기가스는 압력으로 밀려 나가므로 배기 밸브는 작아도 됩니다."},{"q":"2사이클 엔진이 경량화와 높은 출력 밀도에 유리하여 소형 이륜자동차, 스쿠터, 체인톱 등에 많이 사용되었던 주된 이유는?","o":["복잡한 밸브 구동장치를 사용하기 때문이다.","크랭크축 1회전마다 1회의 폭발행정이 이루어지기 때문이다.","엔진 소음이 매우 작기 때문이다.","연료 소모량이 매우 적기 때문이다."],"a":1,"e":"2사이클 엔진은 크랭크축 1회전마다 1회 폭발하므로 같은 배기량에서 출력이 큽니다. ① 밸브 구동장치가 없어 구조가 간단합니다. ③④ 소음과 연료 소모는 오히려 큽니다."},{"q":"2사이클 엔진에서 윤활유가 연료와 함께 연소되기 때문에 발생할 수 있는 현상은?","o":["엔진 소음 감소","점화플러그 수명 증가","백색 또는 청색 계열의 매연 발생","엔진 과냉각"],"a":2,"e":"2사이클 엔진은 윤활유가 연료와 함께 타므로 흰색이나 푸른색 매연이 나옵니다."},{"q":"2사이클 엔진에서 새로운 혼합기가 실린더로 들어가 잔류 배기가스를 밀어내고 실린더 내부를 채우는 과정을 무엇이라고 하는가?","o":["배기 과정","압축 과정","소기과정","연소 과정"],"a":2,"e":"새 혼합기로 잔류 배기가스를 밀어내며 실린더를 채우는 과정이 소기입니다."},{"q":"2사이클 엔진의 일반적인 특징으로 옳지 않은 것은?","o":["4사이클 엔진에 비해 구조가 비교적 간단하다.","같은 배기량일 때 4사이클 엔진보다 출력이 높을 수 있다.","4사이클 엔진보다 연비가 좋고 배기가스가 깨끗하다.","부품 수가 적어 소형화·경량화에 유리하고 반응이 빠른 편이다."],"a":2,"e":"2사이클 엔진은 새 혼합기 일부가 배기구로 빠져나가고 윤활유도 함께 타므로 연비가 나쁘고 배기가스가 많습니다. ①②④는 2사이클 엔진의 옳은 특징입니다."},{"q":"2사이클 엔진이 4사이클 엔진보다 일반적으로 배기음과 연소 소음이 크게 느껴질 수 있는 이유는?","o":["사용하는 연료의 종류만 다르기 때문이다.","냉각 방식만 다르기 때문이다.","폭발 행정의 빈도가 높기 때문이다.","배기가스 정화장치가 반드시 설치되기 때문이다."],"a":2,"e":"2사이클 엔진은 크랭크축 1회전마다 폭발하므로 폭발 빈도가 4사이클 엔진의 2배입니다. 그래서 배기음과 연소 소음이 크게 느껴집니다."},{"q":"환경 규제 강화로 인해 기존 방식의 2사이클 엔진 사용이 점차 줄어들고 있는 주된 이유는?","o":["4사이클 엔진보다 출력이 지나치게 낮기 때문이다.","유해 배기가스 배출이 많고 연료 효율이 낮기 때문이다.","엔진 구조가 지나치게 복잡하기 때문이다.","생산 비용이 항상 매우 비싸기 때문이다."],"a":1,"e":"2사이클 엔진은 타지 않은 혼합기와 윤활유 연소 때문에 유해 배기가스가 많고 연료 효율이 낮아 환경 규제에 맞추기 어렵습니다. ①③ 출력은 높은 편이고 구조는 간단합니다."},{"q":"엔진의 배기량을 계산하는 데 필요한 요소는?","o":["행정의 길이와 연소실 체적","행정 체적과 연소실 체적","실린더 보어의 지름과 연소실 체적","실린더 보어의 지름과 행정의 길이"],"a":3,"e":"배기량 = π/4 × 보어² × 행정 입니다. 필요한 것은 보어의 지름과 행정의 길이이고, 연소실 체적은 압축비를 구할 때 쓰는 값입니다."},{"q":"피스톤 링의 3대 작용에 해당되지 않는 것은?","o":["기밀 유지 작용","오일 제어 작용","오일 청정 작용","열전도 작용"],"a":2,"e":"피스톤 링의 3대 작용은 기밀 유지, 오일 제어, 열전도입니다. 청정 작용은 엔진오일의 작용입니다."},{"q":"피스톤 링 엔드갭의 정의는?","o":["피스톤 링과 실린더 벽 사이의 간극","피스톤 링 양쪽 끝 사이 간극","피스톤 링과 피스톤 링 홈 사이 간극","피스톤 핀과 피스톤 사이 간극"],"a":1,"e":"엔드갭은 링의 잘린 양쪽 끝 사이의 틈입니다. ③ 링과 링 홈 사이의 틈은 사이드갭입니다."},{"q":"피스톤 링의 사이드갭이 부족할 경우 발생하는 문제점으로 가장 적절한 것은?","o":["링의 움직임이 방해되어 기밀 유지가 어려워진다.","엔진 소음이 증가한다.","오일 소모량이 증가한다.","엔진 과열 현상 발생한다."],"a":0,"e":"사이드갭이 부족하면 링이 홈 안에서 자유롭게 움직이지 못해 실린더 벽에 밀착하지 못하고, 기밀을 유지하기 어려워집니다."},{"q":"피스톤 링 사이드갭이 적용되고 점검되어야 하는 대상은?","o":["오일 링에만 해당","최상단 압축 링에만 해당","모든 피스톤 링에 해당","중간 압축 링에만 해당"],"a":2,"e":"사이드갭은 압축 링과 오일 링 모두에 있으므로 모든 피스톤 링에서 점검합니다."},{"q":"피스톤 핀 베어링의 주된 역할이 아닌 것은?","o":["피스톤 핀 하중 지지","크랭크축 지지","피스톤과 커넥팅 로드 원활한 움직임","피스톤과 커넥팅 로드 마찰 감소"],"a":1,"e":"피스톤 핀 베어링은 커넥팅 로드 소단부에서 피스톤 핀을 지지하고 마찰을 줄입니다. ② 크랭크축을 지지하는 것은 메인 저널 베어링입니다."},{"q":"피스톤 핀 베어링의 형태는 무엇인가?","o":["볼 베어링 또는 테이퍼 롤러 베어링","니들 롤러 또는 부싱","스러스트 베어링 또는 앵귤러 베어링","원통 롤러 베어링 또는 볼 베어링"],"a":1,"e":"커넥팅 로드 소단부는 공간이 좁고 흔들리는 운동을 하므로 니들 롤러 베어링이나 부싱을 씁니다."},{"q":"피스톤 핀 베어링의 마모 징후로 가장 적절한 것은?","o":["오일 압력 경고등이 점등된다.","금속성 소음(따각거림)이 발생한다.","냉각수 누수가 발생한다.","제동력이 약해진다."],"a":1,"e":"피스톤 핀 베어링이 닳아 간극이 커지면 핀이 부딪치면서 따각거리는 금속성 소음이 납니다."},{"q":"메인 저널 베어링의 위치는?","o":["캠축을 지지하는 캠 베어링 부위","변속기 입력축을 지지하는 베어링 부위","휠 허브를 지지하는 허브 베어링 부위","크랭크축을 지지하는 크랭크케이스 또는 실린더 블록 부위"],"a":3,"e":"메인 저널 베어링은 크랭크케이스(실린더 블록)에서 크랭크축의 메인 저널을 지지합니다. ①②③은 각각 캠축, 변속기, 휠의 베어링입니다."},{"q":"메인 저널 베어링의 주된 역할은?","o":["밸브 개폐 타이밍","배기가스 소음 감소","연료 미세 분사","크랭크축 하중 지지 및 고속 회전 시 마찰 감소"],"a":3,"e":"메인 저널 베어링은 크랭크축의 하중을 받치고 고속 회전할 때 마찰을 줄입니다."},{"q":"크랭크축의 휨을 측정할 때 가장 적합한 것은?","o":["스프링저울과 V블록","버니어 캘리퍼스와 곧은자","다이얼 게이지와 V블록","마이크로미터와 다이얼 게이지"],"a":2,"e":"크랭크축 양 끝을 V블록에 올리고 돌리면서 다이얼 게이지로 흔들림을 읽습니다. 휨 값은 게이지가 움직인 값의 1/2입니다."},{"q":"크랭크축의 볼 베어링이 마모·손상될 때 주요 징후는?","o":["밸브 간극 변화","엔진오일 감소","스파크 플러그 오염","엔진에서 소음 발생"],"a":3,"e":"크랭크축의 볼 베어링이 닳거나 손상되면 회전할 때 소음과 진동이 납니다."},{"q":"피스톤의 형상에서 피스톤 핀 보스 방향을 단경으로 하는 타원형 피스톤은?","o":["오토서믹 피스톤","스플리트 피스톤","캠 연마 피스톤","솔리드 피스톤"],"a":2,"e":"캠 연마 피스톤은 핀 보스 방향의 지름을 작게(단경) 깎은 타원형 피스톤입니다. 열을 받아 팽창하면 진원에 가까워집니다."},{"q":"기관 부품 중 표면 경화를 하지 않아도 되는 것은?","o":["피스톤","크랭크 축","피스톤 핀","실린더"],"a":0,"e":"크랭크축, 피스톤 핀, 실린더는 마찰이 커서 표면 경화를 합니다. 피스톤은 알루미늄 합금으로 만들며 표면 경화를 하지 않습니다."},{"q":"피스톤 상단에 위치한 피스톤 링의 주요 기능은?","o":["피스톤의 색상을 변경한다.","실린더 벽과의 기밀을 유지한다.","피스톤의 무게를 줄인다.","피스톤의 온도를 증가시킨다."],"a":1,"e":"피스톤 링은 실린더 벽과 밀착해 압축가스와 연소가스가 새지 않도록 기밀을 유지합니다."},{"q":"피스톤 링 중 압축 링의 주된 역할은?","o":["엔진오일을 실린더 벽에 도포한다.","연소실의 압축 압력을 유지한다.","피스톤의 온도를 낮춘다.","무해 배기가스를 배출한다."],"a":1,"e":"압축 링은 연소실의 압축 압력과 폭발 압력이 새지 않게 유지합니다. ① 오일을 조절하는 것은 오일 링입니다."},{"q":"피스톤 링 중 오일 링(Oil Control Ring)의 주된 역할은?","o":["실린더 벽의 불필요한 엔진오일을 긁어내린다.","연소실의 압축 압력을 유지한다.","피스톤의 온도를 높인다.","엔진 소음을 줄인다."],"a":0,"e":"오일 링은 실린더 벽의 남는 엔진오일을 긁어내립니다. ② 압축 압력 유지는 압축 링의 역할입니다."},{"q":"피스톤에 장착되는 피스톤 핀의 주된 역할은?","o":["피스톤의 온도를 조절한다.","피스톤 링을 고정한다.","피스톤과 커넥팅 로드를 연결한다.","엔진오일을 순환시킨다."],"a":2,"e":"피스톤 핀은 피스톤과 커넥팅 로드 소단부를 연결합니다."},{"q":"피스톤 상단의 헤드(크라운) 부분의 역할은?","o":["엔진오일을 저장한다.","배기가스를 정화한다.","흡입공기의 온도를 높인다.","폭발 압력을 받고 연소열에 직접 노출되는 부분이다."],"a":3,"e":"피스톤 헤드(크라운)는 폭발 압력을 직접 받고 연소열에 그대로 노출되는 부분입니다."},{"q":"피스톤 측면에 있는 스커트 부분의 주된 역할은?","o":["피스톤 링을 지지한다.","연소가스를 배출한다.","피스톤의 기울어짐을 방지한다.","피스톤의 압축 압력을 직접 유지한다."],"a":2,"e":"스커트는 측압을 받아 피스톤이 기울어지거나 흔들리는 것을 막습니다. ① 링을 지지하는 것은 링 홈과 랜드입니다. ④ 압축 압력 유지는 피스톤 링의 역할입니다."},{"q":"피스톤이 소결 현상으로 손상될 수 있는 주된 원인은?","o":["금속끼리 직접 접촉하여 용융되었을 때","엔진 오일량이 너무 많을 때","점화시기가 정상일 때","흡입공기가 많을 때"],"a":0,"e":"소결(소착)은 유막이 끊겨 금속끼리 직접 닿고, 마찰열로 표면이 녹아 붙는 현상입니다. 오일 부족이나 과열이 원인이며, ② 오일이 많은 것은 원인이 아닙니다."},{"q":"피스톤 정비 시, 피스톤 압축 링의 간극을 조정하는 주된 이유는?","o":["흡입공기를 많이 흡입하기 위해","점화시기를 정확하게 작동하기 위해","기밀을 유지하기 위해","오일 소모를 줄이기 위해"],"a":2,"e":"압축 링의 간극을 규정값으로 맞추는 이유는 압축가스가 새지 않게 기밀을 유지하기 위해서입니다."},{"q":"오일 소모량 증가와 직접 관련된 피스톤 부품의 문제는?","o":["피스톤 핀의 휘어짐","피스톤 헤드의 균열","오일 링의 마모","스커트의 파손"],"a":2,"e":"오일 링이 닳으면 실린더 벽의 오일을 긁어내리지 못해 오일이 연소실에서 함께 타므로 오일 소모가 늘어납니다."},{"q":"실린더 헤드에서 캠 베어링의 주된 역할은?","o":["밸브의 열을 흡수한다.","점화플러그를 고정한다.","캠축이 회전하도록 지지한다.","피스톤 작동을 원활하게 한다."],"a":2,"e":"캠 베어링은 캠축을 받쳐 원활하게 회전하도록 지지합니다."},{"q":"이륜자동차 엔진에서 실린더 헤드의 가장 주된 역할은?","o":["흡기 및 배기 밸브와 점화플러그가 장착되고 연소실의 상부를 구성한다.","크랭크축을 지지한다.","피스톤의 상하 운동을 직접적으로 유도한다.","피스톤의 작동을 원활하게 한다."],"a":0,"e":"실린더 헤드에는 흡·배기 밸브와 점화플러그가 장착되고, 연소실의 윗부분을 이룹니다. ② 크랭크축을 지지하는 것은 크랭크케이스입니다."},{"q":"실린더 헤드에 장착되는 밸브 시트의 주된 역할은?","o":["연소실의 기밀을 유지한다.","밸브의 양정을 변화 시킨다.","밸브의 움직임을 좋게 한다.","밸브의 열림량을 크게 한다."],"a":0,"e":"밸브 시트는 밸브 페이스와 밀착해 연소실의 기밀을 유지합니다."},{"q":"실린더 헤드의 변형을 확인하는 주된 이유는?","o":["헤드의 연소실 면적을 확인하기 위해","압축 누설을 확인하기 위해","헤드의 높이를 점검하기 위해","피스톤과의 간극을 점검하기 위해"],"a":1,"e":"실린더 헤드가 변형되면 개스킷이 밀착하지 못해 압축가스가 샙니다. 그래서 헤드의 변형(평면도)을 점검합니다."},{"q":"헤드 볼트를 토크 렌치로 조이는 것이 중요한 이유는?","o":["실린더 헤드의 변형을 방지하고 균일한 체결력을 확보하기 위해","피스톤과의 접촉을 좋게 하기 위해","연소실의 면적을 줄이기 위해","볼트의 길이를 조절하기 위해"],"a":0,"e":"규정 토크로 고르게 조여야 실린더 헤드가 변형되지 않고 체결력이 균일해집니다."},{"q":"이륜자동차 엔진에서 실린더 블록의 가장 주된 역할은?","o":["엔진의 주요 회전 및 왕복 운동 부품들을 지지한다.","엔진오일을 저장하는 공간이다.","흡기 및 배기 밸브를 장착하는 부분이다.","배기가스를 외부로 배출하는 통로이다."],"a":0,"e":"실린더 블록은 피스톤, 크랭크축 등 주요 운동 부품을 지지하는 엔진의 뼈대입니다. ② 오일 저장은 오일 팬, ③ 밸브 장착은 실린더 헤드의 역할입니다."},{"q":"실린더 블록 내의 실린더 보어의 주된 역할은?","o":["엔진오일을 저장한다.","점화플러그를 고정한다.","냉각수를 순환시킨다.","피스톤이 상하 왕복 운동하는 공간을 제공한다."],"a":3,"e":"실린더 보어는 피스톤이 상하로 왕복 운동하는 공간입니다."}],"id":"p00"},{"g":"섀시","name":"제동장치","qs":[{"q":"유압식 브레이크의 원리는?","o":["베르누이의 원리","파스칼의 원리","애커먼 장토식의 원리","렌츠의 원리"],"a":1,"e":"유압식 브레이크는 밀폐된 액체에 가한 압력이 모든 방향으로 같은 크기로 전달된다는 파스칼의 원리를 이용합니다. 베르누이는 유속과 압력, 애커먼 장토식은 조향, 렌츠는 유도 전류의 방향에 관한 원리입니다."},{"q":"제동장치의 구비조건이 아닌 것은?","o":["제동 효과가 클 것","신뢰성이 좋을 것","화재에 견디는 내열성이 클 것","정비가 용이할 것"],"a":2,"e":"제동장치의 구비조건은 제동 효과, 신뢰성, 내구성, 점검·정비의 용이함입니다. 화재에 견디는 내열성은 구비조건에 들어 있지 않습니다."},{"q":"유압 브레이크의 설명으로 틀린 것은?","o":["제동력 전달이 동일하여 마찰 생시키는 가장 핵심적인 부품은?","o":["브레이크 캘리퍼","브레이크 레버","브레이크 호스","브레이크 디스크"],"a":0,"e":"브레이크 캘리퍼는 유압을 받아 피스톤으로 패드를 디스크에 눌러 제동력을 만드는 장치입니다. 레버와 호스는 힘과 유압을 전달하는 부품입니다."},{"q":"이륜자동차 브레이크액이 오래되거나 오염되었을 때 발생할 수 있는 가장 위험한 문제는?","o":["타이어 공기압 증가","엔진 출력 증가","브레이크 베이퍼록 현상으로 제동력 상실","연료 소모량 감소"],"a":2,"e":"오래되거나 오염된 브레이크액은 수분 때문에 비등점이 낮아져 베이퍼록이 생기고, 제동력을 잃을 수 있습니다."},{"q":"이륜자동차 브레이크를 잡을 때 ‘끼익’하는 소리가 심하게 나면 무엇을 의심해야 하나?","o":["타이어 공기압","브레이크 패드가 다 닳았는지","브레이크 유격","브레이크 오일 양"],"a":1,"e":"패드가 다 닳으면 금속 부분이 디스크에 닿아 '끼익' 하는 소리가 납니다."},{"q":"이륜자동차 브레이크 시스템의 최종 점검 단계에서 반드시 확인해야 할 사항은?","o":["타이어 공기압","엔진오일 교환 시기","브레이크 제동력, 제동 시 이상 소음 유무","타이어 제조일자"],"a":2,"e":"최종 점검에서는 브레이크가 제대로 듣는지(제동력)와 제동할 때 이상 소음이 없는지 확인합니다."},{"q":"이륜자동차 브레이크 시스템 점검 후, 브레이크 레버나 페달을 여러 번 작동시켜야 하는 이유는?","o":["브레이크 오일 온도를 높이기 위해","브레이크 오일을 섞이게 하기 위해","브레이크 유압 시스템 내의 압력을 정상화하기 위해","브레이크 레버의 길이를 조절하기 위해"],"a":2,"e":"점검이나 정비 뒤에는 레버나 페달을 여러 번 작동시켜 패드를 디스크에 밀착시키고 유압을 정상으로 되돌립니다."},{"q":"브레이크액 취급 시 주의사항이 아닌 것은?","o":["지정된 브레이크액을 사용하고 성분이 다른 오일과 혼합하여 사용해도 좋다.","엔진의 오일이나 광물성 오일을 절대로 주입하지 않도록 한다.","브레이크액의 용기는 필요에 따라서 보충해야 하기 때문에 보관해야 한다.","브레이크액이 도장 면에 떨어지면 침식하기 때문에 취급 시 주의해야 한다."],"a":0,"e":"성분이 다른 브레이크액을 섞으면 변질되거나 고무 부품이 상할 수 있으므로 지정된 브레이크액만 씁니다."},{"q":"브레이크 오일이 비등하여 송유 압력의 전달 작용이 불가능하게 되는 현상은?","o":["페이드 현상","사이클링 현상","베이퍼록 현상","브레이크록 현상"],"a":2,"e":"브레이크 오일이 끓어 기포가 생기고 압력이 전달되지 않는 현상이 베이퍼록입니다. 페이드는 마찰면 과열로 마찰계수가 떨어지는 현상입니다."},{"q":"캘리퍼 점검으로 옳지 않은 것은?","o":["캘리퍼의 마모, 손상, 균열 및 먼지를 점검한다.","피스톤의 먼지, 손상, 균열 및 내측 면 마모를 점검한다.","패드 스프링 및 부트의 손상을 점검한다.","슬리브 및 핀의 마모와 먼지를 점검한다."],"a":1,"e":"캘리퍼 피스톤은 실린더와 맞닿는 바깥 면(외측 면)이 닳으므로 외측 면의 마모를 점검합니다. 내측 면은 점검 대상이 아닙니다."},{"q":"이륜자동차 브레이크 점검방법에 대한 설명으로 틀린 내용은?","o":["브레이크 레버 유격은 이륜자동차를 가볍게 움직이면서 레버를 당겨서 점검하고 필요할 때 조정해야 한다.","브레이크 패드와 디스크 원판은 수시로 점검하고 디스크의 마모로 인한 소음이 발생하면 즉시 교체해야 한다.","브레이크 호스의 누유 부분이 발생하는가 수시로 점검해야 한다.","브레이크 오일은 정비 매뉴얼에 제시한 주행거리와 관계없이 교체하지 않고 보충하면 된다."],"a":3,"e":"브레이크 오일은 수분을 흡수해 성능이 떨어지므로 정비 매뉴얼에 제시된 주기에 맞춰 교체해야 합니다. 보충만으로는 안 됩니다."},{"q":"드럼 브레이크에 비해 디스크 브레이크가 가지는 특징에 대한 설명으로 옳지 않은 것은?","o":["냉각성능이 좋기 때문에 제동성능을 안정적으로 낼 수 있다.","구조가 간단하고 부품 수가 적어서 정비가 쉽다.","마찰면적이 적어 상대적으로 큰 패드 압착력을 필요로 한다.","자기작동작용이 있기 때문에 고속에서 반복적으로 사용해도 제동력의 변화가 적다."],"a":3,"e":"자기작동작용은 드럼 브레이크의 특징입니다. 디스크 브레이크는 자기작동작용이 없어 제동력의 변화가 적고 안정적입니다."}],"id":"p01"},{"g":"섀시","name":"조향장치","qs":[{"q":"조향장치에 관한 설명으로 틀린 것은?","o":["방향 전환을 원활하게 한다.","스티어링 샤프트와 프론트 서스펜션의 위치 변경으로 주행에 영향을 줄 수 없다.","조향핸들의 회전과 바퀴의 선회 차이가 크지 않아야 한다.","탑 브릿지를 고정하는 스템 너트의 조임 토크 는 안정성을 위해 최대한 높은 토크로 체결한 다."],"a":1,"e":"스티어링 샤프트와 프론트 서스펜션의 위치나 각도가 바뀌면 캐스터와 트레일이 달라져 주행 안정성과 조향 감각에 영향을 줍니다. 영향을 줄 수 없다는 ②가 틀린 설명입니다."},{"q":"이륜자동차 핸들이 움직일 때 ‘덜그럭’하는 소 리가 나거나 흔들린다면, 무엇을 의심해야 하 는가?","o":["엔진 각부 베어링","브레이크 패드","휠 베어링","핸들 안쪽 베어링"],"a":3,"e":"핸들 안쪽의 스티어링 베어링이 닳거나 느슨하면 핸들을 움직일 때 덜그럭거리고 흔들립니다."},{"q":"이륜자동차 핸들의 유격이 과도하거나 움직임 이 뻑뻑할 때 점검해야 할 부품은?","o":["스티어링 베어링","클러치 케이블","스로틀 케이블","브레이크 패드"],"a":0,"e":"스티어링 베어링의 조임이 느슨하면 유격이 커지고, 너무 조이거나 손상되면 움직임이 뻑뻑해집니다. ②③④는 핸들 유격과 관계없는 부품입니다."},{"q":"이륜자동차의 앞바퀴가 좌우로 흔들리거나 불 안정할 때, 점검해야 할 부품은?","o":["시트 조립 상태","브레이크 패드 마모 상태","프론트 포크의 상태","소음기 조립 상태"],"a":2,"e":"프론트 포크가 휘었거나 고정 상태가 나쁘면 앞바퀴가 좌우로 흔들리고 불안정해집니다."},{"q":"이륜자동차 휠 베어링에 유격이 있거나 소음이 발생할 때, 주행 중 나타날 수 있는 현상은?","o":["주행 중 휠에서 비정상적인 소음이 발생한다.","엔진 소음이 증가한다.","배기 소음이 증가한다.","주행 중 발전기에서 비정상적인 소음이 발생 한다."],"a":0,"e":"휠 베어링에 유격이 있거나 손상되면 주행 중 휠에서 비정상적인 소음이 납니다. 엔진, 배기, 발전기 소음과는 관계가 없습니다."},{"q":"이륜자동차에 사용되고 있는 핸들의 종류가 아 닌 것은?","o":["업 핸들","플랫 핸들","틸트 스티어링 휠","클립온 핸들"],"a":2,"e":"틸트 스티어링 휠은 자동차에서 각도를 조절하는 조향 핸들입니다. 이륜자동차 핸들에는 업 핸들, 플랫 핸들, 클립온(세퍼레이트) 핸들이 있습니다."},{"q":"타이어 회전이 무거울 때 그 원인이 아닌 것은?","o":["타이어 공기압이 높다.","타이어 과대 마모","베어링 어져스트 너트의 조임이 과다하다.","스티어링 헤드 베어링의 손상"],"a":0,"e":"공기압이 높으면 접지 면적이 줄어 오히려 가볍게 구릅니다. ②③④는 회전을 무겁게 하는 원인입니다."},{"q":"선회 주행 시 앞바퀴에서 발생하는 코너링 포스 가 뒷바퀴보다 크면 나타나는 현상은?","o":["토크 스티어링 현상","언더 스티어링 현상","오버 스티어링 현상","리버스 스티어링 현상"],"a":2,"e":"앞바퀴의 코너링 포스가 뒷바퀴보다 크면 앞쪽이 안으로 더 파고들어 선회 반지름이 작아지는 오버 스티어링이 됩니다. 반대로 뒷바퀴 쪽이 크면 언더 스티어링입니다."},{"q":"이륜자동차 휠 베어링에 문제가 있을 때, 확인 가능한 소음의 특징은?","o":["‘딸깍’ 거리는 소리","‘윙’ 또는 ‘그르륵’ 거리는 지속적인 회전 소음","‘삐걱’ 거리는 소리","‘싁싁’ 거리는 바람 소리"],"a":1,"e":"휠 베어링이 손상되면 바퀴가 도는 동안 계속 '윙' 또는 '그르륵' 하는 회전 소음이 납니다."},{"q":"이륜자동차 리어 휠이 비정상적으로 좌우로 흔 들리거나 유격이 느껴진다면, 휠 얼라인먼트 외에 어떤 부품을 점검해야 하는가?","o":["프론트 포크","헤드라이트 전구","스윙암 피벗 베어링 또는 부싱","클러치 케이블"],"a":2,"e":"리어 휠이 좌우로 흔들리면 스윙암을 프레임에 연결하는 피벗 베어링이나 부싱의 마모를 점검합니다."},{"q":"이륜자동차의 앞뒤 바퀴가 한 줄로 정렬되지 않고 약간 엇갈려 주행할 때, 이를 해결하기 위해 점검 및 조절해야 할 것은?","o":["브레이크 디스크 마모","프레임의 휨 여부 또는 스윙암 정렬","엔진 냉각수량","타이어의 공기압만 조절"],"a":1,"e":"앞뒤 바퀴가 일직선으로 정렬되지 않으면 프레임이 휘었는지, 스윙암(뒷바퀴) 정렬이 맞는지 점검하고 조절합니다."},{"q":"이륜자동차 스윙암 부싱 또는 베어링의 유격이 발생했을 때, 후륜에 어떤 영향을 미치는가?","o":["후륜이 더 단단해진다.","후륜 타이어의 마모가 감소한다.","후륜 브레이크 성능이 향상된다.","후륜이 좌우로 유격이 생긴다."],"a":3,"e":"스윙암 부싱이나 베어링에 유격이 생기면 스윙암이 좌우로 놀기 때문에 후륜에도 좌우 유격이 생깁니다."},{"q":"이륜자동차 휠 얼라인먼트가 불량할 때, 주행 중 나타날 수 있는 현상은?","o":["엔진이 주행 중 좌우로 흔들린다.","이륜자동차가 한쪽으로 쏠리거나 핸들링이 불안정하다.","제동력이 증가한다.","연료소모가 감소한다."],"a":1,"e":"휠 얼라인먼트가 나쁘면 차가 한쪽으로 쏠리고 핸들링이 불안정해집니다."},{"q":"이륜자동차 리어 휠 얼라인먼트(뒷바퀴 정렬) 에 가장 큰 영향을 미치는 것은?","o":["헤드라이트의 밝기","연료탱크 용량","엔진오일의 용량","스윙암의 정렬 및 체인장력 조절"],"a":3,"e":"뒷바퀴 정렬은 스윙암의 정렬과 체인 장력 조절에 좌우됩니다. 체인 장력을 조절할 때 좌우 조정량을 똑같이 맞춰야 뒷바퀴가 바르게 정렬됩니다."},{"q":"조향 후 직진 방향으로의 복원력을 주는 휠 얼 라이먼트의 요소는?","o":["캠버","캐스터","킹핀경사각","토-아웃"],"a":1,"e":"캐스터는 조향 후 바퀴가 직진 방향으로 되돌아오는 복원력을 줍니다."},{"q":"이륜자동차 휠 얼라인먼트를 정확하게 측정하 고 조정하기 위해 필요한 전문 장비는?","o":["일반 줄자","드라이버","휠 얼라인먼트 전용 측정 장비","스패너"],"a":2,"e":"휠 얼라인먼트는 전용 측정 장비로 정확하게 측정하고 조정합니다. 줄자, 드라이버, 스패너만으로는 정확히 잴 수 없습니다."},{"q":"지면에 프론트 포크가 장착되어 있는 스티어링 헤드가 얼마나 기울어져 있는가를 나타내는 수 치는 어떤 것인가?","o":["캐스터","캠버","셋백","토인"],"a":0,"e":"캐스터는 프론트 포크가 달린 스티어링 헤드(조향축)가 지면에 대해 기울어진 정도를 나타냅니다. 캠버는 바퀴의 좌우 기울기, 토인은 바퀴 앞쪽이 안으로 모인 정도입니다."},{"q":"이륜자동차 휠 얼라인먼트를 점검해야 하는 경 우는?","o":["타이어 공기압이 낮을 때","타이어 편 마모가 발생했을 때","브레이크가 작동이 불량할 때","엔진오일을 교환할 때"],"a":1,"e":"타이어가 한쪽만 닳는 편마모가 생기면 휠 얼라인먼트를 점검합니다."},{"q":"차륜 정렬 측정 및 조정을 해야 할 이유와 거리 가 먼 것은?","o":["브레이크의 제동력이 약할 때","현가장치를 분해⋅조립했을 때","핸들이 흔들리거나 조작이 불량할 때","충돌사고로 인해 차체에 변형이 생겼을 때"],"a":0,"e":"제동력이 약한 것은 제동장치의 문제이므로 차륜 정렬과 거리가 멉니다. ②③④는 차륜 정렬을 측정·조정해야 하는 경우입니다."},{"q":"이륜자동차의 휠 얼라인먼트가 불량함에도 불 구하고 계속 주행할 경우, 연비에는 어떤 영향 을 미치는가?","o":["연비가 향상된다.","연비가 감소한다.","연비하고는 아무런 관계가 없다.","연비가 두 배 좋아진다."],"a":1,"e":"휠 얼라인먼트가 나쁘면 구름저항이 커져 연비가 떨어집니다."},{"q":"이륜자동차 휠 얼라인먼트 불량으로 인해 타이 어에서 발생할 수 있는 문제점은?","o":["타이어 수명 연장","타이어 편마모 가속화","타이어 공기압 증가","타이어 공기압 감소"],"a":1,"e":"휠 얼라인먼트가 나쁘면 타이어가 노면에 고르게 닿지 않아 편마모가 빨라집니다."},{"q":"이륜자동차 휠 얼라인먼트를 잘못 조정했을 때 발생할 수 있는 위험한 상황은?","o":["연료소모는 감소한다.","브레이크 성능이 향상된다.","타이어 수명이 증가한다.","주행 중 이륜자동차 제어가 어렵다."],"a":3,"e":"휠 얼라인먼트를 잘못 조정하면 직진성과 조향 안정성이 나빠져 주행 중 차를 제어하기 어렵습니다."}],"id":"p02"},{"g":"섀시","name":"현가장치","qs":[{"q":"이륜자동차 현가장치의 역할이 아닌 것은?","o":["승차감을 향상시킨다.","주행 안정성을 높인다.","주행 중 속도를 낮춘다.","차량의 조종성을 향상시킨다."],"a":2,"e":"현가장치는 승차감, 주행 안정성, 조종성을 높입니다. 주행 중 속도를 낮추는 것은 제동장치의 역할입니다."},{"q":"이륜자동차 서스펜션의 역할은 무엇인가?","o":["브레이크 성능을 향상시킨다.","배터리에 충전을 한다.","엔진시동을 원활하게 한다.","노면의 충격을 흡수한다."],"a":3,"e":"서스펜션은 노면에서 올라오는 충격을 흡수합니다."},{"q":"이륜자동차의 후륜 댐퍼유닛에 대한 설명 중 옳지 않은 것은?","o":["댐퍼는 자기복원성으로 진동과 충격을 흡수 한다.","스프링과 댐퍼가 함께 작동하여 차량의 조종 성을 높인다.","스프링은 차량을 지지하며 댐퍼의 단점을 상 호 보완한다.","댐퍼 유닛은 댐퍼와 스프링의 조합으로 구성 되어 있다."],"a":0,"e":"원래 길이로 돌아가려는 성질(자기복원성)로 충격을 흡수하는 것은 스프링입니다. 댐퍼는 스프링의 진동을 억제하는 역할을 합니다."},{"q":"이륜자동차 서스펜션 시스템에서 고유 진동수가 너무 높을 때 주행 중 나타날 수 있는 현상은?","o":["승차감이 부드러워진다.","노면 충격 흡수가 잘 된다.","타이어 마모가 줄어든다.","노면의 작은 요철에도 차체가 심하게 흔들려 승차감이 딱딱하게 느껴진다."],"a":3,"e":"고유 진동수가 높다는 것은 스프링이 단단하다는 뜻입니다. 작은 요철에도 차체가 흔들려 승차감이 딱딱하게 느껴집니다."},{"q":"이륜자동차 서스펜션에서 프리로드를 조절하 는 목적은?","o":["서스펜션 오일의 점도를 변경하기 위해","서스펜션 길이를 늘리기 위해","서스펜션 스프링의 압축 강도를 조절하기 위해","서스펜션의 작동 소음을 줄이기 위해"],"a":2,"e":"프리로드 조절은 스프링을 미리 눌러 두는 정도, 곧 스프링의 초기 압축 강도를 조절하는 것입니다."},{"q":"질소 가압식 오일 댐퍼에서 오일의 공간과 질소 가스 공간 경계에 프리 피스톤을 설치한 형식을 무엇이라 하는가?","o":["모노튜브 댐퍼","에멀션 댐퍼","스위암 댐퍼","리저브 댐퍼"],"a":0,"e":"모노튜브(단동식) 댐퍼는 프리 피스톤으로 오일실과 질소 가스실을 나눈 형식입니다. 에멀션 댐퍼는 오일과 가스가 나뉘어 있지 않습니다."},{"q":"이륜자동차 스윙암의 부싱 또는 베어링이 마모 되었을 때, 후륜에서 나타날 수 있는 현상은?","o":["후륜 브레이크가 잠긴다.","후륜이 좌우로 흔들리거나 유격이 발생한다.","후륜 타이어의 공기압이 저하된다.","후륜에서 배기 소음이 커진다."],"a":1,"e":"스윙암의 부싱이나 베어링이 닳으면 스윙암이 놀아 후륜이 좌우로 흔들리고 유격이 생깁니다."},{"q":"이륜자동차 앞바퀴의 흔들림이 나타나면 생기 는 증상이 아닌 것은?","o":["핸들바 진동","주행 불안정","진행 방향성 향상","소음 발생과 타이어 마모"],"a":2,"e":"앞바퀴가 흔들리면 핸들 진동, 주행 불안정, 소음과 타이어 마모가 생깁니다. 진행 방향성은 오히려 나빠집니다."},{"q":"이륜자동차 프론트 포크와 댐퍼 로드가 손상 되었을 때, 나타날 수 있는 현상은?","o":["서스펜션의 감쇠력이 저하된다.","타이어 수명이 연장된다.","승차감이 향상된다.","브레이크 성능이 향상된다."],"a":0,"e":"프론트 포크와 댐퍼 로드가 손상되면 진동을 억제하는 힘(감쇠력)이 떨어집니다."},{"q":"이륜자동차 서스펜션의 압축 댐핑 조절이 너무 약하게 설정되었을 때, 나타날 수 있는 현상은?","o":["서스펜션이 천천히 압축되어 충격을 잘 흡수 하지 못한다.","승차감이 향상된다.","서스펜션이 충격을 받으면 너무 쉽게 깊이 압 축된다.","타이어의 마모가 감소한다."],"a":2,"e":"압축 댐핑이 너무 약하면 충격을 받을 때 서스펜션이 너무 쉽게, 깊이 압축됩니다."},{"q":"리어 쿠션 스프링에서 피치의 변화가 없는 타입 으로 가장 적당한 것은?","o":["부등피치 타입","등피치 타입","조합 타입","에어 어져스트 타입"],"a":1,"e":"등피치 타입은 코일 사이의 간격(피치)이 처음부터 끝까지 같습니다. 부등피치 타입은 피치가 달라집니다."},{"q":"유니트 스윙식 리어 서스펜션을 적용하고 있는 이륜차 타입은?","o":["스쿠터 타입","비즈니스 타입","바이크 타입","AVT 타입"],"a":0,"e":"유니트 스윙식은 엔진과 구동장치가 한 덩어리로 스윙암 역할을 하는 방식으로, 스쿠터 타입에 씁니다."},{"q":"이륜자동차 서스펜션 오일 교환 작업 시 주의해 야 할 사항은?","o":["오일 교환 후 에어빼기 작업을 하지 않아도 된다.","엔진 오일을 사용해도 무관하다.","오일을 가득 채운다.","규정된 서스펜션 오일의 종류와 정량을 사용 한다."],"a":3,"e":"서스펜션 오일은 규정된 종류와 정량을 써야 감쇠력이 제대로 나옵니다. ② 엔진 오일을 쓰면 안 되고, ③ 가득 채우면 작동이 나빠집니다."},{"q":"이륜자동차 스윙암의 피벗 부분 베어링에 유격 이 발생했을 때, 점검방법으로 가장 적절한 것 은?","o":["핸들을 좌우로 흔들어 유격 여부를 확인한다.","엔진을 시동하여 소리를 듣는다.","브레이크 레버를 잡고 흔든다.","타이어 공기압을 측정한다."],"a":0,"e":"유격은 손으로 좌우로 흔들어 보아 덜컹거림이 있는지로 확인합니다. ②③④의 방법으로는 유격을 알 수 없습니다."},{"q":"도립식 서스펜션의 장점이 아닌 것은?","o":["노면 추종성 향상","강성이 증가","내구성 저하","반응속도 향상"],"a":2,"e":"도립식은 굵은 아우터 튜브가 위에 있어 강성이 높고, 노면 추종성과 반응속도가 좋습니다. 내구성 저하는 장점이 아닙니다."},{"q":"이륜자동차 서스펜션이 제대로 작동하지 않을 때, 주행 중 가장 위험한 상황은?","o":["승차감이 향상된다.","엔진 소음이 감소한다.","노면 접지력 감소된다.","브레이크 패드 수명이 늘어난다."],"a":2,"e":"서스펜션이 제대로 작동하지 않으면 타이어가 노면에서 떠서 접지력이 줄어듭니다. 이것이 가장 위험합니다."},{"q":"이륜자동차 서스펜션 오버홀 작업 시, 반드시 교환해야 할 부품은?","o":["엔진 오일 씰","변속기 오일 씰","브레이크 캘리퍼","포크 오일 및 더스크 씰, 포크 오일 씰"],"a":3,"e":"서스펜션을 오버홀할 때는 포크 오일, 포크 오일 씰, 더스트 씰을 교환합니다."},{"q":"이륜자동차 프론트 포크의 좌우 밸런스가 맞지 않을 때, 주행 중 나타날 수 있는 현상은?","o":["브레이크 소음이 줄어든다.","엔진 오일 소모가 줄어든다.","핸들링이 불안정하다.","타이어 수명이 증가한다."],"a":2,"e":"프론트 포크의 좌우 밸런스가 맞지 않으면 좌우 감쇠력이 달라 핸들링이 불안정합니다."},{"q":"이륜자동차 서스펜션 부품 중, 충격 흡수 후 스프링이 다시 늘어나는 속도를 조절하는 기능 을 무엇이라 하는가?","o":["프리로드","압축 댐핑","리바운드 댐핑","스프링 강도"],"a":2,"e":"리바운드 댐핑은 눌렸던 스프링이 다시 늘어나는 속도를 조절합니다. 압축 댐핑은 눌리는 속도를 조절합니다."},{"q":"단동식 서스펜션의 장점으로 옳은 것은?","o":["복동식보다 냉각효율이 떨어진다.","실린더의 충격이 가해졌을 때 내구성이 좋다.","가스실이 내부에 격리되어 있어 에어레이션 (Aeration) 현상이 생기지 않는다.","상대적으로 구조가 복잡하여 제작방식이 어 렵다."],"a":2,"e":"단동식은 가스실이 프리 피스톤으로 격리되어 있어 오일에 기포가 섞이는 에어레이션 현상이 생기지 않습니다. ①④는 장점이 아닙니다."},{"q":"이륜자동차 앞 서스펜션 오일 누유시 발생할 수 있는 문제로 틀린 것은?","o":["주행 중 소음 증가","제동력 저하","승차감 저하","타이어 편 마모 발생"],"a":1,"e":"포크 오일이 새면 감쇠력이 떨어져 소음이 늘고 승차감이 나빠지며 타이어가 고르게 닳지 않습니다. 이 문제에서는 제동력 저하를 누유로 생기는 문제로 보지 않습니다."},{"q":"이륜자동차에서 다운 사이드 포크 방식이 가지 는 일반적인 장점은?","o":["강성이 높아 조향 안정성이 좋다.","제작비용이 매우 저렴하다.","오일 누유가 전혀 발생하지 않는다.","정비가 매우 쉽다."],"a":0,"e":"이 방식은 포크의 강성이 높아 조향 안정성이 좋은 것이 장점입니다. ②③④처럼 값이 싸거나, 누유가 전혀 없거나, 정비가 쉬운 것은 아닙니다."},{"q":"오토바이의 서스펜션 중 리저버 타입 쇽업소버 서스펜션의 특징으로 틀린 것은?","o":["오일량이 보다 많아 냉각성능이 우수하다.","별도의 가스 챔버가 있어 서스펜션이 압축될 때 저항력이 점진적으로 증가하는 특성이 있 어 승차감이 좋다.","리저버 탱크의 방식에는 밸브, 다이어프램 방 식이 있다.","내부에 완충스프링이 장착되어 있어 조절이 가능하다."],"a":3,"e":"리저버 타입은 별도의 탱크에 오일과 가스를 담아 오일량이 많고 냉각 성능이 좋습니다. 리저버 탱크 안에 완충 스프링이 들어 있는 것은 아닙니다."},{"q":"이륜자동차 서스펜션의 정비 주기를 결정하는 가장 중요한 요소는?","o":["이륜자동차의 엔진 성능","주행거리, 주행 환경","이륜자동차의 배기 소음","이륜자동차의 연비"],"a":1,"e":"서스펜션의 정비 주기는 주행거리와 주행 환경에 따라 정합니다."},{"q":"이륜자동차 프론트 포크 오일 점검 시, 가장 중요하게 확인해야 할 사항은?","o":["오일의 양과 점도 및 누유 여부","오일의 색깔","오일의 냄새","오일의 투명 여부"],"a":0,"e":"프론트 포크 오일은 양과 점도, 누유 여부를 확인합니다. 색깔이나 냄새만으로는 판단하기 어렵습니다."},{"q":"프론트 서스펜션의 프리로드를 줄이면 어떤 현 상이 발생하는가?","o":["프리로드를 줄일수록 차체는 낮아져 고속 주 행에 도움을 준다.","프리로드를 줄일수록 차체는 높아져 리바운 드 성능이 증대된다.","예압이 늘어나 최종 부하량이 증가한다.","예압이 줄어들어 최종 부하량이 증가한다."],"a":2,"e":"프리로드는 스프링을 미리 눌러 두는 양(예압)을 말하며, 차체 높이와 스프링이 받는 하중에 영향을 줍니다."},{"q":"이륜자동차 리어 쇽업소버에서 ‘찌걱 찌걱’ 또 는 ‘꿀럭 꿀럭’ 같은 소리가 발생하면서 서스펜 션의 작동이 원활하지 않다면 무엇을 의심해야 하는가?","o":["체인 장력 불량","브레이크 불량","쇽업소버 내부의 부품 마모","타이어 마모"],"a":2,"e":"쇽업소버에서 소리가 나고 작동이 원활하지 않으면 내부 부품의 마모를 의심합니다."},{"q":"이륜자동차 프론트 포크의 이너 튜브에 흠집이 나 녹이 발생했을 때, 발생하는 문제는?","o":["타이어 수명이 단축된다.","브레이크 패드 수명이 늘어난다.","오일 누유가 발생하고, 댐퍼 기능이 저하된 다.","오일양이 많아지고, 댐퍼 기능이 향상된다."],"a":2,"e":"이너 튜브에 흠집이나 녹이 있으면 오일 씰이 상해 오일이 새고, 댐퍼 기능이 떨어집니다."},{"q":"이륜자동차 서스펜션의 작동 범위를 제한하는 범프 스톱의 역할은?","o":["서스펜션의 충격을 완화하고 충돌을 막는다.","서스펜션 오일의 온도를 조절한다.","스프링의 길이를 조절한다.","서스펜션의 충격을 증가시킨다."],"a":0,"e":"범프 스톱은 서스펜션이 끝까지 눌렸을 때 충격을 완화하고 부품끼리 부딪치는 것을 막습니다."},{"q":"모터사이클 전륜측 쇽업소버 내의 스프링의 피 치가 점점 작아지는 이유는?","o":["쇽업소버의 포크튜브 내 체적당 더욱 많은 스 프링을 장착하기 위해","프로그레시브 압축특성을 증가시키기 위해","쇽업소버의 확장시간을 일률적으로 맞추기 위해","쇽업소버의 중량을 줄이기 위해"],"a":1,"e":"피치가 점점 작아지는 스프링은 눌릴수록 단단해집니다. 이런 프로그레시브(점진적) 압축 특성을 얻기 위한 것입니다."},{"q":"스프링 정수가 5kgf/mm인 코일 스프링을 5cm 압축하는데 필요한 힘(kgf)은?","o":["2500","250","25","2.5"],"a":1,"e":"힘 = 스프링 정수 × 압축량 입니다. 단위를 맞추면 5cm = 50mm.\n5kgf/mm × 50mm = 250kgf"},{"q":"이륜자동차 서스펜션 오일의 점도가 너무 낮을 때 나타날 수 있는 현상은?","o":["승차감이 너무 단단해진다.","조향 안정성이 좋아진다.","서스펜션이 쉽게 가라앉는다.","오일 누유가 없어진다."],"a":2,"e":"오일 점도가 너무 낮으면 감쇠력이 약해져 서스펜션이 쉽게 가라앉습니다."},{"q":"이륜자동차 서스펜션이 리바운드 댐핑 조절이 너무 강하게 설정되었을 때 증상은?","o":["서스펜션이 빠르게 늘어나 승차감이 부드러 워진다.","서스펜션이 빠르게 줄어들어 승차감이 부드 러워진다.","서스펜션에서 오일이 누유되지만, 댐퍼 기능 이 향상된다.","요철 통과 후 서스펜션이 완전히 펴지지 않는 느낌을 준다."],"a":3,"e":"리바운드 댐핑이 너무 강하면 늘어나는 속도가 느려, 요철을 지난 뒤에도 서스펜션이 다 펴지지 않는 느낌을 줍니다."},{"q":"이륜자동차 프론트 포크 오일을 주기적으로 교 환해야 하는 주된 이유는?","o":["엔진의 성능을 높이기 위해","오일이 오염되거나 점도가 변하기 때문","브레이크 성능을 향상시키기 위해","타이어의 수명을 연장하기 위해"],"a":1,"e":"포크 오일은 쓰는 동안 오염되고 점도가 변해 감쇠력이 떨어지므로 주기적으로 교환합니다."},{"q":"이륜자동차 서스펜션의 작동 범위가 너무 짧게 느껴지고, 작은 요철에도 충격이 심하게 올라 온다면 무엇을 의심할 수 있는가?","o":["타이어 공기압이 너무 낮다.","브레이크 작동이 불량하다.","서스펜션 스프링이 너무 단단하다.","서스펜션 스프링이 너무 부드럽다."],"a":2,"e":"스프링이 너무 단단하면 잘 눌리지 않아 작동 범위가 짧게 느껴지고 작은 요철의 충격도 그대로 올라옵니다."},{"q":"이륜자동차 서스펜션의 프리로드를 높게 조절 했을 때, 승차감에 주는 영향은?","o":["승차감이 더 부드러워진다.","승차감이 매우 나빠진다.","승차감에 변화가 없다.","승차감이 더 단단해진다."],"a":3,"e":"프리로드를 높이면 스프링이 미리 더 눌려 있어 승차감이 단단해집니다."},{"q":"이륜자동차 앞 서스펜션의 주요 구성 부품이 아닌 것은?","o":["이너 튜브","스프로킷","포크 스프링","아우터 튜브"],"a":1,"e":"스프로킷은 체인을 거는 동력전달장치 부품입니다. 이너 튜브, 포크 스프링, 아우터 튜브는 앞 서스펜션의 구성 부품입니다."},{"q":"이륜자동차가 울퉁불퉁한 길을 지나갈 때 충격 을 줄여주는 장치는?","o":["시트","서스펜션","브레이크","핸들"],"a":1,"e":"울퉁불퉁한 길의 충격을 줄여 주는 장치는 서스펜션입니다."},{"q":"현가장치에서 승차감을 위주로 고려할 때의 방 법으로 설명이 틀린 것은?","o":["스프링 아래 질량은 가벼울수록 좋다.","스프링 상수는 낮을수록 좋다.","스프링 위 질량은 클수록 좋다.","스프링 아래 질량은 클수록 좋다."],"a":3,"e":"승차감을 좋게 하려면 스프링 아래 질량은 가벼울수록, 스프링 상수는 낮을수록, 스프링 위 질량은 클수록 좋습니다. 스프링 아래 질량이 크면 승차감이 나빠집니다."},{"q":"이륜자동차 서스펜션에서 쇽업소버의 역할은?","o":["이륜자동차의 무게를 지지한다.","이륜자동차의 높이를 조절한다.","스프링의 진동을 적절히 억제한다.","스프링의 진동을 높여 충격을 준다."],"a":2,"e":"쇽업소버는 스프링의 진동을 알맞게 억제합니다. ① 무게를 지지하는 것은 스프링입니다."},{"q":"이륜자동차 서스펜션 스프링이 약해졌을 때, 나타날 수 있는 증상은?","o":["이륜자동차가 쉽게 내려앉고 과도하게 출렁 거린다.","이륜자동차 승차감이 딱딱해진다.","서스펜션 스프링이 너무 단단해진다.","이륜자동차 차고가 높아진다."],"a":0,"e":"스프링이 약해지면 차체가 쉽게 내려앉고 지나치게 출렁거립니다."},{"q":"이륜자동차 서스펜션이 너무 물렁하거나 딱딱 할 때 발생할 수 있는 주행 문제는?","o":["브레이크 성능이 향상된다.","노면 충격 흡수 불량 및 승차감 저하된다.","연료 소모량이 감소한다.","엔진 시동이 어려워진다."],"a":1,"e":"서스펜션이 너무 물렁하거나 딱딱하면 노면 충격을 제대로 흡수하지 못하고 승차감이 나빠집니다."},{"q":"이륜자동차 리어 서스펜션이 너무 부드럽게 느 껴지고 쉽게 바닥에 닿는다면, 무엇을 의심할 수 있는가?","o":["타이어 공기압 과다","서스펜션 스프링의 약화","브레이크 오일 부족","체인 장력 과다"],"a":1,"e":"리어 서스펜션이 너무 부드럽고 쉽게 바닥에 닿으면 스프링이 약해진 것을 의심합니다."}],"id":"p03"},{"g":"섀시","name":"휠·타이어","qs":[{"q":"이륜자동차 휠 림의 변형을 육안으로 확인하는 방법 중 가장 일반적인 것은?","o":["엔진 소리를 듣는다.","타이어 공기압을 측정한다.","좌우 또는 상하로 흔들리는지 확인한다.","브레이크 패드 두께를 측정한다."],"a":2,"e":"휠을 띄워 돌려 보면서 림이 좌우나 상하로 흔들리는지 눈으로 확인합니다."},{"q":"이륜자동차 휠 림이 심하게 휘었을 때, 주행 중 발생할 수 있는 가장 위험한 상황은?","o":["엔진 출력 감소","타이어 편 마모 및 주행 불안정성","엔진 출력 증가","제동력 증가"],"a":1,"e":"림이 심하게 휘면 타이어가 고르게 닿지 않아 편마모가 생기고 주행이 불안정해집니다."},{"q":"이륜자동차의 휠에 대한 설명으로 틀린 것은?","o":["휠은 가벼울수록 운동성이 좋다.","휠은 강성은 중요하지만 탄성은 고려할 필요 가 없다.","주로 알루미늄 스포크 휠을 주로 사용한다.","고급형 휠은 단조형 알루미늄 스포크 휠을 주 로 사용한다."],"a":1,"e":"휠은 강성뿐 아니라 충격을 받아내는 탄성도 함께 고려해야 합니다."},{"q":"이륜자동차의 휠 밸런스가 맞지 않을 때, 주행 중 어떤 증상이 나타날 수 있는가?","o":["특정 속도에서 핸들이 떨린다.","브레이크 성능이 향상된다.","접지력이 좋아진다.","엔진 출력이 증가한다."],"a":0,"e":"휠 밸런스가 맞지 않으면 특정 속도에서 진동이 커져 핸들이 떨립니다."},{"q":"이륜자동차의 휠의 점검 내용 중 옳지 않은 것 은?","o":["휠을 들어 올린 후에 림의 가로 및 세로 방향 의 흔들림을 점검한다.","스포크 휠의 흔들림은 스포크를 조여서 수정 한다.","풀려있는 스포크는 니플랜지를 사용하여 흔 들림을 수정한다.","캐스팅 힐의 흔들림이 발생하면 흔들림을 수 정한다."],"a":3,"e":"캐스팅 휠은 한 덩어리로 주조한 휠이라 흔들림을 수정할 수 없고 교환해야 합니다. 스포크 휠은 스포크를 조여 흔들림을 수정합니다."},{"q":"이륜자동차 휠의 스포크 타입 휠에서 스포크가 느슨해졌을 때, 발생할 수 있는 것은?","o":["휠의 강성이 약해져 변형되거나 파손될 위험 이 있다.","핸들이 떨린다.","브레이크 패드가 편마모된다.","엔진 소음이 커진다."],"a":0,"e":"스포크가 느슨해지면 휠의 강성이 약해져 변형되거나 파손될 수 있습니다."},{"q":"다음 중 스포크 휠(spoke wheel)과 얼로이 휠(alloy wheel)의 차이에 대한 설명으로 가장 적당한 것은?","o":["얼로이 휠은 단조 또는 주조된 알루미늄 블록 에서 제작되어 튜브레스 타이어 장착이 용이 하고 고속 안정성이 뛰어나다.","스포크 휠은 충격을 흡수하기 위해 일부러 제 작 시 금속 유연성을 약화시켜 노면 충격에 약하다.","얼로이 휠은 제작이 간단하며, 충격을 받으면 찌그러져도 부분 수리가 가능해 유지 보수가 유리하다.","스포크 휠은 유연성과 내구성이 뛰어나 오프 로드나 울퉁불퉁한 노면에서 주행 안정성이 높다."],"a":3,"e":"스포크 휠은 여러 개의 스포크가 충격을 나눠 받아 유연하고 질겨서 오프로드나 거친 노면에 유리합니다. ② 스포크 휠은 충격에 강하고, ③ 얼로이 휠은 휘거나 깨지면 부분 수리가 어렵습니다."},{"q":"이륜자동차 타이어 휠에 무게의 불균형이 있으 면 바퀴가 돌아가면서 원심력에 의해 회전축이 흔들리게 되는데 이때 해야 할 조치는 무엇인 가?","o":["타이어 교환","휠 밸런싱","휠 교환","프레임 교환"],"a":1,"e":"무게 불균형은 밸런스 웨이트를 붙여 균형을 맞추는 휠 밸런싱으로 해결합니다."},{"q":"이륜자동차 휠의 종류 중 여러 개의 가는 실(스 포크)이 허브와 림을 연결하는 형태의 휠은?","o":["스포크 휠(spoke wheel)","캐스트 휠(cast wheel)","디스크 휠(disk wheel)","솔리드 휠(solid wheel)"],"a":0,"e":"가는 스포크 여러 개로 허브와 림을 연결한 휠이 스포크 휠입니다. 캐스트 휠은 한 덩어리로 주조한 휠입니다."},{"q":"이륜자동차의 바퀴가 정적 불평형일 때 일어나 는 현상은?","o":["시미 현상","롤링 현상","트램핑 현상","스탠딩 웨이브 현상"],"a":2,"e":"정적 불평형이면 바퀴가 상하로 뛰는 트램핑이 생깁니다. 좌우로 흔들리는 시미는 동적 불평형일 때 생깁니다."},{"q":"가벼운 오토바이에 적합한 타이어의 특징이 아 닌 것은?","o":["광폭이 좁은 타이어","연비가 좋은 타이어","핸들링이 좋은 타이어","공기압이 높은 타이어"],"a":3,"e":"가벼운 오토바이에는 폭이 좁고 연비와 핸들링이 좋은 타이어가 알맞습니다. 공기압은 차종별 규정값에 맞추는 것이며, 높은 것이 알맞은 특징은 아닙니다."},{"q":"타이어의 ‘130/70-18’과 같은 표기에서 ‘130’이 의미하는 것은?","o":["타이어의 전체 직경(mm)","타이어의 허용 하중(kg)","타이어 편평비(%)","타이어의 폭(mm)"],"a":3,"e":"130/70-18에서 130은 타이어 폭(mm), 70은 편평비(%), 18은 림 지름(인치)입니다."},{"q":"튜브 타이어와 튜브리스 타이어의 가장 큰 차이 점은 어떤 것인가?","o":["튜브리스 타이어는 펑크 시 공기가 즉시 모두 빠진다.","튜브 타이어는 휠에 직접 공기를 주입한다.","튜브 타이어는 고속 주행에 더 적합하다.","튜브리스 타이어는 내부에 별도의 튜브가 필 요없다."],"a":3,"e":"튜브리스 타이어는 타이어와 림이 직접 공기를 가두므로 별도의 튜브가 필요 없습니다. ① 튜브리스 타이어는 못이 박혀도 공기가 천천히 빠집니다."},{"q":"튜브가 없는 타이어(tubeless tire)에 대한 설 명으로 틀린 것은?","o":["튜브 조립이 없어 작업성이 좋다.","튜브 대신 타이어 안쪽 내벽에 고무막이 있다.","타이어와 림의 조립이 불안전하거나, 림 플랜 지 부위에 변형이 있어도 공기 누출 위험이 없다.","타이어 속의 공기가 림과 직접 접촉하여 열 발산이 잘된다."],"a":2,"e":"튜브리스 타이어는 타이어와 림이 밀착해 공기를 막습니다. 조립이 불완전하거나 림 플랜지가 변형되면 그 틈으로 공기가 샙니다."},{"q":"레이디얼 타이어의 장점이 아닌 것은?","o":["로드 홀딩이 향상된다.","타이어 수명이 다소 감소된다.","하중에 의한 트레드 변형이 적다.","편평비를 크게 할 수 있어 접지 면적이 크다."],"a":1,"e":"레이디얼 타이어는 로드 홀딩이 좋고 트레드 변형이 적으며 수명이 깁니다. 수명이 감소한다는 것은 장점이 아닙니다."},{"q":"이륜자동차 타이어의 구조에 따라 레이디얼 타 이어와 함께 가장 흔하게 분류되는 다른 한 종 류의 타이어는?","o":["솔리드 타이어(solie tire)","스터드 타이어(stud tire)","런플랫 타이어(run-flat tire)","바이어스 타이어(bias tire)"],"a":3,"e":"타이어는 카커스의 코드 배열에 따라 레이디얼 타이어와 바이어스 타이어로 나눕니다."},{"q":"타이어의 비드부가 늘어나는 것을 방지하기 위 해 첨가하는 것은?","o":["구리선","강선","피아노선","알루미늄선"],"a":2,"e":"비드부에는 피아노선(비드 와이어)을 넣어 비드가 늘어나 림에서 벗겨지는 것을 막습니다."},{"q":"타이어의 구조에 해당하지 않는 것은?","o":["트레드","브레이커","카커스","압력판"],"a":3,"e":"타이어는 트레드, 브레이커, 카커스, 비드, 사이드 월로 이루어집니다. 압력판은 클러치 부품입니다."},{"q":"타이어 림과 타이어 사이에 별도의 튜브가 필요 없는 타이어는?","o":["튜브리스 타이어","튜브 타이어","런플랫 타이어","솔리드 타이어"],"a":0,"e":"림과 타이어 사이에 튜브가 필요 없는 타이어는 튜브리스 타이어입니다."},{"q":"이륜자동차가 오프로드 주행 시 진흙이나 모래 에서 접지력을 높이기 위해 트레드 블록이 크고 깊게 파여있는 타이어는?","o":["오프로드 타이어(off-road tire)","스포츠 타이어(sport tire)","로드 타이어(road tire)","투어링 타이어(touring tire)"],"a":0,"e":"트레드 블록이 크고 깊어 진흙이나 모래에서 접지력을 내는 타이어는 오프로드 타이어입니다."},{"q":"이륜자동차 타이어의 제조일자를 확인하는 이 유는?","o":["타이어 생산한 브랜드명을 확인하기 위해","타이어 재질을 확인하기 위해","타이어의 무게를 확인하기 위해","타이어의 생산 시기를 파악하기 위해"],"a":3,"e":"제조일자로 타이어의 생산 시기를 알 수 있습니다. 고무는 시간이 지나면 굳고 갈라지므로 오래된 타이어인지 확인합니다."},{"q":"타이어 트레드 패턴의 필요성으로 틀린 것은?","o":["카커스 손상을 방지한다.","타이어 내부에서 발생한 열을 발산한다.","주행 중 옆 방향 슬립을 방지한다.","구동력이나 선회 성능을 향상시킨다."],"a":0,"e":"트레드 패턴은 열을 발산하고, 옆 방향 미끄러짐을 막고, 구동력과 선회 성능을 높입니다. 카커스 손상 방지는 패턴의 필요성이 아닙니다."},{"q":"타이어의 구조 중 직접 노면과 직접 접촉하는 부분은?","o":["트레드","카커스","비드","숄더"],"a":0,"e":"노면과 직접 닿는 부분은 트레드입니다."},{"q":"이륜자동차 타이어 트레드의 마모 한계선이 보 인다면 어떻게 해야 하나?","o":["타이어 공기압을 낮춘다.","타이어 공기압을 높인다.","타이어를 즉시 교환한다.","타이어를 앞, 뒤로 바꾼다."],"a":2,"e":"마모 한계선이 보이면 배수와 접지 성능이 크게 떨어지므로 타이어를 즉시 교환합니다."},{"q":"주행 시 타이어에는 많은 열이 발생하여 타이어 수명이 단축되는데, 열 발생 원인이 아닌 것은?","o":["기온이 높을 때","저속으로 장시간 주행할 때","과다하게 적재하고 주행할 때","타이어 공기압이 낮은 상태로 주행할 때"],"a":1,"e":"타이어의 열은 기온이 높을 때, 과적했을 때, 공기압이 낮을 때, 고속으로 오래 달릴 때 많이 납니다. 저속 주행은 원인이 아닙니다."},{"q":"고속 주행 시 타이어가 발열로 인하여 주름이 잡히는 현상은?","o":["트램핑","로드 홀딩","스탠딩 웨이브","하이드로 플래닝"],"a":2,"e":"고속 주행에서 타이어 접지부 뒤쪽이 물결 모양으로 주름 잡히는 현상이 스탠딩 웨이브입니다."},{"q":"타이어의 스탠딩 웨이브 현상에 대한 사항으로 옳은 것은?","o":["스탠딩 웨이브를 줄이기 위해 고속 주행 시 공기압을 10% 정도 줄인다.","스탠딩 웨이브가 심하면 타이어 박리 현상이 발생할 수 있다.","스탠딩 웨이브는 바이어스 타이어보다 레이디얼 타이어에서 많이 발생한다.","스탠딩 웨이브 현상은 하중과 무관하다."],"a":1,"e":"스탠딩 웨이브가 심하면 타이어가 과열되어 트레드가 떨어져 나가는 박리가 생길 수 있습니다. ① 공기압은 높여서 방지하고, ③ 바이어스 타이어에서 더 잘 생기며, ④ 하중이 클수록 잘 생깁니다."},{"q":"주행 중 물이 고인 도로를 통행 시 타이어 트레 드가 물을 배출하지 못하여 노면과 타이어의 마찰력을 상실하게 하는 현상은?","o":["하이드로 플래닝","워터 햄머링","캐비테이션","스탠딩 웨이브"],"a":0,"e":"물이 고인 길에서 타이어가 물을 빼내지 못해 물 위에 뜨고 마찰력을 잃는 현상이 하이드로 플래닝(수막현상)입니다."},{"q":"이륜자동차 타이어의 접지력에 영향을 받는 요 소 중 틀리는 것은?","o":["타이어 트레드 패턴","브레이크 작동시","타이어의 공기압 상태","타이어의 고무의 종류"],"a":1,"e":"접지력은 트레드 패턴, 공기압, 고무의 종류에 따라 달라집니다. 브레이크 작동은 접지력을 이용하는 것이지 접지력을 정하는 요소가 아닙니다."},{"q":"이륜자동차의 타이어 공기압이 과도하게 높을 때 발생하는 현상으로 틀린 것은?","o":["트레드 중앙부 마모가 심하다.","노면과의 접지 면이 좁아진다.","미끄러지기 쉽다.","주행 시 핸들이 무겁다."],"a":3,"e":"공기압이 너무 높으면 접지 면이 좁아져 중앙부가 빨리 닳고 미끄러지기 쉽습니다. 핸들은 오히려 가벼워집니다. 핸들이 무거운 것은 공기압이 낮을 때입니다."},{"q":"이륜자동차 타이어의 공기압이 적정 수준보다 높을 때 발생할 수 있는 문제는?","o":["타이어 중앙 부분만 빨리 닳는다.","승차감이 더 부드러워진다.","타이어 가장 부분이 빨리 닳는다.","브레이크 성능이 좋아진다."],"a":0,"e":"공기압이 높으면 타이어 가운데가 볼록해져 중앙 부분만 빨리 닳습니다. ③ 가장자리가 빨리 닳는 것은 공기압이 낮을 때입니다."},{"q":"이륜자동차 타이어의 공기압을 점검하는 가장 적절한 시기는?","o":["장거리 주행 직후 타이어가 뜨거울 때","주행 후 타이어가 식은 상태일 때","이륜자동차를 세차하고 난 후에","날씨가 흐리거나 비가 오는 날"],"a":1,"e":"타이어가 뜨거우면 안의 공기가 팽창해 압력이 높게 나옵니다. 그래서 타이어가 식은 상태에서 점검합니다."},{"q":"이륜자동차 타이어 교체 작업 시, 휠 림에 손상 을 주지 않고 타이어를 장착하는 가장 안전한 방법은?","o":["망치와 드라이버를 이용하여 타이어를 탈거 한다.","전용 타이어 레버 및 림 프로텍터를 이용하여 조심스럽게 작업한다.","망치와 드라이버를 이용하여 타이어를 밀어 넣는다.","타이어에 비눗물을 바르고 손으로 집어넣는다."],"a":1,"e":"전용 타이어 레버와 림 프로텍터를 쓰면 림에 흠집을 내지 않고 작업할 수 있습니다."},{"q":"이륜자동차의 앞바퀴가 주행 중 한쪽으로 쏠리 는 현상이 발생할 때 가장 먼저 의심해야 할 원인은?","o":["브레이크 패드 마모","체인 장력 과다","포크 휨 또는 정렬 불량","브레이크 오일 부족"],"a":2,"e":"앞바퀴가 한쪽으로 쏠리면 프론트 포크가 휘었거나 정렬이 틀어진 것을 먼저 의심합니다."},{"q":"이륜자동차 휠 베어링에 유격이 있거나 소음이 발생할 때, 주행 중 나타날 수 있는 현상은?","o":["브레이크 패드 마모가 감소한다.","엔진 소음이 커진다.","배기 소음이 커진다.","주행 중 휠에서 비정상적인 소음이 발생한다."],"a":3,"e":"휠 베어링에 유격이 있거나 손상되면 주행 중 휠에서 비정상적인 소음이 납니다."},{"q":"이륜자동차 타이어에 바람을 너무 적게 넣으면 어떤 현상이 발생하는가?","o":["승차감이 좋아진다.","타이어 중앙 부분이 마모된다.","타이어가 더 빨리 마모되고 운전하기 힘들어 진다.","타이어가 더 튼튼해진다."],"a":2,"e":"공기압이 너무 낮으면 타이어가 많이 찌그러져 빨리 닳고, 핸들이 무거워 운전하기 힘들어집니다."},{"q":"이륜자동차 타이어의 비정상적인 편 마모가 발 생했을 때, 다음 중 가장 먼저 의심해야 할 것 은?","o":["휠 얼라인먼트 불량","연료필터 막힘","배터리 충전 불량","발전기 작동 불량"],"a":0,"e":"타이어가 비정상적으로 한쪽만 닳으면 휠 얼라인먼트 불량을 먼저 의심합니다."},{"q":"이륜자동차 타이어의 노화를 육안으로 판단할 수 있는 가장 대표적인 증상은?","o":["타이어의 색깔이 검정색이 아닌 다른 색으로 변한다.","타이어 측면이나 트레드 부분에 미세한 균열 이 발생한다.","타이어에 흙이 묻어있다.","타이어의 공기압이 자동으로 조절된다."],"a":1,"e":"타이어가 노화하면 고무가 굳어 옆면이나 트레드에 미세한 균열이 생깁니다."},{"q":"이륜자동차 바퀴에 박힌 못을 발견하면 어떻게 조치해야 하나?","o":["못을 바로 뽑고 달린다.","물을 뿌려 못을 녹인다.","못을 그대로 둔 채 정비소로 가서 전문가에게 수리를 맡긴다.","타이어에 테이프를 붙인다."],"a":2,"e":"못을 뽑으면 공기가 한꺼번에 빠질 수 있으므로 그대로 둔 채 정비소에서 수리합니다."}],"id":"p04"},{"g":"동력전달장치","name":"수동변속기","qs":[{"q":"클러치 레버의 유격 점검 내용으로 잘못된 것 은?","o":["유격이 많으면 클러치의 미끌림 등이 발생한 다.","클러치 유격은 레버 끝단부에서 점검한다.","주조정은 엔진 쪽에서 실시하며, 로크너트를 풀고 어저스트 너트를 돌려 유격을 조정한다.","유격 조정 후에는 어저스트 너트를 고정하고, 로크너트를 단단히 조여 준다."],"a":0,"e":"유격이 많으면 레버를 잡아도 클러치가 완전히 끊어지지 않습니다(차단 불량). 클러치가 미끄러지는 것은 유격이 너무 적을 때입니다."},{"q":"이륜자동차 변속기가 기어 빠지는 현상이 발생할 때, 점검하지 않아도 되는 것은?","o":["시프트 포크 휩","변속기 내부의 기어 이빨 마모","변속 드럼 마모","변속기 오일 과다"],"a":3,"e":"기어가 빠지는 원인은 시프트 포크의 휨, 기어 이빨(도그) 마모, 변속 드럼 마모입니다. 변속기 오일이 많은 것은 원인이 아닙니다."},{"q":"이륜자동차 클러치가 미끄러질 때 나타나는 증 상은?","o":["변속이 너무 부드럽다.","엔진 회전수는 올라가지만 속도가 잘 나지 않는다.","엔진의 동력이 변속기로 잘 전달된다.","엔진출력이 정상이다."],"a":1,"e":"클러치가 미끄러지면 엔진의 힘이 다 전달되지 않아 엔진 회전수는 올라가도 속도가 잘 나지 않습니다."},{"q":"이륜자동차 클러치 단속기구의 종류가 아닌 것은?","o":["스파이럴 베벨기어","와이어 방식","유압식 클러치","원심력 클러치"],"a":0,"e":"스파이럴 베벨기어는 회전축의 방향을 바꾸는 기어입니다. 클러치를 끊고 잇는 방식에는 와이어식, 유압식, 원심식이 있습니다."},{"q":"이륜자동차 클러치 시스템 정비 후, 클러치 레버를 여러 번 작동시켜야 하는 이유는?","o":["클러치 a":3,"e":"밸브 바디는 유압의 통로를 바꿔 기어 변속을 제어합니다. 오일펌프는 유압을 만드는 부품입니다."},{"q":"이륜자동차 자동변속기에서 유압을 이용하여 특정 기어를 물리거나 풀어주는 역할을 하는 것은?","o":["오일 온도 센서","오일펌프","시프트 솔레노이드","유성 캐리어"],"a":2,"e":"시프트 솔레노이드는 유압을 보내거나 끊어 특정 기어를 물리거나 풀어 줍니다."},{"q":"자동변속기에서 변속 시점을 결정하는 가장 중 요한 요소는?","o":["매뉴얼 밸브와 차속","엔진 스로틀밸브 개도와 차속","변속 모드 스위치와 변속시간","엔진 스로틀밸브 개도와 변속시간"],"a":1,"e":"변속 시점은 엔진 스로틀밸브 개도(엔진 부하)와 차속으로 결정합니다."},{"q":"이륜자동차 자동변속기 오일을 주기적으로 교환해야 하는 이유는?","o":["자동변속기 부품 마모와 성능 저하를 방지하기 위해","브레이크 성능 저하를 방지하기 위해","클러치 부품 마모를 방지하기 위해","체인 장력을 유지하기 위해"],"a":0,"e":"자동변속기 오일은 쓰는 동안 열화되고 오염되므로, 부품 마모와 성능 저하를 막기 위해 주기적으로 교환합니다."},{"q":"자동변속기 오일(AFT)의 점도가 변속기 성능에 미치는 가장 중요한 영향은?","o":["오일의 냄새","유압 형성 및 윤활 능력","오일의 양","오일의 색깔"],"a":1,"e":"자동변속기 오일의 점도는 유압을 만드는 능력과 윤활 능력을 좌우합니다. 냄새, 색깔은 상태를 보는 참고 사항일 뿐입니다."},{"q":"이륜자동차 자동변속기에서 변속 시 충격이 심 해질 때 점검 항목과 거리가 먼 것은?","o":["변속기 케이블 불량","변속기 제어 시스템 이상","변속기 오일량의 부족","변속기 오일의 오염"],"a":0,"e":"변속 충격이 심하면 제어 시스템, 오일량, 오일 오염을 점검합니다. 변속기 케이블은 이와 거리가 멉니다."},{"q":"자동변속기 오일(ATF)의 점검 시, 오일레벨이 너무 낮을 때 발생할 수 있는 현상은?","o":["변속 충격 증가 또는 변속 지연","변속이 빨라진다.","브레이크 제동력 저하","변속이 안 된다."],"a":0,"e":"오일이 부족하면 유압이 제대로 만들어지지 않아 변속 충격이 커지거나 변속이 늦어집니다."},{"q":"자동변속기에 사용되고 있는 오일(ATF)의 기능이 아닌 것은?","o":["충격을 흡수한다.","동력을 발생시킨다.","작동 유압을 전달한다.","윤활 및 냉각작용을 한다."],"a":1,"e":"자동변속기 오일은 동력을 전달할 뿐, 동력을 발생시키지는 않습니다. ①③④는 오일의 기능입니다."},{"q":"자동변속기에서 유압 시스템의 핵심 작동 매체 이자 윤활, 냉각 기능을 동시에 수행하는 것은?","o":["엔진 오일","클러치 오일","자동변속기 오일","브레이크 오일"],"a":2,"e":"자동변속기 오일(ATF)은 유압을 전달하는 작동유이면서 윤활과 냉각도 함께 합니다."},{"q":"이륜자동차 자동 클러치 시스템 중, 엔진회전 수가 낮을 때 클러치가 자동으로 분리되고 엔진 회전수가 올라가면 연결되는 방식은?","o":["DCT","원심 클러치","유압식 클러치","CVT"],"a":1,"e":"원심 클러치는 엔진 회전수가 낮으면 분리되고, 회전수가 올라가면 원심력으로 연결됩니다."},{"q":"이륜자동차 자동변속기의 한 종류인 CVT 방식의 특징은?","o":["수동으로 기어를 조작해야 한다.","고정된 기어를 조절해서 사용한다.","무단계로 변속되어 부드러운 가속이 가능하다.","클러치를 사용한다."],"a":2,"e":"CVT는 벨트와 풀리의 지름을 바꿔 변속비를 무단계로 바꾸므로 가속이 부드럽습니다."},{"q":"이륜자동차 CVT의 단점으로 틀린 것은?","o":["기어 변속 충격이 없어 변속 순간이 느껴지지 않고 매우 부드럽다.","내구성이 약하다.","고출력을 요하는 차종에는 적합하지 않다.","변속기 수리 시 비용이 비싸다."],"a":0,"e":"변속 충격이 없고 부드러운 것은 CVT의 장점입니다. ②③④가 단점입니다."},{"q":"무단변속기(CVT)에 대한 설명으로 틀린 것은?","o":["연비를 향상시킬 수 있다.","가속 성능을 향상시킬 수 있다.","동력 성능이 우수하나, 변속 충격이 크다.","변속 중 동력전달이 중단되지 않는다."],"a":2,"e":"무단변속기는 변속비가 연속적으로 바뀌므로 변속 충격이 없습니다."},{"q":"이륜자동차 CVT가 주로 사용되는 이륜자동차는?","o":["대형 투어링 바이크","고성능 스포츠 바이크","스쿠터","오프로드 바이크"],"a":2,"e":"CVT는 주로 스쿠터에 씁니다."},{"q":"DCT의 장점으로 옳지 않은 것은?","o":["변속 속도가 매우 짧다.","연비 효율이 높다.","운전자가 수동 모드로 기어를 직접 조작할 수 있다.","일반 수동변속기보다 구조가 훨씬 간단하고 가볍다."],"a":3,"e":"DCT는 클러치를 두 개 쓰므로 일반 수동변속기보다 구조가 복잡하고 무겁습니다. ①②③은 장점입니다."},{"q":"이륜자동차 자동변속기 중, 기어 단수가 없이 연속적으로 변속비를 조절하여 부드러운 가속을 제공하는 방식은?","o":["수동변속기","DCT","CVT","시퀀셜 변속기"],"a":2,"e":"기어 단수 없이 변속비를 연속적으로 바꾸는 방식은 CVT(무단변속기)입니다."},{"q":"이륜자동차 DCT의 가장 큰 특징은?","o":["두 개의 독립적인 클러치를 사용한다.","클러치 조작과 변속이 모두 수동이다.","오직 스쿠터에만 사용된다.","엔진 회전수에 따라 자동으로 클러치가 연결된다."],"a":0,"e":"DCT(듀얼 클러치 변속기)는 서로 독립된 두 개의 클러치를 씁니다."},{"q":"이륜자동차 DCT가 변속 시 동력 손실이 적고 빠른 변속이 가능한 이유는?","o":["동력 단절 없이 기어가 변경되기 때문","체인을 사용하기 때문","습식 DCT에는 오일을 사용하지 않기 때문","클러치 레버가 없기 때문"],"a":0,"e":"DCT는 한쪽 클러치가 끊어질 때 다른 쪽 클러치가 이어지므로 동력이 끊기지 않고 빠르게 변속됩니다."}],"id":"p06"},{"g":"동력전달장치","name":"드라이브 라인(체인·벨트·샤프트)","qs":[{"q":"다음은 오토바이 동력전달장치에서 벨트 방식 특징이 아닌 것은?","o":["소음 감소","벨트의 유연성","동력 손실이 발생하지 않는다.","한계 토크가 발생하여 고출력 엔진에는 적합하지 않다."],"a":2,"e":{"w":["벨트는 고무 재질이라 금속 체인보다 조용합니다. 벨트 방식의 특징이 맞습니다.","벨트는 유연해서 충격을 부드럽게 받아 줍니다. 특징이 맞습니다.","벨트는 전달할 수 있는 토크에 한계가 있어 고출력 엔진에는 맞지 않습니다. 특징이 맞습니다."],"d":"벨트 방식도 벨트와 풀리 사이의 미끄러짐과 마찰 때문에 동력 손실이 생깁니다. 손실이 전혀 없는 동력전달 방식은 없으므로 \"동력 손실이 발생하지 않는다\"가 틀린 설명입니다."}},{"q":"이륜자동차 체인 윤활 시, 사용하는 오일의 목적은?","o":["체인 무게 감소","체인 마모 가속화","스프로킷 마모 가속화","체인의 녹 방지"],"a":3,"e":{"w":["오일을 발라도 체인의 무게는 줄지 않습니다.","윤활은 마모를 늦추는 것이지 빠르게 하는 것이 아닙니다.","윤활하면 스프로킷의 마모도 줄어듭니다."],"d":"체인은 금속이라 물과 습기에 닿으면 녹이 습니다. 윤활유는 표면에 막을 만들어 녹을 막고, 핀과 롤러 사이의 마찰을 줄여 마모와 소음도 줄입니다."}},{"q":"이륜자동차 구동 계통에서 스프로킷과 체인의 마모 상태를 점검할 때, 가장 중요하게 확인해야 할 것은?","o":["스프로킷의 고정볼트","체인 무게","스프로킷의 이빨 손상","체인 아우터 플레이트 개수"],"a":2,"e":{"w":["고정볼트는 풀림을 점검하는 항목이지 마모 상태를 보는 곳이 아닙니다.","체인의 무게로는 마모를 알 수 없습니다.","플레이트 개수는 체인 길이에 따라 정해진 값이라 마모와 관계가 없습니다."],"d":"스프로킷은 체인과 맞물리는 이빨이 닳습니다. 이빨이 뾰족해지거나 한쪽으로 휘었는지, 깨진 곳이 없는지를 가장 먼저 봅니다. 이빨이 손상되면 체인이 제대로 물리지 않아 빠질 수 있습니다."}},{"q":"이륜자동차 체인 및 스프로킷 세트를 교체할 때, 가장 중요하게 고려해야 할 사항이 아닌 것은?","o":["스프로킷의 휨 상태","체인 및 스프로킷의 색상","체인 고리의 연결 상태","체인 사이즈, 스프로킷 잇수"],"a":1,"e":{"w":["스프로킷이 휘면 체인이 한쪽으로 닳고 빠질 수 있어 꼭 확인합니다.","체인 연결 고리(조인트)가 제대로 끼워졌는지는 안전에 직결됩니다.","체인 규격과 스프로킷 잇수가 맞아야 장착되고 감속비도 유지됩니다."],"d":"체인과 스프로킷은 규격, 잇수, 휨, 연결 상태처럼 기능과 안전에 관계된 것을 확인합니다. 색상은 성능과 아무 관계가 없으므로 고려할 사항이 아닙니다."}},{"q":"이륜자동차의 앞바퀴 스프로킷이나 뒷바퀴 스프로킷의 이빨이 뾰족하게 닳았다면 무엇을 해야 하나?","o":["그대로 계속 탄다.","뾰족한 부분을 줄로 갈아낸다.","기름만 듬뿍 바른다.","체인과 스프로킷을 모두 새것으로 바꾼다."],"a":3,"e":{"w":["뾰족해진 이빨은 체인을 제대로 잡지 못해 체인이 빠질 수 있습니다.","줄로 갈아 내면 이빨이 더 작아져 맞물림이 더 나빠집니다.","윤활로는 이미 닳은 이빨이 되돌아오지 않습니다."],"d":"이빨이 뾰족하게 닳았다면 수명이 다한 것입니다. 체인과 스프로킷은 서로 맞물려 함께 닳으므로, 한쪽만 바꾸면 새 부품이 빨리 닳습니다. 그래서 체인과 앞뒤 스프로킷을 세트로 교환합니다."}},{"q":"이륜자동차에서 체인 정비 시 가장 중요하게 확인해야 할 것은?","o":["체인의 유격","체인의 규격","체인의 무게","체인의 색상"],"a":0,"e":{"w":["규격은 교체할 때 확인하는 것이고, 평소 정비에서는 유격이 먼저입니다.","무게는 정비 점검 항목이 아닙니다.","색상은 성능과 관계가 없습니다."],"d":"체인은 쓰는 동안 늘어나므로 유격(처짐량)을 규정값에 맞추는 것이 가장 중요합니다. 너무 느슨하면 체인이 빠지고, 너무 팽팽하면 체인과 베어링이 빨리 닳습니다."}},{"q":"이륜자동차에서 엔진의 동력을 뒷바퀴에 전달하는 가장 일반적인 방식은?","o":["와이어 케이블","파이프","체인 드라이브","강철 막대"],"a":2,"e":{"w":["와이어 케이블은 클러치나 스로틀을 조작하는 데 씁니다.","파이프는 동력을 전달하지 못합니다.","강철 막대는 동력전달 방식이 아닙니다."],"d":"이륜자동차는 변속기 출력축의 앞 스프로킷과 뒷바퀴 스프로킷을 체인으로 연결하는 체인 드라이브를 가장 많이 씁니다. 구조가 간단하고 가벼우며 동력 전달 효율이 높기 때문입니다."}},{"q":"이륜자동차 동력전달장치에서 드라이브 샤프트 방식이 주로 사용되는 이륜자동차의 특징은?","o":["높은 성능의 스포츠 바이크","투어링 바이크","오프로드 바이크","소형 스쿠터"],"a":1,"e":{"w":["스포츠 바이크는 가볍고 효율이 높은 체인을 주로 씁니다.","오프로드 바이크는 충격에 강하고 가벼운 체인을 씁니다.","소형 스쿠터는 벨트(CVT) 방식을 주로 씁니다."],"d":"드라이브 샤프트 방식은 축과 기어로 동력을 전달합니다. 무겁지만 조용하고 유지보수가 적어, 장거리를 달리는 투어링 바이크에 주로 씁니다."}},{"q":"이륜자동차 동력전달장치에서 벨트 드라이브 방식의 가장 큰 장점은?","o":["오염에 매우 강하다.","끊어져도 수리가 매우 쉽다.","벨트에 윤활하기가 매우 쉽다.","체인 드라이브 대비 소음과 진동이 적다."],"a":3,"e":{"w":["벨트는 돌이나 모래가 끼면 손상되기 쉬워 오염에 강하다고 할 수 없습니다.","벨트는 끊어지면 이어 붙일 수 없고 통째로 교환해야 합니다.","벨트는 윤활을 하지 않습니다."],"d":"벨트 드라이브는 고무 재질의 벨트가 풀리와 맞물려 돌기 때문에 금속끼리 부딪치는 체인보다 소음과 진동이 적습니다. 윤활이 필요 없다는 것도 장점입니다."}},{"q":"이륜자동차 구동 체인에서 O-링의 역할은?","o":["체인 핀과 부싱 사이에 윤활유를 밀봉한다.","핀과 핀을 연결하며 체인의 강도를 담당한다.","링크의 구부러짐을 지지하는 역할을 한다.","스프로킷과의 마찰에 의한 충격을 흡수하는 역할을 한다."],"a":0,"e":{"w":["핀과 핀을 연결해 강도를 맡는 것은 플레이트입니다.","링크가 구부러지는 것을 지지하는 것은 핀과 부싱입니다.","스프로킷과 닿아 충격을 받는 것은 롤러입니다."],"d":"O-링은 안쪽 플레이트와 바깥 플레이트 사이에 끼운 고무 링입니다. 핀과 부싱 사이에 넣어 둔 그리스가 빠져나가지 않게 막고, 먼지와 물이 들어가는 것도 막아 체인 수명을 늘립니다."}},{"q":"X-링 체인이 O-링 체인보다 더 높은 동력전달 효율을 가질 수 있는 이유는?","o":["더 많은 윤활유를 저장하기 때문에","접촉 면적을 줄여 마찰 저항이 감소하기 때문에","체인 피치가 더 길기 때문에","X-링이 O-링보다 개수가 많아서"],"a":1,"e":{"w":["윤활유를 머금는 것은 수명에 도움이 되는 점이고, 효율이 높은 이유는 아닙니다.","체인 피치는 씰의 종류와 관계가 없습니다.","씰의 개수는 O-링 체인과 같습니다."],"d":"X-링은 단면이 X자 모양이라 플레이트에 닿는 면적이 O-링보다 작습니다. 닿는 면적이 작으면 체인이 구부러질 때 마찰 저항이 줄어 동력전달 효율이 높아집니다."}},{"q":"중형 오토바이에 일반적으로 가장 많이 사용하는 방식은?","o":["체인 방식","벨트 방식","샤프트 방식","기어 방식"],"a":0,"e":{"w":["벨트 방식은 스쿠터나 일부 크루저에 씁니다.","샤프트 방식은 대형 투어링 바이크에 주로 씁니다.","기어만으로 뒷바퀴를 구동하는 방식은 일반적이지 않습니다."],"d":"중형 오토바이는 가볍고 효율이 높으며 감속비를 바꾸기 쉬운 체인 방식을 가장 많이 씁니다."}},{"q":"이륜자동차 엔진에서 만든 힘을 바퀴로 전달하는 장치를 무엇이라고 하는가?","o":["제동장치","현가장치","조향장치","동력전달장치"],"a":3,"e":{"w":["제동장치는 속도를 줄이거나 멈추는 장치입니다.","현가장치는 노면 충격을 흡수하는 장치입니다.","조향장치는 진행 방향을 바꾸는 장치입니다."],"d":"엔진에서 만든 힘을 클러치, 변속기, 체인(또는 벨트, 샤프트)을 거쳐 바퀴까지 전달하는 장치 전체를 동력전달장치라고 합니다."}},{"q":"이륜자동차 구동 체인에 윤활유를 주기적으로 도포하는 이유는?","o":["체인과 스프로킷의 마찰과 마모를 줄이기 위해","체인의 마찰을 늘리기 위해","스프로킷의 마찰열을 늘리기 위해","체인보다 스프로킷의 마모가 빠르게 진행되게 하기 위해"],"a":0,"e":{"w":["윤활은 마찰을 줄이기 위한 것입니다.","마찰열을 늘리면 부품이 더 빨리 상합니다.","윤활은 체인과 스프로킷의 마모를 함께 줄입니다."],"d":"체인은 핀, 부싱, 롤러가 계속 움직이고 스프로킷 이빨과 맞물립니다. 윤활유를 주기적으로 바르면 금속끼리의 마찰과 마모가 줄어 체인과 스프로킷의 수명이 늘어납니다."}},{"q":"이륜자동차 드라이브 샤프트 방식의 동력전달장치에서 주기적으로 점검해야 할 요소는?","o":["체인 장력","스프로킷 장력","스프로킷의 이빨 마모","샤프트 내부의 그리스 상태"],"a":3,"e":{"w":["샤프트 방식에는 체인이 없습니다.","샤프트 방식에는 스프로킷이 없습니다.","샤프트 방식에는 스프로킷 이빨이 없습니다."],"d":"드라이브 샤프트 방식은 축과 기어가 케이스 안에서 돌아갑니다. 체인처럼 장력을 조절할 필요는 없지만, 내부 윤활유(그리스, 기어 오일)의 상태와 누유는 주기적으로 점검해야 합니다."}},{"q":"이륜자동차 체인에 윤활유를 바르는 이유는?","o":["체인 장력을 늘리기 체인의 설명으로 옳은 것은?","o":["조정이 불가능하여 체인이 늘어나면 교체해야 된다.","유지보수가 필요 없어 다양한 오토바이에 사용된다.","플레이트 안쪽에 고무링이 있어 윤활력이 오래 지속된다.","대부분 폴리우레탄으로 제조되어 소음이 적고 가격이 저렴하다."],"a":2,"e":{"w":["체인은 장력을 조정할 수 있습니다. 조정할 수 없는 것은 벨트 쪽 설명입니다.","링 체인도 청소와 윤활 같은 유지보수가 필요합니다.","폴리우레탄으로 만들어 소음이 적은 것은 벨트입니다."],"d":"링 체인(O-링, X-링 체인)은 플레이트 안쪽에 고무 링이 있어 핀과 부싱 사이의 그리스를 가둬 둡니다. 그래서 윤활력이 오래 유지되고 수명이 깁니다."}},{"q":"표준 체인을 사용하는 이륜자동차에서 잦은 체인 윤활과 청소가 필요한 이유는?","o":["체인 소음을 증가시키기 위해","녹 발생에 취약하며 이물질 유입이 쉽기 때문","스프로킷의 마모를 증가시키기 위해","체인 장력 조절이 안 되기 때문"],"a":1,"e":{"w":["윤활과 청소는 소음을 줄이기 위한 것입니다.","스프로킷 마모를 줄이기 위한 것입니다.","표준 체인도 장력을 조절할 수 있습니다."],"d":"표준 체인은 씰이 없어 핀과 부싱 사이로 먼지와 물이 쉽게 들어가고 윤활유도 빨리 빠집니다. 녹과 마모에 약하므로 윤활과 청소를 자주 해야 합니다."}},{"q":"체인 관리를 제대로 안 해서 체인이 너무 늘어져 있을 때 발생할 수 있는 문제는?","o":["핸들이 뻑뻑해진다.","엔진 소음이 증가한다.","체인 소음이 감소한다.","체인이 바퀴에서 빠질 수 있다."],"a":3,"e":{"w":["체인이 늘어져도 핸들 조작에는 영향이 없습니다.","엔진 소음과는 관계가 없습니다.","늘어진 체인은 출렁거리며 소음이 오히려 커집니다."],"d":"체인이 너무 늘어지면 달리는 동안 출렁거리다가 스프로킷에서 벗겨질 수 있습니다. 빠진 체인이 뒷바퀴에 감기면 바퀴가 잠겨 매우 위험합니다."}},{"q":"이륜자동차 체인 드라이브 시스템에서 슬라이더 또는 가이드의 역할은?","o":["체인에 묻은 윤활유를 제거한다.","체인의 소음과 마모를 방지한다.","체인 장력을 조절한다.","체인에 녹을 방지한다."],"a":1,"e":{"w":["슬라이더는 윤활유를 닦아 내는 부품이 아닙니다.","장력은 뒷바퀴 축의 조정 장치로 조절합니다.","녹 방지는 윤활유의 역할입니다."],"d":"슬라이더(가이드)는 체인이 스윙암이나 프레임에 직접 닿지 않도록 받쳐 주는 부품입니다. 체인이 지나는 길을 잡아 주어 소음과 마모를 막습니다."}},{"q":"이륜자동차 체인 유격을 점검할 때, 이륜자동차를 어떤 상태로 두어야 가장 정확한가?","o":["서스펜션이 압축되어 있는 상태","브레이크를 잡고 있는 상태","작업용 스탠드로 뒷바퀴를 들어 올린 상태","뒷바퀴를 지면에 붙인 상태"],"a":2,"e":{"w":["서스펜션이 눌리면 앞뒤 스프로킷 사이 거리가 달라져 유격이 다르게 나옵니다.","브레이크를 잡으면 바퀴를 돌려 가며 확인할 수 없습니다.","뒷바퀴가 지면에 있으면 바퀴를 돌려 여러 곳을 확인하기 어렵습니다."],"d":"체인은 위치에 따라 늘어난 정도가 다를 수 있습니다. 작업용 스탠드로 뒷바퀴를 들어 올리면 바퀴를 돌려 가며 여러 위치의 유격을 확인할 수 있어 정확합니다. 실제 정비에서는 차종별 정비지침서가 정한 자세를 따릅니다."}},{"q":"이륜자동차 동력전달장치에서 프론트 스프로킷의 역할은?","o":["뒷바퀴 스프로킷에 직접 동력을 전달한다.","엔진 출력축에 장착되어 엔진 동력을 변속기에 전달한다.","체인 장력을 조절한다.","변속기 출력축에 연결되어 체인에 동력을 전달한다."],"a":3,"e":{"w":["뒷바퀴 스프로킷에는 체인을 거쳐 동력이 전달됩니다.","프론트 스프로킷은 엔진 출력축이 아니라 변속기 출력축에 달립니다.","장력은 뒷바퀴 축의 조정 장치로 조절합니다."],"d":"프론트 스프로킷은 변속기 출력축에 연결되어, 변속기를 거친 동력을 체인에 전달합니다. 체인은 이 동력을 뒷바퀴 스프로킷으로 보냅니다."}},{"q":"이륜자동차 동력전달장치 점검 시, 스프로킷 이빨의 마모 상태를 육안으로 확인할 때 어떤 모양을 주의 깊게 봐야 하는가?","o":["이빨이 더 두꺼워진 경우","이빨 끝이 갈고리 모양으로 휘거나 뾰족해진 경우","이빨에 색이 변한 경우","이빨의 마모가 없는 경우"],"a":1,"e":{"w":["이빨은 닳으면 얇아지지 두꺼워지지 않습니다.","색의 변화만으로는 마모를 판단하지 않습니다.","마모가 없으면 정상입니다."],"d":"스프로킷 이빨이 닳으면 끝이 뾰족해지고, 힘을 받는 방향으로 갈고리처럼 휩니다. 이런 모양이 보이면 체인과 함께 교환해야 합니다."}},{"q":"이륜자동차의 체인 장력이 너무 느슨할 때 발생할 수 있는 문제점은?","o":["주행 중 체인 이탈","주행 중 체인의 마모 감소","주행 중 스프로킷 마모 감소","주행 중 엔진 온도 증가"],"a":0,"e":{"w":["느슨한 체인은 출렁거리며 스프로킷을 때려 마모가 늘어납니다.","스프로킷 마모도 늘어납니다.","체인 장력은 엔진 온도와 관계가 없습니다."],"d":"체인이 너무 느슨하면 달리는 동안 출렁거리다 스프로킷에서 벗겨질 수 있습니다. 소음과 충격도 커집니다."}},{"q":"이륜자동차 체인 장력이 너무 팽팽할 때 발생할 수 있는 문제점이 아닌 것은?","o":["체인의 마모 가속화","스프로킷 마모 가속화","엔진 크랭크축 마모 가속화","변속기 및 베어링 마모 가속화"],"a":2,"e":{"w":["팽팽한 체인은 핀과 부싱에 큰 힘이 걸려 빨리 닳습니다.","스프로킷 이빨에도 큰 힘이 걸려 빨리 닳습니다.","체인이 당기는 힘이 변속기 출력축과 뒷바퀴 베어링에 걸려 마모가 빨라집니다."],"d":"체인이 당기는 힘은 변속기 출력축과 뒷바퀴 쪽에 걸립니다. 엔진 크랭크축은 체인과 직접 연결되어 있지 않으므로 체인 장력의 영향을 받지 않습니다."}},{"q":"이륜자동차 스프로킷의 이빨이 마모되어 뾰족해진 상태에서 계속 주행할 경우, 발생할 수 있는 가장 큰 문제는?","o":["체인이 이탈된다.","체인 소음이 줄어든다.","체인 윤활이 필요 없어진다.","변속기 기어비가 높아진다."],"a":0,"e":{"w":["닳은 스프로킷은 소음이 오히려 커집니다.","윤활은 계속 필요합니다.","이빨이 닳아도 잇수는 그대로라 기어비는 변하지 않습니다."],"d":"이빨이 뾰족해지면 체인을 제대로 잡아 주지 못해 체인이 이빨을 타고 넘거나 벗겨집니다. 주행 중 체인이 빠지면 뒷바퀴가 잠길 수 있어 가장 위험합니다."}}],"id":"p07"},{"g":"안전·편의장치","name":"안전 및 편의장치","qs":[{"q":"이륜자동차 시트 컨트롤러가 시트 온도를 조절하는 방법은?","o":["발열선에 공급되는 길이를 조절하여","발열선에 공급되는 무게를 조절하여","발열선에 공급되는 전류의 흐름을 조절하여","발열선의 면적을 조절하여"],"a":2,"e":{"w":["발열선의 길이는 만들 때 정해져 있어 조절할 수 없습니다.","무게는 온도와 관계가 없습니다.","발열선의 면적도 만들 때 정해져 있습니다."],"d":"발열선은 전류가 흐르면 열을 냅니다. 시트 컨트롤러는 발열선에 흐르는 전류를 늘리거나 줄이고, 끊었다 이었다 하면서 온도를 조절합니다."}},{"q":"이륜자동차 시트 히팅 시스템이 과열되는 것을 방지하기 위해 시트 컨트롤러의 중요한 안전 기능은?","o":["일정 온도 이상 시 전원 공급을 차단한다.","일정 온도 이상 시 시동을 끈다.","일정 온도 이상 시 브레이크를 작동시킨다.","일정 온도 이상 시 비상등을 작동시킨다."],"a":0,"e":{"w":["과열을 막으려고 엔진 시동까지 끌 필요는 없습니다.","브레이크는 시트 온도와 관계가 없습니다.","비상등을 켜도 온도는 내려가지 않습니다."],"d":"시트 컨트롤러는 온도 센서로 시트 온도를 감시합니다. 일정 온도를 넘으면 발열선으로 가는 전원을 차단해 화상과
