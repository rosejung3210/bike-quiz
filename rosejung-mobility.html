":{"w":["포머는 보이스 코일을 감는 원통입니다.","바스켓은 스피커의 뼈대입니다.","더스트 캡은 먼지를 막는 덮개입니다."],"d":"보이스 코일에 전기 신호가 흐르면 자력이 생기고, 자석의 자기장과 서로 밀고 당기면서 움직입니다. 이 움직임이 진동판을 울려 소리를 냅니다."}},{"q":"이륜자동차에서 최적의 음질을 위해 트위터(고 음), 미드레인지(중음), 미드우퍼(중저음) 등의 스피커 유닛을 분리하여 설치하고, 각각의 유닛을 최저의 위치에 장착하여 더 섬세하고 입체 적인 사운드를 구현할 수 있는 스피커는?","o":["코액셜 스피커","컴포넌트 스피커","패시브 스피커","액티브 스피커"],"a":1,"e":{"w":["코액셜 스피커는 여러 유닛을 하나의 축에 겹쳐 만든 일체형입니다.","패시브는 앰프가 없다는 뜻입니다.","액티브는 앰프를 내장했다는 뜻입니다."],"d":"컴포넌트 스피커는 트위터, 미드레인지, 우퍼를 따로 떼어 각각 알맞은 위치에 설치하는 방식입니다. 음질이 좋습니다."}},{"q":"이륜자동차 스피커에서 진동판이 앞뒤로 움직일 때, 이를 지지하고 중심을 잡아주며 불필요 한 진동을 억제하는 유연한 고무 또는 폼 재질의 부품은?","o":["진동판","보이스 코일","자석","서라운드"],"a":3,"e":{"w":["진동판은 소리를 내는 판입니다.","보이스 코일은 진동판을 움직이는 코일입니다.","자석은 자기장을 만듭니다."],"d":"서라운드(에지)는 진동판 바깥 테두리를 바스켓에 이어 주는 유연한 고무나 폼 재질의 부품입니다. 진동판이 앞뒤로 바르게 움직이도록 지지하고 중심을 잡아 줍니다."}},{"q":"이륜자동차 스피커에서 보이스 코일의 진동을 공기 중으로 전달하여 소리를 직접 만들어 내는 원뿔 모양의 부품은?","o":["더스트 캡","서라운드","스파이더","진동판"],"a":3,"e":{"w":["더스트 캡은 가운데의 먼지 덮개입니다.","서라운드는 진동판 테두리를 지지합니다.","스파이더(댐퍼)는 보이스 코일의 중심을 잡아 줍니다."],"d":"진동판(콘)은 보이스 코일의 움직임을 공기에 전달해 소리를 직접 만들어 내는 원뿔 모양의 부품입니다."}},{"q":"주로 이륜자동차 핸들바에 직접 장착되어 간편 하게 사용할 수 있는 스피커 종류는?","o":["페어링 내장형 스피커","핸들바 장착형 스피커","새들백 내장형 스피커","헬멧 내장형 스피커"],"a":1,"e":{"w":["페어링 내장형은 앞 카울 안에 넣는 방식입니다.","새들백 내장형은 옆 가방에 넣는 방식입니다.","헬멧 내장형은 헬멧 안에 넣는 방식입니다."],"d":"핸들바 장착형 스피커는 핸들바에 직접 달아 간편하게 쓸 수 있습니다."}},{"q":"이륜자동차 오디오장치에서 핸들바에 장착된 컨트롤 버튼의 편의성은 다음 중 어느 것인가?","o":["오디오장치의 음질을 향상시킨다.","오디오장치의 전력 소모를 줄인다.","주행 중 손을 떼지 않고 안전하게 볼륨 조절, 트랙변경 등 오디오 기능을 조작할 수 있게 한다.","오디오장치의 설치를 쉽게 한다."],"a":2,"e":{"w":["음질을 높이는 것이 아닙니다.","전력 소모와는 관계가 없습니다.","설치와는 관계가 없습니다."],"d":"핸들바에 컨트롤 버튼이 있으면 주행 중 핸들에서 손을 떼지 않고 볼륨 조절이나 곡 변경을 할 수 있어 안전합니다."}},{"q":"이륜자동차 앰프 중, 유리 진공관 내부에서 전 자 흐름을 이용하여 신호를 증폭하며, 따뜻하 고 풍부한 음색으로 특정 오디오 애호가들에게 선호되는 방식은?","o":["FET(전계 효과 트랜지스터) 방식","TR(트랜지스터) 방식","진공관 방식","디지털 증폭 방식"],"a":2,"e":{"w":["FET 방식은 반도체 소자로 증폭합니다.","TR 방식도 반도체 소자로 증폭합니다.","디지털 증폭 방식은 진공관을 쓰지 않습니다."],"d":"진공관 방식은 유리 진공관 안의 전자 흐름으로 신호를 증폭합니다. 따뜻하고 풍부한 음색이 특징입니다."}},{"q":"TR 방식 앰프에 비해 진공관 방식 앰프가 가지는 특징은?","o":["더 큰 크기의 높은 발열","빠른 응답 속도","낮은 발열과 높은 효율","긴 수명과 적은 유지 보수"],"a":0,"e":{"w":["응답 속도는 TR 방식이 더 빠릅니다.","진공관은 발열이 크고 효율이 낮습니다.","진공관은 수명이 짧고 교체해야 합니다."],"d":"진공관 앰프는 진공관 자체가 크고 열을 많이 냅니다. TR 방식에 비해 크기가 크고 발열이 높은 것이 특징입니다."}},{"q":"이륜자동차 앰프에서 주로 전류를 제어하여 신 호를 증폭하며, 일반적으로 바이폴라 접합 트 랜지스터(BJT)가 사용되는 방식은?","o":["TR(트랜지스터) 방식","진공관 방식","FET(전계 효과 트랜지스터) 방식","IC(집적 회로) 방식"],"a":0,"e":{"w":["진공관 방식은 진공관으로 증폭합니다.","FET 방식은 전압으로 제어합니다.","IC 방식은 여러 소자를 하나의 칩에 넣은 것입니다."],"d":"TR(트랜지스터) 방식은 바이폴라 접합 트랜지스터(BJT)를 씁니다. 베이스에 흐르는 작은 전류로 큰 전류를 제어해 신호를 증폭합니다."}},{"q":"이륜자동차 스피커 시스템에서 음향신호를 증 폭하여 스피커를 구동할 수 있는 충분한 전력을 공급하는 장치는?","o":["인클로저","소스 기기","배선 하네스","앰프(Amplifier)"],"a":3,"e":{"w":["인클로저는 스피커를 담는 통입니다.","소스 기기는 음악 신호를 내보내는 기기입니다.","배선 하네스는 전선 묶음입니다."],"d":"앰프는 약한 음향 신호를 크게 키워, 스피커를 울릴 수 있는 충분한 전력으로 만들어 줍니다."}},{"q":"이륜자동차 앰프에서 전압을 제어하여 신호를 증폭하며, 입력 임피던스가 높아 민감한 신호 증폭에 유리한 반도체 소자 방식은?","o":["FET(전계 효과 트랜지스터) 방식","SCR(실리콘 제어 정류기) 방식","TR(트랜지스터) 방식","진공관 방식"],"a":0,"e":{"w":["SCR은 전류를 켜고 끄는 스위칭 소자입니다.","TR 방식은 전류로 제어합니다.","진공관은 반도체 소자가 아닙니다."],"d":"FET(전계 효과 트랜지스터)는 게이트에 가한 전압으로 전류를 제어합니다. 입력 임피던스가 높아 약하고 민감한 신호를 증폭하기에 유리합니다."}},{"q":"이륜자동차 리어 뷰는 운전자가 헬멧을 쓰거나 몸을 돌리지 않고도 후방 상황을 파악하게 해 차선 변경, 주행 안전에 도움을 준다. 다음 중 리어 뷰의 종류가 아닌 것은?","o":["일반형(핸들 부착)","바 엔드 미러","블랙 미러","광각/볼록 미러"],"a":2,"e":{"w":["일반형은 핸들에 다는 기본 리어 뷰 미러입니다.","바 엔드 미러는 핸들 바 끝에 다는 미러입니다.","광각/볼록 미러는 넓게 보이는 미러입니다."],"d":"리어 뷰 미러에는 일반형, 바 엔드 미러, 광각/볼록 미러 등이 있습니다. 블랙 미러라는 종류는 없습니다."}},{"q":"이륜자동차의 도난방지장치 점검 시, 주로 확 인해야 할 사항은?","o":["장치의 경보음의 크기가 작은지 확인한다.","도난방지 장치 활성화 시 시동이 잘 걸려 있는 지 확인한다.","장치의 경보음이 정상적으로 작동하는지 확 인한다.","장치의 설치비용을 확인한다."],"a":2,"e":{"w":["경보음은 작으면 안 되고 잘 들려야 합니다.","도난방지 장치가 켜진 상태에서는 시동이 걸리지 않아야 합니다.","설치비용은 점검 항목이 아닙니다."],"d":"도난방지장치는 누군가 차를 건드렸을 때 경보음을 울려 알립니다. 점검할 때는 경보음이 정상으로 울리는지 확인합니다."}}],"id":"p08"},{"g":"안전·편의장치","name":"주행안전장치","qs":[{"q":"오토바이 에어백은 라이더가 넘어질 때 에어백의 카트리지가 순간적으로 팽창하여 신체를 보호한다. 카트리지를 순간 팽창시키는 가스는?","o":["질소 가스","CO₂ 가스","NOx","CO"],"a":1,"e":{"w":["이 문제에서 묻는 카트리지에 넣는 가스가 아닙니다.","NOx(질소산화물)는 배출가스의 유해 성분입니다.","CO(일산화탄소)는 유독 가스라 쓸 수 없습니다."],"d":"오토바이용 에어백은 작은 가스 카트리지를 터뜨려 부풀립니다. 이 카트리지에는 압축한 이산화탄소(CO₂)를 넣어, 넘어지는 순간 빠르게 팽창시킵니다."}},{"q":"이륜자동차에 사용하는 에어백 연결 방식 중 오토바이와 와이어로 연결되어, 분리 시 에어백이 팽창하는 방식은 어떤 것인가?","o":["유선형","무선형","유무선형","전원형"],"a":0,"e":{"w":["무선형은 줄 없이 센서가 사고를 감지해 작동합니다.","유무선형이라는 연결 방식은 이 분류에 없습니다.","전원형이라는 연결 방식은 없습니다."],"d":"유선형은 에어백과 오토바이를 와이어(줄)로 연결해 둡니다. 라이더가 차에서 떨어지면 줄이 당겨지면서 카트리지가 터져 에어백이 팽창합니다."}},{"q":"이륜자동차에 사용하는 에어백 형태가 아닌 것은?","o":["입는 에어백 재킷/조끼","바지형 에어백","헬멧 연동형","구두형 에어백"],"a":3,"e":{"w":["재킷이나 조끼처럼 입는 에어백이 있습니다.","바지형 에어백도 있습니다.","헬멧과 연동되는 형태도 있습니다."],"d":"라이더용 에어백은 몸통, 목, 엉덩이처럼 크게 다치기 쉬운 부위를 보호하는 형태로 만듭니다. 구두형 에어백은 없습니다."}},{"q":"ABS의 기능은 무엇인가?","o":["브레이크 패드의 마모를 줄인다.","브레이크 작동 시 바퀴가 잠기는 것을 방지한다.","브레이크 작동 시 제동거리를 길게 한다.","브레이크 작동 시 바퀴가 잠기게 한다."],"a":1,"e":{"w":["ABS는 패드 마모를 줄이는 장치가 아닙니다.","제동거리를 길게 하는 것이 목적이 아닙니다.","바퀴가 잠기지 않게 하는 장치입니다."],"d":"ABS(바퀴잠김방지 제동장치)는 급제동 때 바퀴가 잠겨 미끄러지지 않도록 브레이크 유압을 빠르게 줄였다 늘렸다 합니다. 바퀴가 잠기지 않아야 넘어지지 않고 방향을 유지할 수 있습니다."}},{"q":"ABS의 구성요소가 아닌 것은?","o":["휠 스피드 센서","전자제어 유닛","하이드로닉 유닛","스로틀 포지션 센서"],"a":3,"e":{"w":["휠 스피드 센서는 바퀴 속도를 감지하는 ABS 부품입니다.","전자제어 유닛(ECU)은 ABS 작동을 판단하는 부품입니다.","유압을 조절하는 하이드롤릭 유닛은 ABS 부품입니다."],"d":"ABS는 휠 스피드 센서, 전자제어 유닛, 유압 조절 유닛으로 이루어집니다. 스로틀 포지션 센서는 스로틀 밸브가 열린 정도를 감지하는 엔진 제어용 센서입니다."}},{"q":"이륜자동차 ABS 경고등이 점등되었을 때, 가장 먼저 점검해야 할 센서는?","o":["휠 스피드 센서","브레이크 패드 마모 센서","흡입공기량 센서","차고 센서"],"a":0,"e":{"w":["패드 마모 센서는 ABS 경고등과 관계가 없습니다.","흡입공기량 센서는 엔진 제어용입니다.","차고 센서는 차체 높이를 감지하는 센서입니다."],"d":"ABS는 휠 스피드 센서의 신호로 바퀴가 잠기는지 판단합니다. 이 센서나 배선에 이상이 있으면 경고등이 켜지므로 가장 먼저 점검합니다."}},{"q":"ABS 컨트롤 유닛(제어모듈)에 대한 설명으로 틀린 것은?","o":["휠의 감속·가속을 계산한다.","각 바퀴의 속도를 비교·분석한다.","미끄러짐 비율을 계산하여 ABS 작동 여부를 결정한다.","컨트롤 유닛이 작동하지 않으면 브레이크가 전혀 작동하지 않는다."],"a":3,"e":{"w":["컨트롤 유닛은 바퀴의 감속과 가속을 계산합니다. 옳은 설명입니다.","각 바퀴의 속도를 비교하고 분석합니다. 옳은 설명입니다.","미끄러짐 비율을 계산해 ABS를 작동시킬지 결정합니다. 옳은 설명입니다."],"d":"컨트롤 유닛이 고장 나면 ABS 기능만 멈추고 일반 브레이크는 그대로 작동합니다. 이것을 페일 세이프라고 합니다. 브레이크가 전혀 듣지 않는다는 설명이 틀렸습니다."}},{"q":"바퀴잠김방지식 주제동장치(ABS)를 갖춘 이륜자동차에는 어떤 색상의 경고등이 설치되어야 하나?","o":["적색 경고등","녹색 경고등","황색 경고등","청색 경고등"],"a":2,"e":{"w":["ABS 경고등은 적색이 아닙니다.","녹색은 작동 중임을 알리는 표시등에 씁니다.","청색은 상향등 표시등 등에 씁니다."],"d":"바퀴잠김방지식 주제동장치(ABS)를 갖춘 이륜자동차에는 장치에 이상이 있을 때 알려 주는 황색 경고등을 설치해야 합니다."}},{"q":"이륜자동차 ABS 시스템은 젖은 노면이나 미끄러운 노면에서 제동 시, 일반 브레이크보다 어떤 면에서 유리한가?","o":["제동 거리를 항상 짧게 한다.","바퀴 잠김을 방지하여 안정적인 제동과 조향 유지를 돕는다.","바퀴 잠김을 유도하여 안정적인 제동과 조향 유지를 돕는다.","브레이크 패드 마모를 가속화시킨다."],"a":1,"e":{"w":["노면 상태에 따라 제동거리가 길어질 수도 있어 \"항상\" 짧다고 할 수 없습니다.","ABS는 바퀴 잠김을 막는 장치입니다.","패드 마모와는 관계가 없습니다."],"d":"미끄러운 노면에서는 바퀴가 쉽게 잠깁니다. ABS는 바퀴가 잠기지 않게 유압을 조절해, 넘어지지 않고 방향을 유지하면서 제동할 수 있게 돕습니다."}},{"q":"이륜자동차 ABS 시스템이 정상적으로 작동하는지 확인하는 가장 기본적인 방법은?","o":["급제동 시 바퀴가 잠기지 않고 ‘두두득’ 하는 진동이 느껴지는지 확인한다.","이륜자동차를 세워두고 브레이크 레버만 잡는다.","급제동 시 소음 상태를 확인한다.","급제동 시 바퀴가 밀리나 확인한다."],"a":0,"e":{"w":["세워 둔 상태에서 레버만 잡아서는 ABS가 작동하지 않습니다.","소음만으로는 작동 여부를 알 수 없습니다.","바퀴가 밀리는지 보는 것은 ABS 작동 확인이 아닙니다."],"d":"ABS가 작동하면 유압을 빠르게 조절하기 때문에 레버나 페달에서 '두두둑' 하는 진동이 느껴지고, 바퀴는 잠기지 않습니다. 이것이 정상 작동의 표시입니다."}},{"q":"이륜자동차 ABS 시스템이 작동할 때, 휠 속도 센서가 감지하는 것은?","o":["타이어의 공기압","브레이크액의 압력","브레이크 패드의 마모도","바퀴의 회전 속도"],"a":3,"e":{"w":["공기압은 TPMS 센서가 감지합니다.","브레이크액의 압력은 압력 센서가 감지합니다.","패드의 마모는 휠 속도 센서가 감지하지 않습니다."],"d":"휠 속도 센서는 바퀴와 함께 도는 톤 휠(센서 링)의 이를 읽어 바퀴의 회전 속도를 감지합니다. ECU는 이 신호로 바퀴가 잠기려 하는지 판단합니다."}},{"q":"이륜자동차 ABS 시스템이 장착된 차량에서 눈길이나 빗길과 같이 노면이 미끄러운 상황에서 ABS가 제공하는 안전 이점은 어느 것인가?","o":["타이어 마모 방지","연료 소모량 감소","제동 중 바퀴 잠김 위험을 크게 줄여 조향성 유지","제동 중 조향성 상실"],"a":2,"e":{"w":["타이어 마모 방지는 ABS의 목적이 아닙니다.","연료 소모와는 관계가 없습니다.","ABS는 조향성을 잃지 않게 해 주는 장치입니다."],"d":"눈길이나 빗길에서는 바퀴가 쉽게 잠깁니다. ABS는 제동 중 바퀴가 잠길 위험을 크게 줄여, 넘어지지 않고 조향성을 유지하게 해 줍니다."}},{"q":"이륜자동차 ABS 시스템에서 바퀴의 회전 속도를 감지하여 ABS ECU로 정보를 보내는 부품은?","o":["브레이크 오일 압력 센서","스로틀 포지션 센서","브레이크 레버 스위치","ABS 휠 속도 센서"],"a":3,"e":{"w":["오일 압력 센서는 유압을 감지합니다.","스로틀 포지션 센서는 엔진 제어용입니다.","브레이크 레버 스위치는 제동등을 켜는 신호를 보냅니다."],"d":"ABS 휠 속도 센서가 바퀴의 회전 속도를 감지해 ABS ECU로 보냅니다."}},{"q":"ABS 경고등이 계기판에 점등될 때 점검해야 할 사항으로 관계가 없는 것은?","o":["ABS 센서 불량","타이어 공기압 센서 불량","ABS 모듈 이상","휠 속도 센서에 이물질로 인한 오염"],"a":1,"e":{"w":["ABS 센서가 불량이면 경고등이 켜집니다.","ABS 모듈에 이상이 있으면 경고등이 켜집니다.","휠 속도 센서에 이물질이 묻으면 신호가 흐트러져 경고등이 켜집니다."],"d":"ABS 경고등은 ABS 계통(센서, 배선, 모듈)에 이상이 있을 때 켜집니다. 타이어 공기압 센서는 TPMS 부품이라 ABS 경고등과 관계가 없습니다."}},{"q":"이륜자동차의 ABS 경고등이 점등되어 있을 때, 전기전자회로 측면에서 가장 먼저 점검해야 할 부품은?","o":["브레이크 패드 마모 센서","ABS 모듈의 작동음 상태","브레이크 오일압력 센서","휠 스피드 센서 및 관련 배선"],"a":3,"e":{"w":["패드 마모 센서는 ABS 경고등과 관계가 없습니다.","작동음은 전기전자회로 점검이 아닙니다.","오일압력 센서보다 휠 스피드 센서 쪽 고장이 훨씬 흔합니다."],"d":"ABS 경고등의 가장 흔한 원인은 휠 스피드 센서와 그 배선, 커넥터의 단선이나 접촉 불량입니다. 전기전자회로 측면에서는 이 부분을 먼저 점검합니다."}},{"q":"이륜자동차에 ABS가 장착되어 있을 때, 내리막길 급제동 시 가장 기대할 수 있는 이점은?","o":["바퀴 잠김 없이 안정적인 제동이 가능하여 안전성이 향상된다.","타이어 교환 주기가 짧아진다.","브레이크 오일 교환 주기가 길어진다.","무게 중심이 앞으로 쏠리면서 뒷바퀴가 쉽게 들려 안전성이 향상된다."],"a":0,"e":{"w":["타이어 교환 주기와는 관계가 없습니다.","브레이크 오일 교환 주기와는 관계가 없습니다.","ABS는 무게 쏠림을 만드는 장치가 아니며, 뒷바퀴가 들리는 것은 이점이 아닙니다."],"d":"내리막 급제동에서는 앞바퀴에 하중이 쏠려 바퀴가 잠기기 쉽습니다. ABS는 바퀴가 잠기지 않게 유압을 조절해 안정적으로 제동하게 해 줍니다."}},{"q":"ABS 시스템이 작동할 때 브레이크 레버나 페달에서 ‘두두둑’하는 진동이 느껴지는 이유는?","o":["브레이크 라인에 공기가 유입되어서","비포장 도로를 주행 시","브레이크 압력을 미세하게 조절하기 때문에","브레이크 패드가 마모되어서"],"a":2,"e":{"w":["공기가 들어가면 진동이 아니라 레버가 물렁해집니다.","노면 때문에 생기는 진동이 아닙니다.","패드 마모와는 관계가 없습니다."],"d":"ABS가 작동하면 유압 조절 유닛이 브레이크 압력을 아주 빠르게 줄였다 늘렸다 합니다. 이 압력 변화가 레버나 페달에 '두두둑' 하는 진동으로 전해집니다."}},{"q":"이륜자동차 ABS 경고등이 계속 켜져 있을 때, 운전자가 취해야 할 가장 적절한 조치는 어느 것인가?","o":["ABS 시스템 점검을 위해 정비소에 방문한다.","타이어 공기압을 높인다.","ABS 경고등 전구를 탈거한다.","ABS 시스템을 모두 탈거한다."],"a":0,"e":{"w":["공기압은 ABS 경고등과 관계가 없습니다.","전구를 빼면 고장이 그대로 남고 이상을 알 수도 없게 됩니다.","ABS를 떼어 내면 안전장치가 없어집니다."],"d":"ABS 경고등이 계속 켜져 있으면 ABS가 작동하지 않는 상태입니다. 일반 브레이크는 작동하지만 안전을 위해 정비소에서 점검을 받아야 합니다."}},{"q":"이륜자동차 ABS ECU에 문제가 발생했을 때, 나타나는 증상은?","o":["엔진 시동이 걸리지 않는다.","브레이크에 소음이 발생한다.","계기판의 엔진 경고등이 계속 점등되거나 깜빡인다.","계기판의 ABS 경고등이 계속 점등되거나 깜빡인다."],"a":3,"e":{"w":["ABS ECU는 엔진 시동과 관계가 없습니다.","브레이크 소음은 패드나 디스크의 문제입니다.","엔진 경고등은 엔진 제어 계통의 이상을 알립니다."],"d":"ABS ECU에 문제가 생기면 계기판의 ABS 경고등이 계속 켜지거나 깜빡여 운전자에게 알립니다."}},{"q":"이륜자동차 ABS 시스템에 이상이 발생했을 때, 운전자에게 가장 명확하게 알려주는 신호는?","o":["브레이크 패드 색깔 변화","좌·우 방향지시등을 동시에 점멸","계기판의 ABS 경고등 점등","엔진 경고등 점등"],"a":2,"e":{"w":["패드 색깔로는 ABS 이상을 알 수 없습니다.","방향지시등이 함께 깜빡이는 것은 비상등입니다.","엔진 경고등은 엔진 계통의 이상을 알립니다."],"d":"ABS에 이상이 생기면 계기판의 ABS 경고등이 켜집니다. 운전자에게 가장 분명하게 알려 주는 신호입니다."}},{"q":"ABS 브레이크 시스템에서 페일 세이프 상태가 되면 나타나는 현상은?","o":["모듈레이터 모터가 작동된다.","모듈레이터 솔레노이드 밸브로 전원을 공급한다.","ABS 기능이 작동되지 않아 주차브레이크가 자동으로 작동한다.","ABS 기능이 작동되지 않아도 일반적인 브레이크는 작동된다."],"a":3,"e":{"w":["페일 세이프 상태에서는 모듈레이터 모터가 작동하지 않습니다.","솔레노이드 밸브로 가는 전원을 끊습니다.","주차브레이크와는 관계가 없습니다."],"d":"페일 세이프는 고장이 났을 때 안전한 쪽으로 동작하게 하는 기능입니다. ABS에 고장이 나면 ABS 기능을 멈추고, 일반 브레이크는 그대로 작동하게 합니다."}},{"q":"휠 스피드 센서 파형 점검 시 가장 유용한 장비는?","o":["회전계","멀티테스터기","오실로스코프","전류계"],"a":2,"e":{"w":["회전계는 회전수만 알려 줍니다.","멀티테스터는 전압이나 저항 값만 보여 주고 파형은 볼 수 없습니다.","전류계는 전류의 크기만 알려 줍니다."],"d":"파형은 시간에 따라 전압이 변하는 모양입니다. 이것을 화면에 그려 보여 주는 장비가 오실로스코프입니다. 휠 스피드 센서의 신호가 고른지, 빠진 곳이 없는지 확인할 수 있습니다."}},{"q":"이륜자동차 ABS에서 제어모듈(ECU)의 신호를 받아 밸브와 모터가 작동되면서 유압의 증가, 감소, 유지 등을 제어하는 것은?","o":["마스터 실린더","딜리버리 밸브","프로포셔닝 밸브","하이드롤릭 유닛"],"a":3,"e":{"w":["마스터 실린더는 레버나 페달의 힘을 유압으로 바꿉니다.","딜리버리 밸브는 ABS 유압 제어 부품이 아닙니다.","프로포셔닝 밸브는 앞뒤 제동력을 나누는 밸브입니다."],"d":"하이드롤릭 유닛(유압 조절 유닛)은 ECU의 신호를 받아 솔레노이드 밸브와 펌프 모터를 움직여 브레이크 유압을 높이고, 낮추고, 유지합니다."}},{"q":"ABS 장치의 고장진단 시 경고등의 점등에 관한 설명 중 틀린 것은?","o":["점화스위치 ON 시 점등되어야 한다.","ABS 컴퓨터 고장 발생 시에는 소등된다.","ABS 컴퓨터 커넥터 분리 시 점등되어야 한다.","정상 시 ABS 경고등은 엔진 시동 후 일정 시간 점등되었다가 소등된다."],"a":1,"e":{"w":["점화스위치를 켜면 자기진단을 위해 경고등이 켜집니다. 옳은 설명입니다.","커넥터가 빠지면 경고등이 켜져야 합니다. 옳은 설명입니다.","정상이면 시동 뒤 경고등이 꺼집니다. 옳은 설명입니다."],"d":"ABS 경고등은 이상이 있을 때 켜져서 알려 주는 장치입니다. ABS 컴퓨터가 고장 나면 경고등이 켜져야 하므로, 꺼진다는 설명이 틀렸습니다."}},{"q":"전자제어 제동장치(ABS)의 유압제어 모드에서 주행 중 급제동 시 고착된 바퀴의 유압제어는?","o":["감압 제어","정압 제어","분압 제어","증압 제어"],"a":0,"e":{"w":["정압 제어라는 모드는 없습니다.","분압 제어라는 모드는 없습니다.","증압은 잠긴 바퀴를 더 잠기게 합니다."],"d":"ABS의 유압 제어는 감압, 유지, 증압 세 가지입니다. 바퀴가 잠기면(고착) 유압을 낮추는 감압 제어로 바퀴를 다시 돌게 합니다."}},{"q":"ABS와 TCS(Traction Control System)에 대한 설명으로 틀린 것은?","o":["TCS는 구동륜이 슬립하는 현상을 방지한다.","ABS는 주행 중 제동 시 타이어의 록(Lock)을 방지한다.","ABS는 제동 시 조향 안전성 확보를 위한 시스템이다.","TCS는 급제동 시 제동력 제어를 통해 차량 스핀 현상을 방지한다."],"a":3,"e":{"w":["TCS는 구동 바퀴가 헛도는 것을 막습니다. 옳은 설명입니다.","ABS는 제동할 때 바퀴가 잠기는 것을 막습니다. 옳은 설명입니다.","ABS는 제동 중 조향 안정성을 확보합니다. 옳은 설명입니다."],"d":"TCS는 출발하거나 가속할 때 구동 바퀴가 헛도는 것을 막는 장치입니다. 급제동 때 제동력을 제어하는 것은 ABS의 역할이므로 ④가 틀린 설명입니다."}},{"q":"구동륜 제어장치(TCS)에 대한 설명으로 틀린 것은?","o":["차체 높이 제어를 위한 성능 유지","눈길, 빙판길에서 미끄러짐 방지","커브길 선회 시 주행 안정성 유지","노면과 차륜 간의 마찰 상태에 따라 엔진 출력 제어"],"a":0,"e":{"w":["눈길과 빙판길에서 미끄러짐을 막는 것은 TCS의 기능입니다.","커브길에서 주행 안정성을 유지하는 것도 TCS의 기능입니다.","노면과 바퀴 사이의 마찰 상태에 따라 엔진 출력을 조절하는 것이 TCS입니다."],"d":"TCS는 구동 바퀴의 미끄러짐을 줄이는 장치입니다. 차체 높이를 제어하는 것은 현가장치 쪽 기능이라 TCS와 관계가 없습니다."}},{"q":"TCS 장치의 추적 제어에 대한 설명으로 틀린 것은?","o":["가속페달의 조작빈도를 감소시켜 선회능력을 향상시킨다.","선회 가속 시 안정성을 확보하여 주행성능을 향상시킨다.","조향각속도 센서 및 휠 스피드 센서의 출력값으로부터 데이터를 수집한다.","차량속도와 휠 스피드 센서의 출력값으로부터 구동 바퀴의 미끄럼 비율을 판단한다."],"a":0,"e":{"w":["선회 가속 때 안정성을 확보하는 것은 추적 제어의 설명입니다.","조향각과 휠 스피드 센서 신호로 선회 상태를 판단합니다.","차량 속도와 휠 스피드 센서 값으로 구동력을 제어합니다."],"d":"추적(트레이스) 제어는 선회하면서 가속할 때 구동력을 줄여 원하는 선회 궤적을 따라가게 하는 제어입니다. 이 문제는 ①을 추적 제어의 설명으로 보지 않습니다."}},{"q":"이륜자동차의 사이드 스탠드 또는 메인스탠드 관련 안전장치 점검 시, 확인해야 할 것은?","o":["스탠드의 마모 상태","스탠드가 설치된 각도","스탠드의 무게","기어 변속 시 시동이 꺼지는 안전장치의 작동 여부"],"a":3,"e":{"w":["스탠드의 마모는 안전장치 점검 항목이 아닙니다.","설치 각도는 안전장치의 작동과 관계가 없습니다.","스탠드의 무게는 점검 항목이 아닙니다."],"d":"사이드 스탠드에는 스위치가 달려 있습니다. 스탠드를 내린 채 기어를 넣으면 시동이 꺼지게 해서, 스탠드를 내린 채 출발하는 사고를 막습니다. 이 안전장치가 작동하는지 확인합니다."}},{"q":"TPMS 시스템에서 타이어 공기압 정보를 측정하여 무선으로 전송하는 부품은?","o":["차속 센서","휠 속도 센서","차고 센서","휠 내부 센서"],"a":3,"e":{"w":["차속 센서는 차의 속도를 감지합니다.","휠 속도 센서는 ABS용 센서입니다.","차고 센서는 차체 높이를 감지합니다."],"d":"TPMS는 휠 안쪽(주로 공기 밸브 자리)에 단 센서가 타이어 공기압과 온도를 재서 무선으로 보냅니다."}},{"q":"TPMS가 이륜자동차 안전에 기여하는 가장 큰 이점은?","o":["타이어 저압 상태 및 고온 상태의 이상을 조기에 감지하여 안전운전 지원","타이어 밸런스를 정확하게 조정한다.","변속비를 자동으로 조절한다.","엔진의 출력을 향상시킨다."],"a":0,"e":{"w":["타이어 밸런스는 휠 밸런서로 맞춥니다.","변속비와는 관계가 없습니다.","엔진 출력과는 관계가 없습니다."],"d":"TPMS는 타이어 공기압이 낮거나 온도가 높은 이상 상태를 일찍 알려 줍니다. 운전자가 미리 조치할 수 있어 타이어 파손으로 인한 사고를 막는 데 도움이 됩니다."}},{"q":"이륜자동차 TPMS 센서를 교체한 후, 새로운 센서가 시스템에 인식되지 않아 경고등이 계속 켜져 있다면, 가장 먼저 시도해야 할 조치는?","o":["진단 장비를 이용하여 센서 ID를 ECU에 등록하거나 재학습시킨다.","TPMS 모듈을 교환한다.","이륜자동차 배터리 (-)단자를 탈거했다가 다시 조립한다.","엔진 ECU에서 기억소거를 시킨다."],"a":0,"e":{"w":["모듈 교환은 등록을 해 본 뒤에 판단할 일입니다.","배터리 단자를 뗐다 붙여도 새 센서 ID가 등록되지는 않습니다.","엔진 ECU의 기억을 지우는 것은 TPMS와 관계가 없습니다."],"d":"TPMS 센서마다 고유 번호(ID)가 있습니다. 센서를 바꾸면 새 ID를 수신 장치(ECU)에 등록하거나 재학습시켜야 시스템이 새 센서를 알아봅니다."}},{"q":"이륜자동차 TPMS(Tire Pressure Monitoring System)의 역할은?","o":["타이어의 마모 상태를 감지한다.","타이어의 공기압을 실시간으로 측정하여 운전자에게 경고한다.","타이어의 공기량을 감지한다.","연료 소비율을 감지한다."],"a":1,"e":{"w":["TPMS는 마모 상태를 감지하지 않습니다.","공기의 양이 아니라 압력을 잽니다.","연료 소비율과는 관계가 없습니다."],"d":"TPMS는 타이어 공기압 감시 장치입니다. 공기압을 실시간으로 재서 기준보다 낮아지면 운전자에게 경고합니다."}},{"q":"TPMS의 휠 내부 센서는 각 바퀴의 압력을 측정해 공기압 보통 몇 % 이상 부족을 감지하면 계기판에 경고등을 띄우는가?","o":["25%","50%","60%","80%"],"a":0,"e":{"w":["50%까지 떨어진 뒤에 알리면 너무 늦습니다.","60%는 기준이 아닙니다.","80%는 기준이 아닙니다."],"d":"TPMS는 보통 공기압이 적정값보다 25% 이상 부족해지면 계기판에 경고등을 띄웁니다."}},{"q":"이륜자동차 TPMS 센서의 전원 공급 방식은?","o":["발전기에서 직접 전원을 공급받는다.","이륜자동차 배터리에서 전원을 공급받는다.","센서 내부에 내장된 배터리에서 전원을 공급받는다.","전원을 공급받지 않아도 된다."],"a":2,"e":{"w":["센서는 도는 바퀴 안에 있어 발전기와 전선으로 이을 수 없습니다.","차체 배터리와도 전선으로 이을 수 없습니다.","센서가 측정하고 무선으로 보내려면 전원이 필요합니다."],"d":"TPMS 센서는 회전하는 휠 안에 있어 전선을 연결할 수 없습니다. 그래서 센서 안에 들어 있는 배터리로 작동합니다."}},{"q":"이륜자동차 TPMS 시스템이 장착된 차량에서, 타이어 공기압이 너무 낮은 상태로 주행할 때 발생할 수 있는 위험한 사항이 아닌 것은?","o":["타이어의 과열","현가장치의 과열","조종성 불안정","타이어의 파열"],"a":1,"e":{"w":["공기압이 낮으면 타이어가 많이 찌그러지면서 열이 납니다.","공기압이 낮으면 핸들이 무겁고 조종이 불안정해집니다.","과열이 심해지면 타이어가 파열될 수 있습니다."],"d":"공기압이 낮으면 타이어가 과열되고, 조종성이 나빠지며, 심하면 파열됩니다. 현가장치가 과열되는 것은 공기압과 관계가 없습니다."}},{"q":"이륜자동차 TPMS 센서가 타이어 내부의 온도를 측정하는 이유는?","o":["타이어의 공기압 변화가 온도에 영향을 받으므로 이를 보정하기 위해","외부 대기 온도를 파악하기 위해","타이어 마모 여부를 판단하기 위해","타이어와 접촉 노면의 온도를 감지하기 위해"],"a":0,"e":{"w":["외부 기온을 알기 위한 것이 아닙니다.","마모는 온도로 판단하지 않습니다.","노면의 온도를 재는 것이 아닙니다."],"d":"공기는 온도가 오르면 압력도 오릅니다. 주행으로 타이어가 뜨거워지면 압력이 높게 나오므로, 센서가 온도를 함께 재서 이 변화를 보정합니다."}},{"q":"TPMS가 장착된 이륜자동차에서 타이어 교체 후 또는 센서 교체 후 필요한 작업은 다음 중 어느 것인가?","o":["ABS 시스템 재설정","TCS 시스템 재설정","엔진 시스템 재설정","TPMS 시스템 재설정(재보정)"],"a":3,"e":{"w":["ABS는 타이어나 센서 교체와 관계가 없습니다.","TCS도 관계가 없습니다.","엔진 시스템도 관계가 없습니다."],"d":"타이어나 센서를 교체하면 센서의 위치나 ID가 달라질 수 있습니다. TPMS 시스템을 재설정(재보정)해서 새 상태를 인식시켜야 합니다."}}],"id":"p09"},{"g":"프레임","name":"프레임","qs":[{"q":"이륜자동차 프레임의 기능에 대한 설명으로 틀린 것은?","o":["엔진, 서스펜션, 휠 등 다양한 부품을 연결하고 지지한다.","프레임은 차량의 기계부품과 본체를 지지하며, 정적 및 동적 하중을 지탱한다.","제동력을 증대시키고 작동을 원활하게 한다.","주행 중 발생하는 충격을 흡수하여 차량의 안정성을 유지한다."],"a":2,"e":{"w":["프레임은 엔진, 서스펜션, 휠 등을 연결하고 지지합니다. 옳은 설명입니다.","프레임은 기계부품과 본체를 지지하고 정적·동적 하중을 지탱합니다. 옳은 설명입니다.","프레임은 주행 중의 충격을 받아 내어 안정성을 유지합니다. 옳은 설명입니다."],"d":"프레임은 이륜자동차의 뼈대입니다. 부품을 지지하고 하중과 충격을 받아 냅니다. 제동력을 키우는 것은 제동장치의 일이므로 ③이 틀린 설명입니다."}},{"q":"이륜자동차 프레임의 성능에 결정적인 영향을 미치는 요소가 아닌 것은?","o":["강도","내구성","제동력","핸들링"],"a":2,"e":{"w":["강도는 하중을 견디는 힘으로 프레임 성능을 좌우합니다.","내구성은 오래 버티는 성질로 프레임 성능을 좌우합니다.","프레임의 강성이 핸들링을 좌우합니다."],"d":"프레임의 성능은 강도, 내구성, 핸들링(강성과 무게)으로 결정됩니다. 제동력은 제동장치의 성능이지 프레임의 요소가 아닙니다."}},{"q":"이륜자동차 프레임의 서브 프레임이 하는 역할 은?","o":["앞바퀴를 지지한다.","메인 프레임에 볼트로 고정되는 경우가 많다.","변속기의 회전을 전달한다.","뒷바퀴를 지지한다."],"a":1,"e":{"w":["앞바퀴는 프론트 포크가 지지합니다.","변속기의 회전을 전달하는 것은 동력전달장치입니다.","뒷바퀴는 스윙암이 지지합니다."],"d":"서브 프레임은 메인 프레임 뒤쪽에 붙어 시트와 뒤쪽 부품을 받치는 보조 프레임입니다. 메인 프레임에 볼트로 고정하는 경우가 많아, 손상되면 따로 떼어 교체할 수 있습니다."}},{"q":"서브 프레임에 대한 설명 중 틀린 것은?","o":["일반적으로 다양한 방향의 압력을 견딜 수 있 도록 井자형 또는 H자형과 같은 다양한 형태 로 설계되어 있다.","주로 강철(steel)로 만들어지지만, 경량화를 위해 알루미늄 합금을 적용하기도 한다.","충돌 발생 시 외부 충격을 차량 각 부위로 분 산시켜 차체 손상을 최소화하고 탑승자를 보 호하는 데 기여한다.","차량의 뼈대 역할을 하며, 엔진 및 모든 주요 구성 요소를 고정한다."],"a":3,"e":{"w":["서브 프레임은 여러 방향의 힘을 견디도록 다양한 형태로 설계합니다. 옳은 설명입니다.","주로 강철로 만들고, 가볍게 하려고 알루미늄 합금을 쓰기도 합니다. 옳은 설명입니다.","충돌할 때 충격을 분산시켜 손상을 줄이고 탑승자를 보호합니다. 옳은 설명입니다."],"d":"차량의 뼈대가 되어 엔진과 모든 주요 부품을 지지하는 것은 메인 프레임입니다. 서브 프레임은 그 일부를 보조하는 프레임이므로 ④가 틀린 설명입니다."}},{"q":"이륜자동차 프레임이 가져야 할 가장 중요한 구조적 특징은?","o":["탄력성이 매우 뛰어나야 한다.","비틀림 강성과 경량성을 동시에 갖추어야 한다.","부식이 잘 되어야 한다.","충격시 쉽게 부러져야 한다."],"a":1,"e":{"w":["프레임이 지나치게 탄력적이면 주행 중 휘어서 불안정합니다.","부식이 잘 되면 안 됩니다.","충격에 쉽게 부러지면 안 됩니다."],"d":"프레임은 선회와 제동 때의 비틀리는 힘을 견뎌야 하므로 비틀림 강성이 높아야 하고, 운동 성능을 위해 가벼워야 합니다. 두 가지를 함께 갖추는 것이 가장 중요합니다."}},{"q":"이륜자동차 프레임에서 스티어링 헤드 부분이 하는 역할은?","o":["앞바퀴의 조향이 이루어지도록 하는 중심축 이다.","발전기가 장착되는 곳이다.","브레이크가 연결되는 곳이다.","연료탱크가 놓이는 곳이다."],"a":0,"e":{"w":["발전기는 엔진에 장착됩니다.","브레이크가 연결되는 곳이 아닙니다.","연료탱크는 프레임 윗부분에 놓입니다."],"d":"스티어링 헤드(헤드 파이프)는 프레임 맨 앞에 있는 관입니다. 여기에 스티어링 스템이 끼워져 돌면서 앞바퀴의 방향을 바꾸므로, 조향의 중심축이 됩니다."}},{"q":"이륜자동차 프레임에서 스윙암 피벗 부분이 하는 역할은?","o":["핸들이 좌우로 운동을 할 수 있도록 하는 회전 축 부분이다.","뒷바퀴를 상하 운동을 할 수 있도록 하는 회전 축 부분이다.","앞바퀴를 상하 운동을 할 수 있도록 하는 회전 축 부분이다.","브레이크를 고정시키는 부분이다."],"a":1,"e":{"w":["핸들이 좌우로 도는 축은 스티어링 헤드입니다.","앞바퀴의 상하 운동은 프론트 포크가 담당합니다.","브레이크를 고정하는 부분이 아닙니다."],"d":"스윙암 피벗은 스윙암 앞쪽이 프레임에 연결되는 회전축입니다. 스윙암이 이 축을 중심으로 위아래로 움직이면서 뒷바퀴가 상하 운동을 합니다."}},{"q":"이륜자동차 프레임의 종류가 아닌 것은?","o":["크래들형","다이아몬드형","백본형","보디온 프레임형"],"a":3,"e":{"w":["크래들형은 엔진을 아래에서 감싸 받치는 이륜자동차 프레임입니다.","다이아몬드형은 엔진을 프레임의 일부로 쓰는 이륜자동차 프레임입니다.","백본형은 굵은 등뼈 모양의 이륜자동차 프레임입니다."],"d":"이륜자동차 프레임에는 크래들형, 다이아몬드형, 백본형, 트윈 스파형, 격자형 등이 있습니다. 보디온 프레임형은 이륜자동차 프레임의 종류가 아닙니다."}},{"q":"다음 중 격자 프레임(트렐리스(Trellis))에 대한 설명으로 올바른 것은?","o":["튜브를 사용하지 않고 대형 알루미늄 판을 단 일 구조로 성형하여 제작된다.","서로 짧은 금속 튜브들을 삼각형 격자 구조로 용접하여 만든 프레임이다.","엔진은 프레임에서 완전히 분리되어 스트레 스 멤버로 활용되지 않는다.","대량 생산에 적합하며, 고정밀 자동화 설비가 꼭 필요하다."],"a":1,"e":{"w":["큰 알루미늄 판을 하나의 구조로 성형하는 것은 격자 프레임이 아닙니다.","격자 프레임은 엔진을 강성 부재(스트레스 멤버)로 함께 쓰는 경우가 많습니다.","용접할 곳이 많아 대량 생산에 유리한 구조가 아닙니다."],"d":"격자(트렐리스) 프레임은 짧은 금속 튜브 여러 개를 삼각형 격자 모양으로 용접해 만듭니다. 삼각형 구조라 가벼우면서도 강성이 높습니다."}},{"q":"프레임의 강도와 강성을 얻기 위해 엔진을 부재의 일부로 이용하는 구조의 프레임은 어느 것인가?","o":["격자 프레임","모노크크 프레임","프리미터 프레임","다이아몬드형 프레임"],"a":3,"e":{"w":["격자 프레임은 짧은 튜브를 삼각형 격자로 용접한 구조입니다.","모노코크 프레임은 차체 껍질 자체가 프레임 역할을 합니다.","페리미터 프레임은 엔진 둘레를 감싸는 구조입니다."],"d":"다이아몬드형 프레임은 프레임 아래쪽이 열려 있고, 엔진을 강도 부재의 일부로 써서 그 자리를 이어 줍니다. 엔진이 프레임 역할을 함께 하므로 가볍습니다."}},{"q":"이륜자동차 백본 프레임의 특징은?","o":["다른 유형의 프레임에 비해 필요한 양이 많아 제조비용이 비싸다.","주로 대형 바이크에만 사용된다.","스티어링 헤드에서 스윙암 앞쪽에 위치한다.","엔진을 매달아 지지하는 구조이다."],"a":3,"e":{"w":["백본 프레임은 재료가 적게 들어 제조비용이 쌉니다.","주로 소형 바이크와 스쿠터에 씁니다.","백본은 스티어링 헤드에서 뒤쪽으로 뻗은 굵은 등뼈 모양의 프레임입니다."],"d":"백본 프레임은 굵은 관 하나가 등뼈처럼 뻗어 있고, 엔진을 그 아래에 매달아 지지합니다. 구조가 간단하고 값이 쌉니다."}},{"q":"오토바이 종류 중 스쿠터에 주로 적용되는 프레 임은?","o":["다아몬드 프레임","백본 프레임","격자 프레임","크래임형 프레임"],"a":1,"e":{"w":["다이아몬드 프레임은 엔진을 강도 부재로 쓰는 방식으로 일반 바이크에 씁니다.","격자 프레임은 스포츠 바이크에 주로 씁니다.","크래들형은 엔진을 감싸 받치는 방식으로 일반 바이크에 씁니다."],"d":"스쿠터는 발판 공간이 필요해서, 굵은 관 하나가 등뼈처럼 지나가는 백본 프레임을 주로 씁니다."}},{"q":"이륜자동차 프레임 구조 중, 엔진을 프레임의 일부로 사용하여 강성을 높이고 무게를 줄이는 방식은?","o":["더블 크래들 프레임","크래임형 프레임","다아몬드 프레임","스트레스드-멤버 프레임"],"a":3,"e":{"w":["더블 크래들 프레임은 두 개의 관으로 엔진을 아래에서 감싸 받칩니다.","크래들형은 엔진을 받치는 구조로, 엔진을 프레임의 일부로 쓰지 않습니다.","다이아몬드 프레임도 엔진을 부재로 쓰지만, 이 방식 자체를 가리키는 이름은 스트레스드-멤버입니다."],"d":"스트레스드-멤버 프레임은 엔진을 힘을 받는 부재(스트레스 멤버)로 삼아 프레임의 일부로 쓰는 방식입니다. 프레임 재료를 줄일 수 있어 강성을 높이면서 무게를 줄입니다."}},{"q":"이륜자동차 프레임의 한 종류인 더블 크래들 프레임의 특징은?","o":["엔진이 프레임 외부에 완전히 노출되어 있다.","두 개의 프레임이 더 내려와 엔진을 완전히 감싸고 지지하는 형태이다.","파이프를 구부리고 용접하는 공정이 비교적 간단하다.","가장 가벼운 프레임 구조이다."],"a":1,"e":{"w":["더블 크래들은 엔진을 프레임이 감싸는 구조입니다.","파이프가 많아 제작 공정이 간단하다고 할 수 없습니다.","파이프가 많아 가장 가벼운 구조가 아닙니다."],"d":"더블 크래들 프레임은 두 개의 다운 튜브가 아래로 내려와 엔진을 요람(크래들)처럼 완전히 감싸고 지지합니다. 튼튼하지만 무겁습니다."}},{"q":"트윈 스파 프레임의 특징으로 옳은 것은?","o":["헤드튜브에서 스윙암 피벗까지 두 개의 빔을 최단 경로로 연결하여 비틀림 강성을 높인다.","배트형(격자형) 튜브망으로 구성되어 있으며, 용접없이 조립된다.","프레임이 엔진을 완전히 둘러싸는 크래들 (cradle) 구조이다.","대부분 수직 스틸 튜브로만 이루어져 있어 경량화에는 불리하다."],"a":0,"e":{"w":["격자형 튜브망은 트렐리스 프레임의 설명이고, 프레임은 용접으로 만듭니다.","엔진을 완전히 둘러싸는 것은 크래들 프레임입니다.","트윈 스파는 주로 알루미늄 빔으로 만들어 가볍습니다."],"d":"트윈 스파 프레임은 굵은 빔 두 개가 헤드튜브에서 스윙암 피벗까지 엔진 양옆을 지나 가장 짧은 길로 이어집니다. 강성이 높아 스포츠 바이크에 많이 씁니다."}},{"q":"차체를 옆으로 기울여 세울 때 쓰는 외다리 장치는?","o":["핸들","사이드 스탠드","브레이크","센터 스탠드"],"a":1,"e":{"w":["핸들은 방향을 조종하는 장치입니다.","브레이크는 속도를 줄이거나 멈추는 장치입니다.","센터 스탠드는 차체 가운데 아래에 달린 두 다리 받침대로, 차체를 기울이지 않고 똑바로 세웁니다."],"d":"사이드 스탠드는 차체 옆으로 내리는 외다리 받침대입니다. 차체를 옆으로 살짝 기울여 스탠드에 기대어 세웁니다. 두 다리로 똑바로 세우는 센터 스탠드와 구분합니다."}},{"q":"이륜자동차 프레임에 다양한 재료의 패널을 혼 합하여 사용하는 방식은?","o":["단일 소재 프레임","더블 크래들 프레임","크래임형 프레임","복합소재 프레임"],"a":3,"e":{"w":["단일 소재 프레임은 한 가지 재료만 씁니다.","더블 크래들은 프레임의 구조 형식입니다.","크래들형도 구조 형식입니다."],"d":"복합소재 프레임은 강철, 알루미늄, 탄소 섬유 등 서로 다른 재료를 섞어 써서 각 재료의 장점을 살리는 방식입니다."}},{"q":"이륜자동차 프레임의 알루미늄 재질에 대한 설 명으로 옳은 것은?","o":["노면의 진동이나 충격 흡수 능력이 좋다.","강철보다 가볍지만, 수리가 까다롭다.","강철 프레임에 비해 부드러운 승차감을 줄 수 있다.","응력이 용접 부위에 집중되는 경향이 있어, 이 부분이 균열을 방지한다."],"a":1,"e":{"w":["알루미늄은 단단해서 진동과 충격을 흡수하는 능력이 강철보다 떨어집니다.","부드러운 승차감은 강철 프레임의 장점입니다.","응력이 용접 부위에 집중되면 균열이 생기기 쉽습니다. 균열을 방지한다는 설명이 틀렸습니다."],"d":"알루미늄은 강철보다 가벼워 프레임을 가볍게 만들 수 있습니다. 대신 용접과 교정이 어려워 수리가 까다롭습니다."}},{"q":"일반적인 강철 프레임 패널의 가장 큰 장점은?","o":["매우 가볍다.","전혀 녹이 슬지 않는다.","염분이 있는 환경에서 더 강하다.","뛰어난 내구성, 부드러운 승차감, 그리고 수리가 용이하다."],"a":3,"e":{"w":["강철은 무거운 편입니다.","강철은 녹이 습니다.","강철은 염분에 약합니다."],"d":"강철 프레임은 튼튼하고 오래가며, 적당히 휘면서 충격을 흡수해 승차감이 부드럽습니다. 용접과 교정이 쉬워 수리하기도 좋습니다."}},{"q":"강철 프레임 대비 알루미늄 프레임의 단점 중 하나는?","o":["진동 흡수가 전혀 안 된다.","강철보다 밀도가 훨씬 높아 무겁다.","상대적으로 제조비용이 높다.","내식성(녹 방지)이 취약하다."],"a":2,"e":{"w":["진동 흡수가 강철보다 떨어지지만 전혀 안 되는 것은 아닙니다.","알루미늄은 강철보다 밀도가 낮아 가볍습니다.","알루미늄은 강철보다 녹에 강합니다."],"d":"알루미늄은 재료 값이 비싸고 가공과 용접이 어려워, 강철 프레임보다 제조비용이 높습니다."}},{"q":"이륜자동차 프레임의 주요 재료로 사용되는 것은?","o":["강철 또는 알루미늄 합금","플라스틱 합금","티타늄 합금","구리 합금"],"a":0,"e":{"w":["플라스틱은 강도가 부족해 프레임 주재료로 쓰지 않습니다.","티타늄은 일부 고급 차에만 쓰는 비싼 재료입니다.","구리는 무르고 무거워 프레임에 쓰지 않습니다."],"d":"이륜자동차 프레임은 강철 또는 알루미늄 합금으로 만드는 것이 일반적입니다. 강철은 튼튼하고 값이 싸며, 알루미늄 합금은 가볍습니다."}},{"q":"탄소 섬유 패널의 가장 큰 장점이 아닌 것은?","o":["강철이나 알루미늄보다 훨씬 가벼워, 오토바이 전체 무게를 크게 줄일 수 있다.","가속력 향상, 제동 성능 개선, 특히 코너링 시 핸들링 및 민첩성이 향상된다.","금속과 달리 녹슬거나 부식되지 않으며, 고온에 대한 내성이 뛰어나다.","탄소 섬유로 제작되므로 제조비용이 매우 저렴하다."],"a":3,"e":{"w":["탄소 섬유는 강철이나 알루미늄보다 훨씬 가볍습니다. 장점이 맞습니다.","가벼워서 가속, 제동, 핸들링이 좋아집니다. 장점이 맞습니다.","금속과 달리 녹슬지 않습니다. 장점이 맞습니다."],"d":"탄소 섬유는 가볍고 강하며 녹슬지 않지만, 재료와 제작 공정이 비싸서 제조비용이 매우 높습니다. 저렴하다는 ④가 장점이 아닙니다."}},{"q":"이륜자동차 프레임 용접 작업할 경우가 아닌 경우는?","o":["프레임에 균열 시","프레임 파손 시","부품 교체 시","프레임에 심각한 부식 때"],"a":2,"e":{"w":["프레임에 균열이 생기면 용접으로 보수합니다.","프레임이 파손되면 용접으로 보수합니다.","부식이 심해 약해진 부분은 잘라 내고 용접으로 보수합니다."],"d":"용접은 균열, 파손, 심한 부식처럼 프레임 자체가 손상되었을 때 합니다. 부품을 교체하는 일은 볼트를 풀고 조이면 되므로 용접이 필요 없습니다."}},{"q":"프레임 용접 후, 용접 부위의 강도와 내구성을 확보하기 위해 중요한 과정은?","o":["충분한 냉각 및 필요시 후처리","바로 주행한다.","물에 담근다.","기름에 담근다."],"a":0,"e":{"w":["바로 주행하면 아직 식지 않은 용접부가 손상될 수 있습니다.","물에 담가 급하게 식히면 용접부가 약해지고 균열이 생깁니다.","기름에 담그는 것은 프레임 용접의 처리 방법이 아닙니다."],"d":"용접부는 천천히 충분히 식혀야 내부에 무리한 힘이 남지 않습니다. 필요하면 연마, 열처리, 방청 같은 후처리를 해서 강도와 내구성을 확보합니다."}},{"q":"이륜자동차 프레임 재료 중, 강철보다 가볍고 알루미늄보다 강하며 내식성이 뛰어나지만 용 접이 까다로운 것은?","o":["리튬","황동","마그네슘","티타늄"],"a":3,"e":{"w":["리튬은 프레임 재료가 아닙니다.","황동은 무르고 무거워 프레임에 쓰지 않습니다.","마그네슘은 가볍지만 부식에 약합니다."],"d":"티타늄은 강철보다 가볍고 알루미늄보다 강하며 녹에 매우 강합니다. 다만 용접할 때 공기와 닿으면 약해지므로 용접이 까다롭고 값이 비쌉니다."}},{"q":"알루미늄 프레임을 용접하려면 다음 중 맞는 용접 방식은?","o":["피복 아크 용접","TIG 용접","가스 용접","저항 용접"],"a":1,"e":{"w":["피복 아크 용접은 얇은 알루미늄에 정밀하게 쓰기 어렵습니다.","가스 용접은 열이 넓게 퍼져 알루미늄 프레임에 맞지 않습니다.","저항 용접은 얇은 판을 겹쳐 붙이는 방식입니다."],"d":"알루미늄은 표면에 산화막이 있고 열이 빨리 퍼져 용접이 어렵습니다. 보호 가스로 용접부를 감싸고 열을 정밀하게 조절할 수 있는 TIG 용접을 씁니다."}},{"q":"용접봉이나 용접선과 같은 용접 재료를 선택 할때 가장 중요하게 고려할 점은?","o":["프레임의 기본 재질","프레임의 두께","프레임의 면적","프레임의 무게"],"a":0,"e":{"w":["두께는 전류 같은 용접 조건을 정할 때 고려합니다.","면적은 용접 재료 선택의 기준이 아닙니다.","무게도 기준이 아닙니다."],"d":"용접 재료는 붙이려는 프레임의 재질과 맞아야 합니다. 재질이 맞지 않으면 제대로 붙지 않거나 용접부가 약해집니다."}},{"q":"비교적 빠르고 간편하며 대량 생산에 적합하여 일부 제조사에서 사용되기도 하는 용접법은?","o":["MIG/MAG 용접","TIG 용접","전기 용접","산소-아세틸렌 용접"],"a":0,"e":{"w":["TIG 용접은 정밀하지만 속도가 느립니다.","전기 용접은 넓은 뜻의 이름이라 이 설명에 맞는 특정 용접법이 아닙니다.","산소-아세틸렌 용접은 느리고 대량 생산에 맞지 않습니다."],"d":"MIG/MAG 용접은 용접 와이어가 자동으로 공급되어 빠르고 간편합니다. 그래서 대량 생산에 알맞습니다."}},{"q":"이륜자동차 공장에서 프레임을 대량 생산할 때, 일관된 품질과 높은 생산성을 위해 주로 사용되는 용접 방식은?","o":["TIG 용접","로봇 용접","산소-아세틸렌 용접","전기 용접"],"a":1,"e":{"w":["TIG 용접은 사람이 정밀하게 하는 작업이라 속도가 느립니다.","산소-아세틸렌 용접은 대량 생산에 쓰지 않습니다.","전기 용접은 방식의 이름일 뿐 일관된 품질을 보장하는 생산 방식이 아닙니다."],"d":"로봇 용접은 정해진 경로와 조건으로 똑같이 반복하므로 품질이 고르고 생산성이 높습니다. 공장의 대량 생산에 주로 씁니다."}},{"q":"이륜자동차 프레임 용접에 가장 흔하게 사용되며, 정밀하고 깨끗한 용접이 가능하여 고품질 작업에 선호되는 용접 방법은?","o":["TIG 용접","MIG/MAG 용접","가스 용접","피복 아크 용접"],"a":0,"e":{"w":["MIG/MAG 용접은 빠르지만 TIG보다 정밀도가 떨어집니다.","가스 용접은 열이 넓게 퍼져 정밀한 작업에 맞지 않습니다.","피복 아크 용접은 용접 찌꺼기가 생겨 깨끗하지 않습니다."],"d":"TIG 용접은 텅스텐 전극과 보호 가스를 써서 열을 세밀하게 조절합니다. 용접부가 정밀하 없는 것은?","o":["스위치 박스에 통전장치를 한다.","위험에 대한 방지장치를 한다.","스위치에 안전장치를 한다.","필요한 곳에 통전금지 기간에 관한 사항을 게시한다."],"a":0},{"q":"감전 사고를 방지하는 방법이 아닌 것은?","o":["차광용 안경을 착용한다.","반드시 절연 장갑을 착용한다.","물기가 있는 손으로 작업하지 않는다.","고압이 흐르는 부품에는 표시를 한다."],"a":0},{"q":"기관정비 작업 시 피스톤링의 이음 간극을 측정할 때 측정도구로 가장 알맞은 것은?","o":["마이크로미터","다이얼게이지","시크니스게이지","버니어캘리퍼스"],"a":2},{"q":"선반작업 시 안전수칙으로 틀린 것은?","o":["선반 위에 공구를 올려놓은 채 작업하지 않는다.","돌리개는 적당한 크기의 것을 사용한다.","공작물을 고정한 후 렌치 류는 제거해야 한다.","날 끝의 칩 제거는 손으로 한다."],"a":3},{"q":"수공구의 사용방법 중 잘못된 것은?","o":["공구를 청결한 상태에서 보관할 것","공구를 취급할 때에 올바른 방법으로 사용할 것","공구는 지정된 장소에 보관할 것","공구는 사용 전후 오일을 발라 둘 것"],"a":3},{"q":"단조작업의 일반적 안전사항으로 틀린 것은?","o":["해머작업을 할 때에는 주위 사람을 보면서 한다.","재료를 자를 때에는 정면에 서지 않아야 한다.","물품에 열이 있기 때문에 화상에 주의한다.","형(die) 공구류는 사용 전에 예열한다."],"a":0},{"q":"엔진작업에서 실린더 헤드볼트를 올바르게 풀어내는 방법은?","o":["반드시 토크렌치를 사용한다.","풀기 쉬운 것부터 푼다.","바깥쪽에서 안쪽을 향하여 대각선 방향으로 푼다.","시계방향으로 차례대로 푼다."],"a":2},{"q":"호이스트 사용시 안전사항 중 틀린 것은?","o":["규격이상의 하중을 걸지 않는다.","무게 중심 바로 위에서 달아 올린다.","사람이 짐에 타고 운반하지 않는다.","운반중에는 물건이 흔들리지 않도록 짐에 타고 운반한다."],"a":3}],"id":"p20"}]</script>
<script>
(function(){
"use strict";
var BANK=JSON.parse(document.getElementById('bank').textContent);
var SIZE=20, PASS=60, CIRC=['①','②','③','④'];
var app=document.getElementById('app'), homeBtn=document.getElementById('homeBtn');

/* 문제 고유번호: 파트id-순번 */
var ALL=[], byId={};
BANK.forEach(function(p){ p.qs.forEach(function(q,i){ q.id=p.id+'-'+i; q.part=p.name; byId[q.id]=q; }); });
(function(){ var seenKey={}; BANK.forEach(function(p){ p.qs.forEach(function(q){
  var k=(q.q+'|'+q.o.join('|')).replace(/\s+/g,''); if(!seenKey[k]){seenKey[k]=1; ALL.push(q);} }); }); })();
var ALLPART={id:'all',name:'전체 문제에서 무작위',qs:ALL};

/* 풀어 본 문제 기록 (없어도 동작) */
var mem={};
function loadSeen(pid){ if(mem[pid]) return mem[pid]; var a=[];
  try{ a=JSON.parse(localStorage.getItem('quiz-seen-'+pid)||'[]'); }catch(e){}
  if(!Array.isArray(a)) a=[]; mem[pid]=a; return a; }
function saveSeen(pid,a){ mem[pid]=a; try{ localStorage.setItem('quiz-seen-'+pid,JSON.stringify(a)); }catch(e){} }

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function partById(id){ if(id==='all') return ALLPART; for(var i=0;i<BANK.length;i++) if(BANK[i].id===id) return BANK[i]; return null; }
function scoreOf(c,t){ return t? Math.round(c/t*100):0; }

/* 새 문제 뽑기: 아직 안 푼 문제를 먼저, 다 풀었으면 기록을 비우고 처음부터 */
function drawNew(part){
  var seen=loadSeen(part.id), set={}; seen.forEach(function(id){set[id]=1;});
  var n=Math.min(SIZE,part.qs.length);
  var fresh=shuffle(part.qs.filter(function(q){return !set[q.id];}));
  var picked=fresh.slice(0,n);
  if(picked.length<n){
    var used={}; picked.forEach(function(q){used[q.id]=1;});
    var rest=shuffle(part.qs.filter(function(q){return !used[q.id];})).slice(0,n-picked.length);
    saveSeen(part.id,[]); picked=picked.concat(rest);
  }
  return shuffle(picked);
}

var S=null, timer=null;

/* 읽어 주기: 기기에 들어 있는 한국어 음성으로 문제와 보기를 읽는다 */
var canSpeak=('speechSynthesis' in window)&&('SpeechSynthesisUtterance' in window);
var autoRead=false; try{ autoRead=localStorage.getItem('quiz-tts')==='1'; }catch(e){}
function stopSpeak(){ if(canSpeak){ try{ window.speechSynthesis.cancel(); }catch(e){} } }
function speakQ(){
  if(!canSpeak||!S) return; stopSpeak();
  var q=S.qs[S.cur];
  var text='문제 '+(S.cur+1)+'번. '+q.q+' ';
  if(q.x) text+='보기. '+q.x.join('. ')+'. ';
  q.o.forEach(function(o,i){ text+=(i+1)+'번. '+o+'. '; });
  try{ var u=new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=0.95; window.speechSynthesis.speak(u); }catch(e){}
}

function home(){
  stopSpeak(); S=null; clearInterval(timer); homeBtn.hidden=true; app.textContent='';
  app.appendChild(el('p','lead','풀고 싶은 파트를 누르면 그 파트 문제은행에서 20문제를 무작위로 냅니다.'));
  var g0=el('div','parts'); g0.style.marginTop='14px'; g0.appendChild(card(ALLPART,true)); app.appendChild(g0);
  var groups=[]; BANK.forEach(function(p){ if(groups.indexOf(p.g)<0) groups.push(p.g); });
  groups.forEach(function(g){
    app.appendChild(el('h2',null,g));
    var grid=el('div','parts');
    BANK.filter(function(p){return p.g===g;}).forEach(function(p){ grid.appendChild(card(p,false)); });
    app.appendChild(grid);
  });
  window.scrollTo(0,0);
}
function card(p,all){
  var b=el('button','part'+(all?' all':'')); b.type='button';
  b.appendChild(el('span','nm',p.name));
  var seen=loadSeen(p.id).length, tot=p.qs.length;
  if(!all){ var bar=el('span','bar'); var i=el('i'); i.style.width=Math.min(100,seen/tot*100)+'%'; bar.appendChild(i); b.appendChild(bar); }
  var m=el('span','meta'); m.appendChild(el('span',null,'문제 '+tot+'개')); m.appendChild(el('span',null,'풀어 본 문제 '+seen)); b.appendChild(m);
  b.addEventListener('click',function(){ start(p,drawNew(p),'new'); });
  return b;
}

function start(part,qs,mode){
  S={part:part,qs:qs,ans:qs.map(function(){return null;}),cur:0,mode:mode,t0:Date.now(),warn:false};
  homeBtn.hidden=false;
  clearInterval(timer); timer=setInterval(tick,1000);
  renderQuiz(); window.scrollTo(0,0);
}
function fmt(ms){ var s=Math.floor(ms/1000), m=Math.floor(s/60); s=s%60; return (m<10?'0':'')+m+':'+(s<10?'0':'')+s; }
function tick(){ var t=document.getElementById('clock'); if(t&&S) t.textContent=fmt(Date.now()-S.t0); }

function renderQuiz(){
  var q=S.qs[S.cur], n=S.qs.length; app.textContent='';
  var st=el('div','status');
  var left=el('span'); left.appendChild(el('b',null,S.part.name)); left.appendChild(document.createTextNode(S.mode==='retry'?' · 틀린 문제 다시 풀기':'')); st.appendChild(left);
  var right=el('span','mono'); var done=S.ans.filter(function(a){return a!==null;}).length;
  right.appendChild(document.createTextNode('답한 문제 '+done+'/'+n+' · ')); var ck=el('span',null,fmt(Date.now()-S.t0)); ck.id='clock'; right.appendChild(ck); st.appendChild(right);
  app.appendChild(st);

  if(canSpeak){
    var tr=el('div','tts');
    var rb=el('button','ttsb','문제 읽어 주기'); rb.type='button'; rb.addEventListener('click',speakQ); tr.appendChild(rb);
    var ab=el('button','ttsb'+(autoRead?' on':''),autoRead?'자동으로 읽기 켜짐':'자동으로 읽기 꺼짐'); ab.type='button'; ab.setAttribute('aria-pressed',autoRead?'true':'false');
    ab.addEventListener('click',function(){ autoRead=!autoRead; try{ localStorage.setItem('quiz-tts',autoRead?'1':'0'); }catch(e){} if(autoRead){ S.lastRead=S.cur; renderQuiz(); speakQ(); } else { stopSpeak(); renderQuiz(); } });
    tr.appendChild(ab); app.appendChild(tr);
    if(autoRead&&S.lastRead!==S.cur){ S.lastRead=S.cur; speakQ(); }
  }
  var c=el('section','qcard');
  c.appendChild(el('div','qno','문제 '+(S.cur+1)+' / '+n+(S.part.id==='all'?'  ·  '+q.part:'')));
  c.appendChild(el('p','stem',q.q));
  if(q.x){ var bx=el('div','box'); q.x.forEach(function(l){bx.appendChild(el('p',null,l));}); c.appendChild(bx); }
  var os=el('div','opts');
  q.o.forEach(function(t,i){
    var b=el('button','opt'+(S.ans[S.cur]===i?' sel':'')); b.type='button'; b.setAttribute('aria-pressed',S.ans[S.cur]===i?'true':'false');
    b.appendChild(el('span','mk',String(i+1))); b.appendChild(el('span',null,t));
    b.addEventListener('click',function(){ stopSpeak(); S.ans[S.cur]=i; S.warn=false; renderQuiz(); });
    os.appendChild(b);
  });
  c.appendChild(os); app.appendChild(c);

  var nav=el('div','nav');
  var pv=el('button','btn ghost','이전 문제'); pv.type='button'; pv.disabled=S.cur===0; pv.addEventListener('click',function(){S.cur--;S.warn=false;renderQuiz();});
  nav.appendChild(pv);
  if(S.cur<n-1){ var nx=el('button','btn','다음 문제'); nx.type='button'; nx.addEventListener('click',function(){S.cur++;S.warn=false;renderQuiz();}); nav.appendChild(nx); }
  var sb=el('button','btn pri','답안 제출'); sb.type='button'; sb.addEventListener('click',trySubmit); nav.appendChild(sb);
  app.appendChild(nav);

  if(S.warn){
    var left2=S.ans.filter(function(a){return a===null;}).length;
    var w=el('div','notice'); w.setAttribute('role','alert');
    w.appendChild(el('div',null,'아직 답하지 않은 문제가 '+left2+'개 있습니다. 답하지 않은 문제는 틀린 것으로 채점합니다.'));
    var wn=el('div','nav');
    var go=el('button','btn','안 푼 문제로 가기'); go.type='button'; go.addEventListener('click',function(){ S.cur=S.ans.indexOf(null); S.warn=false; renderQuiz(); });
    var fin=el('button','btn pri','그대로 제출'); fin.type='button'; fin.addEventListener('click',grade);
    wn.appendChild(go); wn.appendChild(fin); w.appendChild(wn); app.appendChild(w);
  }

  app.appendChild(el('h2',null,'답안 표기란'));
  var om=el('div','omr');
  S.qs.forEach(function(_,i){
    var b=el('button',(S.ans[i]!==null?'done ':'')+(i===S.cur?'cur':''),String(i+1)); b.type='button';
    b.setAttribute('aria-label',(i+1)+'번 문제'+(S.ans[i]!==null?', 답함':', 답하지 않음'));
    b.addEventListener('click',function(){S.cur=i;S.warn=false;renderQuiz();}); om.appendChild(b);
  });
  app.appendChild(om);
}
function trySubmit(){ if(S.ans.indexOf(null)>=0 && !S.warn){ S.warn=true; renderQuiz(); var w=document.querySelector('.notice'); if(w&&w.scrollIntoView) w.scrollIntoView({block:'center'}); } else grade(); }

function grade(){
  stopSpeak(); clearInterval(timer);
  var n=S.qs.length, wrong=[], correct=0;
  S.qs.forEach(function(q,i){ if(S.ans[i]===q.a) correct++; else wrong.push(q); });
  if(S.mode==='new'){ var seen=loadSeen(S.part.id).slice(); S.qs.forEach(function(q){ if(seen.indexOf(q.id)<0) seen.push(q.id); }); saveSeen(S.part.id,seen); }
  S.res={correct:correct,wrong:wrong,score:scoreOf(correct,n),time:Date.now()-S.t0,filter:wrong.length?'wrong':'all'};
  renderResult(); window.scrollTo(0,0);
}

function renderResult(){
  var R=S.res, n=S.qs.length, pass=R.score>=PASS; app.textContent='';
  var st=el('div','status'); var l=el('span'); l.appendChild(el('b',null,S.part.name)); l.appendChild(document.createTextNode(S.mode==='retry'?' · 틀린 문제 다시 풀기 결과':' · 채점 결과')); st.appendChild(l);
  st.appendChild(el('span','mono','걸린 시간 '+fmt(R.time))); app.appendChild(st);

  var sc=el('section','score'+(pass?' pass':''));
  var big=el('div','big',String(R.score)); big.appendChild(el('small',null,'점')); sc.appendChild(big);
  var d=el('div'); d.appendChild(el('div','verdict',pass?'합격':'불합격'));
  d.appendChild(el('div','det',n+'문제 중 '+R.correct+'문제 정답, '+R.wrong.length+'문제 오답 · 합격 기준 '+PASS+'점'));
  sc.appendChild(d); app.appendChild(sc);

  var ac=el('div','actions');
  var b1=el('button','btn','틀린 문제 다시 풀기'+(R.wrong.length?' ('+R.wrong.length+'문제)':'')); b1.type='button'; b1.disabled=!R.wrong.length;
  b1.addEventListener('click',function(){ start(S.part,shuffle(R.wrong),'retry'); });
  var b2=el('button','btn pri','새로운 문제 풀기'); b2.type='button'; b2.addEventListener('click',function(){ start(S.part,drawNew(S.part),'new'); });
  var b3=el('button','btn ghost','다른 파트 고르기'); b3.type='button'; b3.addEventListener('click',home);
  ac.appendChild(b1); ac.appendChild(b2); ac.appendChild(b3); app.appendChild(ac);

  app.appendChild(el('h2',null,'정답 확인'));
  var om=el('div','omr'); om.style.marginBottom='14px';
  S.qs.forEach(function(q,i){ var ok=S.ans[i]===q.a; var b=el('button',ok?'ok':'no',String(i+1)); b.type='button';
    b.setAttribute('aria-label',(i+1)+'번 '+(ok?'정답':'오답'));
    b.addEventListener('click',function(){ if(!ok||R.filter==='all'){ var t=document.getElementById('rev'+i); if(t) t.scrollIntoView({block:'start'}); } else { R.filter='all'; renderResult(); var t2=document.getElementById('rev'+i); if(t2) t2.scrollIntoView({block:'start'}); } });
    om.appendChild(b); });
  app.appendChild(om);
  var tabs=el('div','tabs');
  [['wrong','틀린 문제만'],['all','전체 문제']].forEach(function(t){ var b=el('button',R.filter===t[0]?'on':'',t[1]); b.type='button'; b.setAttribute('aria-pressed',R.filter===t[0]?'true':'false');
    b.addEventListener('click',function(){R.filter=t[0];renderResult();}); tabs.appendChild(b); });
  app.appendChild(tabs);
  var shown=0;
  S.qs.forEach(function(q,i){
    var ok=S.ans[i]===q.a; if(R.filter==='wrong'&&ok) return; shown++;
    var r=el('article','rev'); r.id='rev'+i;
    var h=el('div','qno','문제 '+(i+1)+(S.part.id==='all'?'  ·  '+q.part:'')); h.appendChild(el('span','tag '+(ok?'ok':'no'),ok?'정답':(S.ans[i]===null?'답하지 않음':'오답'))); r.appendChild(h);
    r.appendChild(el('p','stem',q.q));
    if(q.x){ var bx=el('div','box'); q.x.forEach(function(x){bx.appendChild(el('p',null,x));}); r.appendChild(bx); }
    var ol=el('ol');
    q.o.forEach(function(t,k){ var li=el('li',k===q.a?'ans':(k===S.ans[i]?'mine':'')); li.appendChild(el('span','mk',CIRC[k])); li.appendChild(el('span',null,t));
      if(k===q.a) li.appendChild(el('span','lab','정답')); else if(k===S.ans[i]) li.appendChild(el('span','lab','내가 고른 답')); ol.appendChild(li); });
    r.appendChild(ol);
    if(q.e){
      var det=(typeof q.e==='string')?q.e:q.e.d;
      if(q.e.w){ var wx=el('div','exp wrong'); wx.appendChild(el('b',null,'[오답풀이]')); var wi=0;
        q.o.forEach(function(_,k){ if(k===q.a) return; var pw=el('p'); pw.appendChild(el('span','mk',CIRC[k]+' ')); pw.appendChild(document.createTextNode(q.e.w[wi]||'')); wi++; wx.appendChild(pw); });
        r.appendChild(wx); }
      var ex=el('div','exp'); ex.appendChild(el('b',null,'[문제해설]')); ex.appendChild(el('p',null,det)); r.appendChild(ex);
    }
    app.appendChild(r);
  });
  if(!shown) app.appendChild(el('p','lead','틀린 문제가 없습니다. 모두 맞혔습니다.'));
}

homeBtn.addEventListener('click',home);
/* 주소 끝에 #p03 처럼 파트 번호를 붙이면 그 파트로 바로 시작 */
function fromHash(){ var id=(location.hash||'').replace('#',''); var p=id&&partById(id); if(p){ start(p,drawNew(p),'new'); return true; } return false; }
window.addEventListener('hashchange',function(){ if(!fromHash()&&!location.hash) home(); });
if(!fromHash()) home();
})();
</script>
