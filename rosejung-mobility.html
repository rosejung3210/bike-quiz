q":"전기 이륜자동차의 주행 모터에서 비정상적인 소음이나 진동이 발생할 때, 의심할 수 있는 원인으로 거리가 먼 것은?","o":["모터 내부 베어링 손상","브러시리스 모터의 브러시 마모","모터 내부 코일 단락 또는 단선","모터 고정 볼트 풀림"],"a":1,"e":{"w":["베어링이 손상되면 소음과 진동이 납니다.","코일이 단락되거나 끊어지면 회전이 고르지 않아 진동이 납니다.","고정 볼트가 풀리면 진동이 납니다."],"d":"브러시리스(BLDC) 모터에는 브러시가 없습니다. 없는 부품이 닳을 수는 없으므로 브러시 마모는 원인이 될 수 없습니다."}},{"q":"모터의 효율에 영향을 미치는 요인이 아닌 것은?","o":["모터의 설계 및 재료","주변 소음 수준","운전 온도","모터 컨트롤러의 제어 방식"],"a":1,"e":{"w":["설계와 재료는 효율에 영향을 줍니다.","운전 온도는 효율에 영향을 줍니다.","제어 방식은 효율에 영향을 줍니다."],"d":"모터의 효율은 설계와 재료, 온도, 제어 방식에 따라 달라집니다. 주변이 시끄러운지는 효율과 아무 관계가 없습니다."}},{"q":"BLDC 모터를 구동할 때, 모터 컨트롤러와 함께 반드시 필요한 센서는?","o":["온도 센서","홀 센서","압력 센서","습도 센서"],"a":1,"e":{"w":["온도 센서는 온도를 감지합니다.","압력 센서는 압력을 감지합니다.","습도 센서는 습도를 감지합니다."],"d":"BLDC 모터는 회전자의 위치에 맞춰 코일에 전류를 보내야 합니다. 회전자의 위치를 알려 주는 홀 센서가 반드시 필요합니다."}},{"q":"차대번호에서 제조 연도를 나타내는 자리는?","o":["마지막 8자리","첫 3자리","4~9번째 자리","10번째 자리"],"a":3,"e":{"w":["마지막 8자리는 제작일련번호군(VIS) 전체입니다.","첫 3자리는 세계 제조사 식별 코드(WMI)입니다.","4~9번째 자리는 차량 특성 표기(VDS)입니다."],"d":"차대번호의 10번째 자리가 제작 연도를 나타냅니다. 11번째는 공장, 12~17번째는 제작 일련번호입니다."}},{"q":"이륜자동차 정기 검사에서 관능검사에 대한 내용 중 틀린 것은?","o":["검사관이 시각 등을 활용하는 육안 검사","검사관이 첨단장비로 확인하는 검사","검사관이 청각 등을 활용하는 육안 검사","검사관이 촉각 등을 활용하는 육안 검사"],"a":1,"e":{"w":["눈으로 확인하는 것은 관능검사입니다.","귀로 확인하는 것은 관능검사입니다.","손으로 만져 확인하는 것은 관능검사입니다."],"d":"관능검사는 검사관이 시각, 청각, 촉각 같은 감각으로 하는 검사입니다. 첨단장비로 확인하는 것은 기기 검사입니다."}},{"q":"이륜자동차 검사 시, 배출가스 검사에서 주로 측정하는 유해 물질은?","o":["산소(O2)와 수증기(H2O)","일산화탄소(CO), 탄화수소(HC)","오존(O3), 수증기(H2O)","황산화물(SOx), 질소(N2)"],"a":1,"e":{"w":["산소와 수증기는 유해 물질이 아닙니다.","오존과 수증기는 측정 항목이 아닙니다.","질소는 유해 물질이 아닙니다."],"d":"배출가스 검사에서는 불완전 연소 때 나오는 일산화탄소(CO)와 타지 않은 연료 성분인 탄화수소(HC)를 주로 측정합니다."}},{"q":"정기검사 시 주로 확인하는 항목이 아닌 것은?","o":["운전자의 시력 및 청력","배기소음, 경적 소음","배출가스(일산화탄소, 탄화수소)","차량의 외관 및 주요 장치 상태 육안 검사"],"a":0,"e":{"w":["배기소음과 경적 소음은 확인 항목입니다.","배출가스는 확인 항목입니다.","외관과 주요 장치의 상태는 확인 항목입니다."],"d":"정기검사는 차의 상태를 검사합니다. 운전자의 시력과 청력은 차의 상태가 아니므로 검사 항목이 아닙니다."}},{"q":"이륜자동차 구조변경 후 구조변경 검사를 받는 목적은?","o":["변경된 이륜자동차의 최대 성능을 확인하기 위해","변경된 부품의 출처를 확인하기 위해","변경된 구조 및 장치가 안전기준에 적합한지 확인하기 위해","변경된 이륜자동차의 승차감을 확인하기 위해"],"a":2,"e":{"w":["최대 성능을 확인하려는 것이 아닙니다.","부품의 출처를 확인하려는 것이 아닙니다.","승차감을 확인하려는 것이 아닙니다."],"d":"구조변경 검사는 바꾼 구조와 장치가 안전기준에 맞는지 확인하기 위한 것입니다."}},{"q":"이륜자동차 불법 구조변경에 대한 신고 및 단속 기관은 어디인가?","o":["경찰청 및 한국교통안전공단","소방서","법원","주민센터"],"a":0,"e":{"w":["소방서는 단속 기관이 아닙니다.","법원은 단속 기관이 아닙니다.","주민센터는 단속 기관이 아닙니다."],"d":"불법 구조변경은 경찰청과 한국교통안전공단이 신고를 받고 단속합니다."}},{"q":"전기 시스템 점검 시 감전사고 예방을 위해 가장 먼저 해야 할 일은?","o":["엔진을 시동시킨다.","전선 피복을 제거한다.","전류를 측정한다.","배터리의 (-)단자를 분리한다."],"a":3,"e":{"w":["시동을 걸면 전기가 흐릅니다.","피복을 벗기면 감전 위험이 커집니다.","전류 측정이 먼저가 아닙니다."],"d":"전기 시스템을 점검하기 전에 배터리의 (-)단자를 분리해 전원을 끊으면 감전과 합선을 막을 수 있습니다."}},{"q":"이륜자동차 엔진 시동 시 점검할 때의 안전수칙은?","o":["주변에 인화성 물질을 두고 시동을 건다.","엔진 시동 전에는 주변에 인화성 물질이 있는지 확인한다.","엔진은 밀폐된 공간에서만 시동을 건다.","엔진을 탈거한 후 시동을 걸어 점검한다."],"a":1,"e":{"w":["인화성 물질을 두고 시동을 걸면 화재 위험이 있습니다.","밀폐된 공간에서는 배기가스에 중독됩니다.","엔진을 떼어 내고 시동을 걸지 않습니다."],"d":"시동을 걸면 불꽃과 뜨거운 배기가스가 생깁니다. 시동 전에 주변에 인화성 물질이 없는지 확인해야 합니다."}},{"q":"다음 용어들에 대한 설명 중 틀린 것은?","o":["행정(L) : 상사점과 하사점 사이의 거리","상사점(TDC) : 피스톤이 맨 위로 올라갔을 때 지점","보어(D) : 실린더 안지름","행정체적(Vs) : 피스톤이 상사점에 있을 때 실린더 헤드까지의 공간"],"a":3,"e":{"w":["행정은 상사점과 하사점 사이의 거리입니다. 옳은 설명입니다.","상사점은 피스톤이 맨 위로 올라갔을 때의 지점입니다. 옳은 설명입니다.","보어는 실린더의 안지름입니다. 옳은 설명입니다."],"d":"행정체적은 피스톤이 상사점에서 하사점까지 움직이며 지나가는 체적입니다. 피스톤이 상사점에 있을 때 헤드까지의 공간은 연소실 체적이므로 ④가 틀렸습니다."}},{"q":"장행정 기관에 대한 설명으로 틀린 것은?","o":["폭발력과 배기량이 크다.","회전력이 크고, 피스톤 측압이 작다.","엔진회전속도가 느리고 회전력이 크다.","흡입밸브의 직경을 크게 해야 한다."],"a":3,"e":{"w":["행정이 길어 폭발력과 배기량이 큽니다. 옳은 설명입니다.","회전력이 크고 측압이 작습니다. 옳은 설명입니다.","회전속도는 느리지만 회전력이 큽니다. 옳은 설명입니다."],"d":"장행정 기관은 보어가 작아 밸브를 크게 만들 공간이 없습니다. 흡입밸브를 크게 해야 한다는 것은 단행정 기관의 특징이므로 ④가 틀렸습니다."}},{"q":"피스톤 링 앤드갭은 주로 어떤 링에 의해 가장 큰 영향을 받는가?","o":["최상단 압축 링","오일 링","중간 압축 링","스크레이퍼 링"],"a":0,"e":{"w":["오일 링은 오일 제어가 주된 역할입니다.","중간 압축 링은 최상단 링보다 영향이 작습니다.","스크레이퍼 링은 오일을 긁어내리는 링입니다."],"d":"최상단 압축 링은 연소실에 가장 가까워 폭발 압력과 열을 가장 크게 받습니다. 그래서 엔드갭의 영향을 가장 크게 받습니다."}},{"q":"피스톤 링 앤드갭이 너무 클 때 발생할 수 있는 주요 문제점은?","o":["밸브 고착 현상","오일 소모량 증가","엔진 과열","커넥팅로드 고착"],"a":1,"e":{"w":["밸브 고착과는 관계가 없습니다.","과열이 주된 문제는 아닙니다.","커넥팅로드 고착과는 관계가 없습니다."],"d":"엔드갭이 너무 크면 그 틈으로 압축가스가 새고, 오일이 연소실로 올라가 함께 타므로 오일 소모가 늘어납니다."}},{"q":"밸브 오버랩일 때, 흡기밸브와 배기밸브의 상태는?","o":["피스톤이 상사점인 지점에서 흡기밸브와 배기밸브가 열린 상태","피스톤이 상사점인 지점에서 흡기밸브와 배기밸브가 닫힌 상태","피스톤이 상사점인 지점에서 흡기밸브가 열린 상태","피스톤이 상사점인 지점에서 배기밸브가 열린 상태"],"a":0,"e":{"w":["둘 다 닫힌 상태는 압축행정이나 폭발행정입니다.","흡기밸브만 열린 상태는 흡입행정입니다.","배기밸브만 열린 상태는 배기행정입니다."],"d":"밸브 오버랩은 배기행정 끝과 흡입행정 시작이 겹치는 상사점 부근에서 흡기밸브와 배기밸브가 동시에 열려 있는 상태입니다. 배기가스가 빠져나가는 흐름으로 새 혼합기를 끌어들입니다.","g":"overlap"}},{"q":"엔진 정비 시 볼트 풀림 방지제를 사용하는 이유는?","o":["볼트의 수명을 길게 하기 위해","볼트가 풀리는 것을 방지하기 위해","볼트의 무게를 줄이기 위해","볼트의 길이를 조절하기 위해"],"a":1,"e":{"w":["수명을 늘리려는 것이 아닙니다.","무게와는 관계가 없습니다.","길이와는 관계가 없습니다."],"d":"엔진은 진동이 심해 볼트가 풀리기 쉽습니다. 풀림 방지제를 나사에 바르면 굳으면서 볼트가 풀리는 것을 막아 줍니다."}},{"q":"오토바이 엔진의 에어클리너(흡기 필터)가 오염되거나 막혔을 때 발생할 수 있는 현상으로 거리가 먼 것은?","o":["엔진 출력이 저하된다.","연료 소비 효율(연비)이 나빠진다.","엔진 오일의 압력이 높아진다.","불완전 연소로 인해 배출가스 농도가 짙어질 수 있다."],"a":2,"e":{"w":["공기가 부족해 출력이 떨어집니다. 맞는 현상입니다.","혼합기가 진해져 연비가 나빠집니다. 맞는 현상입니다.","불완전 연소로 배출가스가 짙어집니다. 맞는 현상입니다."],"d":"에어클리너가 막히면 공기가 부족해 출력이 떨어지고 연비가 나빠지며 배출가스가 짙어집니다. 엔진 오일의 압력과는 관계가 없습니다."}},{"q":"흡기 다기관(Intake Manifold) 진공도 시험 시, 진공계의 지침이 많이 흔들리는 원인으로 적절하지 않은 것은?","o":["밸브 간극 조정 불량","기화기(또는 연료 분사장치) 공전 혼합비 부적당","실린더 압축 불균일","압축이 지나치게 높아 엔진이 무거운 경우"],"a":3,"e":{"w":["밸브 간극이 맞지 않으면 진공이 흔들립니다.","공전 혼합비가 맞지 않으면 연소가 고르지 않아 진공이 흔들립니다.","실린더마다 압축이 다르면 진공이 흔들립니다."],"d":"진공계의 바늘이 많이 흔들리는 것은 실린더마다 흡입 상태가 고르지 않기 때문입니다. 압축이 높아 엔진이 무거운 것은 바늘이 흔들리는 원인이 아닙니다."}},{"q":"다음 중 삼원촉매장치의 기능에 대한 설명으로 바르지 않은 것은?","o":["CO, HC는 CO2로 산화시킨다.","공연비에 가까워 질수록 촉매의 성능이 향상된다.","NOx는 이산화질소(NO2)로 환원된다.","벌집모양의 세라믹 촉매는 백금과 로듐으로 구성되어 있다."],"a":2,"e":{"w":["CO와 HC는 산화되어 CO₂와 물이 됩니다. 옳은 설명입니다.","이론 공연비에 가까울수록 정화 성능이 좋습니다. 옳은 설명입니다.","벌집 모양 세라믹에 백금과 로듐 등을 입힙니다. 옳은 설명입니다."],"d":"삼원촉매는 CO와 HC를 산화시키고, NOx는 산소를 떼어 내 질소(N₂)로 환원시킵니다. 이산화질소(NO₂)로 환원된다는 ③이 틀렸습니다."}},{"q":"기화기 청소 시 주의해야 할 점은?","o":["강한 산성 세척액을 사용한다.","제트나 통로를 뾰족한 금속 도구로 쑤셔 청소한다.","부품을 분실하지 않도록 정리하고, 손상되지 않도록 조심한다.","물로 깨끗하게 닦는다."],"a":2,"e":{"w":["강한 산성 세척액은 부품을 부식시킵니다.","금속 도구로 쑤시면 제트 구멍이 넓어져 혼합비가 달라집니다.","물로 닦으면 녹이 슬고 물이 남습니다."],"d":"기화기에는 작은 부품이 많고 제트 구멍이 정밀합니다. 부품을 잃어버리지 않게 정리하고, 손상되지 않도록 전용 세척제와 압축 공기로 청소합니다."}},{"q":"이륜자동차 기계식 연료 펌프에서 연료필터가 막혔을 때 발생하는 주된 문제는?","o":["스파크 플러그 점화 불량","엔진으로의 연료 공급량 감소","배기가스 온도 상승","클러치 미끄러짐"],"a":1,"e":{"w":["점화 불량은 점화 계통의 문제입니다.","배기가스 온도와는 직접 관계가 없습니다.","클러치와는 관계가 없습니다."],"d":"연료필터가 막히면 연료가 지나가지 못해 엔진으로 가는 연료의 양이 줄어듭니다. 출력이 떨어지고 심하면 시동이 꺼집니다."}},{"q":"이륜자동차 수랭식 엔진에서 라디에이터의 가장 중요한 역할은?","o":["엔진 오일을 냉각시킨다.","연료를 냉각시킨다.","냉각수를 외부 공기와 접촉시켜 온도를 낮춘다.","배기가스를 냉각시킨다."],"a":2,"e":{"w":["엔진 오일은 오일 쿨러가 식힙니다.","연료를 식히는 장치가 아닙니다.","배기가스를 식히는 장치가 아닙니다."],"d":"라디에이터는 엔진에서 뜨거워진 냉각수를 가는 관으로 흘려 보내면서 바깥 공기와 닿게 해 온도를 낮춥니다."}},{"q":"실린더 블록 내의 냉각수 통로의 주된 역할은?","o":["냉각수가 순환하는 통로를 제공한다.","엔진 오일이 순환하는 통로를 제공한다.","연료가 순환하는 통로를 제공한다.","배기가스가 순환하는 통로를 제공한다."],"a":0,"e":{"w":["엔진 오일은 오일 통로로 흐릅니다.","연료는 연료 라인으로 흐릅니다.","배기가스는 배기 통로로 나갑니다."],"d":"실린더 둘레에는 냉각수가 흐르는 통로(워터 재킷)가 있습니다. 냉각수가 이 통로를 돌면서 실린더의 열을 빼앗아 갑니다."}},{"q":"ECU가 제어하는 주요 부품이 아닌 것은?","o":["연료 인젝터","브레이크 패드","아이들 스피드 컨트롤 밸브","점화 코일"],"a":1,"e":{"w":["연료 인젝터는 ECU가 분사 시간을 제어합니다.","아이들 스피드 컨트롤 밸브는 ECU가 제어합니다.","점화 코일은 ECU가 점화 시기를 제어합니다."],"d":"ECU는 연료 분사, 점화 시기, 공회전 속도 같은 엔진의 작동을 제어합니다. 브레이크 패드는 마찰재일 뿐 제어 대상이 아닙니다."}},{"q":"이륜자동차 전자제어 엔진에서 흡기압력 센서와 흡기온도 센서의 역할은?","o":["엔진 충격을 측정한다.","공기압력 또는 흡기 공기의 온도를 측정한다.","냉각수 온도를 측정한다.","엔진 오일 압력을 측정한다."],"a":1,"e":{"w":["엔진의 충격(노킹)은 노크 센서가 감지합니다.","냉각수 온도는 수온 센서가 측정합니다.","오일 압력은 오일 압력 스위치가 감지합니다."],"d":"흡기압력 센서는 흡기관의 압력을, 흡기온도 센서는 들어오는 공기의 온도를 측정합니다. ECU는 이 값으로 공기량을 계산해 연료 분사량을 정합니다."}},{"q":"내연기관 이륜자동차에서 시동 시 배터리 전압 강하가 너무 심하게 발생할 때, 확인해야 할 점은?","o":["시동 모터의 과부하","연료 필터 막힘","에어 필터 오염","브레이크 레버 유격"],"a":0,"e":{"w":["연료 필터는 연료 계통이라 전압 강하와 관계가 없습니다.","에어 필터는 흡기 계통이라 전압 강하와 관계가 없습니다.","브레이크 레버 유격은 관계가 없습니다."],"d":"시동 모터는 이륜자동차에서 전류를 가장 많이 쓰는 부품입니다. 시동 모터 내부가 손상되거나 엔진이 잘 돌지 않아 모터에 과부하가 걸리면 전류가 지나치게 많이 흘러 배터리 전압이 크게 떨어집니다."}},{"q":"전기 이륜자동차의 충전 시스템에서 접지가 중요한 이유는?","o":["충전 시간을 단축하기 위해","배터리 용량을 늘리기 위해","감전 사고를 예방하기 위해","모터의 출력을 높이기 위해"],"a":2,"e":{"w":["접지는 충전 시간과 관계가 없습니다.","접지는 배터리 용량과 관계가 없습니다.","접지는 모터 출력과 관계가 없습니다."],"d":"접지는 새어 나온 전기를 땅으로 흘려보내는 길입니다. 접지가 되어 있으면 누전이 되어도 사람 몸으로 전기가 흐르지 않아 감전 사고를 막을 수 있습니다."}},{"q":"엔진에서 실제로 불꽃을 발생시켜 혼합 가스를 점화시키는 최종 부품은?","o":["연료 인젝터","점화플러그","점화코일","CDI 유닛"],"a":1,"e":{"w":["연료 인젝터는 연료를 분사하는 부품입니다.","점화코일은 높은 전압을 만드는 부품입니다.","CDI 유닛은 점화 시기를 제어하고 점화코일에 전기를 보내는 부품입니다."],"d":"점화 계통은 배터리 → CDI(또는 ECU) → 점화코일 → 점화플러그 순서로 이어집니다. 마지막에 실제로 불꽃을 튀기는 부품은 점화플러그입니다."}},{"q":"이륜자동차의 방향지시등 스위치가 고장 났을 때, 발생할 수 있는 현상은?","o":["방향지시등이 계속 켜져 있다.","엔진 시동이 불가능하다.","브레이크 등이 함께 켜진다.","방향지시등이 아예 작동하지 않거나 한쪽만 작동한다."],"a":3,"e":{"w":["계속 켜져 있는 것은 릴레이나 배선 쪽 문제에 가깝습니다.","방향지시등 스위치는 시동 회로와 관계가 없습니다.","브레이크등은 다른 회로입니다."],"d":"방향지시등 스위치는 좌우 회로를 골라 이어 주는 부품입니다. 스위치 접점이 고장 나면 양쪽이 모두 작동하지 않거나, 한쪽 접점만 살아 있어 한쪽만 작동합니다."}},{"q":"임의의 한 점을 통과하는 전하의 양을 나타내는 단위는?","o":["전류","전압","전자","저항"],"a":0,"e":{"w":["전압은 전기를 밀어내는 압력입니다. 단위는 볼트(V)입니다.","전자는 전기를 띤 입자이지 단위가 아닙니다.","저항은 전기의 흐름을 방해하는 정도입니다. 단위는 옴(Ω)입니다."],"d":"전류는 도선의 한 점을 1초 동안 지나가는 전하의 양입니다. 단위는 암페어(A)를 씁니다."}},{"q":"교류전기에 대한 설명으로 틀린 것은?","o":["시간의 경과에 대해 전압이 변화한다.","시간의 경과에 대해 전류가 변화한다.","시간의 경과에 대해 전류의 방향이 변화한다.","시간의 경과와 상관없이 전류의 방향은 일정하다."],"a":3,"e":{"w":["교류는 시간에 따라 전압의 크기가 변합니다. 옳은 설명입니다.","교류는 시간에 따라 전류의 크기가 변합니다. 옳은 설명입니다.","교류는 시간에 따라 전류의 방향이 바뀝니다. 옳은 설명입니다."],"d":"교류(AC)는 시간에 따라 크기와 방향이 주기적으로 바뀌는 전기입니다. 방향이 일정한 것은 직류(DC)이므로 ④가 틀렸습니다."}},{"q":"이륜자동차 주행 중 휠 또는 타이어에 이상이 느껴질 때 운전자의 올바른 대처 방법은?","o":["즉시 급제동하여 멈춘다.","속도를 높여 가까운 정비소로 빠르게 이동한다.","비상등을 켜고 서서히 감속하며 안전한 장소로 이동 후 점검한다.","핸들을 좌우로 강하게 꺾어 균형을 맞춘다."],"a":2,"e":{"w":["급제동하면 바퀴가 잠겨 넘어질 수 있습니다.","이상이 있는데 속도를 높이면 사고 위험이 커집니다.","핸들을 강하게 꺾으면 균형을 잃습니다."],"d":"휠이나 타이어에 이상이 느껴지면 급한 조작을 하지 않습니다. 비상등을 켜서 뒤차에 알리고, 서서히 속도를 줄여 안전한 곳에 세운 뒤 점검합니다."}},{"q":"이륜자동차의 조향장치가 비정상적으로 한쪽으로 치우쳐 있다면, 무엇을 의심해야 하는가?","o":["엔진의 압축 압력이 낮다.","연료량이 부족하다.","브레이크 오일이 부족하다.","프론트 포크의 휨 또는 스티어링 헤드 베어링 불량"],"a":3,"e":{"w":["압축 압력은 엔진 성능과 관계가 있습니다.","연료량은 조향과 관계가 없습니다.","브레이크 오일은 제동과 관계가 있습니다."],"d":"조향장치가 한쪽으로 치우치는 것은 앞바퀴를 잡고 있는 부품이 틀어졌기 때문입니다. 프론트 포크가 휘었거나 스티어링 헤드 베어링이 불량한지 의심합니다."}},{"q":"이륜자동차 브레이크를 잡을 때, 제동력을 발생시키는 부품은 어느 것인가?","o":["브레이크 패드, 디스크 로터","핸들","발전기","변속기"],"a":0,"e":{"w":["핸들은 조향장치입니다.","발전기는 전기를 만드는 장치입니다.","변속기는 동력전달장치입니다."],"d":"브레이크를 잡으면 패드가 바퀴와 함께 도는 디스크 로터를 양쪽에서 꽉 눌러 줍니다. 이때 생기는 마찰력이 제동력입니다."}},{"q":"이륜자동차 클러치 레버의 유격이 너무 적을 때 발생할 수 있는 현상은?","o":["클러치 디스크의 수명이 짧아진다.","기어 변속이 더 어려워진다.","변속기어 마모가 심하다.","클러치 레버의 수명이 짧아진다."],"a":0,"e":{"w":["변속이 어려워지는 것은 유격이 너무 클 때입니다.","변속기어 마모는 클러치가 잘 끊기지 않을 때 생깁니다.","레버의 수명과는 관계가 없습니다."],"d":"유격이 너무 적으면 레버를 놓아도 클러치가 완전히 붙지 않습니다. 클러치가 계속 조금씩 미끄러지면서 열이 나고 닳아 클러치 디스크의 수명이 짧아집니다."}},{"q":"이륜자동차 변속기 내부의 기어 이빨이 손상되었을 때 발생할 수 있는 현상 중 가장 적합한 것은?","o":["클러치 레버 작동 불량","변속 시 소음 또는 기어 건너뛰기 현상","클러치의 과대 마모","클러치 스프링 파손"],"a":1,"e":{"w":["클러치 레버는 변속기 밖의 조작 장치입니다.","클러치 마모는 기어 이빨과 관계가 없습니다.","클러치 스프링은 클러치 부품입니다."],"d":"기어 이빨이 손상되면 맞물림이 고르지 않아 변속할 때 소음이 납니다. 힘이 걸리면 맞물림이 풀려 기어가 빠지거나 건너뛰기도 합니다."}},{"q":"자동변속기에서 엔진과 변속기 사이에 직접적인 기계적 연결 없이 동력을 전달하는 원리는?","o":["마찰력","원심력","유체 커플링","스프링의 탄성"],"a":2,"e":{"w":["마찰력으로 전달하는 것은 마찰 클러치입니다.","원심력을 이용하는 것은 원심 클러치입니다.","스프링의 탄성은 동력을 전달하는 원리가 아닙니다."],"d":"유체 커플링(토크 컨버터)은 엔진 쪽 날개가 오일을 돌리고, 그 오일의 흐름이 변속기 쪽 날개를 돌립니다. 기계적으로 직접 이어지지 않고 오일로 동력을 전달합니다."}},{"q":"자동변속기에서 변속 시점을 결정하는 데 필요한 엔진 부하 정보를 제공하는 것은?","o":["오일펌프","스로틀 포지션센서","밸브 바디","토크 컨버터"],"a":1,"e":{"w":["오일펌프는 변속기에 유압을 만들어 주는 부품입니다.","밸브 바디는 유압의 통로를 바꾸어 변속을 실행하는 부품입니다.","토크 컨버터는 오일로 엔진의 동력을 변속기에 전달하는 부품입니다."],"d":"스로틀 포지션센서는 스로틀이 열린 정도를 감지합니다. 스로틀이 많이 열릴수록 엔진 부하가 큰 것입니다. 변속기 제어 유닛은 이 엔진 부하 정보와 차량의 속도를 함께 보고 변속 시점을 결정합니다."}},{"q":"이륜자동차 프론트 스프로킷의 잇수를 늘리면(리어 스프로킷 잇수 고정), 이륜자동차의 주행 특성은 어떻게 변하는가?","o":["가속력이 좋아진다.","같은 속도에서 엔진 회전수가 높아진다.","같은 속도에서 엔진 회전수가 낮아진다.","연비가 나빠진다."],"a":2,"e":{"w":["감속비가 작아져 가속력은 오히려 떨어집니다.","회전수는 낮아집니다.","엔진 회전수가 낮아져 연비는 보통 좋아집니다."],"d":"감속비 = 리어 스프로킷 잇수 ÷ 프론트 스프로킷 잇수입니다. 프론트 잇수를 늘리면 감속비가 작아집니다. 가속력은 줄지만 같은 속도에서 엔진 회전수가 낮아집니다.","g":"ratio"}},{"q":"이륜자동차 체인 장력 조절 시, 주의해야 할 사항은?","o":["체인을 최대한 팽팽하게 조절해야 한다.","체인을 규정 유격으로 확인하고 조절해야 한다.","체인장력 조절은 한쪽 조절 너트만 팽팽하게 조절해야 한다.","체인 커버를 제거하지 않고 조절한다."],"a":1,"e":{"w":["너무 팽팽하면 체인과 베어링이 빨리 닳고 체인이 끊어질 수 있습니다.","한쪽만 조절하면 뒷바퀴가 틀어집니다. 좌우를 같은 양만큼 조절합니다.","체인 커버는 장력 조절의 주의사항이 아닙니다."],"d":"체인은 처진 양(유격)이 정비지침서에 정해진 범위에 들어오도록 조절합니다. 너무 팽팽해도, 너무 느슨해도 안 됩니다."}},{"q":"이륜자동차 ABS 시스템이 작동할 때, 브레이크 라인의 유압을 순간적으로 감소시켰다가 다시 증가시키는 역할을 하는 것은?","o":["브레이크 패드","ABS 모듈레이터","브레이크 레버","휠 속도 센서"],"a":1,"e":{"w":["브레이크 패드는 디스크를 눌러 마찰을 만드는 부품입니다.","브레이크 레버는 운전자가 조작하는 부품입니다.","휠 속도 센서는 바퀴의 회전 속도를 감지하는 부품입니다."],"d":"ABS 모듈레이터(유압 조절 장치)는 컨트롤 유닛의 신호를 받아 밸브를 열고 닫습니다. 유압을 줄였다가 다시 높이기를 빠르게 되풀이해 바퀴가 잠기지 않게 합니다."}},{"q":"이륜자동차 ABS 경고등이 점등되었을 때, 가장 먼저 점검해야 할 센서는?","o":["휠 스피드 센서","브레이크 패드 마모 센서","흡입공기량 센서","차고 센서"],"a":0,"e":{"w":["패드 마모 센서는 ABS 경고등과 관계가 없습니다.","흡입공기량 센서는 엔진 제어용입니다.","차고 센서는 차체 높이를 감지하는 센서입니다."],"d":"ABS는 휠 스피드 센서의 신호로 바퀴가 잠기는지 판단합니다. 이 센서나 배선에 이상이 있으면 경고등이 켜지므로 가장 먼저 점검합니다."}},{"q":"ABS 컨트롤 유닛(제어모듈)에 대한 설명으로 틀린 것은?","o":["휠의 감속 가속을 계산한다.","각 바퀴의 속도를 비교, 분석한다.","미끄러짐 비율을 계산하여 ABS 작동 여부를 결정한다.","컨트롤 유닛이 작동하지 않으면 브레이크가 전혀 작동하지 않는다."],"a":3,"e":{"w":["휠 속도 신호로 바퀴의 감속과 가속을 계산합니다. 옳은 설명입니다.","각 바퀴의 속도를 비교하고 분석합니다. 옳은 설명입니다.","미끄러짐 비율(슬립률)을 계산해 ABS를 작동할지 결정합니다. 옳은 설명입니다."],"d":"ABS가 고장 나도 일반 브레이크는 그대로 작동합니다. ABS 기능만 멈추고 경고등이 켜집니다. 브레이크가 전혀 작동하지 않는다는 ④가 틀렸습니다."}},{"q":"ABS와 TCS(Traction Control System)에 대한 설명으로 틀린 것은?","o":["TCS는 구동륜이 슬립하는 현상을 방지한다.","ABS는 주행 중 제동 시 타이어의 록(Lock)을 방지한다.","ABS는 제동 시 조향 안전성 확보를 위한 시스템이다.","TCS는 급제동시 제동력 제어를 통해 차량 스핀 현상을 방지한다."],"a":3,"e":{"w":["TCS는 구동 바퀴가 헛도는 것을 막습니다. 옳은 설명입니다.","ABS는 제동할 때 바퀴가 잠기는 것을 막습니다. 옳은 설명입니다.","ABS는 제동 중 조향 안정성을 확보합니다. 옳은 설명입니다."],"d":"TCS는 출발하거나 가속할 때 구동 바퀴가 헛도는 것을 막는 장치입니다. 급제동 때 제동력을 제어하는 것은 ABS의 역할이므로 ④가 틀린 설명입니다."}},{"q":"이륜자동차 TPMS 센서의 전원 공급 방식은?","o":["발전기에서 직접 전원을 공급받는다.","이륜자동차 배터리에서 전원을 공급받는다.","센서 내부에 내장된 배터리에서 전원을 공급받는다.","전원을 공급받지 않아도 된다."],"a":2,"e":{"w":["바퀴는 계속 돌기 때문에 발전기에서 전선을 이을 수 없습니다.","도는 바퀴 안의 센서에 배터리 전선을 이을 수 없습니다.","센서와 송신기가 작동하려면 전원이 필요합니다."],"d":"TPMS 센서는 휠 안쪽에 달려 바퀴와 함께 돕니다. 전선을 이을 수 없으므로 센서 안에 들어 있는 작은 배터리로 작동하고, 측정값은 무선으로 보냅니다."}},{"q":"이륜자동차 시트 히팅 시스템에서 운전자가 원하는 온도를 설정하고, 시스템의 작동을 ON, OFF하는 것은?","o":["히터 컨트롤러","에어컨 스위치","시트 컨트롤러","오디오 컨트롤러"],"a":2,"e":{"w":["히터 컨트롤러는 시트 히팅 시스템의 조작 장치 이름이 아닙니다.","에어컨 스위치는 시트 열선과 관계가 없습니다.","오디오 컨트롤러는 음향 장치를 조작합니다."],"d":"시트 히팅 시스템은 발열선, 온도 센서, 시트 컨트롤러로 이루어집니다. 원하는 온도를 정하고 켜고 끄는 일은 시트 컨트롤러가 맡습니다."}},{"q":"이륜자동차 크루즈 시스템 중, 앞차와의 거리를 자동으로 조절하며 설정 속도를 유지하는 기능은?","o":["어댑티브 크루즈 컨트롤","일반 크루즈 컨트롤","수동 크루즈 컨트롤","자동 정지 시스템"],"a":0,"e":{"w":["일반 크루즈 컨트롤은 설정 속도만 유지합니다.","수동 크루즈 컨트롤이라는 기능은 없습니다.","자동 정지 시스템은 다른 기능입니다."],"d":"어댑티브 크루즈 컨트롤(ACC)은 레이더로 앞차와의 거리를 재서, 거리를 유지하도록 속도를 자동으로 줄이거나 높입니다."}},{"q":"이륜자동차 디스플레이 모니터의 방수 및 방진 기능이 중요한 이유는?","o":["모니터의 밝기를 향상시킨다.","모니터의 색상을 향상시킨다.","내구성을 확보하여 장치의 수명과 안정적인 작동을 위함이다.","모니터의 크기를 줄인다."],"a":2,"e":{"w":["방수·방진은 밝기와 관계가 없습니다.","색상과도 관계가 없습니다.","크기와도 관계가 없습니다."],"d":"이륜자동차의 모니터는 비, 먼지, 진동에 그대로 노출됩니다. 방수와 방진이 되어야 고장 없이 오래 안정적으로 작동합니다."}},{"q":"이륜자동차 디스플레이 모니터에 스마트폰 미러형 기능이 지원될 때의 기능은?","o":["이륜자동차의 주행 특성을 즉시 변경할 수 있다.","내구성을 확보할 수 있다.","스마트론 화면을 모니터에 그대로 표시하여 사용할 수 있다.","주간 및 야간 등 다양한 조명을 지원한다."],"a":2,"e":{"w":["주행 특성을 바꾸는 것은 모드 변경 기능입니다.","내구성 확보는 방수·방진 기능의 효과입니다.","다양한 조명 조건에서 잘 보이는 것은 화면 자체의 특성입니다."],"d":"스마트폰 미러링은 스마트폰 화면을 모니터에 그대로 띄우는 기능입니다. 지도나 음악 앱을 모니터에서 볼 수 있습니다."}},{"q":"이륜자동차 오디오장치의 방수 기능이 중요한 이유는?","o":["오디오장치의 무게를 늘리기 위해","장치의 안전, 성능 유지, 내구성을 높여 수명을 연장하기 위해","햇빛 노출을 막아주기 위해","오디오장치의 음질을 향상시키기 위해"],"a":1,"e":{"w":["방수는 무게와 관계가 없습니다.","햇빛을 막는 것은 방수가 아닙니다.","음질을 높이는 기능이 아닙니다."],"d":"이륜자동차는 비와 물에 그대로 노출됩니다. 방수가 되어야 합선 같은 사고를 막고, 성능을 유지하며, 오래 쓸 수 있습니다."}},{"q":"알루미늄 합금 프레임 패널의 가장 큰 장점은?","o":["강철보다 무겁다.","부식에 취약하다.","강철보다 가볍고 경량화에 유리하다.","가공이 매우 어렵다."],"a":2,"e":{"w":["알루미늄 합금은 강철보다 가볍습니다.","알루미늄은 표면에 산화막이 생겨 부식에 강한 편입니다.","가공이 어려운 것은 장점이 아닙니다."],"d":"알루미늄 합금은 강철에 비해 훨씬 가볍습니다. 차체가 가벼워지면 가속, 제동, 조종 성능이 모두 좋아집니다."}},{"q":"이륜자동차 프레임이 심하게 휘어졌을 때, 재사용을 권장하지 않는 가장 큰 이유는?","o":["도색 비용이 비싸서","휘어진 프레임은 오일교환이 어렵다.","새로운 프레임이 더 멋있어서","안전에 문제가 발생할 수 있기 때문에"],"a":3,"e":{"w":["도색 비용은 이유가 아닙니다.","오일 교환과는 관계가 없습니다.","겉모습은 이유가 아닙니다."],"d":"심하게 휜 프레임은 바로 펴더라도 금속이 약해져 있고 치수가 정확히 맞지 않습니다. 주행 중 파손되거나 차가 똑바로 가지 않을 수 있어 안전에 문제가 됩니다."}},{"q":"전기 이륜자동차에서 회생 제동 시스템의 목적은?","o":["브레이크 패드의 마모를 줄이기 위해","감속 시 배터리를 충전하여 주행 거리를 늘리기 위해","모터의 과열을 방지하기 위해","급가속 성능을 향상시키기 위해"],"a":1,"e":{"w":["패드 마모가 줄어드는 것은 따라오는 효과이지 목적이 아닙니다.","모터의 과열을 막는 장치가 아닙니다.","가속 성능과는 관계가 없습니다."],"d":"회생 제동은 감속할 때 모터를 발전기로 써서 전기를 만드는 것입니다. 버려지던 운동 에너지로 배터리를 충전하므로 주행 거리가 늘어납니다."}},{"q":"전기 이륜자동차의 배터리 용량이 72V 40Ah일 때, 이 배터리가 저장할 수 있는 총 에너지량은 약 몇 Wh(와트시)인가?","o":["180Wh","288Wh","2880Wh","28800Wh"],"a":2,"e":{"w":["180Wh는 계산과 맞지 않습니다.","288Wh는 자릿수를 잘못 계산한 값입니다.","28800Wh는 자릿수를 잘못 계산한 값입니다."],"d":"에너지량(Wh) = 전압(V) × 용량(Ah)입니다.\n72V × 40Ah = 2,880Wh\n약 2.88kWh입니다."}},{"q":"전기 이륜자동차의 움직임을 만드는 주요 부품은?","o":["엔진","변속기","발전기","모터"],"a":3,"e":{"w":["엔진은 내연기관 이륜자동차의 동력원입니다.","변속기는 동력을 전달하는 장치입니다.","발전기는 전기를 만드는 장치입니다."],"d":"전기 이륜자동차는 배터리의 전기로 모터를 돌려 바퀴를 굴립니다. 내연기관의 엔진 역할을 모터가 합니다."}},{"q":"전기 이륜자동차를 충전할 때 사용하는 것은?","o":["MCU","충전기","DC 컨버터","발전기"],"a":1,"e":{"w":["MCU는 모터를 제어하는 장치입니다.","DC 컨버터는 고전압을 12V로 낮추는 장치입니다.","발전기는 전기를 만드는 장치입니다."],"d":"충전기는 가정용 교류 전기를 배터리에 맞는 직류로 바꾸어 배터리를 충전합니다."}},{"q":"전기 이륜자동차의 배기가스 배출 여부는?","o":["CO만 배출된다.","배출되지 않는다.","NOx만 배출된다.","HC만 약간 배출된다."],"a":1,"e":{"w":["연료를 태우지 않으므로 CO가 나오지 않습니다.","연료를 태우지 않으므로 NOx가 나오지 않습니다.","연료를 태우지 않으므로 HC가 나오지 않습니다."],"d":"전기 이륜자동차는 연료를 태우지 않고 전기로 모터를 돌립니다. 배기관이 없고 주행 중 배기가스가 전혀 나오지 않습니다."}},{"q":"전기 이륜자동차 충전 시, 충전 케이블을 차량에 연결하기 전에 먼저 확인해야 할 사항은?","o":["배터리 잔량","모터의 온도","충전 케이블 및 충전 포트의 손상 여부","MCU의 작동 상태"],"a":2,"e":{"w":["배터리 잔량은 안전과 직접 관계가 없습니다.","모터 온도는 연결 전 확인 사항이 아닙니다.","MCU 작동 상태는 연결 전 확인 사항이 아닙니다."],"d":"충전 케이블과 충전 포트에는 큰 전류가 흐릅니다. 피복이 벗겨졌거나 단자가 손상된 채로 연결하면 감전과 화재가 일어날 수 있으므로 먼저 손상 여부를 확인합니다."}},{"q":"전기 이륜자동차에서 전기에너지를 기계적 에너지로 바꾸는 부품은?","o":["발전기","모터","배터리","인버터"],"a":1,"e":{"w":["발전기는 기계적 에너지를 전기에너지로 바꿉니다. 모터와 반대입니다.","배터리는 전기에너지를 저장합니다.","인버터는 직류를 교류
