가 케이스의 기준 표시와 일치하면 점화 시기가 정상입니다."}},{"q":"반도체 소자인 트랜지스터(BJT/MOSFET)의 회로적 2대 핵심 기능으로 알맞은 것은?","o":["전류 증폭 및 전자식 고속 스위칭","교류 정류 및 전압 승압","방열 냉각 및 단열","감속비 변환"],"a":0,"e":{"w":["교류 정류는 다이오드의 기능입니다.","방열, 냉각, 단열은 트랜지스터의 기능이 아닙니다.","감속비 변환은 기어의 기능입니다."],"d":"트랜지스터의 두 가지 기능은 증폭과 스위칭입니다.\n증폭 : 작은 전류(또는 전압)로 큰 전류를 제어합니다.\n스위칭 : 전류를 빠르게 켜고 끕니다. 점화 코일이나 인젝터를 구동하는 회로가 이 스위칭 작용을 이용합니다."}},{"q":"전원 안정화 회로에서 역방향 항복 현상(Breakdown)을 응용하여 일정한 전압을 출력하는 다이오드는?","o":["제너 다이오드 (Zener Diode)","쇼트키 다이오드","발광 다이오드 (LED)","포토 다이오드"],"a":0,"e":{"w":["쇼트키 다이오드는 순방향 전압 강하가 작아 고속 정류에 씁니다.","발광 다이오드(LED)는 전류가 흐르면 빛을 냅니다.","포토 다이오드는 빛을 받으면 전류가 흐릅니다."],"d":"보통의 다이오드는 역방향으로는 전류가 흐르지 않습니다. 제너 다이오드는 역방향 전압이 일정한 값(제너 전압)을 넘으면 전류가 흐르면서 양 끝 전압을 그 값으로 유지합니다.\n이 성질을 이용해 전압을 일정하게 만드는 정전압 회로에 씁니다."}},{"q":"흡기온도(IAT) 및 냉각수온(ECT) 센서에 널리 채택되며 온도가 올라갈수록 전기저항이 낮아지는 소자는?","o":["PTC 서미스터","NTC 서미스터","선형 가변저항기","세라믹 압전소자"],"a":1,"e":{"w":["PTC 서미스터는 온도가 오르면 저항이 커집니다.","가변저항기는 위치 변화를 저항으로 바꾸며, 스로틀 위치 검출 등에 씁니다.","압전소자는 압력이나 진동을 전압으로 바꾸며, 노크 센서에 씁니다."],"d":"NTC(부특성) 서미스터는 온도가 올라가면 저항이 작아지는 반도체 소자입니다.\n냉각수온 센서와 흡기온도 센서에 쓰이며, ECU는 저항 변화에 따른 전압 변화를 읽어 온도를 알아냅니다. 온도가 오르면 센서 출력 전압은 낮아집니다."}},{"q":"멀티미터의 저항 측정 모드를 사용하여 회로 구성 부품의 저항을 계측할 때의 올바른 측정 수칙은?","o":["반드시 회로에 전원을 인가한 상태에서 측정","회로 전원을 완전히 차단하고 부품을 분리 후 측정","전압계 단자와 직렬로 결선하여 측정","엔진을 고회전시킨 후 측정"],"a":1,"e":{"w":["전원이 걸린 채 저항을 재면 값이 틀리고 테스터가 손상될 수 있습니다.","직렬로 연결하는 것은 전류를 잴 때의 방법입니다.","엔진 회전과 저항 측정은 관계가 없습니다."],"d":"저항 측정 모드에서는 테스터 안의 건전지가 측정 대상에 작은 전류를 흘려 저항을 계산합니다.\n회로에 전원이 걸려 있으면 바깥 전압이 섞여 값이 틀리고 테스터가 손상될 수 있습니다. 또 부품이 회로에 연결된 채로는 다른 부품의 저항이 함께 측정되므로, 전원을 끄고 부품을 분리한 뒤 측정합니다."}},{"q":"ECU에 각 실린더의 피스톤 위치(상사점)와 크랭크샤프트 회전수를 전달하는 핵심 입력 센서는?","o":["공기압 센서","크랭크 앵글 센서 (CKP 센서)","브레이크 오일 레벨 센서","라디에이터 압력 스위치"],"a":1,"e":{"w":["공기압 센서는 타이어 공기압을 검출합니다.","브레이크 오일 레벨 센서는 오일의 양을 검출합니다.","라디에이터 압력 스위치는 엔진 회전수와 관계가 없습니다."],"d":"크랭크 앵글 센서(CKP)는 크랭크축의 회전 각도와 회전수를 검출합니다.\nECU는 이 신호로 피스톤의 위치를 알아내 점화 시기와 연료 분사 시기를 정합니다. 이 센서가 고장 나면 시동이 걸리지 않습니다."}},{"q":"배선 도면상 전선 피복 규격이 'G/W'로 표기되어 있을 때 올바른 색상 식별법은?","o":["녹색(Green) 바탕색에 흰색(White) 줄무늬","흰색 바탕색에 녹색 줄무늬","회색 바탕색에 흰색 줄무늬","녹색 및 흰색 2선 꼬임 케이블"],"a":0,"e":{"w":["흰색 바탕에 녹색 줄무늬는 W/G로 표기합니다.","회색은 Gr로 표기합니다.","줄무늬 표기이며, 두 선을 꼰 케이블이라는 뜻이 아닙니다."],"d":"배선 색 표기에서 앞 글자는 바탕색, 뒤 글자는 줄무늬 색입니다.\nG/W = 녹색(Green) 바탕에 흰색(White) 줄무늬\n주요 약자 : B 검정, W 흰색, R 빨강, G 녹색, Y 노랑, L 파랑, Br 갈색, Gr 회색"}},{"q":"CAN-Bus 고속 통신 네트워크의 양 끝단에 설치된 종단저항(120옴 2개 병렬)을 라인 간 측정했을 때 정상 저항값은?","o":["6 옴","30 옴","60 옴","120 옴"],"a":2,"e":{"w":["6Ω은 정상값보다 크게 낮아 통신선 사이의 단락을 의심합니다.","30Ω은 정상값보다 낮습니다.","120Ω은 종단저항 하나가 끊어졌을 때의 값입니다."],"d":"CAN 통신선 양 끝에는 120Ω 종단저항이 하나씩 있고, 두 저항은 CAN High와 CAN Low 사이에 병렬로 연결됩니다.\n합성 저항 = (120 × 120) ÷ (120 + 120) = 60Ω\n전원을 끄고 두 선 사이를 측정해 약 60Ω이면 정상, 120Ω이면 종단저항 하나 또는 선이 끊어진 것입니다."}},{"q":"단방향 3단자 사이리스터(SCR)에 대한 설명 중 틀린 것은?","o":["애노드(A),캐소드(K),게이트(G)로 이루어진다.","캐소드에서 게이트로 흐르는 전류가 순방향 이다.","게이트에 (+),캐소드에(-)전류를 흘려보내면 애노드와 캐소드 사이가 순간적으로 도통된다.","애노드와 캐소드 사이가 도통된 것은 게이트 전류를 제거해도 계속 도통이 유지되며, 애노드 전위를 0으로 만들어야 해제된다."],"a":1,"e":{"w":["SCR은 애노드(A), 캐소드(K), 게이트(G) 세 단자로 되어 있습니다. 옳은 설명입니다.","게이트에 (+), 캐소드에 (-) 전류를 흘리면 애노드와 캐소드 사이가 도통됩니다. 옳은 설명입니다.","한번 도통되면 게이트 전류를 없애도 계속 유지됩니다. 옳은 설명입니다."],"d":"SCR에서 순방향은 애노드에서 캐소드로 흐르는 방향입니다. 게이트 전류는 게이트에서 캐소드로 흐릅니다. 캐소드에서 게이트로 흐른다는 ②가 틀렸습니다."}},{"q":"정류자에 대한 설명으로 틀린 것은?","o":["정류자는 경동으로 정류자 편을 원형으로 만든다.","정류자에서 정류자 편과 편 사이의 절연체로는 운모를 주로 사용한다.","언더컷은 운모가 정류자 편 윗부분보다 약 0.5㎜ 정도 낮은 것이다.","정류자는 언더컷이 적을수록 브러시와 슬립링의 접촉이 양호해 진다."],"a":3,"e":{"w":["정류자는 경동으로 만든 정류자 편을 둥글게 배열한 것입니다. 옳은 설명입니다.","정류자 편 사이의 절연체로는 운모를 씁니다. 옳은 설명입니다.","언더컷은 운모가 정류자 편보다 약 0.5mm 낮은 것입니다. 옳은 설명입니다."],"d":"운모가 정류자 편보다 낮아야(언더컷이 충분해야) 브러시가 정류자 편에 잘 닿습니다. 언더컷이 적으면 운모가 튀어나와 접촉이 나빠집니다. 또 브러시는 슬립링이 아니라 정류자와 접촉합니다."}},{"q":"쿨롱의 법칙에서 자극의 강도에 대한 내용으로 틀린 것은?","o":["자석의 양끝을 자극이라 한다.","두 자극 세기의 곱에 비례한다.","자극의 세기는 자기량의 크기에 따라 다르다.","거리에 반비례한다."],"a":3,"e":{"w":["자석의 양 끝을 자극이라고 합니다. 옳은 내용입니다.","두 자극 세기의 곱에 비례합니다. 옳은 내용입니다.","자극의 세기는 자기량의 크기에 따라 다릅니다. 옳은 내용입니다."],"d":"쿨롱의 법칙에서 두 자극 사이에 작용하는 힘은 두 자극 세기의 곱에 비례하고 거리의 제곱에 반비례합니다. 거리에 반비례한다는 ④가 틀렸습니다."}}]},{"g":"보충 문제","name":"안전관리 보충 문제","id":"p20","qs":[{"q":"안전장치 선정 시 고려사항 중 맞지 않는 것은?","o":["안전장치의 사용에 따라 방호가 완전할 것","안전장치의 기능 면에서 신뢰도가 클 것","정기점검시 이외에는 사람의 손으로 조정할 필요가 없을 것","안전장치를 제거하거나 또는 기능의 정지를 쉽게 할 수 있을 것"],"a":3,"e":{"w":["방호가 완전해야 합니다. 맞는 고려사항입니다.","기능의 신뢰도가 커야 합니다. 맞는 고려사항입니다.","정기점검 때 말고는 손으로 조정할 필요가 없어야 합니다. 맞는 고려사항입니다."],"d":"안전장치를 쉽게 떼어 내거나 끌 수 있으면 작업자가 귀찮다고 꺼 버려 사고가 납니다. 쉽게 제거하거나 정지시킬 수 없어야 합니다."}},{"q":"드릴작업의 안전사항 중 틀린 것은?","o":["장갑을 끼고 작업하였다.","머리가 긴 경우, 단정하게 하여 작업모를 착용하였다.","작업 중 쇳가루를 입으로 불어서는 안 된다.","공작물은 단단히 고정시켜 따라 돌지 않게 한다."],"a":0,"e":{"w":["긴 머리는 단정히 하고 작업모를 씁니다. 옳은 사항입니다.","쇳가루를 입으로 불면 눈에 들어갑니다. 옳은 사항입니다.","공작물은 단단히 고정해 따라 돌지 않게 합니다. 옳은 사항입니다."],"d":"드릴은 빠르게 돕니다. 장갑을 끼면 장갑이 드릴에 감겨 손이 말려 들어갑니다. 드릴 작업에서는 장갑을 끼지 않습니다."}},{"q":"오픈렌치 사용시 바르지 못한 것은?","o":["오픈렌치와 너트의 크기가 맞지 않으면 쐐기를 넣어 사용한다.","오픈렌치를 해머 대신에 써서는 안 된다.","오픈렌치에 파이프를 끼우든가 해머로 두들겨서 사용하지 않는다.","오픈렌치는 올바르게 끼우고 작업자 앞으로 잡아당겨 사용한다."],"a":0,"e":{"w":["오픈렌치를 해머 대신 쓰지 않습니다. 바른 사용법입니다.","파이프를 끼우거나 해머로 두드려 쓰지 않습니다. 바른 사용법입니다.","올바르게 끼우고 몸 앞으로 당겨 씁니다. 바른 사용법입니다."],"d":"렌치와 너트의 크기가 맞지 않으면 쐐기를 넣어도 미끄러져 너트가 뭉개지고 손을 다칩니다. 크기가 꼭 맞는 렌치를 써야 합니다."}},{"q":"전기장치의 배선 커넥터 분리 및 연결시 잘못된 작업은?","o":["배선을 분리할 때는 잠금장치를 누른 상태에서 커넥터를 분리한다.","배선커넥터 접속은 커넥터 부위를 잡고 커넥터를 끼운다.","배선커넥터는 딸깍 소리가 날 때까지는 확실히 접속시킨다.","배선을 분리할 때는 배선을 이용하여 흔들면서 잡아당긴다."],"a":3,"e":{"w":["잠금장치를 누른 상태에서 커넥터를 분리합니다. 옳은 작업입니다.","접속할 때는 커넥터 부위를 잡고 끼웁니다. 옳은 작업입니다.","딸깍 소리가 날 때까지 확실히 끼웁니다. 옳은 작업입니다."],"d":"배선을 잡고 흔들면서 당기면 안의 전선이 끊어지거나 단자가 빠집니다. 반드시 커넥터 몸체를 잡고 분리합니다."}},{"q":"일반 가연성 물질의 화재로서 물이나 소화기를 이용하여 소화하는 화재의 종류는?","o":["A급 화재","B급 화재","C급 화재","D급 화재"],"a":0,"e":{"w":["B급 화재는 유류 화재입니다.","C급 화재는 전기 화재입니다.","D급 화재는 금속 화재입니다."],"d":"A급 화재는 나무, 종이, 섬유 같은 일반 가연물이 타는 화재입니다. 타고 나면 재가 남고, 물로 식혀서 끌 수 있습니다."}},{"q":"줄 작업에서 줄에 손잡이를 꼭 끼우고 사용하는 이유는?","o":["평형을 유지하기 위해","중량을 높이기 위해","보관에 편리하도록 하기 위해","사용자에게 상처를 입히지 않기 위해"],"a":3,"e":{"w":["평형을 유지하려는 것이 아닙니다.","무게를 늘리려는 것이 아닙니다.","보관을 편하게 하려는 것이 아닙니다."],"d":"줄의 뒤쪽 끝(슴베)은 뾰족합니다. 손잡이 없이 쓰면 손바닥이나 손목을 찔려 다칩니다."}},{"q":"산소용접에서 안전한 작업수칙으로 옳은 것은?","o":["기름이 묻은 복장으로 작업한다.","산소밸브를 먼저 연다.","아세틸렌밸브를 먼저 연다.","역화하였을 때는 아세틸렌밸브를 빨리 잠근다."],"a":2,"e":{"w":["기름과 산소가 만나면 불이 붙습니다. 기름 묻은 복장은 위험합니다.","점화할 때는 아세틸렌밸브를 먼저 엽니다.","역화하면 산소밸브를 먼저 잠급니다."],"d":"산소용접에서 점화할 때는 아세틸렌밸브를 먼저 열어 불을 붙인 뒤 산소밸브를 열어 불꽃을 조절합니다."}},{"q":"기계부품에 작용하는 하중에서 안전율을 가장 크게 하여야 할 하중은?","o":["정 하중","교번하중","충격하중","반복하중"],"a":2,"e":{"w":["정하중은 변하지 않는 하중이라 안전율을 가장 작게 잡습니다.","교번하중은 충격하중보다 안전율을 작게 잡습니다.","반복하중은 충격하중보다 안전율을 작게 잡습니다."],"d":"충격하중은 짧은 순간에 큰 힘이 걸려 부품이 가장 파손되기 쉽습니다. 안전율은 정하중 < 반복하중 < 교번하중 < 충격하중 순서로 크게 잡습니다."}},{"q":"기관정비 시 안전 및 취급주의 사항에 대한 내용으로 틀린 것은?","o":["TPS, ISC Servo 등은 솔벤트로 세척하지 않는다.","공기압축기를 사용하여 부품세척 시 눈에 이물질이 튀지 않도록 한다.","캐니스터 점검 시 흔들어서 연료증발가스를 활성화 시킨 후 점검한다.","배기가스 시험 시 환기가 잘되는 곳에서 측정한다."],"a":2,"e":{"w":["TPS, ISC 서보 같은 전자 부품은 솔벤트로 세척하지 않습니다. 옳은 내용입니다.","압축공기로 세척할 때 눈에 이물질이 튀지 않게 합니다. 옳은 내용입니다.","배기가스 시험은 환기가 잘되는 곳에서 합니다. 옳은 내용입니다."],"d":"캐니스터 안에는 연료 증발가스를 붙잡아 두는 활성탄이 들어 있습니다. 흔들면 활성탄이 부서지고 가스가 새어 나옵니다. 흔들어서 점검하지 않습니다."}},{"q":"계기 및 보안장치의 정비 시 안전사항으로 틀린 것은?","o":["엔진이 정지 상태이면 계기판은 점화스위치 ON 상태에서 분리한다.","충격이나 이물질이 들어가지 않도록 주의한다.","회로 내의 규정치보다 높은 전류가 흐르지 않도록 한다.","센서의 단품 점검 시 배터리 전원을 직접 연결하지 않는다."],"a":0,"e":{"w":["충격을 주거나 이물질이 들어가지 않게 합니다. 옳은 사항입니다.","규정보다 높은 전류가 흐르지 않게 합니다. 옳은 사항입니다.","센서 단품을 점검할 때 배터리 전원을 직접 연결하지 않습니다. 옳은 사항입니다."],"d":"계기판은 전기가 흐르는 상태에서 분리하면 합선되어 회로가 손상됩니다. 점화스위치를 끄고 배터리 (-)단자를 분리한 뒤에 떼어 냅니다."}},{"q":"다음 중 탁상용 드릴로 둥근 공작물에 구멍을 뚫을 때 공작물 고정 방법으로 가장 적합한 것은?","o":["손으로 잡는다.","바이스 플라이어로 잡는다.","V블록과 클램프로 잡는다.","헝겊에 싸서 바이스로 고정한다."],"a":2,"e":{"w":["손으로 잡으면 공작물이 돌아 손을 다칩니다.","바이스 플라이어로는 둥근 물체를 단단히 잡기 어렵습니다.","헝겊에 싸면 미끄러집니다."],"d":"둥근 공작물은 구르기 쉽습니다. V자 홈이 있는 V블록에 올려놓고 클램프로 눌러 고정하면 움직이지 않습니다."}},{"q":"안전한 작업을 하기 위하여 작업 복장을 선정할 때, 유의사항과 가장 거리가 먼 것은?","o":["화기사용 직장에서는 방염성, 불연성의 것을 사용하도록 한다.","착용자의 취미, 기호 등을 감안하여 적절한 스타일을 선정한다.","작업복은 몸에 맞고 동작이 작업하기 편 하도록 제작한다.","상의의 끝이나 바지 자락 등이 기계에 말려들어갈 위험이 없도록 한다."],"a":1,"e":{"w":["불을 쓰는 곳에서는 방염성, 불연성 작업복을 입습니다. 유의사항입니다.","작업복은 몸에 맞고 움직이기 편해야 합니다. 유의사항입니다.","소매나 바지 자락이 기계에 말려 들어가지 않게 합니다. 유의사항입니다."],"d":"작업복은 안전과 작업 편의를 기준으로 고릅니다. 착용자의 취미나 기호는 고려할 사항이 아닙니다."}},{"q":"축전지 취급시의 안전 수칙으로 올바른 것은?","o":["축전지 표면에 있는 침식물이나 먼지 등은 압축 공기를 이용하여 청소한다.","황산을 엎지르거나 흐르지 않도록 맨 손으로 취급한다.","축전지 취급 시 전해액이 신체에 닿지 않도록 한다.","축전지 취급 시 반지를 끼고 작업하면 안전하다."],"a":2,"e":{"w":["압축 공기로 불면 침식물과 전해액이 튀어 눈과 피부에 묻습니다.","황산은 맨손으로 만지면 화상을 입습니다.","반지 같은 금속은 단자에 닿으면 합선되어 화상을 입습니다."],"d":"축전지의 전해액은 묽은 황산입니다. 피부나 눈에 닿으면 화상을 입으므로 신체에 닿지 않도록 보호구를 착용하고 다룹니다."}},{"q":"산업안전보건법 상 작업현장 안전·보건표지 색채에서 화학물질 취급 장소에서의 유해·위험 경고 용도로 사용되는 색채는?","o":["빨간색","노란색","녹색","검은색"],"a":0,"e":{"w":["노란색은 화학물질 이외의 위험 경고와 주의 표시에 씁니다.","녹색은 안내 표시에 씁니다.","검은색은 문자와 빨간색·노란색의 보조색으로 씁니다."],"d":"안전·보건표지에서 빨간색은 금지와, 화학물질 취급 장소의 유해·위험 경고에 씁니다."}},{"q":"정 작업 시 주의할 사항으로 틀린 것은?","o":["정 작업 시에는 보호안경을 사용할 것","철재를 절단할 때는 철편이 튀는 방향에 주의할 것","자르기 시작할 때와 끝날 무렵에는 세게 칠 것","담금질된 재료는 깎아내지 말 것"],"a":2,"e":{"w":["보호안경을 사용합니다. 옳은 사항입니다.","쇳조각이 튀는 방향에 주의합니다. 옳은 사항입니다.","담금질한 재료는 단단해서 정이 깨지므로 깎지 않습니다. 옳은 사항입니다."],"d":"정 작업은 시작할 때와 끝날 무렵에 약하게 쳐야 합니다. 처음에는 정이 미끄러지기 쉽고, 끝에서는 조각이 튀어 나가기 때문입니다."}},{"q":"공기압축기에서 공기필터의 교환 작업 시 주의사항으로 틀린 것은?","o":["공기압축기를 정지시킨 후 작업한다.","고정된 볼트를 풀고 뚜껑을 열어 먼지를 제거한다.","필터는 깨끗이 닦거나 압축공기로 이물을 제거한다.","필터에 약간의 기름칠을 하여 조립한다."],"a":3,"e":{"w":["공기압축기를 정지시킨 뒤 작업합니다. 옳은 내용입니다.","볼트를 풀고 뚜껑을 열어 먼지를 제거합니다. 옳은 내용입니다.","필터는 닦거나 압축공기로 이물질을 제거합니다. 옳은 내용입니다."],"d":"공기필터에 기름을 칠하면 먼지가 달라붙어 금방 막히고, 기름이 압축공기에 섞여 들어갑니다. 기름칠을 하지 않습니다."}},{"q":"안전사고율 중 도수율(빈도율)을 나타내는 표현식은?","o":["(연간 사상자수/평균 근로자 수)×1000","(사고 건수/연근로 시간 수)×1000000","(노동 손실일수/노동 총시간 수)×1000","(사고 건수/노동 총시간 수)×1000"],"a":1,"e":{"w":["(연간 사상자 수 ÷ 평균 근로자 수) × 1000은 연천인율입니다.","(노동 손실일수 ÷ 노동 총시간 수) × 1000은 강도율입니다.","1000을 곱하는 것은 도수율 식이 아닙니다."],"d":"도수율(빈도율)은 100만 근로시간당 재해가 몇 건 일어났는지를 나타냅니다.\n도수율 = (재해 건수 ÷ 연근로 시간 수) × 1,000,000"}},{"q":"전동공구 사용 시 전원이 차단되었을 경우 안전한 조치방법은?","o":["전기가 다시 들어오는지 확인하기 위해 전동공구를 ON상태로 둔다.","전기가 다시 들어올 때까지 전동공구의 ON-OFF를 계속 반복한다.","전동공구 스위치는 OFF상태로 전환한다.","전동공구는 플러그를 연결하고 스위치는 ON상태로 하여 대피한다."],"a":2,"e":{"w":["켜 두면 전기가 들어올 때 갑자기 돌아 다칩니다.","스위치를 반복해 켜고 끄는 것은 위험합니다.","켜 둔 채 자리를 뜨면 전기가 들어올 때 공구가 혼자 돕니다."],"d":"정전이 되면 스위치를 OFF로 돌려놓습니다. 그래야 전기가 다시 들어올 때 공구가 갑자기 작동하지 않습니다."}},{"q":"다음 중 안전사고 예방의 3요소(3E)가 아닌 것은?","o":["교환(Exchange)","지도ㆍ단속(Enforcement)","기술 개선(Engineering)","교육(Education)"],"a":0,"e":{"w":["지도·단속(Enforcement)은 3E에 들어갑니다.","기술 개선(Engineering)은 3E에 들어갑니다.","교육(Education)은 3E에 들어갑니다."],"d":"안전사고 예방의 3요소(3E)는 교육(Education), 기술(Engineering), 지도·단속(Enforcement)입니다. 교환(Exchange)은 해당하지 않습니다."}},{"q":"기관의 헤드커버 볼트를 풀 때 안전상 가장 좋은 공구는?","o":["오픈 렌치","복스 렌치","파이프 렌치","토크 렌치"],"a":1,"e":{"w":["오픈 렌치는 두 면만 물어 미끄러지기 쉽습니다.","파이프 렌치는 둥근 관을 돌릴 때 씁니다.","토크 렌치는 조일 때 조임 힘을 재는 공구입니다. 푸는 데 쓰지 않습니다."],"d":"복스 렌치는 볼트 머리 전체를 감싸 물기 때문에 미끄러지지 않습니다. 볼트를 풀고 조일 때 가장 안전합니다."}},{"q":"스패너 작업 중 가장 옳은 것은?","o":["고정 조(fixed jaw)에 힘이 많이 걸리도록 한다.","볼트 머리보다 약간 큰 스패너를 사용하여도 된다.","스패너 자루에 조합렌치를 연결해서 사용하여도 된다.","스패너 자루에 파이프를 끼워서 사용한다."],"a":0,"e":{"w":["볼트 머리에 꼭 맞는 스패너를 써야 합니다. 크면 미끄러집니다.","다른 렌치를 이어서 쓰면 빠지면서 다칩니다.","파이프를 끼워 쓰면 스패너가 부러지거나 볼트가 손상됩니다."],"d":"스패너는 튼튼한 고정 조 쪽에 힘이 걸리도록 물리고 몸 쪽으로 당겨 씁니다."}},{"q":"작업장의 화재분류로 알맞은 것은?","o":["A급 화재 - 전기화재","B급 화재 - 유류화재","C급 화재 - 금속화재","D급 화재 - 일반화재"],"a":1,"e":{"w":["A급 화재는 일반 화재입니다.","C급 화재는 전기 화재입니다.","D급 화재는 금속 화재입니다."],"d":"화재는 A급 일반 화재, B급 유류 화재, C급 전기 화재, D급 금속 화재로 분류합니다."}},{"q":"드릴링 머신 작업할 때 주의사항으로 틀린 것은?","o":["드릴 날이 무디어 이상한 소리가 날 때는 회전을 멈추고 드릴을 교환하거나 연마한다.","공작물을 제거할 때는 회전을 완전히 멈추고 한다.","가공 중에 드릴이 관통했는지를 손으로 확인한 후 기계를 멈춘다.","드릴 주축에 튼튼하게 장치하여 사용한다."],"a":2,"e":{"w":["이상한 소리가 나면 회전을 멈추고 드릴을 교환하거나 연마합니다. 옳은 내용입니다.","공작물을 떼어 낼 때는 회전을 완전히 멈춥니다. 옳은 내용입니다.","드릴은 주축에 튼튼하게 장치합니다. 옳은 내용입니다."],"d":"도는 드릴 아래에 손을 대면 드릴 끝에 찔리거나 손이 말려 들어갑니다. 관통했는지를 손으로 확인하면 안 됩니다."}},{"q":"큰 구멍을 가공할 때 가장 먼저 하여야 할 작업은?","o":["스핀들의 속도를 증가시킨다.","금속을 연하게 한다.","강한 힘으로 작업한다.","작은 치수의 구멍을 먼저 작업한다."],"a":3,"e":{"w":["속도를 올리면 드릴이 타 버립니다.","금속을 연하게 만들 필요가 없습니다.","강한 힘으로 누르면 드릴이 부러집니다."],"d":"큰 드릴은 처음부터 뚫으면 중심이 흔들리고 힘이 많이 듭니다. 작은 드릴로 안내 구멍을 먼저 뚫은 뒤 큰 드릴로 넓힙니다."}},{"q":"작업장 환경을 개선하면 나타나는 현상으로 틀린 것은?","o":["좋은 품질의 생산품을 얻을 수 있다.","피로를 경감시킬 수 있다.","작업능률을 향상시킬 수 있다.","기계소모가 많고 동력손실이 크다."],"a":3,"e":{"w":["품질이 좋아집니다. 맞는 현상입니다.","피로가 줄어듭니다. 맞는 현상입니다.","작업능률이 올라갑니다. 맞는 현상입니다."],"d":"작업장 환경을 개선하면 품질과 능률이 좋아지고 피로가 줄어듭니다. 기계 소모가 많아지고 동력 손실이 커지는 일은 없습니다."}},{"q":"기관정비 작업시 피스톤링의 이음 간극을 측정할 때 측정도구로 알맞은 것은?","o":["마이크로미터","버니어캘리퍼스","시크니스게이지","다이얼게이지"],"a":2,"e":{"w":["마이크로미터는 두께나 지름을 재는 도구입니다.","버니어캘리퍼스로는 좁은 틈을 잴 수 없습니다.","다이얼게이지는 휨과 유격을 재는 도구입니다."],"d":"피스톤링을 실린더에 넣고 링의 양 끝 사이에 생긴 틈(이음 간극)에 시크니스 게이지(틈새 게이지)를 넣어 측정합니다."}},{"q":"길이가 500㎜인 토크렌치로 5.5kgf·m의 나사를 죄려면 kgf의 힘이 필요한가?","o":["2.75","11","25","27.5"],"a":1,"e":{"w":["2.75는 토크에 길이를 곱한 값입니다.","25는 계산과 맞지 않습니다.","27.5는 계산과 맞지 않습니다."],"d":"토크 = 힘 × 길이이므로 힘 = 토크 ÷ 길이입니다. 500mm는 0.5m입니다.\n5.5kgf·m ÷ 0.5m = 11kgf"}},{"q":"유류화재시 소화방법으로 적합하지 않은 것은?","o":["분말소화기를 사용한다.","물을 부어 끈다.","모래를 뿌린다.","ABC 소화기를 사용한다."],"a":1,"e":{"w":["분말소화기는 유류 화재에 적합합니다.","모래를 뿌려 산소를 차단하는 것은 적합합니다.","ABC 소화기는 유류 화재에 쓸 수 있습니다."],"d":"기름은 물보다 가벼워 물 위에 뜹니다. 물을 부으면 불붙은 기름이 물을 타고 퍼져 불이 더 커집니다."}},{"q":"평균 근로자 500명인 직장에서 1년간 8명의 재해가 발생하였다면 연천인율은?","o":["12","14","16","18"],"a":2,"e":{"w":["12는 계산과 맞지 않습니다.","14는 계산과 맞지 않습니다.","18은 계산과 맞지 않습니다."],"d":"연천인율 = (연간 재해자 수 ÷ 평균 근로자 수) × 1,000입니다.\n8 ÷ 500 × 1,000 = 16"}},{"q":"수공구의 사용방법 중 잘못된 것은?","o":["공구를 청결한 상태에서 보관할 것","공구를 취급할 때에 올바른 방법으로 사용할 것","공구는 지정된 장소에 보관할 것","공구는 사용 전․후 오일을 발라둘 것"],"a":3,"e":{"w":["공구는 청결하게 보관합니다. 옳은 방법입니다.","올바른 방법으로 사용합니다. 옳은 방법입니다.","지정된 장소에 보관합니다. 옳은 방법입니다."],"d":"공구에 오일이 묻어 있으면 손에서 미끄러져 다칩니다. 사용 전후에는 오일을 발라 두지 않고 깨끗이 닦습니다."}},{"q":"연삭작업 시 지켜야 할 안전수칙 중 잘못된 것은?","o":["보안경을 반드시 착용한다.","숫돌의 측면을 사용한다.","숫돌차와 연삭대 간격은 3㎜ 이하로 한다.","정상 회전속도에서 연삭을 시작한다."],"a":1,"e":{"w":["보안경을 반드시 착용합니다. 옳은 수칙입니다.","숫돌차와 연삭대의 간격은 3mm 이하로 합니다. 옳은 수칙입니다.","정상 회전속도가 된 뒤에 연삭을 시작합니다. 옳은 수칙입니다."],"d":"연삭숫돌은 옆에서 미는 힘에 약합니다. 측면을 쓰면 숫돌이 깨져 날아갈 수 있습니다. 원주면(둥근 바깥 면)을 사용합니다."}},{"q":"전동공구를 사용하여 작업할 때의 준수사항이다. 올바른 것은?","o":["코드는 방수제로 되어 있기 때문에 물이나 기름이 있는 곳에 놓아도 좋다.","무리하게 코드를 잡아당기지 않는다.","드릴의 이동이나 교환시는 모터를 손으로 멈추게 한다.","코드는 예리한 걸이에도 절단이나 파손이 안 되므로 걸어도 좋다."],"a":1,"e":{"w":["코드가 물이나 기름에 닿으면 누전되고 피복이 상합니다.","회전 부분을 손으로 멈추면 손을 다칩니다.","코드를 날카로운 곳에 걸면 피복이 벗겨집니다."],"d":"코드를 무리하게 잡아당기면 속의 전선이 끊어지거나 플러그가 손상되어 감전과 합선이 일어납니다. 플러그를 잡고 뽑습니다."}},{"q":"정비공장에서 지켜야 할 안전수칙이 아닌 것은?","o":["작업 중 입은 부상은 응급치료를 받고 즉시 보고한다.","밀폐된 실내에서는 시동을 걸지 않는다.","통로나 마룻바닥에 공구나 부품을 방치 하지 않는다.","기름걸레나 인화물질은 나무상자에 보관한다."],"a":3,"e":{"w":["부상은 응급치료를 받고 바로 보고합니다. 안전수칙입니다.","밀폐된 실내에서는 시동을 걸지 않습니다. 안전수칙입니다.","통로와 바닥에 공구나 부품을 두지 않습니다. 안전수칙입니다."],"d":"기름걸레나 인화물질은 스스로 열이 나 불이 붙을 수 있습니다. 불에 타는 나무상자가 아니라 뚜껑이 있는 철제 용기에 보관합니다."}},{"q":"휠 평형잡기의 시험 중 안전사항에 해당되는 않는 것은?","o":["타이어의 회전방향에 서지 말아야 한다.","타이어를 과속으로 돌리거나 진동이 일어나게 해서는 안 된다.","회전하는 휠에 손을 대지 말아야 한다.","휠을 정지 시킬 때는 손으로 정지시켜도 무방하다."],"a":3,"e":{"w":["타이어의 회전방향에 서지 않습니다. 안전사항입니다.","과속으로 돌리거나 진동이 일어나게 하지 않습니다. 안전사항입니다.","회전하는 휠에 손을 대지 않습니다. 안전사항입니다."],"d":"회전하는 휠을 손으로 멈추려 하면 손이 말려 들어가 다칩니다. 스위치를 끄고 저절로 멈출 때까지 기다립니다."}},{"q":"산업체에서 안전을 지킴으로서 얻을 수 있는 이점으로 틀린 것은?","o":["직장의 신뢰도를 높여준다.","상하 동료 간에 인간관계가 개선된다.","기업의 투자 경비가 늘어난다.","회사 내 규율과 안전수칙이 준수되어 질서유지가 실현된다."],"a":2,"e":{"w":["직장의 신뢰도가 높아집니다. 이점입니다.","인간관계가 좋아집니다. 이점입니다.","규율과 안전수칙이 지켜져 질서가 유지됩니다. 이점입니다."],"d":"안전을 지키면 사고로 인한 손실이 줄어 오히려 비용이 절감됩니다. 투자 경비가 늘어난다는 것은 이점이 아닙니다."}},{"q":"색에 맞는 안전표시가 잘못 짝지어진 것은?","o":["녹색 - 안전, 피난, 보호표시","노란색 - 주의, 경고표시","청색 - 지시, 수리 중, 유도표시","자주색 - 안전지도 표시"],"a":3,"e":{"w":["녹색은 안전, 피난, 보호를 나타냅니다. 옳은 짝입니다.","노란색은 주의, 경고를 나타냅니다. 옳은 짝입니다.","청색은 지시, 수리 중, 유도를 나타냅니다. 옳은 짝입니다."],"d":"자주색(보라색)은 방사능 위험을 나타내는 색입니다. 안전지도 표시가 아니므로 ④가 잘못 짝지어졌습니다."}},{"q":"작업안전상 드라이버 사용 시 유의사항이 아닌 것은?","o":["날 끝이 홈의 폭과 길이가 같은 것을 사용한다.","날 끝이 수평이어야 한다.","작은 부품은 한손으로 잡고 사용한다.","전기 작업 시 금속부분이 자루 밖으로 나와 있지 않아야 한다."],"a":2,"e":{"w":["날 끝이 홈의 폭과 길이에 맞는 것을 씁니다. 유의사항입니다.","날 끝이 수평이어야 합니다. 유의사항입니다.","전기 작업에서는 금속 부분이 자루 밖으로 나오지 않은 절연된 것을 씁니다. 유의사항입니다."],"d":"작은 부품을 손에 들고 드라이버를 쓰면 날이 미끄러져 손바닥을 찌릅니다. 바이스나 작업대에 고정하고 작업합니다."}},{"q":"회로의 정격 전압이 일정수준 이하의 낮은 전압으로 절연 파괴 등의 사고에도 인체에 위험을 주지 않게 되는 전압을 무슨 전압이라 하는가?","o":["안전전압","접촉전압","접지전압","절연전압"],"a":0,"e":{"w":["접촉전압은 사람이 닿았을 때 걸리는 전압입니다.","접지전압은 접지와의 사이에 걸리는 전압입니다.","절연전압은 절연이 견디는 전압입니다."],"d":"안전전압은 사람 몸에 닿아도 위험하지 않을 만큼 낮은 전압을 말합니다."}},{"q":"얇은 판에 드릴 작업시 재료 밑의 받침은 무엇이 적합한가?","o":["나무판","연강판","스테인레스판","벽돌"],"a":0,"e":{"w":["연강판은 드릴이 뚫고 나올 때 날이 상합니다.","스테인레스판은 단단해서 드릴 날이 상합니다.","벽돌은 깨지고 드릴 날이 상합니다."],"d":"얇은 판은 드릴이 뚫고 나올 때 판이 딸려 올라가거나 찢어집니다. 밑에 나무판을 받치면 깨끗하게 뚫리고 드릴 날도 상하지 않습니다."}},{"q":"다이얼 게이지 취급시 안전사항으로 틀린 것은?","o":["작동이 불량하면 스핀들에 주유 혹은 그리스를 발라서 사용한다.","분해 청소나 조정은 하지 않는다.","다이얼 인디케이터에 충격을 가해서는 안 된다.","측정시 측정물에 스핀들을 직각으로 설치하고 무리한 접촉은 피한다."],"a":0,"e":{"w":["분해 청소나 조정은 하지 않습니다. 옳은 사항입니다.","충격을 주지 않습니다. 옳은 사항입니다.","측정물에 스핀들을 직각으로 대고 무리한 힘을 주지 않습니다. 옳은 사항입니다."],"d":"다이얼 게이지의 스핀들에 기름이나 그리스를 바르면 먼지가 달라붙어 움직임이 더 나빠지고 측정값이 틀어집니다. 주유하지 않습니다."}},{"q":"작업현장에서 기계의 안전조건이 아닌 것은?","o":["덮개","안전장치","안전교육","보전성의 개선"],"a":2,"e":{"w":["덮개는 기계에 다는 안전 조건입니다.","안전장치는 기계에 다는 안전 조건입니다.","보전성의 개선은 기계 자체의 안전 조건입니다."],"d":"덮개, 안전장치, 보전성은 기계 쪽의 안전조건입니다. 안전교육은 사람에 대한 대책이라 기계의 안전조건이 아닙니다."}},{"q":"물체를 잡을 때 사용하고, 조(jaw)에 세레이션이 설치되어 있어서 미끄러지지 않으며 물체의 크기에 따라 조를 조절할 수 있는 공구는?","o":["와이어 스트립퍼","알렌 렌치","바이스 플라이어","복스 렌치"],"a":2,"e":{"w":["와이어 스트리퍼는 전선의 피복을 벗기는 공구입니다.","알렌 렌치는 육각 구멍 볼트를 돌리는 공구입니다.","복스 렌치는 볼트 머리를 감싸 돌리는 공구입니다."],"d":"바이스 플라이어는 조의 벌림을 조절할 수 있고, 한번 물면 손을 놓아도 물린 채로 고정되는 공구입니다. 조에 톱니(세레이션)가 있어 미끄러지지 않습니다."}},{"q":"고속 절단기로 파이프의 절단작업 중 안전 사항에 어긋난 것은?","o":["보안경을 착용하여 작업을 한다.","절단 후 절단면은 숫돌의 측면을 이용해서 연마한다.","파이프는 바이스로 고정시켜 작업을 한다.","안전커버를 반드시 부착한다."],"a":1,"e":{"w":["보안경을 착용합니다. 옳은 사항입니다.","파이프는 바이스로 고정합니다. 옳은 사항입니다.","안전커버를 반드시 부착합니다. 옳은 사항입니다."],"d":"절단 숫돌은 얇아서 옆에서 미는 힘을 받으면 깨져 날아갑니다. 숫돌의 측면으로 연마하면 안 됩니다."}},{"q":"실린더 헤드의 밸브장치 정비 시 안전작업 방법으로 틀린 것은?","o":["밸브 탈착시 리테이너 로크는 반드시 새것으로 교환한다.","밸브 탈착시 스프링이 튀어 나가지 않도록 한다.","분해된 밸브에 표시를 하여 바뀌지 않도록 한다.","분해조립 시 밸브 스프링 전용공구를 사용한다."],"a":0,"e":{"w":["스프링이 튀어 나가지 않게 합니다. 옳은 방법입니다.","분해한 밸브에 표시해 바뀌지 않게 합니다. 옳은 방법입니다.","밸브 스프링 전용공구를 사용합니다. 옳은 방법입니다."],"d":"리테이너 로크는 손상되지 않았으면 다시 사용합니다. 반드시 새것으로 교환해야 하는 부품이 아닙니다."}},{"q":"브레이크 계통에 공기가 혼입되었을 때 공기빼기 작업방법 중 잘못된 것은?","o":["브리더 플러그에 비닐 호  상태로 보관한다.","녹이 생긴 볼트나 너트에는 오일을 넣어 스며들게 한 다음 돌린다."],"a":0,"e":{"w":["렌치에 파이프 같은 연장대를 끼워 쓰지 않습니다. 안전한 사용법입니다.","공구는 언제나 깨끗하게 보관합니다. 안전한 사용법입니다.","녹슨 볼트와 너트에는 오일을 스며들게 한 뒤 돌립니다. 안전한 사용법입니다."],"d":"조정 렌치의 움직이는 조(조정 조)는 약합니다. 잡아당기는 힘은 튼튼한 고정 조에 걸리도록 사용해야 합니다."}},{"q":"작업시작 전의 안전점검에 관한 사항 중 잘못 짝지어진 것은?","o":["인적인 면 - 건강상태, 기능상태","물리적인 면 - 기계기구 설비, 공구","관리적인면 - 작업내용, 작업순서","환경적인 면 - 작업방법, 안전수칙"],"a":3,"e":{"w":["인적인 면에서는 건강상태와 기능상태를 봅니다. 옳은 짝입니다.","물리적인 면에서는 기계기구, 설비, 공구를 봅니다. 옳은 짝입니다.","관리적인 면에서는 작업내용과 작업순서를 봅니다. 옳은 짝입니다."],"d":"환경적인 면에서는 작업장소, 정리정돈, 조명, 환기 상태를 봅니다. 작업방법과 안전수칙은 관리적인 면에 해당합니다."}},{"q":"소화 작업의 기본요소가 아닌 것은?","o":["가연 물질을 제거한다.","산소를 차단한다.","점화원을 냉각시킨다.","연료를 기화시킨다."],"a":3,"e":{"w":["탈 물질을 없애는 것은 소화의 기본입니다.","산소를 차단하는 것은 소화의 기본입니다.","점화원을 식히는 것은 소화의 기본입니다."],"d":"불은 가연물, 산소, 점화원이 모두 있어야 탑니다. 이 가운데 하나를 없애면 꺼집니다. 연료를 기화시키면 오히려 불이 더 잘 붙습니다."}},{"q":"공기공구 사용에 대한 설명 중 틀린 것은?","o":["공구의 교체 시에는 반드시 밸브를 꼭 잠그고 하여야 한다.","활동 부분은 항상 윤활유 또는 그리스를 급유한다.","사용 시에는 반드시 보호구를 착용해야 한다.","공기공구를 사용할 때에는 밸브를 빠르게 열고 닫는다."],"a":3,"e":{"w":["공구를 교체할 때는 밸브를 꼭 잠급니다. 옳은 설명입니다.","움직이는 부분에는 윤활유나 그리스를 급유합니다. 옳은 설명입니다.","사용할 때는 보호구를 착용합니다. 옳은 설명입니다."],"d":"밸브를 갑자기 열면 공구가 급하게 움직이고 호스가 튀어 다칩니다. 밸브는 천천히 열고 닫습니다."}},{"q":"연삭 작업시 안전사항 중 옳지 않은 것은?","o":["나무 해머로 연삭숫돌을 가볍게 두들겨 맑은 음이 나면 정상이다.","연삭숫돌의 표면이 심하게 변형된 것은 반드시 수정한다.","받침대는 숫돌차의 중심선보다 낮게 한다.","연삭 숫돌과 받침대와의 간격은 3mm 이내로 유지한다."],"a":2,"e":{"w":["나무 해머로 두들겨 맑은 소리가 나면 정상입니다. 옳은 사항입니다.","표면이 심하게 변형된 숫돌은 반드시 수정합니다. 옳은 사항입니다.","숫돌과 받침대의 간격은 3mm 이내로 유지합니다. 옳은 사항입니다."],"d":"받침대가 숫돌의 중심선보다 낮으면 공작물이 숫돌과 받침대 사이로 끌려 들어갑니다. 받침대는 숫돌의 중심선과 같은 높이로 맞춥니다."}},{"q":"밸브 래핑 작업을 수작업으로 할 때 가장 효율적이며 안전하게 작업하는 방법은?","o":["래퍼를 양손에 끼고 오른쪽으로 돌렸다.","래퍼를 양손에 끼고 왼쪽으로 돌리면서 이따끔 가볍게 충격을 준다.","래퍼를 양손에 끼고 좌우로 돌리면서 이따금 가볍게 충격을 준다.","래퍼를 양손에 끼고 좌우로 돌렸다."],"a":2,"e":{"w":["한쪽으로만 돌리면 한 방향으로 줄이 생깁니다.","한쪽으로만 돌리면 고르게 갈리지 않습니다.","충격을 주지 않으면 연마제가 고르게 퍼지지 않습니다."],"d":"밸브 래핑은 래퍼를 양 손바닥 사이에 끼고 좌우로 비벼 돌리면서, 이따금 밸브를 들었다 가볍게 내려쳐 연마제를 고르게 퍼지게 합니다."}},{"q":"기관을 운반하기 위해 체인 블록을 사용할 때의 안전사항 중 가장 옳은 것은?","o":["기관은 반드시 체인으로만 묶어야 한다.","노끈 및 밧줄은 무조건 굵은 것을 사용한다.","가는 철선이나 체인으로 기관을 묶어도 좋다.","체인 및 리프팅은 중심부에 튼튼히 매어야 한다."],"a":3,"e":{"w":["체인으로만 묶어야 하는 것은 아닙니다. 전용 고리나 슬링을 씁니다.","굵기보다 하중에 맞는 강도가 중요합니다.","가는 철선은 끊어질 수 있습니다."],"d":"기관을 들어 올릴 때는 무게 중심을 맞추어 튼튼하게 매야 합니다. 중심이 맞지 않으면 기울어지거나 떨어집니다."}},{"q":"이동식 및 휴대용 전동기기의 안전한 작업 방법으로 틀린 것은?","o":["전동기의 코드선은 접지선이 설치된 것을 사용한다.","회로시험기로 절연상태를 점검한다.","감전방지용 누전차단기를 접속하고 동작 상태를 점검한다.","감전사고 위험이 높은 곳에서는 1중 절연 구조의 전기기기를 사용한다."],"a":3,"e":{"w":["접지선이 있는 코드를 사용합니다. 옳은 방법입니다.","회로시험기로 절연상태를 점검합니다. 옳은 방법입니다.","누전차단기를 접속하고 동작 상태를 점검합니다. 옳은 방법입니다."],"d":"감전 위험이 높은 곳에서는 절연을 두 겹으로 한 이중 절연 구조의 전기기기를 써야 합니다. 1중 절연으로는 부족합니다."}},{"q":"산업 재해는 생산 활동을 행하는 중에 에너지와 충돌하여 생명의 기능이나( )를 상실하는 현상을 말한다. ( )에 알맞은 말은?","o":["작업상 업무","작업조건","노동 능력","노동 환경"],"a":2,"e":{"w":["작업상 업무는 정의에 들어가는 말이 아닙니다.","작업조건은 정의에 들어가는 말이 아닙니다.","노동 환경은 정의에 들어가는 말이 아닙니다."],"d":"산업 재해는 일하는 중에 사고를 당해 생명을 잃거나 일할 수 있는 능력(노동 능력)을 잃는 것을 말합니다."}},{"q":"감전 위험이 있는 곳에 전기를 차단하여 우선 점검을 할 때의 조치와 관계가 없는 것은?","o":["스위치 박스에 통전장치를 한다.","위험에 대한 방지장치를 한다.","스위치에 안전장치를 한다.","필요한 곳에 통전금지 기간에 관한 사항을 게시한다."],"a":0,"e":{"w":["위험에 대한 방지장치를 합니다. 필요한 조치입니다.","스위치에 안전장치(잠금)를 합니다. 필요한 조치입니다.","통전금지 기간을 필요한 곳에 게시합니다. 필요한 조치입니다."],"d":"전기를 끊고 점검할 때는 다른 사람이 스위치를 올리지 못하게 해야 합니다. 스위치 박스에 전기를 통하게 하는 통전장치를 하는 것은 반대되는 조치입니다."}},{"q":"감전 사고를 방지하는 방법이 아닌 것은?","o":["차광용 안경을 착용한다.","반드시 절연 장갑을 착용한다.","물기가 있는 손으로 작업하지 않는다.","고압이 흐르는 부품에는 표시를 한다."],"a":0,"e":{"w":["절연 장갑을 착용합니다. 감전 방지 방법입니다.","물기 있는 손으로 작업하지 않습니다. 감전 방지 방법입니다.","고압이 흐르는 부품에 표시를 합니다. 감전 방지 방법입니다."],"d":"차광용 안경은 용접의 강한 빛에서 눈을 보호하는 보호구입니다. 감전을 막지는 못합니다."}},{"q":"엔진작업에서 실린더 헤드볼트를 올바르게 풀어내는 방법은?","o":["반드시 토크렌치를 사용한다.","풀기 쉬운 것부터 푼다.","바깥쪽에서 안쪽을 향하여 대각선 방향으로 푼다.","시계방향으로 차례대로 푼다."],"a":2,"e":{"w":["토크렌치는 조일 때 쓰는 공구입니다.","풀기 쉬운 것부터 풀면 헤드가 변형됩니다.","한쪽부터 차례대로 풀면 헤드가 변형됩니다."],"d":"헤드볼트는 바깥쪽에서 안쪽을 향해 대각선 방향으로 조금씩 나누어 풉니다. 조일 때는 반대로 안쪽에서 바깥쪽으로 조입니다. 헤드가 뒤틀리는 것을 막기 위해서입니다."}},{"q":"호이스트 사용시 안전사항 중 틀린 것은?","o":["규격이상의 하중을 걸지 않는다.","무게 중심 바로 위에서 달아 올린다.","사람이 짐에 타고 운반하지 않는다.","운반중에는 물건이 흔들리지 않도록 짐에 타고 운반한다."],"a":3,"e":{"w":["규격 이상의 하중을 걸지 않습니다. 옳은 사항입니다.","무게 중심 바로 위에서 달아 올립니다. 옳은 사항입니다.","사람이 짐에 타고 운반하지 않습니다. 옳은 사항입니다."],"d":"매달린 짐에 사람이 타면 떨어져 크게 다칩니다. 어떤 경우에도 짐에 타면 안 됩니다."}},{"q":"정비용 기계의 검사, 유지, 수리에 대한 내용으로 틀린 것은?","o":["동력기계의 급유 시에는 서행한다.","동력기계의 이동장치에는 동력 차단장치를 설치한다.","동력 차단장치는 작업자 가까이에 설치한다.","청소할 때는 운전을 정지한다."],"a":0,"e":{"w":["동력기계의 이동장치에는 동력 차단장치를 설치합니다. 옳은 내용입니다.","동력 차단장치는 작업자 가까이에 설치합니다. 옳은 내용입니다.","청소할 때는 운전을 정지합니다. 옳은 내용입니다."],"d":"움직이는 기계에 급유하면 옷이나 손이 말려 들어갈 수 있습니다. 급유할 때는 서행이 아니라 기계를 완전히 정지시켜야 합니다."}},{"q":"제3종 유기용제 취급장소의 색표시는?","o":["빨강","노랑","파랑","녹색"],"a":2,"e":{"w":["빨강은 제1종 유기용제의 색표시입니다.","노랑은 제2종 유기용제의 색표시입니다.","녹색은 유기용제 색표시에 쓰지 않습니다."],"d":"유기용제 취급장소는 종류에 따라 색으로 표시합니다. 제1종은 빨강, 제2종은 노랑, 제3종은 파랑입니다."}},{"q":"공기기구 사용에서 적합하지 않은 것은?","o":["공기기구의 활동부위에는 윤활유가 묻지 않게 할 것","공기기구를 사용할 때는 보호안경을 사용할 것","고무호스가 꺾여 공기가 새는 일이 없도록 할 것","공기기구의 반동으로 생길 수 있는 사고를 미연에 방지할 것"],"a":0,"e":{"w":["보호안경을 사용합니다. 적합한 내용입니다.","호스가 꺾여 공기가 새지 않게 합니다. 적합한 내용입니다.","반동으로 생길 수 있는 사고를 미리 막습니다. 적합한 내용입니다."],"d":"공기기구는 움직이는 부분에 윤활유를 넣어 주어야 마모와 녹을 막을 수 있습니다. 윤활유가 묻지 않게 한다는 ①이 적합하지 않습니다."}},{"q":"구급처치 중에서 환자의 상태를 확인하는 사항과 관련이 없는 것은?","o":["의식","상처","출혈","안정"],"a":3,"e":{"w":["의식이 있는지 확인합니다.","상처가 있는지 확인합니다.","출혈이 있는지 확인합니다."],"d":"구급처치에서는 환자의 의식, 호흡, 상처, 출혈을 확인합니다. 안정은 확인하는 사항이 아니라 환자에게 취해 주는 조치입니다."}},{"q":"정비공장에서 엔진을 이동시키는 방법 가운데 가장 적합한 방법은?","o":["체인 블록이나 호이스트를 사용한다.","지렛대로 이용한다.","로프를 묶고 잡아당긴다.","사람이 들고 이동한다."],"a":0,"e":{"w":["지렛대로는 무거운 엔진을 안전하게 옮길 수 없습니다.","로프로 끌면 엔진이 손상되고 넘어질 수 있습니다.","사람이 들면 허리를 다치거나 떨어뜨립니다."],"d":"엔진은 무겁습니다. 체인 블록이나 호이스트로 들어 올려 옮기는 것이 가장 안전합니다."}}]}]</script>

/* 새 문제 뽑기: 아직 안 푼 문제를 먼저, 다 풀었으면 기록을 비우고 처음부터 */
function drawNew(part){
  var seen=loadSeen(part.id), set={}; seen.forEach(function(id){set[id]=1;});
  var n=Math.min(SIZE,part.qs.length);
  var fresh=shuffle(part.qs.filter(function(q){return !set[q.id];}));
  var picked=fresh.slice(0,n);
  if(picked.length<n){
    var used={}; picked.forEach(function(q){used[q.id]=1;});
    var rest=shuffle(part.qs.filter(function(q){return !used[q.id];})).slice(0,n-picked.length);
    saveSeen(part.id,[]); picked=picked.concat(rest);
  }
  return shuffle(picked);
}

var SINO=['영','일','이','삼','사','오','육','칠','팔','구'];
function sinoInt(s){
  s=s.replace(/^0+(?=\d)/,''); var n=parseInt(s,10); if(!n) return '영';
  if(s.length>12) return s.split('').map(function(d){return SINO[+d];}).join('');
  function four(k){ var r='',u=['','십','백','천'],d=String(k).split('').reverse();
    for(var i=d.length-1;i>=0;i--){ var v=+d[i]; if(!v) continue; r+=(v===1&&i>0?'':SINO[v])+u[i]; } return r; }
  var out='',eok=Math.floor(n/100000000),man=Math.floor(n%100000000/10000),rest=n%10000;
  if(eok) out+=four(eok)+'억'; if(man) out+=(man===1?'':four(man))+'만'; if(rest) out+=four(rest); return out;
}
function sinoNum(s){
  s=s.replace(/,/g,''); var p=s.split('.');
  if(p.length===1){ return (/^0\d/.test(s))?s.split('').map(function(d){return SINO[+d];}).join(''):sinoInt(s); }

}

var UKEYS=Object.keys(UNIT).sort(function(a,b){return b.length-a.length;});
var UATOM=UKEYS.map(function(k){return k.replace(/[()°]/g,'\\$&');}).join('|');

var ATOM_RE=new RegExp('([/·])?('+UATOM+')','g');
var COUNTER='개(?!월|소|정|폐)|가지|배(?!기|터|출|선|전|압)|장(?!치|착|행|력)|명|곳|바퀴|겹|줄(?!이)|군데|쌍|번째';
function ko(t){
  t=String(t).replace(/[①②③④]/g,function(c){return ' '+SINO['①②③④'.indexOf(c)+1]+' 번 ';});
  t=t.replace(/-(\d[\d.]*)\s?(℃|°F)/g,'영하 $1$2');
  t=t.replace(/\b\d(?:-\d)+\b/g,function(m){return m.replace(/-/g,' ');});
  t=t.replace(/(\d)\s*[~∼]\s*(?=\d)/g,'$1 에서 ');
  t=t.replace(/(\d)\s*[:：]\s*(?=\d)/g,'$1 대 ');
  t=t.replace(UNIT_RE,function(_,num,unit,sq){
    var u=unit.replace(ATOM_RE,function(__,sep,a){ var r=UNIT[a];
      if(sep==='/'){ if(a==='s'||a==='sec') r='세컨드'; if(a==='h') r='아워'; return ' 퍼 '+r; } return (sep?' ':'')+r; });
    return sinoNum(num)+' '+u+(sq?' 제곱':'')+' ';

    if(n<1) return pre+'영 '+c; if(c==='번째'&&n===1) return pre+'첫 번째'; return pre+natNum(n)+' '+c; });

  t=t.replace(/²/g,' 제곱').replace(/³/g,' 세제곱').replace(/×/g,' 곱하기 ').replace(/÷/g,' 나누기 ').replace(/\s=\s/g,' 는 ').replace(/\s\+\s/g,' 더하기 ').replace(/\s-\s/g,' 빼기 ');
  t=t.replace(/㎠/g,'제곱센티미터').replace(/㎤/g,'세제곱센티미터').replace(/㎜/g,'밀리미터').replace(/℃/g,'도').replace(/[%％]/g,'퍼센트').replace(/Ω/g,'옴');
  t=t.replace(/육월/g,'유월').replace(/(^|[^가-힣])십월/g,'$1시월');
  return t.replace(/\s+([,.])/g,'$1').replace(/\s{2,}/g,' ');
}

function speakQ(){

  S.res={correct:correct,wrong:wrong,score:scoreOf(correct,n),time:Date.now()-S.t0,filter:wrong.length?'wrong':'all'};
  renderResult(); window.scrollTo(0,0);
}

function renderResult(){
  var R=S.res, n=S.qs.length, pass=R.score>=PASS; app.textContent='';
  var st=el('div','status'); var l=el('span'); l.appendChild(el('b',null,S.part.name)); l.appendChild(document.createTextNode(S.mode==='retry'?' · 틀린 문제 다시 풀기 결과':' · 채점 결과')); st.appendChild(l);
  st.appendChild(el('span','mono','걸린 시간 '+fmt(R.time))); app.appendChild(st);
  if(S.mode==='trial'&&!unlocked()){ var ct=el('section','rev trial'); ct.appendChild(el('b',null,'맛보기 5문제를 모두 풀었습니다')); ct.appendChild(el('p','lead','6번째 문제부터는 네이버 카페에 가입해야 풀 수 있습니다. 가입하면 1,400여 문제와 오답분석, 문제해설을 모두 이용할 수 있습니다.')); var rw0=el('div','grow'); var ca=document.createElement('a'); ca.className='btn pri gbtn'; ca.href=CAFE_URL; ca.target='_blank'; ca.rel='noopener'; ca.textContent='네이버 카페 가입하러 가기'; var cb=el('button','btn','입장 코드 넣기'); cb.type='button'; cb.addEventListener('click',gate); rw0.appendChild(ca); rw0.appendChild(cb); ct.appendChild(rw0); app.appendChild(ct); }

  var sc=el('section','score'+(pass?' pass':''));
  var big=el('div','big',String(R.score)); big.appendChild(el('small',null,'점')); sc.appendChild(big);
  var d=el('div'); d.appendChild(el('div','verdict',pass?'합격':'불합격'));
  d.appendChild(el('div','det',n+'문제 중 '+R.correct+'문제 정답, '+R.wrong.length+'문제 오답 · 합격 기준 '+PASS+'점'));
  sc.appendChild(d); app.appendChild(sc);

  var ac=el('div','actions');
  var b1=el('button','btn','틀린 문제 다시 풀기'+(R.wrong.length?' ('+R.wrong.length+'문제)':'')); b1.type='button'; b1.disabled=!R.wrong.length;
  b1.addEventListener('click',function(){ start(S.part,shuffle(R.wrong),'retry'); });
  var b2=el('button','btn pri','새로운 문제 풀기'); b2.type='button'; b2.addEventListener('click',function(){ start(S.part,drawNew(S.part),'new'); });
  var b3=el('button','btn ghost','다른 파트 고르기'); b3.type='button'; b3.addEventListener('click',home);
  ac.appendChild(b1); ac.appendChild(b2); ac.appendChild(b3); app.appendChild(ac);

  app.appendChild(el('h2',null,'정답 확인'));
  var om=el('div','omr'); om.style.marginBottom='14px';
  S.qs.forEach(function(q,i){ var ok=S.ans[i]===q.a; var b=el('button',ok?'ok':'no',String(i+1)); b.type='button';
    b.setAttribute('aria-label',(i+1)+'번 '+(ok?'정답':'오답'));
    b.addEventListener('click',function(){ if(!ok||R.filter==='all'){ var t=document.getElementById('rev'+i); if(t) t.scrollIntoView({block:'start'}); } else { R.filter='all'; renderResult(); var t2=document.getElementById('rev'+i); if(t2) t2.scrollIntoView({block:'start'}); } });
    om.appendChild(b); });
  app.appendChild(om);
  var tabs=el('div','tabs');
  [['wrong','틀린 문제만'],['all','전체 문제']].forEach(function(t){ var b=el('button',R.filter===t[0]?'on':'',t[1]); b.type='button'; b.setAttribute('aria-pressed',R.filter===t[0]?'true':'false');
    b.addEventListener('click',function(){R.filter=t[0];renderResult();}); tabs.appendChild(b); });
  app.appendChild(tabs);
  var shown=0;
  S.qs.forEach(function(q,i){
    var ok=S.ans[i]===q.a; if(R.filter==='wrong'&&ok) return; shown++;
    var r=el('article','rev'); r.id='rev'+i;
    var h=el('div','qno','문제 '+(i+1)+(S.part.id==='all'?'  ·  '+q.part:'')); h.appendChild(el('span','tag '+(ok?'ok':'no'),ok?'정답':(S.ans[i]===null?'답하지 않음':'오답'))); r.appendChild(h);
    r.appendChild(el('p','stem',q.q));
    if(q.x){ var bx=el('div','box'); q.x.forEach(function(x){bx.appendChild(el('p',null,x));}); r.appendChild(bx); }
    var ol=el('ol');
    q.o.forEach(function(t,k){ var li=el('li',k===q.a?'ans':(k===S.ans[i]?'mine':'')); li.appendChild(el('span','mk',CIRC[k])); li.appendChild(el('span',null,t));
      if(k===q.a) li.appendChild(el('span','lab','정답')); else if(k===S.ans[i]) li.appendChild(el('span','lab','내가 고른 답')); ol.appendChild(li); });
    r.appendChild(ol);
    if(q.e){
      var det=(typeof q.e==='string')?q.e:q.e.d;
      if(q.e.w){ var wx=el('div','exp wrong'); wx.appendChild(el('b',null,'[오답분석]')); var wi=0;
        q.o.forEach(function(_,k){ if(k===q.a) return; var pw=el('p'); pw.appendChild(el('span','mk',CIRC[k]+' ')); pw.appendChild(document.createTextNode(q.e.w[wi]||'')); wi++; wx.appendChild(pw); });
        r.appendChild(wx); }
      var ex=el('div','exp'); ex.appendChild(el('b',null,'[문제해설]')); ex.appendChild(el('p',null,det)); if(q.e.g&&FIG[q.e.g]){ var fg=document.createElement('figure'); fg.className='fig'; fg.innerHTML=FIG[q.e.g].s; fg.appendChild(el('figcaption',null,FIG[q.e.g].c)); ex.appendChild(fg); } if(q.e.p){ q.e.p.forEach(function(id){ var ph=PHOTO[id]; if(!ph) return; var pf=document.createElement('figure'); pf.className='fig photo'; var im=document.createElement('img'); im.loading='lazy'; im.alt=ph.c; im.src=ph.u; im.addEventListener('error',function(){ pf.style.display='none'; }); pf.appendChild(im); var fc=el('figcaption',null,ph.c+'\n'); var al=document.createElement('a'); al.href=ph.p; al.target='_blank'; al.rel='noopener'; al.textContent='출처: '+ph.a; fc.appendChild(al); pf.appendChild(fc); ex.appendChild(pf); }); } if(q.e.k&&q.e.k.length){ var kb=el('div','key'); kb.appendChild(el('b',null,'핵심 암기')); var ul=document.createElement('ul'); q.e.k.forEach(function(x){ ul.appendChild(el('li',null,x)); }); kb.appendChild(ul); ex.appendChild(kb); } r.appendChild(ex);
    }
    if(FB_ON){ r.appendChild(fbBox(S.part.id==='all'?q.part:S.part.name,q)); }
    app.appendChild(r);
  });
  if(!shown) app.appendChild(el('p','lead','틀린 문제가 없습니다. 모두 맞혔습니다.'));
}

function fromHash(){ var id=(location.hash||'').replace('#',''); var p=id&&partById(id); if(p){ start(p,drawNew(p),'new'); return true; } return false; }
window.addEventListener('hashchange',function(){ if(!fromHash()&&!location.hash) home(); });
if(!fromHash()) home();
})();

(function(){
  function editable(t){ return t&&(t.tagName==='TEXTAREA'||t.tagName==='INPUT'); }
  ['contextmenu','copy','cut','dragstart','selectstart'].forEach(function(ev){
    document.addEventListener(ev,function(e){ if(!editable(e.target)) e.preventDefault(); });
  });
  document.addEventListener('keydown',function(e){
    if(!(e.ctrlKey||e.metaKey)) return;
    var k=(e.key||'').toLowerCase();
    if(k==='p'||k==='s'||k==='u'){ e.preventDefault(); return; }
    if((k==='c'||k==='x'||k==='a')&&!editable(e.target)) e.preventDefault();
  });
})();
</script>
