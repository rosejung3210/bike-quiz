생기는 소용돌이의 수로 공기량을 잽니다.","열선식은 열선이 식는 정도로 공기량을 잽니다."],"d":"공기유량 센서에는 베인식, 칼만 와류식, 열선식, 열막식이 있습니다. 볼 순환식은 조향장치에 쓰는 말이지 공기유량 센서의 종류가 아닙니다."}},{"q":"기관의 윤활장치에서 유압조절밸브는 어떤 작용을 하는가?","o":["기관의 부하량에 따라 압력을 조절한다.","기관 오일량이 부족할 때 압력을 상승시킨다.","불충분한 오일량을 방지한다.","유압이 높아지는 것을 방지한다."],"a":3,"e":{"w":["부하량에 따라 압력을 조절하는 것이 아닙니다.","오일이 부족할 때 압력을 올리지 못합니다.","오일량을 채워 주는 장치가 아닙니다."],"d":"유압조절밸브는 유압이 정해진 값보다 높아지면 열려 오일을 오일 팬으로 되돌려 보냅니다. 유압이 지나치게 높아지는 것을 막습니다."}},{"q":"실린더의 지름이 100㎜, 행정이 100㎜인 1기통 기관의 배기량은?","o":["78.5cc","785cc","1000cc","1273cc"],"a":1,"e":{"w":["78.5cc는 단위 환산을 잘못한 값입니다.","1000cc는 계산과 맞지 않습니다.","1273cc는 계산과 맞지 않습니다."],"d":"배기량 = 0.785 × 내경² × 행정입니다. cm 단위로 바꾸어 계산합니다.\n0.785 × 10² × 10 = 785cc"}},{"q":"기관의 옥탄가 측정에서 이소옥탄 70%, 노말헵탄 30%일 때 옥탄가는?","o":["30%","60%","70%","90%"],"a":2,"e":{"w":["30%는 노말헵탄의 비율입니다.","60%는 계산과 맞지 않습니다.","90%는 계산과 맞지 않습니다."],"d":"옥탄가 = 이소옥탄 ÷ (이소옥탄 + 노말헵탄) × 100입니다.\n70 ÷ (70 + 30) × 100 = 70"}},{"q":"가변흡기장치(variable induction control system)의 설치 목적으로 가장 적당한 것은?","o":["최고속 영역에서 최대출력의 감소로 엔진보호","공전속도 증대","저속과 고속에서 흡입효율 증대","엔진 회전수증대"],"a":2,"e":{"w":["출력을 줄이려는 장치가 아닙니다.","공전속도와는 관계가 없습니다.","회전수를 높이려는 장치가 아닙니다."],"d":"가변흡기장치는 저속에서는 흡기 통로를 길고 가늘게, 고속에서는 짧고 굵게 바꿉니다. 저속과 고속 모두에서 흡입효율을 높입니다."}},{"q":"이모빌라이져 장치에서 엔진 시동을 제어하는 장치가 아닌 것은?","o":["점화장치","충전장치","연료장치","시동장치"],"a":1,"e":{"w":["점화를 차단해 시동을 막습니다.","연료를 차단해 시동을 막습니다.","시동 모터를 차단해 시동을 막습니다."],"d":"이모빌라이저는 등록된 키가 아니면 점화, 연료, 시동 회로를 차단해 시동이 걸리지 않게 하는 도난 방지 장치입니다. 충전장치는 제어 대상이 아닙니다."}},{"q":"크랭크 각 센서의 설명 중 틀린 것은?","o":["기관 회전수와 크랭크축의 위치를 감지한다.","기본연료 분사량과 기본점화시기에 영향을 준다.","고장 발생시 곧바로 정지된다.","고장발생시 대체 센서 값을 이용한다."],"a":3,"e":{"w":["엔진 회전수와 크랭크축 위치를 감지합니다. 옳은 설명입니다.","기본 연료 분사량과 기본 점화시기를 정하는 기준 신호입니다. 옳은 설명입니다.","고장 나면 분사와 점화의 기준이 없어져 엔진이 정지합니다. 옳은 설명입니다."],"d":"크랭크각 센서는 분사와 점화의 기준이 되는 가장 중요한 센서입니다. 대신할 센서가 없어 고장 나면 엔진이 멈춥니다. 대체 센서 값을 이용한다는 ④가 틀렸습니다."}},{"q":"피스톤 헤드부의 고열이 스커트부로 전달되는 것을 차단하는 역할을 하는 것은?","o":["옵셋 피스톤","링캐리어","솔리드 형","히트댐"],"a":3,"e":{"w":["옵셋 피스톤은 핀 위치를 중심에서 옮겨 측압을 줄인 피스톤입니다.","링캐리어는 링 홈의 마모를 막으려고 넣는 보강재입니다.","솔리드 형은 스커트에 홈이 없는 통짜 피스톤입니다."],"d":"히트댐은 피스톤 헤드와 첫 번째 링 홈 사이에 판 가는 홈입니다. 헤드의 높은 열이 스커트 쪽으로 전달되는 것을 막습니다."}},{"q":"전자제어 연료분사기관에 대한 설명 중 틀린 것은?","o":["흡기온도 센서는 흡기온도 상승시 센서의 저항값은 작아진다.","스로틀 밸브 스위치 접촉저항은 약 0Ω이 정상이다.","공기유량 센서는 공기량을 계측하여 기본연료 분사시간을 결정한다.","수온센서의 저항은 온도가 상승하면서 저항값은 커진다."],"a":3,"e":{"w":["흡기온도 센서는 온도가 오르면 저항이 작아집니다. 옳은 설명입니다.","스위치 접점이 붙었을 때 저항은 약 0Ω입니다. 옳은 설명입니다.","공기유량 센서의 값으로 기본 연료 분사시간을 정합니다. 옳은 설명입니다."],"d":"수온센서는 온도가 오르면 저항이 작아지는 부특성(NTC) 서미스터입니다. 저항이 커진다는 ④가 틀렸습니다."}},{"q":"흡입장치의 구성요소에 해당하지 않는 것은?","o":["공기청정기","서지탱크","레조네이터","촉매장치"],"a":3,"e":{"w":["공기청정기는 흡입 공기의 먼지를 거르는 흡입장치입니다.","서지탱크는 흡입 공기를 모았다가 나누어 주는 흡입장치입니다.","레조네이터는 흡입 소음을 줄이는 흡입장치입니다."],"d":"촉매장치는 배기가스의 유해 물질을 줄이는 배기장치입니다. 흡입장치가 아닙니다."}},{"q":"공냉식 엔진에서 냉각효과를 증대시키기 위한 장치로서 적합한 것은?","o":["방열밸브","방열초크","방열탱크","방열핀"],"a":3,"e":{"w":["방열밸브라는 장치는 없습니다.","방열초크라는 장치는 없습니다.","방열탱크라는 장치는 없습니다."],"d":"공랭식 엔진은 실린더와 헤드 바깥에 얇은 방열핀을 여러 겹 만듭니다. 공기와 닿는 면적이 넓어져 열이 잘 빠져나갑니다."}},{"q":"가솔린 기관의 노킹방지책이 아닌 것은?","o":["고 옥탄가의 연료를 사용한다.","동일 압축비에서 혼합기의 온도를 낮추는 연소실 형상을 사용한다.","화염전파 속도가 빠른 연료를 사용한다.","화염의 전파거리를 길게 하는 연소실 형상을 사용한다."],"a":3,"e":{"w":["옥탄가가 높은 연료는 노킹을 막습니다.","혼합기 온도를 낮추면 노킹을 막습니다.","화염이 빨리 퍼지면 노킹을 막습니다."],"d":"화염이 가야 할 거리가 길면 끝부분의 혼합기가 화염이 닿기 전에 스스로 터집니다. 화염 전파거리는 짧게 해야 노킹을 막을 수 있습니다."}},{"q":"가솔린 기관에서 배기가스에 산소량이 많이 존재하고 있다면 연소실내의 혼합기는 어떤 상태인가?","o":["농후하다.","희박하다.","농후하기도 하고 희박하기도 하다.","이론공연비 상태이다."],"a":1,"e":{"w":["농후하면 산소가 모두 쓰여 배기가스에 산소가 적습니다.","한 가지 상태로 판단할 수 있습니다.","이론공연비에서는 산소가 거의 남지 않습니다."],"d":"배기가스에 산소가 많이 남아 있다는 것은 연료에 비해 공기가 많았다는 뜻입니다. 혼합기가 희박한 상태입니다."}},{"q":"크랭크축 메인 베어링의 오일 간극을 점검 및 측정할 때 필요한 장비가 아닌 것은?","o":["마이크로미터","시크니스 게이지","시임 스톡 방식","플라스틱 게이지"],"a":1,"e":{"w":["마이크로미터로 저널의 지름을 재어 간극을 계산합니다.","심 스톡 방식은 얇은 판을 끼워 간극을 확인하는 방법입니다.","플라스틱 게이지는 눌린 폭으로 간극을 읽습니다."],"d":"시크니스 게이지(틈새 게이지)는 평평한 틈을 재는 도구입니다. 둥근 저널과 베어링 사이의 오일 간극은 잴 수 없습니다."}},{"q":"가솔린 기관에서 체적효율을 향상시키기 위한 방법으로 틀린 것은?","o":["흡기온도의 상승을 억제한다.","흡기저항을 감소시킨다.","배기저항을 감소시킨다.","밸브 수를 줄인다."],"a":3,"e":{"w":["흡기온도가 낮아야 공기 밀도가 커져 많이 들어옵니다. 옳은 방법입니다.","흡기 저항을 줄이면 공기가 잘 들어옵니다. 옳은 방법입니다.","배기 저항을 줄이면 배기가스가 잘 빠져 새 공기가 잘 들어옵니다. 옳은 방법입니다."],"d":"밸브 수를 늘려야 통로 면적이 넓어져 체적효율이 좋아집니다. 밸브 수를 줄이면 체적효율이 떨어집니다."}},{"q":"커넥팅로드 대단부의 배빗메탈의 주재료는?","o":["주석(Sn)","안티몬(Sb)","구리(Cu)","납(Pb)"],"a":0,"e":{"w":["안티몬은 소량 들어가는 성분입니다.","구리는 소량 들어가는 성분입니다.","납이 주재료인 것은 켈밋 메탈입니다."],"d":"배빗메탈은 주석(Sn)이 80~90%를 차지하고 여기에 안티몬과 구리를 섞은 베어링 합금입니다."}},{"q":"평균유효압력이 4kgf/cm², 행정체적이 300cc인 2행정 사이클 단기통 기관 에서 1회의 폭발로 몇 kgf ․ m의 일을 하는가?","o":["6","8","10","12"],"a":3,"e":{"w":["6은 계산과 맞지 않습니다.","8은 계산과 맞지 않습니다.","10은 계산과 맞지 않습니다."],"d":"일 = 평균유효압력 × 행정체적입니다.\n4kgf/cm² × 300cm³ = 1,200kgf·cm = 12kgf·m"}},{"q":"피스톤의 평균속도를 올리지 않고 회전수를 높일 수 있으며 단위체적당 출력을 크게 할 수 있는 기관은?","o":["장 행정기관","정방형 기관","단 행정기관","고속형 기관"],"a":2,"e":{"w":["장행정 기관은 같은 회전수에서 피스톤 속도가 빠릅니다.","정방형 기관은 행정과 내경이 같은 기관입니다.","고속형 기관이라는 분류는 없습니다."],"d":"단행정 기관은 행정이 짧아 피스톤이 움직이는 거리가 짧습니다. 피스톤 속도를 올리지 않고도 회전수를 높일 수 있어 단위체적당 출력이 큽니다."}},{"q":"가솔린 기관의 밸브간극이 규정 값보다 클 때 어떤 현상이 일어나는가?","o":["정상 작동온도에서 밸브가 완전하게 개방되지 않는다.","소음이 감소하고 밸브기구에 충격을 준다.","흡입밸브 간극이 크면 흡입량이 많아진다.","기관의 체적효율이 증대된다."],"a":0,"e":{"w":["간극이 크면 부딪치는 소음이 커집니다.","밸브가 덜 열려 흡입량이 줄어듭니다.","흡입량이 줄어 체적효율이 떨어집니다."],"d":"밸브간극이 크면 캠이 그 틈만큼 헛돌고 나서 밸브를 밉니다. 정상 온도에서도 밸브가 늦게 열리고 완전히 열리지 않습니다."}},{"q":"전자제어 가솔린 기관의 실린더 헤드 볼트를 규정토크로 조이지 않았을 때 발생하는 현상으로 거리가 먼 것은?","o":["냉각수의 누출","스로틀 밸브의 고착","실린더 헤드의 변형","압축가스의 누설"],"a":1,"e":{"w":["개스킷이 밀착되지 않아 냉각수가 샙니다. 발생하는 현상입니다.","고르게 조이지 않으면 헤드가 변형됩니다. 발생하는 현상입니다.","압축가스가 샙니다. 발생하는 현상입니다."],"d":"스로틀 밸브는 흡기 통로에 있는 부품이라 헤드 볼트의 조임과 관계가 없습니다."}},{"q":"피스톤과 관련된 점검사항으로 틀린 것은?","o":["피스톤 중량","피스톤의 마모 및 균열","피스톤과 실린더 간극","피스톤 오일링 홈의 구멍크기"],"a":3,"e":{"w":["피스톤 중량은 점검사항입니다. 실린더마다 무게 차이가 작아야 합니다.","마모와 균열은 점검사항입니다.","피스톤과 실린더의 간극은 점검사항입니다."],"d":"피스톤은 무게, 마모와 균열, 실린더와의 간극, 링 홈의 간극을 점검합니다. 오일링 홈의 구멍 크기는 점검사항이 아닙니다."}},{"q":"윤활유 소비 증대의 가장 큰 원인이 되는 것은?","o":["비산과 누설","비산과 압력","희석과 혼합","연소와 누설"],"a":3,"e":{"w":["비산은 오일이 튀는 것으로 소비의 큰 원인이 아닙니다.","압력은 소비의 원인이 아닙니다.","희석과 혼합은 오일이 변질되는 원인입니다."],"d":"윤활유가 줄어드는 가장 큰 원인은 연소실로 올라가 타는 것(연소)과 밖으로 새는 것(누설)입니다."}},{"q":"노크센서는 무엇으로 노킹을 판단하는가?","o":["배기 소음","배출 가스 압력","엔진 블록의 진동","흡기 다기관의 진공"],"a":2,"e":{"w":["배기 소음으로 판단하지 않습니다.","배출 가스 압력으로 판단하지 않습니다.","흡기 다기관의 진공으로 판단하지 않습니다."],"d":"노킹이 일어나면 엔진 블록이 특유의 진동수로 떨립니다. 노크센서 안의 압전 소자가 이 진동을 전압으로 바꾸어 ECU에 보냅니다."}},{"q":"기관의 회전속도 4500rpm 이다. 연소지연시간은 1/500초라고 하면 연소지연시간 동안에 크랭크축의 회전각은?","o":["45도","50도","52도","54도"],"a":3,"e":{"w":["45도는 계산과 맞지 않습니다.","50도는 계산과 맞지 않습니다.","52도는 계산과 맞지 않습니다."],"d":"1초 동안의 회전각 = 4500 ÷ 60 × 360° = 27,000°\n연소지연시간 동안의 회전각 = 27,000° × 1/500 = 54°"}},{"q":"가솔린 기관의 노킹을 방지하기 위한 방법이 아닌 것은?","o":["화염전파속도를 빠르게 한다.","냉각수 온도를 낮춘다.","옥탄가가 높은 연료를 사용한다.","혼합가스의 와류를 방지한다."],"a":3,"e":{"w":["화염이 빨리 퍼지면 노킹을 막습니다. 방지 방법입니다.","냉각수 온도를 낮추면 노킹을 막습니다. 방지 방법입니다.","옥탄가가 높은 연료는 노킹을 막습니다. 방지 방법입니다."],"d":"혼합가스에 와류(소용돌이)가 있어야 화염이 빨리 퍼집니다. 와류를 방지하면 화염 전파가 느려져 노킹이 더 잘 일어납니다."}},{"q":"전자제어 연료분사 가솔린 기관에서 ECU로 입력되지 않는 것은?","o":["흡기온도","외기온도","냉각수 온도","흡입 공기유량"],"a":1,"e":{"w":["흡기온도는 흡기온도 센서로 입력됩니다.","냉각수 온도는 수온센서로 입력됩니다.","흡입 공기유량은 공기유량 센서로 입력됩니다."],"d":"ECU는 엔진으로 들어오는 공기의 온도(흡기온도)를 씁니다. 바깥 공기의 온도(외기온도)는 연료분사 제어에 입력되지 않습니다."}},{"q":"전자제어 연료분사 엔진에서 연료펌프 내에 체크 밸브를 두는 중요한 이유는?","o":["베이퍼록을 방지하기 위하여","가속성을 향상시키기 위하여","연비를 좋게 하기 위하여","연료펌프 작동에 있어서 저항을 적게 받기 위하여"],"a":0,"e":{"w":["가속성과는 관계가 없습니다.","연비와는 관계가 없습니다.","펌프의 저항과는 관계가 없습니다."],"d":"체크밸브는 엔진을 끈 뒤에도 연료 라인에 압력(잔압)을 남겨 둡니다. 압력이 걸려 있으면 연료가 잘 끓지 않아 베이퍼록이 생기지 않고, 다음 시동도 빨리 걸립니다."}},{"q":"진공계로서 판단할 수 없는 것은?","o":["점화시기기의 불량","밸브의 정밀 밀착 불량","점화플러그의 실화상태","인젝터의 연료분사상태"],"a":3,"e":{"w":["점화시기가 불량하면 진공이 낮게 나옵니다. 판단할 수 있습니다.","밸브 밀착이 불량하면 바늘이 규칙적으로 흔들립니다. 판단할 수 있습니다.","점화플러그가 실화하면 바늘이 흔들립니다. 판단할 수 있습니다."],"d":"진공계는 흡기다기관의 진공으로 점화시기, 밸브 상태, 실화, 압축 누설, 배기 막힘을 판단합니다. 인젝터의 분사 상태는 알 수 없습니다."}},{"q":"가솔린 기관의 배출가스 중 인체에 가장 해로운 가스는?","o":["CO","N₂","H₂","NOx"],"a":0,"e":{"w":["질소는 공기의 주성분으로 해롭지 않습니다.","수소는 인체에 독성이 없습니다.","NOx도 해롭지만 이 문제의 정답은 중독 위험이 가장 큰 CO입니다."],"d":"일산화탄소(CO)는 혈액의 헤모글로빈과 결합해 산소 운반을 막습니다. 색과 냄새가 없어 모르는 사이에 중독되므로 가장 위험합니다."}},{"q":"DOHC 엔진의 장점이라고 할 수 없는 것은?","o":["흡입효율이 향상","허용최고 회전수의 향상","높은 연소 효율","구조가 간단하고 생산단가가 낮다."],"a":3,"e":{"w":["밸브를 4개 쓸 수 있어 흡입효율이 좋습니다. 장점입니다.","밸브 기구가 가벼워 최고 회전수를 높일 수 있습니다. 장점입니다.","점화플러그를 연소실 가운데에 둘 수 있어 연소 효율이 높습니다. 장점입니다."],"d":"DOHC는 캠축을 2개 쓰므로 구조가 복잡하고 값이 비쌉니다. 구조가 간단하고 생산단가가 낮다는 것은 장점이 될 수 없습니다."}},{"q":"가솔린 연료의 구비조건으로 맞지 않은 것은?","o":["단위 중량당 발열량이 적을 것","빠른 속도로 연소 되며 완전 연소 될 것","인화 및 폭발의 위험이 적고 가격이 저렴할 것","연소 후에 탄소 및 유해 화합물이 남지 않을 것"],"a":0,"e":{"w":["빨리 타고 완전 연소되어야 합니다. 맞는 조건입니다.","인화와 폭발의 위험이 적고 값이 싸야 합니다. 맞는 조건입니다.","타고 난 뒤 탄소와 유해 화합물이 남지 않아야 합니다. 맞는 조건입니다."],"d":"연료는 같은 무게로 많은 열을 내야 합니다. 발열량이 커야 하므로 적을 것이라는 ①이 맞지 않습니다."}},{"q":"다음 중 NOx가 가장 많이 배출되는 경우는?","o":["농후한 혼합비","감속시","고온 연소시","저온 연소시"],"a":2,"e":{"w":["농후한 혼합비에서는 CO와 HC가 많이 나옵니다.","감속할 때는 HC가 많이 나옵니다.","저온에서는 NOx가 적게 생깁니다."],"d":"NOx는 공기 중의 질소와 산소가 높은 온도에서 결합해 만들어집니다. 연소 온도가 높을수록 많이 나옵니다."}},{"q":"전자제어 연료 분사장치의 구성품 중 산소센서에 대한 설명으로 옳은 것은?","o":["흡기관에 설치되어 있으며, 흡입공기 속에 포함되어 있는 산소량을 감지한다.","흡기관에 설치되어 있으며, 흡입공기의 밀도를 감지한다.","배기관에 설치되어 있으며, 배기가스 속에 포함되어 있는 산소량을 감지한다.","배기관에 설치되어 있으며, 배기가스의 밀도를 감지한다."],"a":2,"e":{"w":["산소센서는 흡기관이 아니라 배기관에 있습니다.","산소센서는 흡기관에 있지 않고, 밀도를 감지하지도 않습니다.","밀도가 아니라 산소량을 감지합니다."],"d":"산소센서는 배기관에 달려 배기가스 속에 남아 있는 산소의 양을 감지합니다. ECU는 이 신호로 혼합기가 진한지 엷은지를 알아냅니다."}},{"q":"고속회전을 목적으로 하는 기관에서 흡기 밸브와 배기 밸브 중 어느 것이 더 크게 만들어져 있는가?","o":["흡기 밸브","배기 밸브","양 밸브의 치수는 동일하다.","1번 배기 밸브"],"a":0,"e":{"w":["배기가스는 압력이 높아 작은 밸브로도 잘 빠져나갑니다.","두 밸브의 크기는 다릅니다.","특정 실린더의 밸브만 크게 만들지 않습니다."],"d":"흡입은 피스톤이 내려가며 생기는 약한 부압으로 이루어집니다. 공기를 많이 넣으려면 통로가 넓어야 하므로 흡기 밸브를 더 크게 만듭니다."}},{"q":"전자제어 기관에서 스로틀 보디의 주 기능으로 가장 적당한 것은?","o":["공기량 조절","오일량 조절","혼합기 조절","공연비 조절"],"a":0,"e":{"w":["오일량과는 관계가 없습니다.","혼합기를 직접 조절하지 않습니다.","공연비는 ECU가 연료량으로 조절합니다."],"d":"스로틀 보디에는 스로틀 밸브가 있습니다. 이 밸브가 열리는 정도로 엔진에 들어가는 공기의 양을 조절합니다."}},{"q":"전자제어 연료 분사장치에서 운전자의 조작에 의한 신호를 컴퓨터로 보내주는 센서는?","o":["공기유량 센서","스로틀포지션 센서","맵 센서","냉각수온 센서"],"a":1,"e":{"w":["공기유량 센서는 공기량을 잽니다.","맵 센서는 흡기관의 압력을 잽니다.","냉각수온 센서는 냉각수 온도를 잽니다."],"d":"운전자가 스로틀을 얼마나 열었는지를 알려 주는 센서가 스로틀포지션 센서(TPS)입니다. 운전자의 가속 의도를 ECU에 전합니다."}},{"q":"압력식 라디에이터 캡을 사용하므로 얻어지는 장점과 거리가 먼 것은?","o":["비등점을 올려 냉각 효율을 높일 수 있다.","라디에이터를 소형화 할 수 있다.","라디에이터의 무게를 크게 할 수 있다.","냉각장치 내의 압력을 0.3∼0.7kgf/㎠ 정도 올릴 수 있다."],"a":2,"e":{"w":["비등점을 올려 냉각 효율을 높입니다. 장점입니다.","냉각 효율이 좋아져 라디에이터를 작게 만들 수 있습니다. 장점입니다.","냉각장치 안의 압력을 대기압보다 높게 유지합니다. 장점입니다."],"d":"압력식 캡을 쓰면 냉각 효율이 좋아져 라디에이터를 작고 가볍게 만들 수 있습니다. 무게를 크게 하는 것은 장점이 아닙니다."}},{"q":"4행정 가솔린 엔진의 실린더 내경 85㎜, 행정이 88㎜로서 압축비는 8.6：1 이다. 이 엔진의 연소실 체적은?","o":["65.7cc","70.5cc","175.5cc","262.7cc"],"a":0,"e":{"w":["70.5cc는 계산과 맞지 않습니다.","175.5cc는 계산과 맞지 않습니다.","262.7cc는 계산과 맞지 않습니다."],"d":"행정체적 = 0.785 × 8.5² × 8.8 = 약 499.1cc\n연소실 체적 = 행정체적 ÷ (압축비 - 1) = 499.1 ÷ 7.6 = 약 65.7cc","g":"comp"}},{"q":"단위 환산으로 맞는 것은?","o":["1 mile = 2 km","1 lb = 1.55 kgf","1 kgf·m = 1.42ft·lbf","9.81 N·m = 9.81J"],"a":3,"e":{"w":["1mile은 약 1.6km입니다.","1lb는 약 0.45kgf입니다.","1kgf·m는 약 7.23ft·lbf입니다."],"d":"1N의 힘으로 1m를 움직인 일이 1J입니다. 1N·m = 1J이므로 9.81N·m = 9.81J입니다."}},{"q":"가솔린 기관에서 노킹(knocking) 발생시 억제하는 방법은?","o":["점화시기를 빠르게 한다.","점화시기를 늦춘다.","연료 공급 압력을 높인다.","연료 공급 압력을 낮춘다."],"a":1,"e":{"w":["점화시기를 빠르게 하면 노킹이 더 심해집니다.","연료 공급 압력은 노킹 억제와 관계가 없습니다.","연료 공급 압력은 노킹 억제와 관계가 없습니다."],"d":"점화시기를 늦추면 연소 최고 압력과 온도가 낮아져 노킹이 줄어듭니다. 노크센서가 노킹을 감지하면 ECU가 점화시기를 늦춥니다."}},{"q":"다음 중 기관에 윤활유를 급유하는 목적과 관계없는 것은?","o":["연소촉진작용","동력손실 감소","마멸방지","냉각작용"],"a":0,"e":{"w":["동력손실을 줄이는 것은 급유의 목적입니다.","마멸을 막는 것은 급유의 목적입니다.","냉각작용은 급유의 목적입니다."],"d":"윤활유는 마찰을 줄이고, 식히고, 밀봉하고, 씻어 내는 일을 합니다. 연소를 돕는 작용은 하지 않습니다."}},{"q":"다음 중 최적의 공연비를 바르게 나타낸 것은?","o":["희박한 공연비","농후한 공연비","이론적으로 완전연소 가능한 혼합비","공전시 연소 가능범위의 연비"],"a":2,"e":{"w":["희박한 공연비는 출력이 떨어집니다.","농후한 공연비는 연료가 낭비되고 CO와 HC가 늘어납니다.","공전 때의 범위를 말하는 것이 아닙니다."],"d":"최적의 공연비는 연료가 이론적으로 완전히 탈 수 있는 혼합비, 곧 이론 공연비입니다. 가솔린은 약 14.7 : 1입니다."}},{"q":"열은 고온체로부터 저온체로 이동하는데 이를 열전달이라 한다. 기본적으로 열전달의 3가지 형태에 포함되지 않는 것은?","o":["전도","복사","승화","대류"],"a":2,"e":{"w":["전도는 물체를 통해 열이 전달되는 것입니다.","복사는 전자기파로 열이 전달되는 것입니다.","대류는 액체나 기체가 움직이며 열을 옮기는 것입니다."],"d":"열전달의 3가지 형태는 전도, 대류, 복사입니다. 승화는 고체가 액체를 거치지 않고 바로 기체가 되는 상태 변화입니다."}},{"q":"4행정 사이클 기관에서 크랭크축이 4회전 할 때 캠축은 몇 회전 하는가?","o":["1회전","2회전","3회전","4회전"],"a":1,"e":{"w":["1회전은 크랭크축이 2회전 할 때입니다.","3회전은 맞지 않습니다.","4회전은 크랭크축의 회전수입니다."],"d":"4행정 기관은 크랭크축이 2회전 하는 동안 흡기밸브와 배기밸브가 한 번씩 열립니다. 캠축은 크랭크축의 절반만 돕니다.\n크랭크축 4회전 ÷ 2 = 캠축 2회전"}},{"q":"피스톤에 옵셋(off set)을 두는 이유로 가장 올바른 것은?","o":["피스톤의 틈새를 크게 하기 위하여","피스톤의 중량을 가볍게 하기 위하여","피스톤의 측압을 작게 하기 위하여","피스톤 스커트부에 열전달을 방지하기 위하여"],"a":2,"e":{"w":["틈새를 크게 하려는 것이 아닙니다.","무게를 줄이려는 것이 아닙니다.","열전달을 막는 것은 히트댐입니다."],"d":"옵셋은 피스톤 핀의 위치를 중심에서 조금 옮긴 것입니다. 피스톤이 실린더 벽을 미는 힘(측압)이 줄어 피스톤 슬랩과 마모가 줄어듭니다."}},{"q":"가솔린 기관에서 고속 회전 시 토크가 낮아지는 원인으로 가장 적합한 것은?","o":["체적 효율이 낮아지기 때문이다.","화염전파 속도가 상승하기 때문이다.","공연비가 이론공연비에 근접하기 때문이다.","점화시기가 빨라지기 때문이다."],"a":0,"e":{"w":["화염전파 속도가 빨라지는 것은 토크가 낮아지는 원인이 아닙니다.","이론공연비에 가까운 것은 토크가 낮아지는 원인이 아닙니다.","점화시기가 빨라지는 것이 원인이 아닙니다."],"d":"고속에서는 밸브가 열려 있는 시간이 매우 짧아 공기가 충분히 들어오지 못합니다. 체적효율이 낮아져 한 번에 타는 혼합기가 줄어 토크가 떨어집니다."}},{"q":"공기 청정기가 막혔을 때의 배기가스 색으로 가장 알맞은 것은?","o":["무색","백색","흑색","청색"],"a":2,"e":{"w":["무색은 정상 연소의 색입니다.","백색은 오일이 타거나 냉각수가 들어갔을 때의 색입니다.","청색은 오일이 탈 때의 색입니다."],"d":"공기 청정기가 막히면 공기가 부족해 혼합기가 진해집니다. 연료가 다 타지 못해 검은(흑색) 배기가스가 나옵니다."}},{"q":"피스톤 링의 3대 작용으로 틀린 것은?","o":["와류작용","기밀작용","오일 제어작용","열전도 작용"],"a":0,"e":{"w":["기밀작용은 피스톤 링의 3대 작용입니다.","오일 제어작용은 피스톤 링의 3대 작용입니다.","열전도 작용은 피스톤 링의 3대 작용입니다."],"d":"피스톤 링의 3대 작용은 기밀 유지, 오일 제어, 열전도(냉각)입니다. 와류작용은 해당하지 않습니다."}},{"q":"연료 탱크 내장형 연료펌프(어셈블리)의 구성 부품에 해당되지 않는 것은?","o":["첵밸브","릴리프 밸브","DC모터","포토 다이오드"],"a":3,"e":{"w":["체크밸브는 잔압을 유지하는 구성 부품입니다.","릴리프 밸브는 압력이 지나치게 오르는 것을 막는 구성 부품입니다.","DC모터는 펌프를 돌리는 구성 부품입니다."],"d":"연료펌프 어셈블리는 DC모터, 펌프, 체크밸브, 릴리프 밸브로 이루어집니다. 포토 다이오드는 빛을 감지하는 소자라 연료펌프와 관계가 없습니다."}},{"q":"연소란 연료의 산화반응을 말하는데 연소에 영향을 주는 요소 중 가장 거리가 먼 것은?","o":["배기 유동과 난류","공연비","연소 온도와 압력","연소실 형상"],"a":0,"e":{"w":["공연비는 연소에 직접 영향을 줍니다.","연소 온도와 압력은 연소에 직접 영향을 줍니다.","연소실 형상은 화염이 퍼지는 데 영향을 줍니다."],"d":"연소에는 공연비, 온도와 압력, 연소실 형상, 흡입되는 혼합기의 흐름이 영향을 줍니다. 배기 유동은 연소가 끝난 뒤의 흐름이라 관계가 가장 적습니다."}},{"q":"실린더 지름이 100㎜의 정방형 엔진이다. 행정 체적은 약 얼마인가?","o":["600㎤","785㎤","1,200㎤","1,490㎤"],"a":1,"e":{"w":["600㎤는 계산과 맞지 않습니다.","1,200㎤는 계산과 맞지 않습니다.","1,490㎤는 계산과 맞지 않습니다."],"d":"정방형 엔진은 내경과 행정이 같습니다. 행정도 100mm입니다.\n행정체적 = 0.785 × 10² × 10 = 785㎤"}},{"q":"산소센서(O₂sensor)가 피드백(feedback)제어를 할 경우로 가장 적합한 것은?","o":["연료를 차단할 때","급가속 상태일 때","감속 상태일 때","대기와 배기가스 중의 산소농도 차이가 있을 때"],"a":3,"e":{"w":["연료를 차단할 때는 피드백 제어를 하지 않습니다.","급가속할 때는 출력을 위해 진하게 분사하므로 피드백 제어를 하지 않습니다.","감속할 때는 피드백 제어를 하지 않습니다."],"d":"산소센서는 대기와 배기가스의 산소 농도 차이로 전압을 만듭니다. 이 신호가 정상으로 나오는 정상 운전 상태에서 피드백 제어를 합니다."}},{"q":"가솔린 기관에서 노킹(knocking)발생시 억제하는 방법은?","o":["혼합비를 희박하게 한다.","점화시기를 지각 시킨다.","옥탄가가 낮은 연료를 사용한다.","화염전파 속도를 느리게 한다."],"a":1,"e":{"w":["희박하게 하는 것은 억제 방법이 아닙니다.","옥탄가가 낮은 연료는 노킹이 더 잘 일어납니다.","화염전파가 느리면 노킹이 더 잘 일어납니다."],"d":"점화시기를 늦추면(지각) 연소 최고 압력과 온도가 낮아져 노킹이 억제됩니다."}},{"q":"표준 대기압의 표기로 옳은 것은?","o":["735㎜Hg","0.85kgf/㎠","101.3kPa","10bar"],"a":2,"e":{"w":["표준 대기압은 760mmHg입니다.","표준 대기압은 약 1.03kgf/㎠입니다.","표준 대기압은 약 1.013bar입니다."],"d":"표준 대기압(1기압) = 760mmHg = 약 1.03kgf/㎠ = 101.3kPa = 약 1.013bar입니다."}},{"q":"배출가스 저감장치 중 삼원촉매(Catalytic Convertor) 장치를 사용하여 저감시킬 수 있는 유해가스의 종류는?","o":["CO, HC, 흑연","CO, NOx, 흑연","NOx, HC, SO","CO, HC, NOx"],"a":3,"e":{"w":["흑연은 삼원촉매가 줄이는 대상이 아닙니다.","흑연은 삼원촉매가 줄이는 대상이 아닙니다.","SO는 삼원촉매가 줄이는 대상이 아닙니다."],"d":"삼원촉매는 세 가지 유해가스를 줄입니다. CO와 HC는 산화시켜 CO₂와 H₂O로, NOx는 환원시켜 N₂로 바꿉니다."}},{"q":"인젝터의 분사량을 제어하는 방법으로 맞는 것은?","o":["솔레노이드 코일에 흐르는 전류의 통전시간으로 조절한다.","솔레노이드 코일에 흐르는 전압의 시간으로 조절한다.","연료압력의 변화를 주면서 조절한다.","분사구의 면적으로 조절한다."],"a":0,"e":{"w":["전압의 시간이 아니라 전류가 흐르는 시간으로 조절합니다.","연료압력은 압력조절기가 일정하게 유지합니다.","분사구의 면적은 정해져 있어 바꿀 수 없습니다."],"d":"인젝터는 연료 압력과 분사구 크기가 일정합니다. 솔레노이드 코일에 전류를 흘려 밸브를 열어 두는 시간(통전시간)으로 분사량을 조절합니다."}},{"q":"측압이 가해지지 않은 스커트 부분을 따낸 것으로 무게를 늘리지 않고 접촉면적은 크게 하고 피스톤 슬랩(slep)은 적게 하여 고속기관에 널리 사용하는 피스톤의 종류는?","o":["슬립퍼 피스톤(slipper piston)","솔리드 피스톤(solid piston)","스플릿 피스톤(split piston)","옵셋 피스톤(offset piston)"],"a":0,"e":{"w":["솔리드 피스톤은 스커트에 홈이 없는 통짜 피스톤입니다.","스플릿 피스톤은 스커트에 세로 홈을 판 피스톤입니다.","옵셋 피스톤은 핀 위치를 중심에서 옮긴 피스톤입니다."],"d":"슬리퍼 피스톤은 측압을 받지 않는 스커트 부분을 잘라 낸 피스톤입니다. 가볍고 고속 회전에 유리합니다."}},{"q":"기관의 최고출력이 1.3ps이고, 총배기량이 50cc, 회전수가 5000rpm일 때 리터 마력(ps/L)은?","o":["56","46","36","26"],"a":3,"e":{"w":["56은 계산과 맞지 않습니다.","46은 계산과 맞지 않습니다.","36은 계산과 맞지 않습니다."],"d":"리터 마력 = 최고출력 ÷ 총배기량(L)입니다.\n50cc = 0.05L\n1.3 ÷ 0.05 = 26ps/L"}},{"q":"스로틀밸브가 열려 있는 상태에서 가속할 때 일시적인 가속 지연 현상이 나타나는 것을 무엇이라고 하는가?","o":["스텀블(stumble)","스톨링(stalling)","헤지테이션(hesitation)","서징(surging)"],"a":2,"e":{"w":["스텀블은 가속 중에 출력이 순간적으로 떨어지는 현상입니다.","스톨링은 엔진이 꺼지는 현상입니다.","서징은 일정하게 달릴 때 차가 앞뒤로 울컥거리는 현상입니다."],"d":"스로틀을 열었는데 엔진이 바로 따라오지 못하고 잠깐 머뭇거리는 가속 지연 현상을 헤지테이션이라고 합니다."}},{"q":"가솔린 기관의 이론공연비로 맞는 것은? (단, 희박연소 기관은 제외)","o":["8:1","13.4:1","14.7:1","15.6:1"],"a":2,"e":{"w":["8 : 1은 너무 진한 혼합비입니다.","13.4 : 1은 이론공연비보다 진한 혼합비입니다.","15.6 : 1은 이론공연비보다 엷은 혼합비입니다."],"d":"가솔린 1g을 완전히 태우는 데 공기 약 14.7g이 필요합니다. 가솔린 기관의 이론공연비는 14.7 : 1입니다."}},{"q":"가솔린 기관의 연료펌프에서 체크밸브의 역할이 아닌 것은?","o":["연료라인 내의 잔압을 유지한다.","기관 고온 시 연료의 베이퍼록을 방지한다.","연료의 맥동을 흡수한다.","연료의 역류를 방지한다."],"a":2,"e":{"w":["잔압을 유지하는 것은 체크밸브의 역할입니다.","잔압을 유지해 베이퍼록을 막는 것은 체크밸브의 역할입니다.","연료가 거꾸로 흐르는 것을 막는 것은 체크밸브의 역할입니다."],"d":"연료의 맥동(압력의 출렁임)은 펌프의 사일런서와 맥동 댐퍼가 흡수합니다. 체크밸브의 역할이 아닙니다."}},{"q":"정지하고 있는 질량 2kg의 물체에 1N의 힘이 작용하면 물체의 가속도는?","o":["0.5m/s²","1m/s²","2m/s²","5m/s²"],"a":0,"e":{"w":["1m/s²는 계산과 맞지 않습니다.","2m/s²는 질량과 힘을 거꾸로 나눈 값입니다.","5m/s²는 계산과 맞지 않습니다."],"d":"가속도 = 힘 ÷ 질량입니다.\n1N ÷ 2kg = 0.5m/s²"}},{"q":"저속 전부하에서의 기관의 노킹(knocking) 방지성을 표시하는 데 가장 적당한 옥탄가 표기법은?","o":["리서치 옥탄가","모터 옥탄가","로드 옥탄가","프런트 옥탄가"],"a":0,"e":{"w":["모터 옥탄가는 고속 전부하에서의 내폭성을 나타냅니다.","로드 옥탄가는 실제로 주행하며 측정한 옥탄가입니다.","프런트 옥탄가는 가솔린 가운데 낮은 온도에서 증발하는 성분의 옥탄가입니다."],"d":"리서치 옥탄가(RON)는 저속에서 급가속할 때처럼 저속 전부하 조건의 노킹 방지성을 나타냅니다."}},{"q":"연소실의 체적이 48cc이고, 압축비가 9:1인 기관의 배기량은 얼마인가?","o":["432cc","384cc","336cc","288cc"],"a":1,"e":{"w":["432cc는 연소실 체적에 압축비를 그대로 곱한 값입니다.","336cc는 계산과 맞지 않습니다.","288cc는 계산과 맞지 않습니다."],"d":"배기량(행정체적) = 연소실 체적 × (압축비 - 1)입니다.\n48 × (9 - 1) = 384cc","g":"comp"}},{"q":"전자제어 가솔린기관에서 흡기 다기관의 압력과 인젝터에 공급 되는 연료 압력 편차를 일정하게 유지시키는 것은?","o":["릴리프밸브","MAP센서","압력조절기","체크밸브"],"a":2,"e":{"w":["릴리프밸브는 압력이 지나치게 오르는 것을 막는 안전밸브입니다.","MAP센서는 흡기관의 압력을 재는 센서입니다.","체크밸브는 잔압을 유지하는 밸브입니다."],"d":"연료 압력조절기는 흡기 다기관의 압력이 변해도 인젝터에 걸리는 연료 압력과의 차이를 항상 일정하게 유지합니다. 그래야 인젝터가 열린 시간만큼 정확한 양이 분사됩니다."}},{"q":"4행정 기관의 행정과 관계없는 것은?","o":["흡기 행정","소기행정","배기행정","압축행정"],"a":1,"e":{"w":["흡기 행정은 4행정 가운데 하나입니다.","배기 행정은 4행정 가운데 하나입니다.","압축 행정은 4행정 가운데 하나입니다."],"d":"4행정 기관은 흡입, 압축, 폭발(동력), 배기의 네 행정으로 이루어집니다. 소기는 2행정 기관에서 새 혼합기로 연소가스를 밀어내는 과정입니다."}},{"q":"흡기다기관의 진공시험 결과 진공계의 바늘이 20~40cmhg사이에서 정지되었다면 가장 올바른 분석은?","o":["엔진이 정상일 때","피스톤링이 마멸되었을 때","밸브가 소손 되었을 때","밸브 타이밍이 맞지 않을 때"],"a":3,"e":{"w":["정상이면 바늘이 45~50cmHg에서 안정됩니다.","피스톤링이 마멸되면 정상보다 조금 낮은 값을 가리킵니다.","밸브가 소손되면 바늘이 규칙적으로 흔들립니다."],"d":"진공계 바늘이 정상보다 훨씬 낮은 20~40cmHg 사이에서 움직이지 않고 서 있으면 밸브가 열리고 닫히는 시기(밸브 타이밍)가 맞지 않는 것입니다."}},{"q":"커넥팅로드의 길이가 150㎜ 피스톤의 행정이 100㎜라면 커넥팅로드의 길이는 크랭크 회전 반지름의 몇 배가 되는가?","o":["1.5배","3.0배","3.5배","6배"],"a":1,"e":{"w":["1.5배는 계산과 맞지 않습니다.","3.5배는 계산과 맞지 않습니다.","6배는 계산과 맞지 않습니다."],"d":"크랭크 회전 반지름은 행정의 절반입니다.\n회전 반지름 = 100 ÷ 2 = 50mm\n커넥팅로드 길이 ÷ 회전 반지름 = 150 ÷ 50 = 3.0배"}},{"q":"기관 연소실 설계 시 고려할 사항으로 틀린 것은?","o":["화염전파에 요하는 시간을 가능한 한 짧게 한다.","가열되기 쉬운 돌출부를 두지 않는다.","연소실의 표면적이 최대가 되게 한다.","압축행정에서 혼합기에 와류를 일으키게 한다."],"a":2,"e":{"w":["화염이 퍼지는 시간을 짧게 합니다. 옳은 고려사항입니다.","뜨거워지기 쉬운 돌출부를 두지 않습니다. 옳은 고려사항입니다.","압축행정에서 혼합기에 와류를 일으킵니다. 옳은 고려사항입니다."],"d":"연소실의 표면적이 넓으면 열이 벽으로 많이 빠져나가 효율이 떨어집니다. 표면적은 최소가 되게 설계합니다."}},{"q":"4행정 기관의 밸브 개폐시기가 다음과 같다. 흡기행정 기간과 밸브오버랩은 각각 몇 도인가? (단, 흡기밸브 열림: 상사점 전 18°, 흡기밸브 닫힘: 하사점 후 48°, 배기밸브 열림: 하사점 전 48°, 배기밸브 닫힘: 상사점 후 13°)","o":["흡기 행정기간 :246°, 밸브오버랩 18°","흡기 행정기간 :241°, 밸브오버랩 18°","흡기 행정기간 :180°, 밸브오버랩 31°","흡기 행정기간 :246°, 밸브오버랩 31°"],"a":3,"e":{"w":["밸브오버랩 18°는 흡기밸브 열림 각도만 쓴 것입니다.","흡기 행정기간 241°는 계산과 맞지 않습니다.","흡기 행정기간 180°는 밸브의 앞당김과 늦춤을 빼고 본 것입니다."],"d":"흡기 행정기간 = 열림(상사점 전) + 180° + 닫힘(하사점 후) = 18° + 180° + 48° = 246°\n밸브오버랩 = 흡기밸브 열림(상사점 전) + 배기밸브 닫힘(상사점 후) = 18° + 13° = 31°","g":"overlap"}},{"q":"크랭크 핀 축받이 오일 간극이 커졌을 때 나타나는 현상으로 옳은 것은?","o":["유압이 높아진다.","유압이 낮아진다.","실린더 벽에 뿜어지는 오일이 부족해진다.","연소실에 올라가는 오일의 양이 적어진다."],"a":1,"e":{"w":["간극이 커지면 유압은 낮아집니다.","틈으로 오일이 많이 새어 나와 실린더 벽에 뿜어지는 오일은 많아집니다.","실린더 벽의 오일이 많아져 연소실로 올라가는 오일도 많아집니다."],"d":"오일 간극이 커지면 그 틈으로 오일이 쉽게 빠져나갑니다. 오일이 버티는 압력이 떨어져 유압이 낮아집니다."}},{"q":"전자제어분사장치의 제어계통에서 엔진 ECU로 입력하는 센서가 아닌 것은?","o":["공기유량센서","대기압센서","휠스피드센서","흡기온센서"],"a":2,"e":{"w":["공기유량센서는 엔진 ECU로 입력됩니다.","대기압센서는 엔진 ECU로 입력됩니다.","흡기온센서는 엔진 ECU로 입력됩니다."],"d":"휠스피드센서는 바퀴의 회전 속도를 재는 센서로 ABS 컨트롤 유닛에 입력됩니다. 연료분사 제어용 센서가 아닙니다."}},{"q":"기관의 실린더(cylinder) 마멸량 이란?","o":["실린더 안지름의 최대 마멸량","실린더 안지름의 최대 마멸량과 최소 마멸량의 차이 값","실린더 안지름의 최소 마멸량","실린더 안지름의 최대 마멸량과 최소 마멸량의 평균 값"],"a":1,"e":{"w":["최대 마멸량만으로 나타내지 않습니다.","최소 마멸량만으로 나타내지 않습니다.","평균값으로 나타내지 않습니다."],"d":"실린더는 윗부분이 많이 닳고 아랫부분은 거의 닳지 않습니다. 가장 많이 닳은 곳과 가장 적게 닳은 곳의 안지름 차이를 실린더 마멸량이라고 합니다."}},{"q":"가솔린 옥탄가를 측정하기 위한 가변 압축비 기관은?","o":["카르노 기관","CFR 기관","린번 기관","오토사이클 기관"],"a":1,"e":{"w":["카르노 기관은 이론상의 이상적인 열기관입니다.","린번 기관은 희박한 혼합기로 운전하는 기관입니다.","오토사이클 기관은 가솔린 기관의 기본 사이클을 말합니다."],"d":"CFR 기관은 연료의 옥탄가를 측정하려고 만든 시험용 기관입니다. 압축비를 바꿀 수 있어 노킹이 일어나는 조건을 찾아낼 수 있습니다."}},{"q":"4행정 기관과 비교한 2행정 기관(2 stroke engine)의 장점은?","o":["각 행정의 작용이 확실하여 효율이 좋다.","배기량이 같을 때 발생동력이 크다.","연료 소비율이 적다.","윤활유 소비량이 적다."],"a":1,"e":{"w":["각 행정의 작용이 확실한 것은 4행정 기관의 장점입니다.","연료 소비율이 적은 것은 4행정 기관의 장점입니다.","윤활유 소비량이 적은 것은 4행정 기관의 장점입니다."],"d":"2행정 기관은 크랭크축이 1회전 할 때마다 폭발합니다. 4행정 기관보다 폭발 횟수가 2배라 배기량이 같으면 발생 동력이 더 큽니다."}},{"q":"스로틀 밸브의 열림 정도를 감지하는 센서는?","o":["APS","CKPS","CMPS","TPS"],"a":3,"e":{"w":["APS는 가속 조작량을 감지하는 센서입니다.","CKPS는 크랭크축 위치 센서입니다.","CMPS는 캠축 위치 센서입니다."],"d":"TPS(Throttle Position Sensor)는 스로틀 밸브의 열림 정도를 감지하는 센서입니다."}},{"q":"기화기식과 비교한 전자제어 가솔린 연료분사장치의 장점으로 틀린 것은?","o":["고출력 및 혼합비 제어에 유리하다.","연료 소비율이 낮다.","부하변동에 따라 신속하게 응답한다.","적절한 혼합비 공급으로 유해 배출가스가 증가된다."],"a":3,"e":{"w":["고출력과 혼합비 제어에 유리합니다. 장점입니다.","연료 소비율이 낮습니다. 장점입니다.","부하 변동에 빠르게 응답합니다. 장점입니다."],"d":"전자제어 연료분사는 알맞은 혼합비를 공급하므로 유해 배출가스가 줄어듭니다. 증가된다는 ④가 틀렸습니다."}},{"q":"배기밸브가 하사점 전 55°에서 열리고 상사점 후 15°에서 닫혀 진다면 배기밸브의 열림각은?","o":["70°","195°","235°","250°"],"a":3,"e":{"w":["70°는 180°를 더하지 않은 값입니다.","195°는 계산과 맞지 않습니다.","235°는 계산과 맞지 않습니다."],"d":"배기밸브 열림각 = 열림(하사점 전) + 180° + 닫힘(상사점 후)입니다.\n55° + 180° + 15° = 250°"}},{"q":"엔진오일의 유압이 낮아지는 원인으로 틀린 것은?","o":["베어링의 오일 간극이 크다.","유압조절밸브의 스프링 장력이 크다.","오일 팬 내의 윤활유 양이 적다.","윤활유 공급 라인에 공기가 유입되었다."],"a":1,"e":{"w":["베어링 오일 간극이 크면 오일이 새어 유압이 낮아집니다.","오일 양이 적으면 유압이 낮아집니다.","공급 라인에 공기가 들어가면 유압이 낮아집니다."],"d":"유압조절밸브의 스프링 장력이 크면 밸브가 잘 열리지 않아 유압이 높아집니다. 유압이 낮아지는 원인이 아닙니다."}},{"q":"기관이 지나치게 냉각되었을 때 기관에 미치는 영향으로 옳은 것은?","o":["출력저하로 연료소비율 증대","연료 및 공기흡입 과잉","점화불량과 압축과대","엔진오일의 열화"],"a":0,"e":{"w":["흡입이 과잉되는 것이 아닙니다.","압축이 과대해지지 않습니다.","오일의 열화는 과열일 때의 현상입니다."],"d":"엔진이 너무 차가우면 연료가 잘 기화하지 않아 연소가 나빠집니다. 출력이 떨어지고 같은 힘을 내는 데 연료가 더 들어 연료소비율이 커집니다."}},{"q":"다음 중 단위 환산으로 틀린 것은?","o":["1J=1N·m","-40℃=-40°F","-273℃= 0K","1kgf/㎠ = 1.42PSi"],"a":3,"e":{"w":["1J = 1N·m입니다. 옳은 환산입니다.","-40℃와 -40°F는 같은 온도입니다. 옳은 환산입니다.","-273℃가 0K(절대영도)입니다. 옳은 환산입니다."],"d":"1kgf/㎠는 약 14.2psi입니다. 1.42psi라고 한 ④가 틀렸습니다."}},{"q":"피스톤 재료의 요구 특성으로 틀린 것은?","o":["무게가 가벼워야 한다.","고온 강도가 높아야 한다.","내마모성이 좋아야 한다.","열팽창 계수가 커야 한다."],"a":3,"e":{"w":["가벼워야 관성력이 작습니다. 요구 특성입니다.","높은 온도에서도 강도가 유지되어야 합니다. 요구 특성입니다.","잘 닳지 않아야 합니다. 요구 특성입니다."],"d":"열팽창 계수가 크면 뜨거워질 때 많이 늘어나 실린더에 끼어 버립니다. 피스톤 재료는 열팽창 계수가 작아야 합니다."}},{"q":"배기가스가 삼원 촉매 컨버터를 통과할 때 산화·환원되는 물질로 옳은 것은?","o":["N₂, CO","N₂, H₂","N₂, O₂","N₂, CO₂,H₂O"],"a":3,"e":{"w":["CO는 줄여야 할 유해가스입니다.","H₂는 촉매를 지난 뒤의 주된 물질이 아닙니다.","O₂는 촉매를 지난 뒤의 주된 물질이 아닙니다."],"d":"삼원촉매를 지나면 CO는 산화되어 CO₂로, HC는 산화되어 CO₂와 H₂O로, NOx는 환원되어 N₂로 바뀝니다."}},{"q":"연소실 압축압력이 규정 압축압력보다 높을 때 원인으로 옳은 것은?","o":["연소실내 카본 다량 부착","연소실내에 돌출부 없어짐","압축비가 작아짐","옥탄가가 지나치게 높음"],"a":0,"e":{"w":["돌출부가 없어지면 압축압력이 높아지지 않습니다.","압축비가 작아지면 압축압력은 낮아집니다.","옥탄가는 압축압력과 관계가 없습니다."],"d":"연소실에 카본이 많이 쌓이면 그만큼 연소실 체적이 줄어듭니다. 압축비가 커져 압축압력이 규정보다 높게 나옵니다."}},{"q":"흡기매니폴드 내의 압력에 대한 설명으로 옳은 것은?","o":["외부 펌프로부터 만들어진다.","압력은 항상 일정하다.","압력변화는 항상 대기압에 의해 변화한다.","스로틀 밸브의 개도에 따라 달라진다."],"a":3,"e":{"w":["외부 펌프가 만드는 압력이 아닙니다.","압력은 운전 상태에 따라 변합니다.","대기압이 아니라 스로틀 열림에 따라 변합니다."],"d":"스로틀 밸브가 닫혀 있으면 피스톤이 빨아들이는 힘 때문에 매니폴드 압력이 낮아지고(진공이 크고), 열리면 대기압에 가까워집니다."}},{"q":"산소센서 신호가 희박으로 나타날 때 연료계통의 점검사항으로 틀린 것은?","o":["연료필터의 막힘 여부","연료펌프의 작동전류 점검","연료펌프 전원의 전원강하 여부","릴리프 밸브의 막힘 여부"],"a":3,"e":{"w":["연료필터가 막히면 연료가 부족해 희박해집니다. 점검사항입니다.","연료펌프의 작동 전류로 펌프 상태를 봅니다. 점검사항입니다.","펌프 전원의 전압이 떨어지면 연료가 부족해집니다. 점검사항입니다."],"d":"릴리프 밸브가 막히면 연료 압력이 높아져 혼합기가 농후해집니다. 희박 신호가 나올 때의 점검사항이 아닙니다."}},{"q":"실린더의 마멸량 및 내경 측정에 사용되는 기구와 관계없는 것은?","o":["버어니어 캘리퍼스","실린더 게이지","외측 마이크로미터와 텔레스코핑 게이지","내측 마이크로미터"],"a":0,"e":{"w":["실린더 게이지로 안지름과 마멸량을 측정합니다.","외측 마이크로미터와 텔레스코핑 게이지를 함께 써서 측정합니다.","내측 마이크로미터로 안지름을 측정합니다."],"d":"버니어 캘리퍼스는 실린더 깊은 곳의 안지름을 잴 수 없고 정밀도도 부족합니다. 실린더 마멸량 측정에는 쓰지 않습니다."}},{"q":"4행정 4실린더 기관에서 실린더 안지름 80㎜, 행정 80㎜, 압축비는 10:1이다. 이 기관의 전체 연소실 체적은 약 몇 CC인가?","o":["45CC","179CC","447CC","1786CC"],"a":1,"e":{"w":["45cc는 실린더 1개의 연소실 체적입니다.","447cc는 계산과 맞지 않습니다.","1786cc는 계산과 맞지 않습니다."],"d":"실린더 1개의 행정체적 = 0.785 × 8² × 8 = 401.9cc\n실린더 1개의 연소실 체적 = 401.9 ÷ (10 - 1) = 44.7cc\n전체 연소실 체적 = 44.7 × 4 = 약 179cc","g":"comp"}},{"q":"다음 중 단위 환산으로 맞는 것은?","o":["4.2kcal = 1kJ","1.6mile = 1km","1N‧m = 9.8J","1W = 1J/s"],"a":3,"e":{"w":["1kcal가 약 4.2kJ입니다. 거꾸로 되어 있습니다.","1mile이 약 1.6km입니다. 거꾸로 되어 있습니다.","1N·m = 1J입니다."],"d":"1W는 1초에 1J의 일을 하는 일률입니다. 1W = 1J/s입니다."}},{"q":"크랭크축의 점검부위에 해당 되지 않은 것은?","o":["축과 베어링 사이의 간극","축의 축 방향 흔들림","크랭크축의 중량","크랭크축의 굽힘"],"a":2,"e":{"w":["축과 베어링 사이의 간극(오일 간극)은 점검부위입니다.","축 방향 흔들림(엔드 플레이)은 점검부위입니다.","크랭크축의 굽힘(휨)은 점검부위입니다."],"d":"크랭크축은 휨, 저널의 마모, 오일 간극, 축 방향 유격을 점검합니다. 크랭크축의 중량은 점검하지 않습니다."}},{"q":"방열기 압력식 캡에 관하여 설명한 것이다. 알맞은 것은?","o":["냉각범위를 넓게 냉각효과를 크게 하기 위하여 사용된다.","부압 밸브는 방열기 내의 부압이 빠지지 않도록 하기 위함이다.","게이지 압력은 2~3kgf/㎠이다.","냉각수량을 약 20% 증가시키기 위해서 사용된다."],"a":0,"e":{"w":["부압 밸브는 식어서 부압이 생길 때 열려 보조 탱크의 냉각수를 받아들입니다.","게이지 압력은 약 0.9kgf/㎠ 정도입니다. 2~3kgf/㎠는 너무 높습니다.","냉각수량을 늘리려는 것이 아닙니다."],"d":"압력식 캡은 냉각 계통의 압력을 높여 냉각수의 끓는점을 올립니다. 더 높은 온도까지 끓지 않고 쓸 수 있어 냉각 범위가 넓어지고 냉각 효과가 커집니다."}},{"q":"공기량을 측정하는 센서의 종류가 아닌 것은?","o":["핫 와이어 타입","핫 필름 타입","칼만와류 타입","포토다이오드 타입"],"a":3,"e":{"w":["핫 와이어(열선) 타입은 공기량 센서의 종류입니다.","핫 필름(열막) 타입은 공기량 센서의 종류입니다.","칼만와류 타입은 공기량 센서의 종류입니다."],"d":"공기량 센서에는 열선식, 열막식, 칼만 와류식, 베인식이 있습니다. 포토다이오드 타입이라는 공기량 센서는 없습니다."}},{"q":"전자제어 기관의 공전속도 조절기구(Idle Speed Actuator)의 역할이 아닌 것은?","o":["대시포트 작용(Dash-Pot)","공전시 엔진부하에 따른 엔진 회전수 보상","냉간 운전시 냉각수 온도에 따라 공전시 공기유량 조절","공기 유량을 검출하여 컴퓨터로 전송"],"a":3,"e":{"w":["스로틀을 갑자기 닫을 때 회전이 급히 떨어지지 않게 하는 대시포트 작용을 합니다.","공전 때 부하가 걸리면 회전수를 보상합니다.","차가울 때는 냉각수 온도에 따라 공기량을 늘려 줍니다."],"d":"공전속도 조절기구는 공기 통로를 여닫아 공전 회전수를 조절하는 액추에이터입니다. 공기 유량을 검출해 보내는 것은 공기유량 센서의 역할입니다."}},{"q":"인젝터 분사시간 결정에 가장 큰 영향을 주는 센서는?","o":["수온센서","공기온도센서","노크센서","흡입공기량 센서"],"a":3,"e":{"w":["수온센서는 분사시간을 보정하는 센서입니다.","공기온도센서는 분사시간을 보정하는 센서입니다.","노크센서는 점화시기 제어에 씁니다."],"d":"기본 분사시간은 흡입 공기량과 엔진 회전수로 정해집니다. 흡입공기량 센서가 가장 큰 영향을 줍니다."}},{"q":"어떤 기관의 크랭크축 회전수가 2400rpm, 회전반경이 40mm 일 때 피스톤 평균속도는?","o":["1.6m/s","3.3m/s","6.4m/s","9.6m/s"],"a":2,"e":{"w":["1.6m/s는 계산과 맞지 않습니다.","3.3m/s는 계산과 맞지 않습니다.","9.6m/s는 계산과 맞지 않습니다."],"d":"행정은 회전반경의 2배입니다.\n행정 = 40 × 2 = 80mm = 0.08m\n피스톤 평균속도 = 2 × 행정 × 회전수 ÷ 60 = 2 × 0.08 × 2400 ÷ 60 = 6.4m/s"}},{"q":"전자제어 가솔린 기관의 진공식 연료압력 조절기에 대한 설명으로 옳은 것은?","o":["공전 시 진공호스를 빼면 연료압력은 낮아지고 다시 꼽으면 높아진다.","급가속 순간 흡기다기관의 진공은 대기압에 가까워 연료압력은 낮아진다.","흡기관의 절대압력과 연료 분배관의 압력차를 항상 일정하게 유지시킨다.","대기압이 변화하면 흡기관의 절대압력과 연료 분배관의 압력차도 같이 변화한다."],"a":2,"e":{"w":["진공호스를 빼면 연료압력은 높아지고, 다시 꽂으면 낮아집니다.","급가속 순간에는 진공이 약해져 연료압력이 높아집니다.","대기압이 변해도 압력차는 일정하게 유지됩니다."],"d":"진공식 연료압력 조절기는 흡기관의 압력이 변하면 연료 압력도 같은 만큼 따라 변하게 합니다. 흡기관 압력과 연료 분배관 압력의 차이가 항상 일정하게 유지됩니다."}},{"q":"커넥팅로드의 비틀림이 엔진에 미치는 영향에 대한 설명이다. 옳지 않은 것은?","o":["압축압력의 저하","회전에 무리를 초래","저널베어링의 마멸","타이밍 기어의 백래시 촉진"],"a":3,"e":{"w":["피스톤이 기울어져 압축이 샙니다. 미치는 영향입니다.","회전에 무리가 갑니다. 미치는 영향입니다.","저널 베어링이 한쪽으로 닳습니다. 미치는 영향입니다."],"d":"커넥팅로드가 비틀리면 피스톤이 기울어져 압축이 새고 실린더와 베어링이 한쪽만 닳습니다. 타이밍 기어의 백래시와는 관계가 없습니다."}},{"q":"밸브 스프링 자유높이의 감소는 표준치수에 대하여 몇 % 이내이어야 하는가?","o":["3%","8%","10%","12%"],"a":0,"e":{"w":["8%는 한계를 넘는 값입니다.","10%는 한계를 넘는 값입니다.","12%는 한계를 넘는 값입니다."],"d":"밸브 스프링의 자유높이는 표준치수보다 3% 이상 줄어들면 교환합니다. 3% 이내여야 합니다."}},{"q":"흡기관로에 설치되어 칼만 와류현상을 이용하여 흡입공기량을 측정하는 것은?","o":["흡기온도 센서","대기압 센서","스로틀 포지션 센서","공기유량 센서"],"a":3,"e":{"w":["흡기온도 센서는 공기의 온도를 잽니다.","대기압 센서는 대기압을 잽니다.","스로틀 포지션 센서는 스로틀 열림을 잽니다."],"d":"칼만 와류식 공기유량 센서는 공기 통로에 기둥을 세워 그 뒤에 생기는 소용돌이(와류)의 수를 셉니다. 공기가 많이 흐를수록 소용돌이가 많이 생깁니다."}},{"q":"크랭크 샤프트 포지션 센서 부착에 대한 내용으로 틀린 것은?","o":["크랭크 샤프트 포지션 센서 부착 시 규정 토크를 준수하여 부착한다.","크랭크 샤프트 포지션 센서 부착 전에 센서 O링에 실런트를 도포한다.","크랭크 샤프트 포지션 센서 부착 시 부착 홀에 밀어 넣어 부착한다.","크랭크 샤프트 포지션 센서에 충격을 가하지 않도록 주의한다."],"a":1,"e":{"w":["규정 토크로 조여 부착합니다. 옳은 내용입니다.","부착 구멍에 밀어 넣어 부착합니다. 옳은 내용입니다.","충격을 주지 않도록 주의합니다. 옳은 내용입니다."],"d":"센서의 O링에는 실런트가 아니라 엔진 오일을 얇게 발라 끼웁니다. 실런트를 바르면 센서 위치가 틀어지고 다음에 떼어 내기 어렵습니다."}},{"q":"실린더 헤드의 평면도 점검 방법으로 옳은 것은?","o":["마이크로미터로 평면도를 측정 점검한다.","곧은 자와 틈새 게이지로 측정 점검한다.","실린더 헤드를 3개 방향으로 측정 점검한다.","틈새가 0.02mm 이상이면 연삭한다."],"a":1,"e":{"w":["마이크로미터는 두께나 지름을 재는 도구입니다.","3개 방향이 아니라 가로, 세로, 대각선으로 여러 방향을 측정합니다.","한계값은 정비지침서의 규정을 따릅니다."],"d":"실린더 헤드 면에 곧은 자를 올려놓고, 자와 헤드 면 사이의 틈에 틈새 게이지를 넣어 평면도를 측정합니다."}},{"q":"전자제어 가솔린 기관에서 워밍업 후 공회전 부조가 발생했다. 그 원인이 아닌 것은?","o":["스로틀 밸브의 걸림 현상","ISC(아이들 스피드 콘트롤) 장치 고장","수온센서 배선 단선","악셀 케이블 유격이 과다."],"a":3,"e":{"w":["스로틀 밸브가 걸리면 공기량이 불안정해 부조가 납니다.","ISC 장치가 고장 나면 공회전 조절이 안 됩니다.","수온센서 배선이 끊기면 연료량이 맞지 않습니다."],"d":"가속 케이블의 유격이 크면 스로틀을 감아도 늦게 반응할 뿐입니다. 공회전 때는 스로틀이 닫혀 있으므로 공회전 부조의 원인이 아닙니다."}},{"q":"밸브 스프링의 점검 사항이 아닌 것은?","o":["자유고","직각도","장력","코일수"],"a":3,"e":{"w":["자유고(자유높이)는 점검 사항입니다.","직각도는 점검 사항입니다.","장력은 점검 사항입니다."],"d":"밸브 스프링은 자유높이, 직각도, 장력을 점검합니다. 코일수는 변하지 않으므로 점검하지 않습니다."}},{"q":"100PS 엔진으로 5000kgf의 물건을 30m 들어 올리는데 필요한 시간은?","o":["0.3s","3.3s","20s","30s"],"a":2,"e":{"w":["0.3s는 계산과 맞지 않습니다.","3.3s는 계산과 맞지 않습니다.","30s는 계산과 맞지 않습니다."],"d":"필요한 일 = 5,000kgf × 30m = 150,000kgf·m\n1PS = 75kgf·m/s이므로 100PS = 7,500kgf·m/s\n시간 = 150,000 ÷ 7,500 = 20초"}},{"q":"연소실 체적이 40cc이고, 총 배기량이 1280cc인 4기통기관의 압축비는?","o":["6","9","18","33"],"a":1,"e":{"w":["6은 계산과 맞지 않습니다.","18은 계산과 맞지 않습니다.","33은 총 배기량을 연소실 체적으로 그대로 나눈 값에 1을 더한 것입니다."],"d":"실린더 1개의 배기량 = 1280 ÷ 4 = 320cc\n압축비 = (연소실 체적 + 배기량) ÷ 연소실 체적 = (40 + 320) ÷ 40 = 9","g":"comp"}},{"q":"전자제어 연료분사 장치에서 인젝터를 설명한 것 중 틀린 것은?","o":["플런저 : 니들 밸브를 누르고 있다가 ECU 신호에 의해 작동된다.","솔레노이드 : ECU 신호에 의해 전자석이 된다.","니들밸브 : 연료 압력을 일정하게 유지시킨다.","배선 커넥터 : 솔레노이드에서 ECU로부터 신호를 연결하여 준다."],"a":2,"e":{"w":["플런저는 니들 밸브를 누르고 있다가 신호가 오면 움직입니다. 옳은 설명입니다.","솔레노이드는 신호가 오면 전자석이 됩니다. 옳은 설명입니다.","배선 커넥터는 ECU의 신호를 솔레노이드에 이어 줍니다. 옳은 설명입니다."],"d":"니들밸브는 분사구를 열고 닫는 밸브입니다. 연료 압력을 일정하게 유지하는 것은 연료 압력조절기입니다."}},{"q":"크랭크각 신호에 따라 각 실린더의 인젝터를 동시에 개방하여 연료를 공급하는 분사방식은?","o":["동기분사","동시분사","비동기분사","순차분사"],"a":1,"e":{"w":["동기분사는 크랭크각 신호에 맞추어 분사하는 것을 통틀어 말합니다.","비동기분사는 크랭크각과 상관없이 급가속 때 추가로 분사하는 방식입니다.","순차분사는 점화 순서에 따라 실린더마다 차례로 분사하는 방식입니다."],"d":"모든 실린더의 인젝터를 한꺼번에 열어 분사하는 방식을 동시분사라고 합니다."}},{"q":"윤활유 구비조건으로 틀린 것은?","o":["점도가 적당할 것","열과 산에 대하여 안전성이 있을 것","응고점이 높을 것","인화점과 발화점이 높을 것"],"a":2,"e":{"w":["점도가 적당해야 합니다. 맞는 조건입니다.","열과 산에 안정해야 합니다. 맞는 조건입니다.","인화점과 발화점이 높아야 합니다. 맞는 조건입니다."],"d":"응고점은 오일이 굳는 온도입니다. 응고점이 높으면 조금만 추워도 굳어 버립니다. 윤활유는 응고점이 낮아야 합니다."}},{"q":"밸브스프링 서징현상을 방지하는 방법으로 틀린 것은?","o":["밸브스프링 고유 진동수를 높게 한다.","부등 피치 스프링이나 원추형 스프링을 사용한다.","피치가 서로 다른 이중 스프링을 사용한다.","사용 중인 스프링보다 피치가 더 큰 스프링을 사용한다."],"a":3,"e":{"w":["고유 진동수를 높이면 캠의 진동과 겹치지 않습니다. 방지 방법입니다.","부등 피치 스프링이나 원추형 스프링은 진동수가 일정하지 않아 공진하지 않습니다. 방지 방법입니다.","피치가 다른 이중 스프링은 서로 진동을 억제합니다. 방지 방법입니다."],"d":"피치만 더 큰 스프링으로 바꾸는 것은 서징을 막는 방법이 아닙니다."}},{"q":"어떤 기관의 열효율을 측정하는데 열정산에서 냉각에 의한 손실이 29%, 배기와 복사에 의한 손실이 31% 이고, 기계효율을 80% 라면 정미열효율은?","o":["40%","36%","34%","32%"],"a":3,"e":{"w":["40%는 기계효율을 곱하기 전의 도시열효율입니다.","36%는 계산과 맞지 않습니다.","34%는 계산과 맞지 않습니다."],"d":"도시열효율 = 100 - 냉각 손실 - 배기·복사 손실 = 100 - 29 - 31 = 40%\n정미열효율 = 도시열효율 × 기계효율 = 40 × 0.8 = 32%"}},{"q":"실린더가 정상적인 마모를 할 때 마모량이 가장 큰 부분은?","o":["실린더 윗부분","실린더 중간 부분","실린더 밑 부분","실린더 헤드"],"a":0,"e":{"w":["중간 부분은 윗부분보다 덜 닳습니다.","밑부분은 가장 적게 닳습니다.","실린더 헤드는 실린더가 아닙니다."],"d":"실린더는 윗부분(상사점 부근)이 가장 많이 닳습니다. 폭발 압력으로 링이 벽을 가장 세게 누르고, 온도가 높아 유막이 끊어지기 쉽기 때문입니다."}},{"q":"배기장치에 관한 설명이다. 맞는 것은?","o":["배기 소음기는 온도는 낮추고 압력을 높여 배기소음을 감쇠한다.","배기다기관에서 배출되는 가스는 저온 저압으로 급격한 팽창으로 폭발음을 발생한다.","단 실린더에도 배기 다기관을 설치하여 배기가스를 모아 방출해야 한다.","소음효과를 높이기 위해 소음기의 저항을 크게 하면 배압이 커 기관출력이 줄어든다."],"a":3,"e":{"w":["소음기는 배기가스의 온도와 압력을 모두 낮춰 소음을 줄입니다.","배기다기관에서 나오는 가스는 고온 고압입니다.","실린더가 하나면 모을 가스가 없어 배기 다기관이 필요 없습니다."],"d":"소음기 안의 저항을 크게 하면 소리는 줄지만 배기가스가 잘 빠지지 못합니다. 배압이 커져 엔진 출력이 줄어듭니다."}},{"q":"냉각장치에서 냉각수의 비등점을 올리기 위한 방식으로 맞는 것은?","o":["압력 캡식","진공 갭식","밀봉 캡식","순환 캡식"],"a":0,"e":{"w":["진공 캡식이라는 방식은 없습니다.","밀봉 캡식이라는 방식은 없습니다.","순환 캡식이라는 방식은 없습니다."],"d":"압력 캡식은 냉각 계통을 밀폐하고 압력을 높여 냉각수의 끓는점을 올립니다."}},{"q":"기관의 회전수를 계산하는데 사용하는 센서는?","o":["스로틀 포지션 센서","맵 센서","크랭크 포지션 센서","노크 센서"],"a":2,"e":{"w":["스로틀 포지션 센서는 스로틀 열림을 감지합니다.","맵 센서는 흡기관 압력을 감지합니다.","노크 센서는 노킹을 감지합니다."],"d":"크랭크 포지션 센서는 크랭크축이 도는 것을 감지합니다. ECU는 이 신호로 엔진 회전수를 계산합니다."}},{"q":"기관의 밸브 장치에서 기계식 밸브 리프트에 비해 유압식 밸브 리프트의 장점으로 맞는 것은?","o":["구조가 간단하다.","오일펌프와 상관 없다.","밸브간극 조정이 필요 없다.","워밍업 전에만 밸브간극 조정이 필요하다."],"a":2,"e":{"w":["유압식은 구조가 더 복잡합니다.","오일펌프의 유압으로 작동합니다.","워밍업 전후 모두 조정이 필요 없습니다."],"d":"유압식 밸브 리프터는 오일의 압력으로 밸브 간극을 자동으로 0으로 맞춥니다. 밸브 간극을 조정할 필요가 없고 소음도 적습니다."}},{"q":"기관의 동력을 측정할 수 있는 장비는?","o":["멀티미터","볼트미터","타코미터","다이나모미터"],"a":3,"e":{"w":["멀티미터는 전압, 전류, 저항을 재는 장비입니다.","볼트미터는 전압을 재는 장비입니다.","타코미터는 회전수를 재는 장비입니다."],"d":"다이나모미터(동력계)는 엔진에 부하를 걸어 회전력과 회전수를 재고 출력을 측정하는 장비입니다."}},{"q":"엔진의 내경 9㎝, 행정 10㎝인 1기통 배기량은?","o":["약 666cc","약 656cc","약 646cc","약 636cc"],"a":3,"e":{"w":["666cc는 계산과 맞지 않습니다.","656cc는 계산과 맞지 않습니다.","646cc는 계산과 맞지 않습니다."],"d":"배기량 = 0.785 × 내경² × 행정입니다.\n0.785 × 9² × 10 = 0.785 × 81 × 10 = 약 636cc"}},{"q":"수냉식 냉각장치의 장·단점에 대한 설명으로 틀린 것은?","o":["공랭식보다 소음이 크다.","공랭식보다 보수 및 취급이 복잡하다.","실린더 주위를 균일하게 냉각시켜 공랭식보다 냉각효과가 좋다.","실린더 주위를 저온으로 유지시키므로 공랭식보다 체적효율이 좋다."],"a":0,"e":{"w":["보수와 취급이 복잡한 것은 수냉식의 단점입니다. 옳은 설명입니다.","실린더 주위를 고르게 식혀 냉각 효과가 좋습니다. 옳은 설명입니다.","실린더 주위 온도가 낮아 체적효율이 좋습니다. 옳은 설명입니다."],"d":"수냉식은 실린더 둘레의 냉각수가 소리를 막아 주므로 공랭식보다 조용합니다. 소음이 크다는 ①이 틀렸습니다."}},{"q":"내연기관에서 언더 스퀘어 엔진은 어느 것인가?","o":["행정 / 실린더 내경 = 1","행정 / 실린더 내경 < 1","행정 / 실린더 내경 > 1","행정 / 실린더 내경 ≦ 1"],"a":2,"e":{"w":["행정과 내경이 같으면 스퀘어 엔진입니다.","행정이 내경보다 짧으면 오버 스퀘어(단행정) 엔진입니다.","이 조건은 스퀘어와 오버 스퀘어를 합친 것입니다."],"d":"언더 스퀘어 엔진은 행정이 내경보다 긴 장행정 엔진입니다. 행정 ÷ 내경의 값이 1보다 큽니다."}},{"q":"피스톤 행정이 84 mm, 기관의 회전수가 3000rpm인 4행정 사이클 기관의 피스톤 평균속도는 얼마인가?","o":["4.2m/s","8.4m/s","9.4m/s","10.4m/s"],"a":1,"e":{"w":["4.2m/s는 2를 곱하지 않은 값입니다.","9.4m/s는 계산과 맞지 않습니다.","10.4m/s는 계산과 맞지 않습니다."],"d":"피스톤 평균속도 = 2 × 행정 × 회전수 ÷ 60입니다.\n2 × 0.084m × 3000 ÷ 60 = 8.4m/s"}}]},{"g":"보충 문제","name":"섀시 보충 문제","id":"p18","qs":[{"q":"ABS(Anti-lock Brake System)의 구성 요소 중 휠의 회전속도를 감지하여 컨트롤 유닛으로 신호를 보내주는 것은?","o":["휠 스피드 센서","하이드로릭 유닛","솔레노이드 밸브","어큐물레이터"],"a":0,"e":{"w":["하이드로릭 유닛은 유압을 조절하는 장치입니다.","솔레노이드 밸브는 유압 통로를 여닫는 밸브입니다.","어큐뮬레이터는 유압을 잠시 저장하는 부품입니다."],"d":"휠 스피드 센서는 바퀴의 회전 속도를 감지해 컨트롤 유닛에 보냅니다. 컨트롤 유닛은 이 신호로 바퀴가 잠기려는지를 판단합니다."}},{"q":"드럼 방식의 브레이크 장치와 비교했을 때 디스크 브레이크의 장점은?","o":["자기작동 효과가 크다.","오염이 잘 되지 않는다.","패드의 마모율이 낮다.","패드의 교환이 용이하다."],"a":3,"e":{"w":["자기작동 효과가 큰 것은 드럼 브레이크의 특징입니다.","디스크가 밖으로 드러나 있어 오염되기 쉽습니다.","마찰 면적이 좁아 패드가 빨리 닳습니다."],"d":"디스크 브레이크는 캘리퍼에서 패드만 빼내면 되므로 패드 교환이 쉽습니다. 열이 잘 빠져 페이드도 잘 생기지 않습니다."}},{"q":"주행 중 브레이크 드럼과 슈가 접촉하는 원인에 해당하는 것은?","o":["마스터 실린더의 리턴 포트가 열려 있다.","슈의 리턴 스프링이 소손되어 있다.","브레이크액이 양이 부족하다.","드럼과 라이닝의 간극이 과대하다."],"a":1,"e":{"w":["리턴 포트가 열려 있는 것은 정상 상태입니다.","브레이크액이 부족하면 제동이 잘 되지 않습니다.","간극이 크면 접촉하지 않습니다."],"d":"리턴 스프링은 브레이크를 놓았을 때 슈를 드럼에서 떼어 제자리로 당겨 줍니다. 스프링이 손상되면 슈가 돌아오지 못해 주행 중에도 드럼과 닿습니다."}},{"q":"브레이크등 회로에서 12V 축전지에 24W의 전구 2개가 연결되어 점등된 상태라면 합성저항은?","o":["2Ω","3Ω","4Ω","6Ω"],"a":1,"e":{"w":["2Ω은 계산과 맞지 않습니다.","4Ω은 계산과 맞지 않습니다.","6Ω은 전구 1개의 저항입니다."],"d":"전구 2개의 전체 전력 = 24W × 2 = 48W\n전류 = 전력 ÷ 전압 = 48 ÷ 12 = 4A\n합성저항 = 전압 ÷ 전류 = 12 ÷ 4 = 3Ω","g":"ohm"}},{"q":"브레이크의 파이프 내에 공기가 유입되었을 때 나타나는 현상으로 옳은 것은?","o":["브레이크액이 냉각된다.","브레이크 페달의 유격이 커진다.","마스터 실린더에서 브레이크액이 누설된다.","브레이크가 지나치게 급히 작동한다."],"a":1,"e":{"w":["브레이크액이 냉각되는 것과는 관계가 없습니다.","공기가 들어간 것과 누설은 다른 문제입니다.","급히 작동하는 것이 아니라 오히려 잘 듣지 않습니다."],"d":"공기는 누르면 부피가 줄어듭니다. 파이프에 공기가 있으면 페달(레버)을 밟아도 공기가 먼저 눌리므로 유격이 커지고 스펀지처럼 물렁합니다."}},{"q":"일반적으로 수동변속기의 고장 유무를 점검하는 방법으로 적합하지 않은 것은?","o":["오일이 새는 곳은 없는지 점검한다.","조작기구의 헐거움이 있는지 점검한다.","소음발생과 기어의 물림이 빠지는지 점검한다.","헬리컬 기어보다 측압을 많이 받는 스퍼기어는 측압 와셔 마모를 점검한다."],"a":3,"e":{"w":["오일이 새는 곳이 없는지 점검합니다. 적합한 방법입니다.","조작기구가 헐겁지 않은지 점검합니다. 적합한 방법입니다.","소음이 나는지, 기어가 빠지는지 점검합니다. 적합한 방법입니다."],"d":"이가 비스듬한 헬리컬 기어가 축 방향의 힘(측압)을 많이 받습니다. 이가 곧은 스퍼기어는 측압을 거의 받지 않으므로 ④의 설명이 틀렸습니다."}},{"q":"브레이크 마스터 실린더의 푸시로드 길이를 길게 하였을 때 발생할 수 있는 현상은?","o":["라이닝 작용이 원활하다.","라이닝이 팽창하여 풀리지 않을 수 있다.","브레이크 페달 높이가 낮아진다.","라이닝 팽창이 풀린다."],"a":1,"e":{"w":["라이닝 작용이 원활해지지 않습니다.","페달 높이가 낮아지는 것이 아닙니다.","팽창이 풀리는 것이 아니라 풀리지 않습니다."],"d":"푸시로드가 길면 페달을 놓아도 피스톤이 끝까지 돌아오지 못해 리턴 포트를 막습니다. 유압이 빠지지 못해 라이닝이 벌어진 채 풀리지 않습니다."}},{"q":"휠 밸런스 시험기 사용 시 적합하지 않은 것은?","o":["휠 탈·부착 시에는 무리한 힘을 가하지 않는다.","균형추를 정확히 부착한다.","계기판은 회전이 시작되면 즉시 판독한다.","시험기 사용 순서를 숙지 후 사용한다."],"a":2,"e":{"w":["휠을 떼고 붙일 때 무리한 힘을 주지 않습니다. 적합한 내용입니다.","균형추를 정확한 위치에 붙입니다. 적합한 내용입니다.","사용 순서를 숙지한 뒤 사용합니다. 적합한 내용입니다."],"d":"휠 밸런스 시험기는 회전이 안정된 뒤에 값을 읽어야 정확합니다. 회전이 시작되자마자 읽으면 값이 맞지 않습니다."}},{"q":"마스터실린더의 내경이 2㎝, 푸시로드에 100kgf의 힘이 작용하면 브레이크 파이프에 작용하는 유압은?","o":["약 25kgf/㎠","약 32kgf/㎠","약 50kgf/㎠","약 200kgf/㎠"],"a":1,"e":{"w":["25kgf/㎠는 계산과 맞지 않습니다.","50kgf/㎠는 계산과 맞지 않습니다.","200kgf/㎠는 계산과 맞지 않습니다."],"d":"먼저 피스톤의 단면적을 구합니다.\n단면적 = 0.785 × 2² = 3.14㎠\n유압 = 힘 ÷ 단면적 = 100 ÷ 3.14 = 약 32kgf/㎠"}},{"q":"빈번한 브레이크 조작으로 인해 온도가 상승하여 마찰계수 저하로 제동력이 떨어지는 현상은?","o":["베이퍼 록 현상","페이드 현상","피칭 현상","시미 현상"],"a":1,"e":{"w":["베이퍼 록은 브레이크액이 끓어 기포가 생기는 현상입니다.","피칭은 차체가 앞뒤로 끄덕이는 진동입니다.","시미는 바퀴가 좌우로 떨리는 현상입니다."],"d":"브레이크를 자주 쓰면 마찰열로 패드와 디스크(라이닝과 드럼)가 뜨거워집니다. 온도가 오르면 마찰계수가 떨어져 제동력이 약해지는 현상이 페이드입니다."}},{"q":"타이어의 스탠딩 웨이브 현상에 대한 내용으로 옳은 것은?","o":["스탠딩 웨이브를 줄이기 위해 고속 주행 시 공기압을 10% 정도 줄인다.","스탠딩 웨이브가 심하면 타이어 박리현상이 발생할 수 있다.","스탠딩 웨이브는 바이어스 타이어보다 레디얼 타이어에서 많이 발생한다.","스탠딩 웨이브 현상은 하중과 무관하다."],"a":1,"e":{"w":["스탠딩 웨이브를 줄이려면 공기압을 10~20% 높여야 합니다.","레디얼 타이어가 바이어스 타이어보다 덜 발생합니다.","하중이 클수록 잘 발생합니다."],"d":"스탠딩 웨이브는 고속에서 타이어 뒤쪽이 물결처럼 주름지는 현상입니다. 심하면 타이어가 뜨거워져 트레드가 떨어져 나가는 박리현상이 일어나고 파열됩니다."}},{"q":"전자제어 제동 시스템(ABS)을 입력, 제어 출력으로 나누었을 때 입력이 아닌 것은?","o":["스피드 센서","모터릴레이","브레이크 스위치","축전지 전원"],"a":1,"e":{"w":["스피드 센서는 입력 신호입니다.","브레이크 스위치는 입력 신호입니다.","축전지 전원은 입력입니다."],"d":"모터릴레이는 컨트롤 유닛이 펌프 모터를 돌리려고 작동시키는 부품입니다. 입력이 아니라 출력입니다."}},{"q":"드럼식 브레이크에서 브레이크슈의 작동형식에 의한 분류에 해당하지 않는 것은?","o":["리딩 트레일링 슈 형식","3리딩 슈 형식","서보 형식","듀오 서보식"],"a":1,"e":{"w":["리딩 트레일링 슈 형식은 드럼 브레이크의 형식입니다.","서보 형식은 드럼 브레이크의 형식입니다.","듀오 서보식은 드럼 브레이크의 형식입니다."],"d":"드럼 브레이크는 슈의 작동에 따라 리딩 트레일링 슈 형식, 2리딩 슈 형식, 서보 형식(유니 서보, 듀오 서보)으로 나눕니다. 3리딩 슈 형식은 없습니다."}},{"q":"지시마력이 50PS 이고, 제동마력이 40PS 일 때 기계효율은?","o":["70%","80%","125%","200%"],"a":1,"e":{"w":["70%는 계산과 맞지 않습니다.","125%는 지시마력을 제동마력으로 거꾸로 나눈 값입니다.","200%는 계산과 맞지 않습니다."],"d":"기계효율 = 제동마력 ÷ 지시마력 × 100입니다.\n40 ÷ 50 × 100 = 80%"}},{"q":"타이어가 동적 불평형 상태에서 70~90km/h 정도로 달리면 바퀴에 어떤 현상이 발생하는가?","o":["로드 홀딩 현상","트램핑 현상","토-아웃 현상","시미 현상"],"a":3,"e":{"w":["로드 홀딩은 타이어가 노면을 붙잡는 성질입니다.","트램핑은 정적 불평형일 때 바퀴가 위아래로 뛰는 현상입니다.","토-아웃은 바퀴 정렬에 관한 말입니다."],"d":"바퀴의 좌우 무게가 맞지 않는 동적 불평형 상태로 달리면 바퀴가 좌우로 떨리는 시미 현상이 일어납니다."}},{"q":"브레이크 드럼점검사항과 가장 거리가 먼 것은?","o":["드럼의 진원도","드럼의 두께","드럼의 내경","드럼의 외경"],"a":3,"e":{"w":["진원도는 점검사항입니다. 닳아서 찌그러졌는지 봅니다.","두께는 점검사항입니다.","내경은 점검사항입니다. 닳아서 커졌는지 봅니다."],"d":"브레이크 드럼은 슈가 닿는 안쪽이 닳습니다. 안지름, 진원도, 두께, 균열을 점검하고 바깥지름은 점검하지 않습니다."}},{"q":"유압 브레이크는 무슨 원리를 응용한 것인가?","o":["아르키메데스의 원리","베르누이의 원리","아인슈타인의 원리","파스칼의 원리"],"a":3,"e":{"w":["아르키메데스의 원리는 부력에 관한 원리입니다.","베르누이의 원리는 유체의 속도와 압력에 관한 원리입니다.","아인슈타인의 원리는 관계가 없습니다."],"d":"파스칼의 원리는 밀폐된 액체의 한 곳에 압력을 주면 모든 곳에 같은 크기로 전달된다는 것입니다. 유압 브레이크는 이 원리로 작은 힘을 큰 힘으로 바꿉니다."}},{"q":"기관의 회전력이 0.72kgf·m회전수가 5000rpm일 때 제동마력은 약 얼마인가?","o":["2ps","5ps","8ps","10ps"],"a":1,"e":{"w":["2ps는 계산과 맞지 않습니다.","8ps는 계산과 맞지 않습니다.","10ps는 계산과 맞지 않습니다."],"d":"제동마력 = 회전력 × 회전수 ÷ 716입니다.\n0.72 × 5000 ÷ 716 = 약 5ps"}},{"q":"유압식 제동장치에서 제동 시 제동력 상태가 불량할 경우 고장 원인으로 거리가 먼 것은?","o":["브레이크액의 누설","브레이크슈 라이닝의 과대마모","브레이크액 부족 또는 공기 유입","비등점이 높은 브레이크액 사용"],"a":3,"e":{"w":["브레이크액이 새면 유압이 전달되지 않습니다. 고장 원인입니다.","라이닝이 많이 닳으면 제동력이 떨어집니다. 고장 원인입니다.","액이 부족하거나 공기가 들어가면 제동력이 떨어집니다. 고장 원인입니다."],"d":"비등점이 높은 브레이크액은 잘 끓지 않아 베이퍼 록을 막아 줍니다. 좋은 브레이크액이므로 고장 원인이 아닙니다."}},{"q":"전자제어 제동장치(ABS)의 구성요소 틀린 것은?","o":["휠 스피드 센서(wheel speed sensor)","컨트롤 유닛(control unit)","하이드로릭 유닛(hydraulic unit)","크랭크 앵글 센서(crank angle sensor)"],"a":3,"e":{"w":["휠 스피드 센서는 ABS의 구성요소입니다.","컨트롤 유닛은 ABS의 구성요소입니다.","하이드로릭 유닛은 ABS의 구성요소입니다."],"d":"크랭크 앵글 센서는 엔진의 회전수와 크랭크축 위치를 감지하는 엔진 제어용 센서입니다. ABS의 구성요소가 아닙니다."}},{"q":"타이어 폭이 180(㎜)이고 타이어 단면 높이가 90(㎜)이면 편평비(%)는?","o":["500%","50%","600%","60%"],"a":1,"e":{"w":["500%는 계산과 맞지 않습니다.","600%는 계산과 맞지 않습니다.","60%는 계산과 맞지 않습니다."],"d":"편평비 = 타이어 단면 높이 ÷ 타이어 폭 × 100입니다.\n90 ÷ 180 × 100 = 50%"}},{"q":"전자제어 구동력 조절장치(TCS)에서 컨트롤 유닛에 입력되는 신호가 아닌 것은?","o":["스로틀 포지션센서","브레이크 스위치","휠 속도센서","TCS구동 모터"],"a":3,"e":{"w":["스로틀 포지션센서는 입력 신호입니다.","브레이크 스위치는 입력 신호입니다.","휠 속도센서는 입력 신호입니다."],"d":"TCS 구동 모터는 컨트롤 유닛의 명령을 받아 움직이는 부품입니다. 입력이 아니라 출력입니다."}},{"q":"엔진의 출력성능을 향상시키기 위하여 제동평균 유효압력을 증대시키는 방법을 사용하고 있다. 이중 틀린 것은?","o":["배기밸브 직후 압력인 배압을 낮게 하여 잔류 가스량을 감소시킨다.","흡·배기 때의 유동저항을 저감시킨다.","흡기 온도를 흡기구의 배치 등을 고려하려 가급적 낮게 한다.","흡기압력을 낮추어서 흡기의 비중량을 작게 한다."],"a":3,"e":{"w":["배압을 낮추면 남는 가스가 줄어 새 혼합기가 많이 들어옵니다. 옳은 방법입니다.","흡·배기의 흐름 저항을 줄입니다. 옳은 방법입니다.","흡기 온도를 낮추면 공기 밀도가 커집니다. 옳은 방법입니다."],"d":"흡기압력을 높여야 같은 부피에 더 많은 공기가 들어갑니다. 흡기압력을 낮추면 공기의 무게(비중량)가 줄어 출력이 떨어집니다."}},{"q":"전자제어 제동장치(ABS)에 대한 설명으로 틀린 것은?","o":["전륜은 조향 바퀴이므로 후륜에만 장착이 가능하다.","후륜의 조기고착에 의한 옆 방향 미끄러짐을 최소화 시킨다.","노면의 상태가 변화하여도 최적의 제동효과를 얻기 위한 것이다.","타이어의 미끄럼(slip)률이 마찰계수 최고치를 초과 하지 않도록 한다."],"a":0,"e":{"w":["뒷바퀴가 먼저 잠겨 옆으로 미끄러지는 것을 줄입니다. 옳은 설명입니다.","노면 상태가 변해도 가장 알맞은 제동 효과를 얻습니다. 옳은 설명입니다.","타이어의 미끄럼률이 마찰계수가 가장 큰 범위를 넘지 않게 합니다. 옳은 설명입니다."],"d":"ABS는 앞바퀴와 뒷바퀴 모두에 장착합니다. 앞바퀴가 잠기면 방향을 잡을 수 없으므로 앞바퀴에 특히 필요합니다. 후륜에만 장착할 수 있다는 ①이 틀렸습니다."}},{"q":"드럼식 제동장치에서 자기 작동 작용을 하는 슈는?","o":["리딩 슈","앵커 슈","트레일링 슈","패드 슈"],"a":0,"e":{"w":["앵커 슈라는 슈는 없습니다.","트레일링 슈는 드럼의 회전이 슈를 밀어내 제동력이 줄어듭니다.","패드는 디스크 브레이크의 부품입니다."],"d":"리딩 슈는 드럼이 도는 방향으로 벌어지는 슈입니다. 드럼의 회전이 슈를 더 세게 끌어당겨 제동력이 커집니다. 이것을 자기 작동 작용이라고 합니다."}},{"q":"구동력을 크게 하려면 축 회전력과 구동바퀴의 반경은 어떻게 되어야 하는가?","o":["축 회전력 및 바퀴의 반경 모두 커져야 한다.","바퀴의 반경과 관계가 없다.","반경이 큰 바퀴를 사용한다.","반경이 작은 바퀴를 사용한다."],"a":3,"e":{"w":["바퀴 반경이 커지면 구동력은 작아집니다.","구동력은 바퀴의 반경과 관계가 있습니다.","반경이 큰 바퀴는 구동력이 작아집니다."],"d":"구동력 = 축 회전력 ÷ 바퀴의 반경입니다. 회전력이 클수록, 바퀴의 반경이 작을수록 구동력이 커집니다."}},{"q":"유압 브레이크 장치에서 잔압을 형성하고 유지시켜 주는 것은?","o":["마스터 실린더 피스톤 1차 컵과 2차 컵","마스터 실린더의 체크밸브와 리턴 스프링","마스터 실린더 오일탱크","마스터 실린더 피스톤"],"a":1,"e":{"w":["1차 컵은 유압을 만들고 2차 컵은 오일 누출을 막습니다.","오일탱크는 브레이크액을 저장합니다.","피스톤은 브레이크액을 밀어내는 부품입니다."],"d":"마스터 실린더의 체크밸브와 리턴 스프링이 브레이크를 놓은 뒤에도 파이프 안에 약간의 압력(잔압)을 남겨 둡니다. 잔압은 공기가 들어오는 것을 막고 다음 제동을 빠르게 합니다."}},{"q":"타이어 트레드 패턴의 종류가 아닌 것은?","o":["러그패턴","블록패턴","리브러그 패턴","카커스 패턴"],"a":3,"e":{"w":["러그 패턴은 가로 방향 홈의 트레드 패턴입니다.","블록 패턴은 덩어리 모양의 트레드 패턴입니다.","리브러그 패턴은 세로 홈과 가로 홈을 섞은 트레드 패턴입니다."],"d":"트레드 패턴에는 리브, 러그, 리브러그, 블록 패턴이 있습니다. 카커스는 타이어의 뼈대를 이루는 부분이지 패턴의 종류가 아닙니다."}},{"q":"제동출력 22ps, 회전수 5500rpm인 기관의 축 토크는 약 얼마인가?","o":["8.36kgf·m","6.42kgf·m","3.84kgf·m","2.86kgf·m"],"a":3,"e":{"w":["8.36kgf·m는 계산과 맞지 않습니다.","6.42kgf·m는 계산과 맞지 않습니다.","3.84kgf·m는 계산과 맞지 않습니다."],"d":"축 토크 = 716 × 제동출력 ÷ 회전수입니다.\n716 × 22 ÷ 5500 = 약 2.86kgf·m"}},{"q":"플라이 휠(fly wheel)의 무게를 좌우하는 것과 가장 밀접한 관계가 있는 것은?","o":["행정의 크기","크랭크축의 강도","링기어의 잇수와 지름","회전수와 실린더 수"],"a":3,"e":{"w":["행정의 크기와는 직접 관계가 없습니다.","크랭크축의 강도와는 관계가 없습니다.","링기어는 시동용 톱니입니다."],"d":"플라이휠은 폭발과 폭발 사이의 회전을 고르게 이어 줍니다. 실린더 수가 많고 회전수가 높으면 폭발 간격이 짧아 가벼워도 되고, 반대면 무거워야 합니다."}},{"q":"연료의 저위발열량 10,500kcal/kgf, 제동마력 93PS, 제동 열효율 31%인 기관의 시간당 연료 소비량(kgf/h)은?","o":["약 18.07","약 17.07","약 16.07","약 5.53"],"a":0,"e":{"w":["17.07은 계산과 맞지 않습니다.","16.07은 계산과 맞지 않습니다.","5.53은 계산과 맞지 않습니다."],"d":"1PS로 1시간 일한 열량은 632.3kcal입니다.\n연료 소비량 = 632.3 × 제동마력 ÷ (열효율 × 저위발열량)\n= 632.3 × 93 ÷ (0.31 × 10,500) = 58,804 ÷ 3,255 = 약 18.07kgf/h"}},{"q":"브레이크를 작동시키다 페달을 놓았을 때 브레이크가 풀리지 않는 원인과 관계없는 것은?","o":["마스터 실린더의 리턴 스프링 불량","마스터 실린더의 리턴 구멍의 막힘","드럼과 라이닝의 소결","브레이크의 파열"],"a":3,"e":{"w":["리턴 스프링이 불량하면 피스톤이 돌아오지 못해 풀리지 않습니다.","리턴 구멍이 막히면 유압이 빠지지 못해 풀리지 않습니다.","드럼과 라이닝이 눌어붙으면 풀리지 않습니다."],"d":"브레이크 파이프가 파열되면 유압이 새어 브레이크가 듣지 않습니다. 풀리지 않는 것과는 반대 현상입니다."}},{"q":"클러치의 구비조건이 아닌 것은?","o":["동력전달이 확실하고 신속할 것.","방열이 잘되어 과열되지 않을 것.","회전부의 평형이 좋을 것.","회전 관성이 클 것."],"a":3,"e":{"w":["동력을 확실하고 빠르게 전달해야 합니다. 구비조건입니다.","열이 잘 빠져 과열되지 않아야 합니다. 구비조건입니다.","회전 부분의 평형이 좋아야 합니다. 구비조건입니다."],"d":"회전 관성이 크면 클러치를 끊어도 계속 돌려고 해 변속이 어렵습니다. 클러치는 회전 관성이 작아야 합니다."}},{"q":"타이어의 구조 중 노면과 직접 접촉하는 부분은?","o":["트레드","카커스","비드","숄더"],"a":0,"e":{"w":["카커스는 타이어의 뼈대입니다.","비드는 림에 끼워지는 부분입니다.","숄더는 트레드와 사이드월 사이의 어깨 부분입니다."],"d":"트레드는 노면과 직접 닿는 두꺼운 고무층입니다. 홈(패턴)이 파여 있어 미끄럼을 막고 물을 빼냅니다.","g":"tire"}},{"q":"현가장치가 갖추어야 할 기능이 아닌 것은?","o":["승차감의 향상을 위해 상하 움직임에 적당한 유연성이 있어야 한다.","원심력이 발생되어야 한다.","주행 안정성이 있어야 한다.","구동력 및 제동력 발생 시 적당한 강성이 있어야 한다."],"a":1,"e":{"w":["위아래 움직임에 알맞은 유연성이 있어야 합니다. 갖추어야 할 기능입니다.","주행 안정성이 있어야 합니다. 갖추어야 할 기능입니다.","구동력과 제동력이 생길 때 알맞은 강성이 있어야 합니다. 갖추어야 할 기능입니다."],"d":"현가장치는 충격을 흡수하고 바퀴를 노면에 붙여 주는 장치입니다. 원심력을 발생시키는 것은 현가장치의 기능이 아닙니다."}},{"q":"브레이크장치의 유압회로에서 발생하는 베이퍼록의 원인이 아닌 것은?","o":["긴 내리막길에서 과도한 브레이크 사용","비점이 높은 브레이크액을 사용했을 때","드럼과 라이닝의 끌림에 의한 가열","브레이크슈 리턴 스프링의 쇠손에 의한 잔압 저하"],"a":1,"e":{"w":["긴 내리막에서 브레이크를 많이 쓰면 액이 끓습니다. 원인입니다.","드럼과 라이닝이 끌리면 열이 납니다. 원인입니다.","잔압이 낮아지면 액이 쉽게 끓습니다. 원인입니다."],"d":"베이퍼록은 브레이크액이 끓어 기포가 생기는 현상입니다. 비점(끓는점)이 높은 브레이크액은 잘 끓지 않으므로 원인이 아닙니다."}},{"q":"타이어 압력 모니터링 장치(TPMS)의 점검, 정비 시 잘못된 것은?","o":["타이어 압력센서는 공기 주입 밸브와 일체로 되어 있다.","타이어 압력센서 장착용 휠은 일반 휠과 다르다.","타이어 분리 시 타이어 압력센서가 파손되지 않게 한다.","타이어 압력센서용 배터리 수명은 영구적이다."],"a":3,"e":{"w":["압력센서는 공기 주입 밸브와 한 몸으로 되어 있습니다. 옳은 내용입니다.","센서를 다는 휠은 일반 휠과 다릅니다. 옳은 내용입니다.","타이어를 분리할 때 센서가 파손되지 않게 주의합니다. 옳은 내용입니다."],"d":"TPMS 센서는 안에 든 배터리로 작동합니다. 배터리에는 수명이 있어 다 닳으면 센서를 교환해야 합니다. 영구적이라는 ④가 잘못되었습니다."}},{"q":"오버러닝 클러치 형식의 기동 전동기에서 기관이 시동된 후에도 계속해서 키 스위치를 작동시키면?","o":["기동 전동기의 전기자가 타기 시작하여 소손된다.","기동 전동기의 전기자는 무부하 상태로 공회전한다.","기동 전동기의 전기자가 정지된다.","기동 전동기의 전기자가 기관회전보다 고속 회전한다."],"a":1,"e":{"w":["공회전하므로 전기자가 타지는 않습니다.","전기자는 멈추지 않고 계속 돕니다.","전기자가 엔진보다 빨리 도는 것이 아닙니다."],"d":"오버러닝 클러치는 한쪽 방향으로만 힘을 전달합니다. 시동이 걸려 엔진이 더 빨리 돌면 클러치가 헛돌아 엔진의 힘이 전동기로 넘어오지 않습니다. 전기자는 부하 없이 공회전합니다."}},{"q":"수동변속기 정비 시 측정할 항목이 아닌 것은?","o":["주축 엔드플레이","주축의 휨","기어의 직각도","슬리브와 포크의 간극"],"a":2,"e":{"w":["주축 엔드플레이는 측정 항목입니다.","주축의 휨은 측정 항목입니다.","슬리브와 포크의 간극은 측정 항목입니다."],"d":"수동변속기는 축의 휨과 엔드플레이, 기어의 백래시, 포크와 슬리브의 간극을 측정합니다. 기어의 직각도는 측정하지 않습니다."}},{"q":"유압식 브레이크 정비에 대한 설명으로 틀린 것은?","o":["패드는 안쪽과 바깥쪽을 세트로 교환한다.","패드는 좌·우 어느 한쪽이 교환시기가 되면 좌·우 동시에 교환한다.","패드교환 후 브레이크 페달을 2~3회 밟아준다.","브레이크액은 공기와 접촉 시 비등점이 상승하여 제동성능이 향상된다."],"a":3,"e":{"w":["패드는 안쪽과 바깥쪽을 세트로 교환합니다. 옳은 설명입니다.","좌우 한쪽이 교환 시기가 되면 좌우를 함께 교환합니다. 옳은 설명입니다.","패드를 교환한 뒤 브레이크를 2~3회 작동시켜 패드를 디스크에 붙여 줍니다. 옳은 설명입니다."],"d":"브레이크액은 공기 중의 수분을 빨아들입니다. 수분이 섞이면 비등점이 낮아져 베이퍼록이 생기기 쉽습니다. 비등점이 상승한다는 ④가 틀렸습니다."}},{"q":"유압식 제동장치에서 제동력이 떨어지는 원인 중 틀린 것은?","o":["브레이크 오일의 누설","엔진 출력 저하","패드 및 라이닝의 마멸","유압장치에 공기 유입"],"a":1,"e":{"w":["브레이크 오일이 새면 제동력이 떨어집니다.","패드와 라이닝이 닳으면 제동력이 떨어집니다.","유압장치에 공기가 들어가면 제동력이 떨어집니다."],"d":"제동력은 브레이크 장치가 만듭니다. 엔진의 출력이 떨어지는 것은 제동력과 관계가 없습니다."}},{"q":"지면과 직접 접촉은 하지 않고 주행 중 가장 많은 완충작용을 하고 타이어 규격 및 각종 정보가 표시된 부분은?","o":["카커스(carcass)부","트레드(tread)부","사이드 월(side wall)부","비드(bead)부"],"a":2,"e":{"w":["카커스는 타이어 안쪽의 뼈대입니다.","트레드는 노면과 직접 닿는 부분입니다.","비드는 림에 끼워지는 부분입니다."],"d":"사이드 월은 타이어의 옆면입니다. 노면에 닿지 않고, 잘 휘어져 충격을 흡수하며, 타이어 규격과 제조 정보가 적혀 있습니다.","g":"tire"}},{"q":"타이어의 뼈대가 되는 부분으로서 공기압력을 견디어 일정한 체적을 유지하고 또 하중이나 충격에 따라 변형하여 완충작용을 하는 것은?","o":["브레이커","카커스","트레드","비드부"],"a":1,"e":{"w":["브레이커는 트레드와 카커스 사이에서 충격을 줄이는 층입니다.","트레드는 노면과 닿는 부분입니다.","비드부는 림에 끼워지는 부분입니다."],"d":"카커스는 코드(실)를 고무로 싸서 여러 겹 겹친 타이어의 뼈대입니다. 공기압을 견디고 하중과 충격에 따라 변형되며 완충 작용을 합니다.","g":"tire"}},{"q":"다음 중 브레이크 드럼이 갖추어야 할 조건과 관계가 없는 것은?","o":["무거워야 한다.","방열이 잘 되어야 한다.","강성과 내마모성이 있어야 한다.","동적․정적평형이 되어야 한다."],"a":0,"e":{"w":["열이 잘 빠져야 합니다. 갖추어야 할 조건입니다.","강성과 내마모성이 있어야 합니다. 갖추어야 할 조건입니다.","정적·동적 평형이 맞아야 합니다. 갖추어야 할 조건입니다."],"d":"브레이크 드럼은 바퀴와 함께 돕니다. 무거우면 가속과 제동에 불리하고 승차감도 나빠지므로 가벼워야 합니다."}},{"q":"브레이크액의 특성으로서 장점이 아닌 것은?","o":["높은 비등점","낮은 응고점","강한 흡습성","큰 점도지수"],"a":2,"e":{"w":["비등점이 높아야 잘 끓지 않습니다. 장점입니다.","응고점이 낮아야 겨울에 얼지 않습니다. 장점입니다.","점도지수가 커야 온도가 변해도 점도 변화가 적습니다. 장점입니다."],"d":"브레이크액이 수분을 빨아들이면 비등점이 낮아져 베이퍼록이 생기기 쉽습니다. 강한 흡습성은 장점이 아니라 단점입니다."}},{"q":"전자제어 제동장치(ABS)에서 휠 스피드 센서의 역할은?","o":["휠의 회전속도 감지","휠의 감속 상태 감지","휠의 속도 비교 평가","휠의 제동압력 감지"],"a":0,"e":{"w":["감속 상태는 컨트롤 유닛이 계산합니다.","속도를 비교하고 평가하는 것은 컨트롤 유닛입니다.","제동압력은 휠 스피드 센서가 감지하지 않습니다."],"d":"휠 스피드 센서는 바퀴의 회전 속도를 감지하는 일만 합니다. 이 신호를 받아 감속을 계산하고 비교하는 것은 컨트롤 유닛입니다."}},{"q":"제동장치에서 디스크 브레이크의 형식으로 적합한 것은?","o":["앵커핀 형","2 리딩 형","유니서보 형","플로팅 캘리퍼 형"],"a":3,"e":{"w":["앵커핀 형은 드럼 브레이크의 형식입니다.","2리딩 형은 드럼 브레이크의 형식입니다.","유니서보 형은 드럼 브레이크의 형식입니다."],"d":"디스크 브레이크에는 캘리퍼가 고정된 고정 캘리퍼 형과, 캘리퍼가 좌우로 움직이는 플로팅(부동) 캘리퍼 형이 있습니다."}},{"q":"속도계 기어가 설치되는 곳으로 맞는 것은?","o":["변속기 1속 기어","변속기 부축","변속기 출력축","변속기 톱기어"],"a":2,"e":{"w":["1속 기어는 1단일 때만 동력을 전달합니다.","부축은 바퀴 속도와 일정한 비율로 돌지 않습니다.","톱기어는 최고단일 때만 동력을 전달합니다."],"d":"속도계는 바퀴의 회전 속도를 알아야 합니다. 변속기 출력축은 어느 단에서나 바퀴와 일정한 비율로 돌므로 여기에 속도계 기어를 답니다."}},{"q":"마스터 실린더 푸시로드에 작용하는 힘이 120kgf 이고, 피스톤 단면적이 3㎠ 일 때 발생 유압은?","o":["30kgf/㎠","40kgf/㎠","50kgf/㎠","60kgf/㎠"],"a":1,"e":{"w":["30kgf/㎠는 계산과 맞지 않습니다.","50kgf/㎠는 계산과 맞지 않습니다.","60kgf/㎠는 계산과 맞지 않습니다."],"d":"압력 = 힘 ÷ 단면적입니다.\n120kgf ÷ 3㎠ = 40kgf/㎠"}},{"q":"하이드로 플래닝 현상을 방지하는 방법이 아닌 것은?","o":["트레드의 마모가 적은 타이어를 사용한다.","타이어의 공기압을 높인다.","트레드 패턴은 카프형으로 셰이빙 가공한 것을 사용한다.","러그 패턴의 타이어를 사용한다."],"a":3,"e":{"w":["트레드가 많이 남아 있어야 물을 잘 빼냅니다. 방지 방법입니다.","공기압을 높이면 접지 압력이 커져 물을 잘 밀어냅니다. 방지 방법입니다.","카프형으로 셰이빙 가공한 트레드는 물을 잘 빼냅니다. 방지 방법입니다."],"d":"수막현상은 타이어와 노면 사이의 물이 빠지지 못해 타이어가 물 위에 뜨는 현상입니다. 물이 뒤로 잘 빠지는 리브 패턴이 유리하고, 가로 홈인 러그 패턴은 물이 잘 빠지지 않습니다."}},{"q":"마스터 실린더에서 피스톤 1차 컵이 하는 일은?","o":["오일 누출 방지","유압 발생","잔압 형성","베이퍼록 방지"],"a":1,"e":{"w":["오일 누출을 막는 것은 2차 컵입니다.","잔압을 만드는 것은 체크밸브입니다.","베이퍼록 방지는 컵의 역할이 아닙니다."],"d":"마스터 실린더의 1차 컵은 피스톤이 밀릴 때 브레이크액을 가두어 눌러 줍니다. 유압을 발생시키는 역할입니다."}}]},{"g":"보충 문제","name":"전기 보충 문제","id":"p19","qs":[{"q":"전자제어 점화장치에서 전자제어모듈(ECM)에 입력되는 정보로 거리가 먼 것은?","o":["엔진회전수 신호","흡기매니폴드 압력센서","엔진오일 압력센서","수온 센서"],"a":2,"e":{"w":["엔진회전수 신호는 점화시기를 정하는 기본 정보입니다.","흡기매니폴드 압력센서는 엔진 부하를 알려 주는 정보입니다.","수온 센서는 점화시기를 보정하는 정보입니다."],"d":"점화시기는 엔진 회전수, 부하(흡기 압력), 온도로 정합니다. 엔진오일 압력센서는 경고등을 켜는 데 쓰일 뿐 점화 제어와는 거리가 멉니다."}},{"q":"전조등 회로의 구성부품이 아닌 것은?","o":["라이트 스위치","전조등 릴레이","스테이터","딤머 스위치"],"a":2,"e":{"w":["라이트 스위치는 전조등 회로의 부품입니다.","전조등 릴레이는 전조등 회로의 부품입니다.","딤머 스위치는 상향등과 하향등을 바꾸는 전조등 회로의 부품입니다."],"d":"스테이터는 발전기 안에서 전기를 만드는 코일입니다. 충전 회로의 부품이지 전조등 회로의 부품이 아닙니다."}},{"q":"교류발전기에서 축전지의 역류를 방지하는 컷아웃 릴레이가 없는 이유는?","o":["트랜지스터가 있기 때문이다.","점화스위치가 있기 때문이다.","실리콘 다이오드가 있기 때문이다.","전압릴레이가 있기 때문이다."],"a":2,"e":{"w":["트랜지스터 때문이 아닙니다.","점화스위치 때문이 아닙니다.","전압릴레이는 전압을 조정하는 부품입니다."],"d":"실리콘 다이오드는 전류를 한쪽으로만 흘립니다. 발전기에서 축전지로는 흐르지만 축전지에서 발전기로는 거꾸로 흐르지 못합니다. 그래서 역류를 막는 컷아웃 릴레이가 필요 없습니다."}},{"q":"축전지를 구성하는 요소가 아닌 것은?","o":["양극판","음극판","정류자","전해액"],"a":2,"e":{"w":["양극판은 축전지의 구성 요소입니다.","음극판은 축전지의 구성 요소입니다.","전해액은 축전지의 구성 요소입니다."],"d":"축전지는 양극판, 음극판, 격리판, 전해액, 케이스로 이루어집니다. 정류자는 전동기와 직류 발전기의 부품입니다."}},{"q":"용량과 전압이 같은 축전지 2개를 직렬로 연결할 때의 설명으로 옳은 것은?","o":["용량은 축전지 2개와 같다.","용량과 전압 모두 2배로 증가한다.","전압이 2배로 증가한다.","용량은 2배로 증가하지만 전압은 같다."],"a":2,"e":{"w":["용량은 축전지 1개와 같습니다.","용량은 변하지 않습니다.","용량이 2배가 되고 전압이 같은 것은 병렬 연결입니다."],"d":"같은 축전지 2개를 직렬로 연결하면 전압은 2배가 되고 용량은 1개일 때와 같습니다. 병렬로 연결하면 반대로 용량이 2배가 되고 전압은 같습니다.","g":"batt"}},{"q":"교류 발전기 발전원리에 응용되는 법칙은?","o":["플레밍의 왼손 법칙","플레밍의 오른손 법칙","옴의 법칙","자기포화의 법칙"],"a":1,"e":{"w":["플레밍의 왼손 법칙은 전동기의 원리입니다.","옴의 법칙은 전압, 전류, 저항의 관계입니다.","자기포화는 발전 원리가 아닙니다."],"d":"자기장 속에서 도체가 움직이면 전기가 생깁니다. 이때 유도되는 전류의 방향을 알려 주는 것이 플레밍의 오른손 법칙이고, 발전기의 원리입니다."}},{"q":"납산 축전지의 온도가 낮아졌을 때 발생되는 현상이 아닌 것은?","o":["전압이 떨어진다.","전해액의 비중이 내려간다.","용량이 적어진다.","동결하기 쉽다."],"a":1,"e":{"w":["온도가 낮으면 화학 반응이 느려져 전압이 떨어집니다. 발생하는 현상입니다.","온도가 낮으면 용량이 줄어듭니다. 발생하는 현상입니다.","온도가 낮으면 얼기 쉽습니다. 발생하는 현상입니다."],"d":"전해액은 온도가 낮아지면 부피가 줄어 비중이 올라갑니다. 비중이 내려간다는 ②가 발생하는 현상이 아닙니다."}},{"q":"전자제어 배전 점화 방식(DLI : Distributor less Ignition)에 사용되는 구성품이 아닌 것은?","o":["파워트랜지스터","원심진각장치","점화코일","크랭크각센서"],"a":1,"e":{"w":["파워트랜지스터는 1차 전류를 끊고 잇는 구성품입니다.","점화코일은 높은 전압을 만드는 구성품입니다.","크랭크각센서는 점화시기의 기준 신호를 주는 구성품입니다."],"d":"DLI는 배전기가 없는 점화 방식입니다. 원심진각장치는 배전기 안에 들어 있던 기계식 진각장치이므로 DLI에는 없습니다. 진각은 ECU가 전자적으로 합니다."}},{"q":"반도체에 대한 특징으로 틀린 것은?","o":["극히 소형이며 가볍다.","예열시간이 불필요하다.","내부 전력손실이 크다.","정격 값 이상이 되면 파괴된다."],"a":2,"e":{"w":["매우 작고 가볍습니다. 옳은 특징입니다.","예열시간이 필요 없습니다. 옳은 특징입니다.","정격 값을 넘으면 파괴됩니다. 옳은 특징입니다."],"d":"반도체는 내부에서 버려지는 전력이 매우 적습니다. 내부 전력손실이 크다는 ③이 틀렸습니다."}},{"q":"기동전동기에 많은 전류가 흐르는 원인으로 옳은 것은?","o":["높은 내부저항","전기자 코일의 단선","내부접지","계자코일의 단선"],"a":2,"e":{"w":["내부저항이 높으면 전류가 적게 흐릅니다.","전기자 코일이 끊어지면 전류가 흐르지 않습니다.","계자코일이 끊어지면 전류가 흐르지 않습니다."],"d":"내부접지는 코일의 절연이 벗겨져 몸체(접지)에 닿은 것입니다. 전류가 코일을 다 거치지 않고 바로 접지로 빠져 저항이 작아지므로 전류가 지나치게 많이 흐릅니다."}},{"q":"납산축전지 취급 시 주의사항으로 틀린 것은?","o":["배터리 접속 시 (＋)단자부터 접속한다.","전해액이 옷에 묻지 않도록 주의한다.","전해액이 부족하면 시냇물로 보충한다.","배터리 분리 시 (-)단자부터 분리한다."],"a":2,"e":{"w":["연결할 때는 (+)단자부터 접속합니다. 옳은 내용입니다.","전해액은 묽은 황산이라 옷에 묻지 않게 주의합니다. 옳은 내용입니다.","분리할 때는 (-)단자부터 분리합니다. 옳은 내용입니다."],"d":"전해액이 부족하면 불순물이 없는 증류수를 보충합니다. 시냇물이나 수돗물에는 불순물이 있어 자기방전을 일으키고 극판을 손상시킵니다."}},{"q":"전조등의 광도가 광원에서 25000cd의 밝기일 경우 전방 100m 지점에서의 조도는?","o":["250Lux","50Lux","12.5Lux","2.5Lux"],"a":3,"e":{"w":["250Lux는 계산과 맞지 않습니다.","50Lux는 계산과 맞지 않습니다.","12.5Lux는 계산과 맞지 않습니다."],"d":"조도 = 광도 ÷ 거리²입니다.\n25,000 ÷ 100² = 25,000 ÷ 10,000 = 2.5Lux"}},{"q":"발전기 자체의 고장이 아닌 것은?","o":["발전기 정류자의 고장","브러시의 소손에 의한 고장","슬립 링의 오손에 의한 고장","릴레이의 오손과 소손에 의한 고장"],"a":3,"e":{"w":["정류자의 고장은 발전기 자체의 고장입니다.","브러시의 소손은 발전기 자체의 고장입니다.","슬립 링의 오손은 발전기 자체의 고장입니다."],"d":"릴레이(조정기)는 발전기 밖에서 전압과 전류를 조정하는 부품입니다. 릴레이의 고장은 발전기 자체의 고장이 아닙니다."}},{"q":"축전지 충·방전 작용에 해당되는 것은?","o":["발열 작용","화학 작용","자기 작용","발광 작용"],"a":1,"e":{"w":["발열 작용은 전류가 흐를 때 열이 나는 것입니다.","자기 작용은 전류가 자기장을 만드는 것입니다.","발광 작용은 빛을 내는 것입니다."],"d":"축전지는 극판의 납과 전해액의 황산이 화학 반응을 하면서 전기를 내보내고(방전), 전기를 받으면 거꾸로 반응해 원래대로 돌아갑니다(충전). 화학 작용을 이용합니다."}},{"q":"점화장치의 파워트랜지스터가 비정상시 발생되는 현상이 아닌 것은?","o":["엔진시동이 어렵다.","연료소모가 많다.","주행 시 가속력이 떨어진다.","크랭킹이 안 된다."],"a":3,"e":{"w":["불꽃이 약해 시동이 어렵습니다. 발생하는 현상입니다.","불완전 연소로 연료 소모가 많아집니다. 발생하는 현상입니다.","가속력이 떨어집니다. 발생하는 현상입니다."],"d":"파워트랜지스터는 점화코일의 1차 전류를 끊고 잇는 부품입니다. 크랭킹은 기동전동기가 엔진을 돌리는 것이므로 파워트랜지스터와 관계가 없습니다."}},{"q":"스프링 정수가 5kgf/㎜의 코일을 1㎝ 압축하는데 필요한 힘은?","o":["5kgf","10kgf","50kgf","100kgf"],"a":2,"e":{"w":["5kgf는 1mm를 압축하는 힘입니다.","10kgf는 계산과 맞지 않습니다.","100kgf는 계산과 맞지 않습니다."],"d":"힘 = 스프링 정수 × 압축량입니다. 1cm는 10mm입니다.\n5kgf/mm × 10mm = 50kgf"}},{"q":"전자제어 점화장치의 파워TR에서 ECU에 의해 제어되는 단자는?","o":["베이스 단자","콜렉터 단자","이미터 단자","접지 단자"],"a":0,"e":{"w":["컬렉터 단자는 점화코일 (-)단자와 연결됩니다.","이미터 단자는 접지와 연결됩니다.","접지 단자는 ECU가 제어하는 단자가 아닙니다."],"d":"파워 트랜지스터의 베이스는 ECU와 연결됩니다. ECU가 베이스에 신호를 넣었다 끊었다 해서 점화코일의 1차 전류를 단속합니다."}},{"q":"납산축전지(battery)의 방전 시 화학반응에 대한 설명으로 틀린 것은?","o":["극판의 과산화납은 점점 황산납으로 변한다.","극판의 해면상납은 점점 황산납으로 변한다.","전해액은 물만 남게 된다.","전해액의 비중은 점점 높아진다."],"a":3,"e":{"w":["양극판의 과산화납은 황산납으로 변합니다. 옳은 설명입니다.","음극판의 해면상납은 황산납으로 변합니다. 옳은 설명입니다.","전해액은 황산이 줄어 물에 가까워집니다. 옳은 설명입니다."],"d":"방전하면 전해액의 황산이 극판으로 들어가 전해액이 물에 가까워집니다. 비중은 점점 낮아지므로 높아진다는 ④가 틀렸습니다."}},{"q":"점화코일의 1차 저항을 측정할 때 사용하는 측정기로 옳은 것은?","o":["진공 시험기","압축압력 시험기","회로 시험기","축전지 용량 시험기"],"a":2,"e":{"w":["진공 시험기는 흡기 진공을 재는 장비입니다.","압축압력 시험기는 압축압력을 재는 장비입니다.","축전지 용량 시험기는 축전지 상태를 보는 장비입니다."],"d":"저항은 회로 시험기(멀티 테스터)의 저항 측정 기능으로 잽니다."}},{"q":"PNP형 트랜지스터의 순방향 전류는 어떤 방향으로 흐르는가?","o":["컬렉터에서 베이스로","이미터에서 베이스로","베이스에서 이미터로","베이스에서 컬렉터로"],"a":1,"e":{"w":["컬렉터에서 베이스로 흐르지 않습니다.","베이스에서 이미터로 흐르는 것은 NPN형입니다.","베이스에서 컬렉터로 흐르지 않습니다."],"d":"PNP형 트랜지스터는 이미터가 P형, 베이스가 N형입니다. 순방향 전류는 P에서 N으로, 곧 이미터에서 베이스로 흐릅니다."}},{"q":"축전지의 극판이 영구 황산납으로 변하는 원인으로 틀린 것은?","o":["전해액이 모두 증발되었다.","방전된 상태로 장기간 방치하였다.","극판이 전해액에 담겨있다.","전해액의 비중이 너무 높은 상태로 관리하였다."],"a":2,"e":{"w":["전해액이 증발해 극판이 드러나면 황산납으로 굳습니다. 원인입니다.","방전된 채 오래 두면 황산납이 굳습니다. 원인입니다.","비중이 너무 높으면 황산납이 굳기 쉽습니다. 원인입니다."],"d":"극판이 전해액에 잠겨 있는 것은 정상 상태입니다. 영구 황산납(설페이션)의 원인이 아닙니다."}},{"q":"축전지를 차에 설치한 채 급속충전을 할 때의 주의사항으로 틀린 것은?","o":["축전지 각 셀(cell)의 플러그를 열어 놓는다.","전해액 온도가 45℃를 넘지 않도록 한다.","축전지 가까이에서 불꽃이 튀지 않도록 한다.","축전지의 양(＋, -)케이블을 단단히 고정하고 충전한다."],"a":3,"e":{"w":["셀의 플러그를 열어 가스가 빠지게 합니다. 옳은 내용입니다.","전해액 온도가 45℃를 넘지 않게 합니다. 옳은 내용입니다.","충전 중에 나오는 수소가스에 불이 붙지 않도록 불꽃을 멀리합니다. 옳은 내용입니다."],"d":"차에 설치한 채 급속충전할 때는 축전지의 케이블을 분리해야 합니다. 연결한 채 충전하면 높은 전압이 발전기의 다이오드와 전자 부품을 손상시킵니다."}},{"q":"12V, 30W의 헤드라이트 한 개를 켜면 흐르는 전류는?","o":["2.5A","5A","10A","360A"],"a":0,"e":{"w":["5A는 계산과 맞지 않습니다.","10A는 계산과 맞지 않습니다.","360A는 전압과 전력을 곱한 값입니다."],"d":"전류 = 전력 ÷ 전압입니다.\n30W ÷ 12V = 2.5A"}},{"q":"다음 중 축전지(배터리) 격리판으로서의 구비조건이 아닌 것은?","o":["전해액의 확산이 잘 될 것","기계적 강도가 있을 것","전도성 일 것","다공성 일 것"],"a":2,"e":{"w":["전해액이 잘 확산되어야 합니다. 구비조건입니다.","기계적 강도가 있어야 합니다. 구비조건입니다.","작은 구멍이 많은 다공성이어야 합니다. 구비조건입니다."],"d":"격리판은 양극판과 음극판이 서로 닿아 합선되는 것을 막는 판입니다. 전기가 통하지 않는 비전도성이어야 합니다."}},{"q":"교류발전기에서 다이오드가 하는 역할은?","o":["교류를 정류하고 역류를 방지한다.","교류를 정류하고 전류를 조정한다.","전압을 조정하고 교류를 정류한다.","여자전류를 조정하고 교류를 정류한다."],"a":0,"e":{"w":["전류를 조정하지 않습니다.","전압을 조정하는 것은 전압 조정기입니다.","여자전류를 조정하는 것은 전압 조정기입니다."],"d":"다이오드는 스테이터에서 만든 교류를 직류로 바꾸고(정류), 축전지의 전류가 발전기로 거꾸로 흐르는 것(역류)을 막습니다."}},{"q":"트랜지스터(NPN형)에서 점화코일의 1차 전류는 어느 쪽으로 흐르는가?","o":["이미터에서 컬렉터로","베이스에서 컬렉터로","컬렉터에서 베이스로","컬렉터에서 이미터로"],"a":3,"e":{"w":["이미터에서 컬렉터로 흐르는 것은 PNP형입니다.","베이스에서 컬렉터로 흐르지 않습니다.","컬렉터에서 베이스로 흐르지 않습니다."],"d":"NPN형 트랜지스터는 베이스에 신호가 들어오면 컬렉터에서 이미터로 큰 전류가 흐릅니다. 점화코일의 1차 전류가 이 길로 흐릅니다."}},{"q":"AC 발전기의 스테이터에서 발생되는 전류는?","o":["직류","교류","맥류","역류"],"a":1,"e":{"w":["직류는 다이오드를 지난 뒤의 전류입니다.","맥류는 정류한 뒤의 출렁이는 직류입니다.","역류는 거꾸로 흐르는 전류입니다."],"d":"로터의 자석이 돌면서 스테이터 코일을 지나가므로 스테이터에는 방향이 계속 바뀌는 교류가 생깁니다. 이것을 다이오드가 직류로 바꿉니다."}},{"q":"전기자 시험기로 시험하기에 가장 부적절한 것은?","o":["코일의 단락","코일의 저항","코일의 접지","코일의 단선"],"a":1,"e":{"w":["전기자 시험기로 코일의 단락을 시험할 수 있습니다.","전기자 시험기로 코일의 접지를 시험할 수 있습니다.","전기자 시험기로 코일의 단선을 시험할 수 있습니다."],"d":"전기자 시험기(그로울러 테스터)는 전기자 코일의 단락, 단선, 접지를 시험합니다. 코일의 저항값은 잴 수 없습니다."}},{"q":"축전지를 급속 충전할 때 축전지의 접지 단자에서 케이블을 탈거하는 이유로 적합한 것은?","o":["발전기의 다이오드를 보호하기 위해","충전기를 보호하기 위해","과충전을 방지하기 위해","기동 모터를 보호하기 위해"],"a":0,"e":{"w":["충전기를 보호하려는 것이 아닙니다.","과충전을 막으려는 것이 아닙니다.","기동 모터를 보호하려는 것이 아닙니다."],"d":"급속 충전할 때는 높은 전압과 큰 전류가 걸립니다. 케이블을 연결한 채 충전하면 이 전압이 발전기의 다이오드를 파손시키므로 접지 케이블을 떼어 냅니다."}},{"q":"모터(기동전동기)의 형식을 맞게 나열한 것은?","o":["직렬형, 병렬형, 복합형","직렬형, 복렬형, 병렬형","직권형, 복권형, 복합형","직권형, 분권형, 복권형"],"a":3,"e":{"w":["직렬형, 병렬형이라고 하지 않습니다.","복렬형이라는 형식은 없습니다.","복합형이라는 형식은 없습니다."],"d":"전동기는 전기자 코일과 계자 코일을 잇는 방법에 따라 직권형(직렬), 분권형(병렬), 복권형(직·병렬)으로 나눕니다. 기동전동기는 회전력이 큰 직권형을 씁니다."}},{"q":"다음 중 옴의 법칙을 바르게 표시한 것은? (단, E : 전압, I : 전류, R : 저항)","o":["R=IE","R=I/E","R=I/E²","R=E/I"],"a":3,"e":{"w":["R = I × E는 틀린 식입니다.","R = I ÷ E는 거꾸로 된 식입니다.","R = I ÷ E²는 틀린 식입니다."],"d":"옴의 법칙에서 저항 = 전압 ÷ 전류입니다.\nR = E ÷ I, E = I × R, I = E ÷ R","g":"ohm"}},{"q":"축전지의 점검 시 육안점검 사항이 아닌 것은?","o":["케이스 외부 전해액 누출상태","전해액의 비중측정","케이스의 균열점검","단자의 부식상태"],"a":1,"e":{"w":["전해액 누출은 눈으로 확인합니다.","케이스의 균열은 눈으로 확인합니다.","단자의 부식은 눈으로 확인합니다."],"d":"전해액의 비중은 비중계로 재야 알 수 있습니다. 눈으로 보는 육안점검 사항이 아닙니다."}},{"q":"4행정 4기통 기관에서 점화순서가 1-3-4-2인데 2번 실린더가 배기행정을 하고 있다. 이 때 3번 실린더는 어떤 행정을 하고 있는가?","o":["흡입 행정","압축 행정","동력 행정","배기 행정"],"a":1,"e":{"w":["흡입 행정은 4번 실린더입니다.","동력 행정은 1번 실린더입니다.","배기 행정은 2번 실린더입니다."],"d":"점화순서 1-3-4-2에서 뒤에 있는 실린더일수록 한 행정씩 늦습니다.\n2번이 배기 → 다음 차례인 1번은 동력 → 3번은 압축 → 4번은 흡입"}},{"q":"인젝터의 저항을 측정하는데 가장 적합한 측정 장비는 다음 중 어느 것인가?","o":["아날로그 멀티테스터","테스터 램프","디지털 멀티테스터","메가 테스터"],"a":2,"e":{"w":["아날로그 멀티테스터는 정밀도가 낮습니다.","테스터 램프는 전기가 오는지만 확인합니다.","메가 테스터는 절연 저항을 재는 장비입니다."],"d":"인젝터 코일의 저항은 작은 값이라 정밀하게 재야 합니다. 디지털 멀티테스터가 가장 적합합니다."}},{"q":"발광 다이오드에 대한 설명으로 틀린 것은?","o":["순방향으로 전류가 흐를 때 빛이 발생된다.","가시광선, 적외선 및 레이저까지 여러 파장의 빛 발생된다.","빛을 받으면 전압이 발생되며, 스위칭 회로에 사용된다.","LED라하며, 10mA 정도에서 발광이 가능하다."],"a":2,"e":{"w":["순방향으로 전류가 흐를 때 빛이 납니다. 옳은 설명입니다.","가시광선, 적외선, 레이저까지 여러 파장의 빛을 냅니다. 옳은 설명입니다.","LED라고 하며 작은 전류로도 빛을 냅니다. 옳은 설명입니다."],"d":"빛을 받으면 전압이 발생하는 것은 포토 다이오드의 설명입니다. 발광 다이오드는 반대로 전기를 받아 빛을 내므로 ③이 틀렸습니다."}},{"q":"회로시험기를 사용할 때의 주의사항 중 틀린 것은?","o":["고온, 다습, 직사광선을 피한다.","제로위치를 확인하고 측정한다.","직류전압의 측정시 선택 스위치를 AC.V에 놓는다.","지침은 정면 위에서 읽는다."],"a":2,"e":{"w":["고온, 다습, 직사광선을 피합니다. 옳은 사항입니다.","0점을 확인하고 측정합니다. 옳은 사항입니다.","지침은 정면에서 읽습니다. 옳은 사항입니다."],"d":"직류전압을 잴 때는 선택 스위치를 DC.V에 놓아야 합니다. AC.V는 교류전압을 잴 때 쓰는 위치입니다."}},{"q":"전자제어 기관의 흡입 공기량 측정에서 출력이 전기펄스(Pulse, digital) 신호인 것은?","o":["벤(Vane)식","칼만(Karman) 와류식","핫 와이어(hot wire)식","맵센서식(MAP sensor)식"],"a":1,"e":{"w":["베인식은 전압이 연속으로 변하는 아날로그 신호를 냅니다.","핫 와이어식은 아날로그 신호를 냅니다.","맵센서식은 아날로그 신호를 냅니다."],"d":"칼만 와류식은 소용돌이가 생길 때마다 신호가 하나씩 나옵니다. 소용돌이의 수를 세는 방식이라 출력이 전기 펄스(디지털) 신호입니다."}},{"q":"연료탱크의 연료량을 표시하는 연료계의 형식 중 계기식의 형식에 속하지 않는 것은?","o":["밸런싱 코일식","연료면 표시기식","서미스터식","바이메탈 저항식"],"a":1,"e":{"w":["밸런싱 코일식은 연료계의 형식입니다.","서미스터식은 연료계의 형식입니다.","바이메탈 저항식은 연료계의 형식입니다."],"d":"연료계에는 밸런싱 코일식, 서미스터식, 바이메탈 저항식이 있습니다. 연료면 표시기식은 연료계 형식이 아닙니다."}},{"q":"AC 발전기의 출력변화 조정은 무엇에 의해 이루어지는가?","o":["엔진의 회전수","배터리의 전압","로터의 전류","다이오드 전류"],"a":2,"e":{"w":["회전수는 운전 상태에 따라 변하므로 조정 수단이 아닙니다.","배터리 전압으로 조정하지 않습니다.","다이오드 전류로 조정하지 않습니다."],"d":"교류 발전기의 출력은 로터 코일에 흐르는 전류(여자 전류)를 바꾸어 조정합니다. 로터 전류가 크면 자기장이 세져 출력이 커집니다."}},{"q":"전동기나 조정기를 청소한 후 점검하여야 할 사항으로 옳지 않는 것은?","o":["연결의 견고성 여부","과열 여부","아크발생 여부","단자부 주유상태 여부"],"a":3,"e":{"w":["연결이 견고한지 점검합니다.","과열되는지 점검합니다.","아크가 발생하는지 점검합니다."],"d":"전기 단자부에는 기름을 치지 않습니다. 기름이 묻으면 접촉이 나빠지고 먼지가 달라붙습니다. 단자부 주유상태는 점검 사항이 아닙니다."}},{"q":"산소센서 출력전압에 영향을 주는 요소가 아닌 것은?","o":["혼합비","흡입공기온도","산소센서의 온도","배기가스 중의 산소 잔존량"],"a":1,"e":{"w":["혼합비에 따라 배기가스의 산소량이 달라집니다.","산소센서는 온도가 충분히 높아야 정상 전압을 냅니다.","배기가스에 남은 산소량이 출력전압을 정합니다."],"d":"산소센서는 배기가스에 남은 산소량에 따라 전압을 냅니다. 흡입공기의 온도는 출력전압에 영향을 주지 않습니다."}},{"q":"O₂센서(지르코니아 방식)의 출력 전압이 1V에 가깝게 나타나면 공연비가 어떤 상태인가?","o":["희박하다","농후하다","공연비가 14.7 : 1에 가깝다는 것을 나타낸다.","농후하다가 희박한 상태로 되는 경우이다."],"a":1,"e":{"w":["희박하면 0.1V 부근의 낮은 전압이 나옵니다.","이론 공연비 부근에서는 전압이 급하게 변합니다.","1V에 가까운 것은 농후한 상태입니다."],"d":"지르코니아 산소센서는 혼합기가 농후하면 약 0.9V(1V에 가깝게), 희박하면 약 0.1V를 냅니다. 1V에 가까우면 농후한 상태입니다."}},{"q":"12V-100A의 발전기에서 나오는 출력은?","o":["1.73PS","1.63PS","1.53PS","1.43PS"],"a":1,"e":{"w":["1.73PS는 계산과 맞지 않습니다.","1.53PS는 계산과 맞지 않습니다.","1.43PS는 계산과 맞지 않습니다."],"d":"전력 = 전압 × 전류 = 12 × 100 = 1,200W = 1.2kW\n1PS = 0.736kW이므로 1.2 ÷ 0.736 = 약 1.63PS"}},{"q":"정상적인 12V 축전지인 경우, 크랭킹 시 일반적인 전압은?","o":["약 20~23V","약 15~18V","약 9~11V","약 5~7V"],"a":2,"e":{"w":["20~23V는 12V 축전지에서 나올 수 없는 전압입니다.","15~18V는 12V 축전지에서 나올 수 없는 전압입니다.","5~7V까지 떨어지면 축전지가 불량입니다."],"d":"크랭킹할 때는 기동전동기가 큰 전류를 써서 전압이 떨어집니다. 정상적인 12V 축전지는 크랭킹 중에 약 9~11V를 유지합니다."}},{"q":"12V, 5W 전구 1개와 24V, 60W 전구 1개를 12V 배터리에 직렬로 연결하였다. 옳은 것은?","o":["양쪽 전구가 똑같이 밝다.","5W전구가 더 밝다.","60W전구가 더 밝다.","5W전구가 끊어진다."],"a":1,"e":{"w":["두 전구의 저항이 달라 밝기가 다릅니다.","60W 전구는 저항이 작아 전압이 적게 걸립니다.","5W 전구에 정격보다 높은 전압이 걸리지 않아 끊어지지 않습니다."],"d":"전구의 저항 = 전압² ÷ 전력입니다.\n5W 전구 : 12² ÷ 5 = 28.8Ω\n60W 전구 : 24² ÷ 60 = 9.6Ω\n직렬 회로에서는 저항이 큰 쪽에 전압이 많이 걸립니다. 저항이 큰 5W 전구가 더 밝습니다."}},{"q":"점화스위치의 IG회로와 연결되지 않는 것은?","o":["기동 전동기","점화코일의 1차","인젝터","크랭크 앵글센서"],"a":0,"e":{"w":["점화코일의 1차는 IG회로와 연결됩니다.","인젝터는 IG회로와 연결됩니다.","크랭크 앵글센서는 IG회로와 연결됩니다."],"d":"기동 전동기는 키를 시동(ST) 위치로 돌렸을 때만 전기가 가는 ST회로와 연결됩니다. IG회로와는 연결되지 않습니다."}},{"q":"축전지의 점검 및 취급시 지켜야할 사항으로 틀린 것은?","o":["전해액이 옷이나 피부에 닿지 않도록 한다.","충전기로 충전할 때에는 극성에 주의한다.","축전지의 단자전압은 교류전압계로 측정한다.","전해액 비중 점검결과 방전되었으면 보충전 한다."],"a":2,"e":{"w":["전해액이 옷이나 피부에 닿지 않게 합니다. 옳은 사항입니다.","충전할 때 극성에 주의합니다. 옳은 사항입니다.","비중을 점검해 방전되었으면 보충전합니다. 옳은 사항입니다."],"d":"축전지는 직류 전원입니다. 단자전압은 직류전압계로 측정해야 합니다. 교류전압계로 측정한다는 ③이 틀렸습니다."}},{"q":"4행정 4기통 가솔린기관에서 점화순서 1-3-4-2 일 때, 1번 실린더가 흡입행정을 한다면 다음 중 맞는 것은?","o":["3번 실린더는 압축행정을 한다.","4번 실린더는 동력행정을 한다.","2번 실린더는 흡기행정을 한다.","2번 실린더는 배기행정을 한다."],"a":1,"e":{"w":["3번 실린더는 배기행정을 합니다.","2번 실린더는 압축행정을 합니다.","2번 실린더는 압축행정을 합니다."],"d":"점화순서 1-3-4-2에서 뒤에 있는 실린더일수록 한 행정씩 늦습니다.\n1번이 흡입 → 3번은 배기 → 4번은 동력 → 2번은 압축"}},{"q":"외부 온도에 따라 저항값이 변하는 소자로서 수온센서 등 온도 감지용으로 쓰이는 반도체는?","o":["게르마늄(germanium)","실리콘(silicone)","서미스터(thermistor)","인코넬(inconel)"],"a":2,"e":{"w":["게르마늄은 반도체의 재료입니다.","실리콘은 반도체의 재료입니다.","인코넬은 열에 강한 니켈 합금입니다."],"d":"서미스터는 온도에 따라 저항값이 크게 변하는 반도체 소자입니다. 수온센서, 흡기온도 센서처럼 온도를 감지하는 데 씁니다."}},{"q":"5A의 전류로 연속 방전하여 방전 종지 전압에 이를 때까지 30시간이 걸렸다, 이 축전지 용량은?","o":["6Ah","15Ah","60Ah","150Ah"],"a":3,"e":{"w":["6Ah는 시간을 전류로 나눈 값입니다.","15Ah는 계산과 맞지 않습니다.","60Ah는 계산과 맞지 않습니다."],"d":"축전지 용량(Ah) = 방전 전류 × 방전 시간입니다.\n5A × 30h = 150Ah"}},{"q":"축전지 시험기의 취급에 대한 주의사항으로 틀린 것은?","o":["시험기는 진동을 주지 말고 축전지의 극성을 바르게 해야 한다.","시험기의 부하를 최대가 된 상태로 해서 배터리와 연결한다.","축전지는 충분히 충전되어 전압강하가 없는 것을 사용해야 한다.","축전지 극성을 연결할 시는 전원스위치가 꺼진 상태에서 한다."],"a":1,"e":{"w":["진동을 주지 않고 극성을 바르게 연결합니다. 옳은 사항입니다.","충분히 충전된 축전지를 사용합니다. 옳은 사항입니다.","극성을 연결할 때는 전원스위치를 끈 상태에서 합니다. 옳은 사항입니다."],"d":"부하를 최대로 둔 채 연결하면 연결하는 순간 큰 전류가 흘러 불꽃이 튀고 시험기와 축전지가 손상됩니다. 부하를 최소로 둔 상태에서 연결합니다."}},{"q":"부특성 서미스터를 이용하는 센서는?","o":["노크센서","냉각수 온도 센서","MAP 센서","산소센서"],"a":1,"e":{"w":["노크센서는 진동을 전압으로 바꾸는 압전 소자를 씁니다.","MAP 센서는 압력에 따라 저항이 변하는 소자를 씁니다.","산소센서는 지르코니아나 티타니아를 씁니다."],"d":"부특성 서미스터는 온도가 올라가면 저항이 작아지는 소자입니다. 냉각수 온도 센서와 흡기온도 센서에 씁니다."}},{"q":"순방향으로 전류를 흐르게 하였을 때 빛이 발생되는 다이오드?","o":["제너다이오드","포토다이오드","사이리스터","발광다이오드"],"a":3,"e":{"w":["제너다이오드는 정해진 전압에서 역방향으로 전류가 흐릅니다.","포토다이오드는 빛을 받으면 전류가 흐릅니다.","사이리스터는 게이트 신호로 켜지는 스위칭 소자입니다."],"d":"발광다이오드(LED)는 순방향으로 전류가 흐를 때 빛을 내는 다이오드입니다."}},{"q":"점화코일의 2차 쪽에서 발생되는 불꽃 전압의 크기에 영향을 미치는 요소 중 거리가 먼 것은?","o":["점화플러그 전극의 형상","점화플러그 전극의 간극","기관 윤활유 압력","혼합기 압력"],"a":2,"e":{"w":["전극의 형상에 따라 불꽃이 튀는 데 필요한 전압이 달라집니다.","전극의 간극이 넓을수록 높은 전압이 필요합니다.","혼합기의 압력이 높을수록 높은 전압이 필요합니다."],"d":"불꽃 전압은 점화플러그 전극의 형상과 간극, 혼합기의 압력과 온도에 따라 달라집니다. 윤활유 압력은 관계가 없습니다."}},{"q":"퓨즈에 관한 설명으로 맞는 것은?","o":["퓨즈는 정격전류가 흐르면 회로를 차단하는 역할을 한다.","퓨즈는 과대전류가 흐르면 회로를 차단하는 역할을 한다.","퓨즈는 용량이 클수록 전류가 정격전 류가 낮아진다.","용량이 적은 퓨즈는 용량을 조정하여 사용한다."],"a":1,"e":{"w":["정격전류에서는 끊어지지 않습니다.","용량이 클수록 정격전류가 높습니다.","퓨즈는 용량을 조정해서 쓸 수 없습니다. 규정 용량의 퓨즈를 써야 합니다."],"d":"퓨즈는 정격보다 큰 전류가 흐르면 녹아서 회로를 끊습니다. 배선과 전기장치가 타는 것을 막는 안전장치입니다."}},{"q":"트랜지스터의 대표적인 기능으로 릴레이와 같은 작용은?","o":["스위칭 작용","채터링 작용","정류 작용","상호 유도 작용"],"a":0,"e":{"w":["채터링은 접점이 떨리는 현상입니다.","정류 작용은 다이오드의 기능입니다.","상호 유도 작용은 코일의 작용입니다."],"d":"트랜지스터는 베이스의 작은 신호로 큰 전류를 켜고 끕니다. 릴레이처럼 회로를 여닫는 스위칭 작용입니다."}},{"q":"반도체 소자에서 역방향의 전압이 어떤 값에 도달하면 역방향 전류가 급격히 흐르게 되는 전압을 무엇이라고 하는가?","o":["컷인 전압","자기유도 전압","사이리스터 전압","브레이크 다운 전압"],"a":3,"e":{"w":["컷인 전압은 순방향으로 전류가 흐르기 시작하는 전압입니다.","자기유도 전압은 코일에서 생기는 전압입니다.","사이리스터 전압이라는 용어는 쓰지 않습니다."],"d":"다이오드에 역방향 전압을 점점 높이면 어느 값에서 갑자기 큰 역방향 전류가 흐릅니다. 이때의 전압을 브레이크 다운 전압(항복 전압)이라고 합니다."}},{"q":"축전지 전해액 온도가 40℃ 이고 비중이 1.270일 때 기준온도(20℃)에서의 비중은 얼마인가?","o":["1.256","1.274","1.284","1.295"],"a":2,"e":{"w":["1.256은 온도 보정값을 뺀 값입니다.","1.274는 계산과 맞지 않습니다.","1.295는 계산과 맞지 않습니다."],"d":"기준온도 비중 = 측정 비중 + 0.0007 × (측정 온도 - 20)입니다.\n1.270 + 0.0007 × (40 - 20) = 1.270 + 0.014 = 1.284"}},{"q":"코일에 흐르는 전류를 단속하면 코일에 유도전압이 발생한다. 이러한 작용을 무엇이라고 하는가?","o":["자력선 작용","전류 작용","관성 작용","자기 유도 작용"],"a":3,"e":{"w":["자력선 작용이라는 용어는 쓰지 않습니다.","전류 작용이라는 용어는 쓰지 않습니다.","관성 작용은 전기 현상이 아닙니다."],"d":"코일에 흐르는 전류를 끊거나 이으면 자기장이 변하면서 코일 자신에게 전압이 유도됩니다. 이것을 자기 유도 작용이라고 합니다."}},{"q":"전기회로 내에 전류계를 사용할 때 사항으로 맞는 것은?","o":["전류계는 직렬로 연결하여 사용한다.","전류계는 병렬로 연결하여 사용한다.","전류계는 직렬, 병렬연결을 모두 사용한다.","전류계의 사용시 극성에는 무관하다."],"a":0,"e":{"w":["병렬로 연결하면 전류계가 손상됩니다.","직렬로만 연결합니다.","직류 전류계는 극성을 맞추어야 합니다."],"d":"전류계는 측정하려는 회로에 직렬로 끼워 넣어 사용합니다. 전압계는 반대로 병렬로 연결합니다."}},{"q":"축전지 셀의 음극과 양극의 판수는?","o":["각각 같은 수다.","음극판이 1장 더 많다.","양극판이 1장 더 많다.","음극판이 2장 더 많다."],"a":1,"e":{"w":["같은 수가 아닙니다.","양극판이 더 많지 않습니다.","2장이 아니라 1장 더 많습니다."],"d":"양극판은 화학 작용이 활발해 양쪽 면을 모두 써야 합니다. 양극판을 음극판 사이에 끼우기 위해 음극판을 1장 더 많이 넣습니다."}},{"q":"계기판의 엔진 회전계가 작동하지 않는 결함의 원인에 해당되는 것은?","o":["VSS(Vehicle Speed Sensor) 결함","CPS(Crankshaft Position Sensor) 결함","MAP(Manifold Absolute Sensor) 결함","CTS(Coolant Temperature Sensor) 결함"],"a":1,"e":{"w":["VSS는 차속 센서로 속도계와 관계가 있습니다.","MAP은 흡기 압력 센서입니다.","CTS는 냉각수 온도 센서입니다."],"d":"엔진 회전계는 크랭크축의 회전 신호로 움직입니다. 크랭크축 위치 센서(CPS)가 고장 나면 회전계가 작동하지 않습니다."}},{"q":"논리회로에서 AND 게이트의 출력이 HIGH(1)로 되는 조건은?","o":["양쪽의 입력이 HIGH일 때","한쪽의 입력만 LOW일 때","한쪽의 입력만 HIGH일 때","양쪽의 입력이 LOW일 때"],"a":0,"e":{"w":["한쪽 입력이 LOW이면 출력은 LOW입니다.","한쪽 입력만 HIGH이면 출력은 LOW입니다.","양쪽 입력이 LOW이면 출력은 LOW입니다."],"d":"AND 게이트는 입력이 모두 HIGH(1)일 때만 출력이 HIGH(1)가 됩니다. 스위치 2개를 직렬로 연결한 것과 같습니다."}},{"q":"자기유도작용과 상호유도작용 원리를 이용한 것은?","o":["발전기","점화코일","기동모터","축전지"],"a":1,"e":{"w":["발전기는 전자기 유도를 이용합니다.","기동모터는 전자력(플레밍의 왼손 법칙)을 이용합니다.","축전지는 화학 작용을 이용합니다."],"d":"점화코일은 1차 코일의 전류를 끊을 때 생기는 자기유도와, 그 변화가 2차 코일에 높은 전압을 만드는 상호유도를 이용합니다."}},{"q":"전해액을 만들 때 황산에 물을 혼합하면 안 되는 이유는?","o":["유독가스가 발생하기 때문에","혼합이 잘 안되기 때문에","폭발의 위험이 있기 때문에","비중 조정이 쉽기 때문에"],"a":2,"e":{"w":["유독가스 때문이 아닙니다.","혼합이 안 되어서가 아닙니다.","비중 조정과는 관계가 없습니다."],"d":"황산에 물을 부으면 심한 열이 나면서 물이 갑자기 끓어 황산이 튀어 오릅니다. 반드시 물(증류수)에 황산을 조금씩 부어야 합니다."}},{"q":"트랜지스터식 점화장치는 어떤 작동으로 점화코일의 1차 전압을 단속하는가?","o":["증폭 작용","자기 유도 작용","스위칭 작용","상호 유도 작용"],"a":2,"e":{"w":["증폭 작용으로 단속하는 것이 아닙니다.","자기 유도 작용은 코일에서 일어나는 현상입니다.","상호 유도 작용은 코일에서 일어나는 현상입니다."],"d":"트랜지스터식 점화장치는 트랜지스터의 스위칭 작용으로 점화코일의 1차 전류를 끊고 잇습니다. 접점이 없어 닳지 않고 고속에서도 정확합니다."}},{"q":"배터리 취급 시 틀린 것은?","o":["전해액량은 극판 위 10~13㎜ 정도 되도록 보충한다.","연속 대전류로 방전되는 것은 금지해야 한다.","전해액을 만들어 사용 시는 고무 또는 납그릇을 사용하되, 황산에 증류수를 조금씩 첨가하면서 혼합한다.","배터리의 단자부 및 케이스면은 소다수로 세척한다."],"a":2,"e":{"w":["전해액은 극판 위 10~13mm가 되도록 보충합니다. 옳은 내용입니다.","큰 전류로 계속 방전하면 안 됩니다. 옳은 내용입니다.","단자부와 케이스는 소다수로 닦아 산을 중화합니다. 옳은 내용입니다."],"d":"전해액을 만들 때는 증류수에 황산을 조금씩 부어야 합니다. 황산에 증류수를 부으면 열이 나며 튀어 위험하므로 ③이 틀렸습니다."}},{"q":"AC 발전기에서 전류가 발생하는 곳은?","o":["전기자","스테이터","로터","브러시"],"a":1,"e":{"w":["전기자는 직류 발전기와 전동기의 회전 부분입니다.","로터는 자기장을 만드는 부분입니다.","브러시는 로터에 전류를 공급하는 부분입니다."],"d":"AC 발전기에서는 자석 역할을 하는 로터가 돌고, 고정된 스테이터 코일에서 전류가 발생합니다."}},{"q":"기동 전동기 정류자 점검 및 정비 시 유의사항으로 틀린 것은?","o":["정류자는 깨끗해야 한다.","정류자 표면은 매끈해야 한다.","정류자는 줄로 가공해야 한다.","정류자는 진원이어야 한다."],"a":2,"e":{"w":["정류자는 깨끗해야 합니다. 옳은 사항입니다.","정류자 표면은 매끈해야 합니다. 옳은 사항입니다.","정류자는 진원이어야 합니다. 옳은 사항입니다."],"d":"정류자를 줄로 가공하면 표면이 거칠어지고 진원이 깨집니다. 표면이 거칠면 고운 사포로 다듬거나 선반으로 가공합니다."}},{"q":"납산 배터리의 전해액이 흘렀을 때 중화용액으로 가장 알맞은 것은?","o":["중탄산소다","황산","증류수","수돗물"],"a":0,"e":{"w":["황산은 전해액과 같은 산이라 중화되지 않습니다.","증류수는 씻어 낼 뿐 중화하지 못합니다.","수돗물은 씻어 낼 뿐 중화하지 못합니다."],"d":"전해액은 산성인 묽은 황산입니다. 알칼리성인 중탄산소다(베이킹소다)를 뿌리면 산이 중화됩니다."}},{"q":"회로 시험기로 전기회로의 측정 점검시 주의사항으로 틀린 것은?","o":["테스트 리드의 적색은 +단자에, 흑색은 –단자에 연결 한다.","전류 측정시는 테스터를 병렬로 연결하여야 한다.","각 측정 범위의 변경은 큰 쪽에서 작은 쪽으로 한다.","저항 측정시엔 회로전원을 끄고 단품은 탈거한 후 측정 한다."],"a":1,"e":{"w":["적색 리드는 (+)단자에, 흑색 리드는 (-)단자에 연결합니다. 옳은 사항입니다.","측정 범위는 큰 쪽에서 작은 쪽으로 바꾸어 갑니다. 옳은 사항입니다.","저항을 잴 때는 회로의 전원을 끄고 측정합니다. 옳은 사항입니다."],"d":"전류를 잴 때는 테스터를 회로에 직렬로 연결해야 합니다. 병렬로 연결하면 테스터로 큰 전류가 흘러 손상됩니다."}},{"q":"HEI코일(폐자로형 코일)에 대한 설명 중 틀린 것은?","o":["유도작용에 의해 생성되는 자속이 외부로 방출되지 않는다.","1차 코일을 굵게 하면 큰 전류가 통과할 수 있다.","1차 코일과 2차 코일은 연결되어 있다.","코일 방열을 위해 내부에 절연유가 들어있다."],"a":3,"e":{"w":["폐자로형은 자속이 밖으로 새지 않습니다. 옳은 설명입니다.","1차 코일을 굵게 하면 큰 전류가 흐를 수 있습니다. 옳은 설명입니다.","1차 코일과 2차 코일은 연결되어 있습니다. 옳은 설명입니다."],"d":"폐자로형(HEI) 코일은 몰드형이라 내부를 수지로 굳힙니다. 절연유가 들어 있는 것은 옛날 개자로형 코일입니다."}},{"q":"발전기의 기전력 발생에 관한 설명으로 틀린 것은?","o":["로터의 회전이 빠르면 기전력은 커진다.","로터코일을 통해 흐르는 여자 전류가 크면 기전력은 커진다.","코일의 권수와 도선의 길이가 길면 기전력은 커진다.","자극의 수가 많아지면 여자되는 시간이 짧아져 기전력이 작아진다."],"a":3,"e":{"w":["로터가 빨리 돌수록 기전력이 커집니다. 옳은 설명입니다.","여자 전류가 클수록 자기장이 세져 기전력이 커집니다. 옳은 설명입니다.","코일의 권수가 많고 도선이 길수록 기전력이 커집니다. 옳은 설명입니다."],"d":"자극의 수가 많아지면 코일이 자기장을 끊는 횟수가 늘어나 기전력이 커집니다. 작아진다는 ④가 틀렸습니다."}},{"q":"축전기(condenser)에 저장되는 정전용량을 설명한 것으로 틀린 것은?","o":["가해지는 전압에 정비례한다.","금속판 사이의 거리에 정비례한다.","상대하는 금속판의 면적에 정비례한다.","금속판 사이 절연체의 절연도에 정비례한다."],"a":1,"e":{"w":["가해지는 전압에 정비례합니다. 옳은 설명입니다.","마주 보는 금속판의 면적에 정비례합니다. 옳은 설명입니다.","금속판 사이 절연체의 절연도에 정비례합니다. 옳은 설명입니다."],"d":"정전용량은 금속판 사이의 거리가 가까울수록 커집니다. 거리에 반비례하므로 정비례한다는 ②가 틀렸습니다."}},{"q":"가솔린기관의 점화코일에 대한 설명으로 틀린 것은?","o":["1차코일의 저항보다 2차코일의 저항이 크다.","1차코일의 굵기보다 2차코일의 굵기가 가늘다.","1차코일의 유도전압 보다 2차코일의 유도전압이 낮다.","1차코일의 권수보다 2차코일의 권수가 많다."],"a":2,"e":{"w":["2차 코일은 가늘고 많이 감아 저항이 큽니다. 옳은 설명입니다.","2차 코일은 1차 코일보다 가는 선을 씁니다. 옳은 설명입니다.","2차 코일은 1차 코일보다 훨씬 많이 감습니다. 옳은 설명입니다."],"d":"점화코일은 권수비만큼 전압을 높입니다. 2차 코일의 유도전압이 1차 코일보다 훨씬 높아야 불꽃이 튑니다. 2차 유도전압이 낮다고 한 ③이 틀렸습니다."}},{"q":"계기판의 속도계가 작동하지 않을 때 고장부품으로 옳은 것은?","o":["차속 센서","흡기매니폴드 압력 센서","크랭크각 센서","냉각수온 센서"],"a":0,"e":{"w":["흡기매니폴드 압력 센서는 엔진 부하를 알려 줍니다.","크랭크각 센서는 엔진 회전수를 알려 줍니다.","냉각수온 센서는 엔진 온도를 알려 줍니다."],"d":"속도계는 차속 센서의 신호로 움직입니다. 차속 센서가 고장 나면 속도계가 작동하지 않습니다."}},{"q":"기관에 설치된 상태에서 시동 시(크랭크 시) 기동전동기에 흐르는 전류와 회전수를 측정하는 시험은?","o":["단선시험","단락시험","접지시험","부하시험"],"a":3,"e":{"w":["단선시험은 코일이 끊어졌는지 보는 시험입니다.","단락시험은 코일끼리 붙었는지 보는 시험입니다.","접지시험은 코일이 몸체에 닿았는지 보는 시험입니다."],"d":"부하시험은 기동전동기를 엔진에 단 채 크랭킹하면서 흐르는 전류와 회전수를 측정하는 시험입니다. 실제 부하가 걸린 상태의 성능을 봅니다."}},{"q":"납산 축전지(Battery) 충전 시 주의사항이 아닌 것은?","o":["축전지 충전은 상온의 밀폐된 곳에서 실시한다.","축전지가 단락하여 스파크가 일어나지 않게 한다.","환기장치가 적절하지 못한 작업장에서는 축전지를 과충전하여서는 안 된다.","전해액을 혼합할 때에는 증류수에 황산을 천천히 붓는다."],"a":0,"e":{"w":["단락되어 스파크가 일어나지 않게 합니다. 주의사항입니다.","환기가 잘 안 되는 곳에서는 충전하지 않습니다. 주의사항입니다.","전해액을 섞을 때는 증류수에 황산을 천천히 붓습니다. 주의사항입니다."],"d":"충전 중에는 폭발하기 쉬운 수소가스가 나옵니다. 밀폐된 곳에서 충전하면 가스가 모여 폭발할 수 있습니다. 환기가 잘되는 곳에서 충전해야 합니다."}},{"q":"전자제어 엔진에서 냉간시 점화시기 제어 및 연료분사량 제어를 하는 센서는?","o":["흡기온 센서","대기압 센서","수온센서","공기량 센서"],"a":2,"e":{"w":["흡기온 센서는 들어오는 공기의 온도를 잽니다.","대기압 센서는 고도에 따른 보정에 씁니다.","공기량 센서는 기본 분사량을 정합니다."],"d":"엔진이 차가운지 따뜻한지는 수온센서가 알려 줍니다. 차가울 때 ECU는 수온센서 신호를 보고 연료를 더 분사하고 점화시기를 조정합니다."}},{"q":"기관이 1500rpm에서 20kgf․m의 회전력을 낼 때 기관의 출력은 41.87PS 이다. 기관의 출력을 일정하게 하고 회전수를 2500rpm으로 하였을 때 약 얼마의 회전력을 내는가?","o":["45kgf․m","35kgf․m","25kgf․m","12kgf․m"],"a":3,"e":{"w":["45kgf·m는 계산과 맞지 않습니다.","35kgf·m는 계산과 맞지 않습니다.","25kgf·m는 계산과 맞지 않습니다."],"d":"출력 = 회전력 × 회전수 ÷ 716입니다. 출력이 같으면 회전력 × 회전수가 같습니다.\n20 × 1500 = 회전력 × 2500\n회전력 = 30,000 ÷ 2500 = 12kgf·m"}},{"q":"축전지 전해액의 비중을 측정하였더니 1.180 이었다. 이 축전지의 방전률은? (단, 비중 값이 완전충전 시 1.280이고, 완전방전 시의 비중 값은 1.080이다.)","o":["20%","30%","50%","70%"],"a":2,"e":{"w":["20%는 계산과 맞지 않습니다.","30%는 계산과 맞지 않습니다.","70%는 계산과 맞지 않습니다."],"d":"방전률 = (완전충전 비중 - 측정 비중) ÷ (완전충전 비중 - 완전방전 비중) × 100입니다.\n(1.280 - 1.180) ÷ (1.280 - 1.080) × 100 = 0.1 ÷ 0.2 × 100 = 50%"}},{"q":"반도체의 장점으로 틀린 것은?","o":["극히 소형이고 경량이다.","내부전력 손실이 매우 적다.","고온에서도 안정적으로 동작한다.","예열을 요구하지 않고 곧바로 작동을 한다."],"a":2,"e":{"w":["매우 작고 가볍습니다. 장점입니다.","내부 전력 손실이 매우 적습니다. 장점입니다.","예열 없이 바로 작동합니다. 장점입니다."],"d":"반도체는 열에 약합니다. 온도가 높아지면 특성이 변하고 파손되기 쉽습니다. 고온에서도 안정적이라는 ③이 틀렸습니다."}},{"q":"P형 반도체와 N형 반도체를 마주대고 결합한 것은?","o":["캐리어","홀","다이오드","스위칭"],"a":2,"e":{"w":["캐리어는 전기를 나르는 전자와 정공을 말합니다.","홀은 전자가 빠진 자리(정공)입니다.","스위칭은 회로를 여닫는 작용입니다."],"d":"P형 반도체와 N형 반도체를 맞붙인 것이 다이오드입니다. 전류를 한쪽 방향으로만 흘립니다."}},{"q":"기동전동기에서 회전하는 부분이 아닌 것은?","o":["오버러닝 클러치","정류자","계자코일","전기자 철심"],"a":2,"e":{"w":["오버러닝 클러치는 전기자 축과 함께 돕니다.","정류자는 전기자와 함께 돕니다.","전기자 철심은 회전하는 부분입니다."],"d":"계자코일은 전동기의 몸체(계철) 안쪽에 고정되어 자기장을 만듭니다. 돌지 않는 부분입니다."}},{"q":"축전지 극판의 작용물질이 동일한 조건에서 비중이 감소되면 용량은?","o":["증가한다.","변화 없다.","비례하여 증가한다.","감소한다."],"a":3,"e":{"w":["용량은 증가하지 않습니다.","용량은 변합니다.","용량은 증가하지 않습니다."],"d":"전해액의 비중이 낮다는 것은 황산이 적다는 뜻입니다. 화학 반응에 쓸 황산이 줄어 축전지의 용량이 감소합니다."}},{"q":"20Ω 저항의 양 끝에 전압을 가할 때 2A 전류가 흐른다면 이 저항에 걸리는 전압은?","o":["10V","20V","30V","40V"],"a":3,"e":{"w":["10V는 저항을 전류로 나눈 값입니다.","20V는 계산과 맞지 않습니다.","30V는 계산과 맞지 않습니다."],"d":"전압 = 전류 × 저항입니다.\n2A × 20Ω = 40V","g":"ohm"}},{"q":"온도에 따른 축전지 전해액 비중의 변화에 대한 설명 중 맞는 것은?","o":["온도가 올라가면 비중도 올라간다.","온도가 올라가면 비중은 내려간다.","비중은 온도와는 상관없다.","일정 온도 이상에서만 비중이 올라간다."],"a":1,"e":{"w":["온도가 올라가면 비중은 내려갑니다.","비중은 온도에 따라 변합니다.","온도와 비중은 항상 반대로 움직입니다."],"d":"전해액은 온도가 올라가면 부피가 늘어나 비중이 내려가고, 온도가 내려가면 부피가 줄어 비중이 올라갑니다. 그래서 비중은 20℃ 기준으로 환산합니다."}},{"q":"제너 다이오드를 사용하는 회로는?","o":["고주파 회로","저압 정류회로","브리지 정류회로","정 전압회로"],"a":3,"e":{"w":["고주파 회로에 쓰는 것이 아닙니다.","정류회로에는 일반 다이오드를 씁니다.","브리지 정류회로에는 일반 다이오드를 씁니다."],"d":"제너 다이오드는 정해진 전압이 되면 역방향으로 전류를 흘려 전압을 일정하게 붙잡아 둡니다. 전압을 일정하게 유지하는 정전압 회로에 씁니다."}},{"q":"전자 점화기구에 점화신호를 컨트롤 유닛(control unit)으로 전송하는 기능을 가진 부품은?","o":["아마추어","점화코일","로터","마그네틱 픽업 코일"],"a":3,"e":{"w":["아마추어는 전기자를 말합니다.","점화코일은 높은 전압을 만드는 부품입니다.","로터는 회전하는 부분입니다."],"d":"마그네틱 픽업 코일은 돌아가는 돌기가 지나갈 때마다 전압 신호를 만듭니다. 이 신호가 컨트롤 유닛에 점화할 때를 알려 줍니다."}},{"q":"기동전동기의 회전력 시험은 어떠한 것을 측정 하는가?","o":["정지 회전력을 측정한다.","공전 회전력을 측정한다.","중속 회전력을 측정한다.","고속 회전력을 측정한다."],"a":0,"e":{"w":["공전 회전력을 측정하는 것이 아닙니다.","중속 회전력을 측정하는 것이 아닙니다.","고속 회전력을 측정하는 것이 아닙니다."],"d":"기동전동기는 멈춰 있는 엔진을 돌리기 시작할 때 가장 큰 힘이 필요합니다. 회전력 시험은 전동기를 돌지 못하게 잡아 놓고 정지 회전력을 측정합니다."}},{"q":"다음 중 교류발전기의 구성 요소와 거리가 먼 것은?","o":["자계를 발생시키는 로터","전압을 유도하는 스테이터","정류기","컷 아웃 릴레이"],"a":3,"e":{"w":["로터는 자기장을 만드는 교류발전기의 구성 요소입니다.","스테이터는 전압이 유도되는 교류발전기의 구성 요소입니다.","정류기는 교류를 직류로 바꾸는 교류발전기의 구성 요소입니다."],"d":"컷 아웃 릴레이는 옛날 직류발전기에서 역류를 막던 부품입니다. 교류발전기는 다이오드가 역류를 막으므로 컷 아웃 릴레이가 없습니다."}},{"q":"축전지의 충전상태를 측정하는 계기는?","o":["온도계","기압계","저항계","비중계"],"a":3,"e":{"w":["온도계는 온도를 잽니다.","기압계는 기압을 잽니다.","저항계는 저항을 잽니다."],"d":"축전지는 방전될수록 전해액의 비중이 낮아집니다. 비중계로 전해액의 비중을 재면 충전상태를 알 수 있습니다."}},{"q":"배선에 있어서 기호와 색의 연결이 틀린 것은?","o":["Gr : 보라","G : 녹색","R : 적색","Y : 노랑"],"a":0,"e":{"w":["G는 녹색(Green)입니다. 옳은 연결입니다.","R은 적색(Red)입니다. 옳은 연결입니다.","Y는 노랑(Yellow)입니다. 옳은 연결입니다."],"d":"Gr은 회색(Gray)입니다. 보라는 V(Violet) 또는 Pp로 표시하므로 ①이 틀렸습니다."}},{"q":"엔진이 2000rpm으로 회전하고 있을 때 그 출력이 65ps라고 하면 이 엔진의 회전력은 몇 m-kgf인가?","o":["23.27","24.45","25.46","26.38"],"a":0,"e":{"w":["24.45는 계산과 맞지 않습니다.","25.46은 계산과 맞지 않습니다.","26.38은 계산과 맞지 않습니다."],"d":"회전력 = 716 × 출력 ÷ 회전수입니다.\n716 × 65 ÷ 2000 = 약 23.27m·kgf"}},{"q":"2개 이상의 배터리를 연결하는 방식에 따라 용량과 전압 관계의 설명으로 맞는 것은?","o":["직렬 연결시 1개 배터리 전압과 같으며 용량은 배터리 수만큼 증가한다.","병렬 연결시 용량은 배터리 수만큼 증가하지만 전압은 1개 배터리 전압과 같다.","병렬연결이란 전압과 용량 동일한 배터리 2개 이상을 (＋)단자와 연결대상 배터리(-)단자에, (-)단자는 (＋)단자로 연결하는 방식이다.","직렬연결이란 전압과 용량이 동일한 배터리 2개 이상을 (＋)단자와 연결대상 배터리의 (＋)단자에서로 연결하는 방식이다."],"a":1,"e":{"w":["직렬 연결은 전압이 배터리 수만큼 늘고 용량은 1개와 같습니다.","(+)단자를 (-)단자에 연결하는 것은 직렬연결입니다.","(+)단자끼리 연결하는 것은 병렬연결입니다."],"d":"병렬 연결은 (+)는 (+)끼리, (-)는 (-)끼리 잇습니다. 용량은 배터리 수만큼 늘어나고 전압은 1개일 때와 같습니다.","g":"batt"}},{"q":"저항이 4Ω인 전구를 12V의 축전지에 의하여 점등했을 때 접속이 올바른 상태에서 전류(A)는 얼마인가?","o":["4.8A","2.4A","3.0A","6.0A"],"a":2,"e":{"w":["4.8A는 계산과 맞지 않습니다.","2.4A는 계산과 맞지 않습니다.","6.0A는 계산과 맞지 않습니다."],"d":"전류 = 전압 ÷ 저항입니다.\n12V ÷ 4Ω = 3.0A","g":"ohm"}},{"q":"기동전동기의 작동원리는 무엇인가?","o":["렌츠 법칙","앙페르 법칙","플레밍 왼손법칙","플레밍 오른손법칙"],"a":2,"e":{"w":["렌츠 법칙은 유도 전류의 방향에 관한 법칙입니다.","앙페르 법칙은 전류가 만드는 자기장의 방향에 관한 법칙입니다.","플레밍 오른손법칙은 발전기의 원리입니다."],"d":"기동전동기는 자기장 속의 도선에 전류를 흘려 생기는 힘으로 돕니다. 이 힘의 방향을 알려 주는 것이 플레밍의 왼손법칙입니다."}},{"q":"스파크 플러그의 정상적인 연소 유지를 위한 중심 전극과 접지 전극 사이의 표준 간극은?","o":["0.2~0.3 mm","0.6~0.7 mm","1.2~1.3 mm","2.0~2.1 mm"],"a":1,"e":{"w":["0.2~0.3mm는 너무 좁아 불꽃이 약하고 카본으로 막히기 쉽습니다.","1.2~1.3mm는 너무 넓어 불꽃이 튀지 않을 수 있습니다.","2.0~2.1mm는 지나치게 넓어 실화가 납니다."],"d":"점화플러그 간극이 좁으면 불꽃이 약하고, 넓으면 더 높은 전압이 필요해 불꽃이 튀지 않을 수 있습니다.\n이륜자동차 점화플러그 간극은 보통 0.6~0.7mm 부근이며, 차종에 따라 조금 다르므로 정비지침서의 규정값에 맞춰 간극 게이지로 조정합니다."}},{"q":"엔진 시동용 스타터 모터가 자기장 내 도선에 흐르는 전류에 의해 회전 토크를 발생하는 작동 역학 원리는?","o":["플레밍의 오른손 법칙","플레밍의 왼손 법칙","베르누이의 정리","아르키메데스의 원리"],"a":1,"e":{"w":["플레밍의 오른손 법칙은 발전기의 원리입니다.","베르누이의 정리는 유체의 속도와 압력의 관계입니다.","아르키메데스의 원리는 부력의 원리입니다."],"d":"자기장 안에 있는 도선에 전류가 흐르면 도선은 힘을 받습니다. 이 힘의 방향을 알려 주는 것이 플레밍의 왼손 법칙이며, 전동기(스타터 모터)의 원리입니다.\n왼손 = 전동기, 오른손 = 발전기로 기억합니다."}},{"q":"교류 발전기(AC 제너레이터)에서 발전된 교류 전력을 직류로 변환하고 계통 전압을 일정하게 유지시키는 유닛은?","o":["인버터","레귤레이터 / 렉티파이어","연료 컷 밸브","스타터 릴레이"],"a":1,"e":{"w":["인버터는 직류를 교류로 바꾸는 장치입니다.","연료 컷 밸브는 연료 공급을 차단하는 밸브입니다.","스타터 릴레이는 스타터 모터에 큰 전류를 이어 주는 스위치입니다."],"d":"교류 발전기가 만든 전기는 교류이고, 엔진 회전수에 따라 전압이 달라집니다.\n렉티파이어(정류기)는 다이오드로 교류를 직류로 바꾸고, 레귤레이터(전압 조정기)는 전압을 일정하게 유지합니다. 이륜자동차는 두 기능을 한 부품에 넣은 레귤레이터/렉티파이어를 씁니다."}},{"q":"12V 전장 시스템을 탑재한 이륜차의 정상 충전전압 점검 시 권장 엔진 회전수 및 출력 전압 기준은?","o":["1,000 rpm에서 약 10.0V","5,000 rpm에서 14.5±0.5V","엔진 정지 시 24.0V","500 rpm에서 5.0V"],"a":1,"e":{"w":["10.0V는 배터리 전압보다 낮아 충전이 되지 않는 상태입니다.","엔진이 멈추면 발전하지 않으며, 12V 계통에서 24V는 나오지 않습니다.","5.0V는 충전이 전혀 되지 않는 값입니다."],"d":"12V 배터리는 완전 충전 상태에서 약 12.6V이므로, 충전하려면 그보다 높은 14~15V가 걸려야 합니다.\n충전전압은 엔진을 5,000rpm 부근으로 올리고 배터리 단자에서 측정하며, 14.5±0.5V 범위이면 정상입니다. 이보다 높으면 과충전(레귤레이터 불량), 낮으면 충전 부족을 의심합니다. 측정 회전수와 규정값은 정비지침서를 따릅니다."}},{"q":"크랭크샤프트에 테이퍼로 결합된 제너레이터 플라이휠 로터를 안전하게 탈착할 때 필수적인 전용 장비는?","o":["토크 렌치","버니어 캘리퍼스","로터 풀러 (플라이휠 풀러)","타이어 레버"],"a":2,"e":{"w":["토크 렌치는 규정 토크로 조일 때 쓰는 공구입니다.","버니어 캘리퍼스는 길이를 재는 측정기입니다.","타이어 레버는 타이어를 림에서 벗길 때 씁니다."],"d":"플라이휠 로터는 크랭크축의 테이퍼(경사진 축)에 강하게 끼워져 있어 손이나 망치로는 빼기 어렵고, 두드리면 자석과 크랭크축이 손상됩니다.\n로터 풀러(플라이휠 풀러)를 로터의 나사에 끼우고 가운데 볼트를 조이면 로터가 축에서 밀려 빠집니다."}},{"q":"스트로보 타이밍 라이트를 점화 플러그 고압 코드에 연결하여 엔진 공회전 점화 타이밍을 확인할 때 기준 표식은?","o":["T 마크 (상사점)","F 마크 (점화 시점)","H 마크","P 마크"],"a":1,"e":{"w":["T 마크는 피스톤의 상사점을 나타내는 표시입니다.","H 마크는 점화 시기 확인에 쓰는 표시가 아닙니다.","P 마크는 점화 시기 확인에 쓰는 표시가 아닙니다."],"d":"플라이휠에는 T 마크와 F 마크가 새겨져 있습니다. T는 피스톤의 상사점, F는 공회전 때의 점화 시기를 나타냅니다.\n공회전 상태에서 타이밍 라이트를 비췄을 때 F 마크
