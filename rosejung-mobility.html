:3,"e":{"w":["오디오 음질과는 관계가 없습니다.","모터 회전속도와는 관계가 없습니다.","전조등 밝기와는 관계가 없습니다."],"d":"전기 이륜자동차에는 높은 전압이 흐릅니다. 접지가 불량하면 누전될 때 차체에 전기가 흘러 감전될 수 있습니다. 전기 시스템의 안전성과 감전 방지를 위해 접지 상태를 확인합니다."}},{"q":"운행 중인 이륜자동차의 배기소음을 측정하는 방법으로 옳은 것은?","o":["가속하며 주행하는 상태에서 측정한다.","변속기를 중립에 두고 정지한 상태에서 원동기를 가동하여 측정한다.","시동을 끈 정지 상태에서 측정한다.","내리막길을 타력으로 내려오며 측정한다."],"a":1,"e":{"w":["운행차의 배기소음은 달리면서 측정하지 않습니다. 차를 세워 두고 측정합니다.","시동을 끄면 배기가스가 나오지 않아 배기소음을 잴 수 없습니다.","타력으로 내려올 때는 원동기에 힘이 걸리지 않아 배기소음을 바르게 잴 수 없습니다."],"d":"운행차의 배기소음은 차를 세워 두고 변속기를 중립에 둔 상태에서 측정합니다. 원동기를 최고출력 시 회전속도의 75%로 4초 동안 돌려 그동안 나는 가장 큰 소음을 잽니다."}},{"q":"이륜자동차 부품을 세척할 때 안전수칙으로 올바르지 않은 것은?","o":["환기가 잘되는 곳에서 작업한다.","인화성 세척제 사용을 금지한다.","환기가 안 되는 밀폐된 공간에서 작업한다.","열원으로부터 멀리 떨어진 곳에서 작업한다."],"a":2,"e":{"w":["환기가 잘되는 곳에서 작업하는 것은 올바른 수칙입니다.","인화성 세척제를 쓰지 않는 것은 올바른 수칙입니다.","열원에서 멀리 떨어져 작업하는 것은 올바른 수칙입니다."],"d":"세척제에서는 유해한 증기가 나옵니다. 밀폐된 공간에서 작업하면 증기를 들이마셔 중독되거나 불이 붙을 수 있습니다. 반드시 환기가 잘되는 곳에서 작업합니다."}},{"q":"이륜자동차 작업장에서 전기 기구 사용 시 가장 위험한 행동은?","o":["젖은 손으로 전기 콘센트를 만진다.","전선 피복이 벗겨지지 않았는지 확인한다.","작업 통로에 전선이 가로지르지 않도록 정리한다.","사용하지 않는 전기 기구는 전원을 끈다."],"a":0,"e":{"w":["전선 피복을 확인하는 것은 안전한 행동입니다.","통로의 전선을 정리하는 것은 안전한 행동입니다.","쓰지 않는 기구의 전원을 끄는 것은 안전한 행동입니다."],"d":"물은 전기를 잘 통합니다. 젖은 손은 저항이 매우 낮아 콘센트를 만지면 몸으로 큰 전류가 흘러 감전됩니다."}},{"q":"이륜자동차 엔진에서 행정이 의미하는 것은?","o":["실린더 보어의 지름","상사점에서 하사점까지 이동하는 거리","엔진의 전체 폭","크랭크축의 지름"],"a":1,"e":{"w":["실린더 보어의 지름은 내경입니다.","엔진의 전체 폭은 행정이 아닙니다.","크랭크축의 지름은 행정이 아닙니다."],"d":"행정은 피스톤이 상사점에서 하사점까지 움직이는 거리입니다."}},{"q":"내연기관에서 장행정 엔진은 어느 것인가?","o":["행정/실린더내경 = 1","행정/실린더내경 ＜ 1","행정/실린더내경 ＞ 1","실린더내경/행정 ＞ 1"],"a":2,"e":{"w":["행정과 내경이 같으면 정방행정(스퀘어) 엔진입니다.","행정이 내경보다 짧으면 단행정 엔진입니다.","내경이 행정보다 크면 단행정 엔진입니다."],"d":"행정이 실린더 내경보다 긴 엔진이 장행정 엔진입니다. 행정 ÷ 내경의 값이 1보다 큽니다. 회전력이 크고 저속에서 힘이 좋습니다."}},{"q":"피스톤 링 중 오일 링의 역할은?","o":["실린더 벽에 엔진오일을 긁어내린다.","연소실의 압축압력을 높인다.","피스톤의 속도를 높인다.","엔진 소음을 줄인다."],"a":0,"e":{"w":["압축압력을 유지하는 것은 압축 링입니다.","피스톤의 속도와는 관계가 없습니다.","소음을 줄이는 것이 역할이 아닙니다."],"d":"오일 링은 실린더 벽에 묻은 엔진오일을 긁어내려 알맞은 두께의 유막만 남깁니다. 오일이 연소실로 올라가 타는 것을 막습니다."}},{"q":"피스톤 링을 장착할 때 각 링의 절개부 위치를 서로 다르게 하는 이유는?","o":["연소 압력의 누설을 최소화하기 위해","링의 파손을 방지하기 위해","조립 편의성을 높이기 위해","엔진오일의 점도를 유지하기 위해"],"a":0,"e":{"w":["링의 파손과는 관계가 없습니다.","조립을 쉽게 하려는 것이 아닙니다.","오일의 점도와는 관계가 없습니다."],"d":"링의 절개부(엔드 갭)가 한 줄로 나란히 있으면 그 틈으로 압축가스가 한꺼번에 샙니다. 링마다 절개부를 120도나 180도씩 어긋나게 두어 가스가 새는 것을 줄입니다."}},{"q":"흡입밸브의 닫힘 시기에 관한 설명 중 틀린 것은?","o":["저속 운전영역에서 흡입밸브를 늦게 닫으면 혼합가스가 역류한다.","저속 운전영역에서 흡입밸브를 빨리 닫으면 혼합기가 희박해진다.","고속 운전영역에서 흡입밸브를 빨리 닫으면 회전력과 최고 출력이 낮아진다.","고속 운전영역에서 흡입밸브를 늦게 닫으면 흡입공기의 관성을 충분히 활용할 수 있다."],"a":1,"e":{"w":["저속에서 늦게 닫으면 들어온 혼합가스가 다시 밀려 나갑니다. 옳은 설명입니다.","고속에서 빨리 닫으면 공기가 다 들어오기 전에 닫혀 출력이 낮아집니다. 옳은 설명입니다.","고속에서 늦게 닫으면 흡입 공기의 관성으로 더 많이 채울 수 있습니다. 옳은 설명입니다."],"d":"저속에서는 흡입 공기의 관성이 약합니다. 흡입밸브를 빨리 닫아야 혼합기가 거꾸로 밀려 나가지 않아 충전효율이 좋아집니다. 혼합기가 희박해진다는 ②가 틀렸습니다."}},{"q":"엔진 본체에서 피스톤 링의 작용이 아닌 것은?","o":["기밀유지 작용","오일제어 작용","열전도 작용","감마 작용"],"a":3,"e":{"w":["기밀유지 작용은 피스톤 링의 작용입니다.","오일제어 작용은 피스톤 링의 작용입니다.","열전도 작용은 피스톤 링의 작용입니다."],"d":"피스톤 링의 3대 작용은 기밀유지, 오일제어, 열전도(냉각)입니다. 감마 작용은 마찰과 마모를 줄이는 윤활유의 작용입니다."}},{"q":"오토바이 엔진 성능 향상을 위한 흡기 튜닝 시 고려해야 할 사항으로 가장 적절한 것은?","o":["무조건 큰 용량의 에어 필터를 장착하여 공기 유입량을 최대로 늘린다.","배기 시스템 튜닝 없이 흡기 튜닝만 진행하여도 엔진 출력은 크게 향상된다.","흡기 효율 개선 시, 이에 맞게 연료 공급 시스템(ECU 맵핑 또는 카뷰레터 제팅)을 함께 조정해야 한다.","흡기 소음 감소를 위해 흡기 통로를 최대한 길고 가늘게 설계한다."],"a":2,"e":{"w":["용량만 키우면 혼합비가 맞지 않아 오히려 성능이 떨어질 수 있습니다.","흡기와 배기는 함께 맞추어야 효과가 있습니다.","통로가 길고 가늘면 공기 저항이 커져 고속 출력이 떨어집니다."],"d":"흡기 효율이 좋아지면 들어오는 공기가 늘어납니다. 연료를 그만큼 늘려 주지 않으면 혼합기가 희박해집니다. ECU 맵핑이나 카뷰레터 제팅으로 연료량을 함께 조정해야 합니다."}},{"q":"어느 4행정 사이클 엔진의 밸브 개폐시기가 다음과 같다. 밸브오버랩은 얼마인가?","o":["30°","55°","65°","100°"],"a":0,"x":["흡기밸브 열림 : 상사점 전 10°","흡기밸브 닫힘 : 하사점 후 55°","배기밸브 열림 : 하사점 전 45°","배기밸브 닫힘 : 상사점 후 20°"],"e":{"w":["55°는 흡기밸브가 닫히는 시기입니다.","65°는 계산과 맞지 않습니다.","100°는 계산과 맞지 않습니다."],"d":"밸브 오버랩은 상사점 부근에서 흡기밸브와 배기밸브가 함께 열려 있는 구간입니다.\n오버랩 = 흡기밸브 열림(상사점 전) + 배기밸브 닫힘(상사점 후)\n= 10° + 20° = 30°","g":"overlap"}},{"q":"기화기가 막혔을 때 발생할 수 있는 증상으로 가장 적절한 것은?","o":["엔진 시동이 매우 잘 걸린다.","연비가 급격히 좋아진다.","브레이크 작동이 잘된다.","엔진 출력이 저하되고 시동이 꺼지기도 한다."],"a":3,"e":{"w":["연료가 부족해 시동이 잘 걸리지 않습니다.","연비가 좋아지지 않습니다.","브레이크와는 관계가 없습니다."],"d":"기화기의 제트나 통로가 막히면 연료가 제대로 나오지 않습니다. 혼합기가 희박해져 출력이 떨어지고 공회전이 불안정하며 시동이 꺼지기도 합니다."}},{"q":"엔진에서 노킹을 방지하기 위한 대처로 올바르지 않은 것은?","o":["고옥탄가 연료를 사용한다.","연소실 내의 냉각효율을 증가시킨다.","점화시기를 지각시킨다.","화염전파시기를 늦춘다."],"a":3,"e":{"w":["옥탄가가 높은 연료는 스스로 불이 잘 붙지 않아 노킹을 막습니다. 올바른 대처입니다.","연소실을 잘 식히면 혼합기 온도가 낮아져 노킹을 막습니다. 올바른 대처입니다.","점화시기를 늦추면 최고 압력이 낮아져 노킹을 막습니다. 올바른 대처입니다."],"d":"노킹은 화염이 다 퍼지기 전에 남은 혼합기가 스스로 터지는 현상입니다. 화염이 빨리 퍼져야 노킹을 막을 수 있습니다. 화염전파를 늦추면 오히려 노킹이 심해집니다."}},{"q":"엔진의 실린더 블록에서 워터 재킷의 주된 기능은?","o":["엔진오일 저장 공간","크랭크축 지지 공간","피스톤의 왕복 운동 공간","냉각수 순환 통로"],"a":3,"e":{"w":["엔진오일은 오일 팬에 저장합니다.","크랭크축은 크랭크케이스가 지지합니다.","피스톤이 왕복하는 공간은 실린더입니다."],"d":"워터 재킷은 실린더 둘레에 만든 냉각수 통로입니다. 냉각수가 이곳을 돌면서 엔진의 열을 빼앗습니다."}},{"q":"수냉식 엔진의 냉각수 관리 시, 가장 중요하게 확인해야 할 사항은?","o":["냉각수의 적정 레벨 유지 및 부동액 혼합 비율","냉각수의 색상","냉각수의 냄새","냉각수의 무게"],"a":0,"e":{"w":["색상은 참고할 뿐 가장 중요한 항목이 아닙니다.","냄새는 관리 항목이 아닙니다.","무게는 관리 항목이 아닙니다."],"d":"냉각수가 부족하면 엔진이 과열됩니다. 부동액 비율이 맞지 않으면 겨울에 얼거나 부식이 생깁니다. 적정 레벨과 부동액 혼합 비율을 가장 중요하게 확인합니다."}},{"q":"라디에이터에 냉각 팬이 장착되는 주된 목적은?","o":["엔진 소음을 줄이기 위해","라디에이터의 미관을 개선하기 위해","강제로 공기를 흡입하여 냉각 효율을 높이기 위해","냉각수 온도를 항상 높게 유지하기 위해"],"a":2,"e":{"w":["소음을 줄이려는 것이 아닙니다.","미관과는 관계가 없습니다.","냉각수 온도를 낮추려는 것입니다."],"d":"천천히 달리거나 서 있을 때는 라디에이터를 지나는 바람이 약합니다. 냉각 팬이 강제로 공기를 끌어들여 라디에이터를 식혀 줍니다."}},{"q":"연료라인 내의 연료 압력을 일정하게 유지하여 인젝터의 정확한 분사를 돕는 부품은?","o":["연료펌프","연료필터","연료압력 조절기","연료탱크"],"a":2,"e":{"w":["연료펌프는 연료를 압송하는 부품입니다.","연료필터는 연료 속의 이물질을 거르는 부품입니다.","연료탱크는 연료를 저장하는 부품입니다."],"d":"연료압력 조절기는 남는 연료를 탱크로 되돌려 보내 연료 라인의 압력을 일정하게 유지합니다. 압력이 일정해야 인젝터가 열린 시간만큼 정확한 양이 분사됩니다."}},{"q":"시동 모터 작동 시 가장 많은 전력을 소모하는 시점은?","o":["시동이 걸린 후 엔진이 정상적으로 회전할 때","이륜자동차가 저속으로 주행할 때","이륜자동차가 고속으로 주행할 때","시동 버튼을 처음 눌러 엔진이 회전하기 시작할 때"],"a":3,"e":{"w":["시동이 걸린 뒤에는 시동 모터가 작동하지 않습니다.","주행 중에는 시동 모터가 작동하지 않습니다.","주행 중에는 시동 모터가 작동하지 않습니다."],"d":"멈춰 있는 엔진을 처음 돌리기 시작할 때 가장 큰 힘이 필요합니다. 이 순간 시동 모터에 가장 큰 전류가 흐릅니다."}},{"q":"내연기관 이륜자동차의 충전 시스템 점검 시, 배터리 전압이 정상이고, 발전기(제너레이터) 출력도 정상인데 충전이 제대로 되지 않는다면 다음 중 어떤 부품의 고장을 의심할 수 있는가?","o":["레귤레이터","스파크 플러그","에어 필터","클러치 디스크"],"a":0,"e":{"w":["스파크 플러그는 점화장치입니다.","에어 필터는 흡기장치입니다.","클러치 디스크는 동력전달장치입니다."],"d":"발전기가 만든 교류를 직류로 바꾸고 전압을 알맞게 조절해 배터리로 보내는 부품이 레귤레이터(정류기)입니다. 배터리와 발전기가 정상인데 충전이 안 되면 그 사이에 있는 레귤레이터를 의심합니다."}},{"q":"내연기관 이륜자동차의 점화플러그가 젖어 있거나 오염되어 있을 때 나타날 수 있는 현상은?","o":["배터리 충전이 빨라진다.","배터리 충전이 느려진다.","브레이크가 잘 듣지 않는다.","시동불량, 출력저하, 연비불량"],"a":3,"e":{"w":["점화플러그는 충전과 관계가 없습니다.","점화플러그는 충전과 관계가 없습니다.","브레이크와는 관계가 없습니다."],"d":"점화플러그가 젖거나 오염되면 불꽃이 약해지거나 튀지 않습니다. 혼합기가 제대로 타지 않아 시동이 잘 걸리지 않고, 출력이 떨어지며, 연비가 나빠집니다."}},{"q":"이륜자동차의 미등이 켜지지 않을 때, 헤드라이트는 정상 작동한다면 가장 먼저 확인해야 할 것은?","o":["미등 전구 또는 미등 관련 퓨즈","헤드라이트 전구","헤드라이트 퓨즈","비상등 스위치"],"a":0,"e":{"w":["헤드라이트는 정상이므로 볼 필요가 없습니다.","헤드라이트는 정상이므로 볼 필요가 없습니다.","비상등 스위치는 미등과 관계가 없습니다."],"d":"헤드라이트가 정상이면 전원은 들어오고 있는 것입니다. 미등만 켜지지 않으면 미등 전구가 끊어졌는지, 미등 쪽 퓨즈가 끊어졌는지부터 확인합니다."}},{"q":"다음에서 옴의 법칙을 바르게 표현한 것은? (단, 전압은 V, 전류는 I, 저항은 R이다)","o":["R = I / V","V = I × R","R = I × V","I = R × V"],"a":1,"e":{"w":["R = V ÷ I가 옳은 식입니다.","R = V ÷ I가 옳은 식입니다.","I = V ÷ R이 옳은 식입니다."],"d":"옴의 법칙은 전압 = 전류 × 저항입니다.\nV = I × R\nI = V ÷ R\nR = V ÷ I","g":"ohm"}},{"q":"타이어 공기압이 적정 수준보다 낮을 때 발생할 수 있는 문제점은?","o":["타이어의 마모가 균일해진다.","브레이크 제동거리가 짧아진다.","타이어와 휠이 분리되기 쉽고, 주행 저항이 커진다.","핸들 조작이 가벼워진다."],"a":2,"e":{"w":["공기압이 낮으면 양쪽 가장자리가 먼저 닳아 마모가 고르지 않습니다.","제동거리가 짧아지지 않습니다.","접지면이 넓어져 핸들 조작은 무거워집니다."],"d":"공기압이 낮으면 타이어가 많이 찌그러집니다. 구름 저항이 커져 연비가 나빠지고, 타이어가 휠에서 벗겨지기 쉬우며, 열이 많이 나 손상됩니다."}},{"q":"이륜자동차 서스펜션의 세그를 측정하는 주된 목적은?","o":["엔진 오일량을 확인하기 위해","서스펜션을 최적의 작동 범위로 확보하기 위해","타이어 공기압을 조절하기 위해","브레이크 패드 마모를 확인하기 위해"],"a":1,"e":{"w":["엔진 오일량과는 관계가 없습니다.","타이어 공기압과는 관계가 없습니다.","브레이크 패드와는 관계가 없습니다."],"d":"세그(Sag)는 차의 무게와 운전자의 무게로 서스펜션이 내려앉는 양입니다. 세그를 맞추면 서스펜션이 늘어날 여유와 줄어들 여유를 모두 가져 가장 알맞은 범위에서 작동합니다."}},{"q":"이륜자동차의 조향장치가 좌우로 부드럽게 움직이지 않고 뻑뻑하다면, 어떤 부분의 문제일 가능성이 높은가?","o":["엔진오일 부족","체인 장력 부족","타이어 공기압 과다","스티어링 헤드 베어링 손상"],"a":3,"e":{"w":["엔진오일은 조향과 관계가 없습니다.","체인 장력은 조향과 관계가 없습니다.","공기압이 높으면 핸들이 가벼워집니다."],"d":"핸들은 스티어링 헤드 베어링 위에서 좌우로 돕니다. 베어링이 손상되거나 그리스가 굳으면 핸들이 뻑뻑하게 움직입니다."}},{"q":"이륜자동차의 브레이크 시스템을 점검할 때, 디스크 로터의 두께를 측정하는 이유는?","o":["브레이크 패드 마모상태를 확인하기 위해","로터의 마모가 허용 한계를 초과했는지 확인하기 위해","로터의 회전 불균형을 확인하기 위해","브레이크 슬립 상태를 확인하기 위해"],"a":1,"e":{"w":["패드 마모는 패드의 두께로 확인합니다.","회전 불균형(런아웃)은 다이얼 게이지로 측정합니다.","두께로는 슬립을 확인할 수 없습니다."],"d":"디스크 로터도 패드와 마찰하면서 닳습니다. 로터에 표시된 최소 두께(사용 한계)보다 얇아지면 열에 약해지고 깨질 수 있어 교환해야 합니다."}},{"q":"이륜자동차 클러치 디스크가 마모되었을 때 나타나는 증상은?","o":["기어 변속이 더 부드러워진다.","클러치 슬립 현상이 발생한다.","변속기에 동력이 잘 전달된다.","클러치를 통해 동력의 손실이 없다."],"a":1,"e":{"w":["변속이 부드러워지지 않습니다.","동력이 잘 전달되지 않습니다.","미끄러지는 만큼 동력이 손실됩니다."],"d":"클러치 디스크의 마찰재가 닳으면 눌러 주는 힘이 약해져 미끄러집니다. 엔진 회전수는 오르는데 속도가 따라 오르지 않는 클러치 슬립이 생깁니다."}},{"q":"이륜자동차의 크랭크축에 연결된 구동 기어 잇수가 25개이고, 변속기 입력축에 연결된 피동 기어 잇수가 75개일 때, 1차 감속비는 얼마인가?","o":["0.33","1.5","2.0","3.0"],"a":3,"e":{"w":["0.33은 구동 기어 잇수를 피동 기어 잇수로 거꾸로 나눈 값입니다.","1.5는 계산과 맞지 않습니다.","2.0은 계산과 맞지 않습니다."],"d":"감속비 = 피동 기어 잇수 ÷ 구동 기어 잇수입니다.\n75 ÷ 25 = 3.0\n크랭크축이 3바퀴 돌 때 변속기 입력축이 1바퀴 돕니다."}},{"q":"자동변속기에서 유압에 의해 동력을 연결하거나 차단하는 역할을 하는 것은?","o":["스프로킷","기어이빨","클러치 플레이트","록업 클러치"],"a":2,"e":{"w":["스프로킷은 체인을 거는 톱니바퀴입니다.","기어 이빨은 맞물려 회전을 전달할 뿐 잇고 끊지 않습니다.","록업 클러치는 토크 컨버터의 미끄러짐을 없애려고 직결하는 장치입니다."],"d":"자동변속기 안에는 여러 장의 클러치 플레이트가 있습니다. 유압이 이 플레이트를 눌러 붙이면 동력이 이어지고, 유압을 빼면 끊어집니다."}},{"q":"듀얼 클러치(DCT)장치의 특징으로 맞는 것은?","o":["변속기에 설치되어 있는 두 클러치를 동시에 접속하여 토크를 증대시켜 변속이 이루어지는 시스템이다.","두 개의 클러치를 서로 교대로 사용하는 구조로 기어 체인지에 소요되는 시간을 기존의 변속장치보다 크게 줄일 수 있다.","두 장의 클러치를 사용하여 변속감을 매우 빠르고 정교하게 조절할 수 있다.","습식클러치 기구와 건식클러치 기구를 동시에 조합하여 각 클러치 기구가 갖는 우수한 특징을 모두 구현할 수 있다."],"a":1,"e":{"w":["두 클러치를 동시에 잇지 않습니다. 하나를 끊으면서 다른 하나를 잇습니다.","변속감을 조절하는 것이 핵심이 아닙니다. 두 클러치를 교대로 써서 변속 시간을 줄이는 것이 핵심입니다.","습식과 건식을 함께 조합한 장치가 아닙니다."],"d":"DCT는 홀수 단 클러치와 짝수 단 클러치를 따로 둡니다. 다음 단 기어를 미리 물려 놓고 클러치만 교대로 바꿔 이으므로 변속 시간이 매우 짧습니다."}},{"q":"이륜자동차 체인에 녹이 발생했을 때, 가장 효과적인 정비 조치는?","o":["녹 제거제를 사용하여 녹을 제거한다.","녹슨 체인을 물로 씻어낸다.","녹슨 체인에 페인트를 칠한다.","녹슨 체인을 가열한다."],"a":0,"e":{"w":["물로 씻으면 녹이 더 빨리 생깁니다.","페인트를 칠하면 체인이 움직이지 못합니다.","가열하면 체인의 강도가 떨어지고 실(O링)이 손상됩니다."],"d":"녹은 녹 제거제로 없앤 뒤 체인 전용 윤활제를 발라 줍니다. 녹이 심해 마디가 굳었으면 체인을 교환합니다."}},{"q":"이륜자동차 체인 장력 점검 시, 체인이 가장 팽팽해지는 서스펜션의 위치는?","o":["서스펜션이 완전히 늘어난 상태","서스펜션이 완전히 압축된 상태","서스펜션이 일직선이 되는 지점으로 압축된 상태","서스펜션이 중간 정도 압축된 상태"],"a":2,"e":{"w":["완전히 늘어난 상태에서는 체인이 느슨합니다.","완전히 압축된 상태에서는 일직선을 지나 다시 느슨해집니다.","중간 정도라는 표현은 정확한 기준이 아닙니다."],"d":"드라이브 스프로킷 축, 스윙암 피벗, 뒷바퀴 축이 일직선이 될 때 두 스프로킷 사이의 거리가 가장 멉니다. 이때 체인이 가장 팽팽해집니다."}},{"q":"TPMS는 타이어의 공기압과 온도를 모니터링 하지만, 직접적으로 감지하여 경고하지 않는 것은?","o":["타이어의 공기압 부족","타이어의 과도한 온도 상승","타이어의 공기압 과다","타이어 트레드의 마모 한계"],"a":3,"e":{"w":["공기압 부족은 TPMS가 감지합니다.","온도가 지나치게 오르는 것은 TPMS가 감지합니다.","공기압 과다는 TPMS가 감지합니다."],"d":"TPMS는 타이어 속의 공기압과 온도를 재는 장치입니다. 트레드가 얼마나 닳았는지는 잴 수 없으므로 마모 한계 표시를 눈으로 확인해야 합니다."}},{"q":"이륜자동차 ABS 시스템이 작동할 때, 휠 속도 센서가 감지하는 것은?","o":["타이어의 공기압","브레이크액의 압력","브레이크 패드의 마모도","바퀴의 회전 속도"],"a":3,"e":{"w":["공기압은 TPMS 센서가 감지합니다.","브레이크액의 압력은 압력 센서가 감지합니다.","패드의 마모는 휠 속도 센서가 감지하지 않습니다."],"d":"휠 속도 센서는 바퀴와 함께 도는 톤 휠(센서 링)의 이를 읽어 바퀴의 회전 속도를 감지합니다. ECU는 이 신호로 바퀴가 잠기려 하는지 판단합니다."}},{"q":"이륜자동차 ABS 시스템이 장착된 차량에서, 눈길이나 빗길과 같이 노면이 미끄러운 상황에서 ABS가 제공하는 안전 이점은 어느 것인가?","o":["타이어 마모 방지","연료 소모량 감소","제동 중 바퀴 잠김 위험을 크게 줄여 조향성 유지","제동 중 조향성 상실"],"a":2,"e":{"w":["타이어 마모 방지는 ABS의 목적이 아닙니다.","연료 소모와는 관계가 없습니다.","ABS는 조향성을 잃지 않게 해 주는 장치입니다."],"d":"눈길이나 빗길에서는 바퀴가 쉽게 잠깁니다. ABS는 제동 중 바퀴가 잠길 위험을 크게 줄여, 넘어지지 않고 조향성을 유지하게 해 줍니다."}},{"q":"이륜자동차 TPMS 시스템이 장착된 차량에서, 타이어 공기압이 너무 낮은 상태로 주행할 때 발생할 수 있는 위험한 사항이 아닌 것은?","o":["타이어의 과열","현가장치의 과열","조종성 불안정","타이어의 파열"],"a":1,"e":{"w":["공기압이 낮으면 타이어가 많이 찌그러지면서 열이 납니다.","공기압이 낮으면 핸들이 무겁고 조종이 불안정해집니다.","과열이 심해지면 타이어가 파열될 수 있습니다."],"d":"공기압이 낮으면 타이어가 과열되고, 조종성이 나빠지며, 심하면 파열됩니다. 현가장치가 과열되는 것은 공기압과 관계가 없습니다."}},{"q":"이륜자동차 시트 히팅 시스템에서 열을 발생시키는 것은?","o":["발열선(히팅 엘리먼트)","히터 코어","시트 냉각팬","히트 플러그"],"a":0,"e":{"w":["히터 코어는 냉각수의 열을 이용하는 난방 부품입니다.","냉각팬은 열을 식히는 부품입니다.","히트 플러그는 시트 부품이 아닙니다."],"d":"시트 안에 깔린 발열선(히팅 엘리먼트)에 전류가 흐르면서 열이 납니다."}},{"q":"이륜자동차 크루즈 컨트롤 시스템 사용 시 주의해야 할 사항은?","o":["항상 전방 주시만 하고 주변 교통 흐름에는 집중 안 해도 된다.","항상 전방 주시와 주변 교통 상황에 집중해야 한다.","항상 뒤차와의 거리에 집중해야 한다.","브레이크 패드를 자주 교환해야 한다."],"a":1,"e":{"w":["전방만 보고 주변 교통 흐름을 보지 않으면 위험합니다.","뒤차만 신경 써서는 안 됩니다.","패드 교환 주기와는 관계가 없습니다."],"d":"크루즈 컨트롤은 속도만 유지해 주는 보조 장치입니다. 운전자는 항상 전방을 주시하고 주변 교통 상황에 집중해야 합니다."}},{"q":"이륜자동차 디스플레이 모니터의 백라이트 밝기가 약하거나 작동하지 않을 때 발생할 수 있는 상황은?","o":["야간에 주행 안전에도 문제가 없다.","터널 주행 시에는 안전에 문제가 없다.","작동 불량 시 전원을 끈다.","야간에 주행 안전에 문제가 생긴다."],"a":3,"e":{"w":["야간에는 화면이 보이지 않아 문제가 됩니다.","터널 안에서도 화면이 보이지 않아 문제가 됩니다.","전원을 끄는 것은 발생하는 상황이 아니라 조치입니다."],"d":"백라이트는 화면 뒤에서 빛을 비춰 줍니다. 약하거나 꺼지면 밤에 속도와 경고등을 읽을 수 없어 주행 안전에 문제가 생깁니다."}},{"q":"이륜자동차 오디오장치에서 블루투스 연결 기능의 편의성 중 틀린 것은?","o":["향상된 안전성 및 핸즈프리 통신","다양한 음악 재생","원활한 내비게이션 음성 안내","오디오장치의 수명 연장"],"a":3,"e":{"w":["손을 쓰지 않고 통화할 수 있어 안전합니다. 옳은 설명입니다.","스마트폰의 음악을 재생할 수 있습니다. 옳은 설명입니다.","내비게이션 음성 안내를 들을 수 있습니다. 옳은 설명입니다."],"d":"블루투스는 무선으로 기기를 연결하는 기능입니다. 통화, 음악, 음성 안내에 편리하지만 오디오장치의 수명을 늘려 주지는 않습니다."}},{"q":"이륜자동차 오디오 스피커에서 잡음이 발생한다면 의심해야 할 항목 중 틀린 것은?","o":["스피커 고장","오디오 기기 자체의 문제","스피커 배선이나 오디오 입력 케이블","네비게이션 불량"],"a":3,"e":{"w":["스피커가 고장 나면 잡음이 납니다.","오디오 기기 자체에 문제가 있으면 잡음이 납니다.","배선이나 입력 케이블의 접촉이 나쁘면 잡음이 납니다."],"d":"스피커 잡음은 스피커, 오디오 기기, 배선과 케이블에서 원인을 찾습니다. 내비게이션 불량은 스피커 잡음의 원인이 아닙니다."}},{"q":"이륜자동차 프레임의 주요 재질로 사용되는 금속이 아닌 것은?","o":["강철","알루미늄 합금","티타늄","구리"],"a":3,"e":{"w":["강철은 가장 널리 쓰는 프레임 재질입니다.","알루미늄 합금은 가벼워서 프레임에 많이 씁니다.","티타늄은 가볍고 강해 고급 프레임에 씁니다."],"d":"프레임은 튼튼하고 가벼워야 합니다. 강철, 알루미늄 합금, 티타늄, 탄소 섬유를 씁니다. 구리는 무르고 무거워 프레임에 쓰지 않고 전선에 씁니다."}},{"q":"프레임 변형이나 손상으로 인한 얼라인먼트 불량이 발생했을 때, 나타날 수 있는 증상이 아닌 것은?","o":["쇽업소버의 비정상 마모","핸들 쏠림","타이어의 비정상적인 편 마모","직진 주행 시 불안정"],"a":0,"e":{"w":["프레임이 틀어지면 핸들이 한쪽으로 쏠립니다.","바퀴가 비뚤게 굴러 타이어가 한쪽만 닳습니다.","앞뒤 바퀴가 일직선이 아니라 직진할 때 불안정합니다."],"d":"얼라인먼트 불량은 앞뒤 바퀴의 정렬이 틀어진 것입니다. 핸들 쏠림, 타이어 편마모, 직진 불안정으로 나타납니다. 쇽업소버의 마모는 직접 나타나는 증상이 아닙니다."}},{"q":"전기 이륜자동차의 전력 소비 효율을 나타내는 단위로 적절한 것은?","o":["kW(킬로와트)","Ah(암페어시)","kcal(킬로칼로리)","Wh/km(와트시/킬로미터)"],"a":3,"e":{"w":["kW는 모터의 출력을 나타내는 단위입니다.","Ah는 배터리의 용량을 나타내는 단위입니다.","kcal는 열량의 단위입니다."],"d":"전력 소비 효율은 1km를 달리는 데 전기를 얼마나 쓰는지를 나타냅니다. 단위는 Wh/km를 씁니다. 숫자가 작을수록 효율이 좋습니다."}},{"q":"전기 이륜자동차를 휴대용 충전기로 충전한 뒤, 충전 케이블을 분리하는 일반적인 순서로 옳은 것은?","o":["차량 쪽 커넥터를 먼저 분리한 뒤 전원(콘센트) 쪽 플러그를 분리한다.","전원(콘센트) 쪽 플러그를 먼저 분리한 뒤 차량 쪽 커넥터를 분리한다.","빨리 당겨서 분리한다.","차량 시동을 걸고 분리한다."],"a":1,"e":{"w":["전원이 연결된 채로 차량 쪽 커넥터를 먼저 뽑으면 단자에 불꽃이 튈 수 있습니다.","케이블을 급하게 당기면 커넥터와 전선이 손상됩니다. 커넥터 몸체를 잡고 분리합니다.","충전 케이블은 차량 전원을 끈 상태에서 분리합니다."],"d":"전원 쪽을 먼저 끊으면 충전기에 전기가 흐르지 않는 상태에서 차량 쪽 커넥터를 뽑게 되어 단자에 불꽃이 튀지 않습니다. 연결할 때는 반대로 차량 쪽을 먼저 꽂고 전원을 나중에 꽂습니다. 제품에 따라 순서가 다를 수 있으므로 사용설명서를 따릅니다."}},{"q":"전기 이륜자동차 정비 시, 배터리 팩 내부에서 연기가 발생하거나 냄새가 날 때 사용해서는 안 되는 소화기는?","o":["ABC 분말 소화기","이산화탄소(CO2) 소화기","물 소화전","D급 소화기"],"a":2,"e":{"w":["ABC 분말 소화기는 전기 화재에 쓸 수 있습니다.","이산화탄소 소화기는 전기가 통하지 않아 전기 화재에 쓸 수 있습니다.","D급 소화기는 금속 화재용 소화기입니다."],"d":"고전압이 흐르는 배터리 팩에 물을 뿌리면 물을 타고 전기가 흘러 감전될 수 있고 상황이 더 나빠질 수 있습니다. 분말, 이산화탄소, 금속 화재용 소화기를 씁니다."}},{"q":"전기 이륜자동차의 배터리 용량을 나타내는 단위는?","o":["Ah(암페어시)","V(볼트)","W(와트)","kW(킬로와트)"],"a":0,"e":{"w":["V(볼트)는 전압의 단위입니다.","W(와트)는 전력의 단위입니다.","kW(킬로와트)는 전력의 단위로, 모터의 출력을 나타낼 때 씁니다."],"d":"배터리 용량은 얼마의 전류를 몇 시간 동안 쓸 수 있는지로 나타냅니다. 단위는 Ah(암페어시)입니다. 용량이 클수록 한 번 충전으로 더 멀리 갈 수 있습니다."}},{"q":"급속 충전 방식의 특징으로 옳은 것은?","o":["일반 가정용 콘센트에서 주로 사용한다.","높은 전력으로 단시간 많은 양의 배터리 충전이 가능하다.","AC 전력을 그대로 배터리에 공급한다.","배터리 수명에 가장 긍정적인 영향을 미친다."],"a":1,"e":{"w":["가정용 콘센트로 하는 것은 완속 충전입니다.","급속 충전은 충전기에서 직류로 바꾸어 배터리에 공급합니다.","큰 전류로 충전하면 열이 많이 나 배터리 수명에는 좋지 않습니다."],"d":"급속 충전은 높은 전력의 직류를 배터리에 바로 넣어 짧은 시간에 많은 양을 충전합니다. 완속 충전보다 훨씬 빠릅니다."}},{"q":"전기 이륜자동차의 충전 시스템에서 OBC (On-Board-Charger)의 역할은?","o":["제동 시 발생한 회생 전력을 모터로 전달한다.","모터의 회전 속도를 운전 조건에 맞게 제어한다.","배터리 셀의 온도를 감지한다.","외부 교류전원을 직류전원으로 변환한다."],"a":3,"e":{"w":["회생 전력은 모터에서 배터리로 갑니다. OBC의 역할이 아닙니다.","모터의 회전 속도는 MCU가 제어합니다.","배터리 셀의 온도는 BMS가 감지합니다."],"d":"OBC는 차에 달린 충전기입니다. 외부에서 들어온 교류(AC)를 직류(DC)로 바꾸어 배터리를 충전합니다."}},{"q":"전기 이륜자동차가 정지 상태에서 출발할 때, 즉시 최대 토크를 낼 수 있는 동력원은?","o":["엔진","변속기","전기 모터","클러치"],"a":2,"e":{"w":["엔진은 회전수가 올라가야 큰 토크가 나옵니다.","변속기는 동력원이 아닙니다.","클러치는 동력원이 아닙니다."],"d":"전기 모터는 전류가 흐르는 순간부터 큰 토크를 냅니다. 멈춘 상태에서 출발할 때 바로 최대 토크가 나오는 것이 엔진과 다른 점입니다."}},{"q":"전기 이륜자동차 모터의 주요 유형 중, 일반적으로 효율이 높고 유지보수가 적어 많이 사용되는 것은?","o":["직류(DC) 브러시 모터","유도 모터(Induction Motor)","스태퍼 모터(Stepper Motor)","브러시 리스 직류(BLDC) 모터 또는 영구자석 동기 모터(PMSM)"],"a":3,"e":{"w":["브러시 모터는 브러시가 닳아 정기적으로 교환해야 합니다.","유도 모터는 영구자석 모터보다 효율이 낮고 큽니다.","스태퍼 모터는 정밀한 위치 제어용이라 구동용으로 쓰지 않습니다."],"d":"BLDC 모터와 영구자석 동기 모터(PMSM)는 브러시가 없어 닳는 부품이 적고 효율이 높습니다. 전기 이륜자동차에 가장 많이 씁니다."}},{"q":"전기 이륜자동차의 현재 충전 상태를 0%에서 100% 사이의 백분율로 나타내는 것은?","o":["SOC","BMS","MCU","OBC"],"a":0,"e":{"w":["BMS는 배터리 관리 시스템입니다.","MCU는 모터 제어기입니다.","OBC는 차에 달린 충전기입니다."],"d":"SOC(State Of Charge)는 배터리에 남아 있는 전기의 양을 0~100%로 나타낸 값입니다. 계기판의 배터리 잔량 표시가 SOC입니다."}},{"q":"전기 이륜자동차도 내연기관 이륜자동차와 동일하게 반드시 받아야 하는 환경 관련 검사 항목은?","o":["연료 누유 검사","엔진 오일 누유 검사","소음 검사","머플러 불법 개조 검사"],"a":2,"e":{"w":["전기 이륜자동차에는 연료가 없습니다.","전기 이륜자동차에는 엔진 오일이 없습니다.","전기 이륜자동차에는 머플러가 없습니다."],"d":"전기 이륜자동차에는 연료, 엔진 오일, 머플러가 없어 이와 관련된 검사는 할 수 없습니다. 경음기 소리 같은 소음 항목은 내연기관 이륜자동차와 똑같이 확인합니다."}},{"q":"이륜자동차 배기가스 검사 시, 촉매변환장치의 역할과 이상 여부 확인의 중요성은?","o":["엔진 냉각 기능을 돕는다.","이륜자동차의 연료 소모를 낮춘다.","배기가스 중 유해물질(CO, HC, NOx)을 무해한 물질로 변환시키는 역할을 하므로, 손상 시 배출가스 기준 초과로 이어진다.","브레이크 패드 마모를 줄인다."],"a":2,"e":{"w":["엔진 냉각과는 관계가 없습니다.","연료 소모와는 관계가 없습니다.","브레이크 패드와는 관계가 없습니다."],"d":"촉매변환장치는 배기가스 속의 CO, HC, NOx를 해가 없는 물질로 바꿉니다. 촉매가 손상되면 유해 가스가 그대로 나와 배출가스 기준을 넘게 됩니다."}},{"q":"다음 중 이륜자동차 정기검사 대상에서 제외되는 경우는?","o":["배기량 50cc 미만인 이륜자동차","배기량 50cc 이상 260cc 이하로 2018년 이후 제작된 이륜자동차","대형 이륜자동차(260cc 초과)","대형 전기 이륜자동차"],"a":0,"e":{"w":["2018년 이후 제작된 중·소형 이륜자동차는 정기검사 대상입니다.","대형 이륜자동차는 정기검사 대상입니다.","안전검사 제도가 도입되면서 대형 전기 이륜자동차도 정기검사 대상이 되었습니다."],"d":"배기량 50cc 미만인 이륜자동차는 정기검사 대상에서 제외됩니다. 대형 이륜자동차와 2018년 1월 1일 이후 제작된 중·소형 이륜자동차는 검사를 받아야 합니다."}},{"q":"전기 이륜자동차 등화장치 검사에서 확인하는 전조등의 허용 기준은?","o":["전조등의 크기","전조등의 색깔이 청색인지","전조등의 광도가 법적 기준을 충족하는지","전조등의 필라멘트 재질"],"a":2,"e":{"w":["전조등의 크기는 검사 기준이 아닙니다.","전조등은 흰색이어야 합니다. 청색은 맞지 않습니다.","필라멘트의 재질은 검사 기준이 아닙니다."],"d":"등화장치 검사에서는 전조등의 밝기(광도)가 법에서 정한 기준을 충족하는지 확인합니다."}},{"q":"바퀴잠김방지식 제동장치(ABS)를 갖춘 이륜자동차의 바퀴잠김 확인시험에서, 고마찰로의 제동초속도는 얼마인가? (단, 최고속도의 80%와 비교해 더 낮은 속도를 적용한다.)","o":["40km/h","50km/h","60km/h","80km/h"],"a":3,"e":{"w":["40km/h는 소형 이륜자동차(50cc 이하, 최고속도 50km/h 이하)의 일반 제동능력 시험에 쓰는 제동초속도입니다.","50km/h는 고마찰로와 저마찰로를 이어서 지나는 시험의 제동초속도입니다.","60km/h는 일반 제동능력 시험의 제동초속도입니다."],"d":"「자동차 및 자동차부품의 성능과 기준에 관한 규칙」 별표 5의13에 따라, ABS 바퀴잠김 확인시험은 고마찰로에서 80km/h 또는 최고속도의 80% 가운데 낮은 속도로 합니다. 일반 제동능력 시험의 제동초속도는 60km/h(최고속도의 90%와 비교)이므로 구분해서 기억합니다."}},{"q":"전기 이륜자동차 검사에서 배터리 관련 문제가 발견되어 불합격 판정을 받았을 때, 재검사를 위해 가장 먼저 해야 할 조치는?","o":["배터리를 완전히 충전시킨다.","배터리 전문 정비 업체 또는 제조사 서비스 센터에서 해당 문제 진단 및 수리/교체 후 관련 서류를 확보한다.","배터리를 분해하여 수리한다.","배터리를 완전히 방전시킨다."],"a":1,"e":{"w":["충전만으로는 고장이 해결되지 않습니다.","고전압 배터리를 직접 분해하면 감전과 화재 위험이 있습니다.","완전히 방전시키면 배터리가 손상됩니다."],"d":"고전압 배터리는 전문 장비와 자격이 있어야 다룰 수 있습니다. 전문 정비 업체나 제조사 서비스 센터에서 진단하고 수리하거나 교체한 뒤 관련 서류를 갖추어 재검사를 받습니다."}},{"q":"전기 이륜자동차 정비용 공구 사용 시 안전 수칙으로 올바른 것은?","o":["공구가 손상되었어도 그냥 사용한다.","절연이 안 된 공구를 사용한다.","공구를 습기 찬 곳에 놓는다.","절연된 전용 공구를 사용한다."],"a":3,"e":{"w":["손상된 공구는 절연이 깨져 있을 수 있습니다.","절연이 안 된 공구는 감전됩니다.","습기는 절연 성능을 떨어뜨립니다."],"d":"전기 이륜자동차에는 높은 전압이 흐릅니다. 손잡이가 절연 처리된 전용 공구를 써야 감전과 합선을 막을 수 있습니다."}},{"q":"이륜자동차 정비 작업 시 발생할 수 있는 소음으로부터 청력을 보호하기 위한 조치는?","o":["이어폰을 착용하여 음악을 듣는다.","귀마개 또는 귀덮개를 착용한다.","소음이 발생하면 작업장에서 나간다.","소음에 익숙해지도록 노력한다."],"a":1,"e":{"w":["이어폰은 소음을 막지 못하고 주변 소리를 못 듣게 합니다.","작업장을 나가는 것은 보호 조치가 아닙니다.","소음에 익숙해져도 청력은 계속 손상됩니다."],"d":"큰 소음에 오래 노출되면 청력이 손상되고 회복되지 않습니다. 귀마개나 귀덮개를 착용해 귀로 들어오는 소음을 줄입니다."}},{"q":"다음 중 내연기관의 종류에 속하지 않는 것은?","o":["가솔린 기관","가스터빈","로터리 기관","증기 기관"],"a":3,"e":{"w":["가솔린 기관은 실린더 안에서 연료를 태우는 내연기관입니다.","가스터빈은 기관 안에서 연료를 태우는 내연기관입니다.","로터리 기관은 기관 안에서 연료를 태우는 내연기관입니다."],"d":"내연기관은 기관 안에서 연료를 태웁니다. 증기 기관은 기관 밖의 보일러에서 연료를 태워 만든 증기로 움직이므로 외연기관입니다."}},{"q":"2사이클 엔진에서 흡입된 혼합기가 크랭크케이스를 거쳐 실린더로 이동하는 과정을 무엇이라 하는가?","o":["소기 과정","흡입 과정","배기 과정","압축 과정"],"a":0,"e":{"w":["흡입 과정은 혼합기가 크랭크케이스로 들어오는 과정입니다.","배기 과정은 연소가스가 나가는 과정입니다.","압축 과정은 혼합기를 누르는 과정입니다."],"d":"2사이클 엔진에서는 크랭크케이스에서 눌린 혼합기가 소기 구멍을 통해 실린더로 밀려 들어가면서 남은 연소가스를 밀어냅니다. 이 과정을 소기라고 합니다."}},{"q":"엔진의 피스톤 핀이 피스톤 보스와 커넥팅로드 사이에 장착될 때, 피스톤 핀의 고정방식 중 풀 플로팅 타입의 특징으로 옳은 것은?","o":["피스톤 핀이 피스톤 보스에만 고정되어 있다.","피스톤 핀이 커넥팅로드에만 고정되어 있다.","피스톤 핀이 피스톤 보스와 커넥팅로드 양쪽에 모두 자유롭게 회전한다.","피스톤 핀이 피스톤 보스와 커넥팅로드에 모두 고정되어 있다."],"a":2,"e":{"w":["핀을 피스톤 보스에 고정하는 것은 고정식입니다.","핀을 커넥팅로드에 고정하는 것은 반부동식(세미 플로팅)입니다.","양쪽에 모두 고정하면 피스톤이 움직일 수 없습니다."],"d":"풀 플로팅(전부동식)은 피스톤 핀을 어느 쪽에도 고정하지 않습니다. 핀이 보스와 커넥팅로드 양쪽에서 자유롭게 돌고, 핀이 빠지지 않도록 양 끝에 스냅링을 끼웁니다."}},{"q":"최적의 점화시기를 의미하는 MBT에 대한 설명으로 옳은 것은?","o":["BTDC 약 10~15°부근에서 최대 폭발 압력이 발생되는 점화시기","ATDC 약 10~15°부근에서 최대 폭발 압력이 발생되는 점화시기","BTDC 약 5~10°부근에서 최대 폭발 압력이 발생되는 점화시기","ATDC 약 15~20°부근에서 최대 폭발 압력이 발생되는 점화시기"],"a":1,"e":{"w":["BTDC는 상사점 전입니다. 상사점 전에 최대 압력이 나오면 피스톤을 거꾸로 밀게 됩니다.","상사점 전에 최대 압력이 나오면 안 됩니다.","ATDC 15~20°는 조금 늦어 힘이 줄어듭니다."],"d":"MBT는 가장 큰 회전력을 내는 점화시기입니다. 상사점 후(ATDC) 약 10~15° 부근에서 폭발 압력이 최대가 되도록 점화하면 피스톤을 가장 효과적으로 밀어 줍니다."}},{"q":"가솔린엔진의 밸브간극이 규정값보다 클 때 발생하는 현상은?","o":["출력이 저하된다.","소음이 감소하고 밸브기구에 충격을 준다.","흡입밸브 간극이 크면 흡입량이 많아진다.","엔진의 체적효율이 증대된다."],"a":0,"e":{"w":["간극이 크면 부딪치는 소음이 커집니다.","간극이 크면 밸브가 늦게 열리고 덜 열려 흡입량이 줄어듭니다.","흡입량이 줄어 체적효율이 낮아집니다."],"d":"밸브간극이 크면 밸브가 늦게 열리고 일찍 닫히며 열리는 양도 줄어듭니다. 흡입과 배기가 충분하지 않아 출력이 떨어지고 태핏 소음이 납니다."}},{"q":"다음 보기 중 VVT(Variable Valve Timing)의 제어방법으로 바르게 설명한 것끼리 묶은 것은?","o":["㉮, ㉯","㉯, ㉰","㉮, ㉰","㉯, ㉱"],"a":3,"x":["㉮ 공회전시 밸브오버랩이 커야 흡입효율이 향상되며 배기가스 충돌이 없다.","㉯ 중부하 운전영역에서 밸브오버랩을 크게 하여 연소실 내의 배기가스 재순환량을 높여 질소산화물의 발생을 억제하고, 탄화수소의 배출도 감소시킬 수 있다.","㉰ 경부하, 중저속영역에서는 밸브오버랩이 커야 연소안정성을 향상시킬 수 있다.","㉱ 고부하, 중저속영역에서는 밸브오버랩이 커야 체적효율성이 향상된다."],"e":{"w":["㉮는 틀렸습니다. 공회전에서는 오버랩이 작아야 연소가 안정됩니다.","㉰는 틀렸습니다. 경부하 영역에서는 오버랩이 작아야 연소가 안정됩니다.","㉮와 ㉰는 모두 틀린 설명입니다."],"d":"밸브 오버랩이 크면 배기가스가 연소실에 남습니다. 공회전과 경부하에서는 오버랩을 작게 해 연소를 안정시킵니다. 중부하에서는 크게 해 배기가스 재순환 효과로 질소산화물을 줄이고(㉯), 고부하 중저속에서는 크게 해 체적효율을 높입니다(㉱)."}},{"q":"캐니스터에서 포집한 연료 증발가스를 흡기다기관으로 보내주는 장치는?","o":["PCV","EGR 밸브","PCSV","서모 밸브"],"a":2,"e":{"w":["PCV는 블로바이가스를 흡기로 보내는 장치입니다.","EGR 밸브는 배기가스 일부를 흡기로 다시 보내는 장치입니다.","서모 밸브는 온도에 따라 통로를 여닫는 밸브입니다."],"d":"캐니스터는 연료탱크에서 증발한 연료 가스를 활성탄에 모아 둡니다. PCSV(퍼지 컨트롤 솔레노이드 밸브)가 열리면 모아 둔 가스가 흡기다기관으로 들어가 연소됩니다."}},{"q":"실린더로 유입되는 공기를 최대한 활용하여 동력을 얻어내고자 할 때 필요한 연료의 양으로 동력의 최대점과 유해 배출가스의 배출 최소점이 어느 정도 일치하는 구간을 의미하는 것은?","o":["이론 공연비","희박 공연비","농후 공연비","공기 과잉률"],"a":0,"e":{"w":["희박 공연비는 공기가 많은 상태로 연비는 좋지만 출력이 떨어집니다.","농후 공연비는 연료가 많은 상태로 CO와 HC가 늘어납니다.","공기 과잉률은 실제 공연비를 이론 공연비로 나눈 값입니다."],"d":"이론 공연비는 연료가 남김없이 완전히 타는 데 필요한 공기와 연료의 비입니다. 가솔린은 약 14.7 : 1입니다. 이 비율에서 삼원촉매의 정화 성능이 가장 좋습니다."}},{"q":"가솔린 엔진에서 노크 발생을 억제하기 위한 방법으로 틀린 것은?","o":["연소실 벽 온도를 낮춘다.","압축비 흡기온도를 낮춘다.","자연발화 온도가 낮은 연료를 사용한다.","연소실 내 공기와 연료의 혼합을 원활하게 한다."],"a":2,"e":{"w":["연소실 벽 온도를 낮추면 노크가 억제됩니다. 옳은 방법입니다.","압축비와 흡기온도를 낮추면 노크가 억제됩니다. 옳은 방법입니다.","혼합이 잘되면 화염이 빨리 퍼져 노크가 억제됩니다. 옳은 방법입니다."],"d":"노크는 남은 혼합기가 스스로 불이 붙어 생깁니다. 자연발화 온도가 낮은 연료는 더 쉽게 스스로 불이 붙어 노크가 심해집니다. 자연발화 온도가 높은(옥탄가가 높은) 연료를 써야 합니다."}},{"q":"연료장치에서 연료가 고온상태일 때 체적 팽창을 일으켜 연료 공급이 과다해지는 현상은?","o":["베이퍼록 현상","퍼컬레이션 현상","캐비테이션 현상","스텀블 현상"],"a":1,"e":{"w":["베이퍼록은 연료나 브레이크액이 끓어 기포가 생기고 흐름이 막히는 현상입니다.","캐비테이션은 압력이 낮아져 액체 속에 기포가 생기는 현상입니다.","스텀블은 가속할 때 엔진이 순간적으로 주춤하는 현상입니다."],"d":"퍼컬레이션은 기화기 안의 연료가 뜨거워져 부피가 늘면서 넘쳐흐르는 현상입니다. 혼합기가 지나치게 진해져 시동이 잘 걸리지 않습니다."}},{"q":"라디에이터 캡에 장착된 압력 밸브의 역할은?","o":["냉각수의 농도를 조절한다.","냉각수의 비점을 높인다.","냉각수의 흐름 방향을 전환한다.","라디에이터의 누수를 자동으로 막는다."],"a":1,"e":{"w":["농도를 조절하지 않습니다.","흐름 방향을 바꾸지 않습니다.","누수를 막는 장치가 아닙니다."],"d":"압력이 높으면 물은 100℃보다 높은 온도에서 끓습니다. 라디에이터 캡의 압력 밸브는 냉각 계통의 압력을 높게 유지해 냉각수의 끓는점(비점)을 높입니다."}},{"q":"엔진 정비 시, 엔진과열의 가장 흔한 원인 중 하나는?","o":["엔진 오일량이 너무 많을 때","타이어 공기압이 너무 높을 때","냉각수 부족 또는 냉각 팬 고장일 때","연료탱크에 연료가 가득 찼을 때"],"a":2,"e":{"w":["오일이 많은 것은 과열의 흔한 원인이 아닙니다.","타이어 공기압은 엔진 온도와 관계가 없습니다.","연료가 가득 찬 것은 관계가 없습니다."],"d":"엔진의 열은 냉각수가 빼앗아 라디에이터에서 식힙니다. 냉각수가 부족하거나 냉각 팬이 돌지 않으면 열을 식히지 못해 과열됩니다."}},{"q":"이륜자동차 전자제어 엔진에서 연료펌프의 역할은?","o":["연료를 압력을 감지한다.","연료의 온도를 감지한다.","연료를 일정한 압력으로 공급한다.","연료의 양을 감지한다."],"a":2,"e":{"w":["압력을 감지하는 것은 센서의 역할입니다.","온도를 감지하는 것은 센서의 역할입니다.","양을 감지하는 것은 연료 게이지 유닛의 역할입니다."],"d":"연료펌프는 탱크의 연료를 빨아올려 인젝터까지 일정한 압력으로 보내 줍니다."}},{"q":"이륜자동차 시동 모터에 12V의 전압이 인가되고, 이때 10A의 전류가 흐른다면 시동 모터의 저항은 약 몇 옴(Ω)인가?","o":["1.0Ω","1.2Ω","2.0Ω","12Ω"],"a":1,"e":{"w":["1.0Ω은 계산과 맞지 않습니다.","2.0Ω은 계산과 맞지 않습니다.","12Ω은 전압값을 그대로 쓴 것입니다."],"d":"옴의 법칙에서 저항 = 전압 ÷ 전류입니다.\nR = V ÷ I = 12V ÷ 10A = 1.2Ω","g":"ohm"}},{"q":"발전기가 생산한 교류(AC) 전기를 이륜자동차의 전기장치와 배터리가 사용할 수 있는 직류(DC)로 변환하는 부품은?","o":["인버터","레귤레이터(정류기)","변압기","컨버터"],"a":1,"e":{"w":["인버터는 직류를 교류로 바꿉니다. 방향이 반대입니다.","변압기는 교류 전압의 크기를 바꿉니다.","이 문제에서 컨버터는 직류 전압의 크기를 바꾸는 장치(DC-DC 컨버터)를 말합니다."],"d":"이륜자동차의 발전기는 교류를 만듭니다. 레귤레이터(정류기)가 이것을 직류로 바꾸고 전압도 일정하게 맞추어 배터리와 전기장치로 보냅니다."}},{"q":"점화코일의 불량으로 인해 불완전 연소가 발생했을 때, 연비 외에 엔진에 추가적으로 나타날 수 있는 부정적인 영향은?","o":["엔진 온도가 급격히 낮아진다.","점화플러그의 수명이 급격히 늘어난다.","엔진 오일 압력이 증가한다.","유해 배기가스 배출량이 증가한다."],"a":3,"e":{"w":["불완전 연소와 엔진 온도가 낮아지는 것은 관계가 없습니다.","점화플러그는 그을음이 끼어 수명이 오히려 줄어듭니다.","오일 압력과는 관계가 없습니다."],"d":"점화코일이 불량하면 불꽃이 약해 혼합기가 다 타지 못합니다. 타지 않은 연료가 그대로 나와 HC와 CO 같은 유해 배기가스가 늘어납니다."}},{"q":"이륜자동차의 후미등과 번호판등이 함께 작동하지 않을 때, 가장 먼저 점검해야 할 부분은?","o":["개별 전구의 단선 점검","관련 퓨즈 단선 또는 공통 배선 문제 점검","브레이크 스위치 고장 여부 점검","헤드라이트 전구 단선 점검"],"a":1,"e":{"w":["전구 두 개가 동시에 끊어질 가능성은 낮습니다.","브레이크 스위치는 제동등 회로입니다.","헤드라이트 전구는 다른 회로입니다."],"d":"후미등과 번호판등은 같은 회로에서 전기를 받습니다. 둘이 함께 켜지지 않으면 공통으로 쓰는 퓨즈나 배선부터 확인합니다."}},{"q":"반도체를 바르게 설명한 것은?","o":["역 내압이 높다.","내열성이 좋다(200℃ 이상).","예열 시간을 요한다.","내부 전력 손실이 적다."],"a":3,"e":{"w":["반도체는 역방향으로 걸 수 있는 전압(역 내압)이 낮습니다.","반도체는 열에 약합니다.","반도체는 예열 시간이 필요 없습니다."],"d":"반도체는 작고 가벼우며, 예열 없이 바로 작동하고, 내부 전력 손실이 적습니다. 반면 열에 약하고 역 내압이 낮은 것이 단점입니다."}},{"q":"게르마늄(Ge) 또는 실리콘(Si)에 어떤 불순물을 섞어야 P형 반도체가 되는가?","o":["인","비소","인듐","안티몬"],"a":2,"e":{"w":["인은 5가 원소라 N형 반도체가 됩니다.","비소는 5가 원소라 N형 반도체가 됩니다.","안티몬은 5가 원소라 N형 반도체가 됩니다."],"d":"실리콘에 3가 원소(인듐, 붕소, 알루미늄, 갈륨)를 섞으면 전자가 모자란 자리(정공)가 생겨 P형 반도체가 됩니다. 5가 원소를 섞으면 N형이 됩니다."}},{"q":"젖은 노면에서 이륜자동차를 안전하게 운행하기 위한 방법으로 옳지 않은 것은?","o":["타이어 트레드가 충분히 남아 있어야 한다.","타이어 공기압을 평소보다 높게 유지한다.","급출발, 급가속, 급제동을 삼간다.","감속 운행하며 안전거리를 확보한다."],"a":1,"e":{"w":["트레드가 충분해야 물을 밀어낼 수 있습니다. 옳은 방법입니다.","급한 조작을 하면 미끄러집니다. 옳은 방법입니다.","속도를 줄이고 안전거리를 확보합니다. 옳은 방법입니다."],"d":"공기압을 높이면 타이어가 노면에 닿는 면적이 줄어 젖은 길에서 더 잘 미끄러집니다. 공기압은 규정값을 유지해야 합니다."}},{"q":"이륜자동차 리어 스윙암의 피벗 부분에 유격이 발생했을 때, 주행 중 나타날 수 있는 현상은?","o":["핸들 조작이 부드러워진다.","배터리 충전이 안 된다.","프레임이 출렁거린다.","직진 안정성이 저하한다."],"a":3,"e":{"w":["핸들 조작이 부드러워지지 않습니다.","배터리 충전과는 관계가 없습니다.","프레임이 출렁거리는 것이 아니라 뒷바퀴가 좌우로 흔들립니다."],"d":"스윙암 피벗에 유격이 있으면 뒷바퀴가 좌우로 흔들립니다. 뒷바퀴가 똑바로 따라오지 못해 직진 안정성이 떨어집니다."}},{"q":"이륜자동차 클러치 시스템에서 클러치 스프링의 역할은?","o":["클러치 디스크를 서로 밀착시켜 동력을 전달하게 한다.","클러치 레버의 장력을 조절한다.","클러치의 수명을 늘려준다.","클러치 케이블의 길이를 조절한다."],"a":0,"e":{"w":["레버의 장력을 조절하는 부품이 아닙니다.","수명을 늘리는 것이 역할이 아닙니다.","케이블의 길이는 조정 나사로 조절합니다."],"d":"클러치 스프링은 압력판을 밀어 마찰판과 클러치판을 서로 눌러 붙입니다. 이 힘으로 엔진의 동력이 변속기로 전달됩니다."}},{"q":"이륜자동차 수동변속기에서 1단 기어가 다른 고단 기어보다 더 큰 구동력을 낼 수 있는 이유는?","o":["엔진 회전수가 더 높기 때문에","기어비가 가장 크기 때문에","클러치 마찰력이 가장 강하기 때문에","기어비가 가장 작기 때문에"],"a":1,"e":{"w":["엔진 회전수가 높아서가 아닙니다.","클러치의 마찰력과는 관계가 없습니다.","기어비가 가장 작은 것은 최고단입니다."],"d":"1단은 기어비(감속비)가 가장 큽니다. 엔진이 여러 바퀴 돌 때 바퀴는 조금만 돌므로 속도는 느리지만 바퀴를 돌리는 힘(구동력)은 가장 큽니다."}},{"q":"이륜자동차 체인 장력이 너무 팽팽할 때 발생할 수 있는 문제점이 아닌 것은?","o":["체인의 마모 가속화","스프로킷 마모 가속화","엔진 크랭크축 마모 가속화","변속기 및 베어링 마모 가속화"],"a":2,"e":{"w":["팽팽한 체인은 핀과 부싱에 큰 힘이 걸려 빨리 닳습니다.","스프로킷 이빨에도 큰 힘이 걸려 빨리 닳습니다.","체인이 당기는 힘이 변속기 출력축과 뒷바퀴 베어링에 걸려 마모가 빨라집니다."],"d":"체인이 당기는 힘은 변속기 출력축과 뒷바퀴 쪽에 걸립니다. 엔진 크랭크축은 체인과 직접 연결되어 있지 않으므로 체인 장력의 영향을 받지 않습니다."}},{"q":"이륜자동차 스프로킷의 이빨이 마모되어 뾰족해진 상태에서 계속 주행할 경우, 발생할 수 있는 가장 큰 문제는?","o":["체인이 이탈된다.","체인 소음이 줄어든다.","체인 윤활이 필요 없어진다.","변속기 기어비가 높아진다."],"a":0,"e":{"w":["닳은 스프로킷은 소음이 오히려 커집니다.","윤활은 계속 필요합니다.","이빨이 닳아도 잇수는 그대로라 기어비는 변하지 않습니다."],"d":"이빨이 뾰족해지면 체인을 제대로 잡아 주지 못해 체인이 이빨을 타고 넘거나 벗겨집니다. 주행 중 체인이 빠지면 뒷바퀴가 잠길 수 있어 가장 위험합니다."}},{"q":"이륜자동차 DCT의 가장 큰 특징은?","o":["두 개의 독립적인 클러치를 사용한다.","클러치 조작과 변속이 모두 수동이다.","오직 스쿠터에만 사용된다.","엔진 회전수에 따라 자동으로 클러치가 연결된다."],"a":0,"e":{"w":["DCT는 클러치 조작과 변속이 자동입니다.","스쿠터에만 쓰는 것이 아닙니다.","회전수에 따라 자동으로 이어지는 것은 원심 클러치입니다."],"d":"DCT(듀얼 클러치 변속기)는 서로 독립된 두 개의 클러치를 씁니다."}},{"q":"이륜자동차 DCT가 변속 시 동력 손실이 적고 빠른 변속이 가능한 이유는?","o":["동력 단절 없이 기어가 변경되기 때문","체인을 사용하기 때문","습식 DCT에는 오일을 사용하지 않기 때문","클러치 레버가 없기 때문"],"a":0,"e":{"w":["체인과는 관계가 없습니다.","습식 DCT는 오일을 씁니다.","클러치 레버가 없는 것이 이유가 아닙니다."],"d":"DCT는 한쪽 클러치가 끊어질 때 다른 쪽 클러치가 이어지므로 동력이 끊기지 않고 빠르게 변속됩니다."}},{"q":"자동변속기에 사용되고 있는 오일(ATF)의 기능이 아닌 것은?","o":["충격을 흡수한다.","동력을 발생시킨다.","작동 유압을 전달한다.","윤활 및 냉각작용을 한다."],"a":1,"e":{"w":["충격을 흡수하는 것은 오일의 기능입니다.","작동 유압을 전달하는 것은 오일의 기능입니다.","윤활과 냉각은 오일의 기능입니다."],"d":"자동변속기 오일은 동력을 전달할 뿐, 동력을 발생시키지는 않습니다. ①③④는 오일의 기능입니다."}},{"q":"이륜자동차에 사용하는 에어백 형태가 아닌 것은?","o":["입는 에어백 재킷/조끼","바지형 에어백","헬멧 연동형","구두형 에어백"],"a":3,"e":{"w":["재킷이나 조끼처럼 입는 에어백이 있습니다.","바지형 에어백도 있습니다.","헬멧과 연동되는 형태도 있습니다."],"d":"라이더용 에어백은 몸통, 목, 엉덩이처럼 크게 다치기 쉬운 부위를 보호하는 형태로 만듭니다. 구두형 에어백은 없습니다."}},{"q":"ABS 컨트롤 유닛(제어모듈)에 대한 설명으로 틀린 것은?","o":["휠의 감속과 가속을 계산한다.","각 바퀴의 속도를 비교, 분석한다.","미끄러짐 비율을 계산하여 ABS 작동 여부를 결정한다.","컨트롤 유닛이 작동하지 않으면 브레이크가 전혀 작동하지 않는다."],"a":3,"e":{"w":["휠 속도 신호로 바퀴의 감속과 가속을 계산합니다. 옳은 설명입니다.","각 바퀴의 속도를 비교하고 분석합니다. 옳은 설명입니다.","미끄러짐 비율(슬립률)을 계산해 ABS를 작동할지 결정합니다. 옳은 설명입니다."],"d":"ABS가 고장 나도 일반 브레이크는 그대로 작동합니다. ABS 기능만 멈추고 경고등이 켜집니다. 브레이크가 전혀 작동하지 않는다는 ④가 틀렸습니다."}},{"q":"휠 스피드 센서 파형 점검 시 가장 유용한 장비는?","o":["회전계","멀티테스터기","오실로스코프","전류계"],"a":2,"e":{"w":["회전계는 회전수만 알려 줍니다.","멀티테스터는 전압이나 저항 값만 보여 주고 파형은 볼 수 없습니다.","전류계는 전류의 크기만 알려 줍니다."],"d":"파형은 시간에 따라 전압이 변하는 모양입니다. 이것을 화면에 그려 보여 주는 장비가 오실로스코프입니다. 휠 스피드 센서의 신호가 고른지, 빠진 곳이 없는지 확인할 수 있습니다."}},{"q":"이륜자동차 TPMS 센서를 교체한 후, 새로운 센서가 시스템에 인식되지 않아 경고등이 계속 켜져 있다면, 가장 먼저 시도해야 할 조치는?","o":["진단 장비를 이용하여 센서 ID를 ECU에 등록하거나 재학습시킨다.","TPMS 모듈을 교환한다.","이륜자동차 배터리 (-)단자를 탈거했다가 다시 조립한다.","엔진 ECU에서 기억소거를 시킨다."],"a":0,"e":{"w":["모듈 교환은 등록을 해 본 뒤에 판단할 일입니다.","배터리 단자를 뗐다 붙여도 새 센서 ID가 등록되지는 않습니다.","엔진 ECU의 기억을 지우는 것은 TPMS와 관계가 없습니다."],"d":"TPMS 센서마다 고유 번호(ID)가 있습니다. 센서를 바꾸면 새 ID를 수신 장치(ECU)에 등록하거나 재학습시켜야 시스템이 새 센서를 알아봅니다."}},{"q":"이륜자동차 프레임의 성능에 결정적인 영향을 미치는 요소가 아닌 것은?","o":["강도","내구성","제동력","핸들링"],"a":2,"e":{"w":["강도는 하중을 견디는 힘으로 프레임 성능을 좌우합니다.","내구성은 오래 버티는 성질로 프레임 성능을 좌우합니다.","프레임의 강성이 핸들링을 좌우합니다."],"d":"프레임의 성능은 강도, 내구성, 핸들링(강성과 무게)으로 결정됩니다. 제동력은 제동장치의 성능이지 프레임의 요소가 아닙니다."}},{"q":"이륜자동차 프레임에서 스티어링 헤드부분이 하는 역할은?","o":["앞바퀴의 조향이 이루어지도록 하는 중심축이다.","발전기가 장착되는 곳이다.","브레이크가 연결되는 곳이다.","연료탱크가 놓이는 곳이다."],"a":0,"e":{"w":["발전기는 엔진에 장착됩니다.","브레이크가 연결되는 곳이 아닙니다.","연료탱크는 프레임 윗부분에 놓입니다."],"d":"스티어링 헤드(헤드 파이프)는 프레임 맨 앞에 있는 관입니다. 여기에 스티어링 스템이 끼워져 돌면서 앞바퀴의 방향을 바꾸므로, 조향의 중심축이 됩니다."}},{"q":"오토바이 종류 중 스쿠터에 주로 적용되는 프레임은?","o":["다아몬드 프레임","백본 프레임","격자 프레임","크래임형 프레임"],"a":1,"e":{"w":["다이아몬드 프레임은 엔진을 강도 부재로 쓰는 방식으로 일반 바이크에 씁니다.","격자 프레임은 스포츠 바이크에 주로 씁니다.","크래들형은 엔진을 감싸 받치는 방식으로 일반 바이크에 씁니다."],"d":"스쿠터는 발판 공간이 필요해서, 굵은 관 하나가 등뼈처럼 지나가는 백본 프레임을 주로 씁니다."}},{"q":"일반적인 강철 프레임 패널의 장점은?","o":["매우 가볍다.","전혀 녹이 슬지 않는다.","염분이 있는 환경에서 더 강하다.","뛰어난 내구성, 부드러운 승차감, 그리고 수리가 용이하다."],"a":3,"e":{"w":["강철은 알루미늄보다 무겁습니다.","강철은 녹이 습니다.","염분이 있으면 더 빨리 녹이 습니다."],"d":"강철 프레임은 튼튼하고 오래가며, 적당히 휘는 성질이 있어 승차감이 부드럽습니다. 용접하기 쉬워 수리도 쉽습니다."}},{"q":"이륜자동차 프레임 정비 시, 용접 작업을 해야 할 경우 가장 중요하게 고려해야 할 사항이 아닌 것은?","o":["작업 시간","화재 및 폭발 예방","감전 예방","환기 및 유해가스 관리"],"a":0,"e":{"w":["용접 불꽃 때문에 화재와 폭발을 꼭 예방해야 합니다.","전기를 쓰므로 감전을 예방해야 합니다.","용접할 때 나오는 유해 가스 때문에 환기가 필요합니다."],"d":"용접 작업에서는 화재·폭발, 감전, 유해 가스에 대한 안전이 가장 중요합니다. 작업 시간은 안전보다 먼저 고려할 사항이 아닙니다."}},{"q":"전기 이륜자동차의 충전 중 발생하는 열을 관리하는 것이 중요한 이유는?","o":["충전 효율을 높이기 위해","충전 시간을 단축하기 위해","배터리 수명 단축 및 안전 문제를 예방을 위해","충전기 고장을 방지하기 위해"],"a":2,"e":{"w":["충전 효율이 주된 이유는 아닙니다.","충전 시간이 주된 이유는 아닙니다.","충전기 고장이 주된 이유는 아닙니다."],"d":"배터리는 열에 약합니다. 충전 중에 온도가 너무 오르면 수명이 줄고, 심하면 열폭주로 불이 날 수 있습니다. 그래서 열 관리가 중요합니다."}},{"q":"전기 이륜자동차의 주행 거리에 큰 영향을 미치는 요인은?","o":["OBC 용량","BMS의 용량","모터의 용량","배터리의 용량"],"a":3,"e":{"w":["OBC는 충전기라 주행 거리와 관계가 없습니다.","BMS는 배터리를 관리하는 장치입니다.","모터의 용량은 힘을 결정합니다."],"d":"배터리 용량이 클수록 저장할 수 있는 전기가 많아 더 멀리 갈 수 있습니다. 내연기관의 연료탱크 크기와 같습니다."}},{"q":"전기 이륜자동차의 고전압 배터리 팩을 들어 올리거나 이동할 때 가장 중요한 안전 수칙은?","o":["배터리 팩을 바닥에 끌어서 이동한다.","전용 장비를 이용해 배터리 팩의 낙하 및 충격을 방지하며 이동한다.","혼자 배터리 팩을 들어서 이동한다.","배터리 팩은 무거우므로 지렛대를 이용하여 굴리면서 이동한다."],"a":1,"e":{"w":["끌면 케이스가 손상됩니다.","배터리 팩은 무거워 혼자 들면 떨어뜨리거나 다칩니다.","굴리면 충격으로 내부가 손상됩니다."],"d":"배터리 팩은 무겁고 충격에 약합니다. 떨어뜨리면 내부가 합선되어 불이 날 수 있습니다. 전용 장비로 떨어지지 않게 받치고 충격 없이 옮깁니다."}},{"q":"전기 이륜자동차 세차 시, 고압 세척기를 사용할 때 특히 주의해야 할 부품은?","o":["타이어","시트","모터 및 배터리 팩","손잡이"],"a":2,"e":{"w":["타이어는 물에 닿아도 됩니다.","시트는 물에 닿아도 됩니다.","손잡이는 물에 닿아도 됩니다."],"d":"고압의 물이 모터와 배터리 팩의 틈이나 커넥터로 들어가면 누전과 고장이 일어납니다. 이 부분에는 고압수를 직접 쏘지 않습니다."}},{"q":"전기 모터가 고장 났을 때, 나타날 수 있는 가장 직접적인 증상은?","o":["모터가 회전하지 않거나 비정상적인 소음 및 진동이 발생한다.","배터리 충전이 너무 빨라진다.","헤드라이트가 어두워진다.","배터리 충전이 안 된다."],"a":0,"e":{"w":["충전 속도와는 관계가 없습니다.","헤드라이트 밝기와는 관계가 없습니다.","충전은 충전 시스템의 문제입니다."],"d":"모터가 고장 나면 돌지 않거나, 돌더라도 평소에 없던 소리와 진동이 납니다."}},{"q":"전기 이륜자동차에서 모터와 바퀴를 연결하여 모터의 회전력을 바퀴에 전달하는 장치는?","o":["조향 시스템","브레이크 시스템","현가 시스템","구동 시스템"],"a":3,"e":{"w":["조향 시스템은 방향을 바꾸는 장치입니다.","브레이크 시스템은 멈추는 장치입니다.","현가 시스템은 충격을 흡수하는 장치입니다."],"d":"모터의 회전력을 바퀴까지 전달하는 벨트, 체인, 기어 같은 장치를 구동 시스템이라고 합니다."}},{"q":"BLDC 모터에서 회전자(Rotor)는 주로 어떤 방식으로 구성되어 있는가?","o":["코일이 감긴 전자석","브러시가 연결된 부분","단순한 철심","영구자석"],"a":3,"e":{"w":["코일이 감긴 전자석은 고정자(스테이터)입니다.","BLDC 모터에는 브러시가 없습니다.","단순한 철심만으로는 회전력이 생기지 않습니다."],"d":"BLDC 모터는 회전자에 영구자석을 붙이고, 고정자에 코일을 감습니다. 고정자 코일의 전류를 바꿔 가며 회전자의 자석을 끌어당겨 돌립니다."}},{"q":"BLDC 모터의 주요 장점 중 하나는?","o":["구조가 매우 복잡하여 수리가 쉽다.","생산 비용이 매우 저렴하다.","브러시 마모가 없어 수명이 길고, 소음이 적으며 효율이 높다.","저속에서만 작동할 수 있다."],"a":2,"e":{"w":["구조가 복잡하면 수리가 어렵습니다.","영구자석과 제어기가 필요해 값이 비싼 편입니다.","저속부터 고속까지 넓은 범위에서 작동합니다."],"d":"BLDC 모터는 브러시가 없습니다. 닳는 부품이 없어 수명이 길고, 마찰이 없어 조용하며 효율이 높습니다."}},{"q":"이륜자동차 정기 검사의 관능검사 항목 중 등록번호판에 대해 확인하는 것은?","o":["번호판의 색상","번호판의 무게","번호판의 재질","번호판의 부착 상태, 훼손 여부"],"a":3,"e":{"w":["번호판의 색상을 따로 검사하지 않습니다.","번호판의 무게는 검사 항목이 아닙니다.","번호판의 재질은 검사 항목이 아닙니다."],"d":"관능검사에서는 등록번호판이 제자리에 단단히 붙어 있는지, 훼손되거나 가려져 알아보기 어렵지 않은지를 확인합니다."}},{"q":"이륜자동차 검사 불합격 시, 운전자가 취해야 할 조치는?","o":["다른 검사소를 찾아 다시 검사한다.","이륜자동차를 계속 운행한다.","재검사를 신청하여 합격 판정을 받아야 한다.","불합격 받은 검사소에서 합격될 때까지 계속 검사를 받는다."],"a":2,"e":{"w":["검사소를 바꾼다고 해결되지 않습니다.","불합격 상태로 계속 운행하면 안 됩니다.","수리하지 않고 계속 검사만 받는다고 합격되지 않습니다."],"d":"불합격한 항목을 수리한 뒤 정해진 기간 안에 재검사를 신청해 합격 판정을 받아야 합니다."}},{"q":"재검사 시, 불합격되었던 항목 외에 다른 항목도 다시 검사하는 경우가 있는가?","o":["재검사 시, 불합격 항목만 검사하면 된다.","재검사 접수 시 불합격 항목 위주로 검사하나, 필요에 따라 다른 안전 관련 항목도 재확인할 수 있다.","매번 모든 항목을 처음부터 다시 검사한다.","오직 경음기 소음 항목만 재검사한다."],"a":1,"e":{"w":["불합격 항목만 본다고 단정할 수 없습니다.","매번 모든 항목을 처음부터 다시 검사하지는 않습니다.","경음기 소음만 재검사하는 것이 아닙니다."],"d":"재검사는 불합격했던 항목을 중심으로 합니다. 다만 안전과 관련된 다른 항목도 필요하면 다시 확인할 수 있습니다."}},{"q":"이륜자동차 시트를 구조 변경할 때, 승인이 필요한 일반적인 경우는?","o":["시트커버의 색상을 변경한 경우","시트에 쿠션을 변경한 경우","이륜자동차의 제원에 영향을 주거나 승차정원이 달라지는 경우","시트의 재질을 변경한 경우"],"a":2,"e":{"w":["시트커버의 색상은 승인 대상이 아닙니다.","쿠션을 바꾸는 것은 승인 대상이 아닙니다.","시트의 재질은 승인 대상이 아닙니다."],"d":"시트를 바꿔서 차의 길이·너비·높이 같은 제원이 달라지거나 탈 수 있는 인원(승차정원)이 달라지면 구조변경 승인을 받아야 합니다."}},{"q":"이륜자동차 제동력 검사 시, 시험 노면의 조건으로 옳은 것은?","o":["0.9 이상의 최대제동계수를 가진 깨끗하고 건조한 평탄한 노면","진흙으로 된 노면","모래가 많은 노면","자갈이 많은 비포장도로"],"a":0,"e":{"w":["진흙 노면은 미끄러워 제동력을 정확히 잴 수 없습니다.","모래가 많은 노면은 미끄럽습니다.","자갈이 많은 비포장도로는 시험 노면으로 쓸 수 없습니다."],"d":"제동능력 시험은 고마찰로에서 합니다. 고마찰로는 최대제동계수가 0.9 이상이고 깨끗하고 건조하며 평탄한 노면입니다."}},{"q":"이륜자동차 배기 소음에 영향을 미치는 요인이 아닌 것은?","o":["소음기의 구조 및 상태","엔진의 배기량 및 회전수","타이어의 종류 및 공기압","촉매변환장치의 유무 및 상태"],"a":2,"e":{"w":["소음기의 구조와 상태는 배기 소음에 영향을 줍니다.","배기량과 회전수가 클수록 배기 소음이 커집니다.","촉매변환장치도 배기 통로에 있어 배기 소음에 영향을 줍니다."],"d":"배기 소음은 엔진에서 나온 배기가스가 배기관을 지나며 내는 소리입니다. 타이어의 종류와 공기압은 배기 소음과 관계가 없습니다."}},{"q":"이륜자동차 정비 중 화학 약품 사용 시, 피부에 접촉을 하였을 때 가장 먼저 해야 할 조치는?","o":["소독약을 바르고 작업을 한다.","수건으로 닦아내고 작업을 한다.","약품을 닦아내지 않고 그냥 작업을 한다.","즉시 흐르는 물에 오염 부위를 충분히 씻어 낸다."],"a":3,"e":{"w":["소독약을 바르기 전에 씻어 내는 것이 먼저입니다.","수건으로 닦으면 약품이 남습니다.","그대로 두면 화상을 입습니다."],"d":"화학 약품이 피부에 묻으면 즉시 흐르는 물로 충분히 씻어 내야 합니다. 약품을 빨리 씻어 낼수록 피부 손상이 줄어듭니다."}},{"q":"화학 약품(세척제, 브레이크액 등) 사용 시 안전 수칙으로 틀린 것은?","o":["제품 안전 데이터 시트(MSDS)를 확인한다.","약품상태를 손으로 만져본다.","환기가 잘 되는 곳에서 사용한다.","보호장갑, 보호안경 등 개인 보호장비를 착용한다."],"a":1,"e":{"w":["MSDS에는 약품의 위험성과 응급조치가 적혀 있습니다. 옳은 수칙입니다.","환기가 잘되는 곳에서 사용합니다. 옳은 수칙입니다.","보호장갑과 보호안경을 착용합니다. 옳은 수칙입니다."],"d":"화학 약품을 맨손으로 만지면 화상을 입거나 피부로 흡수됩니다. 손으로 만져 보는 것은 절대 하면 안 됩니다."}},{"q":"2행정 사이클 엔진에 비해 4행정 사이클 엔진이 가지는 특징에 대한 설명으로 옳지 않은 것은?","o":["압축비가 높다.","피스톤의 소손이 빠르다.","체적효율이 높다.","충격이나 소음이 크다."],"a":1,"e":{"w":["4행정 엔진은 압축비를 높게 할 수 있습니다. 옳은 설명입니다.","4행정 엔진은 흡입 행정이 따로 있어 체적효율이 높습니다. 옳은 설명입니다.","4행정 엔진은 밸브 기구가 있어 충격과 기계 소음이 큽니다. 옳은 설명입니다."],"d":"피스톤의 소손이 빠른 것은 2행정 엔진의 특징입니다. 2행정 엔진은 크랭크축이 한 바퀴 돌 때마다 폭발해 피스톤이 열을 더 자주 받습니다."}},{"q":"크랭크축 엔드 플레이 간극이 크면 발생할 수 있는 내용이 아닌 것은?","o":["커넥팅로드에 휨 하중 발생","밸브간극의 증대","피스톤 측압 증대","클러치 작동 시 진동 발생"],"a":1,"e":{"w":["크랭크축이 앞뒤로 움직여 커넥팅로드에 휨 하중이 걸립니다.","커넥팅로드가 기울어져 피스톤 측압이 커집니다.","클러치를 조작할 때 크랭크축이 밀려 진동이 생깁니다."],"d":"엔드 플레이는 크랭크축이 축 방향으로 움직이는 유격입니다. 유격이 크면 커넥팅로드, 피스톤, 클러치에 영향을 줍니다. 밸브간극은 밸브 기구의 문제라 관계가 없습니다."}},{"q":"이륜자동차 엔진에서 크랭크축의 휨을 측정 시 가장 적합한 것은?","o":["스프링저울과 V블록","버니어캘리퍼스와 곧은 자","다이얼 게이지와 V블록","보어게이지와 외측 마이크로미터"],"a":2,"e":{"w":["스프링저울은 장력을 재는 도구입니다.","버니어캘리퍼스와 곧은 자로는 휨을 정밀하게 잴 수 없습니다.","보어게이지와 마이크로미터는 지름을 재는 도구입니다."],"d":"크랭크축을 V블록 위에 올려놓고 다이얼 게이지를 댄 채 천천히 한 바퀴 돌립니다. 바늘이 움직인 양의 절반이 휨 값입니다."}},{"q":"실린더 헤드에 장착되는 밸브 시트의 주된 역할은?","o":["연소실의 기밀을 유지한다.","밸브의 무게를 줄인다.","밸브의 마모를 줄인다.","밸브의 움직임을 안내한다."],"a":0,"e":{"w":["무게와는 관계가 없습니다.","마모를 줄이는 것이 주된 역할이 아닙니다.","밸브의 움직임을 안내하는 것은 밸브 가이드입니다."],"d":"밸브 시트는 밸브가 닫힐 때 밸브 면과 맞닿는 자리입니다. 둘이 밀착해 연소실의 기밀을 유지하고, 밸브의 열을 실린더 헤드로 전달합니다."}},{"q":"가솔린 연료의 내폭성을 표시하는 것은?","o":["세탄가","점성","옥탄가","유성"],"a":2,"e":{"w":["세탄가는 디젤 연료의 착화성을 나타냅니다.","점성은 끈끈한 정도입니다.","유성은 오일이 금속 표면에 달라붙는 성질입니다."],"d":"내폭성은 노킹을 일으키지 않는 성질입니다. 가솔린의 내폭성은 옥탄가로 나타냅니다. 옥탄가가 높을수록 노킹이 잘 일어나지 않습니다."}},{"q":"이륜자동차에서 기계식 연료장치에서 연료와 공기를 적절히 혼합하여 엔진으로 공급하는 핵심 부품은?","o":["연료 펌프","연료 필터","기화기(카뷰레터)","연료탱크"],"a":2,"e":{"w":["연료 펌프는 연료를 보내는 부품입니다.","연료 필터는 이물질을 거르는 부품입니다.","연료탱크는 연료를 저장하는 부품입니다."],"d":"기화기(카뷰레터)는 흡입되는 공기의 흐름으로 연료를 빨아올려 안개처럼 만들고, 공기와 알맞은 비율로 섞어 엔진으로 보냅니다."}},{"q":"이륜자동차 연료 라인에 설치되어 연료 내 이물질을 걸러주는 부품은?","o":["연료 펌프","연료 필터","기화기","인젝터"],"a":1,"e":{"w":["연료 펌프는 연료를 압송합니다.","기화기는 연료와 공기를 섞습니다.","인젝터는 연료를 분사합니다."],"d":"연료 필터는 연료 속의 먼지와 녹 같은 이물질을 걸러 기화기나 인젝터가 막히지 않게 합니다."}},{"q":"엔진에서 머플러의 역할은?","o":["엔진 오일을 저장한다.","엔진에 공기를 공급한다.","배기 소음을 줄인다.","연료를 저장한다."],"a":2,"e":{"w":["엔진 오일은 오일 팬에 저장합니다.","공기는 흡기장치가 공급합니다.","연료는 연료탱크에 저장합니다."],"d":"머플러(소음기)는 배기가스의 압력과 온도를 낮추어 배기 소음을 줄입니다."}},{"q":"라디에이터가 열을 효과적으로 발산하기 위해 내부를 구성하는 주요 요소는?","o":["얇은 냉각 튜브와 수많은 방열 핀","두꺼운 단일 파이프","고밀도 강판","회전하는 팬 블레이드만"],"a":0,"e":{"w":["두꺼운 파이프 하나로는 공기와 닿는 면적이 좁습니다.","강판은 열을 내보내는 구조가 아닙니다.","팬은 바람을 보낼 뿐 라디에이터 내부 구성 요소가 아닙니다."],"d":"라디에이터는 냉각수가 흐르는 얇은 튜브 여러 개와, 튜브 사이에 붙인 수많은 방열 핀으로 되어 있습니다. 공기와 닿는 면적을 넓혀 열을 빨리 내보냅니다."}},{"q":"엔진 과열 시 나타나는 현상으로 맞는 것은?","o":["연료의 응결로 연소가 불량해진다.","작동 부분의 고착 및 변형이 발생하며 내구성이 저하된다.","연료가 쉽게 기화하지 못하고 연비가 나빠진다.","엔진 오일의 점도가 높아져 시동할 때 회전 저항이 커진다."],"a":1,"e":{"w":["연료가 응결되는 것은 엔진이 과냉일 때의 현상입니다.","연료가 기화하지 못하는 것은 과냉일 때의 현상입니다.","오일 점도가 높아지는 것은 과냉일 때의 현상입니다."],"d":"엔진이 과열되면 금속이 지나치게 팽창하고 오일 막이 끊어집니다. 피스톤과 실린더가 눌어붙고(고착) 부품이 변형되어 내구성이 떨어집니다."}},{"q":"이륜자동차 전자제어 엔진에서 크랭크 포지션 센서와 캠 포지션 센서의 역할은?","o":["냉각수 온도를 측정한다.","흡기온도를 측정한다.","크랭크축과 캠축의 회전 속도와 위치를 감지한다.","배기가스 온도를 측정한다."],"a":2,"e":{"w":["냉각수 온도는 수온 센서가 측정합니다.","흡기온도는 흡기온도 센서가 측정합니다.","배기가스 온도는 이 센서의 역할이 아닙니다."],"d":"크랭크 포지션 센서는 크랭크축의 회전 속도와 위치를, 캠 포지션 센서는 캠축의 위치를 감지합니다. ECU는 이 신호로 점화 시기와 분사 시기를 정합니다."}},{"q":"전기 이륜자동차와 내연기관 이륜자동차 모두에 공통적으로 필요한 충전 시스템이 구성 요소는?","o":["스파크 플러그","시동 전동기","배터리","인버터"],"a":2,"e":{"w":["스파크 플러그는 내연기관에만 있습니다.","시동 전동기는 내연기관에만 있습니다.","인버터는 전기 이륜자동차에만 있습니다."],"d":"내연기관 이륜자동차도, 전기 이륜자동차도 충전한 전기를 저장할 배터리가 반드시 필요합니다."}},{"q":"내연기관 이륜자동차의 시동 모터가 ‘딸깍’ 소리만 나고 회전하지 않을 때, 가장 먼저 의심할 수 있는 것은?","o":["배터리 단자 접촉 불량","연료 부족","스파크 플러그","레귤레이터"],"a":0,"e":{"w":["연료가 부족해도 시동 모터는 돕니다.","스파크 플러그가 불량해도 시동 모터는 돕니다.","레귤레이터는 충전장치입니다."],"d":"'딸깍' 소리는 시동 릴레이가 붙는 소리입니다. 릴레이는 작동하는데 모터가 돌지 않으면 큰 전류가 흐르지 못하는 것입니다. 배터리 단자의 접촉 불량이나 배터리 방전을 먼저 의심합니다."}},{"q":"다음 중 바이크 배터리에 대해 잘못 설명하고 있는 것은?","o":["전해액의 비중이 낮아지면, 자기방전은 커진다.","전해액의 온도가 낮으면, 비중은 커진다.","MF 배터리는 사용하는 기간 동안 전해액을 보충할 필요가 없다.","배터리는 사용하지 않고 방치하면 화학작용에 의해 자기방전을 일으킨다."],"a":0,"e":{"w":["전해액은 온도가 낮으면 수축해 비중이 커집니다. 옳은 설명입니다.","MF 배터리는 전해액을 보충할 필요가 없습니다. 옳은 설명입니다.","배터리는 쓰지 않고 두어도 스스로 방전됩니다. 옳은 설명입니다."],"d":"자기방전은 전해액의 비중이 높을수록, 온도가 높을수록 커집니다. 비중이 낮아지면 자기방전이 커진다는 ①이 잘못된 설명입니다."}},{"q":"점화코일이 전압을 승압하는데 사용하는 물리적 원리는 무엇인가?","o":["열전도","파스칼의 법칙","뉴턴의 법칙","전자기 유도"],"a":3,"e":{"w":["열전도는 열이 전달되는 현상입니다.","파스칼의 법칙은 유압에 관한 법칙입니다.","뉴턴의 법칙은 힘과 운동에 관한 법칙입니다."],"d":"점화코일은 1차 코일의 전류를 갑자기 끊어 자기장을 변화시킵니다. 이때 감은 수가 많은 2차 코일에 높은 전압이 유도됩니다. 이 원리가 전자기 유도입니다."}},{"q":"이륜자동차의 혼이 작동하지 않을 때, 점검해야 할 부품은?","o":["헤드라이트 퓨즈","방향지시등 릴레이","혼 스위치, 혼 자체 또는 관련 퓨즈","미등 전구"],"a":2,"e":{"w":["헤드라이트 퓨즈는 혼 회로가 아닙니다.","방향지시등 릴레이는 혼 회로가 아닙니다.","미등 전구는 혼 회로가 아닙니다."],"d":"혼이 울리지 않으면 혼 회로를 따라 점검합니다. 혼 스위치, 혼 자체, 관련 퓨즈를 확인합니다."}},{"q":"전압이 어떤 값에 도달하면 역방향으로 전류가 흐르는 다이오드는?","o":["발광 다이오드","제너 다이오드","실리콘 다이오드","포토 다이오드"],"a":1,"e":{"w":["발광 다이오드는 전류가 흐르면 빛을 냅니다.","실리콘 다이오드는 한쪽 방향으로만 전류를 흘리는 일반 다이오드입니다.","포토 다이오드는 빛을 받으면 전류가 흐릅니다."],"d":"제너 다이오드는 역방향 전압이 일정한 값(제너 전압)에 이르면 역방향으로 전류가 흐릅니다. 전압을 일정하게 유지하는 회로에 씁니다."}},{"q":"트랜지스터(TR)의 설명으로 틀린 것은?","o":["증폭 작용을 한다.","스위칭 작용을 한다.","아날로그 신호를 디지털 신호로 변환하여 ECU로 보낸다.","이미터, 베이스, 컬렉터의 리드로 구성되어 있다."],"a":2,"e":{"w":["트랜지스터는 작은 전류로 큰 전류를 제어하는 증폭 작용을 합니다. 옳은 설명입니다.","트랜지스터는 회로를 켜고 끄는 스위칭 작용을 합니다. 옳은 설명입니다.","트랜지스터에는 이미터, 베이스, 컬렉터 세 단자가 있습니다. 옳은 설명입니다."],"d":"아날로그 신호를 디지털 신호로 바꾸는 것은 A/D 컨버터의 역할입니다. 트랜지스터의 작용이 아니므로 ③이 틀렸습니다."}},{"q":"튜브리스타이어에 대한 설명으로 거리가 먼 것은?","o":["림 프로텍터를 사용하여 림을 보호한다.","타이어 교환 시에는 반드시 림 밸브를 교환한다.","튜브리스타이어 코드 표기는 트레드에 표기되어 있다.","이륜자동차용 타이어 레버를 사용하여 작업한다."],"a":2,"e":{"w":["림 프로텍터로 림을 보호하며 작업합니다. 옳은 설명입니다.","타이어를 교환할 때 림 밸브도 함께 교환합니다. 옳은 설명입니다.","이륜자동차용 타이어 레버를 써서 작업합니다. 옳은 설명입니다."],"d":"타이어의 규격과 튜브리스(TUBELESS) 표기는 트레드가 아니라 옆면(사이드월)에 적혀 있습니다."}},{"q":"이륜자동차 뒤 서스펜션(리어 쇼크)이 장착되는 방식 중, 하나의 쇽업쇼버만 사용하는 방식은?","o":["트윈 쇼크(Twin Shock)","에어 쇼크(Air Shock)","멀티 쇼크(Multi Shock)","모노 쇼크(Mono Shock)"],"a":3,"e":{"w":["트윈 쇼크는 좌우에 하나씩 두 개를 쓰는 방식입니다.","에어 쇼크는 공기 스프링을 쓰는 쇼크입니다.","멀티 쇼크는 일반적인 방식의 이름이 아닙니다."],"d":"모노 쇼크는 쇽업소버 하나를 차체 가운데에 다는 방식입니다. 가볍고 좌우 균형이 좋습니다."}},{"q":"이륜자동차 스티어링 헤드 베어링에 유격이 발생했을 때, 점검 방법으로 적절한 것은?","o":["체인 장력을 확인한다.","타이어 공기압을 측정한다.","이륜자동차를 앞뒤로 밀어보며 소음 여부를 확인한다.","엔진 시동 소리를 듣는다."],"a":2,"e":{"w":["체인 장력은 조향 베어링과 관계가 없습니다.","타이어 공기압은 조향 베어링과 관계가 없습니다.","엔진 시동 소리는 조향 베어링과 관계가 없습니다."],"d":"스티어링 헤드 베어링에 유격이 있으면 차를 앞뒤로 밀 때 스템이 덜컥거립니다. 앞 브레이크를 잡고 앞뒤로 밀어 보면서 덜컥거리는 소리와 느낌이 있는지 확인합니다."}},{"q":"총질량 150kg의 오토바이에 5N의 힘이 작용할 때 가속도는?","o":["0.033m/s²","0.05m/s²","0.08m/s²","0.9m/s²"],"a":0,"e":{"w":["0.05m/s²는 계산과 맞지 않습니다.","0.08m/s²는 계산과 맞지 않습니다.","0.9m/s²는 계산과 맞지 않습니다."],"d":"가속도 = 힘 ÷ 질량입니다.\n5N ÷ 150kg = 0.033m/s²\n같은 힘이면 질량이 클수록 가속도는 작아집니다."}},{"q":"브레이크액이 갖추어야 할 특성 중 틀린 것은?","o":["빙점이 높아 겨울철에도 브레이크 시스템이 원활하게 작동할 수 있어야 한다.","높은 비등점을 가져야 한다.","브레이크 내부의 금속 부분을 부식으로부터 보호해야 한다.","빙점이 낮고 인화점이 높을 것"],"a":0,"e":{"w":["끓는점(비등점)이 높아야 베이퍼록이 생기지 않습니다. 옳은 설명입니다.","금속 부품을 부식시키지 않아야 합니다. 옳은 설명입니다.","빙점이 낮고 인화점이 높아야 합니다. 옳은 설명입니다."],"d":"빙점은 어는 온도입니다. 빙점이 높으면 겨울에 쉽게 얼어 버립니다. 브레이크액은 빙점이 낮아야 하므로 ①이 틀렸습니다."}},{"q":"이륜자동차 클러치 레버를 놓았을 때, 클러치가 완전히 연결되지 않고 미끄러지는 느낌이 든다면 어떤 이유에서인가?","o":["클러치 케이블의 유격 과다","변속 기어의 마모","클러치 디스크의 마모","변속기 오일량 과다"],"a":2,"e":{"w":["케이블 유격이 많으면 클러치가 잘 끊기지 않아 변속이 어려워집니다. 미끄러지는 원인이 아닙니다.","변속 기어가 닳으면 변속할 때 소음이 나거나 기어가 빠집니다. 클러치가 미끄러지는 원인이 아닙니다.","변속기 오일이 많은 것은 클러치가 미끄러지는 직접 원인이 아닙니다."],"d":"클러치 디스크의 마찰재가 닳으면 눌러 붙이는 힘이 약해집니다. 레버를 놓아도 클러치가 완전히 붙지 못해 미끄러지고, 엔진 회전수는 오르는데 속도가 따라 오르지 않습니다."}},{"q":"이륜자동차 수동변속기에서 여러 개의 기어가 장착되어 회전하는 축을 무엇이라고 하는가?","o":["스프로킷","크랭크 샤프트","메인 샤프트 또는 카운터 샤프트","캠 샤프트"],"a":2,"e":{"w":["스프로킷은 체인을 거는 톱니바퀴입니다.","크랭크 샤프트는 엔진의 축입니다.","캠 샤프트는 밸브를 여닫는 축입니다."],"d":"수동변속기에는 엔진의 동력이 들어오는 메인 샤프트와, 동력을 내보내는 카운터 샤프트가 있습니다. 두 축에 여러 개의 기어가 끼워져 서로 맞물려 돕니다."}},{"q":"자동변속기 오일(ATF)이 과열되었을 때, 이를 냉각시켜 주는 부품은?","o":["오일펌프","ATF 쿨러","밸브 바디","토크 컨버터"],"a":1,"e":{"w":["오일펌프는 오일을 보내는 부품입니다.","밸브 바디는 유압의 통로를 바꾸는 부품입니다.","토크 컨버터는 동력을 전달하는 부품입니다."],"d":"ATF 쿨러는 뜨거워진 자동변속기 오일을 식히는 작은 방열기입니다. 오일이 과열되면 성능이 떨어지고 변속기가 손상됩니다."}},{"q":"다음 각 스쿠터에 사용되고 있는 변속기에 대한 설명으로 맞는 것은?","o":["대배기량형 스쿠터는 HFT 방식의 미션을 주로 사용한다.","스쿠터는 CVT 변속기를 사용한다.","환경문제로 스쿠터는 2000년대 이후에는 거의 생산되지 않고 있다.","뛰어난 연비를 위해 2행정 엔진을 주로 사용한다."],"a":1,"e":{"w":["HFT는 일부 차종에만 쓰인 방식이라 주로 쓴다고 할 수 없습니다.","스쿠터는 지금도 많이 생산됩니다.","요즘 스쿠터는 4행정 엔진을 씁니다. 2행정은 연비와 배출가스가 나쁩니다."],"d":"스쿠터는 벨트와 두 풀리로 변속비를 연속적으로 바꾸는 CVT(무단변속기)를 씁니다. 클러치 조작과 변속 조작이 필요 없습니다."}},{"q":"이륜자동차 동력전달장치 부품 중, 엔진의 회전력을 직접 받아 뒷바퀴에 전달하는 마지막 연결 부품은?","o":["리어 스프로킷 또는 리어 풀리","프론트 스프로킷 또는 드라이브 풀리","유성기어","토크 컨버터"],"a":0,"e":{"w":["프론트 스프로킷이나 드라이브 풀리는 동력을 내보내는 쪽입니다.","유성기어는 변속기 안의 기어입니다.","토크 컨버터는 엔진과 변속기 사이에 있습니다."],"d":"동력은 엔진 → 클러치 → 변속기 → 프론트 스프로킷 → 체인 → 리어 스프로킷 → 뒷바퀴 순서로 전달됩니다. 뒷바퀴에 붙어 마지막으로 동력을 받는 부품이 리어 스프로킷(벨트식은 리어 풀리)입니다."}},{"q":"이륜자동차 벨트 구동 방식에서 주로 사용하는 벨트의 재질은?","o":["피아노 강선","나일론 합성재료","고강도 고무 또는 복합재료","강철 와이어"],"a":2,"e":{"w":["피아노 강선은 벨트의 재질이 아닙니다.","나일론만으로는 강도가 부족합니다.","강철 와이어는 벨트의 주재질이 아닙니다."],"d":"구동 벨트는 고강도 고무에 아라미드 같은 섬유 심선을 넣어 만든 복합재료입니다. 잘 늘어나지 않으면서 유연하고 조용합니다."}},{"q":"이륜자동차의 ABS경고등이 점등되어 있을 때, 전기전자회로 측면에서 가장 먼저 점검해야 할 부품은?","o":["브레이크 패드 마모 센서","ABS 모듈의 작동음 상태","브레이크 오일압력 센서","휠 스피드 센서 및 관련 배선"],"a":3,"e":{"w":["패드 마모 센서는 ABS 경고등과 관계가 없습니다.","작동음은 전기전자회로 점검이 아닙니다.","오일압력 센서보다 휠 스피드 센서 쪽 고장이 훨씬 흔합니다."],"d":"ABS 경고등의 가장 흔한 원인은 휠 스피드 센서와 그 배선, 커넥터의 단선이나 접촉 불량입니다. 전기전자회로 측면에서는 이 부분을 먼저 점검합니다."}},{"q":"이륜자동차에 ABS가 장착되어 있을 때, 내리막 길 급제동 시 가장 기대할 수 있는 이점은?","o":["바퀴 잠김 없이 안정적인 제동이 가능하여 안전성이 향상된다.","타이어 교환 주기가 짧아진다.","브레이크 오일 교환 주기가 길어진다.","무게 중심이 앞으로 쏠리면서 뒷바퀴가 쉽게 들려 안전성이 향상된다."],"a":0,"e":{"w":["타이어 교환 주기와는 관계가 없습니다.","브레이크 오일 교환 주기와는 관계가 없습니다.","ABS는 무게 쏠림을 만드는 장치가 아니며, 뒷바퀴가 들리는 것은 이점이 아닙니다."],"d":"내리막 급제동에서는 앞바퀴에 하중이 쏠려 바퀴가 잠기기 쉽습니다. ABS는 바퀴가 잠기지 않게 유압을 조절해 안정적으로 제동하게 해 줍니다."}},{"q":"TPMS 시스템에서 타이어 공기압 정보를 측정하여 무선으로 전송하는 부품은?","o":["차속 센서","휠 속도 센서","차고 센서","휠 내부 센서"],"a":3,"e":{"w":["차속 센서는 차의 속도를 감지합니다.","휠 속도 센서는 ABS용 센서입니다.","차고 센서는 차체 높이를 감지합니다."],"d":"TPMS는 휠 안쪽(주로 공기 밸브 자리)에 단 센서가 타이어 공기압과 온도를 재서 무선으로 보냅니다."}},{"q":"TPMS가 장착된 이륜자동차에서 타이어 교체 후 또는 센서 교체 후 필요한 작업은 다음 중 어느 것인가?","o":["ABS 시스템 재설정","TCS 시스템 재설정","엔진 시스템 재설정","TPMS 시스템 재설정(재보정)"],"a":3,"e":{"w":["ABS는 타이어나 센서 교체와 관계가 없습니다.","TCS도 관계가 없습니다.","엔진 시스템도 관계가 없습니다."],"d":"타이어나 센서를 교체하면 센서의 위치나 ID가 달라질 수 있습니다. TPMS 시스템을 재설정(재보정)해서 새 상태를 인식시켜야 합니다."}},{"q":"이륜자동차 시트 히팅 시스템의 전원은 주로 어디에서 공급받는가?","o":["시트 자체 전원","기동 전동기","태양광 패널","배터리 및 이륜자동차 전기 시스템"],"a":3,"e":{"w":["시트에는 자체 전원이 없습니다.","기동 전동기는 엔진을 돌려 시동을 거는 장치입니다.","태양광 패널은 쓰지 않습니다."],"d":"시트 열선은 배터리와 충전장치로 이루어진 이륜자동차의 전기 시스템에서 전원을 받습니다."}},{"q":"이륜자동차 어댑티브 크루즈 컨트롤(ACC)이 앞차와의 설정 거리를 유지하는 방법은?","o":["운전자가 직접 스로틀과 브레이크를 조작한다.","시스템이 자동으로 가속 또는 감속한다.","앞차와의 통신을 통해 속도를 조절한다.","경고음을 울려 앞차 운전자에게 알린다."],"a":1,"e":{"w":["운전자가 직접 조작한다면 자동 장치가 아닙니다.","앞차와 통신하는 방식이 아닙니다.","앞차 운전자에게 경고음을 보내는 방식이 아닙니다."],"d":"ACC는 레이더로 잰 앞차와의 거리가 설정 거리보다 가까우면 스스로 감속하고, 멀어지면 설정 속도까지 스스로 가속합니다."}},{"q":"이륜자동차 디스플레이 모니터의 기본적인 역할이 아닌 것은?","o":["안전 관련 정보 표시","주행 정보 제공","사고경력 정보 제공","차량 상태 모니터링"],"a":2,"e":{"w":["경고등 같은 안전 관련 정보를 표시합니다.","속도, 주행거리 같은 주행 정보를 제공합니다.","연료, 배터리 같은 차량 상태를 보여 줍니다."],"d":"디스플레이 모니터는 주행 정보, 차량 상태, 안전 관련 정보를 보여 줍니다. 사고경력 정보는 모니터가 보여 주는 내용이 아닙니다."}},{"q":"이륜자동차 스피커에서 보이스 코일이 움직일 수 있는 안정적인 자기장을 형성하는 것은?","o":["돔","바스켓","마그넷","다이어프램"],"a":2,"e":{"w":["돔(더스트 캡)은 먼지를 막는 덮개입니다.","바스켓은 스피커의 뼈대(프레임)입니다.","다이어프램(진동판)은 소리를 내는 판입니다."],"d":"마그넷(자석)이 안정적인 자기장을 만듭니다. 그 자기장 안에서 보이스 코일에 전류가 흐르면 힘을 받아 움직이고, 진동판을 울려 소리가 납니다."}},{"q":"이륜자동차 오디오장치에 인터콤 기능이 포함되어 있을 때의 편의성이 아닌 것은?","o":["라이더 간 통신","오디오장치의 음질을 향상","동승자와의 대화","내비게이션 안내"],"a":1,"e":{"w":["라이더끼리 통신할 수 있습니다.","동승자와 대화할 수 있습니다.","내비게이션 안내를 들을 수 있습니다."],"d":"인터콤은 헬멧을 쓴 채 서로 이야기할 수 있게 하는 통신 기능입니다. 음질을 높여 주는 기능은 아닙니다."}},{"q":"프레임에 균열이 발견되었을 경우, 안전성을 확보하기 위해 반드시 수행해야 할 작업은?","o":["균열 부위에 스티커를 붙인다.","브레이크를 더 강하게 잡는다.","균열 부위를 망치로 두드려 편다.","프레임 재질에 맞는 전문적인 용접 보수 또는 교체"],"a":3,"e":{"w":["스티커를 붙여도 균열은 그대로입니다.","브레이크와는 관계가 없습니다.","망치로 두드리면 균열이 더 커집니다."],"d":"프레임의 균열은 주행 중에 점점 커져 파손으로 이어집니다. 프레임 재질에 맞는 방법으로 전문 용접 보수를 하거나 프레임을 교체해야 합니다."}},{"q":"이륜자동차 프레임에 방청 직업을 할 때 일반적으로 사용되는 방법이 아닌 것은?","o":["방청 페인트 도포","언더코팅","왁스 코팅","윤활유 도포"],"a":3,"e":{"w":["방청 페인트는 녹을 막는 방법입니다.","언더코팅은 녹을 막는 방법입니다.","왁스 코팅은 녹을 막는 방법입니다."],"d":"방청은 금속 표면에 막을 입혀 물과 공기를 차단하는 작업입니다. 윤활유는 쉽게 씻겨 나가고 먼지가 붙어 프레임 방청 방법으로 쓰지 않습니다."}},{"q":"전기 이륜자동차에서 주행 중 모터를 가동하기 위해 직류를 교류로 변환시켜 주는 역할을 하는 것은?","o":["인버터","컨버터","RAM","ROM"],"a":0,"e":{"w":["컨버터는 직류 전압의 크기를 바꾸거나 교류를 직류로 바꿉니다.","RAM은 컴퓨터의 기억장치입니다.","ROM은 컴퓨터의 기억장치입니다."],"d":"배터리의 전기는 직류이고, 구동 모터는 교류로 돕니다. 인버터가 배터리의 직류를 교류로 바꾸어 모터에 보냅니다."}},{"q":"CAN 통신 시스템의 특징이 아닌 것은?","o":["데이터를 2개의 배선(CAN-High, CAN- Low)을 이용하여 전송한다.","모듈간의 통신이 가능하다.","양방향 통신을 한다.","싱글 마스터 방식이다."],"a":3,"e":{"w":["CAN-High와 CAN-Low 두 가닥의 배선으로 데이터를 주고받습니다. CAN의 특징입니다.","여러 모듈이 서로 통신합니다. CAN의 특징입니다.","양방향으로 통신합니다. CAN의 특징입니다."],"d":"CAN 통신은 모든 모듈이 주인(마스터)이 되어 데이터를 보낼 수 있는 멀티 마스터 방식입니다. 싱글 마스터 방식이 아닙니다."}},{"q":"전기 이륜자동차의 배터리 팩에서 열 관리가 중요한 이유는?","o":["배터리 내부 저항을 높이기 위해","배터리의 성능 저하 및 수명 단축을 방지하기 위해","배터리 전력을 높이기 위해","충전 시간을 단축하기 위해"],"a":1,"e":{"w":["내부 저항을 높이려는 것이 아닙니다.","전력을 높이려는 것이 아닙니다.","충전 시간을 줄이려는 것이 아닙니다."],"d":"배터리는 너무 뜨겁거나 차가우면 성능이 떨어지고 수명이 줄어듭니다. 알맞은 온도를 유지하려고 열 관리를 합니다."}},{"q":"전기 이륜자동차의 충전 중, 충전기를 만졌을 때 찌릿한 느낌이 들었다면 가장 먼저 의심해야 할 것은?","o":["충전 속도가 너무 빠르다.","감전 위험이 있다.","배터리 충전 전압이 너무 낮다.","배터리가 충전 전압이 너무 높다."],"a":1,"e":{"w":["충전 속도와는 관계가 없습니다.","충전 전압이 낮은 것과는 관계가 없습니다.","충전 전압이 높은 것만으로 찌릿하지는 않습니다."],"d":"찌릿한 느낌은 전기가 새어 몸으로 흐른 것입니다. 누전으로 감전될 위험이 있으므로 즉시 충전을 멈추고 점검해야 합니다."}},{"q":"전기 이륜자동차에서 시동을 위한 주 전원 공급 스위치 역할을 하며, 고전압 배터리와 모터 컨트롤러 사이의 전력 흐름을 제어하는 부품은?","o":["BMS","인버터","DC-DC 컨버터","메인 릴레이"],"a":3,"e":{"w":["BMS는 배터리를 감시하고 관리하는 장치입니다.","인버터는 직류를 교류로 바꾸는 장치입니다.","DC-DC 컨버터는 고전압을 12V로 낮추는 장치입니다."],"d":"메인 릴레이는 고전압 배터리와 모터 컨트롤러 사이의 큰 스위치입니다. 키를 켜면 붙어 전기를 보내고, 키를 끄거나 이상이 생기면 떨어져 전기를 끊습니다."}},{"q":"전기 이륜자동차 충전 과정에서 가장 먼저 연결해야 하는 것은?","o":["전기 이륜자동차 시동을 건다.","충전 케이블을 먼저 충전 포트에 연결한다.","배터리를 탈거한다.","OBC를 탈거한다."],"a":1,"e":{"w":["충전할 때는 시동(전원)을 끕니다.","배터리를 떼어 낼 필요가 없습니다.","OBC를 떼어 낼 필요가 없습니다."],"d":"충전은 충전 케이블을 차의 충전 포트에 연결하는 것부터 시작합니다. 연결 상태가 확인되어야 충전이 시작됩니다."}},{"q":"전기 이륜자동차의 고전압 부품을 만질 때 반드시 착용해야 할 장갑은?","o":["절연 장갑","일반 목장갑","비닐 장갑","고무 장갑"],"a":0,"e":{"w":["목장갑은 전기가 통합니다.","비닐 장갑은 얇아 쉽게 찢어지고 절연 성능이 보장되지 않습니다.","일반 고무 장갑은 절연 성능이 검증되지 않았습니다."],"d":"고전압 부품을 만질 때는 절연 성능이 검증된 절연 장갑을 착용합니다. 착용 전에 구멍이나 찢어진 곳이 없는지 확인합니다."}},{"q":"직류 전원장치의 효율이 낮을 때 발생할 수 있는 문제는?","o":["회생 제동 성능 증가","배터리 소모 증가 및 주행 거리 감소","충전 성능 향상","모터 소음 감소"],"a":1,"e":{"w":["회생 제동 성능과는 관계가 없습니다.","충전 성능이 좋아지지 않습니다.","모터 소음과는 관계가 없습니다."],"d":"효율이 낮다는 것은 전기가 열로 많이 버려진다는 뜻입니다. 같은 일을 하는 데 배터리의 전기를 더 많이 쓰게 되어 주행 거리가 줄어듭니다."}},{"q":"BLDC 모터의 장점 중 하나인 긴 수명에 가장 큰 영향을 미치는 요인은?","o":["브러시 및 정류자 마모가 없기 때문","전기 이륜자동차의 운행 속도","배터리의 충전 시간","브러시의 크기"],"a":0,"e":{"w":["운행 속도와는 관계가 없습니다.","충전 시간과는 관계가 없습니다.","BLDC 모터에는 브러시가 없습니다."],"d":"일반 직류 모터는 브러시와 정류자가 서로 닿아 닳습니다. BLDC 모터에는 이 부품이 없어 닳을 것이 없으므로 수명이 깁니다."}},{"q":"이륜자동차 주행빔 전조등의 설치 기준에 대한 설명으로 틀린 것은?","o":["등광색은 백색이어야 한다.","비추는 방향은 자동차 전방이어야 한다.","핸들을 돌려도 비추는 방향이 바뀌어서는 안 된다.","변환빔에서 주행빔으로 바꿀 때 변환빔은 켜진 상태를 유지할 수 있다."],"a":2,"e":{"w":["등광색은 백색이어야 합니다. 옳은 설명입니다.","비추는 방향은 자동차 전방이어야 합니다. 옳은 설명입니다.","변환빔에서 주행빔으로 바꿀 때 변환빔은 켜진 상태를 유지할 수 있습니다. 옳은 설명입니다."],"d":"「자동차 및 자동차부품의 성능과 기준에 관한 규칙」 제75조와 별표 5의17에 따라, 이륜자동차 주행빔 전조등은 백색이고 자동차 전방을 비추어야 합니다. 다만 조향에 따라 비추는 방향이 바뀌는 것은 허용됩니다. 바뀌어서는 안 된다고 한 ③이 틀렸습니다."}},{"q":"이륜자동차 구조변경 승인을 받지 않은 상태에서 교통 단속에 적발되었을 때, 발생할 수 있는 즉각적인 조치는?","o":["바로 귀가조치시킨다.","불법 구조변경 원상복구 명령 및 과태료 부과","계속 주행시킨다.","이륜자동차 폐차 권고"],"a":1,"e":{"w":["단속에 적발되면 그냥 돌려보내지 않습니다.","불법 상태로 계속 주행하게 하지 않습니다.","폐차를 권고하는 것이 아닙니다."],"d":"승인 없이 구조를 바꾼 것이 적발되면 원래 상태로 되돌리라는 원상복구 명령을 받고 금전적 처분이 따릅니다."}},{"q":"이륜자동차 구조변경 없이 임의로 LED 튜닝을 했을 때, 어떤 문제가 발생할 수 있는가?","o":["이륜자동차 연비가 좋아진다.","브레이크 성능이 좋아진다.","배터리 충전이 좋아진다.","불법 튜닝으로 단속될 수 있다."],"a":3,"e":{"w":["LED로 바꾼다고 연비가 좋아지지 않습니다.","브레이크 성능과는 관계가 없습니다.","배터리 충전과는 관계가 없습니다."],"d":"등화장치는 색과 밝기, 개수가 안전기준으로 정해져 있습니다. 승인 없이 임의로 LED를 달면 불법 튜닝으로 단속될 수 있습니다."}},{"q":"이륜자동차 주행빔 전조등의 광도기준에서, 광도 측정점의 위치를 정하는 스크린은 전조등으로부터 몇 m 거리에 두는가?","o":["15m","25m","50m","100m"],"a":1,"e":{"w":["15m는 광도기준의 스크린 거리가 아닙니다.","50m는 광도기준의 스크린 거리가 아닙니다.","100m는 광도기준의 스크린 거리가 아닙니다."],"d":"「자동차 및 자동차부품의 성능과 기준에 관한 규칙」 별표 5의17에 따라, 이륜자동차 주행빔 전조등의 광도는 25m 거리에 둔 스크린 위의 측정점에서 기준값을 만족해야 합니다. 운행차 검사에서 주광축 진폭을 판정하는 10m 위치 기준과는 다른 것이므로 구분합니다."}},{"q":"2006년 1월 1일 이후에 제작된 이륜자동차의 일반적인 배기 소음 허용 기준은?","o":["95dB(A) 이하","100dB(A) 이하","105dB(A) 이하","110dB(A) 이하"],"a":2,"e":{"w":["95dB(A)는 해당 기준이 아닙니다.","100dB(A)는 해당 기준이 아닙니다.","110dB(A)는 해당 기준이 아닙니다."],"d":"2006년 1월 1일 이후에 제작된 이륜자동차의 배기 소음 허용 기준은 105dB(A) 이하입니다."}},{"q":"이륜자동차 배터리 작업 시 주의사항으로 틀린 것은?","o":["배터리 액이 피부에 묻으면 즉시 씻어낸다.","(+)단자를 먼저 분리한 후 (-)단자를 분리한다.","(-)단자를 먼저 분리한 후 (+)단자를 분리한다.","배터리 단자를 분리하기 전에 키스위치를 OFF한다."],"a":1,"e":{"w":["배터리 액은 황산이라 피부에 묻으면 즉시 씻어 냅니다. 옳은 설명입니다.","(-)단자를 먼저 분리하는 것이 올바른 순서입니다. 옳은 설명입니다.","단자를 분리하기 전에 키스위치를 끕니다. 옳은 설명입니다."],"d":"배터리는 (-)단자를 먼저 분리합니다. (+)단자를 먼저 풀다가 공구가 차체에 닿으면 합선되어 불꽃이 튑니다. 연결할 때는 반대로 (+)단자를 먼저 연결합니다."}},{"q":"이륜자동차 부품을 세척할 때 유독성 증기 발생 시 조치 사항은?","o":["환기가 안 되는 곳에서 세척한다.","세척제를 바닥에 뿌린다.","환기가 잘되는 곳에서 작업한다.","증기를 흡입하면서 작업한다."],"a":2,"e":{"w":["환기가 안 되면 증기를 들이마시게 됩니다.","세척제를 바닥에 뿌리면 증기가 더 많이 납니다.","증기를 들이마시면 중독됩니다."],"d":"유독성 증기는 들이마시면 중독을 일으킵니다. 환기가 잘되는 곳에서 작업하고 필요하면 방독 마스크를 착용합니다."}},{"q":"이륜자동차 브레이크액 교환 시 주의해야 할 점으로 바른 것은?","o":["피부에 묻으면 즉시 흐르는 물에 씻는다.","브레이크액은 흡습성이 있으므로 공기 중에 오래 노출시킨다.","폐 브레이크액은 하수구에 버린다.","브레이크액 교환시 이륜자동차 도장 표면에 묻어도 된다."],"a":0,"e":{"w":["브레이크액은 공기 중의 수분을 빨아들이므로 오래 노출시키면 안 됩니다.","폐 브레이크액은 지정된 용기에 모아 폐기물로 처리합니다.","브레이크액은 도장면을 녹이므로 묻으면 즉시 물로 씻어 냅니다."],"d":"브레이크액은 피부를 자극합니다. 피부에 묻으면 즉시 흐르는 물로 씻어 냅니다."}}]},{"g":"보충 문제","name":"엔진 보충 문제","id":"p17","qs":[{"q":"크랭크케이스 내의 배출가스 제어장치는 어떤 유해가스를 저감시키는가?","o":["HC","CO","NOx","CO₂"],"a":0,"e":{"w":["CO는 주로 배기관으로 나오는 가스입니다.","NOx는 연소 온도가 높을 때 배기관으로 나오는 가스입니다.","CO₂는 유해가스 저감 대상이 아닙니다."],"d":"크랭크케이스에는 피스톤과 실린더 사이로 샌 블로바이 가스가 모입니다. 이 가스의 주성분은 타지 않은 연료인 탄화수소(HC)입니다. 이것을 다시 흡기로 보내 태워서 HC를 줄입니다."}},{"q":"윤활유의 역할이 아닌 것은?","o":["밀봉 작용","냉각 작용","팽창 작용","방청 작용"],"a":2,"e":{"w":["밀봉 작용은 윤활유의 역할입니다.","냉각 작용은 윤활유의 역할입니다.","방청 작용은 윤활유의 역할입니다."],"d":"윤활유는 마찰 감소(감마), 밀봉, 냉각, 세척, 방청, 응력 분산 작용을 합니다. 팽창 작용은 윤활유의 역할이 아닙니다."}},{"q":"기관을 점검시 운전 상태로 점검해야 할 것이 아닌 것은?","o":["클러치의 상태","매연 상태","기어의 소음 상태","급유 상태"],"a":3,"e":{"w":["클러치의 상태는 엔진을 돌려 동력을 걸어 봐야 알 수 있습니다.","매연 상태는 엔진이 돌아야 확인할 수 있습니다.","기어의 소음은 돌아갈 때 나므로 운전 상태로 점검합니다."],"d":"급유 상태(오일의 양과 오염)는 엔진을 멈추고 점검합니다. 돌아가는 중에는 오일이 순환하고 있어 정확히 볼 수 없고 위험합니다."}},{"q":"부품을 분해 정비시 반드시 새것으로 교환하여야 할 부품이 아닌 것은?","o":["오일 씰","볼트 및 너트","개스킷","오링"],"a":1,"e":{"w":["오일 씰은 한 번 쓰면 변형되어 새것으로 교환합니다.","개스킷은 눌려서 변형되므로 새것으로 교환합니다.","오링은 눌려서 변형되므로 새것으로 교환합니다."],"d":"씰, 개스킷, 오링처럼 눌려서 기밀을 유지하는 부품은 다시 쓰면 샙니다. 볼트와 너트는 손상되지 않았으면 다시 쓸 수 있습니다."}},{"q":"화학세척제를 사용하여 방열기(라디에이터)를 세척하는 방법으로 틀린 것은?","o":["방열기의 냉각수를 완전히 뺀다.","세척제 용액을 냉각장치 내에 가득히 넣는다.","기관을 기동하고, 냉각수 온도를 80℃이상으로 한다.","기관을 정지하고 바로 방열기 캡을 연다."],"a":3,"e":{"w":["먼저 냉각수를 완전히 빼는 것이 맞습니다.","세척제 용액을 가득 넣는 것이 맞습니다.","엔진을 돌려 80℃ 이상으로 올려 세척제를 순환시키는 것이 맞습니다."],"d":"엔진을 멈춘 직후에는 냉각 계통의 온도와 압력이 높습니다. 이때 캡을 열면 뜨거운 물과 증기가 뿜어져 나와 화상을 입습니다. 충분히 식힌 뒤에 엽니다."}},{"q":"실린더 내경이 50㎜, 행정이 100㎜인 4실린더 기관의 압축비가 11일 때 연소실 체적은?","o":["약 40.1cc","약 30.1cc","약 15.6cc","약 19.6cc"],"a":3,"e":{"w":["40.1cc는 계산과 맞지 않습니다.","30.1cc는 계산과 맞지 않습니다.","15.6cc는 계산과 맞지 않습니다."],"d":"먼저 실린더 1개의 행정체적을 구합니다.\n행정체적 = 0.785 × 내경² × 행정 = 0.785 × 5² × 10 = 196.3cc\n연소실 체적 = 행정체적 ÷ (압축비 - 1) = 196.3 ÷ 10 = 약 19.6cc","g":"comp"}},{"q":"가솔린 기관에서 완전연소 시 배출되는 연소가스 중 체적비율로 가장 많은 가스는?","o":["산소","이산화탄소","탄화수소","질소"],"a":3,"e":{"w":["산소는 연소에 쓰여 거의 남지 않습니다.","이산화탄소는 질소보다 적습니다.","탄화수소는 완전연소하면 나오지 않습니다."],"d":"공기의 약 79%는 질소입니다. 질소는 연소에 참여하지 않고 그대로 배출되므로 배기가스 가운데 가장 많습니다."}},{"q":"열선식 흡입공기량 센서에서 흡입공기량이 많아질 경우 변화하는 물리량은?","o":["열량","시간","전류","주파수"],"a":2,"e":{"w":["열량이 직접 출력 신호가 되지 않습니다.","시간이 변하는 것이 아닙니다.","주파수가 변하는 것은 칼만 와류식입니다."],"d":"열선식은 뜨겁게 달군 가는 선에 공기를 지나가게 합니다. 공기가 많이 지나갈수록 열선이 식으므로, 온도를 유지하려고 더 많은 전류를 흘립니다. 이 전류의 변화로 공기량을 알아냅니다."}},{"q":"기관의 총배기량을 구하는 식은?","o":["총배기량 = 피스톤 단면적 * 행정","총배기량 = 피스톤 단면적 * 행정 * 실린더 수","총배기량 = 피스톤의 길이 * 행정","총배기량 = 피스톤의 길이 * 행정 * 실린더 수"],"a":1,"e":{"w":["피스톤 단면적 × 행정은 실린더 1개의 배기량입니다.","피스톤의 길이는 배기량과 관계가 없습니다.","피스톤의 길이는 배기량과 관계가 없습니다."],"d":"실린더 1개의 배기량 = 피스톤 단면적 × 행정입니다. 여기에 실린더 수를 곱하면 총배기량입니다."}},{"q":"기관의 윤활유 점도지수(viscosity index) 또는 점도에 대한 설명으로 틀린 것은?","o":["온도변화에 의한 점도가 적을 경우 점도지수가 높다.","추운 지방에서는 점도가 큰 것 일수록 좋다.","점도지수는 온도변화에 대한 점도의 변화 정도를 표시한 것이다.","점도란 윤활유의 끈적끈적한 정도를 나타내는 척도이다."],"a":1,"e":{"w":["온도가 변해도 점도 변화가 적으면 점도지수가 높습니다. 옳은 설명입니다.","점도지수는 온도 변화에 따른 점도 변화의 정도를 나타냅니다. 옳은 설명입니다.","점도는 윤활유의 끈적끈적한 정도입니다. 옳은 설명입니다."],"d":"추운 곳에서는 오일이 굳어 더 끈적해집니다. 점도가 큰 오일을 쓰면 시동이 어렵고 오일이 잘 돌지 않습니다. 추운 지방에서는 점도가 낮은 오일을 써야 합니다."}},{"q":"실린더 내경 75㎜, 행정 75㎜, 압축비가 8:1인 4실린더 기관의 총 연소실 체적은?","o":["약 239.3cc","약 159.3cc","약 189.3cc","약 318.3cc"],"a":2,"e":{"w":["239.3cc는 계산과 맞지 않습니다.","159.3cc는 계산과 맞지 않습니다.","318.3cc는 계산과 맞지 않습니다."],"d":"실린더 1개의 행정체적 = 0.785 × 7.5² × 7.5 = 331.2cc\n실린더 1개의 연소실 체적 = 331.2 ÷ (8 - 1) = 47.3cc\n총 연소실 체적 = 47.3 × 4 = 약 189.3cc","g":"comp"}},{"q":"밸브 스프링의 서징현상에 대한 설명으로 옳은 것은?","o":["밸브가 열릴 때 천천히 열리는 현상","흡, 배기 밸브가 동시에 열리는 현상","밸브가 고속 회전에서 저속으로 변화할 때 스프링의 장력의 차가 생기는 현상","밸브스프링의 고유 진동수와 캠 회전수가 공명에 의해 밸브스프링이 공진하는 현상"],"a":3,"e":{"w":["밸브가 천천히 열리는 현상이 아닙니다.","흡·배기 밸브가 동시에 열리는 것은 밸브 오버랩입니다.","회전이 변할 때 장력 차이가 생기는 현상이 아닙니다."],"d":"밸브스프링에는 고유 진동수가 있습니다. 고속에서 캠이 스프링을 누르는 횟수가 이 진동수와 맞아떨어지면 스프링이 캠과 상관없이 제멋대로 떨립니다. 이것이 서징입니다."}},{"q":"기관이 과열하는 원인으로 틀린 것은?","o":["냉각팬의 파손","냉각수 흐름 저항 감소","냉각수 이물질 혼입","라디에이터의 코어 파손"],"a":1,"e":{"w":["냉각팬이 파손되면 바람이 없어 과열됩니다.","이물질이 섞이면 통로가 막혀 과열됩니다.","코어가 파손되면 냉각수가 새어 과열됩니다."],"d":"냉각수가 흐르는 데 저항이 줄어들면 순환이 잘되어 냉각이 좋아집니다. 과열의 원인이 아닙니다."}},{"q":"산소센서에 대한 설명으로 옳은 것은?","o":["농후한 혼합기가 연소된 경우 센서 내부에서 외부 쪽으로 산소 이온이 이동한다.","산소센서의 내부에는 배기가스와 같은 성분의 가스가 봉입되어져 있다.","촉매 전, 후의 산소센서는 서로 같은 기전력을 발생하는 것이 정상이다.","광역산소센서에서 히팅 코일 접지와 신호 접지 라인은 항상 0V이다."],"a":0,"e":{"w":["센서 내부에는 배기가스가 아니라 대기(공기)가 들어 있습니다.","촉매 뒤의 센서는 정화된 가스를 재므로 앞 센서와 기전력이 다릅니다.","접지 라인이 항상 0V인 것은 아닙니다."],"d":"지르코니아 산소센서는 안쪽의 대기와 바깥쪽 배기가스의 산소 농도 차이로 전압을 만듭니다. 혼합기가 농후하면 배기가스에 산소가 적어, 산소 이온이 안쪽에서 바깥쪽으로 이동하며 약 0.9V의 높은 전압이 나옵니다."}},{"q":"기관에서 블로바이 가스의 주성분은?","o":["N₂","HC","CO","NOx"],"a":1,"e":{"w":["질소는 블로바이 가스의 주성분이 아닙니다.","CO는 주성분이 아닙니다.","NOx는 주성분이 아닙니다."],"d":"블로바이 가스는 압축행정에서 피스톤과 실린더 사이로 샌 혼합기가 대부분입니다. 타지 않은 연료이므로 주성분은 탄화수소(HC)입니다."}},{"q":"가솔린기관에서 연료펌프 내의 첵밸브가 열린 채로 고장이 났을 때를 설명한 것 중 틀린 것은?","o":["시동이 걸리지 않는다.","주행 성능에 영향은 없다.","연료탱크 내에 설치되어 있다.","연료펌프에 무리가 가지 않는다."],"a":0,"e":{"w":["주행 중에는 펌프가 계속 압력을 만들므로 주행 성능에 영향이 없습니다. 옳은 설명입니다.","연료펌프와 체크밸브는 연료탱크 안에 있습니다. 옳은 설명입니다.","체크밸브가 열려 있어도 펌프에 무리가 가지 않습니다. 옳은 설명입니다."],"d":"체크밸브는 엔진을 끈 뒤 연료 라인의 압력(잔압)을 유지합니다. 열린 채 고장 나면 잔압이 빠져 다음 시동이 조금 늦어질 뿐, 시동이 걸리지 않는 것은 아닙니다."}},{"q":"유압식 밸브 리프터의 유압은 어떤 유압을 이용 하는가?","o":["흡기다기관의 진공 압을 이용한다.","배기다기관의 배기 압을 이용한다.","별도의 유압장치를 사용한다.","윤활장치의 유압을 이용한다."],"a":3,"e":{"w":["흡기다기관의 진공을 쓰지 않습니다.","배기 압력을 쓰지 않습니다.","별도의 유압장치가 없습니다."],"d":"유압식 밸브 리프터는 엔진 오일펌프가 보내는 윤활장치의 유압으로 작동합니다. 오일의 압력으로 밸브 간극을 자동으로 0으로 맞춥니다."}},{"q":"기관에 흡입되는 공기를 여과하고 흡입 시 강한 소음을 감소시키는 기능을 하는 것은?","o":["공기 덕트","오일 여과기","공기 여과기","공기 챔버"],"a":2,"e":{"w":["공기 덕트는 공기가 지나가는 통로입니다.","오일 여과기는 오일의 이물질을 거릅니다.","공기 챔버는 공기를 모아 두는 공간입니다."],"d":"공기 여과기(에어클리너)는 흡입되는 공기의 먼지를 걸러 내고, 공기를 빨아들일 때 나는 소음도 줄입니다."}},{"q":"기관에서 온도센서는 어떤 역할을 하는가?","o":["기관의 냉각수 온도를 측정하여 이를 전기적 신호로 바꾸어 ECU에 보낸다.","외부온도를 측정하여 이를 전기적 신호로 바꾸어 ECU에 보낸다.","냉각수 온도를 측정하여 직접 시동 밸브로 신호를 보낸다.","기관온도를 측정하여 공기센서에 신호를 보내어 혼합기를 조정한다."],"a":0,"e":{"w":["외부온도는 다른 센서가 측정합니다.","센서는 ECU로 신호를 보냅니다. 밸브로 직접 보내지 않습니다.","센서는 ECU로 신호를 보냅니다. 공기센서로 보내지 않습니다."],"d":"수온센서는 냉각수의 온도를 재서 전기 신호로 바꾸어 ECU에 보냅니다. ECU는 이 신호로 연료 분사량과 점화 시기를 보정합니다."}},{"q":"전자제어 엔진에서 인젝터의 점검 방법이 아닌 것은?","o":["인젝터 코일 저항 측정","인젝터 작동음 확인","인젝터 분사상태 확인","인젝터 작동온도 측정"],"a":3,"e":{"w":["코일 저항을 측정해 단선과 단락을 확인합니다.","작동음을 들어 작동 여부를 확인합니다.","분사 상태를 보아 막힘과 누설을 확인합니다."],"d":"인젝터는 코일 저항, 작동음, 분사 상태와 분사량으로 점검합니다. 작동온도를 재는 것은 점검 방법이 아닙니다."}},{"q":"행정 길이 200mm인 가솔린 기관에서 피스톤의 평균속도가 5m/s이면, 크랭크축의 1분간 회전수는?","o":["75rpm","150rpm","750rpm","1500rpm"],"a":2,"e":{"w":["75rpm은 계산과 맞지 않습니다.","150rpm은 계산과 맞지 않습니다.","1500rpm은 계산과 맞지 않습니다."],"d":"피스톤 평균속도 = 2 × 행정 × 회전수 ÷ 60입니다.\n회전수 = 평균속도 × 60 ÷ (2 × 행정)\n= 5 × 60 ÷ (2 × 0.2m) = 750rpm"}},{"q":"크랭크축이 회전 중 받는 힘이 아닌 것은?","o":["휨(bending)","비틀림(torsion)","관통(penetration)","전단(shearing)"],"a":2,"e":{"w":["폭발 압력으로 휨을 받습니다.","회전력을 전달하면서 비틀림을 받습니다.","저널 부분에서 전단을 받습니다."],"d":"크랭크축은 폭발 압력과 회전 때문에 휨, 비틀림, 전단을 받습니다. 관통은 크랭크축이 받는 힘이 아닙니다."}},{"q":"일반적인 오일의 양부 판단 방법이다. 틀리게 설명한 것은?","o":["오일의 색깔이 우유색에 가까운 것은 물이 혼입되어 있는 것이다.","오일의 색깔이 회색에 가까운 것은 가솔린이 혼입되어 있는 것이다.","오일의 색깔이 회색에 가까운 것은 4에틸납 연소 생성물이 혼입된 것이다.","오일의 색깔이 검은색에 가까운 것은 너무 오랫동안 사용했기 때문이다."],"a":1,"e":{"w":["우유색은 냉각수(물)가 섞인 것입니다. 옳은 설명입니다.","회색은 4에틸납 연소 생성물이 섞인 것입니다. 옳은 설명입니다.","검은색은 너무 오래 사용한 것입니다. 옳은 설명입니다."],"d":"가솔린이 섞이면 오일이 붉은색을 띱니다. 회색은 연소 생성물이 섞였을 때의 색이므로 ②가 틀렸습니다."}},{"q":"실린더 안지름 80mm, 행정이 70mm인 4실린더 4행정기관에서 회전수가 2000rpm이라면 분당 총배기량은 약 몇 ℓ인가?","o":["약 1600","약 1942","약 1500","약 1407"],"a":3,"e":{"w":["1600은 계산과 맞지 않습니다.","1942는 계산과 맞지 않습니다.","1500은 계산과 맞지 않습니다."],"d":"실린더 1개의 배기량 = 0.785 × 8² × 7 = 351.7cc\n총배기량 = 351.7 × 4 = 약 1,407cc\n4행정 기관은 2회전에 1번 흡입하므로 분당 흡입 횟수는 2000 ÷ 2 = 1000번입니다.\n분당 총배기량 = 1,407cc × 1000 = 약 1,407ℓ"}},{"q":"다음 중 가솔린 분사방법으로 기관의 각 실린더 마다 독립적으로 분사하는 방식은?","o":["듀얼 포인트 인젝션","싱글 포인트 인젝션","연속 포인트 인젝션","멀티 포인트 인젝션"],"a":3,"e":{"w":["듀얼 포인트는 두 곳에서 분사하는 방식입니다.","싱글 포인트는 스로틀 보디 한 곳에서 분사하는 방식입니다.","연속 포인트 인젝션이라는 방식은 없습니다."],"d":"멀티 포인트 인젝션(MPI)은 실린더마다 인젝터를 하나씩 달아 따로따로 분사하는 방식입니다."}},{"q":"다음 중 기관이 과열되는 원인이 아닌 것은?","o":["온도조절기가 닫힌 상태로 고장 났을 때","방열기의 용량이 클 때","방열기의 코어가 막혔을 때","벨트를 사용하는 형식에서 팬벨트 장력이 느슨할　때"],"a":1,"e":{"w":["온도조절기가 닫힌 채 고장 나면 냉각수가 라디에이터로 가지 못해 과열됩니다.","코어가 막히면 냉각수가 흐르지 못해 과열됩니다.","팬벨트가 느슨하면 팬과 물펌프가 제대로 돌지 않아 과열됩니다."],"d":"방열기의 용량이 크면 열을 더 잘 내보냅니다. 과열의 원인이 아니라 오히려 과냉 쪽입니다."}},{"q":"가스 흐름의 관성을 유효하게 이용하기 위하여 흡배기 밸브를 동시에 열어주는 작용을 무엇이라 하는가?","o":["블로 다운(blow-down)","블로 바이(blow-by)","밸브 바운드(valve bound)","밸브 오버랩(valve overlap)"],"a":3,"e":{"w":["블로 다운은 배기밸브가 열릴 때 배기가스가 자체 압력으로 나가는 현상입니다.","블로 바이는 피스톤과 실린더 사이로 가스가 새는 현상입니다.","밸브 바운드는 밸브가 닫힐 때 튀는 현상입니다."],"d":"상사점 부근에서 흡기밸브와 배기밸브를 함께 열어 두는 것을 밸브 오버랩이라고 합니다. 나가는 배기가스의 흐름이 새 혼합기를 끌어들입니다."}},{"q":"다음 중 부동액의 주성분이 아닌 것은?","o":["벤젠","에틸렌글리콜","메탄올","글리세린"],"a":0,"e":{"w":["에틸렌글리콜은 가장 많이 쓰는 부동액 성분입니다.","메탄올은 부동액 성분입니다.","글리세린은 부동액 성분입니다."],"d":"부동액으로는 에틸렌글리콜, 메탄올, 글리세린을 씁니다. 벤젠은 연료 성분이지 부동액 성분이 아닙니다."}},{"q":"베어링이 하우징 내에서 움직이지 않게 하기 위하여 베어링의 바깥 둘레를 하우징의 둘레보다 조금 크게 하여 차이를 두는 것은?","o":["베어링 크러시","베어링 스프레드","베어링 돌기","베어링 어셈블리"],"a":0,"e":{"w":["베어링 스프레드는 베어링의 바깥지름과 하우징 안지름의 차이입니다.","베어링 돌기는 베어링이 돌지 않게 하는 턱입니다.","베어링 어셈블리는 조립품 전체를 말합니다."],"d":"베어링 크러시는 베어링의 바깥 둘레를 하우징 둘레보다 조금 길게 만든 차이입니다. 조이면 베어링이 눌려 하우징에 꽉 밀착해 움직이지 않습니다."}},{"q":"단위에 대한 설명으로 옳은 것은?","o":["1ps는 75kgf·m/h의 일률이다.","1J은 0.24cal이다.","1kW는 1000kgf·m/s의 일률이다.","초속 1m/s는 시속 36km/h와 같다."],"a":1,"e":{"w":["1PS는 75kgf·m/s입니다. 시간 단위가 초(s)여야 합니다.","1kW는 약 102kgf·m/s입니다.","1m/s는 3.6km/h입니다."],"d":"1J은 약 0.24cal입니다. 반대로 1cal은 약 4.2J입니다."}},{"q":"센서 및 액추에이터 점검·정비 시 적절한 점검 조건이 잘못 짝지어진 것은?","o":["AFS – 시동상태","컨트롤 릴레이 – 점화 스위치 ON 상태","점화코일 – 주행 중 감속 상태","크랭크각 센서 – 크랭킹 상태"],"a":2,"e":{"w":["AFS(공기 유량 센서)는 공기가 흘러야 하므로 시동 상태에서 점검합니다. 옳은 짝입니다.","컨트롤 릴레이는 점화 스위치를 켠 상태에서 점검합니다. 옳은 짝입니다.","크랭크각 센서는 크랭킹할 때 신호가 나오므로 크랭킹 상태에서 점검합니다. 옳은 짝입니다."],"d":"점화코일은 주행하면서 점검할 수 없습니다. 정지 상태에서 저항을 재거나 크랭킹하며 불꽃을 확인합니다."}},{"q":"압축압력 시험에서 압축압력이 떨어지는 요인으로 가장 거리가 먼 것은?","o":["헤드 가스켓 소손","피스톤링 마모","밸브시트 마모","밸브 가이드고무 마모"],"a":3,"e":{"w":["헤드 가스켓이 타면 압축가스가 샙니다.","피스톤링이 닳으면 압축가스가 샙니다.","밸브시트가 닳으면 밸브가 밀착되지 않아 압축가스가 샙니다."],"d":"밸브 가이드 고무(스템 실)는 오일이 연소실로 내려가는 것을 막는 부품입니다. 닳으면 오일이 소모될 뿐 압축압력과는 관계가 없습니다."}},{"q":"기관의 윤활장치를 점검해야 하는 이유로 거리가 먼 것은?","o":["윤활유 소비가 많다.","유압이 높다.","유압이 낮다.","오일 교환을 자주한다."],"a":3,"e":{"w":["윤활유 소비가 많으면 점검해야 합니다.","유압이 높으면 점검해야 합니다.","유압이 낮으면 점검해야 합니다."],"d":"오일 소비가 많거나 유압이 정상이 아닐 때 윤활장치를 점검합니다. 오일 교환을 자주 하는 것은 고장이 아니므로 점검 이유가 되지 않습니다."}},{"q":"기관에서 공기 과잉률이란?","o":["이론공연비","실제공연비","공기흡입량 ÷ 연료소비량","실제공연비 ÷ 이론공연비"],"a":3,"e":{"w":["이론공연비는 완전연소에 필요한 공기와 연료의 비입니다.","실제공연비는 실제로 들어간 공기와 연료의 비입니다.","공기흡입량 ÷ 연료소비량은 실제공연비입니다."],"d":"공기 과잉률(λ) = 실제공연비 ÷ 이론공연비입니다. 1이면 이론공연비, 1보다 크면 희박, 1보다 작으면 농후입니다."}},{"q":"밸브 오버랩에 대한 설명으로 옳은 것은?","o":["밸브 스프링을 이중으로 사용 하는 것","밸브 시트와 면의 접촉 면적","흡·배기 밸브가 동시에 열려 있는 상태","로커 암에 의해 밸브가 열리기 시작할 때"],"a":2,"e":{"w":["스프링을 이중으로 쓰는 것은 서징을 막는 방법입니다.","밸브 시트와 면의 접촉 면적은 오버랩이 아닙니다.","밸브가 열리기 시작하는 시점을 말하는 것이 아닙니다."],"d":"밸브 오버랩은 상사점 부근에서 흡기밸브와 배기밸브가 동시에 열려 있는 상태입니다.","g":"overlap"}},{"q":"가솔린의 조성 비율(체적)이 이소옥탄 80, 노멀헵탄 20인 경우 옥탄가는?","o":["20","40","60","80"],"a":3,"e":{"w":["20은 노멀헵탄의 비율입니다.","40은 계산과 맞지 않습니다.","60은 계산과 맞지 않습니다."],"d":"옥탄가 = 이소옥탄 ÷ (이소옥탄 + 노멀헵탄) × 100입니다.\n80 ÷ (80 + 20) × 100 = 80"}},{"q":"NOx는 ( ㉠ )의 화합물이며, 일반적으로 ( ㉡ )에서 쉽게 반응한다. 괄호 안에 들어갈 말로 옳은 것은?","o":["㉠ 일산화질소와 산소 ㉡ 저온","㉠ 일산화질소와 산소 ㉡ 고온","㉠ 질소와 산소 ㉡ 저온","㉠ 질소와 산소 ㉡ 고온"],"a":3,"e":{"w":["NOx는 질소와 산소의 화합물입니다. 온도도 틀렸습니다.","NOx는 질소와 산소의 화합물입니다.","저온에서는 잘 반응하지 않습니다."],"d":"NOx(질소산화물)는 공기 중의 질소와 산소가 결합한 것입니다. 연소 온도가 높을수록 많이 만들어집니다."}},{"q":"전자제어 가솔린 엔진에서 인젝터의 고장으로 발생될 수 있는 현상으로 가장 거리가 먼 것은?","o":["연료소모 증가","배출가스 감소","가속력 감소","공회전 부조"],"a":1,"e":{"w":["인젝터가 새거나 많이 분사하면 연료 소모가 늘어납니다.","분사가 고르지 않으면 가속력이 떨어집니다.","분사가 고르지 않으면 공회전이 불안정합니다."],"d":"인젝터가 고장 나면 혼합비가 맞지 않아 불완전 연소가 일어납니다. 배출가스는 줄지 않고 오히려 늘어납니다."}},{"q":"행정별 피스톤 압축 링의 호흡작용에 대한 내용으로 틀린 것은?","o":["흡입 : 피스톤의 홈과 링의 윗면이 접촉하여 홈에 있는 소량의 오일의 침입을 막는다.","압축 : 피스톤이 상승하면 링은 아래로 밀리게 되어 위로부터의 혼합기가 아래로 누설되지 않게 한다.","동력 : 피스톤의 홈과 링의 윗면이 접촉하여 링의 윗면으로부터 가스가 누설되는 것을 방지한다.","배기 : 피스톤이 상승하면 링은 아래로 밀리게 되어 위로부터의 연소가스가 아래로 누설되지 않게 한다."],"a":2,"e":{"w":["흡입행정에서는 링의 윗면이 홈과 닿아 오일이 올라오는 것을 막습니다. 옳은 설명입니다.","압축행정에서는 링이 아래로 밀려 혼합기가 새지 않게 합니다. 옳은 설명입니다.","배기행정에서는 링이 아래로 밀려 연소가스가 새지 않게 합니다. 옳은 설명입니다."],"d":"동력(폭발)행정에서는 높은 가스 압력이 링을 아래로 누릅니다. 링의 아랫면이 홈의 아랫면과 닿아 가스가 새는 것을 막습니다. 윗면이 닿는다는 ③이 틀렸습니다."}},{"q":"아날로그 신호가 출력되는 센서로 틀린 것은?","o":["옵티컬 방식의 크랭크각 센서","스로틀 포지션 센서","흡기온도 센서","수온 센서"],"a":0,"e":{"w":["스로틀 포지션 센서는 열림 정도에 따라 전압이 연속으로 변하는 아날로그 신호입니다.","흡기온도 센서는 온도에 따라 전압이 연속으로 변하는 아날로그 신호입니다.","수온 센서는 온도에 따라 전압이 연속으로 변하는 아날로그 신호입니다."],"d":"옵티컬(광학) 방식 센서는 빛이 구멍을 통과했는지에 따라 켜짐과 꺼짐만 나오는 디지털 신호를 냅니다."}},{"q":"엔진이 작동 중 과열되는 원인으로 틀린 것은?","o":["냉각수의 부족","라디에이터 코어의 막힘","전동 팬 모터 릴레이의 고장","수온조절기가 열린 상태로 고장"],"a":3,"e":{"w":["냉각수가 부족하면 과열됩니다.","코어가 막히면 과열됩니다.","전동 팬 릴레이가 고장 나면 팬이 돌지 않아 과열됩니다."],"d":"수온조절기가 열린 채 고장 나면 냉각수가 계속 라디에이터로 흘러 엔진이 잘 데워지지 않습니다. 과열이 아니라 과냉이 됩니다."}},{"q":"176°F는 몇 ℃인가?","o":["76","80","144","176"],"a":1,"e":{"w":["76은 계산과 맞지 않습니다.","144는 176에서 32만 뺀 값입니다.","176은 화씨 값 그대로입니다."],"d":"섭씨 = (화씨 - 32) × 5 ÷ 9입니다.\n(176 - 32) × 5 ÷ 9 = 144 × 5 ÷ 9 = 80℃"}},{"q":"3원 촉매의 산화작용에 주로 사용되는 것은?","o":["납","로듐","백금","실리콘"],"a":2,"e":{"w":["납은 촉매를 망가뜨리는 물질입니다.","로듐은 NOx를 환원시키는 데 씁니다.","실리콘은 촉매 물질이 아닙니다."],"d":"삼원촉매에서 백금(Pt)과 팔라듐(Pd)은 CO와 HC를 산화시키고, 로듐(Rh)은 NOx를 환원시킵니다."}},{"q":"기관 실린더의 마멸조건과 원인으로 가장 관계가 적은 것은?","o":["피스톤 스커트의 접촉","혼합가스 중 이물질에 의한 마모","피스톤링의 호흡작용으로 인한 유막 끊김","연소 생성물에 의한 부식"],"a":0,"e":{"w":["흡입된 혼합가스 속의 먼지와 이물질은 실린더를 갈아 냅니다.","링의 호흡작용으로 유막이 끊기면 금속끼리 닿아 닳습니다.","연소 생성물은 실린더 벽을 부식시킵니다."],"d":"실린더는 주로 피스톤 링과의 마찰, 흡입된 이물질, 유막 끊김, 연소 생성물의 부식으로 닳습니다. 피스톤 스커트는 넓은 면이 유막 위에서 미끄러지므로 마멸과의 관계가 가장 적습니다."}},{"q":"다음 중 크랭크축 오일 간극을 측정하는데 주로 사용되는 것은?","o":["실린더 게이지","플라스틱 게이지","버니어 캘리퍼스","다이얼 게이지"],"a":1,"e":{"w":["실린더 게이지는 실린더의 안지름을 잽니다.","버니어 캘리퍼스로는 좁은 오일 간극을 잴 수 없습니다.","다이얼 게이지는 휨과 유격을 잽니다."],"d":"플라스틱 게이지는 가느다란 플라스틱 실입니다. 저널에 올려놓고 베어링 캡을 규정 토크로 조였다 풀면 눌려서 퍼집니다. 퍼진 폭을 눈금표와 비교해 오일 간극을 읽습니다."}},{"q":"전자제어 연료분사장치 기관의 장점이 아닌 것은?","o":["온도변화에 따라 공연비 보상을 할 수 있다.","대기압의 변화에 따라 공연비 보상을 할 수 있다.","가속 및 감속 시 응답성이 느리다.","유해 배출가스를 줄일 수 있다."],"a":2,"e":{"w":["온도 변화에 따라 공연비를 보상할 수 있습니다. 장점입니다.","대기압 변화에 따라 공연비를 보상할 수 있습니다. 장점입니다.","유해 배출가스를 줄일 수 있습니다. 장점입니다."],"d":"전자제어 연료분사는 센서로 상태를 읽어 바로 분사량을 바꾸므로 가속과 감속 때 응답이 빠릅니다. 응답성이 느리다는 것은 틀린 말입니다."}},{"q":"냉각수 규정 용량이 15ℓ인 라디에이터에 냉각수를 주입하였더니 12ℓ가 주입되어 가득 찼다면 이 경우 라디에이터의 코어막힘률은 얼마인가?","o":["20%","25%","30%","45%"],"a":0,"e":{"w":["25%는 계산과 맞지 않습니다.","30%는 계산과 맞지 않습니다.","45%는 계산과 맞지 않습니다."],"d":"막힘률 = (규정 용량 - 주입량) ÷ 규정 용량 × 100입니다.\n(15 - 12) ÷ 15 × 100 = 20%"}},{"q":"기관에 이상이 있을 때 또는 기관의 성능이 현저하게 저하되었을 때 분해수리의 여부를 결정하기 위한 시험은?","o":["코일의 용량시험","캠각 시험","압축압력 시험","CO 가스측정"],"a":2,"e":{"w":["코일의 용량시험은 점화장치 시험입니다.","캠각 시험은 점화장치 시험입니다.","CO 가스측정은 배출가스 시험입니다."],"d":"압축압력 시험으로 피스톤 링, 실린더, 밸브, 헤드 개스킷의 기밀 상태를 알 수 있습니다. 이 결과로 엔진을 분해 수리할지를 결정합니다."}},{"q":"1ps는 몇 kW인가?","o":["75","736","0.736","1.736"],"a":2,"e":{"w":["75는 1PS를 kgf·m/s로 나타낸 값입니다.","736은 W로 나타낸 값입니다.","1.736은 맞지 않습니다."],"d":"1PS = 75kgf·m/s = 736W = 0.736kW입니다."}},{"q":"현재 사용되고 있는 가솔린 엔진의 열역학적 기본 사이클은?","o":["브리이톤 사이클","행킨 사이클","사바테 사이클","오토 사이클"],"a":3,"e":{"w":["브레이턴 사이클은 가스터빈의 사이클입니다.","랭킨 사이클은 증기 기관의 사이클입니다.","사바테 사이클은 고속 디젤 기관의 사이클입니다."],"d":"가솔린 엔진의 기본 사이클은 오토 사이클(정적 사이클)입니다. 부피가 일정한 상태에서 연소가 일어납니다."}},{"q":"스로틀 밸브 위치 센서의 비정상적인 현상의 발생 시 나타나는 증상이 아닌 것은?","o":["공회전시 엔진 부조 및 주행 시 가속력이 떨어진다.","연료 소모가 적다.","매연이 많이 배출 된다.","공회전시 갑자기 시동이 꺼진다."],"a":1,"e":{"w":["공회전이 불안정하고 가속력이 떨어집니다. 나타나는 증상입니다.","혼합기가 맞지 않아 매연이 많이 나옵니다. 나타나는 증상입니다.","공회전 때 시동이 꺼지기도 합니다. 나타나는 증상입니다."],"d":"스로틀 위치 센서가 고장 나면 ECU가 스로틀 열림을 잘못 알아 연료를 맞게 분사하지 못합니다. 연료 소모는 줄지 않고 오히려 늘어납니다."}},{"q":"전 압송식 급유 방법의 장점이 아닌 것은?","o":["배유관 고장이나 기름통로가 막혀도 급유를 할 수 있다.","크랭크 케이스 내에 윤활유의 양을 적게 하여도 된다.","베어링 면의 유압이 높으므로 항상 급유가 가능하다.","각 주유부의 급유을 일정하게 할 수 있다."],"a":0,"e":{"w":["윤활유의 양을 적게 해도 됩니다. 장점입니다.","베어링 면의 유압이 높아 항상 급유됩니다. 장점입니다.","각 부분에 일정하게 급유할 수 있습니다. 장점입니다."],"d":"전 압송식은 오일펌프의 압력으로 통로를 따라 오일을 보냅니다. 통로가 막히거나 관이 고장 나면 오일이 가지 못해 급유가 되지 않습니다. 이것이 단점입니다."}},{"q":"간접분사방식의 MPI(Multi Point Injection) 연료 분사장치에 인젝터가 설치되는 곳은?","o":["각 실린더 흡입밸브 전방","서지탱크(Surge tank)","스로틀보디(Throttle body)","연소실 중앙"],"a":0,"e":{"w":["서지탱크에는 인젝터를 달지 않습니다.","스로틀보디에 다는 것은 싱글 포인트 방식(SPI)입니다.","연소실에 직접 분사하는 것은 직접분사 방식입니다."],"d":"MPI는 실린더마다 흡입밸브 바로 앞의 흡기 통로에 인젝터를 달아 흡입밸브 쪽으로 분사합니다."}},{"q":"피스톤 평균속도를 높이지 않고 엔진 회전속도를 높이려면?","o":["행정을 작게 한다.","행정을 크게 한다.","실린더 지름을 크게 한다.","실린더 지름을 작게 한다."],"a":0,"e":{"w":["행정을 크게 하면 같은 회전수에서 피스톤 속도가 빨라집니다.","실린더 지름은 피스톤 평균속도와 관계가 없습니다.","실린더 지름은 피스톤 평균속도와 관계가 없습니다."],"d":"피스톤 평균속도 = 2 × 행정 × 회전수 ÷ 60입니다. 행정을 작게 하면 피스톤 속도는 그대로 두고 회전수를 높일 수 있습니다. 그래서 고회전 엔진은 단행정입니다."}},{"q":"탄소 1kg을 완전 연소시키기 위한 순수 산소의 양은?","o":["약 1.67kg","약 2.67kg","약 2.89kg","약 5.56kg"],"a":1,"e":{"w":["1.67kg은 계산과 맞지 않습니다.","2.89kg은 계산과 맞지 않습니다.","5.56kg은 계산과 맞지 않습니다."],"d":"C + O₂ → CO₂ 반응에서 탄소 12kg이 산소 32kg과 결합합니다.\n탄소 1kg에 필요한 산소 = 32 ÷ 12 = 약 2.67kg"}},{"q":"PCV(positive crankcase ventilation)에 대한 설명으로 옳은 것은?","o":["블로바이(blow by) 가스를 대기 중으로 방출하는 시스템이다.","고부하 때에는 블로바이 가스가 공기청정기에서 헤드커버내로 공기가 도입된다.","흡기다기관이 부압일 때는 크랭크케이스에서 헤드커버를 통해 공기청정기로 유입된다.","헤드커버 안의 블로바이 가스는 부하와 관계없이 서지탱크로 흡입되어 연소된다."],"a":3,"e":{"w":["PCV는 블로바이 가스를 대기로 내보내지 않고 다시 태우는 장치입니다.","고부하 때는 블로바이 가스가 헤드커버에서 공기청정기 쪽으로 나가 흡입됩니다. 방향이 반대입니다.","부압일 때는 가스가 PCV 밸브를 통해 흡기다기관으로 들어갑니다."],"d":"블로바이 가스는 저부하 때는 PCV 밸브를 통해, 고부하 때는 브리더 호스를 통해 흡기 쪽으로 들어가 연소됩니다. 부하와 관계없이 항상 다시 태워집니다."}},{"q":"실린더 벽이 마멸되었을 때 나타나는 현상 중 틀린 것은?","o":["엔진오일의 희석 및 마모","피스톤 슬랩 현상 발생","압축압력 저하 및 블로바이 과다발생","연료소모 저하 및 엔진 출력저하"],"a":3,"e":{"w":["새어 내려온 연료가 오일을 희석시킵니다. 나타나는 현상입니다.","간극이 커져 피스톤이 실린더 벽을 때리는 슬랩이 생깁니다. 나타나는 현상입니다.","압축압력이 떨어지고 블로바이가 많아집니다. 나타나는 현상입니다."],"d":"실린더 벽이 닳으면 압축이 새어 출력이 떨어지고, 같은 힘을 내려면 연료가 더 들어갑니다. 연료 소모는 줄지 않고 늘어납니다."}},{"q":"윤활유의 성질에서 요구되는 사항이 아닌 것은?","o":["비중이 적당할 것","인화점 및 발화점이 낮을 것","점성과 온도와의 관계가 양호할 것","카본생성이 적으며, 강인한 유막을 형성할 것"],"a":1,"e":{"w":["비중이 적당해야 합니다. 요구되는 성질입니다.","온도가 변해도 점도 변화가 적어야 합니다. 요구되는 성질입니다.","카본이 적게 생기고 유막이 강해야 합니다. 요구되는 성질입니다."],"d":"윤활유는 뜨거운 엔진 안에서 쓰므로 쉽게 불이 붙으면 안 됩니다. 인화점과 발화점이 높아야 합니다."}},{"q":"캠축과 크랭크축의 타이밍 전동방식이 아닌 것은?","o":["유압 전동방식","기어 전동방식","벨트 전동방식","체인 전동방식"],"a":0,"e":{"w":["기어 전동방식은 기어로 캠축을 돌립니다.","벨트 전동방식은 타이밍 벨트로 캠축을 돌립니다.","체인 전동방식은 타이밍 체인으로 캠축을 돌립니다."],"d":"캠축은 크랭크축과 정확히 맞물려 돌아야 합니다. 기어, 체인, 벨트로 구동하며 유압으로 구동하는 방식은 없습니다."}},{"q":"다음 중 기관 과열의 원인이 아닌 것은?","o":["수온조절기 불량","냉각수 양 과다","라디에이터 캡 불량","냉각팬 모터 고장"],"a":1,"e":{"w":["수온조절기가 불량하면 냉각수가 순환하지 못해 과열됩니다.","라디에이터 캡이 불량하면 압력을 유지하지 못해 과열됩니다.","냉각팬 모터가 고장 나면 과열됩니다."],"d":"냉각수가 많은 것은 과열의 원인이 아닙니다. 과열은 냉각수가 부족하거나 순환이 안 될 때, 바람이 없을 때 일어납니다."}},{"q":"연소의 3요소에 해당되지 않는 것은?","o":["물","공기(산소)","점화원","가연물"],"a":0,"e":{"w":["공기(산소)는 연소의 3요소입니다.","점화원은 연소의 3요소입니다.","가연물은 연소의 3요소입니다."],"d":"연소의 3요소는 탈 물질(가연물), 산소, 점화원입니다. 셋 중 하나만 없어도 불이 붙지 않습니다. 물은 불을 끄는 물질입니다."}},{"q":"기관에서 밸브시트의 침하로 인한 현상이 아닌 것은?","o":["밸브스프링의 장력이 커짐","가스의 저항이 커짐","밸브 닫힘이 완전하지 못함","블로우 바이 현상이 일어남"],"a":0,"e":{"w":["통로가 좁아져 가스의 저항이 커집니다. 나타나는 현상입니다.","밸브가 완전히 닫히지 못합니다. 나타나는 현상입니다.","밸브가 밀착되지 않아 가스가 샙니다. 나타나는 현상입니다."],"d":"밸브시트가 내려앉으면 밸브가 더 깊이 들어갑니다. 스프링이 덜 눌린 상태가 되어 장력은 커지지 않고 오히려 약해집니다."}},{"q":"신품 라디에이터의 냉각수 용량이 20ℓ이었는데 사용 중인 동일 라디에이터에 물을 넣으니 14ℓ가 들어갔다. 이 라디에이터 코어의 막힘은 몇 %인가?","o":["20%","25%","30%","35%"],"a":2,"e":{"w":["20%는 계산과 맞지 않습니다.","25%는 계산과 맞지 않습니다.","35%는 계산과 맞지 않습니다."],"d":"막힘률 = (신품 용량 - 주입량) ÷ 신품 용량 × 100입니다.\n(20 - 14) ÷ 20 × 100 = 30%"}},{"q":"배기 장치에는 각 실린더로부터 배출되는 연소 가스를 모으는 장치가 있다. 여기에 해당하는 것은?","o":["배기 소음기","배출 기관 정화 장치","배기 다기관","배기밸브"],"a":2,"e":{"w":["배기 소음기는 소음을 줄이는 장치입니다.","정화 장치는 유해가스를 줄이는 장치입니다.","배기밸브는 실린더의 배기 통로를 여닫는 밸브입니다."],"d":"배기 다기관(매니폴드)은 각 실린더에서 나오는 배기가스를 하나로 모아 배기관으로 보내는 관입니다."}},{"q":"인체에 유해한 가스로 연료가 불완전 연소할 때 많이 발생하는 무색, 무취의 가스는?","o":["CO","HC","NOx","CO₂"],"a":0,"e":{"w":["HC는 타지 않은 연료로 냄새가 납니다.","NOx는 고온에서 생기며 자극적인 냄새가 납니다.","CO₂는 완전연소할 때 나옵니다."],"d":"일산화탄소(CO)는 산소가 부족해 불완전 연소할 때 많이 나옵니다. 색과 냄새가 없어 알아차리기 어렵고, 들이마시면 중독됩니다."}},{"q":"연료파이프나 연료펌프에서 가솔린이 증발해서 일으키는 현상은?","o":["엔진록","연료록","베이퍼록","앤티록"],"a":2,"e":{"w":["엔진록은 엔진이 굳어 돌지 않는 것입니다.","연료록이라는 용어는 쓰지 않습니다.","앤티록은 바퀴 잠김을 막는 것(ABS)입니다."],"d":"연료 파이프나 펌프가 뜨거워지면 가솔린이 끓어 기포가 생깁니다. 기포가 통로를 막아 연료가 흐르지 못하는 현상이 베이퍼록입니다."}},{"q":"블로우다운(blow down) 현상에 대한 설명으로 옳은 것은?","o":["밸브와 밸브시트 사이에서의 가스 누출현상","압축행정시 피스톤과 실린더 사이에서 공기가 누출되는 현상","피스톤이 상사점 근방에서 흡배기밸브가 동시에 열려 배기 잔류가스를 배출시키는 현상","배기행정 초기에 배기밸브가 열려 배기가스 자체의 압력에 의하여 배기가스가 배출되는 현상"],"a":3,"e":{"w":["밸브와 시트 사이로 새는 것은 밸브 누설입니다.","피스톤과 실린더 사이로 새는 것은 블로바이입니다.","흡·배기 밸브가 동시에 열리는 것은 밸브 오버랩입니다."],"d":"블로다운은 폭발행정이 끝나기 전에 배기밸브가 열려, 배기가스가 자체 압력으로 빠져나가는 현상입니다."}},{"q":"가솔린 기관의 전자제어 연료분사 장치를 구성 하는 부품이 아닌 것은?","o":["연료압력조절기","인젝터","웨스트게이트 밸브","ECU"],"a":2,"e":{"w":["연료압력조절기는 연료분사 장치의 부품입니다.","인젝터는 연료분사 장치의 부품입니다.","ECU는 연료분사 장치의 부품입니다."],"d":"웨스트게이트 밸브는 과급 압력을 조절하는 밸브입니다. 연료분사 장치의 부품이 아닙니다."}},{"q":"촉매변환장치에서 촉매장치의 종류가 아닌 것은?","o":["산화촉매","환원촉매","삼원촉매","팰릿촉매"],"a":3,"e":{"w":["산화촉매는 CO와 HC를 줄입니다.","환원촉매는 NOx를 줄입니다.","삼원촉매는 CO, HC, NOx를 함께 줄입니다."],"d":"촉매의 종류는 하는 일에 따라 산화촉매, 환원촉매, 삼원촉매로 나눕니다. 펠릿은 촉매를 담는 담체의 모양(알갱이형)을 말하는 것이지 촉매의 종류가 아닙니다."}},{"q":"전자제어식 연료 분사 장치의 주요 구성부품 중 흡입 공기량을 검출하는 장치는?","o":["연료 압력 조정기","ECU","공기 유량 센서","냉각 수온 센서"],"a":2,"e":{"w":["연료 압력 조정기는 연료 압력을 일정하게 합니다.","ECU는 계산하고 제어하는 장치입니다.","냉각 수온 센서는 냉각수 온도를 검출합니다."],"d":"공기 유량 센서(AFS)는 엔진으로 들어오는 공기의 양을 검출합니다. ECU는 이 값으로 기본 연료 분사량을 정합니다."}},{"q":"냉각수 온도 센서(WTS)의 고장이 발생 되었을 때 나타날 수 있는 증상이 아닌 것은?","o":["공회전 시 엔진부조가 발생하지 않는다.","주행 중 가속력이 저하된다.","연료 소모가 많다.","매연이 배출된다."],"a":0,"e":{"w":["가속력이 떨어집니다. 나타나는 증상입니다.","연료를 필요 이상으로 분사해 연료 소모가 많아집니다. 나타나는 증상입니다.","혼합기가 진해져 매연이 나옵니다. 나타나는 증상입니다."],"d":"수온 센서가 고장 나면 ECU가 온도를 잘못 알아 연료량을 맞추지 못합니다. 공회전 때 엔진이 떨리는 부조가 발생합니다. 발생하지 않는다는 ①이 틀렸습니다."}},{"q":"전자제어 기관에서 피드백(Feed Back)제어를 하기 위해 설치한 센서는?","o":["아이들 포지션 센서","산소(O₂)센서","대기압 센서","스로틀 포지션 센서"],"a":1,"e":{"w":["아이들 포지션 센서는 스로틀이 닫혔는지 알려 줍니다.","대기압 센서는 고도 보정에 씁니다.","스로틀 포지션 센서는 스로틀 열림을 알려 줍니다."],"d":"산소센서는 배기가스 속의 산소 농도를 재서 혼합기가 진한지 엷은지를 ECU에 알려 줍니다. ECU는 이 신호로 분사량을 다시 고칩니다. 이것이 피드백 제어입니다."}},{"q":"가솔린 기관에서 노크 센서를 설명한 것으로 틀린 것은?","o":["엔진의 노킹을 감지하여 이를 미소한 전압으로 변환해서 ECU로 보낸다.","엔진의 유효 출력을 효율적으로 얻을 수 있도록 신호를 보낸다.","엔진의 노킹이 발생 되면 점화시기를 진각 시킨다.","엔진의 노킹이 발생 되면 점화시기를 지각 시킨다."],"a":2,"e":{"w":["노킹의 진동을 감지해 작은 전압으로 바꿉니다. 옳은 설명입니다.","노킹 직전까지 점화시기를 유지해 출력을 효율적으로 얻게 합니다. 옳은 설명입니다.","노킹이 발생하면 점화시기를 늦춥니다(지각). 옳은 설명입니다."],"d":"노킹이 생기면 ECU는 점화시기를 늦춰(지각) 노킹을 없앱니다. 앞당기면(진각) 노킹이 더 심해지므로 ③이 틀렸습니다."}},{"q":"주행 속도를 검출하여 가․감속도를 감지하는 것은?","o":["차속센서","크랭크각센서","TDC센서","중력센서"],"a":0,"e":{"w":["크랭크각센서는 엔진 회전수와 크랭크축 위치를 검출합니다.","TDC센서는 상사점 위치를 검출합니다.","중력센서는 기울기와 가속도를 검출합니다."],"d":"차속센서는 주행 속도를 검출합니다. 속도가 얼마나 빨리 변하는지를 보면 가속과 감속의 정도도 알 수 있습니다."}},{"q":"냉각장치의 제어장치를 점검, 정비할 때 설명으로 틀린 것은?","o":["냉각팬 단품 점검시 손으로 만지지 않는다.","전자제어 유닛에는 직접 12V를 연결한다.","기관이 정상 온도일 때 각 부품을 점검한다.","각 부품을 점화스위치 OFF 상태에서 축전지(-) 케이블을 탈거한 후 정비한다."],"a":1,"e":{"w":["냉각팬은 갑자기 돌 수 있어 손으로 만지지 않습니다. 옳은 설명입니다.","정상 온도일 때 각 부품을 점검합니다. 옳은 설명입니다.","점화스위치를 끄고 축전지 (-)단자를 분리한 상태에서 작업합니다. 옳은 설명입니다."],"d":"전자제어 유닛(ECU)은 정밀한 전자 부품입니다. 12V를 직접 연결하면 내부 회로가 손상됩니다."}},{"q":"냉각수 온도센서 고장 시 엔진에 미치는 영향으로 틀린 것은?","o":["공회전상태가 불안정하게 된다.","워밍업 시기에 검은 연기가 배출될 수 있다.","배기가스 중에 CO 및 HC가 증가 된다.","냉간 시동성이 양호하다."],"a":3,"e":{"w":["공회전이 불안정해집니다. 옳은 설명입니다.","워밍업 때 혼합기가 진해 검은 연기가 나올 수 있습니다. 옳은 설명입니다.","CO와 HC가 늘어납니다. 옳은 설명입니다."],"d":"수온센서가 고장 나면 ECU가 엔진이 찬 것을 알지 못해 시동할 때 연료를 더 주지 못합니다. 냉간 시동성이 나빠지므로 양호하다는 ④가 틀렸습니다."}},{"q":"기관의 윤활유 유압이 높을 때의 원인과 관계없는 것은?","o":["베어링과 축의 간격이 클 때","유압조정 밸브스프링의 장력이 강할 때","오일 파이프의 일부가 막혔을 때","윤활유의 점도가 높을 때"],"a":0,"e":{"w":["조정 밸브 스프링이 강하면 유압이 높아집니다.","통로가 막히면 유압이 높아집니다.","점도가 높으면 유압이 높아집니다."],"d":"베어링과 축의 간격이 크면 그 틈으로 오일이 쉽게 빠져나가 유압이 낮아집니다. 유압이 높아지는 원인이 아닙니다."}},{"q":"부동액 성분의 하나로 비등점이 197.2℃, 응고점이 -50℃인 불연성 포화액인 물질은?","o":["에틸렌글리콜","메탄올","글리세린","변성 알코올"],"a":0,"e":{"w":["메탄올은 끓는점이 낮아 잘 증발합니다.","글리세린은 값이 비싸 잘 쓰지 않습니다.","변성 알코올은 끓는점이 낮습니다."],"d":"에틸렌글리콜은 끓는점이 197.2℃로 높아 잘 증발하지 않고, 물과 섞으면 -50℃까지 얼지 않습니다. 불에 타지 않아 부동액으로 가장 많이 씁니다."}},{"q":"가솔린을 완전 연소시키면 발생되는 화합물은?","o":["이산화탄소와 아황산","이산화탄소와 물","일산화탄소와 이산화탄소","일산화탄소와 물"],"a":1,"e":{"w":["가솔린에는 황이 거의 없어 아황산이 주된 생성물이 아닙니다.","일산화탄소는 불완전 연소할 때 나옵니다.","일산화탄소는 불완전 연소할 때 나옵니다."],"d":"가솔린은 탄소(C)와 수소(H)로 이루어져 있습니다. 완전히 타면 탄소는 이산화탄소(CO₂)가 되고 수소는 물(H₂O)이 됩니다."}},{"q":"피스톤 간극이 크면 나타나는 현상이 아닌 것은?","o":["블로바이가 발생한다.","압축압력이 상승한다.","피스톤 슬랩이 발생한다.","기관의 기동이 어려워진다."],"a":1,"e":{"w":["틈으로 가스가 새는 블로바이가 생깁니다. 나타나는 현상입니다.","피스톤이 실린더 벽을 때리는 슬랩이 생깁니다. 나타나는 현상입니다.","압축이 새어 시동이 어려워집니다. 나타나는 현상입니다."],"d":"피스톤 간극이 크면 그 틈으로 압축가스가 샙니다. 압축압력은 올라가지 않고 떨어집니다."}},{"q":"가솔린 기관의 연료펌프에서 연료라인내의 압력이 과도하게 상승하는 것을 방지하기 위한 장치는?","o":["체크밸브(Check Valve)","릴리프밸브(Relief Valve)","니들밸브(Needle Valve)","사일렌서(Silencer)"],"a":1,"e":{"w":["체크밸브는 엔진을 끈 뒤 잔압을 유지하는 밸브입니다.","니들밸브는 기화기의 유면을 조절하는 밸브입니다.","사일렌서는 소음을 줄이는 장치입니다."],"d":"릴리프밸브는 연료 압력이 정해진 값을 넘으면 열려 연료를 되돌려 보냅니다. 압력이 지나치게 오르는 것을 막는 안전밸브입니다."}},{"q":"4행정 기관에서 흡기밸브의 열림각은 242˚, 배기밸브의 열림각은 274˚, 흡기 밸브의 열림 시작점은 BTDC 13˚, 배기밸브의 닫힘 점은 ATDC 16˚ 이었을 때 흡기밸브의 닫힘 시점은?","o":["ABDC 20˚","ABDC 37˚","ABDC 42˚","ABDC 49˚"],"a":3,"e":{"w":["20˚는 계산과 맞지 않습니다.","37˚는 계산과 맞지 않습니다.","42˚는 계산과 맞지 않습니다."],"d":"흡기밸브 열림각 = 열림 시작(상사점 전) 센서입니다.","BPS는 대기압 센서입니다.","ISC는 공회전 속도 조절 장치입니다."],"d":"흡입공기량 센서는 Air Flow Sensor를 줄여 AFS라고 합니다."}},{"q":"기관에서 윤활의 목적이 아닌 것은?","o":["마찰과 마멸감소","응력집중작용","밀봉작용","세척작용"],"a":1,"e":{"w":["마찰과 마멸을 줄이는 것은 윤활의 목적입니다.","밀봉작용은 윤활의 목적입니다.","세척작용은 윤활의 목적입니다."],"d":"윤활유는 힘이 한곳에 몰리지 않도록 퍼뜨리는 응력 분산 작용을 합니다. 응력을 한곳에 모으는 응력집중작용은 윤활의 목적이 아닙니다."}},{"q":"기관오일의 보충 또는 교환시 가장 주의할 점으로 옳은 것은?","o":["점도가 다른 것은 서로 섞어서 사용하지 않는다.","될 수 있는 한 많이 주유한다.","소량의 물이 섞여도 무방하다.","제조회사가 관계없이 보충한다."],"a":0,"e":{"w":["너무 많이 넣으면 저항이 커지고 오일이 연소실로 올라갑니다.","물이 섞이면 윤활 성능이 떨어집니다.","제조회사마다 첨가제가 달라 섞으면 성능이 떨어질 수 있습니다."],"d":"오일을 보충하거나 교환할 때는 점도와 규격이 같은 오일을 써야 합니다. 점도가 다른 오일을 섞으면 제 성능을 내지 못합니다."}},{"q":"4실린더 기관에서 피스톤당 3개의 링이 있고, 1개의 링의 마찰력을 0.5kgf라면 총 마찰력 kgf는?","o":["1","1.5","6","12"],"a":2,"e":{"w":["1은 계산과 맞지 않습니다.","1.5는 피스톤 1개의 마찰력입니다.","12는 계산과 맞지 않습니다."],"d":"총 마찰력 = 링 1개의 마찰력 × 피스톤당 링 수 × 실린더 수입니다.\n0.5 × 3 × 4 = 6kgf"}},{"q":"O₂센서 점검 관련 사항으로 적절치 못한 것은?","o":["기관을 워밍업한 후 점검한다.","출력전압을 쇼트시키지 않는다.","출력전압 측정은 아날로그 시험기로 측정한다.","O₂센서의 출력전압이 규정을 벗어나면 공연비 조정계통에 점검이 필요하다."],"a":2,"e":{"w":["산소센서는 뜨거워져야 작동하므로 워밍업한 뒤 점검합니다. 옳은 내용입니다.","출력전압을 쇼트시키면 센서가 손상됩니다. 옳은 내용입니다.","출력전압이 규정을 벗어나면 공연비 조정 계통을 점검합니다. 옳은 내용입니다."],"d":"산소센서의 출력전압은 1V 이하로 아주 작습니다. 아날로그 시험기는 내부 저항이 낮아 센서를 손상시킬 수 있으므로 디지털 시험기로 측정합니다."}},{"q":"공회전 속도조절 장치로 볼 수 없는 것은?","o":["로터리밸브 액추에이터","ISC(Idle Speed Control) 액추에이터","ISA(Idle Speed Adjust) 스텝 모터","아이들 스위치"],"a":3,"e":{"w":["로터리밸브 액추에이터는 공회전 속도를 조절하는 장치입니다.","ISC 액추에이터는 공회전 속도를 조절하는 장치입니다.","ISA 스텝 모터는 공회전 속도를 조절하는 장치입니다."],"d":"아이들 스위치는 스로틀밸브가 닫혀 공회전 상태인지를 알려 주는 스위치입니다. 신호만 보낼 뿐 속도를 조절하지는 않습니다."}},{"q":"전자제어 가솔린 분사기관에 냉시동용 인젝터가 설치된 목적은?","o":["고속시 출력증대","원활한 급가속","저온 시동성 향상","배기가스 정화대책"],"a":2,"e":{"w":["고속 출력과는 관계가 없습니다.","급가속과는 관계가 없습니다.","배기가스 정화가 목적이 아닙니다."],"d":"엔진이 차가울 때는 연료가 잘 기화하지 않아 시동이 어렵습니다. 냉시동용 인젝터가 연료를 더 분사해 저온에서 시동이 잘 걸리게 합니다."}},{"q":"가솔린 전자제어 기관에서 사용되는 공기유량 센서의 종류가 아닌 것은?","o":["볼 순환식 센서","베인식 센서","칼만 와류식 센서","열선식 센서"],"a":0,"e":{"w":["베인식은 공기가 밀어 여는 판의 각도로 공기량을 잽니다.","칼만 와류식은 공기 흐름에
