 아닙니다."],"d":"DCT는 한쪽 클러치가 끊어질 때 다른 쪽 클러치가 이어지므로 동력이 끊기지 않고 빠르게 변속됩니다."}},{"q":"CVT(무단변속기) 장착 스쿠터에서 스로틀 개도 증가로 엔진 회전수가 상승할 때 드라이브 풀리의 반응은?","o":["풀리 유효 직경 축소","풀리 유효 직경 증대 (웨이트 롤러 원심력)","풀리 회전 급정지","V벨트 장력 완전 해제"],"a":1,"e":{"w":["유효 지름이 작아지는 것은 저속일 때입니다.","풀리는 엔진과 함께 계속 회전합니다.","벨트 장력이 풀리면 동력이 전달되지 않습니다."],"d":"엔진 회전수가 오르면 웨이트 롤러가 원심력으로 바깥쪽으로 밀려나 드라이브 풀리의 폭을 좁힙니다. V벨트가 풀리의 바깥쪽으로 올라가 드라이브 풀리의 유효 지름이 커집니다.\n반대로 드리븐 풀리는 유효 지름이 작아져 고속 쪽 변속비가 됩니다."}}]},{"g":"동력전달장치","name":"드라이브 라인(체인·벨트·샤프트)","id":"p07","qs":[{"q":"다음은 오토바이 동력전달장치에서 벨트 방식 특징이 아닌 것은?","o":["소음 감소","벨트의 유연성","동력 손실이 발생하지 않는다.","한계 토크가 발생하여 고출력 엔진에는 적합하지 않다."],"a":2,"e":{"w":["벨트는 고무 재질이라 금속 체인보다 조용합니다. 벨트 방식의 특징이 맞습니다.","벨트는 유연해서 충격을 부드럽게 받아 줍니다. 특징이 맞습니다.","벨트는 전달할 수 있는 토크에 한계가 있어 고출력 엔진에는 맞지 않습니다. 특징이 맞습니다."],"d":"벨트 방식도 벨트와 풀리 사이의 미끄러짐과 마찰 때문에 동력 손실이 생깁니다. 손실이 전혀 없는 동력전달 방식은 없으므로 \"동력 손실이 발생하지 않는다\"가 틀린 설명입니다."}},{"q":"이륜자동차 체인 윤활 시, 사용하는 오일의 목적은?","o":["체인 무게 감소","체인 마모 가속화","스프로킷 마모 가속화","체인의 녹 방지"],"a":3,"e":{"w":["오일을 발라도 체인의 무게는 줄지 않습니다.","윤활은 마모를 늦추는 것이지 빠르게 하는 것이 아닙니다.","윤활하면 스프로킷의 마모도 줄어듭니다."],"d":"체인은 금속이라 물과 습기에 닿으면 녹이 습니다. 윤활유는 표면에 막을 만들어 녹을 막고, 핀과 롤러 사이의 마찰을 줄여 마모와 소음도 줄입니다."}},{"q":"이륜자동차 구동 계통에서 스프로킷과 체인의 마모 상태를 점검할 때, 가장 중요하게 확인해야 할 것은?","o":["스프로킷의 고정볼트","체인 무게","스프로킷의 이빨 손상","체인 아우터 플레이트 개수"],"a":2,"e":{"w":["고정볼트는 풀림을 점검하는 항목이지 마모 상태를 보는 곳이 아닙니다.","체인의 무게로는 마모를 알 수 없습니다.","플레이트 개수는 체인 길이에 따라 정해진 값이라 마모와 관계가 없습니다."],"d":"스프로킷은 체인과 맞물리는 이빨이 닳습니다. 이빨이 뾰족해지거나 한쪽으로 휘었는지, 깨진 곳이 없는지를 가장 먼저 봅니다. 이빨이 손상되면 체인이 제대로 물리지 않아 빠질 수 있습니다."}},{"q":"이륜자동차 체인 및 스프로킷 세트를 교체할 때, 가장 중요하게 고려해야 할 사항이 아닌 것은?","o":["스프로킷의 휨 상태","체인 및 스프로킷의 색상","체인 고리의 연결 상태","체인 사이즈, 스프로킷 잇수"],"a":1,"e":{"w":["스프로킷이 휘면 체인이 한쪽으로 닳고 빠질 수 있어 꼭 확인합니다.","체인 연결 고리(조인트)가 제대로 끼워졌는지는 안전에 직결됩니다.","체인 규격과 스프로킷 잇수가 맞아야 장착되고 감속비도 유지됩니다."],"d":"체인과 스프로킷은 규격, 잇수, 휨, 연결 상태처럼 기능과 안전에 관계된 것을 확인합니다. 색상은 성능과 아무 관계가 없으므로 고려할 사항이 아닙니다."}},{"q":"이륜자동차의 앞바퀴 스프로킷이나 뒷바퀴 스프로킷의 이빨이 뾰족하게 닳았다면 무엇을 해야 하나?","o":["그대로 계속 탄다.","뾰족한 부분을 줄로 갈아낸다.","기름만 듬뿍 바른다.","체인과 스프로킷을 모두 새것으로 바꾼다."],"a":3,"e":{"w":["뾰족해진 이빨은 체인을 제대로 잡지 못해 체인이 빠질 수 있습니다.","줄로 갈아 내면 이빨이 더 작아져 맞물림이 더 나빠집니다.","윤활로는 이미 닳은 이빨이 되돌아오지 않습니다."],"d":"이빨이 뾰족하게 닳았다면 수명이 다한 것입니다. 체인과 스프로킷은 서로 맞물려 함께 닳으므로, 한쪽만 바꾸면 새 부품이 빨리 닳습니다. 그래서 체인과 앞뒤 스프로킷을 세트로 교환합니다."}},{"q":"이륜자동차에서 체인 정비 시 가장 중요하게 확인해야 할 것은?","o":["체인의 유격","체인의 규격","체인의 무게","체인의 색상"],"a":0,"e":{"w":["규격은 교체할 때 확인하는 것이고, 평소 정비에서는 유격이 먼저입니다.","무게는 정비 점검 항목이 아닙니다.","색상은 성능과 관계가 없습니다."],"d":"체인은 쓰는 동안 늘어나므로 유격(처짐량)을 규정값에 맞추는 것이 가장 중요합니다. 너무 느슨하면 체인이 빠지고, 너무 팽팽하면 체인과 베어링이 빨리 닳습니다."}},{"q":"이륜자동차에서 엔진의 동력을 뒷바퀴에 전달하는 가장 일반적인 방식은?","o":["와이어 케이블","파이프","체인 드라이브","강철 막대"],"a":2,"e":{"w":["와이어 케이블은 클러치나 스로틀을 조작하는 데 씁니다.","파이프는 동력을 전달하지 못합니다.","강철 막대는 동력전달 방식이 아닙니다."],"d":"이륜자동차는 변속기 출력축의 앞 스프로킷과 뒷바퀴 스프로킷을 체인으로 연결하는 체인 드라이브를 가장 많이 씁니다. 구조가 간단하고 가벼우며 동력 전달 효율이 높기 때문입니다."}},{"q":"이륜자동차 동력전달장치에서 드라이브 샤프트 방식이 주로 사용되는 이륜자동차의 특징은?","o":["높은 성능의 스포츠 바이크","투어링 바이크","오프로드 바이크","소형 스쿠터"],"a":1,"e":{"w":["스포츠 바이크는 가볍고 효율이 높은 체인을 주로 씁니다.","오프로드 바이크는 충격에 강하고 가벼운 체인을 씁니다.","소형 스쿠터는 벨트(CVT) 방식을 주로 씁니다."],"d":"드라이브 샤프트 방식은 축과 기어로 동력을 전달합니다. 무겁지만 조용하고 유지보수가 적어, 장거리를 달리는 투어링 바이크에 주로 씁니다."}},{"q":"이륜자동차 동력전달장치에서 벨트 드라이브 방식의 가장 큰 장점은?","o":["오염에 매우 강하다.","끊어져도 수리가 매우 쉽다.","벨트에 윤활하기가 매우 쉽다.","체인 드라이브 대비 소음과 진동이 적다."],"a":3,"e":{"w":["벨트는 돌이나 모래가 끼면 손상되기 쉬워 오염에 강하다고 할 수 없습니다.","벨트는 끊어지면 이어 붙일 수 없고 통째로 교환해야 합니다.","벨트는 윤활을 하지 않습니다."],"d":"벨트 드라이브는 고무 재질의 벨트가 풀리와 맞물려 돌기 때문에 금속끼리 부딪치는 체인보다 소음과 진동이 적습니다. 윤활이 필요 없다는 것도 장점입니다."}},{"q":"이륜자동차 구동 체인에서 O-링의 역할은?","o":["체인 핀과 부싱 사이에 윤활유를 밀봉한다.","핀과 핀을 연결하며 체인의 강도를 담당한다.","링크의 구부러짐을 지지하는 역할을 한다.","스프로킷과의 마찰에 의한 충격을 흡수하는 역할을 한다."],"a":0,"e":{"w":["핀과 핀을 연결해 강도를 맡는 것은 플레이트입니다.","링크가 구부러지는 것을 지지하는 것은 핀과 부싱입니다.","스프로킷과 닿아 충격을 받는 것은 롤러입니다."],"d":"O-링은 안쪽 플레이트와 바깥 플레이트 사이에 끼운 고무 링입니다. 핀과 부싱 사이에 넣어 둔 그리스가 빠져나가지 않게 막고, 먼지와 물이 들어가는 것도 막아 체인 수명을 늘립니다."}},{"q":"X-링 체인이 O-링 체인보다 더 높은 동력전달 효율을 가질 수 있는 이유는?","o":["더 많은 윤활유를 저장하기 때문에","접촉 면적을 줄여 마찰 저항이 감소하기 때문에","체인 피치가 더 길기 때문에","X-링이 O-링보다 개수가 많아서"],"a":1,"e":{"w":["윤활유를 머금는 것은 수명에 도움이 되는 점이고, 효율이 높은 이유는 아닙니다.","체인 피치는 씰의 종류와 관계가 없습니다.","씰의 개수는 O-링 체인과 같습니다."],"d":"X-링은 단면이 X자 모양이라 플레이트에 닿는 면적이 O-링보다 작습니다. 닿는 면적이 작으면 체인이 구부러질 때 마찰 저항이 줄어 동력전달 효율이 높아집니다."}},{"q":"중형 오토바이에 일반적으로 가장 많이 사용하는 방식은?","o":["체인 방식","벨트 방식","샤프트 방식","기어 방식"],"a":0,"e":{"w":["벨트 방식은 스쿠터나 일부 크루저에 씁니다.","샤프트 방식은 대형 투어링 바이크에 주로 씁니다.","기어만으로 뒷바퀴를 구동하는 방식은 일반적이지 않습니다."],"d":"중형 오토바이는 가볍고 효율이 높으며 감속비를 바꾸기 쉬운 체인 방식을 가장 많이 씁니다."}},{"q":"이륜자동차 엔진에서 만든 힘을 바퀴로 전달하는 장치를 무엇이라고 하는가?","o":["제동장치","현가장치","조향장치","동력전달장치"],"a":3,"e":{"w":["제동장치는 속도를 줄이거나 멈추는 장치입니다.","현가장치는 노면 충격을 흡수하는 장치입니다.","조향장치는 진행 방향을 바꾸는 장치입니다."],"d":"엔진에서 만든 힘을 클러치, 변속기, 체인(또는 벨트, 샤프트)을 거쳐 바퀴까지 전달하는 장치 전체를 동력전달장치라고 합니다."}},{"q":"이륜자동차 구동 체인에 윤활유를 주기적으로 도포하는 이유는?","o":["체인과 스프로킷의 마찰과 마모를 줄이기 위해","체인의 마찰을 늘리기 위해","스프로킷의 마찰열을 늘리기 위해","체인보다 스프로킷의 마모가 빠르게 진행되게 하기 위해"],"a":0,"e":{"w":["윤활은 마찰을 줄이기 위한 것입니다.","마찰열을 늘리면 부품이 더 빨리 상합니다.","윤활은 체인과 스프로킷의 마모를 함께 줄입니다."],"d":"체인은 핀, 부싱, 롤러가 계속 움직이고 스프로킷 이빨과 맞물립니다. 윤활유를 주기적으로 바르면 금속끼리의 마찰과 마모가 줄어 체인과 스프로킷의 수명이 늘어납니다."}},{"q":"이륜자동차 드라이브 샤프트 방식의 동력전달장치에서 주기적으로 점검해야 할 요소는?","o":["체인 장력","스프로킷 장력","스프로킷의 이빨 마모","샤프트 내부의 그리스 상태"],"a":3,"e":{"w":["샤프트 방식에는 체인이 없습니다.","샤프트 방식에는 스프로킷이 없습니다.","샤프트 방식에는 스프로킷 이빨이 없습니다."],"d":"드라이브 샤프트 방식은 축과 기어가 케이스 안에서 돌아갑니다. 체인처럼 장력을 조절할 필요는 없지만, 내부 윤활유(그리스, 기어 오일)의 상태와 누유는 주기적으로 점검해야 합니다."}},{"q":"이륜자동차 체인에 윤활유를 바르는 이유는?","o":["체인 장력을 늘리기 위해","체인 소음을 줄이고 마모 방지를 위해","스프로킷의 장력을 줄이기 위해","체인이 더 빠르게 움직이게 하기 위해"],"a":1,"e":{"w":["윤활로 장력이 바뀌지는 않습니다.","스프로킷에는 장력이 없습니다.","윤활한다고 체인 속도가 빨라지지 않습니다."],"d":"윤활유는 금속이 맞닿는 곳에 막을 만들어 소음을 줄이고 마모를 막습니다. 녹을 막는 효과도 있습니다."}},{"q":"이륜자동차 엔진의 힘을 뒷바퀴로 전달해주는 장치는 무엇인가?","o":["와이어","파이프","체인","로프"],"a":2,"e":{"w":["와이어는 조작용 케이블에 씁니다.","파이프는 동력을 전달하지 못합니다.","로프는 이륜자동차 동력전달에 쓰지 않습니다."],"d":"변속기에서 나온 엔진의 힘은 앞 스프로킷, 체인, 뒤 스프로킷을 거쳐 뒷바퀴로 전달됩니다."}},{"q":"이륜자동차 동력전달장치 정비 시, 클리닝 작업이 특히 중요한 부품이 아닌 것은?","o":["종감속 기어","스프로킷","클러치 커버 내부","구동 체인"],"a":0,"e":{"w":["스프로킷은 밖에 드러나 있어 흙과 낡은 윤활유가 붙으므로 닦아야 합니다.","클러치 커버 안쪽은 마모 가루가 쌓이므로 손실이 매우 큰 것은 이점이 될 수 없습니다.","샤프트 방식에는 체인이 없어 이탈할 일이 없습니다."],"d":"샤프트 드라이브는 축과 기어가 밀폐된 케이스 안에서 돌아갑니다. 그래서 유지보수가 간편하고, 흙이나 물 같은 오염에 강하며, 소음이 적습니다."}},{"q":"이륜자동차 체인 스프로킷 마모 상태를 점검할 때, 가장 먼저 확인해야 할 부분은?","o":["스프로킷의 제조사 각인 상태","스프로킷 이빨의 날카로운 상태","스프로킷의 이빨 개수","스프로킷의 전체적인 크기"],"a":1,"e":{"w":["제조사 각인은 마모와 관계가 없습니다.","이빨 개수는 닳아도 변하지 않습니다.","전체 크기로는 마모를 판단할 수 없습니다."],"d":"스프로킷이 닳으면 이빨 끝이 날카롭고 뾰족해집니다. 그래서 이빨의 모양, 특히 끝이 날카로워졌는지를 가장 먼저 봅니다."}},{"q":"이륜자동차 동력전달장치 정비 시, 토크렌치 사용이 필요 없는 곳은?","o":["엔진 마운트 볼트","스프로킷 너트","체인 커버 고정 볼트","스윙암 피벗 볼트"],"a":2,"e":{"w":["엔진 마운트 볼트는 엔진을 프레임에 고정하므로 규정 토크로 조입니다.","스프로킷 너트는 동력이 걸리는 곳이라 규정 토크로 조입니다.","스윙암 피벗 볼트는 뒷바퀴를 지지하므로 규정 토크로 조입니다."],"d":"큰 힘을 받거나 안전에 직결되는 체결부는 토크렌치로 규정 토크를 지켜 조입니다. 체인 커버는 덮개를 고정하는 작은 볼트라 토크렌치까지 쓰지 않아도 됩니다."}},{"q":"이륜자동차 구동 체인에서 피치의 의미는?","o":["체인 전체의 길이","체인 롤러의 중심 간 거리(핀 중심 간의 거리)","롤러의 바깥지름 크기","핀의 직경 크기"],"a":1,"e":{"w":["체인 전체의 길이는 링크 수로 나타냅니다.","롤러의 바깥지름은 피치가 아닙니다.","핀의 지름은 피치가 아닙니다."],"d":"피치는 이웃한 핀(롤러) 중심에서 다음 핀 중심까지의 거리입니다. 체인 규격을 정하는 기본 치수이며, 스프로킷 이빨의 간격과 맞아야 합니다."}},{"q":"씰이 없는 표준 체인이 씰 체인(O-링, X-링)보다 일반적으로 가지는 장점은?","o":["가볍고 동력 손실이 적다.","유지보수가 매우 편리하다.","씰이 없어 수명이 훨씬 길다.","윤활이 필요 없어 녹 발생에 강하다."],"a":0,"e":{"w":["표준 체인은 그리스를 가두는 씰이 없어 윤활을 더 자주 해야 합니다.","씰이 없으면 윤활유가 빨리 빠져 수명이 짧습니다.","표준 체인은 윤활이 꼭 필요하고 녹에도 약합니다."],"d":"표준 체인은 고무 씰이 없어서 가볍고, 씰이 플레이트에 닿으며 생기는 마찰이 없어 동력 손실이 적습니다. 대신 윤활과 청소를 자주 해야 합니다."}},{"q":"다음 중 링 체인의 설명으로 옳은 것은?","o":["조정이 불가능하여 체인이 늘어나면 교체해야 된다.","유지보수가 필요 없어 다양한 오토바이에 사용된다.","플레이트 안쪽에 고무링이 있어 윤활력이 오래 지속된다.","대부분 폴리우레탄으로 제조되어 소음이 적고 가격이 저렴하다."],"a":2,"e":{"w":["체인은 장력을 조정할 수 있습니다. 조정할 수 없는 것은 벨트 쪽 설명입니다.","링 체인도 청소와 윤활 같은 유지보수가 필요합니다.","폴리우레탄으로 만들어 소음이 적은 것은 벨트입니다."],"d":"링 체인(O-링, X-링 체인)은 플레이트 안쪽에 고무 링이 있어 핀과 부싱 사이의 그리스를 가둬 둡니다. 그래서 윤활력이 오래 유지되고 수명이 깁니다."}},{"q":"표준 체인을 사용하는 이륜자동차에서 잦은 체인 윤활과 청소가 필요한 이유는?","o":["체인 소음을 증가시키기 위해","녹 발생에 취약하며 이물질 유입이 쉽기 때문","스프로킷의 마모를 증가시키기 위해","체인 장력 조절이 안 되기 때문"],"a":1,"e":{"w":["윤활과 청소는 소음을 줄이기 위한 것입니다.","스프로킷 마모를 줄이기 위한 것입니다.","표준 체인도 장력을 조절할 수 있습니다."],"d":"표준 체인은 씰이 없어 핀과 부싱 사이로 먼지와 물이 쉽게 들어가고 윤활유도 빨리 빠집니다. 녹과 마모에 약하므로 윤활과 청소를 자주 해야 합니다."}},{"q":"체인 관리를 제대로 안 해서 체인이 너무 늘어져 있을 때 발생할 수 있는 문제는?","o":["핸들이 뻑뻑해진다.","엔진 소음이 증가한다.","체인 소음이 감소한다.","체인이 바퀴에서 빠질 수 있다."],"a":3,"e":{"w":["체인이 늘어져도 핸들 조작에는 영향이 없습니다.","엔진 소음과는 관계가 없습니다.","늘어진 체인은 출렁거리며 소음이 오히려 커집니다."],"d":"체인이 너무 늘어지면 달리는 동안 출렁거리다가 스프로킷에서 벗겨질 수 있습니다. 빠진 체인이 뒷바퀴에 감기면 바퀴가 잠겨 매우 위험합니다."}},{"q":"이륜자동차 체인 드라이브 시스템에서 슬라이더 또는 가이드의 역할은?","o":["체인에 묻은 윤활유를 제거한다.","체인의 소음과 마모를 방지한다.","체인 장력을 조절한다.","체인에 녹을 방지한다."],"a":1,"e":{"w":["슬라이더는 윤활유를 닦아 내는 부품이 아닙니다.","장력은 뒷바퀴 축의 조정 장치로 조절합니다.","녹 방지는 윤활유의 역할입니다."],"d":"슬라이더(가이드)는 체인이 스윙암이나 프레임에 직접 닿지 않도록 받쳐 주는 부품입니다. 체인이 지나는 길을 잡아 주어 소음과 마모를 막습니다."}},{"q":"이륜자동차 체인 유격을 점검할 때, 이륜자동차를 어떤 상태로 두어야 가장 정확한가?","o":["서스펜션이 압축되어 있는 상태","브레이크를 잡고 있는 상태","작업용 스탠드로 뒷바퀴를 들어 올린 상태","뒷바퀴를 지면에 붙인 상태"],"a":2,"e":{"w":["서스펜션이 눌리면 앞뒤 스프로킷 사이 거리가 달라져 유격이 다르게 나옵니다.","브레이크를 잡으면 바퀴를 돌려 가며 확인할 수 없습니다.","뒷바퀴가 지면에 있으면 바퀴를 돌려 여러 곳을 확인하기 어렵습니다."],"d":"체인은 위치에 따라 늘어난 정도가 다를 수 있습니다. 작업용 스탠드로 뒷바퀴를 들어 올리면 바퀴를 돌려 가며 여러 위치의 유격을 확인할 수 있어 정확합니다. 실제 정비에서는 차종별 정비지침서가 정한 자세를 따릅니다."}},{"q":"이륜자동차 동력전달장치에서 프론트 스프로킷의 역할은?","o":["뒷바퀴 스프로킷에 직접 동력을 전달한다.","엔진 출력축에 장착되어 엔진 동력을 변속기에 전달한다.","체인 장력을 조절한다.","변속기 출력축에 연결되어 체인에 동력을 전달한다."],"a":3,"e":{"w":["뒷바퀴 스프로킷에는 체인을 거쳐 동력이 전달됩니다.","프론트 스프로킷은 엔진 출력축이 아니라 변속기 출력축에 달립니다.","장력은 뒷바퀴 축의 조정 장치로 조절합니다."],"d":"프론트 스프로킷은 변속기 출력축에 연결되어, 변속기를 거친 동력을 체인에 전달합니다. 체인은 이 동력을 뒷바퀴 스프로킷으로 보냅니다."}},{"q":"이륜자동차 동력전달장치 점검 시, 스프로킷 이빨의 마모 상태를 육안으로 확인할 때 어떤 모양을 주의 깊게 봐야 하는가?","o":["이빨이 더 두꺼워진 경우","이빨 끝이 갈고리 모양으로 휘거나 뾰족해진 경우","이빨에 색이 변한 경우","이빨의 마모가 없는 경우"],"a":1,"e":{"w":["이빨은 닳으면 얇아지지 두꺼워지지 않습니다.","색의 변화만으로는 마모를 판단하지 않습니다.","마모가 없으면 정상입니다."],"d":"스프로킷 이빨이 닳으면 끝이 뾰족해지고, 힘을 받는 방향으로 갈고리처럼 휩니다. 이런 모양이 보이면 체인과 함께 교환해야 합니다."}},{"q":"이륜자동차의 체인 장력이 너무 느슨할 때 발생할 수 있는 문제점은?","o":["주행 중 체인 이탈","주행 중 체인의 마모 감소","주행 중 스프로킷 마모 감소","주행 중 엔진 온도 증가"],"a":0,"e":{"w":["느슨한 체인은 출렁거리며 스프로킷을 때려 마모가 늘어납니다.","스프로킷 마모도 늘어납니다.","체인 장력은 엔진 온도와 관계가 없습니다."],"d":"체인이 너무 느슨하면 달리는 동안 출렁거리다 스프로킷에서 벗겨질 수 있습니다. 소음과 충격도 커집니다."}},{"q":"이륜자동차 체인 장력이 너무 팽팽할 때 발생할 수 있는 문제점이 아닌 것은?","o":["체인의 마모 가속화","스프로킷 마모 가속화","엔진 크랭크축 마모 가속화","변속기 및 베어링 마모 가속화"],"a":2,"e":{"w":["팽팽한 체인은 핀과 부싱에 큰 힘이 걸려 빨리 닳습니다.","스프로킷 이빨에도 큰 힘이 걸려 빨리 닳습니다.","체인이 당기는 힘이 변속기 출력축과 뒷바퀴 베어링에 걸려 마모가 빨라집니다."],"d":"체인이 당기는 힘은 변속기 출력축과 뒷바퀴 쪽에 걸립니다. 엔진 크랭크축은 체인과 직접 연결되어 있지 않으므로 체인 장력의 영향을 받지 않습니다."}},{"q":"이륜자동차 스프로킷의 이빨이 마모되어 뾰족해진 상태에서 계속 주행할 경우, 발생할 수 있는 가장 큰 문제는?","o":["체인이 이탈된다.","체인 소음이 줄어든다.","체인 윤활이 필요 없어진다.","변속기 기어비가 높아진다."],"a":0,"e":{"w":["닳은 스프로킷은 소음이 오히려 커집니다.","윤활은 계속 필요합니다.","이빨이 닳아도 잇수는 그대로라 기어비는 변하지 않습니다."],"d":"이빨이 뾰족해지면 체인을 제대로 잡아 주지 못해 체인이 이빨을 타고 넘거나 벗겨집니다. 주행 중 체인이 빠지면 뒷바퀴가 잠길 수 있어 가장 위험합니다."}},{"q":"체인 구동식 이륜차에서 스윙암 중앙 하부 기준 권장되는 최종 구동 체인의 처짐량(유격)은?","o":["0~5 mm","5~15 mm","20~40 mm","60~80 mm"],"a":2,"e":{"w":["0~5mm는 너무 팽팽해 체인과 베어링에 무리가 갑니다.","5~15mm는 팽팽한 편으로, 서스펜션이 움직일 때 체인이 당겨집니다.","60~80mm는 너무 느슨해 체인이 벗겨지거나 스윙암을 칩니다."],"d":"체인 처짐량은 앞뒤 스프로킷의 가운데에서 체인을 위아래로 움직여 측정하며, 보통 20~40mm 범위로 맞춥니다.\n너무 팽팽하면 체인, 스프로킷, 베어링이 빨리 닳고, 너무 느슨하면 체인이 벗겨질 수 있습니다. 정확한 값은 차종별 정비지침서를 따릅니다."}}]},{"g":"안전·편의장치","name":"안전 및 편의장치","id":"p08","qs":[{"q":"이륜자동차 시트 컨트롤러가 시트 온도를 조절하는 방법은?","o":["발열선에 공급되는 길이를 조절하여","발열선에 공급되는 무게를 조절하여","발열선에 공급되는 전류의 흐름을 조절하여","발열선의 면적을 조절하여"],"a":2,"e":{"w":["발열선의 길이는 만들 때 정해져 있어 조절할 수 없습니다.","무게는 온도와 관계가 없습니다.","발열선의 면적도 만들 때 정해져 있습니다."],"d":"발열선은 전류가 흐르면 열을 냅니다. 시트 컨트롤러는 발열선에 흐르는 전류를 늘리거나 줄이고, 끊었다 이었다 하면서 온도를 조절합니다."}},{"q":"이륜자동차 시트 히팅 시스템이 과열되는 것을 방지하기 위해 시트 컨트롤러의 중요한 안전 기능은?","o":["일정 온도 이상 시 전원 공급을 차단한다.","일정 온도 이상 시 시동을 끈다.","일정 온도 이상 시 브레이크를 작동시킨다.","일정 온도 이상 시 비상등을 작동시킨다."],"a":0,"e":{"w":["과열을 막으려고 엔진 시동까지 끌 필요는 없습니다.","브레이크는 시트 온도와 관계가 없습니다.","비상등을 켜도 온도는 내려가지 않습니다."],"d":"시트 컨트롤러는 온도 센서로 시트 온도를 감시합니다. 일정 온도를 넘으면 발열선으로 가는 전원을 차단해 화상과 화재를 막습니다."}},{"q":"이륜자동차 시트 히팅 시스템에서 운전자가 원하는 온도를 설정하고, 시스템의 작동을 ON, OFF하는 것은?","o":["히터 컨트롤러","에어컨 스위치","시트 컨트롤러","오디오 컨트롤러"],"a":2,"e":{"w":["히터 컨트롤러는 시트 히팅 시스템의 조작 장치 이름이 아닙니다.","에어컨 스위치는 시트 열선과 관계가 없습니다.","오디오 컨트롤러는 음향 장 ":"이륜자동차 앰프에서 주로 전류를 제어하여 신호를 증폭하며, 일반적으로 바이폴라 접합 트랜지스터(BJT)가 사용되는 방식은?","o":["TR(트랜지스터) 방식","진공관 방식","FET(전계 효과 트랜지스터) 방식","IC(집적 회로) 방식"],"a":0,"e":{"w":["진공관 방식은 진공관으로 증폭합니다.","FET 방식은 전압으로 제어합니다.","IC 방식은 여러 소자를 하나의 칩에 넣은 것입니다."],"d":"TR(트랜지스터) 방식은 바이폴라 접합 트랜지스터(BJT)를 씁니다. 베이스에 흐르는 작은 전류로 큰 전류를 제어해 신호를 증폭합니다."}},{"q":"이륜자동차 스피커 시스템에서 음향신호를 증폭하여 스피커를 구동할 수 있는 충분한 전력을 공급하는 장치는?","o":["인클로저","소스 기기","배선 하네스","앰프(Amplifier)"],"a":3,"e":{"w":["인클로저는 스피커를 담는 통입니다.","소스 기기는 음악 신호를 내보내는 기기입니다.","배선 하네스는 전선 묶음입니다."],"d":"앰프는 약한 음향 신호를 크게 키워, 스피커를 울릴 수 있는 충분한 전력으로 만들어 줍니다."}},{"q":"이륜자동차 앰프에서 전압을 제어하여 신호를 증폭하며, 입력 임피던스가 높아 민감한 신호 증폭에 유리한 반도체 소자 방식은?","o":["FET(전계 효과 트랜지스터) 방식","SCR(실리콘 제어 정류기) 방식","TR(트랜지스터) 방식","진공관 방식"],"a":0,"e":{"w":["SCR은 전류를 켜고 끄는 스위칭 소자입니다.","TR 방식은 전류로 제어합니다.","진공관은 반도체 소자가 아닙니다."],"d":"FET(전계 효과 트랜지스터)는 게이트에 가한 전압으로 전류를 제어합니다. 입력 임피던스가 높아 약하고 민감한 신호를 증폭하기에 유리합니다."}},{"q":"이륜자동차 리어 뷰는 운전자가 헬멧을 쓰거나 몸을 돌리지 않고도 후방 상황을 파악하게 해 차선 변경, 주행 안전에 도움을 준다. 다음 중 리어 뷰의 종류가 아닌 것은?","o":["일반형(핸들 부착)","바 엔드 미러","블랙 미러","광각/볼록 미러"],"a":2,"e":{"w":["일반형은 핸들에 다는 기본 리어 뷰 미러입니다.","바 엔드 미러는 핸들 바 끝에 다는 미러입니다.","광각/볼록 미러는 넓게 보이는 미러입니다."],"d":"리어 뷰 미러에는 일반형, 바 엔드 미러, 광각/볼록 미러 등이 있습니다. 블랙 미러라는 종류는 없습니다."}},{"q":"이륜자동차의 도난방지장치 점검 시, 주로 확인해야 할 사항은?","o":["장치의 경보음의 크기가 작은지 확인한다.","도난방지 장치 활성화 시 시동이 잘 걸려 있는지 확인한다.","장치의 경보음이 정상적으로 작동하는지 확인한다.","장치의 설치비용을 확인한다."],"a":2,"e":{"w":["경보음은 작으면 안 되고 잘 들려야 합니다.","도난방지 장치가 켜진 상태에서는 시동이 걸리지 않아야 합니다.","설치비용은 점검 항목이 아닙니다."],"d":"도난방지장치는 누군가 차를 건드렸을 때 경보음을 울려 알립니다. 점검할 때는 경보음이 정상으로 울리는지 확인합니다."}},{"q":"정속 주행 장치(크루즈 컨트롤) 시스템이 주행 중 즉시 차단(해제)되는 조건으로 가장 적합한 동작은?","o":["스로틀 그립 정속 유지","브레이크 레버 조작 또는 클러치 단속 신호 입력 시","방향지시등 점멸 시","연료 탱크 완충 시"],"a":1,"e":{"w":["스로틀을 일정하게 유지하는 것은 해제 조건이 아닙니다.","방향지시등은 크루즈 컨트롤 해제와 관계가 없습니다.","연료의 양은 크루즈 컨트롤 해제와 관계가 없습니다."],"d":"크루즈 컨트롤은 설정한 속도를 자동으로 유지하는 장치입니다. 운전자가 속도를 줄이려는 조작을 하면 안전을 위해 즉시 해제됩니다.\n브레이크 레버나 페달 조작, 클러치 레버 조작, 스로틀을 닫는 방향으로 돌리는 조작이 대표적인 해제 조건입니다."}},{"q":"이륜차 직접식 TPMS(공기압 측정장치) 센서 모듈의 검출 방식에 대한 설명으로 옳은 것은?","o":["ABS 휠 센서 회전수 비교 연산 방식","림 내부 휠 밸브 일체형 센서가 실제 내압 및 타이어 온도를 직접 송신","차고 높이 센서 압축량 계측","서스펜션 내압 간접 측정"],"a":1,"e":{"w":["바퀴 회전수를 비교하는 것은 간접식의 방식입니다.","차고 센서는 공기압을 측정하지 않습니다.","서스펜션 압력은 타이어 공기압이 아닙니다."],"d":"직접식 TPMS는 휠 안쪽(공기 밸브 일체형)에 달린 센서가 타이어 안의 압력과 온도를 직접 측정해 무선으로 보냅니다.\n간접식은 압력 센서 없이 휠 스피드 센서로 바퀴 회전수 차이를 비교해 공기압 저하를 추정합니다."}}]},{"g":"안전·편의장치","name":"주행안전장치","id":"p09","qs":[{"q":"오토바이 에어백은 라이더가 넘어질 때 에어백의 카트리지가 순간적으로 팽창하여 신체를 보호한다. 카트리지를 순간 팽창시키는 가스는?","o":["질소 가스","CO₂ 가스","NOx","CO"],"a":1,"e":{"w":["이 문제에서 묻는 카트리지에 넣는 가스가 아닙니다.","NOx(질소산화물)는 배출가스의 유해 성분입니다.","CO(일산화탄소)는 유독 가스라 쓸 수 없습니다."],"d":"오토바이용 에어백은 작은 가스 카트리지를 터뜨려 부풀립니다. 이 카트리지에는 압축한 이산화탄소(CO₂)를 넣어, 넘어지는 순간 빠르게 팽창시킵니다."}},{"q":"이륜자동차에 사용하는 에어백 연결 방식 중 오토바이와 와이어로 연결되어, 분리 시 에어백이 팽창하는 방식은 어떤 것인가?","o":["유선형","무선형","유무선형","전원형"],"a":0,"e":{"w":["무선형은 줄 없이 센서가 사고를 감지해 작동합니다.","유무선형이라는 연결 방식은 이 분류에 없습니다.","전원형이라는 연결 방식은 없습니다."],"d":"유선형은 에어백과 오토바이를 와이어(줄)로 연결해 둡니다. 라이더가 차에서 떨어지면 줄이 당겨지면서 카트리지가 터져 에어백이 팽창합니다."}},{"q":"이륜자동차에 사용하는 에어백 형태가 아닌 것은?","o":["입는 에어백 재킷/조끼","바지형 에어백","헬멧 연동형","구두형 에어백"],"a":3,"e":{"w":["재킷이나 조끼처럼 입는 에어백이 있습니다.","바지형 에어백도 있습니다.","헬멧과 연동되는 형태도 있습니다."],"d":"라이더용 에어백은 몸통, 목, 엉덩이처럼 크게 다치기 쉬운 부위를 보호하는 형태로 만듭니다. 구두형 에어백은 없습니다."}},{"q":"ABS의 기능은 무엇인가?","o":["브레이크 패드의 마모를 줄인다.","브레이크 작동 시 바퀴가 잠기는 것을 방지한다.","브레이크 작동 시 제동거리를 길게 한다.","브레이크 작동 시 바퀴가 잠기게 한다."],"a":1,"e":{"w":["ABS는 패드 마모를 줄이는 장치가 아닙니다.","제동거리를 길게 하는 것이 목적이 아닙니다.","바퀴가 잠기지 않게 하는 장치입니다."],"d":"ABS(바퀴잠김방지 제동장치)는 급제동 때 바퀴가 잠겨 미끄러지지 않도록 브레이크 유압을 빠르게 줄였다 늘렸다 합니다. 바퀴가 잠기지 않아야 넘어지지 않고 방향을 유지할 수 있습니다."}},{"q":"ABS의 구성요소가 아닌 것은?","o":["휠 스피드 센서","전자제어 유닛","하이드로닉 유닛","스로틀 포지션 센서"],"a":3,"e":{"w":["휠 스피드 센서는 바퀴 속도를 감지하는 ABS 부품입니다.","전자제어 유닛(ECU)은 ABS 작동을 판단하는 부품입니다.","유압을 조절하는 하이드롤릭 유닛은 ABS 부품입니다."],"d":"ABS는 휠 스피드 센서, 전자제어 유닛, 유압 조절 유닛으로 이루어집니다. 스로틀 포지션 센서는 스로틀 밸브가 열린 정도를 감지하는 엔진 제어용 센서입니다."}},{"q":"이륜자동차 ABS 경고등이 점등되었을 때, 가장 먼저 점검해야 할 센서는?","o":["휠 스피드 센서","브레이크 패드 마모 센서","흡입공기량 센서","차고 센서"],"a":0,"e":{"w":["패드 마모 센서는 ABS 경고등과 관계가 없습니다.","흡입공기량 센서는 엔진 제어용입니다.","차고 센서는 차체 높이를 감지하는 센서입니다."],"d":"ABS는 휠 스피드 센서의 신호로 바퀴가 잠기는지 판단합니다. 이 센서나 배선에 이상이 있으면 경고등이 켜지므로 가장 먼저 점검합니다."}},{"q":"ABS 컨트롤 유닛(제어모듈)에 대한 설명으로 틀린 것은?","o":["휠의 감속·가속을 계산한다.","각 바퀴의 속도를 비교·분석한다.","미끄러짐 비율을 계산하여 ABS 작동 여부를 결정한다.","컨트롤 유닛이 작동하지 않으면 브레이크가 전혀 작동하지 않는다."],"a":3,"e":{"w":["컨트롤 유닛은 바퀴의 감속과 가속을 계산합니다. 옳은 설명입니다.","각 바퀴의 속도를 비교하고 분석합니다. 옳은 설명입니다.","미끄러짐 비율을 계산해 ABS를 작동시킬지 결정합니다. 옳은 설명입니다."],"d":"컨트롤 유닛이 고장 나면 ABS 기능만 멈추고 일반 브레이크는 그대로 작동합니다. 이것을 페일 세이프라고 합니다. 브레이크가 전혀 듣지 않는다는 설명이 틀렸습니다."}},{"q":"바퀴잠김방지식 주제동장치(ABS)를 갖춘 이륜자동차에는 어떤 색상의 경고등이 설치되어야 하나?","o":["적색 경고등","녹색 경고등","황색 경고등","청색 경고등"],"a":2,"e":{"w":["ABS 경고등은 적색이 아닙니다.","녹색은 작동 중임을 알리는 표시등에 씁니다.","청색은 상향등 표시등 등에 씁니다."],"d":"바퀴잠김방지식 주제동장치(ABS)를 갖춘 이륜자동차에는 장치에 이상이 있을 때 알려 주는 황색 경고등을 설치해야 합니다."}},{"q":"이륜자동차 ABS 시스템은 젖은 노면이나 미끄러운 노면에서 제동 시, 일반 브레이크보다 어떤 면에서 유리한가?","o":["제동 거리를 항상 짧게 한다.","바퀴 잠김을 방지하여 안정적인 제동과 조향 유지를 돕는다.","바퀴 잠김을 유도하여 안정적인 제동과 조향 유지를 돕는다.","브레이크 패드 마모를 가속화시킨다."],"a":1,"e":{"w":["노면 상태에 따라 제동거리가 길어질 수도 있어 \"항상\" 짧다고 할 수 없습니다.","ABS는 바퀴 잠김을 막는 장치입니다.","패드 마모와는 관계가 없습니다."],"d":"미끄러운 노면에서는 바퀴가 쉽게 잠깁니다. ABS는 바퀴가 잠기지 않게 유압을 조절해, 넘어지지 않고 방향을 유지하면서 제동할 수 있게 돕습니다."}},{"q":"이륜자동차 ABS 시스템이 정상적으로 작동하는지 확인하는 가장 기본적인 방법은?","o":["급제동 시 바퀴가 잠기지 않고 ‘두두득’ 하는 진동이 느껴지는지 확인한다.","이륜자동차를 세워두고 브레이크 레버만 잡는다.","급제동 시 소음 상태를 확인한다.","급제동 시 바퀴가 밀리나 확인한다."],"a":0,"e":{"w":["세워 둔 상태에서 레버만 잡아서는 ABS가 작동하지 않습니다.","소음만으로는 작동 여부를 알 수 없습니다.","바퀴가 밀리는지 보는 것은 ABS 작동 확인이 아닙니다."],"d":"ABS가 작동하면 유압을 빠르게 조절하기 때문에 레버나 페달에서 '두두둑' 하는 진동이 느껴지고, 바퀴는 잠기지 않습니다. 이것이 정상 작동의 표시입니다."}},{"q":"이륜자동차 ABS 시스템이 작동할 때, 휠 속도 센서가 감지하는 것은?","o":["타이어의 공기압","브레이크액의 압력","브레이크 패드의 마모도","바퀴의 회전 속도"],"a":3,"e":{"w":["공기압은 TPMS 센서가 감지합니다.","브레이크액의 압력은 압력 센서가 감지합니다.","패드의 마모는 휠 속도 센서가 감지하지 않습니다."],"d":"휠 속도 센서는 바퀴와 함께 도는 톤 휠(센서 링)의 이를 읽어 바퀴의 회전 속도를 감지합니다. ECU는 이 신호로 바퀴가 잠기려 하는지 판단합니다."}},{"q":"이륜자동차 ABS 시스템이 장착된 차량에서 눈길이나 빗길과 같이 노면이 미끄러운 상황에서 ABS가 제공하는 안전 이점은 어느 것인가?","o":["타이어 마모 방지","연료 소모량 감소","제동 중 바퀴 잠김 위험을 크게 줄여 조향성 유지","제동 중 조향성 상실"],"a":2,"e":{"w":["타이어 마모 방지는 ABS의 목적이 아닙니다.","연료 소모와는 관계가 없습니다.","ABS는 조향성을 잃지 않게 해 주는 장치입니다."],"d":"눈길이나 빗길에서는 바퀴가 쉽게 잠깁니다. ABS는 제동 중 바퀴가 잠길 위험을 크게 줄여, 넘어지지 않고 조향성을 유지하게 해 줍니다."}},{"q":"이륜자동차 ABS 시스템에서 바퀴의 회전 속도를 감지하여 ABS ECU로 정보를 보내는 부품은?","o":["브레이크 오일 압력 센서","스로틀 포지션 센서","브레이크 레버 스위치","ABS 휠 속도 센서"],"a":3,"e":{"w":["오일 압력 센서는 유압을 감지합니다.","스로틀 포지션 센서는 엔진 제어용입니다.","브레이크 레버 스위치는 제동등을 켜는 신호를 보냅니다."],"d":"ABS 휠 속도 센서가 바퀴의 회전 속도를 감지해 ABS ECU로 보냅니다."}},{"q":"ABS 경고등이 계기판에 점등될 때 점검해야 할 사항으로 관계가 없는 것은?","o":["ABS 센서 불량","타이어 공기압 센서 불량","ABS 모듈 이상","휠 속도 센서에 이물질로 인한 오염"],"a":1,"e":{"w":["ABS 센서가 불량이면 경고등이 켜집니다.","ABS 모듈에 이상이 있으면 경고등이 켜집니다.","휠 속도 센서에 이물질이 묻으면 신호가 흐트러져 경고등이 켜집니다."],"d":"ABS 경고등은 ABS 계통(센서, 배선, 모듈)에 이상이 있을 때 켜집니다. 타이어 공기압 센서는 TPMS 부품이라 ABS 경고등과 관계가 없습니다."}},{"q":"이륜자동차의 ABS 경고등이 점등되어 있을 때, 전기전자회로 측면에서 가장 먼저 점검해야 할 부품은?","o":["브레이크 패드 마모 센서","ABS 모듈의 작동음 상태","브레이크 오일압력 센서","휠 스피드 센서 및 관련 배선"],"a":3,"e":{"w":["패드 마모 센서는 ABS 경고등과 관계가 없습니다.","작동음은 전기전자회로 점검이 아닙니다.","오일압력 센서보다 휠 스피드 센서 쪽 고장이 훨씬 흔합니다."],"d":"ABS 경고등의 가장 흔한 원인은 휠 스피드 센서와 그 배선, 커넥터의 단선이나 접촉 불량입니다. 전기전자회로 측면에서는 이 부분을 먼저 점검합니다."}},{"q":"이륜자동차에 ABS가 장착되어 있을 때, 내리막길 급제동 시 가장 기대할 수 있는 이점은?","o":["바퀴 잠김 없이 안정적인 제동이 가능하여 안전성이 향상된다.","타이어 교환 주기가 짧아진다.","브레이크 오일 교환 주기가 길어진다.","무게 중심이 앞으로 쏠리면서 뒷바퀴가 쉽게 들려 안전성이 향상된다."],"a":0,"e":{"w":["타이어 교환 주기와는 관계가 없습니다.","브레이크 오일 교환 주기와는 관계가 없습니다.","ABS는 무게 쏠림을 만드는 장치가 아니며, 뒷바퀴가 들리는 것은 이점이 아닙니다."],"d":"내리막 급제동에서는 앞바퀴에 하중이 쏠려 바퀴가 잠기기 쉽습니다. ABS는 바퀴가 잠기지 않게 유압을 조절해 안정적으로 제동하게 해 줍니다."}},{"q":"ABS 시스템이 작동할 때 브레이크 레버나 페달에서 ‘두두둑’하는 진동이 느껴지는 이유는?","o":["브레이크 라인에 공기가 유입되어서","비포장 도로를 주행 시","브레이크 압력을 미세하게 조절하기 때문에","브레이크 패드가 마모되어서"],"a":2,"e":{"w":["공기가 들어가면 진동이 아니라 레버가 물렁해집니다.","노면 때문에 생기는 진동이 아닙니다.","패드 마모와는 관계가 없습니다."],"d":"ABS가 작동하면 유압 조절 유닛이 브레이크 압력을 아주 빠르게 줄였다 늘렸다 합니다. 이 압력 변화가 레버나 페달에 '두두둑' 하는 진동으로 전해집니다."}},{"q":"이륜자동차 ABS 경고등이 계속 켜져 있을 때, 운전자가 취해야 할 가장 적절한 조치는 어느 것인가?","o":["ABS 시스템 점검을 위해 정비소에 방문한다.","타이어 공기압을 높인다.","ABS 경고등 전구를 탈거한다.","ABS 시스템을 모두 탈거한다."],"a":0,"e":{"w":["공기압은 ABS 경고등과 관계가 없습니다.","전구를 빼면 고장이 그대로 남고 이상을 알 수도 없게 됩니다.","ABS를 떼어 내면 안전장치가 없어집니다."],"d":"ABS 경고등이 계속 켜져 있으면 ABS가 작동하지 않는 상태입니다. 일반 브레이크는 작동하지만 안전을 위해 정비소에서 점검을 받아야 합니다."}},{"q":"이륜자동차 ABS ECU에 문제가 발생했을 때, 나타나는 증상은?","o":["엔진 시동이 걸리지 않는다.","브레이크에 소음이 발생한다.","계기판의 엔진 경고등이 계속 점등되거나 깜빡인다.","계기판의 ABS 경고등이 계속 점등되거나 깜빡인다."],"a":3,"e":{"w":["ABS ECU는 엔진 시동과 관계가 없습니다.","브레이크 소음은 패드나 디스크의 문제입니다.","엔진 경고등은 엔진 제어 계통의 이상을 알립니다."],"d":"ABS ECU에 문제가 생기면 계기판의 ABS 경고등이 계속 켜지거나 깜빡여 운전자에게 알립니다."}},{"q":"이륜자동차 ABS 시스템에 이상이 발생했을 때, 운전자에게 가장 명확하게 알려주는 신호는?","o":["브레이크 패드 색깔 변화","좌·우 방향지시등을 동시에 점멸","계기판의 ABS 경고등 점등","엔진 경고등 점등"],"a":2,"e":{"w":["패드 색깔로는 ABS 이상을 알 수 없습니다.","방향지시등이 함께 깜빡이는 것은 비상등입니다.","엔진 경고등은 엔진 계통의 이상을 알립니다."],"d":"ABS에 이상이 생기면 계기판의 ABS 경고등이 켜집니다. 운전자에게 가장 분명하게 알려 주는 신호입니다."}},{"q":"ABS 브레이크 시스템에서 페일 세이프 상태가 되면 나타나는 현상은?","o":["모듈레이터 모터가 작동된다.","모듈레이터 솔레노이드 밸브로 전원을 공급한다.","ABS 기능이 작동되지 않아 주차브레이크가 자동으로 작동한다.","ABS 기능이 작동되지 않아도 일반적인 브레이크는 작동된다."],"a":3,"e":{"w":["페일 세이프 상태에서는 모듈레이터 모터가 작동하지 않습니다.","솔레노이드 밸브로 가는 전원을 끊습니다.","주차브레이크와는 관계가 없습니다."],"d":"페일 세이프는 고장이 났을 때 안전한 쪽으로 동작하게 하는 기능입니다. ABS에 고장이 나면 ABS 기능을 멈추고, 일반 브레이크는 그대로 작동하게 합니다."}},{"q":"휠 스피드 센서 파형 점검 시 가장 유용한 장비는?","o":["회전계","멀티테스터기","오실로스코프","전류계"],"a":2,"e":{"w":["회전계는 회전수만 알려 줍니다.","멀티테스터는 전압이나 저항 값만 보여 주고 파형은 볼 수 없습니다.","전류계는 전류의 크기만 알려 줍니다."],"d":"파형은 시간에 따라 전압이 변하는 모양입니다. 이것을 화면에 그려 보여 주는 장비가 오실로스코프입니다. 휠 스피드 센서의 신호가 고른지, 빠진 곳이 없는지 확인할 수 있습니다."}},{"q":"이륜자동차 ABS에서 제어모듈(ECU)의 신호를 받아 밸브와 모터가 작동되면서 유압의 증가, 감소, 유지 등을 제어하는 것은?","o":["마스터 실린더","딜리버리 밸브","프로포셔닝 밸브","하이드롤릭 유닛"],"a":3,"e":{"w":["마스터 실린더는 레버나 페달의 힘을 유압으로 바꿉니다.","딜리버리 밸브는 ABS 유압 제어 부품이 아닙니다.","프로포셔닝 밸브는 앞뒤 제동력을 나누는 밸브입니다."],"d":"하이드롤릭 유닛(유압 조절 유닛)은 ECU의 신호를 받아 솔레노이드 밸브와 펌프 모터를 움직여 브레이크 유압을 높이고, 낮추고, 유지합니다."}},{"q":"ABS 장치의 고장진단 시 경고등의 점등에 관한 설명 중 틀린 것은?","o":["점화스위치 ON 시 점등되어야 한다.","ABS 컴퓨터 고장 발생 시에는 소등된다.","ABS 컴퓨터 커넥터 분리 시 점등되어야 한다.","정상 시 ABS 경고등은 엔진 시동 후 일정 시간 점등되었다가 소등된다."],"a":1,"e":{"w":["점화스위치를 켜면 자기진단을 위해 경고등이 켜집니다. 옳은 설명입니다.","커넥터가 빠지면 경고등이 켜져야 합니다. 옳은 설명입니다.","정상이면 시동 뒤 경고등이 꺼집니다. 옳은 설명입니다."],"d":"ABS 경고등은 이상이 있을 때 켜져서 알려 주는 장치입니다. ABS 컴퓨터가 고장 나면 경고등이 켜져야 하므로, 꺼진다는 설명이 틀렸습니다."}},{"q":"전자제어 제동장치(ABS)의 유압제어 모드에서 주행 중 급제동 시 고착된 바퀴의 유압제어는?","o":["감압 제어","정압 제어","분압 제어","증압 제어"],"a":0,"e":{"w":["정압 제어라는 모드는 없습니다.","분압 제어라는 모드는 없습니다.","증압은 잠긴 바퀴를 더 잠기게 합니다."],"d":"ABS의 유압 제어는 감압, 유지, 증압 세 가지입니다. 바퀴가 잠기면(고착) 유압을 낮추는 감압 제어로 바퀴를 다시 돌게 합니다."}},{"q":"ABS와 TCS(Traction Control System)에 대한 설명으로 틀린 것은?","o":["TCS는 구동륜이 슬립하는 현상을 방지한다.","ABS는 주행 중 제동 시 타이어의 록(Lock)을 방지한다.","ABS는 제동 시 조향 안전성 확보를 위한 시스템이다.","TCS는 급제동 시 제동력 제어를 통해 차량 스핀 현상을 방지한다."],"a":3,"e":{"w":["TCS는 구동 바퀴가 헛도는 것을 막습니다. 옳은 설명입니다.","ABS는 제동할 때 바퀴가 잠기는 것을 막습니다. 옳은 설명입니다.","ABS는 제동 중 조향 안정성을 확보합니다. 옳은 설명입니다."],"d":"TCS는 출발하거나 가속할 때 구동 바퀴가 헛도는 것을 막는 장치입니다. 급제동 때 제동력을 제어하는 것은 ABS의 역할이므로 ④가 틀린 설명입니다."}},{"q":"구동륜 제어장치(TCS)에 대한 설명으로 틀린 것은?","o":["차체 높이 제어를 위한 성능 유지","눈길, 빙판길에서 미끄러짐 방지","커브길 선회 시 주행 안정성 유지","노면과 차륜 간의 마찰 상태에 따라 엔진 출력 제어"],"a":0,"e":{"w":["눈길과 빙판길에서 미끄러짐을 막는 것은 TCS의 기능입니다.","커브길에서 주행 안정성을 유지하는 것도 TCS의 기능입니다.","노면과 바퀴 사이의 마찰 상태에 따라 엔진 출력을 조절하는 것이 TCS입니다."],"d":"TCS는 구동 바퀴의 미끄러짐을 줄이는 장치입니다. 차체 높이를 제어하는 것은 현가장치 쪽 기능이라 TCS와 관계가 없습니다."}},{"q":"이륜자동차 TCS가 주행 중 구동 바퀴(뒷바퀴)의 미끄러짐을 감지했을 때 하는 제어로 옳은 것은?","o":["엔진 출력을 줄여 뒷바퀴의 구동력을 낮춘다.","엔진 출력을 높여 뒷바퀴를 더 빨리 돌린다.","앞바퀴 브레이크를 풀어 앞바퀴를 더 빨리 돌린다.","서스펜션을 단단하게 하여 차체를 낮춘다."],"a":0,"e":{"w":["출력을 높이면 뒷바퀴가 더 심하게 헛돕니다.","TCS는 구동 바퀴의 구동력을 조절하는 장치입니다. 앞바퀴 브레이크를 푸는 제어는 하지 않습니다.","서스펜션을 조절하는 것은 TCS의 기능이 아닙니다."],"d":"TCS는 앞바퀴와 뒷바퀴의 휠 스피드 센서로 두 바퀴의 속도를 비교합니다. 뒷바퀴가 앞바퀴보다 빨리 돌면 헛도는 것으로 판단합니다. 그러면 점화시기, 연료 분사량, 흡입 공기량을 조절해 엔진 출력을 줄이고, 뒷바퀴가 다시 노면을 붙잡게 합니다."}},{"q":"이륜자동차의 사이드 스탠드 또는 메인스탠드 관련 안전장치 점검 시, 확인해야 할 것은?","o":["스탠드의 마모 상태","스탠드가 설치된 각도","스탠드의 무게","기어 변속 시 시동이 꺼지는 안전장치의 작동 여부"],"a":3,"e":{"w":["스탠드의 마모는 안전장치 점검 항목이 아닙니다.","설치 각도는 안전장치의 작동과 관계가 없습니다.","스탠드의 무게는 점검 항목이 아닙니다."],"d":"사이드 스탠드에는 스위치가 달려 있습니다. 스탠드를 내린 채 기어를 넣으면 시동이 꺼지게 해서, 스탠드를 내린 채 출발하는 사고를 막습니다. 이 안전장치가 작동하는지 확인합니다."}},{"q":"TPMS 시스템에서 타이어 공기압 정보를 측정하여 무선으로 전송하는 부품은?","o":["차속 센서","휠 속도 센서","차고 센서","휠 내부 센서"],"a":3,"e":{"w":["차속 센서는 차의 속도를 감지합니다.","휠 속도 센서는 ABS용 센서입니다.","차고 센서는 차체 높이를 감지합니다."],"d":"TPMS는 휠 안쪽(주로 공기 밸브 자리)에 단 센서가 타이어 공기압과 온도를 재서 무선으로 보냅니다."}},{"q":"TPMS가 이륜자동차 안전에 기여하는 가장 큰 이점은?","o":["타이어 저압 상태 및 고온 상태의 이상을 조기에 감지하여 안전운전 지원","타이어 밸런스를 정확하게 조정한다.","변속비를 자동으로 조절한다.","엔진의 출력을 향상시킨다."],"a":0,"e":{"w":["타이어 밸런스는 휠 밸런서로 맞춥니다.","변속비와는 관계가 없습니다.","엔진 출력과는 관계가 없습니다."],"d":"TPMS는 타이어 공기압이 낮거나 온도가 높은 이상 상태를 일찍 알려 줍니다. 운전자가 미리 조치할 수 있어 타이어 파손으로 인한 사고를 막는 데 도움이 됩니다."}},{"q":"이륜자동차 TPMS 센서를 교체한 후, 새로운 센서가 시스템에 인식되지 않아 경고등이 계속 켜져 있다면, 가장 먼저 시도해야 할 조치는?","o":["진단 장비를 이용하여 센서 ID를 ECU에 등록하거나 재학습시킨다.","TPMS 모듈을 교환한다.","이륜자동차 배터리 (-)단자를 탈거했다가 다시 조립한다.","엔진 ECU에서 기억소거를 시킨다."],"a":0,"e":{"w":["모듈 교환은 등록을 해 본 뒤에 판단할 일입니다.","배터리 단자를 뗐다 붙여도 새 센서 ID가 등록되지는 않습니다.","엔진 ECU의 기억을 지우는 것은 TPMS와 관계가 없습니다."],"d":"TPMS 센서마다 고유 번호(ID)가 있습니다. 센서를 바꾸면 새 ID를 수신 장치(ECU)에 등록하거나 재학습시켜야 시스템이 새 센서를 알아봅니다."}},{"q":"이륜자동차 TPMS(Tire Pressure Monitoring System)의 역할은?","o":["타이어의 마모 상태를 감지한다.","타이어의 공기압을 실시간으로 측정하여 운전자에게 경고한다.","타이어의 공기량을 감지한다.","연료 소비율을 감지한다."],"a":1,"e":{"w":["TPMS는 마모 상태를 감지하지 않습니다.","공기의 양이 아니라 압력을 잽니다.","연료 소비율과는 관계가 없습니다."],"d":"TPMS는 타이어 공기압 감시 장치입니다. 공기압을 실시간으로 재서 기준보다 낮아지면 운전자에게 경고합니다."}},{"q":"TPMS의 휠 내부 센서는 각 바퀴의 압력을 측정해 공기압 보통 몇 % 이상 부족을 감지하면 계기판에 경고등을 띄우는가?","o":["25%","50%","60%","80%"],"a":0,"e":{"w":["50%까지 떨어진 뒤에 알리면 너무 늦습니다.","60%는 기준이 아닙니다.","80%는 기준이 아닙니다."],"d":"TPMS는 보통 공기압이 적정값보다 25% 이상 부족해지면 계기판에 경고등을 띄웁니다."}},{"q":"이륜자동차 TPMS 센서의 전원 공급 방식은?","o":["발전기에서 직접 전원을 공급받는다.","이륜자동차 배터리에서 전원을 공급받는다.","센서 내부에 내장된 배터리에서 전원을 공급받는다.","전원을 공급받지 않아도 된다."],"a":2,"e":{"w":["센서는 도는 바퀴 안에 있어 발전기와 전선으로 이을 수 없습니다.","차체 배터리와도 전선으로 이을 수 없습니다.","센서가 측정하고 무선으로 보내려면 전원이 필요합니다."],"d":"TPMS 센서는 회전하는 휠 안에 있어 전선을 연결할 수 없습니다. 그래서 센서 안에 들어 있는 배터리로 작동합니다."}},{"q":"이륜자동차 TPMS 시스템이 장착된 차량에서, 타이어 공기압이 너무 낮은 상태로 주행할 때 발생할 수 있는 위험한 사항이 아닌 것은?","o":["타이어의 과열","현가장치의 과열","조종성 불안정","타이어의 파열"],"a":1,"e":{"w":["공기압이 낮으면 타이어가 많이 찌그러지면서 열이 납니다.","공기압이 낮으면 핸들이 무겁고 조종이 불안정해집니다.","과열이 심해지면 타이어가 파열될 수 있습니다."],"d":"공기압이 낮으면 타이어가 과열되고, 조종성이 나빠지며, 심하면 파열됩니다. 현가장치가 과열되는 것은 공기압과 관계가 없습니다."}},{"q":"이륜자동차 TPMS 센서가 타이어 내부의 온도를 측정하는 이유는?","o":["타이어의 공기압 변화가 온도에 영향을 받으므로 이를 보정하기 위해","외부 대기 온도를 파악하기 위해","타이어 마모 여부를 판단하기 위해","타이어와 접촉 노면의 온도를 감지하기 위해"],"a":0,"e":{"w":["외부 기온을 알기 위한 것이 아닙니다.","마모는 온도로 판단하지 않습니다.","노면의 온도를 재는 것이 아닙니다."],"d":"공기는 온도가 오르면 압력도 오릅니다. 주행으로 타이어가 뜨거워지면 압력이 높게 나오므로, 센서가 온도를 함께 재서 이 변화를 보정합니다."}},{"q":"TPMS가 장착된 이륜자동차에서 타이어 교체 후 또는 센서 교체 후 필요한 작업은 다음 중 어느 것인가?","o":["ABS 시스템 재설정","TCS 시스템 재설정","엔진 시스템 재설정","TPMS 시스템 재설정(재보정)"],"a":3,"e":{"w":["ABS는 타이어나 센서 교체와 관계가 없습니다.","TCS도 관계가 없습니다.","엔진 시스템도 관계가 없습니다."],"d":"타이어나 센서를 교체하면 센서의 위치나 ID가 달라질 수 있습니다. TPMS 시스템을 재설정(재보정)해서 새 상태를 인식시켜야 합니다."}},{"q":"ABS 시스템에서 휠 스피드 센서 팁과 톤 휠(펄서 링) 치차 돌기 사이의 규정 에어 갭(간극)은?","o":["0.04~0.12 mm","0.4~1.2 mm","4~12 mm","12~24 mm"],"a":1,"e":{"w":["0.04~0.12mm는 너무 좁아 센서와 톤 휠이 닿을 수 있습니다.","4~12mm는 너무 넓어 신호가 약해집니다.","12~24mm는 신호가 검출되지 않는 거리입니다."],"d":"휠 스피드 센서는 톤 휠(펄서 링)의 돌기가 지나갈 때 생기는 자기장 변화를 신호로 바꿉니다.\n센서 끝과 톤 휠 사이의 간극(에어 갭)이 너무 넓으면 신호가 약해져 ABS 경고등이 켜지고, 너무 좁으면 서로 닿아 손상됩니다. 보통 1mm 안팎의 범위로 규정되며, 정확한 값은 정비지침서를 따릅니다."}}]},{"g":"프레임","name":"프레임","id":"p10","qs":[{"q":"이륜자동차 프레임의 기능에 대한 설명으로 틀린 것은?","o":["엔진, 서스펜션, 휠 등 다양한 부품을 연결하고 지지한다.","프레임은 차량의 기계부품과 본체를 지지하며, 정적 및 동적 하중을 지탱한다.","제동력을 증대시키고 작동을 원활하게 한다.","주행 중 발생하는 충격을 흡수하여 차량의 안정성을 유지한다."],"a":2,"e":{"w":["프레임은 엔진, 서스펜션, 휠 등을 연결하고 지지합니다. 옳은 설명입니다.","프레임은 기계부품과 본체를 지지하고 정적·동적 하중을 지탱합니다. 옳은 설명입니다.","프레임은 주행 중의 충격을 받아 내어 안정성을 유지합니다. 옳은 설명입니다."],"d":"프레임은 이륜자동차의 뼈대입니다. 부품을 지지하고 하중과 충격을 받아 냅니다. 제동력을 키우는 것은 제동장치의 일이므로 ③이 틀린 설명입니다."}},{"q":"이륜자동차 프레임의 성능에 결정적인 영향을 미치는 요소가 아닌 것은?","o":["강도","내구성","제동력","핸들링"],"a":2,"e":{"w":["강도는 하중을 견디는 힘으로 프레임 성능을 좌우합니다.","내구성은 오래 버티는 성질로 프레임 성능을 좌우합니다.","프레임의 강성이 핸들링을 좌우합니다."],"d":"프레임의 성능은 강도, 내구성, 핸들링(강성과 무게)으로 결정됩니다. 제동력은 제동장치의 성능이지 프레임의 요소가 아닙니다."}},{"q":"이륜자동차 프레임의 서브 프레임이 하는 역할은?","o":["앞바퀴를 지지한다.","메인 프레임에 볼트로 고정되는 경우가 많다.","변속기의 회전을 전달한다.","뒷바퀴를 지지한다."],"a":1,"e":{"w":["앞바퀴는 프론트 포크가 지지합니다.","변속기의 회전을 전달하는 것은 동력전달장치입니다.","뒷바퀴는 스윙암이 지지합니다."],"d":"서브 프레임은 메인 프레임 뒤쪽에 붙어 시트와 뒤쪽 부품을 받치는 보조 프레임입니다. 메인 프레임에 볼트로 고정하는 경우가 많아, 손상되면 따로 떼어 교체할 수 있습니다."}},{"q":"서브 프레임에 대한 설명 중 틀린 것은?","o":["일반적으로 다양한 방향의 압력을 견딜 수 있도록 井자형 또는 H자형과 같은 다양한 형태로 설계되어 있다.","주로 강철(steel)로 만들어지지만, 경량화를 위해 알루미늄 합금을 적용하기도 한다.","충돌 발생 시 외부 충격을 차량 각 부위로 분산시켜 차체 손상을 최소화하고 탑승자를 보호하는 데 기여한다.","차량의 뼈대 역할을 하며, 엔진 및 모든 주요 구성 요소를 고정한다."],"a":3,"e":{"w":["서브 프레임은 여러 방향의 힘을 견디도록 다양한 형태로 설계합니다. 옳은 설명입니다.","주로 강철로 만들고, 가볍게 하려고 알루미늄 합금을 쓰기도 합니다. 옳은 설명입니다.","충돌할 때 충격을 분산시켜 손상을 줄이고 탑승자를 보호합니다. 옳은 설명입니다."],"d":"차량의 뼈대가 되어 엔진과 모든 주요 부품을 지지하는 것은 메인 프레임입니다. 서브 프레임은 그 일부를 보조하는 프레임이므로 ④가 틀린 설명입니다."}},{"q":"이륜자동차 프레임이 가져야 할 가장 중요한 구조적 특징은?","o":["탄력성이 매우 뛰어나야 한다.","비틀림 강성과 경량성을 동시에 갖추어야 한다.","부식이 잘 되어야 한다.","충격시 쉽게 부러져야 한다."],"a":1,"e":{"w":["프레임이 지나치게 탄력적이면 주행 중 휘어서 불안정합니다.","부식이 잘 되면 안 됩니다.","충격에 쉽게 부러지면 안 됩니다."],"d":"프레임은 선회와 제동 때의 비틀리는 힘을 견뎌야 하므로 비틀림 강성이 높아야 하고, 운동 성능을 위해 가벼워야 합니다. 두 가지를 함께 갖추는 것이 가장 중요합니다."}},{"q":"이륜자동차 프레임에서 스티어링 헤드 부분이 하는 역할은?","o":["앞바퀴의 조향이 이루어지도록 하는 중심축 이다.","발전기가 장착되는 곳이다.","브레이크가 연결되는 곳이다.","연료탱크가 놓이는 곳이다."],"a":0,"e":{"w":["발전기는 엔진에 장착됩니다.","브레이크가 연결되는 곳이 아닙니다.","연료탱크는 프레임 윗부분에 놓입니다."],"d":"스티어링 헤드(헤드 파이프)는 프레임 맨 앞에 있는 관입니다. 여기에 스티어링 스템이 끼워져 돌면서 앞바퀴의 방향을 바꾸므로, 조향의 중심축이 됩니다."}},{"q":"이륜자동차 프레임에서 스윙암 피벗 부분이 하는 역할은?","o":["핸들이 좌우로 운동을 할 수 있도록 하는 회전 축 부분이다.","뒷바퀴를 상하 운동을 할 수 있도록 하는 회전 축 부분이다.","앞바퀴를 상하 운동을 할 수 있도록 하는 회전 축 부분이다.","브레이크를 고정시키는 부분이다."],"a":1,"e":{"w":["핸들이 좌우로 도는 축은 스티어링 헤드입니다.","앞바퀴의 상하 운동은 프론트 포크가 담당합니다.","브레이크를 고정하는 부분이 아닙니다."],"d":"스윙암 피벗은 스윙암 앞쪽이 프레임에 연결되는 회전축입니다. 스윙암이 이 축을 중심으로 위아래로 움직이면서 뒷바퀴가 상하 운동을 합니다."}},{"q":"이륜자동차 프레임의 종류가 아닌 것은?","o":["크래들형","다이아몬드형","백본형","보디온 프레임형"],"a":3,"e":{"w":["크래들형은 엔진을 아래에서 감싸 받치는 이륜자동차 프레임입니다.","다이아몬드형은 엔진을 프레임의 일부로 쓰는 이륜자동차 프레임입니다.","백본형은 굵은 등뼈 모양의 이륜자동차 프레임입니다."],"d":"이륜자동차 프레임에는 크래들형, 다이아몬드형, 백본형, 트윈 스파형, 격자형 등이 있습니다. 보디온 프레임형은 이륜자동차 프레임의 종류가 아닙니다."}},{"q":"다음 중 격자 프레임(트렐리스(Trellis))에 대한 설명으로 올바른 것은?","o":["튜브를 사용하지 않고 대형 알루미늄 판을 단일 구조로 성형하여 제작된다.","서로 짧은 금속 튜브들을 삼각형 격자 구조로 용접하여 만든 프레임이다.","엔진은 프레임에서 완전히 분리되어 스트레스 멤버로 활용되지 않는다.","대량 생산에 적합하며, 고정밀 자동화 설비가 꼭 필요하다."],"a":1,"e":{"w":["큰 알루미늄 판을 하나의 구조로 성형하는 것은 격자 프레임이 아닙니다.","격자 프레임은 엔진을 강성 부재(스트레스 멤버)로 함께 쓰는 경우가 많습니다.","용접할 곳이 많아 대량 생산에 유리한 구조가 아닙니다."],"d":"격자(트렐리스) 프레임은 짧은 금속 튜브 여러 개를 삼각형 격자 모양으로 용접해 만듭니다. 삼각형 구조라 가벼우면서도 강성이 높습니다."}},{"q":"프레임의 강도와 강성을 얻기 위해 엔진을 부재의 일부로 이용하는 구조의 프레임은 어느 것인가?","o":["격자 프레임","모노크크 프레임","프리미터 프레임","다이아몬드형 프레임"],"a":3,"e":{"w":["격자 프레임은 짧은 튜브를 삼각형 격자로 용접한 구조입니다.","모노코크 프레임은 차체 껍질 자체가 프레임 역할을 합니다.","페리미터 프레임은 엔진 둘레를 감싸는 구조입니다."],"d":"다이아몬드형 프레임은 프레임 아래쪽이 열려 있고, 엔진을 강도 부재의 일부로 써서 그 자리를 이어 줍니다. 엔진이 프레임 역할을 함께 하므로 가볍습니다."}},{"q":"이륜자동차 백본 프레임의 특징은?","o":["다른 유형의 프레임에 비해 필요한 양이 많아 제조비용이 비싸다.","주로 대형 바이크에만 사용된다.","스티어링 헤드에서 스윙암 앞쪽에 위치한다.","엔진을 매달아 지지하는 구조이다."],"a":3,"e":{"w":["백본 프레임은 재료가 적게 들어 제조비용이 쌉니다.","주로 소형 바이크와 스쿠터에 씁니다.","백본은 스티어링 헤드에서 뒤쪽으로 뻗은 굵은 등뼈 모양의 프레임입니다."],"d":"백본 프레임은 굵은 관 하나가 등뼈처럼 뻗어 있고, 엔진을 그 아래에 매달아 지지합니다. 구조가 간단하고 값이 쌉니다."}},{"q":"오토바이 종류 중 스쿠터에 주로 적용되는 프레임은?","o":["다아몬드 프레임","백본 프레임","격자 프레임","크래임형 프레임"],"a":1,"e":{"w":["다이아몬드 프레임은 엔진을 강도 부재로 쓰는 방식으로 일반 바이크에 씁니다.","격자 프레임은 스포츠 바이크에 주로 씁니다.","크래들형은 엔진을 감싸 받치는 방식으로 일반 바이크에 씁니다."],"d":"스쿠터는 발판 공간이 필요해서, 굵은 관 하나가 등뼈처럼 지나가는 백본 프레임을 주로 씁니다."}},{"q":"이륜자동차 프레임 구조 중, 엔진을 프레임의 일부로 사용하여 강성을 높이고 무게를 줄이는 방식은?","o":["더블 크래들 프레임","크래임형 프레임","다아몬드 프레임","스트레스드-멤버 프레임"],"a":3,"e":{"w":["더블 크래들 프레임은 두 개의 관으로 엔진을 아래에서 감싸 받칩니다.","크래들형은 엔진을 받치는 구조로, 엔진을 프레임의 일부로 쓰지 않습니다.","다이아몬드 프레임도 엔진을 부재로 쓰지만, 이 방식 자체를 가리키는 이름은 스트레스드-멤버입니다."],"d":"스트레스드-멤버 프레임은 엔진을 힘을 받는 부재(스트레스 멤버)로 삼아 프레임의 일부로 쓰는 방식입니다. 프레임 재료를 줄일 수 있어 강성을 높이면서 무게를 줄입니다."}},{"q":"이륜자동차 프레임의 한 종류인 더블 크래들 프레임의 특징은?","o":["엔진이 프레임 외부에 완전히 노출되어 있다.","두 개의 프레임이 더 내려와 엔진을 완전히 감싸고 지지하는 형태이다.","파이프를 구부리고 용접하는 공정이 비교적 간단하다.","가장 가벼운 프레임 구조이다."],"a":1,"e":{"w":["더블 크래들은 엔진을 프레임이 감싸는 구조입니다.","파이프가 많아 제작 공정이 간단하다고 할 수 없습니다.","파이프가 많아 가장 가벼운 구조가 아닙니다."],"d":"더블 크래들 프레임은 두 개의 다운 튜브가 아래로 내려와 엔진을 요람(크래들)처럼 완전히 감싸고 지지합니다. 튼튼하지만 무겁습니다."}},{"q":"트윈 스파 프레임의 특징으로 옳은 것은?","o":["헤드튜브에서 스윙암 피벗까지 두 개의 빔을 최단 경로로 연결하여 비틀림 강성을 높인다.","배트형(격자형) 튜브망으로 구성되어 있으며, 용접없이 조립된다.","프레임이 엔진을 완전히 둘러싸는 크래들 (cradle) 구조이다.","대부분 수직 스틸 튜브로만 이루어져 있어 경량화에는 불리하다."],"a":0,"e":{"w":["격자형 튜브망은 트렐리스 프레임의 설명이고, 프레임은 용접으로 만듭니다.","엔진을 완전히 둘러싸는 것은 크래들 프레임입니다.","트윈 스파는 주로 알루미늄 빔으로 만들어 가볍습니다."],"d":"트윈 스파 프레임은 굵은 빔 두 개가 헤드튜브에서 스윙암 피벗까지 엔진 양옆을 지나 가장 짧은 길로 이어집니다. 강성이 높아 스포츠 바이크에 많이 씁니다."}},{"q":"차체를 옆으로 기울여 세울 때 쓰는 외다리 장치는?","o":["핸들","사이드 스탠드","브레이크","센터 스탠드"],"a":1,"e":{"w":["핸들은 방향을 조종하는 장치입니다.","브레이크는 속도를 줄이거나 멈추는 장치입니다.","센터 스탠드는 차체 가운데 아래에 달린 두 다리 받침대로, 차체를 기울이지 않고 똑바로 세웁니다."],"d":"사이드 스탠드는 차체 옆으로 내리는 외다리 받침대입니다. 차체를 옆으로 살짝 기울여 스탠드에 기대어 세웁니다. 두 다리로 똑바로 세우는 센터 스탠드와 구분합니다."}},{"q":"이륜자동차 프레임에 다양한 재료의 패널을 혼합하여 사용하는 방식은?","o":["단일 소재 프레임","더블 크래들 프레임","크래임형 프레임","복합소재 프레임"],"a":3,"e":{"w":["단일 소재 프레임은 한 가지 재료만 씁니다.","더블 크래들은 프레임의 구조 형식입니다.","크래들형도 구조 형식입니다."],"d":"복합소재 프레임은 강철, 알루미늄, 탄소 섬유 등 서로 다른 재료를 섞어 써서 각 재료의 장점을 살리는 방식입니다."}},{"q":"이륜자동차 프레임의 알루미늄 재질에 대한 설명으로 옳은 것은?","o":["노면의 진동이나 충격 흡수 능력이 좋다.","강철보다 가볍지만, 수리가 까다롭다.","강철 프레임에 비해 부드러운 승차감을 줄 수 있다.","응력이 용접 부위에 집중되는 경향이 있어, 이 부분이 균열을 방지한다."],"a":1,"e":{"w":["알루미늄은 단단해서 진동과 충격을 흡수하는 능력이 강철보다 떨어집니다.","부드러운 승차감은 강철 프레임의 장점입니다.","응력이 용접 부위에 집중되면 균열이 생기기 쉽습니다. 균열을 방지한다는 설명이 틀렸습니다."],"d":"알루미늄은 강철보다 가벼워 프레임을 가볍게 만들 수 있습니다. 대신 용접과 교정이 어려워 수리가 까다롭습니다."}},{"q":"일반적인 강철 프레임 패널의 가장 큰 장점은?","o":["매우 가볍다.","전혀 녹이 슬지 않는다.","염분이 있는 환경에서 더 강하다.","뛰어난 내구성, 부드러운 승차감, 그리고 수리가 용이하다."],"a":3,"e":{"w":["강철은 무거운 편입니다.","강철은 녹이 습니다.","강철은 염분에 약합니다."],"d":"강철 프레임은 튼튼하고 오래가며, 적당히 휘면서 충격을 흡수해 승차감이 부드럽습니다. 용접과 교정이 쉬워 수리하기도 좋습니다."}},{"q":"강철 프레임 대비 알루미늄 프레임의 단점 중 하나는?","o":["진동 흡수가 전혀 안 된다.","강철보다 밀도가 훨씬 높아 무겁다.","상대적으로 제조비용이 높다.","내식성(녹 방지)이 취약하다."],"a":2,"e":{"w":["진동 흡수가 강철보다 떨어지지만 전혀 안 되는 것은 아닙니다.","알루미늄은 강철보다 밀도가 낮아 가볍습니다.","알루미늄은 강철보다 녹에 강합니다."],"d":"알루미늄은 재료 값이 비싸고 가공과 용접이 어려워, 강철 프레임보다 제조비용이 높습니다."}},{"q":"이륜자동차 프레임의 주요 재료로 사용되는 것은?","o":["강철 또는 알루미늄 합금","플라스틱 합금","티타늄 합금","구리 합금"],"a":0,"e":{"w":["플라스틱은 강도가 부족해 프레임 주재료로 쓰지 않습니다.","티타늄은 일부 고급 차에만 쓰는 비싼 재료입니다.","구리는 무르고 무거워 프레임에 쓰지 않습니다."],"d":"이륜자동차 프레임은 강철 또는 알루미늄 합금으로 만드는 것이 일반적입니다. 강철은 튼튼하고 값이 싸며, 알루미늄 합금은 가볍습니다."}},{"q":"탄소 섬유 패널의 가장 큰 장점이 아닌 것은?","o":["강철이나 알루미늄보다 훨씬 가벼워, 오토바이 전체 무게를 크게 줄일 수 있다.","가속력 향상, 제동 성능 개선, 특히 코너링 시 핸들링 및 민첩성이 향상된다.","금속과 달리 녹슬거나 부식되지 않으며, 고온에 대한 내성이 뛰어나다.","탄소 섬유로 제작되므로 제조비용이 매우 저렴하다."],"a":3,"e":{"w":["탄소 섬유는 강철이나 알루미늄보다 훨씬 가볍습니다. 장점이 맞습니다.","가벼워서 가속, 제동, 핸들링이 좋아집니다. 장점이 맞습니다.","금속과 달리 녹슬지 않습니다. 장점이 맞습니다."],"d":"탄소 섬유는 가볍고 강하며 녹슬지 않지만, 재료와 제작 공정이 비싸서 제조비용이 매우 높습니다. 저렴하다는 ④가 장점이 아닙니다."}},{"q":"이륜자동차 프레임 용접 작업할 경우가 아닌 경우는?","o":["프레임에 균열 시","프레임 파손 시","부품 교체 시","프레임에 심각한 부식 때"],"a":2,"e":{"w":["프레임에 균열이 생기면 용접으로 보수합니다.","프레임이 파손되면 용접으로 보수합니다.","부식이 심해 약해진 부분은 잘라 내고 용접으로 보수합니다."],"d":"용접은 균열, 파손, 심한 부식처럼 프레임 자체가 손상되었을 때 합니다. 부품을 교체하는 일은 볼트를 풀고 조이면 되므로 용접이 필요 없습니다."}},{"q":"프레임 용접 후, 용접 부위의 강도와 내구성을 확보하기 위해 중요한 과정은?","o":["충분한 냉각 및 필요시 후처리","바로 주행한다.","물에 담근다.","기름에 담근다."],"a":0,"e":{"w":["바로 주행하면 아직 식지 않은 용접부가 손상될 수 있습니다.","물에 담가 급하게 식히면 용접부가 약해지고 균열이 생깁니다.","기름에 담그는 것은 프레임 용접의 처리 방법이 아닙니다."],"d":"용접부는 천천히 충분히 식혀야 내부에 무리한 힘이 남지 않습니다. 필요하면 연마, 열처리, 방청 같은 후처리를 해서 강도와 내구성을 확보합니다."}},{"q":"이륜자동차 프레임 재료 중, 강철보다 가볍고 알루미늄보다 강하며 내식성이 뛰어나지만 용접이 까다로운 것은?","o":["리튬","황동","마그네슘","티타늄"],"a":3,"e":{"w":["리튬은 프레임 재료가 아닙니다.","황동은 무르고 무거워 프레임에 쓰지 않습니다.","마그네슘은 가볍지만 부식에 약합니다."],"d":"티타늄은 강철보다 가볍고 알루미늄보다 강하며 녹에 매우 강합니다. 다만 용접할 때 공기와 닿으면 약해지므로 용접이 까다롭고 값이 비쌉니다."}},{"q":"알루미늄 프레임을 용접하려면 다음 중 맞는 용접 방식은?","o":["피복 아크 용접","TIG 용접","가스 용접","저항 용접"],"a":1,"e":{"w":["피복 아크 용접은 얇은 알루미늄에 정밀하게 쓰기 어렵습니다.","가스 용접은 열이 넓게 퍼져 알루미늄 프레임에 맞지 않습니다.","저항 용접은 얇은 판을 겹쳐 붙이는 방식입니다."],"d":"알루미늄은 표면에 산화막이 있고 열이 빨리 퍼져 용접이 어렵습니다. 보호 가스로 용접부를 감싸고 열을 정밀하게 조절할 수 있는 TIG 용접을 씁니다."}},{"q":"용접봉이나 용접선과 같은 용접 재료를 선택 할때 가장 중요하게 고려할 점은?","o":["프레임의 기본 재질","프레임의 두께","프레임의 면적","프레임의 무게"],"a":0,"e":{"w":["두께는 전류 같은 용접 조건을 정할 때 고려합니다.","면적은 용접 재료 선택의 기준이 아닙니다.","무게도 기준이 아닙니다."],"d":" 닙니다.","현가장치도 최우선 항목이 아닙니다.","엔진 상태도 최우선 항목이 아닙니다."],"d":"프레임을 교정하거나 수리하면 앞뒤 바퀴의 정렬이 달라질 수 있습니다. 정렬이 틀어지면 직진성과 조향이 나빠지므로 휠 얼라인먼트를 반드시 다시 확인합니다."}},{"q":"이륜자동차 프레임의 헤드 파이프가 굽거나 변형되었을 때, 가장 직접적으로 영향을 받는 주행 성능은?","o":["엔진 출력 저하","현가장치 성능 저하","제동장치 성능 저하","조향 안정성 및 직진성 저하"],"a":3,"e":{"w":["헤드 파이프는 엔진 출력과 관계가 없습니다.","현가장치의 성능보다 조향에 먼저 영향을 줍니다.","제동장치의 성능과는 직접 관계가 없습니다."],"d":"헤드 파이프는 조향축이 끼워지는 곳입니다. 굽거나 변형되면 조향축의 각도가 틀어져 조향 안정성과 직진성이 나빠집니다."}},{"q":"이륜자동차 프레임 정비 시작 전 가장 먼저 수행해야 할 작업이 아닌 것은?","o":["프레임의 균열 확인","프레임의 종류 확인","프레임 도장 작업","프레임의 변형 확인"],"a":2,"e":{"w":["균열은 정비 전에 먼저 확인합니다. 균열이 있으면 정비 방법이 달라집니다.","프레임의 종류를 알아야 구조에 맞는 정비 방법을 정할 수 있습니다.","변형은 정비 전에 먼저 확인합니다. 휘거나 틀어진 곳이 있으면 교정부터 해야 합니다."],"d":"정비를 시작하기 전에는 프레임의 종류를 알고, 균열과 변형이 있는지 먼저 확인합니다. 프레임 도장 작업은 수리와 교정이 모두 끝난 뒤 마지막에 하는 작업이므로, 가장 먼저 할 작업이 아닙니다."}},{"q":"이륜자동차 프레임 정비 시, 변형된 부분을 교정할 때 가장 중요하게 고려해야 할 사항은?","o":["교정 작업은 저녁에만 한다.","작업 시간을 최대한 단축한다.","과도한 힘으로 인한 2차 손상을 방지한다.","엔진 및 변속기를 분해한다."],"a":2,"e":{"w":["작업하는 시간대는 관계가 없습니다.","서두르면 오히려 손상이 생깁니다.","교정을 위해 엔진과 변속기를 분해하는 것이 고려 사항은 아닙니다."],"d":"변형된 프레임에 힘을 너무 세게 주면 균열이 생기거나 다른 곳이 휘는 2차 손상이 생깁니다. 조금씩 힘을 주며 치수를 확인해 가면서 교정합니다."}},{"q":"이륜자동차 프레임에 새로운 부품을 장착하거나 개조할 때, 중요하게 고려해야 할 사항은?","o":["프레임에 구멍을 많이 뚫어 개조를 편하게 한다.","프레임에 철사로 부품을 튼튼하게 고정한다.","개조할 때는 안전기준에 적합하지 않아도 된다.","프레임의 강성 저하 여부, 무게 중심 변화를 확인한다."],"a":3,"e":{"w":["구멍을 많이 뚫으면 프레임의 강성이 떨어집니다.","철사로는 부품을 안전하게 고정할 수 없습니다.","개조는 안전기준에 맞아야 합니다."],"d":"프레임에 부품을 달거나 개조하면 프레임이 약해지거나 무게 중심이 바뀔 수 있습니다. 강성이 떨어지지 않는지, 무게 중심이 어떻게 변하는지 확인해야 합니다."}},{"q":"이륜자동차의 프레임에 금이 가거나 심하게 휘었다면, 가장 위험한 것은 어떤 상황인가?","o":["주행 중 이륜자동차의 균형을 잃고 사고가 발생할 수 있다.","제동성능이 떨어진다.","변속비가 바뀐다.","승차감이 저하된다."],"a":0,"e":{"w":["제동성능 저하보다 더 위험한 상황이 있습니다.","프레임은 변속비와 관계가 없습니다.","승차감 저하는 가장 위험한 상황이 아닙니다."],"d":"프레임에 금이 가거나 심하게 휘면 주행 중 차가 균형을 잃거나 프레임이 부러질 수 있습니다. 바로 사고로 이어지므로 가장 위험합니다."}},{"q":"이륜자동차 육안으로 프레임 점검 시, 가장 중요하게 확인해야 할 사항이 아닌 것은?","o":["프레임 부식 발생 여부","프레임의 무게 감소 여부","프레임의 균열 여부","프레임 휘어짐 여부"],"a":1,"e":{"w":["부식이 생겼는지는 눈으로 꼭 확인합니다.","균열이 있는지는 눈으로 꼭 확인합니다.","휘어졌는지도 눈으로 꼭 확인합니다."],"d":"육안 점검에서는 부식, 균열, 휘어짐을 봅니다. 프레임의 무게가 줄었는지는 눈으로 알 수도 없고 점검 항목도 아닙니다."}},{"q":"프레임과 연결된 스티어링 헤드 베어링이 손상되어 유격이 클 때 반드시 해야 할 작업은?","o":["베어링에 그리스를 바른다.","핸들을 더 세게 조인다.","손상된 베어링 교체한다.","손상된 베어링에 용접을 한다."],"a":2,"e":{"w":["그리스를 발라도 손상된 베어링은 고쳐지지 않습니다.","세게 조이면 조향이 뻑뻑해지고 베어링이 더 상합니다.","베어링은 용접으로 수리할 수 없습니다."],"d":"베어링이 손상되어 유격이 크면 되살릴 방법이 없습니다. 손상된 베어링을 새것으로 교체해야 합니다."}},{"q":"이륜자동차 스티어링 헤드 베어링이 손상되었을 때, 어떤 문제가 발생할 수 있는가?","o":["체인 소음이 증가한다.","발전기 소음이 증가한다.","브레이크 유격이 커진다.","조향장치에 유격이 생겨서 조향시 불안정하다."],"a":3,"e":{"w":["체인 소음은 체인과 스프로킷의 문제입니다.","발전기 소음과는 관계가 없습니다.","브레이크 유격과는 관계가 없습니다."],"d":"스티어링 헤드 베어링은 조향축을 받쳐 줍니다. 손상되면 조향장치에 유격이 생겨 핸들이 덜컹거리고 조향이 불안정해집니다."}},{"q":"이륜자동차 프레임이 심하게 휘어졌을 때 발생할 수 있는 심각한 문제는?","o":["엔진 소음이 커진다.","직진성 불량, 조향 불안정이 생긴다.","브레이크 성능이 감소된다.","연료 소모량이 증가한다."],"a":1,"e":{"w":["엔진 소음은 프레임 휨과 관계가 없습니다.","브레이크 성능과는 직접 관계가 없습니다.","연료 소모량은 심각한 문제가 아닙니다."],"d":"프레임이 휘면 앞뒤 바퀴가 일직선에 놓이지 않습니다. 그래서 똑바로 가지 못하고(직진성 불량) 조향이 불안정해집니다."}},{"q":"프레임 교체 시, 차대번호(VIN)에 대한 처리 방법으로 옳은 것은?","o":["원래 차대 번호를 그라인더로 지운다.","관련 법규에 따라 구조 변경 등록 절차를 진행해야 한다.","새로운 프레임에 원래 차대 번호를 새긴다.","임의대로 차대번호를 새긴다."],"a":1,"e":{"w":["차대번호를 지우는 것은 불법입니다.","임의로 새기는 것은 불법입니다.","임의로 정해 새기는 것은 불법입니다."],"d":"차대번호는 차를 식별하는 고유 번호입니다. 프레임을 교체하면 차대번호가 달라지므로, 관련 법규에 따라 구조 변경 등록 절차를 밟아야 합니다."}},{"q":"프레임 교체 후, 관련 법규에 따라 반드시 해야 할 행정 절차는?","o":["보험 회사에 알린다.","제조 회사에 알린다.","새로운 번호판을 신청한다.","구조 변경 등록 또는 차량 등록 정보를 업데이트한다."],"a":3,"e":{"w":["보험 회사에 알리는 것은 법에서 정한 행정 절차가 아닙니다.","제조 회사에 알리는 것도 행정 절차가 아닙니다.","번호판을 새로 신청하는 것이 아닙니다."],"d":"프레임을 교체하면 등록된 차량 정보(차대번호 등)가 달라집니다. 관련 법규에 따라 구조 변경 등록을 하거나 차량 등록 정보를 고쳐야 합니다."}},{"q":"프레임에 심한 부식이 발생했을 때, 반드시 할 작업은?","o":["녹을 제거하기만 한다.","표면 처리 및 방청 작업 후 재도장 한다.","녹 위에 엔진오일을 뿌려 놓는다.","녹 위에 페인트를 칠한다."],"a":1,"e":{"w":["녹만 없애고 그대로 두면 곧 다시 녹이 습니다.","오일을 뿌리는 것은 임시방편입니다.","녹 위에 페인트를 칠하면 안에서 부식이 계속됩니다."],"d":"심한 부식은 녹을 완전히 없애는 표면 처리를 하고, 방청제를 바른 다음, 다시 도장해야 부식이 재발하지 않습니다."}},{"q":"이륜자동차에서 프레임의 부식을 일으키는 주요 원인이 아닌 것은?","o":["염분","산성비","방청제","습기"],"a":2,"e":{"w":["염분은 금속의 부식을 빠르게 합니다.","산성비는 금속을 부식시킵니다.","습기는 녹의 원인입니다."],"d":"부식은 염분, 산성비, 습기 때문에 생깁니다. 방청제는 녹을 막는 약품이므로 부식의 원인이 아닙니다."}},{"q":"이륜자동차 프레임 정비에서 방진 작업의 주된 목적은?","o":["프레임을 더 약하게 하기 위함","프레임 내부나 연결 부위에 쌓여 부식 방지하기 위함","프레임의 유연성을 높이기 위함","프레임의 강도를 약화시키기 위함"],"a":1,"e":{"w":["방진 작업은 프레임을 약하게 하려는 것이 아닙니다.","유연성과는 관계가 없습니다.","강도를 약하게 하려는 것이 아닙니다."],"d":"프레임 내부나 연결 부위에 먼지와 이물질이 쌓이면 습기를 머금어 부식이 시작됩니다. 방진 작업은 이것을 막기 위한 것입니다."}},{"q":"이륜자동차 프레임에 부식이 심하게 발생했을 때, 발생할 수 있는 문제점은?","o":["프레임의 색깔이 변한다.","프레임 설치 높이가 낮아진다.","프레임의 강도가 약해져 균열이 발생한다.","프레임이 휘어진다."],"a":2,"e":{"w":["색깔이 변하는 것은 심각한 문제가 아닙니다.","부식으로 설치 높이가 낮아지지는 않습니다.","휘어지는 것은 충격이나 과한 하중 때문입니다."],"d":"부식이 심하면 금속이 얇아지고 약해집니다. 강도가 떨어진 부분에 힘이 걸리면 균열이 생깁니다."}},{"q":"방청 및 방진 작업 후, 이륜자동차 관리에 대한 설명으로 가장 적절한 것은?","o":["이륜자동차를 세척하고 코팅 상태를 확인한다.","방진 작업을 했기 때문에 세차를 하지 말아야 된다.","습기가 많은 곳에 주차한다.","작업 후에는 코팅 상태를 확인하기 위해 뾰족한 것으로 긁어 본다."],"a":0,"e":{"w":["방진 작업을 했어도 세차는 해야 합니다.","습기가 많은 곳은 부식을 일으킵니다.","뾰족한 것으로 긁으면 코팅이 벗겨집니다."],"d":"방청·방진 작업 뒤에도 차를 깨끗이 세척하고 코팅이 벗겨진 곳이 없는지 확인해야 효과가 유지됩니다."}},{"q":"프레임의 방진 작업을 위해 가장 중요하게 고려해야 할 부분이 아닌 것은?","o":["볼트/너트 연결 부위","프레임 내부 및 외부","시트커버","용접 부위"],"a":2,"e":{"w":["볼트와 너트 연결 부위는 틈에 물과 먼지가 고이기 쉽습니다.","프레임의 안팎은 모두 방진 대상입니다.","용접 부위는 부식이 시작되기 쉬운 곳입니다."],"d":"방진 작업은 볼트·너트 연결 부위, 프레임 안팎, 용접 부위처럼 금속이 부식되기 쉬운 곳에 합니다. 시트커버는 금속 프레임이 아니므로 대상이 아닙니다."}},{"q":"CO2 가스 용접 작업 시 용접 비드의 산화를 막기 위해 권장되는 차폐가스의 표준 방출 유량은?","o":["1 L/min","5 L/min","15 L/min","80 L/min"],"a":2,"e":{"w":["1 L/min은 가스가 너무 적어 용융부를 덮지 못합니다.","5 L/min은 가스가 부족해 기공이 생기기 쉽습니다.","80 L/min은 지나치게 많아 가스 흐름이 흐트러지고 오히려 공기가 말려 들어갑니다."],"d":"CO₂ 용접은 이산화탄소 가스로 용융부를 덮어 공기 중의 산소와 질소가 닿지 않게 합니다.\n가스 유량은 보통 10~20 L/min 범위에서 쓰므로 보기 중에서는 15 L/min이 알맞습니다. 유량이 적으면 기공이 생기고, 너무 많으면 가스 흐름이 흐트러져 차폐가 나빠집니다."}},{"q":"차체 알루미늄 합금 및 얇은 박판 용접에 적합하며, 비소모성 텅스텐 전극봉과 불활성 가스를 사용하여 슬래그 발생이 없는 용접법은?","o":["피복 아크 용접 (SMAW)","TIG 용접 (GTAW)","산소-아세틸렌 가스 용접","서브머지드 용접"],"a":1,"e":{"w":["피복 아크 용접은 피복제가 녹아 슬래그가 생깁니다.","산소-아세틸렌 용접은 가스 불꽃으로 녹이는 용접입니다.","서브머지드 용접은 가루 용제 속에서 하는 자동 용접으로, 두꺼운 판에 씁니다."],"d":"TIG 용접은 녹지 않는 텅스텐 전극과 모재 사이에 아크를 일으키고, 아르곤 같은 불활성 가스로 용융부를 보호합니다.\n슬래그가 생기지 않고 열을 세밀하게 조절할 수 있어 알루미늄 합금이나 얇은 판의 용접에 알맞습니다."}},{"q":"아크 용접부에서 과도한 용접 전류 설정이나 토치 운봉 미숙으로 모재 모서리가 움푹 파여 단면 결손이 생기는 용접 결함은?","o":["오버랩 (Overlap)","언더컷 (Undercut)","블로우 홀 (기공)","크레이터 (Crater)"],"a":1,"e":{"w":["오버랩은 녹은 금속이 모재에 융합되지 않고 겹쳐 덮인 결함입니다.","블로우 홀은 용접부 안에 가스가 갇혀 생긴 구멍입니다.","크레이터는 용접을 끝낸 자리에 남는 오목한 부분입니다."],"d":"언더컷은 용접 비드의 가장자리에서 모재가 녹아 파였는데 용접 금속이 채워지지 않아 홈이 남은 결함입니다.\n전류가 너무 높거나 용접 속도가 빠를 때, 토치 각도와 운봉이 맞지 않을 때 생깁니다. 그 부분의 단면이 줄어 강도가 떨어집니다."}}]},{"g":"전기 이륜자동차","name":"전기 이륜자동차","id":"p11","qs":[{"q":"전기 이륜자동차에서 에너지를 저장하는 부품은?","o":["DC-DC 컨버터","배터리","MCU","모터"],"a":1,"e":{"w":["DC-DC 컨버터는 전압을 바꾸는 장치입니다.","MCU는 모터를 제어하는 장치입니다.","모터는 전기로 바퀴를 돌리는 장치입니다."],"d":"전기 이륜자동차는 배터리에 전기 에너지를 저장했다가 모터를 돌릴 때 꺼내 씁니다. 엔진 차의 연료탱크에 해당합니다."}},{"q":"전기 이륜자동차의 배터리 팩에 사용되는 전압 단위는?","o":["리터(L)","마력(PS)","칼로리(cal)","볼트(V)"],"a":3,"e":{"w":["리터(L)는 부피의 단위입니다.","마력(PS)은 출력의 단위입니다.","칼로리(cal)는 열량의 단위입니다."],"d":"전압의 단위는 볼트(V)입니다. 배터리 팩의 전압도 볼트로 나타냅니다."}},{"q":"전기 이륜자동차 배터리의 역할은?","o":["연료에 불꽃을 점화한다.","전기 이륜자동차의 무게 중심을 조절한다.","전기 모터 구동 및 전력을 저장하고 공급한다.","브레이크 시스템 유압을 조절한다."],"a":2,"e":{"w":["불꽃 점화는 엔진 점화장치의 일입니다.","무게 중심 조절은 배터리의 역할이 아닙니다.","브레이크 유압 조절은 제동장치의 일입니다."],"d":"배터리는 전기를 저장해 두었다가 모터를 돌리는 데 공급하고, 등화 장치 같은 전장품에도 전력을 공급합니다."}},{"q":"전기 이륜자동차에 주로 사용되는 배터리는?","o":["납축전지 배터리","리튬-이온 배터리","알칼리 배터리","니켈-카드뮴 배터리"],"a":1,"e":{"w":["납축전지는 무겁고 에너지 밀도가 낮아 구동용으로 잘 쓰지 않습니다.","알칼리 배터리는 충전해서 쓰는 구동용 배터리가 아닙니다.","니켈-카드뮴 배터리는 에너지 밀도가 낮아 지금은 거의 쓰지 않습니다."],"d":"리튬-이온 배터리는 가볍고 에너지 밀도가 높으며 수명이 길어 전기 이륜자동차에 주로 씁니다."}},{"q":"전기 이륜자동차의 고전압 배터리 팩 내부에서 각 셀의 전압 불균형이 심화될 경우 발생할 수 있는 문제로 가장 적절한 것은?","o":["배터리 팩의 전체 용량 감소","모터의 과열","BMS의 손상","OBC의 작동불량"],"a":0,"e":{"w":["셀 전압 불균형은 모터 과열의 원인이 아닙니다.","BMS는 불균형을 감시하고 맞추는 장치이지, 불균형으로 손상되는 부품이 아닙니다.","OBC는 충전기라서 셀 불균형으로 고장 나지 않습니다."],"d":"배터리 팩은 여러 셀을 이어 만듭니다. 전압이 가장 낮은 셀이 먼저 방전 한계에 닿으면 나머지 셀에 전기가 남아 있어도 더 쓸 수 없습니다. 그래서 불균형이 심해지면 팩 전체의 쓸 수 있는 용량이 줄어듭니다."}},{"q":"전기 이륜자동차의 고전압 시스템에서 주황색 케이블을 사용하는 주된 이유는?","o":["고전압 시스템임을 시각적으로 경고하기 위해","낮은 전압을 나타내기 위해","미관상 보기 좋기 때문에","케이블의 내구성을 높이기 위해"],"a":0,"e":{"w":["주황색은 낮은 전압이 아니라 고전압을 뜻합니다.","보기 좋으라고 쓰는 색이 아닙니다.","색으로 내구성이 높아지지 않습니다."],"d":"고전압 케이블은 잘못 만지면 감전될 수 있습니다. 누구나 한눈에 알아보도록 주황색으로 통일해 고전압임을 경고합니다."}},{"q":"전기 이륜자동차의 주행 중 배터리 잔량이 급격히 감소하거나 주행 거리가 현저히 짧아지는 현상이 발생할 때 가장 먼저 의심할 부품은?","o":["감속기","전조등","쇽업쇼버","고전압 배터리 팩"],"a":3,"e":{"w":["감속기는 배터리 잔량과 관계가 없습니다.","전조등의 전력 소모는 주행 거리를 크게 줄일 만큼 크지 않습니다.","쇽업소버는 전기와 관계가 없습니다."],"d":"배터리 잔량이 급격히 줄거나 주행 거리가 눈에 띄게 짧아지면 고전압 배터리 팩의 성능 저하(노화, 셀 불량)를 가장 먼저 의심합니다."}},{"q":"전기 이륜자동차의 브레이크를 잡을 때, 버려 지는 에너지를 다시 전기로 바꾸어 배터리를 충전하는 것은?","o":["ABS","TCS","회생 제동","크루즈 컨트롤"],"a":2,"e":{"w":["ABS는 바퀴 잠김을 막는 장치입니다.","TCS는 구동 바퀴가 헛도는 것을 막는 장치입니다.","크루즈 컨트롤은 설정 속도를 유지하는 장치입니다."],"d":"회생 제동은 감속할 때 바퀴가 모터를 돌리게 해서 모터를 발전기로 쓰는 것입니다. 열로 버려질 운동 에너지를 전기로 바꿔 배터리를 충전합니다."}},{"q":"전기 이륜자동차의 배터리 팩을 장기간 보관할 때 가장 적절한 관리 방법은?","o":["완전히 방전된 상태로 보관한다.","약 50~70% 충전 상태로 서늘하고 건조한 곳에 보관한다.","100% 완전히 충전된 상태로 보관한다.","배터리 팩을 분리하여 물속에 보관한다."],"a":1,"e":{"w":["완전히 방전된 채로 두면 배터리가 손상되어 다시 충전되지 않을 수 있습니다.","100% 충전 상태로 오래 두면 배터리 노화가 빨라집니다.","물속에 두면 합선과 화재의 위험이 있습니다."],"d":"리튬-이온 배터리는 절반 정도(약 50~70%) 충전한 상태로 서늘하고 건조한 곳에 두는 것이 수명에 가장 좋습니다."}},{"q":"전기 이륜자동차의 배터리 온도가 너무 높아지 거나 낮아지는 것을 관리하는 시스템은?","o":["TPMS","BMS","SCC","MCU"],"a":1,"e":{"w":["TPMS는 타이어 공기압 감시 장치입니다.","SCC는 앞차와의 거리를 유지하며 달리는 장치입니다.","MCU는 모터 제어 장치입니다."],"d":"BMS(배터리 관리 시스템)는 배터리의 전압, 전류, 온도를 감시하고 관리합니다. 온도가 너무 높거나 낮으면 냉각하거나 충·방전을 제한합니다."}},{"q":"전기 이륜자동차의 배터리가 뜨거워지는 것을 막기 위한 방법은?","o":["에어컨을 틀어놓는다.","햇빛 아래에 둔다.","충전을 멈춘다.","냉각 시스템으로 온도를 조절한다."],"a":3,"e":{"w":["에어컨은 배터리를 식히는 장치가 아닙니다.","햇빛 아래에 두면 더 뜨거워집니다.","충전을 멈추는 것은 임시 조치이고 주행 중의 발열은 막지 못합니다."],"d":"배터리는 충전과 방전 때 열이 납니다. 공랭이나 수랭 방식의 냉각 시스템으로 온도를 알맞게 유지합니다."}},{"q":"전기 이륜자동차를 충전할 때 감전 사고를 예방 하기 위해 가장 중요하게 지켜야 할 것은?","o":["장갑을 끼지 않는다.","젖은 손으로 충전기를 만진다.","충전 중에는 시동을 걸어둔다.","충전 케이블이 손상되지 않았는지 확인하고 올바르게 연결한다."],"a":3,"e":{"w":["절연 장갑을 끼는 것이 안전합니다.","젖은 손으로 만지면 감전됩니다.","충전 중에는 시동을 꺼야 합니다."],"d":"충전 케이블의 피복이 벗겨지거나 손상되면 감전과 화재의 원인이 됩니다. 충전 전에 케이블과 커넥터가 멀쩡한지 확인하고 바르게 연결합니다."}},{"q":"전기 이륜자동차의 충전 시간을 줄이는 방법 중 하나는?","o":["배터리 용량을 줄인다.","완속 충전기를 사용한다.","급속 충전기를 사용한다.","회생 제동을 자주 이용한다."],"a":2,"e":{"w":["용량을 줄이면 주행 거리가 짧아지므로 방법이 될 수 없습니다.","완속 충전기는 충전 시간이 깁니다.","회생 제동은 주행 중 조금 충전될 뿐 충전 시간을 줄이는 방법이 아닙니다."],"d":"급속 충전기는 높은 전압과 큰 전류로 충전하므로 충전 시간이 짧습니다."}},{"q":"전기 이륜자동차의 주행 중 배터리 잔량이 부족할 때 계기판에 표시되는 것은?","o":["연료 부족 경고등","배터리 잔량 경고등","오일 압력 경고등","엔진 과열 경고등"],"a":1,"e":{"w":["전기 이륜자동차에는 연료가 없습니다.","엔진 오일이 없어 오일 압력 경고등이 없습니다.","엔진이 없어 엔진 과열 경고등이 없습니다."],"d":"배터리 잔량이 일정 수준 아래로 내려가면 계기판에 배터리 잔량 경고등이 켜져 충전하라고 알려 줍니다."}},{"q":"전기 이륜자동차의 고전압 배터리 팩에 사용하는 절연 장갑의 점검 주기로 적절한 것은?","o":["매일 작업 전 육안으로 점검한다.","한 달에 한 번씩 육안으로 점검한다.","절연장갑은 소모품이므로 작업 전 교환한다.","일 년에 한 번씩 육안으로 점검한다."],"a":0,"e":{"w":["한 달에 한 번은 너무 드뭅니다. 그 사이에 구멍이 나면 감전됩니다.","멀쩡한 장갑을 매번 버릴 필요는 없습니다.","일 년에 한 번은 너무 드뭅니다."],"d":"절연 장갑은 작은 구멍이나 찢어진 곳만 있어도 감전을 막지 못합니다. 그래서 매일 작업 전에 눈으로 손상이 없는지 점검합니다."}},{"q":"전기 이륜자동차가 소음이 적은 이유는?","o":["타이어가 부드럽기 때문에","브레이크가 잘 작동하기 때문에","차체가 무겁기 때문에","전기 모터로 작동하기 때문에"],"a":3,"e":{"w":["타이어 때문이 아닙니다.","브레이크 때문이 아닙니다.","무게 때문이 아닙니다."],"d":"엔진은 연료를 폭발시키며 돌기 때문에 폭발음과 배기음이 큽니다. 전기 모터는 폭발 없이 전자기력으로 돌아 소음이 적습니다."}},{"q":"전기 이륜자동차가 주행 중 멈추는 가장 흔한 이유는?","o":["타이어 펑크","배터리 방전","연료 부족","엔진 과열"],"a":1,"e":{"w":["타이어 펑크도 원인이지만 가장 흔한 이유는 아닙니다.","전기 이륜자동차에는 연료가 없습니다.","전기 이륜자동차에는 엔진이 없습니다."],"d":"전기 이륜자동차는 배터리의 전기로만 달립니다. 주행 중 멈추는 가장 흔한 이유는 배터리 방전입니다."}},{"q":"전기 이륜자동차의 배터리 충전 시, 급속 충전 방식의 특징으로 옳은 것은?","o":["충전 시간이 매우 길다.","가정용 220V 콘센트만으로 가능하다.","일반 충전보다 높은 전압과 전류를 사용한다.","배터리 수명에 긍정적인 영향을 미친다."],"a":2,"e":{"w":["급속 충전은 충전 시간이 짧습니다.","급속 충전은 전용 충전 설비가 필요합니다.","급속 충전을 자주 하면 배터리에 열이 많이 나 수명에 좋지 않습니다."],"d":"급속 충전은 일반(완속) 충전보다 높은 전압과 큰 전류를 써서 짧은 시간에 충전합니다."}},{"q":"전기 이륜자동차의 계기판에서 확인할 수 있는 중요한 정보 중 하나는?","o":["엔진 회전수","배터리 잔량","연료 잔량","엔진 오일 압력"],"a":1,"e":{"w":["전기 이륜자동차에는 엔진이 없습니다.","연료를 쓰지 않습니다.","엔진 오일이 없습니다."],"d":"전기 이륜자동차의 계기판에서는 배터리 잔량이 가장 중요한 정보입니다. 남은 주행 가능 거리를 판단하는 기준이  말고 해당 회사에 전 화한다.","배터리를 직접 꺼내서 분해한다."],"a":1,"e":{"w":["물에 잠긴 고전압 배터리를 직접 만지면 감전됩니다.","회사에 연락하는 것보다 긴급 구조 기관에 신고하는 것이 먼저입니다.","직접 꺼내 분해하면 감전과 화재의 위험이 있습니다."],"d":"물에 잠긴 고전압 배터리는 감전과 화재의 위험이 매우 큽니다. 절대 가까이 가지 말고 즉시 소방서에 신고합니다."}},{"q":"전기 이륜자동차 충전 중 배터리 온도가 과도하게 상승했을 때 충전 시스템이 하는 역할은?","o":["충전 용량을 늘린다.","충전 시간을 늘린다.","충전 시간을 줄이거나 충전을 일시 중단한다.","배터리 전압을 증가시킨다."],"a":2,"e":{"w":["온도가 오른 상태에서 충전 용량을 늘리면 더 위험합니다.","충전 시간을 늘리는 것은 보호 동작이 아닙니다.","전압을 높이면 열이 더 납니다."],"d":"배터리 온도가 지나치게 오르면 충전 시스템이 충전 전류를 줄이거나 충전을 잠시 멈춰 배터리를 보호합니다."}},{"q":"전기 이륜자동차의 메인 릴레이(Main Contactor) 점검 시, 릴레이 작동 음이 들리지 않거나 비정상적인 소음이 발생한다면 의심할 수 있는 것은?","o":["릴레이 자체의 고장 또는 제어 회로 문제","릴레이 케이스 손상","BMS 불량","OBC 불량"],"a":0,"e":{"w":["케이스 손상만으로는 작동음이 달라지지 않습니다.","BMS 불량보다 릴레이 자체와 그 제어 회로를 먼저 의심합니다.","OBC는 충전기라서 메인 릴레이 작동음과 관계가 없습니다."],"d":"메인 릴레이는 붙고 떨어질 때 '딸깍' 소리가 납니다. 소리가 나지 않거나 이상한 소리가 나면 릴레이 자체가 고장 났거나 릴레이를 작동시키는 제어 회로에 문제가 있는 것입니다."}},{"q":"전기 이륜자동차의 모터 컨트롤러가 수행하는 주요 역할은?","o":["고전압 배터리를 저전압으로 변환한다.","배터리 셀의 전압 균형을 맞춘다.","충전 전류와 전압을 조절한다.","모터 구동에 필요한 교류 전력으로 변환한다."],"a":3,"e":{"w":["고전압을 저전압으로 바꾸는 것은 DC-DC 컨버터입니다.","셀 전압 균형을 맞추는 것은 BMS입니다.","충전 전류와 전압을 조절하는 것은 OBC입니다."],"d":"모터 컨트롤러는 배터리의 직류 전력을 모터를 돌리는 데 필요한 교류 전력으로 바꾸고, 그 크기를 조절해 모터의 속도와 힘을 제어합니다."}},{"q":"전기 이륜자동차의 구동 시스템에서 DC-DC 컨버터의 역할은?","o":["고전압 배터리의 직류 전력을 모터 구동용 교류 전력으로 변환한다.","회생 제동 시 발생한 전력을 배터리로 전달한다.","외부 교류 전원을 배터리 충전용 직류 전원 으로 변환한다.","고전압 배터리의 직류 전력을 저전압(12V)"],"a":3,"e":{"w":["직류를 모터 구동용 교류로 바꾸는 것은 모터 컨트롤러(인버터)입니다.","회생 제동 전력을 배터리로 보내는 것은 모터 컨트롤러입니다.","외부 교류를 충전용 직류로 바꾸는 것은 OBC입니다."],"d":"DC-DC 컨버터는 고전압 배터리의 직류를 저전압(12V) 직류로 낮춰, 등화 장치와 계기판 같은 전장품에 전력을 공급합니다."}},{"q":"전기 이륜자동차의 모터 컨트롤러 고장 시 발생할 수 있는 현상으로 거리가 먼 것은?","o":["배터리 충전 불량","계기판 경고등 점등","모터 작동 불량","가속 또는 출력 저하"],"a":0,"e":{"w":["모터 컨트롤러가 고장 나면 계기판에 경고등이 켜집니다.","모터가 제대로 작동하지 않습니다.","가속이 둔해지거나 출력이 떨어집니다."],"d":"모터 컨트롤러는 모터를 제어하는 장치입니다. 충전은 OBC와 BMS가 맡으므로 배터리 충전 불량은 모터 컨트롤러 고장과 거리가 멉니다."}},{"q":"전기 이륜자동차에서 모터의 속도와 방향을 조절하는 전자장치는?","o":["LDC","BMS","OBC","MCU"],"a":3,"e":{"w":["LD  전장품에 공급합니다."}},{"q":"전기 이륜자동차의 직류 전원장치는 주로 어떤 형태의 전력을 다루는가?","o":["교류(AC)","교류와 직류 모두","직류(DC)","고주파(RF)"],"a":2,"e":{"w":["직류 전원장치는 교류를 다루는 장치가 아닙니다.","직류 전원장치는 직류를 다룹니다.","고주파는 통신에 쓰는 것입니다."],"d":"직류 전원장치는 이름 그대로 직류(DC) 전력을 다룹니다. 배터리의 전기가 직류입니다."}},{"q":"직류 전원장치가 과열되거나 과부하가 걸렸을 때, 장치를 보호하기 위해 내장된 기능은?","o":["배터리 충전 기능","과열/과전류 보호 기능","모터 제어 기능","전압 증가 기능"],"a":1,"e":{"w":["충전은 보호 기능이 아닙니다.","모터 제어는 모터 컨트롤러의 일입니다.","전압을 높이면 오히려 위험합니다."],"d":"직류 전원장치는 온도가 너무 오르거나 전류가 지나치게 흐르면 스스로 출력을 줄이거나 끊는 과열·과전류 보호 기능을 갖추고 있습니다."}},{"q":"전기 이륜자동차의 동력전달 방식 중 모터가 직접 바퀴와 연결되어 기어가 없는 방식은?","o":["직결 구동 방식","샤프트 구동 방식","체인 구동 방식","벨트 구동 방식"],"a":0,"e":{"w":["샤프트 구동은 축과 기어로 전달합니다.","체인 구동은 체인과 스프로킷으로 전달합니다.","벨트 구동은 벨트와 풀리로 전달합니다."],"d":"직결 구동 방식은 모터가 바퀴에 직접 연결된(바퀴 안에 모터를 넣은 인휠 모터 등) 방식입니다. 기어, 체인, 벨트가 없어 구조가 간단하고 동력 손실이 적습니다."}},{"q":"전기 이륜자동차의 모터가 과열되었을 때 발생할 수 있는 현상은?","o":["모터 손상 또는 성능 저하","배터리 충전 속도 증가","모터 성능 향상","소음 감소"],"a":0,"e":{"w":["모터 과열은 충전 속도와 관계가 없습니다.","과열되면 성능이 떨어집니다.","소음이 줄어들지 않습니다."],"d":"모터가 과열되면 코일의 절연이 상하고 자석의 힘이 약해져 모터가 손상되거나 성능이 떨어집니다."}},{"q":"회생 제동 기능이 있는 전기 이륜자동차의 모터는 감속 시 어떤 역할을 하는가?","o":["모터 수명을 단축시킨다.","제동력을 단축시킨다.","모터가 발전기처럼 작동, 배터리를 충전시킨다.","모터가 정지된다."],"a":2,"e":{"w":["회생 제동이 모터 수명을 줄이는 것은 아닙니다.","제동력을 줄이는 것이 아니라 제동을 돕습니다.","모터는 멈추지 않고 발전기로 작동합니다."],"d":"감속할 때는 바퀴가 모터를 돌립니다. 이때 모터가 발전기처럼 작동해 전기를 만들고, 그 전기로 배터리를 충전합니다."}},{"q":"BLDC(Brush less DC) 모터의 가장 큰 특징은?","o":["고정자가 없다.","회전자가 없다.","코일이 없다.","브러시가 없다."],"a":3,"e":{"w":["BLDC 모터에도 고정자가 있습니다.","회전자가 있습니다.","코일이 있습니다."],"d":"BLDC는 브러시리스(Brushless) DC 모터의 줄임말입니다. 전류의 방향을 바꾸는 브러시가 없고, 대신 전자 회로가 그 일을 합니다. 닳는 부품이 없어 수명이 깁니다."}},{"q":"BLDC 모터에서 회전자의 현재 위치를 감지하여 모터 컨트롤러에 피드백하는 센서는?","o":["온도 센서","홀 센서","위치 센서","압력 센서"],"a":1,"e":{"w":["온도 센서는 온도를 감지합니다.","위치 센서는 넓은 뜻의 이름이고, BLDC 모터에서 회전자 위치를 감지하는 구체적인 센서는 홀 센서입니다.","압력 센서는 압력을 감지합니다."],"d":"홀 센서는 자석의 자기장을 감지하는 센서입니다. 회전자의 자석이 지나가는 것을 감지해 회전자가 지금 어디에 있는지를 모터 컨트롤러에 알려 줍니다."}},{"q":"BLDC 모터에서 고정자(Stator)는 주로 어떤 방식으로 구성되어 있는가?","o":["영구자석","브러시가 접촉하는 부분","로터와 접촉하는 부분","코일이 감겨 전자석을 만드는 부분"],"a":3,"e":{"w":["BLDC 모터에서 영구자석은 회전자에 있습니다.","BLDC 모터에는 브러시가 없습니다.","고정자는 로터와 닿지 않습니다."],"d":"BLDC 모터의 고정자는 코일을 감아 만든 전자석입니다. 코일에 전류를 순서대로 흘려 회전하는 자기장을 만들고, 영구자석으로 된 회전자가 그 자기장을 따라 돕니다."}},{"q":"BLDC 모터에서 브러시 대신 전자적으로 전류의 방향을 전환하여 모터의 회전을 제어하는 핵심 장치는?","o":["배터리 관리 시스템","온보드 충전기","모터 컨트롤러","DC-DC 컨버터"],"a":2,"e":{"w":["배터리 관리 시스템은 배터리를 감시하고 보호합니다.","온보드 충전기는 충전을 맡습니다.","DC-DC 컨버터는 전압을 바꿉니다."],"d":"BLDC 모터는 브러시가 없으므로, 모터 컨트롤러가 반도체 스위치로 코일에 흐르는 전류의 방향을 바꿔 가며 회전을 제어합니다."}},{"q":"BLDC 모터의 효율이 높은 주된 이유는?","o":["모터가 용량이 크기 때문이다.","수냉식으로 냉각되기 때문이다.","알루미늄으로 제작되기 때문이다.","전자적인 제어가 정밀하여 에너지 손실이 적기 때문이다."],"a":3,"e":{"w":["용량이 크다고 효율이 높은 것은 아닙니다.","냉각 방식은 효율이 높은 주된 이유가 아닙니다.","재질 때문이 아닙니다."],"d":"BLDC 모터는 브러시가 없어 마찰과 불꽃으로 잃는 에너지가 없고, 전자 제어로 전류를 정밀하게 조절합니다. 그래서 에너지 손실이 적고 효율이 높습니다."}},{"q":"전기 모터가 작동하면서 발생하는 열을 효과적 으로 식히는 방법은?","o":["공랭 또는 수냉 방식을 사용한다.","감속기 오일로 열을 식힌다.","모터는 원래 열이 발생하지 않아 식힐 필요가 없다.","모터의 크기를 크게 한다."],"a":0,"e":{"w":["감속기 오일은 감속기를 윤활하는 것입니다.","모터도 작동하면 열이 납니다.","크기를 키우는 것은 식히는 방법이 아닙니다."],"d":"모터는 코일에 전류가 흐르면서 열이 납니다. 바람으로 식히는 공랭 방식이나 냉각수로 식히는 수냉 방식으로 열을 내보냅니다."}},{"q":"전기 이륜자동차의 주행 모터의 홀 센서(Hall Sensor)의 역할은?","o":["모터의 온도를 측정한다.","모터의 작동음을 측정한다.","모터의 전류량을 측정한다.","모터의 회전속도 및 위치를 감지한다."],"a":3,"e":{"w":["온도는 온도 센서가 측정합니다.","작동음을 측정하는 센서가 아닙니다.","전류량은 전류 센서가 측정합니다."],"d":"홀 센서는 회전자 자석의 자기장을 감지해 모터의 회전 속도와 회전자의 위치를 알아냅니다. 모터 컨트롤러는 이 신호에 맞춰 전류를 보냅니다."}},{"q":"전기 모터가 회전할 때 발생하는 회전력을 나타내는 단위는?","o":["킬로와트(kW)","뉴턴미터(Nm) 또는 kgf⋅m(토크)","암페어(A)","볼트(V)"],"a":1,"e":{"w":["킬로와트(kW)는 출력의 단위입니다.","암페어(A)는 전류의 단위입니다.","볼트(V)는 전압의 단위입니다."],"d":"회전력은 토크라고 하며, 단위는 뉴턴미터(Nm) 또는 kgf·m입니다."}},{"q":"전기 모터의 출력(Power)을 나타내는 주요 단위는?","o":["볼트(V)","킬로와트(kW)","암페어시(Ah)","뉴턴미터(Nm)"],"a":1,"e":{"w":["볼트(V)는 전압의 단위입니다.","암페어시(Ah)는 배터리 용량의 단위입니다.","뉴턴미터(Nm)는 토크의 단위입니다."],"d":"모터의 출력(일을 하는 빠르기)은 킬로와트(kW)로 나타냅니다. 출력은 토크와 회전수를 곱한 값에 비례합니다."}},{"q":"전기이륜차의 리튬 배터리 팩 내부에서 각 단위 셀 간 전압 평형화(Cell Balancing) 및 온도 감시를 전담하는 제어기는?","o":["브레이크 패드 컨트롤러","BMS (배터리 관리 시스템)","전조등 자동제어기","타이어 공기압 모니터"],"a":1,"e":{"w":["브레이크 패드는 제동장치 부품으로, 배터리 셀을 관리하지 않습니다.","전조등 자동제어기는 등화장치를 제어합니다.","타이어 공기압 모니터(TPMS)는 타이어 압력을 감시합니다."],"d":"BMS(Battery Management System)는 배터리 팩 안의 각 셀 전압과 온도를 감시하고, 셀 사이의 전압 차이를 줄이는 셀 밸런싱을 합니다.\n과충전, 과방전, 과전류, 과열이 생기면 전류를 제한하거나 차단해 배터리를 보호합니다."}},{"q":"고전압 트랙션 배터리의 고전압 직류를 계기판, 등화장치 등 전장품용 12V 저전압으로 변환해주는 장치는?","o":["인버터 (Inverter)","DC-DC 컨버터","점화 코일","발전 제너레이터"],"a":1,"e":{"w":["인버터는 직류를 교류로 바꿔 구동 모터를 돌립니다.","점화 코일은 엔진의 점화용 고전압을 만드는 부품입니다.","제너레이터는 엔진의 회전으로 전기를 만드는 발전기입니다."],"d":"전기 이륜자동차의 등화장치, 계기판, 제어기는 12V로 작동합니다.\nDC-DC 컨버터는 고전압 배터리의 직류를 12V 직류로 낮춰 이 장치들에 공급하고 12V 보조 배터리를 충전합니다. 직류를 직류로 바꾸므로 DC-DC입니다."}},{"q":"전기이륜차 스로틀 포지션 센서(홀 센서 방식)의 정상 출력 신호 전압 영역대로 옳은 것은?","o":["전폐(아이들): 0.8~1.0V, 전개(풀스로틀): 3.8~4.2V","전폐: 3.8~4.2V, 전개: 0.8~1.0V","전폐: 12V, 전개: 24V","전폐: 0V, 전개: 1V"],"a":0,"e":{"w":["전폐와 전개의 전압이 서로 바뀌었습니다.","센서는 5V 전원으로 작동하므로 12V, 24V가 나올 수 없습니다.","0~1V는 변화 폭이 너무 작고, 0V는 단선과 구분할 수 없습니다."],"d":"홀 센서 방식 스로틀은 5V 전원을 받아, 그립을 돌린 양에 비례하는 전압을 냅니다.\n보통 스로틀을 놓았을 때 약 0.8~1.0V, 끝까지 돌렸을 때 약 3.8~4.2V입니다. 0V나 5V에 가까운 값이 나오면 단선이나 단락으로 판단할 수 있도록 양 끝을 비워 둔 것입니다. 정확한 값은 제조사 자료를 따릅니다."}},{"q":"정격 48V 전원을 사용하는 60W 전장 회로에 설계 전류의 200%(2배) 안전율을 적용할 때 알맞은 블레이드 퓨즈 정격은?","o":["1.25 A","2.5 A","5.0 A","10 A"],"a":1,"e":{"w":["1.25A는 설계 전류 그대로이며 안전율을 적용하지 않은 값입니다.","5.0A는 설계 전류의 4배입니다.","10A는 설계 전류의 8배로, 과전류가 흘러도 끊어지지 않아 배선이 탈 수 있습니다."],"d":"전류 = 전력 ÷ 전압 = 60W ÷ 48V = 1.25A\n안전율 200%(2배) 적용 : 1.25 × 2 = 2.5A\n퓨즈는 회로의 정상 전류보다 조금 큰 용량을 써야 평소에는 끊어지지 않고, 과전류가 흐를 때 먼저 끊어져 배선을 보호합니다."}},{"q":"정격 전압 72V, 방전 용량 40Ah 스펙을 갖춘 전기오토바이 리튬 배터리 팩의 총 저장 전력량(에너지양)은?","o":["180 Wh","288 Wh","2,880 Wh (2.88 kWh)","28,800 Wh"],"a":2,"e":{"w":["180Wh는 전압과 용량을 곱한 값이 아닙니다.","288Wh는 자릿수가 하나 모자랍니다.","28,800Wh는 자릿수가 하나 많습니다."],"d":"전력량(Wh) = 전압(V) × 용량(Ah)\n72V × 40Ah = 2,880Wh\n1,000Wh = 1kWh이므로 2.88kWh입니다."}},{"q":"전기이륜차 메인 배터리 팩 탈거 및 유지보수 시 작업자의 감전 방지를 위해 최우선으로 실시해야 할 조치는?","o":["타이어 공기압 방출","고전압 차단 스위치(MSD) 체결 해제","브레이크 오일 드레인","냉각수 배출 밸브 개방"],"a":1,"e":{"w":["타이어 공기압은 감전 방지와 관계가 없습니다.","브레이크 오일 배출은 감전 방지와 관계가 없습니다.","냉각수 배출은 감전 방지와 관계가 없습니다."],"d":"고전압 배터리를 다루기 전에는 먼저 키를 끄고 고전압 차단 스위치(MSD, 서비스 플러그)를 분리해 고전압 회로를 끊습니다.\n분리한 뒤에도 제어기 안의 콘덴서에 전기가 남아 있을 수 있으므로 정해진 시간 동안 기다린 다음, 절연 장갑을 끼고 절연 공구로 작업합니다."}},{"q":"완속 충전 시 상용 교류(AC 220V)를 공급받아 배터리 충전용 직류(DC)로 변환해주는 탑재형 충전 장치는?","o":["OBC (On-Board Charger)","BMS","휠 스피드 센서","MCU"],"a":0,"e":{"w":["BMS는 배터리 셀의 전압과 온도를 관리합니다.","휠 스피드 센서는 바퀴의 회전 속도를 검출합니다.","MCU는 구동 모터를 제어하는 장치입니다."],"d":"OBC(On-Board Charger)는 차량에 탑재된 충전기입니다. 가정용 교류 220V를 받아 배터리를 충전할 수 있는 직류로 바꿉니다.\n완속 충전은 OBC를 거치고, 급속 충전은 충전기에서 직류를 바로 공급합니다."}},{"q":"영구자석 동기모터(PMSM) 또는 BLDC 구동모터에서 로터의 회전 위치 및 속도를 정밀 계측하는 센서는?","o":["수온 센서","홀 센서 (Hall Sensor)","산소 센서","노크 센서"],"a":1,"e":{"w":["수온 센서는 냉각수 온도를 검출합니다.","산소 센서는 배기가스 속 산소 농도를 검출합니다.","노크 센서는 엔진의 노킹 진동을 검출합니다."],"d":"BLDC 모터와 영구자석 동기모터는 회전자(로터)의 위치에 맞춰 고정자 코일에 전류를 흘려야 회전합니다.\n홀 센서는 회전자 자석의 자기장 변화를 전압 신호로 바꿔 회전자의 위치와 속도를 제어기에 알려 줍니다."}}]},{"g":"검사·안전관리","name":"관련 법규","id":"p12","qs":[{"q":"이륜자동차 번호판을 부착해야 하는 위치는 관련 법규에 명시되어 있다. 일반적으로 번호판은 이륜자동차의 어느 부분에 부착되어야 하는가?","o":["전면 부착","연료탱크 위","핸들바 앞부분","뒷부분 중앙(후면)"],"a":3,"e":{"w":["이륜자동차는 앞쪽에 번호판을 달지 않습니다.","연료탱크 위는 번호판 부착 위치가 아닙니다.","핸들바 앞부분은 번호판 부착 위치가 아닙니다."],"d":"이륜자동차의 번호판은 뒤에서 잘 보이도록 차체 뒷부분 중앙(후면)에 부착합니다."}},{"q":"이륜자동차의 번호판을 부착하지 않고 운행했을 때 발생할 수 있는 법적 결과는?","o":["과태료 부과 및 행정 처분","경고 조치만 한다.","운행을 계속해도 상관없다.","법적 제재를 받지 않는다."],"a":0,"e":{"w":["경고로 끝나지 않고 과태료가 부과됩니다.","번호판 없이 운행하면 안 됩니다.","법적 제재를 받습니다."],"d":"번호판은 차를 식별하는 표지입니다. 번호판을 달지 않고 운행하면 관련 법규에 따라 과태료가 부과되고 행정 처분을 받습니다."}},{"q":"이륜자동차 번호판이 가져야 할 가장 중요한 특성은?","o":["쉽게 떨어져야 한다.","명확하게 식별이 안 되어야 한다.","번호판은 구부러져 있어야 한다.","항상 깨끗하고 식별이 가능해야 한다."],"a":3,"e":{"w":["번호판은 쉽게 떨어지지 않게 단단히 고정해야 합니다.","번호판은 명확하게 식별되어야 합니다.","번호판은 구부러지지 않고 반듯해야 합니다."],"d":"번호판은 누구나 번호를 읽을 수 있어야 합니다. 그래서 항상 깨끗하고 식별할 수 있는 상태를 유지해야 합니다."}},{"q":"이륜자동차 번호판이 심하게 훼손되어 번호 식별이 어려울 때 운전자가 할 조치는?","o":["새로운 번호판을 임시로 만든다.","관계 기관에 재교부 신청을 한다.","운행을 중단한다.","번호판을 직접 수리한다."],"a":1,"e":{"w":["번호판을 임의로 만들어 달면 안 ["최고 회전속도를 재는 검사가 아닙니다.","체인의 회전속도를 재는 검사가 아닙니다.","변속기의 재질은 검사 대상이 아닙니다."],"d":"원동기와 동력전달장치 검사에서는 엔진과 동력전달장치가 정상으로 작동하는지, 누유나 이상이 없는지 확인합니다."}},{"q":"국제표준 차대번호(VIN) 17자리 표기 규정에서 오독 및 혼동 방지를 위해 영구 제외되는 3개의 알파벳은?","o":["A, B, C","I, O, Q","X, Y, Z","U, V, W"],"a":1,"e":{"w":["A, B, C는 VIN에 사용하는 문자입니다.","X, Y, Z는 VIN에 사용하는 문자입니다.","U, V, W는 VIN에 사용하는 문자입니다."],"d":"차대번호(VIN) 17자리에는 알파벳 I, O, Q를 쓰지 않습니다. 숫자 1, 0과 모양이 비슷해 잘못 읽을 수 있기 때문입니다."}},{"q":"배기량 260cc를 초과하는 대형 이륜자동차의 정기 안전·배출가스 검사 일반 유효기간 주기는?","o":["6개월","1년","2년 (신차 최초 검사는 3년)","5년"],"a":2,"e":{"w":["6개월은 정기검사 유효기간이 아닙니다.","1년은 정기검사 유효기간이 아닙니다.","5년은 정기검사 유효기간이 아닙니다."],"d":"이륜자동차 정기검사의 유효기간은 2년입니다. 다만 새로 사용신고한 이륜자동차는 최초 검사 유효기간이 3년입니다.\n검사 기간은 유효기간 만료일 전후 각각 31일 이내입니다."}},{"q":"이륜자동차를 튜닝(구조·장치 변경)할 때 사전에 한국교통안전공단의 승인을 받아야 하는 대상은?","o":["핸들 그립 고무 교체","번호판 클리닝 커버 장착","소음방지장치(소음기) 변경","타이어 공기 주입 밸브 캡 교체"],"a":2,"e":{"w":["핸들 그립 교체는 승인을 받아야 하는 구조·장치에 해당하지 않습니다.","번호판 커버는 튜닝 승인 대상 장치가 아닙니다.","타이어 밸브 캡 교체는 승인을 받아야 하는 구조·장치에 해당하지 않습니다."],"d":"「자동차관리법 시행규칙」 제107조에 따라, 이륜자동차를 튜닝할 때 한국교통안전공단의 승인을 받아야 하는 것은 다음과 같습니다.\n1) 길이·너비·높이 및 중량분포와 관련된 구조\n2) 원동기 및 동력전달장치, 조향장치, 제동장치, 차체, 승차장치 및 물품적재장치, 소음방지장치 및 등화장치\n소음기(머플러)는 소음방지장치이므로 승인 없이 바꾸면 불법 튜닝입니다. 승인을 받은 뒤에는 45일 이내에 튜닝검사를 받아야 합니다."}}]},{"g":"검사·안전관리","name":"배출가스 검사","id":"p13","qs":[{"q":"이륜자동차 정기 검사에서 배출가스 기준 위반 시, 어떤 법에 근거하여 처벌받을 수 있는가?","o":["자동차관리법","대기환경보전법","도로교통법","소음⋅진동관리법"],"a":1,"e":{"w":["자동차관리법은 등록, 안전기준 등을 정한 법입니다.","도로교통법은 운전과 통행 방법을 정한 법입니다.","소음·진동관리법은 소음 기준을 정한 법입니다."],"d":"배출가스 허용 기준과 그 검사는 대기환경보전법에서 정합니다. 기준을 위반하면 이 법에 따라 처벌받습니다."}},{"q":"이륜자동차 정기 검사에서 주로 측정하는 배출가스 항목은?","o":["질소산화물(NOx) 및 황산화물(SOx)","미세먼지(PM) 및 오존(O3)","일산화탄소(CO) 및 탄화수소(HC)","이산화탄소(CO2) 및 산소(O2)"],"a":2,"e":{"w":["질소산화물과 황산화물은 정기 검사에서 주로 측정하는 항목이 아닙니다.","미세먼지와 오존은 측정 항목이 아닙니다.","이산화탄소와 산소는 규제 대상 유해 가스가 아닙니다."],"d":"이륜자동차 정기 검사에서는 불완전 연소 때 나오는 일산화탄소(CO)와, 타지 않고 나오는 연료 성분인 탄화수소(HC)를 주로 측정합니다."}},{"q":"이륜자동차의 배출가스 검사 시 엔진 공회전 속도기준에 대한 설명으로 옳은 것은?","o":["배기량과 관계없이 1,500rpm으로 고정된다.","500cc 이하 이륜차는 2,000rpm 이하, 500cc 초과 이륜차는 1,500rpm 이하","모든 이륜차는 2,000rpm 이상을 유지해야 한다.","엔진 회전수는 배출가스 검사에 영향을 미치지 않는다."],"a":1,"e":{"w":["배기량과 관계없이 1,500rpm으로 고정하지 않습니다.","모든 이륜차가 2,000rpm 이상을 유지하는 것이 아닙니다.","엔진 회전수는 배출가스 농도에 영향을 줍니다."],"d":"배출가스는 공회전 상태에서 측정하며, 공회전 속도 기준은 배기량에 따라 다릅니다. 500cc 이하는 2,000rpm 이하, 500cc 초과는 1,500rpm 이하입니다."}},{"q":"배출가스 한계값을 초과하여 부적합 판정을 받은 이륜자동차가 취해야 할 조치는?","o":["부적합 판정과 관계없이 계속 주행한다.","배출가스 관련 부품을 수리 또는 교체 후 재검사 받아야 한다.","과태료만 납부하면 된다.","즉시 폐차해야 한다."],"a":1,"e":{"w":["부적합 상태로 계속 주행하면 안 됩니다.","과태료를 내는 것으로 끝나지 않습니다.","폐차할 필요는 없습니다."],"d":"부적합 판정을 받으면 배출가스 관련 부품을 수리하거나 교체해 기준에 맞춘 뒤 재검사를 받아야 합니다."}},{"q":"이륜자동차 배출가스 검사는 어떤 모드에서 측정되는가?","o":["저속 공회전 검사모드","정지 상태에서 시동을 끈 후","고속 주행 모드","풀 스로틀 가속 모드"],"a":0,"e":{"w":["시동을 끄면 배출가스가 나오지 않아 측정할 수 없습니다.","정기 검사는 고속 주행 상태에서 측정하지 않습니다.","풀 스로틀 가속 상태에서 측정하지 않습니다."],"d":"이륜자동차 배출가스 검사는 세워 둔 상태에서 엔진을 공회전시키는 저속 공회전 검사모드로 측정합니다."}},{"q":"2009년 1월 1일 이후 제작된 이륜자동차의 탄화수소(HC) 배출가스 한계값은?","o":["400ppm","1,000ppm","1,200ppm","1,500ppm"],"a":1,"e":{"w":["400ppm은 이 기준이 아닙니다.","1,200ppm은 이 기준이 아닙니다.","1,500ppm은 이 기준이 아닙니다."],"d":"2009년 1월 1일 이후 제작된 이륜자동차의 탄화수소(HC) 배출 허용 기준은 1,000ppm 이하입니다."}},{"q":"한국에서 이륜자동차 배기가스 규제를 관장하는 주요 법규는?","o":["도로교통법","소음⋅진동관리법","자동차관리법","대기환경보전법"],"a":3,"e":{"w":["도로교통법은 운전과 통행 방법을 정한 법입니다.","소음·진동관리법은 소음 기준을 정한 법입니다.","자동차관리법은 등록, 안전기준 등을 정한 법입니다."],"d":"배기가스(배출가스) 규제는 대기환경보전법에서 관장합니다."}},{"q":"이륜자동차 배기가스 검사 항목에 포함되는 주요 오염 물질은?","o":["산소(O2)","이산화탄소(CO2)","일산화탄소(CO), 탄화수소(HC), 질소산화물(NOx)","수증기(H2O)"],"a":2,"e":{"w":["산소는 오염 물질이 아닙니다.","이산화탄소는 이 검사에서 규제하는 유해 오염 물질이 아닙니다.","수증기는 오염 물질이 아닙니다."],"d":"배기가스의 주요 오염 물질은 일산화탄소(CO), 탄화수소(HC), 질소산화물(NOx)입니다."}},{"q":"한국의 이륜자동차 배출가스 허용 기준은 주로 어느 지역의 규제기준을 따르거나 유사하게 적용하고 있는가?","o":["유럽","중국","북미","일본"],"a":0,"e":{"w":["중국의 기준을 따르는 것이 아닙니다.","북미의 기준을 따르는 것이 아닙니다.","일본의 기준을 따르는 것이 아닙니다."],"d":"한국의 이륜자동차 배출가스 허용 기준은 주로 유럽의 규제 기준(유로 기준)을 따르거나 비슷하게 적용합니다."}},{"q":"이륜자동차 배기량에 따라 배출가스 허용기준이 다르게 적용되는 주된 이유는?","o":["배기량이 큰 이륜자동차가 일반적으로 더 많은 연료를 소모하고 더 많은 배출가스를 발생시킬 실제 광도가 합격 기준에 미달하는 차량 자체의 원인이 아닌 것은?","o":["배터리 전압 부족 또는 충전 시스템 불량","전조등 테스터기 불량","전조등 내부 반사경 손상 또는 오염","전조등 램프의 수명 저하 또는 불량"],"a":1,"e":{"w":["배터리 전압이 낮거나 충전 시스템이 불량하면 전조등이 어두워집니다. 차량 자체의 원인입니다.","반사경이 손상되거나 오염되면 빛이 제대로 모이지 않습니다. 차량 자체의 원인입니다.","램프의 수명이 다하면 어두워집니다. 차량 자체의 원인입니다."],"d":"전조등 테스터기는 검사 장비입니다. 테스터기가 불량한 것은 장비의 문제이지 차량 자체의 원인이 아닙니다."}},{"q":"전조등 광도가 기준에 미달하여 부적합 판정을 받았을 때 운전자가 취해야 할 조치는?","o":["즉시 폐차한다.","그냥 운행한다.","과태료만 납부한다.","전조등 또는 관련 전기 시스템을 점검 및 수리한 후 재검사를 받는다."],"a":3,"e":{"w":["폐차할 필요는 없습니다.","부적합 상태로 운행하면 안 됩니다.","과태료를 내는 것으로 끝나지 않습니다."],"d":"전조등 광도가 기준에 미달하면 전조등이나 관련 전기 시스템을 점검하고 수리한 뒤 재검사를 받아야 합니다."}},{"q":"정기검사에서 제동력 부적합 판정을 받았을 때 이륜자동차에 대한 조치로 옳은 것은?","o":["제동장치를 점검 및 수리하여 기준에 적합하게 만든 후 재검사를 받아야 한다.","그냥 운행한다.","과태료만 납부한다.","즉시 폐차한다."],"a":0,"e":{"w":["부적합 상태로 운행하면 안 됩니다.","과태료를 내는 것으로 끝나지 않습니다.","폐차할 필요는 없습니다."],"d":"제동력 부적합은 안전에 직결됩니다. 제동장치를 점검하고 수리해 기준에 맞춘 뒤 재검사를 받아야 합니다."}},{"q":"이륜자동차에는 연동 제동장치(CBS) 또는 바퀴 잠김 방지 제동장치(ABS)가 설치될 수 있다. 이 장치들의 목적은?","o":["제동 안정성을 높이고 운전자의 제동 부담을 줄이기 위해","제동거리를 길게 하기 위해","이륜자동차의 무게를 줄이기 위해","바퀴를 잠기게 하여 미끄럼을 줄이기 위해"],"a":0,"e":{"w":["제동거리를 길게 하려는 장치가 아닙니다.","무게를 줄이려는 장치가 아닙니다.","ABS는 바퀴가 잠기지 않게 하는 장치입니다."],"d":"CBS는 한쪽 브레이크만 조작해도 앞뒤 브레이크가 함께 작동하게 하고, ABS는 바퀴 잠김을 막습니다. 둘 다 제동 안정성을 높이고 운전자의 제동 부담을 줄이기 위한 장치입니다."}},{"q":"이륜자동차 제동능력 시험의 제동 초속도는 일반적으로 얼마인가? (단, 해당 이륜자동차 최고속도의 90%와 비교해 더 낮은 속도를 적용한다.)","o":["60km/h","50km/h","40km/h","20km/h"],"a":0,"e":{"w":["50km/h가 아닙니다.","40km/h가 아닙니다.","20km/h가 아닙니다."],"d":"제동능력 시험의 제동 초속도는 일반적으로 60km/h입니다. 다만 그 이륜자동차 최고속도의 90%가 60km/h보다 낮으면 더 낮은 속도를 적용합니다."}},{"q":"이륜자동차 보조제동장치의 평균최대감속도 기준은 마른 노면에서 최소 얼마 이상이어야 하는가?","o":["1.50m/s² 이상","2.00m/s² 이상","2.50m/s² 이상","3.00m/s² 이상"],"a":2,"e":{"w":["1.50m/s²는 기준값이 아닙니다.","2.00m/s²는 기준값이 아닙니다.","3.00m/s²는 기준값이 아닙니다."],"d":"「자동차 및 자동차부품의 성능과 기준에 관한 규칙」 제67조와 별표 5의13(이륜자동차의 제동능력 기준)에 따라, 마른 노면에서 보조제동장치의 평균최대감속도는 2.50m/s² 이상이어야 합니다. 같은 별표에서 이륜형 이륜자동차는 앞바퀴만 제동할 때 4.40m/s² 이상, 뒷바퀴만 제동할 때 2.90m/s² 이상입니다."}},{"q":"이륜자동차 정기검사 시 제동력을 측정하는 목적은?","o":["이륜자동차의 최고 제동거리를 확인하기 위해","타이어의 마모 상태를 측정하기 위해","안전한 주행과 비상 상황 시 적절한 제동성능을 확보하기 위해","비상 상황 시 제동거리를 늘리기 위해"],"a":2,"e":{"w":["제동거리가 긴지를 확인하려는 것이 아닙니다.","타이어 마모를 재는 검사가 아닙니다.","제동거리를 늘리려는 것이 아닙니다."],"d":"제동력 측정은 평소의 안전한 주행과 비상 상황에서 필요한 제동 성능이 확보되어 있는지 확인하기 위한 것입니다."}},{"q":"이륜차 검사 기준상 배기소음과 경음기 소음의 음압 측정 시 사용하는 주파수 청감보정 필터 규격은?","o":["배기소음: A 특성, 경음기: C 특성","배기소음: C 특성, 경음기: A 특성","배기소음 및 경음기 모두 A 특성","배기소음 및 경음기 모두 C 특성"],"a":0,"e":{"w":["배기소음과 경음기의 보정 특성이 서로 바뀌었습니다.","경음기 소음은 C 특성으로 측정합니다.","배기소음은 A 특성으로 측정합니다."],"d":"운행차 소음 허용기준은 배기소음을 dB(A), 경적소음을 dB(C)로 정하고 있습니다(소음·진동관리법 시행규칙).\nA 특성은 사람 귀가 느끼는 크기에 가깝게 보정한 값이고, C 특성은 큰 소리를 거의 그대로 재는 보정입니다."}},{"q":"국내 환경 법규상 2006년 이후 제작·출고된 이륜자동차의 허용 소음 기준치는?","o":["배기 110dB(A), 경음기 105dB(C)","배기 105dB(A) 이하, 경음기 110dB(C) 이하","배기 100dB(A), 경음기 100dB(C)","배기 95dB(A), 경음기 120dB(C)"],"a":1,"e":{"w":["배기소음과 경음기의 기준이 서로 바뀌었습니다.","배기소음 100dB(A), 경음기 100dB(C)는 기준값이 아닙니다.","배기소음 95dB(A), 경음기 120dB(C)는 기준값이 아닙니다."],"d":"소음·진동관리법 시행규칙의 운행차 소음허용기준에서, 2006년 1월 1일 이후 제작된 이륜자동차는 배기소음 105dB(A) 이하, 경적소음 110dB(C) 이하입니다.\n배기소음은 A 특성, 경적소음은 C 특성으로 측정합니다."}}]},{"g":"검사·안전관리","name":"안전관리","id":"p15","qs":[{"q":"이륜자동차 정비 중 화재 위험 및 폭발의 위험성이 있는 상황은?","o":["소화기를 비치해 둔 곳에서 작업을 한다.","인화성 세척제 사용 시 불꽃이나 열원이 있는 곳에서 작업을 한다.","통풍이 잘되는 곳에서 작업을 한다.","소화전이 설치된 곳에서 작업을 한다."],"a":1,"e":{"w":["소화기를 비치한 곳에서 작업하는 것은 안전한 상황입니다.","통풍이 잘되는 곳에서 작업하는 것은 안전한 상황입니다.","소화전이 설치된 곳에서 작업하는 것은 안전한 상황입니다."],"d":"인화성 세척제는 증기가 쉽게 불이 붙습니다. 불꽃이나 열원이 있는 곳에서 쓰면 화재와 폭발의 위험이 있습니다."}},{"q":"이륜자동차 정비 작업 시 개인 보호장치 착용에 대한 설명으로 틀린 것은?","o":["안전장갑을 착용해 손을 보호한다.","귀마개를 착용해 청력을 보호한다.","보안경, 고글을 착용해 눈을 보호한다.","맨손으로 작업하는 것이 효율적이다."],"a":3,"e":{"w":["안전장갑으로 손을 보호합니다. 옳은 설명입니다.","귀마개로 청력을 보호합니다. 옳은 설명입니다.","보안경이나 고글로 눈을 보호합니다. 옳은 설명입니다."],"d":"정비 작업에서는 베임, 화상, 약품 접촉의 위험이 있으므로 보호장갑을 착용해야 합니다. 맨손 작업이 효율적이라는 설명이 틀렸습니다."}},{"q":"뜨거운 엔진이나 머플러에 의한 화상 방지를 위해 사용해야 하는 보호 장비는?","o":["절연장갑","목장갑","내열장갑","비닐장갑"],"a":2,"e":{"w":["절연장갑은 감전을 막는 장갑입니다.","목장갑은 열을 막지 못합니다.","비닐장갑은 열에 녹습니다."],"d":"뜨거운 엔진이나 머플러를 다룰 때는 열을 견디는 내열장갑을 착용해 화상을 막습니다."}},{"q":"이륜자동차 작업장 정리정돈의 중요성으로 가장 거리가 먼 것은?","o":["작업 효율성 향상","안전사고 예방","생산성 향상","자재 및 물품을 찾는 시간 낭비 증가"],"a":3,"e":{"w":["정리정돈을 하면 작업 효율이 높아집니다.","정리정돈을 하면 안전사고를 예방합니다.","정리정돈을 하면 생산성이 높아집니다."],"d":"정리정돈을 하면 자재와 물품을 찾는 시간이 줄어듭니다. 시간 낭비가 늘어난다는 것은 정리정돈의 중요성과 반대되는 내용입니다."}},{"q":"이륜자동차 정비 작업 시 발생할 수 있는 분진으로부터 호흡기를 보호하기 위한 장비는?","o":["절연장갑","안전화","방진 마스크","귀마개"],"a":2,"e":{"w":["절연장갑은 감전을 막는 장비입니다.","안전화는 발을 보호하는 장비입니다.","귀마개는 청력을 보호하는 장비입니다."],"d":"분진은 숨을 쉴 때 호흡기로 들어옵니다. 방진 마스크를 써서 분진을 걸러 호흡기를 보호합니다."}},{"q":"이륜자동차 작업 시 발생하는 폐유나 폐기물 관리에 대한 설명으로 올바른 것은?","o":["지정된 폐기물 용기에 분리하여 처리한다.","일반 쓰레기 봉지에 함께 버린다.","땅에 묻는다.","하수구에 흘려보내도 된다."],"a":0,"e":{"w":["일반 쓰레기와 함께 버리면 안 됩니다.","땅에 묻으면 토양이 오염됩니다.","하수구에 버리면 수질이 오염됩니다."],"d":"폐유와 폐기물은 환경을 오염시키는 지정폐기물입니다. 지정된 폐기물 용기에 종류별로 분리해 보관하고 적법하게 처리합니다."}},{"q":"이륜자동차 전기 시스템 점검 시 감전 사고를 방지하기 위해 가장 먼저 해야 할 일은?","o":["전선 피복을 벗긴다.","배터리 단자를 분리한다.","엔진 시동을 걸어둔다.","전선을 절단한다."],"a":1,"e":{"w":["전선 피복을 벗기면 감전 위험이 커집니다.","시동을 걸어 두면 전기가 흐르는 상태입니다.","전선을 자르면 안 됩니다."],"d":"전기 시스템을 점검하기 전에 배터리 단자를 분리해 전원을 끊으면 감전과 합선을 막을 수 있습니다."}},{"q":"이륜자동차 동력전달장치 정비작업 시 안전관리에 대한 설명으로 올바른 것은?","o":["체인이 회전 중인 상태에서 체인 장력을 조정한다.","바퀴를 구동시키며 동력 전달부에 손을 넣어 이상 부위를 점검한다.","엔진을 끄고 모든 동력 전달부의 회전이 멈춘 다음에 작업한다.","체인의 회전 속도를 높여가며 이상 부위를 점검한다."],"a":2,"e":{"w":["회전 중인 체인에 손이 끼일 수 있습니다.","바퀴가 도는 중에 손을 넣으면 끼임 사고가 납니다.","회전 속도를 높이면 더 위험합니다."],"d":"체인이나 스프로킷 같은 동력 전달부는 회전 중에 손이나 옷이 끼이면 크게 다칩니다. 엔진을 끄고 모든 회전이 멈춘 다음에 작업합니다."}},{"q":"이륜자동차 리프트 또는 자키를 사용하여 차체를 들어 올릴 때 안전수칙으로 올바르지 않은 것은?","o":["자키를 이용하여 들어 올린 후에는 다른 지지대를 사용하지 않아도 된다.","사용하려는 자키 또는 리프트의 최대 허용 하중을 초과해서는 안 된다.","이륜자동차를 리프트로 들어 올린 후에는 아래에서 작업하지 않는다.","제조사에서 지정한 정확한 잭 포인트에 자키를 받친다."],"a":0,"e":{"w":["리프트나 자키의 최대 허용 하중을 넘기면 안 됩니다. 옳은 수칙입니다.","들어 올린 차 아래에서 작업하지 않습니다. 옳은 수칙입니다.","제조사가 지정한 잭 포인트에 정확히 받칩니다. 옳은 수칙입니다."],"d":"자키만으로는 차체가 넘어지거나 내려앉을 수 있습니다. 들어 올린 뒤에는 반드시 안전 스탠드 같은 다른 지지대로 받쳐야 하므로 ①이 올바르지 않습니다."}},{"q":"이륜자동차 연료계통 작업 시 주의사항으로 올바르지 않은 것은?","o":["작업 장소 주변에서는 담배나 화기, 스파크를 유발하는 물건의 사용을 금지한다.","연료 증기가 정체되도록 환기가 안 되는 밀폐된 공간에서 점검한다.","연료 시스템 근처에서 전기 관련 작업을 할 때는 신중해야 한다.","작업 전후와 작업 중에 연료 누출 여부를 확인한다."],"a":1,"e":{"w":["작업장 주변에서 담배, 화기, 스파크를 금지합니다. 옳은 주의사항입니다.","연료 시스템 근처의 전기 작업은 신중해야 합니다. 옳은 주의사항입니다.","작업 전후와 작업 중에 연료 누출을 확인합니다. 옳은 주의사항입니다."],"d":"연료 증기는 불이 붙기 쉽고 들이마시면 해롭습니다. 증기가 고이지 않도록 환기가 잘 되는 곳에서 작업해야 하므로, 밀폐된 공간에서 점검한다는 ②가 올바르지 않습니다."}},{"q":"정비 작업장의 정리정돈 및 청결 유지에 대한 설명 중 올바르지 않은 것은?","o":["바닥의 오일은 미끄러짐 사고를 막기 위해 즉시 제거한다.","공구, 계측기, 자재는 정해진 위치와 용기에 보관한다.","전선이나 에어 호스는 작업 통로를 가로질러 놓는다.","작업 통로 폭은 최소 80cm 이상으로 유지하고 장애물을 없앤다."],"a":2,"e":{"w":["바닥의 오일은 미끄러짐을 막기 위해 즉시 닦아 냅니다. 옳은 설명입니다.","공구, 계측기, 자재는 정해진 자리에 보관합니다. 옳은 설명입니다.","작업 통로는 폭을 확보하고 장애물을 없앱니다. 옳은 설명입니다."],"d":"전선이나 에어 호스가 통로를 가로지르면 걸려 넘어집니다. 통로를 가로질러 놓으면 안 되므로 ③이 올바르지 않습니다."}},{"q":"이륜자동차 정비 중 화학 약품 사용 시 안전 수칙으로 올바르지 않은 것은?","o":["적절한 보호구를 착용하여 피부 접촉이나 흡입을 방지한다.","작업 공간을 환기하고 필요하면 배기 후드를 사용한다.","화학 약품을 맛보거나 직접 냄새를 맡아본다.","물질안전보건자료(MSDS)를 숙지한다."],"a":2,"e":{"w":["보호구를 착용해 피부 접촉과 흡입을 막습니다. 옳은 수칙입니다.","작업 공간을 환기하고 필요하면 배기 후드를 씁니다. 옳은 수칙입니다.","물질안전보건자료(MSDS)를 숙지합니다. 옳은 수칙입니다."],"d":"화학 약품은 맛을 보거나 직접 냄새를 맡으면 중독될 수 있습니다. 절대 해서는 안 되는 행동이므로 ③이 올바르지 않습니다."}},{"q":"이륜자동차 엔진을 시동하여 점검할 때의 안전 수칙으로 올바른 것은?","o":["시동을 켜둔 상태에서 벨트 장력을 점검한다.","액세서리를 모두 착용하고 점검한다.","환기가 안 되는 곳에서 시동을 걸어놓고 작업한다.","연료장치나 배터리 근처에서 불꽃이나 스파크가 발생하지 않도록 주의한다."],"a":3,"e":{"w":["시동이 켜진 상태에서 벨트를 만지면 끼임 사고가 납니다.","목걸이나 팔찌 같은 액세서리는 회전부에 걸리므로 빼고 작업합니다.","환기가 안 되는 곳에서 시동을 걸면 배기가스에 중독됩니다."],"d":"연료와 배터리 주변에는 불이 붙기 쉬운 가스가 있을 수 있습니다. 불꽃이나 스파크가 생기지 않도록 주의해야 합니다."}},{"q":"정비 작업 중 발생하는 분진, 쇳가루 등으로부터 호흡기를 보호하기 위한 장비는?","o":["보안경","안전화","방진 마스크","보호복"],"a":2,"e":{"w":["보안경은 눈을 보호합니다.","안전화는 발을 보호합니다.","보호복은 몸을 보호합니다."],"d":"분진과 쇳가루는 숨을 쉴 때 호흡기로 들어옵니다. 방진 마스크를 써서 호흡기를 보호합니다."}},{"q":"이륜자동차 정비 시 발생할 수 있는 화상 사고를 예방하기 위한 조치로 틀린 것은?","o":["작업 전 엔진과 배기 시스템이 식을 때까지 기다린다.","흘러내린 오일이나 기타 액체는 그대로 둔다.","팔다리 노출을 줄이는 긴 소매 작업복을 입는다.","뜨거운 부품을 취급할 때 내열 장갑을 착용한다."],"a":1,"e":{"w":["엔진과 배기 시스템이 식은 뒤에 작업합니다. 옳은 조치입니다.","긴 소매 작업복으로 피부 노출을 줄입니다. 옳은 조치입니다.","뜨거운 부품은 내열 장갑을 끼고 다룹니다. 옳은 조치입니다."],"d":"흘러내린 오일이나 액체를 그대로 두면 뜨거운 부품에 닿아 불이 붙거나 미끄러짐 사고가 납니다. 즉시 닦아 내야 하므로 ②가 틀린 조치입니다."}},{"q":"이륜자동차 배터리 작업 시 주의사항으로 올바르지 않은 것은?","o":["배터리 단자를 분리하기 전에 시동을 끈다.","배터리 작업 시 스파크가 발생하지 않도록 주의한다.","배터리 단자를 분리할 때 (+)단자를 먼저 분리한 후 (-)단자를 분리한다.","배터리액이 피부에 묻으면 즉시 씻어낸다."],"a":2,"e":{"w":["단자를 분리하기 전에 시동을 끕니다. 옳은 주의사항입니다.","스파크가 생기지 않도록 주의합니다. 옳은 주의사항입니다.","배터리액이 피부에 묻으면 즉시 물로 씻어 냅니다. 옳은 주의사항입니다."],"d":"배터리 단자를 분리할 때는 (-)단자를 먼저 분리합니다. (+)단자를 먼저 풀다가 공구가 차체에 닿으면 합선이 일어나기 때문입니다. 연결할 때는 반대로 (+)단자를 먼저 연결합니다."}},{"q":"이륜자동차 작업장에서 전기 용접 시 안전 수칙 중 올바르지 않은 것은?","o":["작업장 주변에 소화기를 비치한다.","용접 구역 주변의 인화성 물질을 제거한다.","보호안경 대신 일반 안경을 착용한다.","감전 예방과 전자부품 보호를 위해 배터리 케이블을 분리한다."],"a":2,"e":{"w":["용접 작업장에는 소화기를 비치합니다. 옳은 수칙입니다.","용접 구역 주변의 인화성 물질을 치웁니다. 옳은 수칙입니다.","감전을 막고 전자부품을 보호하려고 배터리 케이블을 분리합니다. 옳은 수칙입니다."],"d":"용접의 강한 빛과 불꽃은 일반 안경으로 막을 수 없습니다. 용접용 보안면이나 차광 보호안경을 써야 하므로 ③이 올바르지 않습니다."}},{"q":"이륜자동차 엔진을 정비하기 전 안전 조치 중 올바르지 않은 것은?","o":["화학 물질을 취급할 때 작업 공간을 충분히 환기한다.","엔진이 뜨거운 상태에서 작업한다.","안전 고글과 장갑 등 보호구를 착용한다.","메인 스탠드나 리프트로 차량을 안정적으로 고정한다."],"a":1,"e":{"w":["화학 물질을 다룰 때 충분히 환기합니다. 옳은 조치입니다.","안전 고글과 장갑 등 보호구를 착용합니다. 옳은 조치입니다.","스탠드나 리프트로 차를 안정적으로 고정합니다. 옳은 조치입니다."],"d":"엔진이 뜨거운 상태에서 작업하면 화상을 입습니다. 엔진이 충분히 식은 뒤에 작업해야 하므로 ②가 올바르지 않습니다."}},{"q":"이륜자동차 타이어 공기압을 측정하거나 조절할 때 올바른 행동은?","o":["공기압이 부족하면 적정 수치까지 주입하고 과도하면 밸브 핀으로 공기를 뺀다.","신뢰할 수 있는 공기압 측정기를 사용하여 정확하게 측정한다.","공기압 조절 후 밸브 캡을 버린다.","운행 직후 타이어가 뜨거울 때 공기를 뺀다."],"a":1,"e":{"w":["밸브 핀을 눌러 어림으로 빼면 정확한 공기압을 맞출 수 없습니다.","밸브 캡은 먼지와 물이 들어가는 것을 막으므로 다시 끼워야 합니다.","타이어가 뜨거울 때는 압력이 높게 나오므로 이때 공기를 빼면 식은 뒤 공기압이 부족해집니다."],"d":"공기압은 눈이나 손의 감각으로 알 수 없습니다. 믿을 수 있는 공기압 측정기로 정확히 재서 규정값에 맞춥니다."}},{"q":"이륜자동차 정비 작업 후 발생한 폐기물 중 오염된 오일필터는 어떻게 처리해야 하는가?","o":["일반 종량제 봉투에 버린다.","하수구나 토양에 무단 투기한다.","폐기물 수거 및 처리 전문 업체에 위탁 처리한다.","작업장 한쪽에 쌓아둔다."],"a":2,"e":{"w":["종량제 봉투에 버리면 안 됩니다.","무단 투기는 불법이며 환경을 오염시킵니다.","작업장에 쌓아 두면 오염과 화재의 위험이 있습니다."],"d":"오일이 묻은 오일필터는 지정폐기물입니다. 폐기물 수거·처리 전문 업체에 맡겨 처리합니다."}},{"q":"이륜자동차 정비 작업 후 발생한 폐기물 중 폐배터리는 어떻게 처리해야 하는가?","o":["고물상에 판다.","일반 쓰레기나 플라스틱 분리수거함에 버린다.","토양이나 수로에 매립 및 투기한다.","전문 폐기물 처리업체를 통해 적법하게 처리한다."],"a":3,"e":{"w":["폐배터리는 적법한 처리 경로로 보내야 합니다.","일반 쓰레기나 분리수거함에 버리면 안 됩니다.","묻거나 버리면 납과 산으로 환경이 오염됩니다."],"d":"폐배터리에는 납과 황산 같은 유해 물질이 들어 있습니다. 전문 폐기물 처리업체를 통해 적법하게 처리합니다."}},{"q":"이륜자동차 체인 청소 및 윤활 작업 시 안전한 방법이 아닌 것은?","o":["작업 부위 아래에 헌 수건이나 걸레를 깔아둔다.","엔진 시동을 걸고 체인을 회전시키면서 윤활한다.","윤활제가 스며들도록 기다린 후 과도한 윤활제를 닦아낸다.","이륜자동차 체인 전용 윤활제를 사용한다."],"a":1,"e":{"w":["헌 수건이나 걸레를 깔아 바닥 오염을 막습니다. 안전한 방법입니다.","윤활제가 스며들기를 기다린 뒤 남는 것을 닦아 냅니다. 안전한 방법입니다.","체인 전용 윤활제를 씁니다. 안전한 방법입니다."],"d":"시동을 걸고 체인을 돌리면서 작업하면 손이나 걸레가 체인과 스프로킷 사이에 끼여 크게 다칩니다. 시동을 끄고 손으로 바퀴를 돌려 가며 작업해야 합니다."}},{"q":"이륜자동차의 브레이크 시스템 정비 시 안전수칙으로 올바른 것은?","o":["패드 교체 시 브레이크액을 점검할 필요는 없다.","브레이크액이 페인트에 묻어도 상관없다.","브레이크액은 뚜껑을 열어 보관한다.","브레이크액은 흡습성이 있으므로 밀폐된 용기에 보관한다."],"a":3,"e":{"w":["패드를 교체할 때 브레이크액의 양도 함께 점검합니다.","브레이크액은 도장면을 상하게 하므로 묻으면 바로 닦아 냅니다.","뚜껑을 열어 두면 공기 중의 수분을 흡수합니다."],"d":"브레이크액은 공기 중의 수분을 잘 흡수(흡습성)합니다. 수분이 섞이면 끓는점이 낮아져 제동 성능이 떨어지므로 밀폐된 용기에 보관합니다."}},{"q":"정비소 내 고압가스 봄베(충전 용기)를 안전하게 적재·보관하기 위한 최대 허용 한계 온도는?","o":["25℃ 이하","40℃ 이하","60℃ 이하","100℃ 이하"],"a":1,"e":{"w":["25℃ 이하는 법에서 정한 한계 온도가 아닙니다.","60℃는 기준을 넘는 온도로, 용기 안의 압력이 크게 올라 위험합니다.","100℃는 기준을 크게 넘는 온도로, 용기가 파열될 수 있습니다."],"d":"고압가스 충전 용기는 온도가 오르면 안의 압력도 함께 올라갑니다. 그래서 용기는 항상 40℃ 이하로 유지해야 합니다(고압가스 안전관리법령의 용기 보관 기준).\n직사광선과 화기를 피하고, 통풍이 잘되는 곳에 넘어지지 않게 세워서 보관합니다."}}]},{"g":"종합 예상문제","name":"종합 예상문제 (1~5차 통합)","id":"p16","qs":[{"q":"엔진의 피스톤이 상사점에서 하사점까지 이동하는 거리를 무엇이라 하는가?","o":["보어","행정","압축비","배기량"],"a":1,"e":{"w":["보어는 실린더의 안지름입니다.","압축비는 실린더 전체 체적과 연소실 체적의 비입니다.","배기량은 피스톤이 한 행정 동안 밀어내는 체적입니다."],"d":"피스톤이 상사점에서 하사점까지 움직이는 거리를 행정(Stroke)이라고 합니다. 행정과 보어로 배기량이 정해집니다."}},{"q":"다음 중 열기관에 대한 설명으로 옳은 것은?","o":["열기관은 모두 회전 운동을 한다.","열기관의 작동 사이클은 모두 하나의 사이클이다.","열기관은 열에너지를 기계적 일로 바꾸는 장치이다.","열기관은 디젤기관과 가솔린기관으로 분류된다."],"a":2,"e":{"w":["열기관이 모두 회전 운동을 하는 것은 아닙니다. 왕복 운동을 하는 기관도 있습니다.","작동 사이클은 2행정, 4행정 등 여러 가지입니다.","열기관에는 가솔린, 디젤 외에도 여러 종류가 있습니다."],"d":"열기관은 연료가 탈 때 나오는 열에너지를 기계적인 일(운동)로 바꾸는 장치입니다."}},{"q":"피스톤 링 엔드 갭이 너무 작을 때 발생할 수 있는 가장 심각한 문제는?","o":["엔진 오일 소모량 증가","엔진 출력 증가","엔진 작동 시 실린더 벽 손상","냉각수 누수 발생"],"a":2,"e":{"w":["오일 소모가 느는 것은 엔드 갭이 너무 클 때입니다.","출력이 늘어나지 않습니다.","냉각수 누수와는 관계가 없습니다."],"d":"링은 열을 받으면 늘어납니다. 엔드 갭이 너무 작으면 늘어난 링의 양 끝이 맞닿아 바깥으로 벌어지면서 실린더 벽을 긁어 손상시킵니다. 심하면 링이 부러집니다."}},{"q":"피스톤 링 중 압축 링의 주된 역할은?","o":["엔진 오일을 실린더 벽에 도포한다.","연소실의 기밀을 유지한다.","피스톤의 온도를 낮춘다.","배기가스를 배출한다."],"a":1,"e":{"w":["오일을 조절하는 것은 오일 링입니다.","온도를 낮추는 것이 주된 역할은 아닙니다.","배기가스 배출과는 관계가 없습니다."],"d":"압축 링은 실린더 벽에 밀착해 압축가스와 연소가스가 새지 않도록 연소실의 기밀을 유지합니다."}},{"q":"엔진에서 밸브스프링의 역할은?","o":["밸브의 온도를 조절한다.","밸브의 무게를 줄인다.","밸브와 시트 사이의 기밀을 유지한다.","밸브의 상하 운동을 안내한다."],"a":2,"e":{"w":["밸브의 온도를 조절하지 않습니다.","밸브의 무게와는 관계가 없습니다.","밸브의 상하 운동을 안내하는 것은 밸브 가이드입니다."],"d":"밸브스프링은 캠이 밸브를 누르지 않을 때 밸브를 시트에 눌러 붙여 닫아 줍니다. 밸브와 시트 사이의 기밀을 유지하는 역할입니다."}},{"q":"4행정 엔진에서 흡기밸브가 열리는 시점과 배기밸브가 닫히는 시점을 조절하여 엔진의 성능을 최적화하는 것은?","o":["가변 흡기 시스템(VIS)","가변 밸브 타이밍(VVT)","가변 배기 시스템(VES)","전자제어 연료분사(EFI)"],"a":1,"e":{"w":["가변 흡기 시스템(VIS)은 흡기 통로의 길이를 바꾸는 장치입니다.","가변 배기 시스템은 배기 통로를 조절하는 장치입니다.","전자제어 연료분사는 연료량을 조절하는 장치입니다."],"d":"가변 밸브 타이밍(VVT)은 엔진 회전수와 부하에 맞춰 밸브가 열리고 닫히는 시점을 바꿔 엔진 성능을 최적화하는 장치입니다."}},{"q":"다음 중 엔진의 가변 흡기장치(Variable Inertia System)에 대한 설명으로 옳은 것은?","o":["일정 회전 이상에서만 작용한다.","관성이나 압력변화를 이용하여 흡기의 충전효율을 높이는 장치이다.","개⋅폐회로는 기어의 변속기에 맞추어 작동된다.","엔진이 일정 회전수 이상이 되면 흡기포트가 사실상 길어지는 효과가 있다."],"a":1,"e":{"w":["일정 회전 이상에서만 작용하는 것이 아니라 회전 영역에 따라 통로를 바꿉니다.","변속기와 맞추어 작동하는 것이 아닙니다.","고회전에서는 흡기 통로가 짧아지는 효과를 줍니다."],"d":"가변 흡기장치는 엔진 회전수에 따라 흡기 통로의 길이나 단면적을 바꿉니다. 흡입 공기의 관성과 압력 변화를 이용해 충전효율을 높이는 장치입니다."}},{"q":"흡기 및 배기밸브의 작동 시기가 맞지 않을 때 발생할 수 있는 현상은?","o":["냉각수 온도가 급격히 상승한다.","시동이 잘 걸리지 않거나 쇠 소음이 발생한다.","브레이크 제동력이 약해진다.","오일 압력 경고등이 점등된다."],"a":1,"e":{"w":["냉각수 온도와는 직접 관계가 없습니다.","제동력과는 관계가 없습니다.","오일 압력과는 관계가 없습니다."],"d":"밸브가 열리고 닫히는 시기가 피스톤의 움직임과 맞지 않으면 혼합기를 제대로 빨아들이고 압축하지 못합니다. 시동이 잘 걸리지 않고, 밸브와 피스톤이 부딪치면 쇠 소리가 납니다."}},{"q":"기화기(카뷰레터) 방식 엔진에서 연료와 공기의 혼합비를 조절하는 주요 구성 요소는 무엇인가?","o":["오일펌프","점화플러그","메인 제트","배기밸브"],"a":2,"e":{"w":["오일펌프는 윤활유를 보내는 부품입니다.","점화플러그는 불꽃을 튀기는 부품입니다.","배기밸브는 배기가스를 내보내는 밸브입니다."],"d":"기화기에서 메인 제트는 지름이 정해진 작은 구멍입니다. 이 구멍을 지나는 연료의 양이 정해지므로 연료와 공기의 혼합비를 조절하는 핵심 부품입니다."}},{"q":"오토바이 시동이 걸리지 않을 때, 점화 시스템이 정상적으로 작동한다면 다음 중 가장 먼저 점검해야 할 연료 계통 부품은 무엇인가?","o":["연료탱크 내 연료량","엔진 오일량","냉각수량","타이어 공기압"],"a":0,"e":{"w":["엔진 오일은 연료 계통이 아닙니다.","냉각수는 연료 계통이 아닙니다.","타이어 공기압은 시동과 관계가 없습니다."],"d":"점화가 정상인데 시동이 걸리지 않으면 연료가 공급되지 않는 것입니다. 가장 먼저 연료탱크에 연료가 있는지부터 확인합니다."}},{"q":"기화기에서 연료의 유면을 일정하게 유지시켜 주는 부품은?","o":["메인 제트(Main Jet)","플로트(Float)","파일럿 제트(Pilot Jet)","스로틀밸브(Throttle Valve)"],"a":1,"e":{"w":["메인 제트는 연료량을 계량하는 구멍입니다.","파일럿 제트는 저속에서 연료량을 계량합니다.","스로틀밸브는 공기량을 조절합니다."],"d":"플로트(뜨개)는 플로트실의 연료 위에 떠 있다가, 연료가 차오르면 밸브를 닫고 줄어들면 열어 유면을 일정하게 유지합니다."}},{"q":"냉각수(부동액)의 주요 역할 중 틀린 것은?","o":["겨울철 냉각수의 동결 방지","엔진의 열을 흡수하여 라디에이터로 전달","냉각 시스템 내부의 부식 방지","연료의 발화점 상승"],"a":3,"e":{"w":["부동액은 겨울철 냉각수가 어는 것을 막습니다. 옳은 설명입니다.","냉각수는 엔진의 열을 흡수해 라디에이터로 보냅니다. 옳은 설명입니다.","부동액에는 부식을 막는 성분이 들어 있습니다. 옳은 설명입니다."],"d":"냉각수는 엔진을 식히고, 얼지 않게 하고, 부식을 막습니다. 연료의 발화점과는 아무 관계가 없습니다."}},{"q":"부동액의 농도는 무엇으로 측정하는가?","o":["마이크로미터","온도계","비중계","압력 게이지"],"a":2,"e":{"w":["마이크로미터는 치수를 재는 도구입니다.","온도계는 온도를 재는 도구입니다.","압력 게이지는 압력을 재는 도구입니다."],"d":"부동액의 농도가 높을수록 냉각수의 비중이 커집니다. 그래서 비중계로 비중을 재어 농도를 알아냅니다."}},{"q":"엔진 정비 시, 스로틀 바디의 청소가 필요한 주된 이유는?","o":["공기량을 안정적으로 제어하기 위해","스로틀 바디의 무게를 줄이기 위해","스로틀 바디의 색상을 좋게 하기 위해","스로틀 바디의 제작년도를 알기 위해"],"a":0,"e":{"w":["무게와는 관계가 없습니다.","색상과는 관계가 없습니다.","제작년도와는 관계가 없습니다."],"d":"스로틀 바디에 카본과 오염물이 쌓이면 공기 통로가 좁아져 공회전이 불안정해집니다. 청소하면 공기량을 안정적으로 제어할 수 있습니다."}},{"q":"이륜자동차 전자제어 엔진에서 전자 스로틀밸브의 역할은?","o":["브레이크 제동력을 조절한다.","서스펜션의 강도를 조절한다.","계기판의 밝기를 조절한다.","스로틀밸브의 열림 정도를 정밀하게 제어하도록 한다."],"a":3,"e":{"w":["제동력을 조절하는 장치가 아닙니다.","서스펜션과는 관계가 없습니다.","계기판과는 관계가 없습니다."],"d":"전자 스로틀밸브는 케이블 대신 모터로 스로틀밸브를 엽니다. ECU가 운전 조건에 맞춰 열림 정도를 정밀하게 제어합니다."}},{"q":"전동기의 회전방향을 알고자 할 때 쓰이는 법칙은?","o":["플레밍의 왼손 법칙","앙페르의 법칙","렌츠의 법칙","플레밍의 오른손 법칙"],"a":0,"e":{"w":["앙페르의 법칙은 전류가 만드는 자기장의 방향에 관한 법칙입니다.","렌츠의 법칙은 유도 전류의 방향에 관한 법칙입니다.","플레밍의 오른손 법칙은 발전기의 유도 전류 방향을 알 때 씁니다."],"d":"플레밍의 왼손 법칙은 자기장 안의 도선에 전류가 흐를 때 도선이 받는 힘의 방향을 알려 줍니다. 전동기의 회전 방향을 알 때 씁니다."}},{"q":"교류 발전기에서 유도 전압이 발생되는 구성 부품은?","o":["로터","회전자","계자코일","스테이터"],"a":3,"e":{"w":["로터는 자기장을 만드는 회전 부분입니다.","회전자도 자기장을 만드는 부분입니다.","계자코일은 자기장을 만드는 코일입니다."],"d":"교류 발전기에서는 자석인 로터가 돌면서 고정된 스테이터 코일을 지나갑니다. 이때 스테이터 코일에 전압이 유도되어 전기가 만들어집니다."}},{"q":"바이크 납산 배터리의 자기방전에 대한 설명으로 틀린 것은?","o":["양극판은 과산화납으로 음극판은 해면상납으로 변하면서 방전된다.","전해액 중에 불순물이 혼입되어 국부 전지가 형성되었을 때 방전된다.","탈락한 작용물질이 극판의 아랫부분이나 측면에 퇴적되었을 때 방전된다.","배터리 케이스의 표면에 부착된 전해액이나 먼지 등에 의한 누전으로 방전된다."],"a":0,"e":{"w":["불순물이 섞여 국부 전지가 생기면 자기방전됩니다. 옳은 설명입니다.","떨어진 작용물질이 쌓여 극판이 서로 이어지면 방전됩니다. 옳은 설명입니다.","케이스 표면의 전해액이나 먼지로 누전되어 방전됩니다. 옳은 설명입니다."],"d":"양극판이 과산화납, 음극판이 해면상납으로 되는 것은 충전될 때의 변화입니다. 방전될 때는 두 극판이 모두 황산납으로 변하므로 ①이 틀린 설명입니다."}},{"q":"내연기관 이륜자동차의 점화장치에서 스파크 플러그가 하는 역할은?","o":["엔진의 온도를 조절한다.","혼합 가스에 불꽃을 튀겨 점화시킨다.","엔진 오일에 불꽃을 튀겨 점화시킨다.","배터리를 충전한다."],"a":1,"e":{"w":["온도를 조절하는 부품이 아닙니다.","엔진 오일이 아니라 혼합 가스에 점화합니다.","충전은 충전장치가 합니다."],"d":"스파크 플러그는 점화코일에서 온 높은 전압으로 전극 사이에 불꽃을 튀겨 압축된 혼합 가스에 불을 붙입니다."}},{"q":"이륜자동차의 헤드라이트가 작동하지 않을 때, 가장 먼저 점검해야 할 부품은?","o":["브레이크 스위치","방향지시등 릴레이","헤드라이트 전구 또는 퓨즈","비상등 스위치"],"a":2,"e":{"w":["브레이크 스위치는 제동등과 관계가 있습니다.","방향지시등 릴레이는 방향지시등용입니다.","비상등 스위치는 관계가 없습니다."],"d":"헤드라이트가 켜지지 않으면 가장 고장 나기 쉬운 전구가 끊어졌는지, 퓨즈가 끊어졌는지부터 확인합니다."}},{"q":"전기 배선에 대한 설명으로 틀린 것은?","o":["배선의 지름이 증가하면 저항값은 줄어든다.","배선의 길이가 2배로 증가하면 저항값도 2배로 증가한다.","배선의 지름을 2배로 증가시키면 저항값은 1로 감소한다.","보통의 금속(구리)은 일반적으로 온도 상승에 따라 저항도 증가한다."],"a":2,"e":{"w":["지름이 커지면 단면적이 커져 저항이 줄어듭니다. 옳은 설명입니다.","저항은 길이에 비례하므로 길이가 2배면 저항도 2배입니다. 옳은 설명입니다.","금속은 온도가 오르면 저항도 커집니다. 옳은 설명입니다."],"d":"저항은 단면적에 반비례합니다. 지름이 2배가 되면 단면적은 4배가 되므로 저항은 1/4로 줄어듭니다. ③의 설명은 틀렸습니다."}},{"q":"전류에 대한 설명으로 틀린 것은?","o":["전기의 흐름이다.","단위는 A를 사용한다.","직류와 교류가 있다.","저항과 항상 비례한다."],"a":3,"e":{"w":["전류는 전기의 흐름입니다. 옳은 설명입니다.","전류의 단위는 암페어(A)입니다. 옳은 설명입니다.","전류에는 직류와 교류가 있습니다. 옳은 설명입니다."],"d":"옴의 법칙(I = V ÷ R)에 따라 전류는 전압에 비례하고 저항에 반비례합니다. 저항과 비례한다는 ④가
